rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Systematic search with explicit inclusion criteria (mean age 8-18, general-population samples), separate random- and fixed-effects models for three exposures, pre-specified moderator set, and heterogeneity reported for every cell. Fundamental limitation: every constituent study is CORRELATIONAL, so none of these estimates is causal and all are open to confounding by socioeconomic status, parental involvement, mental health, and screen use - the review does not adjust for any of these. Sleep and school performance were both mostly self- or parent-reported in the included studies, and the review's own moderator analysis shows the association is LARGER when measurement is subjective, which is the signature of shared-method bias inflating the estimate. Publication bias was not formally assessed with trim-and-fill (unlike astill2012 and lundahl2015). Heterogeneity remained significant in most models after moderators."
funding: "Not stated in the retrieved text."
notes: |
  THE BEST-POWERED ACADEMIC-OUTCOME ESTIMATE in the 8-18 age band, and the only one in my shard whose age range actually
  includes the target subject at the top end. It independently reproduces the astill2012 school-performance cell almost
  exactly - Dewald r = 0.069 (k = 17, N = 15,199) vs Astill r = 0.09 (k = 20, N = 21,157), from partly overlapping primary
  literature. Two meta-analyses converging on r = 0.07-0.09 for habitual sleep duration and grades is about as solid as the
  observational youth literature gets.

  MAGNITUDE IN PLAIN TERMS. r = 0.069 is small: sleep duration accounts for under half a percent of the variance in school
  performance. If read as a standardized slope per SD of sleep duration, and taking an adolescent weekday-sleep SD of roughly
  1 h, one extra hour of habitual sleep is worth about 0.07 SD of school performance. On an IQ-like scale that is about 1 point
  per hour, and even that requires the assumption that a grades composite is fully g-loaded, which it certainly is not.
  IMPORTANT HONESTY FLAG: I could NOT retrieve a citable g-loading for an academic-achievement composite, so
  iq_conversion_basis.md row E explicitly DECLINES to convert grades into IQ points at all. Do not read "about 1 point per
  hour" above as a licensed IQ conversion - it is an unadjusted ceiling that assumes a g-loading of 1.0, and the true figure is
  necessarily smaller by whatever the achievement g-loading turns out to be. The defensible statement is: UNDER 1
  IQ-equivalent point per habitual hour, cross-sectionally, uncorrected for confounding, with no lower bound established.

  THE AGE MODERATOR RUNS OPPOSITE TO LUNDAHL 2015 AND THIS IS THE MOST IMPORTANT THING IN THE RECORD. Dewald finds the
  sleep/school association is LARGER in YOUNGER samples and attenuates with age, and interprets that as maturational: "with
  maturation adolescents experience a decrease in sensitivity to sleep deprivation and extended wakefulness". Lundahl 2015
  found the opposite sign in experimental data (older youth MORE impaired). campbell2024, the best-designed test of the
  question, found NO age interaction from 9.9 to 22.8 y. THREE STUDIES, THREE ANSWERS. The pooler should therefore treat the
  age-moderation of sleep-loss effects as UNRESOLVED and widen uncertainty on any age-transported effect rather than applying a
  directional correction. My own reading is that Dewald's age moderator is the weakest of the three because it is a
  between-study meta-regression on correlational data where sample age is confounded with grade-level measurement, the range of
  achievement measures, and the amount of unmeasured autonomy over bedtime.

  n = 19,530 in the header is the LARGEST single cell (sleepiness), not an unduplicated total across the three meta-analyses;
  the three cells (13,631 / 15,199 / 19,530) overlap heavily since most studies contributed to more than one. n_studies_pooled
  = 50 is likewise the sum across cells (16 + 17 + 17) and double-counts. The paper does not report an unduplicated total.

  SLEEPINESS BEATS DURATION, ROUGHLY 2:1 (r = -0.133 vs 0.069). That ordering recurs across my shard - fjell2023 found
  sleepiness and sleep problems more related to brain structure than duration was, and kyle2017 found insomnia symptoms
  comparable to short duration. For the target subject, whose exposure is defined in HOURS, this means duration-based estimates
  will UNDERSTATE the total burden of his sleep pattern if that pattern also produces daytime sleepiness, which at 5-6 h on
  weekdays it almost certainly does.
