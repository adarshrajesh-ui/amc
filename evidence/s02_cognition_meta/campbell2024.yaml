rob:
  tool: RoB2
  judgement: low
  notes: "Within-subject dose-response design with each participant completing all three TIB conditions annually, order counterbalanced, actigraphy/PSG-verified sleep duration, mixed-effects models with subject random effects. No blinding is possible for a sleep manipulation and none was attempted. The older cohort was interrupted by COVID (only 25 of 82 completed multiple years), which weakens the longitudinal but not the within-year TIB contrast. Healthy, screened, single-site volunteers, so the usual volunteer-selection caveat applies. The main analytic limitation for this pipeline is that the paper reports F statistics and raw model estimates rather than standardized effect sizes, and never reports between-subject SDs for the AX-CPT d' indices, so most of its outcomes cannot be converted to Hedges' g."
funding: "NIH (grant support stated in the paper); see the article for the full statement."
notes: |
  THIS IS THE SINGLE BEST AGE-MATCHED EXPERIMENTAL RECORD IN MY DOMAIN and it should dominate the youth-experimental part of the
  pool. Age range 9.9-22.8 y brackets the target subject (18 y) exactly; the older cohort alone is 15-22.8 y. It is a
  within-subject DOSE-RESPONSE design (7 vs 8.5 vs 10 h TIB, 4 consecutive nights each), which is the design the downstream
  model needs and which essentially nothing else in the adolescent literature provides.

  FOUR FINDINGS THAT MATTER MOST:

  (1) DOSE-RESPONSE IS GRADED AND CONVEX FOR VIGILANCE. PVT LSNR fell 0.33 dB going 10 -> 8.5 h and a further 0.44 dB going
  8.5 -> 7 h. Per hour that is -0.220 dB/h then -0.293 dB/h, so the marginal cost of each lost hour RISES as sleep shortens.
  Extrapolating that convexity to the target subject's 5-6 h weekday sleep is not licensed by these data (7 h TIB was the
  shortest condition) but the direction of the extrapolation error is clear: a linear per-hour slope fit in the 7-10 h range
  UNDERSTATES the damage below 7 h.

  (2) THE MATURATION-EQUIVALENT. The age slope on the same measure is +0.20 dB per year across 10-23 y, so the 0.77 dB deficit
  from restricting 10 -> 7 h TIB equals 3.85 years (95% CI 2.4 to 5.3) of adolescent brain maturation on vigilant attention.
  This is the SAME KIND of statement that wild2018 makes for adults with age-slope conversion and that sadeh2003 asserted
  qualitatively ("similar to those gained by 2 years of development"). It is the best-quantified version that exists in the
  right age band. CAUTION FOR THE DOWNSTREAM MODEL: "years of maturation" on a PVT is NOT "years of IQ" - see
  iq_conversion_basis.md. The PVT is the LEAST g-loaded measure in this whole shard.

  (3) WORKING MEMORY WAS NOT IMPAIRED. The Sternberg search-rate slope, the recency effect, and the serial-position accuracy
  profile were all unaffected by TIB (F(2,729) = 0.68, p = .51 for the slope). This is a REAL and important dissociation: in
  the age group that matters, 4 nights of 7 h TIB moved vigilance a lot and working memory not at all. It agrees in direction
  with lim2010 (working memory g much smaller than simple-attention g) and it directly contradicts any model that treats a
  vigilance decrement as a general cognitive decrement.

  (4) NO TIB-BY-AGE INTERACTION ANYWHERE (p > .48 for all AX-CPT indices; p = .34 for PVT LSNR; the 8.5-vs-10 h contrast was
  significant even in the oldest quartile, p = .034). Two consequences. First, sleep need for these functions does NOT decline
  across adolescence into the early twenties, so a 18-year-old cannot be assumed to have "grown out of" needing 8.5-9 h.
  Second, and this is the transportability licence the pooler needs: effects measured in the 10-16 y cohort can be carried to
  an 18-year-old without an age discount, because the interaction is null.

  A FIFTH POINT THAT CUTS THE OTHER WAY and must be reported honestly: because maturation improves PVT performance so steeply,
  the authors observe that "vigilant attention in older teens and young adults restricted to 7 hours TIB exceeds the vigilant
  attention in well-rested younger participants with 10 hours TIB." So in ABSOLUTE terms a sleep-restricted 18-year-old still
  outperforms a rested 11-year-old. The deficit is real and is measured against the subject's own potential, not against a
  floor of dysfunction.

  ALSO: 8.5 h OF TIB APPEARED SUFFICIENT for top-down attentional control and cognitive flexibility (no index improved from 8.5
  to 10 h, and the authors argue this is not merely a power failure), but NOT sufficient for the PVT, which kept improving out
  to 10 h TIB in every age quartile. So the "optimum" depends on the measure: ~8.5 h TIB for executive measures, >10 h TIB for
  vigilance. Given 8.5 h TIB yielded 470 min = 7.8 h of actual sleep, the executive-sufficiency threshold in TST terms is
  around 7.8 h.

  EXPOSURE FIDELITY, which the pooler should propagate: 3 h less TIB produced only 2.07 h less TST (69% pass-through). Studies
  that label their exposure in TIB are therefore delivering a milder TST contrast than the label implies.

  WHAT I COULD NOT EXTRACT: no standardized effect sizes, no group SDs for the AX-CPT d' indices, and no dB-scale SD for LSNR,
  so I cannot convert any of the attention/flexibility outcomes to Hedges' g. The X-probe row above carries an F statistic in
  the value field with se: null specifically so that no downstream process mistakes it for an effect size. If the pooler needs
  a g for adolescent attentional control it must come from lundahl2015 (g = -0.19 to -0.37) or lo2016, not from here.
