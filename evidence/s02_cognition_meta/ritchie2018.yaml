rob:
  tool: ROBINS-I
  judgement: low
  notes: "Meta-analysis restricted to QUASI-EXPERIMENTAL designs with plausible causal identification - control-for-prior-intelligence, compulsory-schooling instrumental variables, and school-entry regression discontinuity - rather than raw correlations, across 142 effect sizes from 42 datasets and over 600,000 participants. Pre-registered analysis plan, published and unpublished sources both included (86:22 published:unpublished), moderator analyses for age, time lag, outcome type, and design. Main residual concerns: (1) the three designs disagree by more than fourfold (1.197 vs 2.056 vs 5.229 points), which the authors themselves show is statistically significant, so the 'true' exchange rate depends on which design you believe; (2) the school-age-cutoff design partly measures test-timing rather than durable ability; (3) this is a COMPARATOR record for scaling, not sleep evidence, so its risk of bias matters only for the benchmark's credibility."
funding: "See the article; Ritchie was supported by a UK Medical Research Council grant and Tucker-Drob by NIH."
notes: |
  THIS RECORD CONTAINS NO SLEEP EVIDENCE. It is here as a CALIBRATION BENCHMARK so that the downstream model, and any human
  reading its output, can tell whether an IQ-point estimate is large or small. Without a benchmark, "2.4 IQ points" is an
  uninterpretable number.

  THE EXCHANGE RATE: one additional year of education is worth about 1.2 IQ points when prior intelligence is controlled
  (SE 0.203), about 2.1 points when instrumented by compulsory-schooling reforms, and about 3.4 points pooling all designs. I
  recommend the pooler use 1.2 points per year of education as the benchmark, because (a) that design conditions on prior
  ability and so isolates the schooling increment in the same way an ideal sleep study would isolate the sleep increment, and
  (b) the pooled 3.4-point figure is inflated by the school-entry-cutoff design (5.2 points), which compares children tested at
  the same age but with different amounts of schooling and therefore captures test-timing and practice effects along with real
  ability gains.

  WHAT THIS MEANS FOR THE SLEEP ESTIMATES IN THIS SHARD. Using 1.2 IQ points per school year:

    fjell2023 habitual short sleep, -2.4 to -2.9 IQ points   ~ 2.0 to 2.4 years of schooling
    wild2018 reasoning at 4 h vs optimum, -2.4 IQ points     ~ 2.0 years of schooling
    acute total SD, 1.5 to 4.0 IQ points (iq_conversion_basis) ~ 1.3 to 3.3 years of schooling
    the target subject's plausible chronic effect, 2-3 points ~ 1.7 to 2.5 years of schooling

  So the honest headline for a downstream report is that three years of habitual 5-6 h sleep plausibly costs, in
  IQ-equivalent terms, something on the order of TWO YEARS OF SCHOOLING. That is a substantial number and it does NOT depend on
  the vigilance-to-IQ conversion being generous - it comes from the direct general-ability measurements in fjell2023 and
  wild2018, which need no discount at all.

  THE SYMMETRY IS WORTH STATING EXPLICITLY BECAUSE IT IS UNCOMFORTABLE: the subject is, during these three years, receiving
  education, which raises measured intelligence by roughly 1.2 points per year. If chronic short sleep costs 2-3 points over
  the same period, then sleep restriction is offsetting roughly two of the three years of cognitive benefit that the schooling
  itself is delivering. That framing is the most decision-relevant thing this comparator enables, and it is also the framing
  most likely to be over-claimed, so I want the caveat attached: the fjell2023 and wild2018 numbers are CROSS-SECTIONAL
  associations in adults, not causal estimates in adolescents, whereas the 1.2-point education figure IS quasi-experimental.
  The two sides of the comparison are not of equal evidential quality, and the sleep side is the weaker one.

  ONE MORE USE: the age moderator (-0.024 IQ points per year of earlier-test age, p = .706, flat from age 10 to 16) confirms the
  benchmark is age-stable across adolescence, so applying it at 18 is not an extrapolation of a moving target.

  n = 615,812 is the figure the paper states directly ("three designs was 615,812"), consistent with the abstract's "over
  600,000 participants". The paper notes that Ns for datasets contributing multiple effect sizes were averaged across effect
  sizes and rounded, so it is approximate and should not be used as an analytic weight. n_studies_pooled = 42 is the number of
  DATASETS; there were 142 effect sizes.
