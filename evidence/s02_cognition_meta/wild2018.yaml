rob:
  tool: ROBINS-I
  judgement: high
  notes: "Cross-sectional, self-reported exposure, self-selected internet volunteers recruited by Facebook/Twitter advertising, no objective sleep measurement, education/anxiety/depression adjusted only as coarse categorical variables, no adjustment for shift work, medication, caffeine, or physical health. Authors state the causal limitation explicitly. Confounding by reverse causation (poor cognition/mental health causing atypical reported sleep) is plausible and only partly addressed. Two mitigations are worth crediting: a sensitivity analysis restricted to +/-1.5 SD of mean sleep gave the same pattern, and the DOMAIN-SPECIFIC pattern (reasoning and verbal affected, STM not) rules out any confounder that would act uniformly across all tests."
funding: "Not extracted from the record."
notes: |
  THE 'YEARS OF AGEING' DELIVERABLE. The paper's headline is: "In terms of overall cognition, a self-reported typical
  sleep duration of 4 hours per night was equivalent to aging 8 years", restated in the Discussion as "For those who slept
  even less - four hours per night - the impairment was equivalent to adding almost 8 years to their age."
  CRITICAL AUDIT POINT FOR THE DOWNSTREAM MODEL: that "8 years" is NOT an IQ-scale statement and is NOT a longitudinal
  ageing statement. It is produced entirely inside this study by dividing the sleep-related decrement in the CBS overall
  composite by this study's own CROSS-SECTIONAL age slope on the same composite (-0.033 SD per year). Any figure of the
  form "X hours of sleep loss = Y years of ageing" therefore inherits (a) the cross-sectional age gradient of a
  self-selected internet sample, and (b) whichever composite was chosen. The choice of composite changes the answer by a
  factor of TWO: the same 0.20 SD decrement is "9.04 years" on reasoning but "17.0 years" on verbal, purely because verbal
  ability declines more slowly with age. The paper contains no statement in IQ units.

  SHAPE OF THE RELATIONSHIP (tasked question): inverted U, confirmed. Quadratic term negative and significant for reasoning
  (LR = 36.99, p_adj < 0.001), verbal (LR = 22.40) and overall (LR = 51.38); NOT significant for short-term memory
  (LR = 2.03, p = 0.154, BF01 = 37.7). Optimum 7.16-7.44 h depending on domain, ~7.38 h overall. Age-invariant: the
  Age x typical-sleep-duration interaction was null for every composite (BF01 > 1000 for all four), so the optimum does not
  move with age within 18-100 y.

  DECREMENT AT 5-6 H (tasked question), derived by me from the published coefficients and tabulated here for the pooler:
    hours   overall     reasoning   verbal      (SD below the respective optimum)
    4.0     -0.266      -0.201      -0.206
    5.0     -0.132      -0.094      -0.105
    5.5     -0.083      -0.056      -0.067
    6.0     -0.045      -0.027      -0.037
    6.5     -0.019      -0.009      -0.016
    7.0     -0.004      -0.001      -0.004
  So a habitual 5-6 h sleeper sits 0.045-0.132 SD below peak on the overall composite, about one third to one half of the
  4-h decrement, and the curve is strongly non-linear: the marginal cost of the hour from 5 to 4 is roughly three times the
  cost of the hour from 6 to 5. In this study's own ageing metric, 5.5 h corresponds to about 2.5 years of ageing on both
  the overall and the reasoning composite, NOT 8 years.

  APPLICABILITY WARNING: mean age 41.7 y (SD 14.3) and the authors state "We also cannot conclude that these results apply
  to children and adolescents, given that they were not included in the study." Set adolescent_match to poor_midlife.
  Self-report bias direction is stated by the authors to inflate the estimated effect: "people tended to over-report how
  much they actually slept, and that over-report was greater for people who actually slept less. If this were the case in
  our study, then our results would slightly overestimate the size of the sleep-related effect on cognition and the optimal
  amount of sleep."

  BATTERY STRUCTURE (relevant to the IQ conversion, see iq_conversion_basis.md): the composites are not a single g. The 12
  tests were projected onto "the 12 x 3 matrix of varimax-rotated principal component weights (i.e. factor loadings) from
  Hampshire et al." - i.e. three separable components (STM, reasoning, verbal), and the "overall" score is a simple average
  of 12 z-scores rather than a g factor score. Because one of the three components (STM) is demonstrably UNRELATED to sleep
  duration, the overall composite understates the reasoning/verbal effect and cannot be read as an IQ-equivalent SD.

  Sample construction: 40,105 registered, 16,812 completed everything, exclusions for age <18 or >100 (1,175), sleep 0 or
  >16 h (514), missing data (3,853), score outliers (54 + 242), leaving 10,886 (6,797 female, 4,013 male, 76 other).
  Reported mean typical sleep 6.42 h (SD 1.28); mean sleep the night before testing 6.88 h (SD 1.67).
