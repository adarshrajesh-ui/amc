rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "Cross-sectional; self-reported categorical sleep duration; short-sleep result does not replicate across the paper's own two cohorts. Sleep duration was categorized <7 / 7-9 / >9 h so no per-hour slope is estimable. Same brief unvalidated UK Biobank touchscreen battery as kyle2017, and Cohort 2 lacks the Fluid Intelligence test entirely. Education is NOT in the adjustment set (unlike kyle2017), so these estimates are less confounder-adjusted than kyle2017's on the strongest single confounder of cognitive test performance. Cook's distance flagged 5.93% / 4.83% of points as outliers and they were retained. The two cohorts are drawn from the same biobank and must not be pooled as independent evidence with kyle2017."
funding: "Not stated in the retrieved text; BMJ Public Health open access."
notes: |
  HEAVILY OVERLAPPING SAMPLE WITH kyle2017 - both are UK Biobank. cohort_family is set to UK_Biobank on every effect so
  the pooler can collapse them. kyle2017 has ~4-17x the analytic n per outcome and adjusts for education, so if only one
  UK Biobank record is to be used, use kyle2017 and treat west2024 as a sensitivity check.

  n is recorded as 26,820 = the sum of the two analysis cohorts (10,067 + 16,753) described in Table 1: "Cohort 1
  contained 10 067 participants who undertook four cognitive tests (Fluid Intelligence, Prospective Memory, Paired
  Associated Learning, and Reaction Time). Cohort 2 contained 16 753 participants who undertook two cognitive tests only
  (Paired Associated Learning and Reaction Time)." The cohorts are analysed separately, so each effect above applies to
  one cohort's n, not to the sum.

  DISCREPANCY TO REPORT: the abstract gives the Cohort 1 normal-sleep CI as "95% CI 0.0284 to 0.0851" and the Cohort 1
  long-sleep CI as "-0.2938 to -0.0822", whereas Table 2 gives 0.0292 to 0.0842 and -0.2797 to -0.0963 respectively. I
  have used the Table 2 values because they come with the matching SEs. The differences do not change any inference.

  SHAPE OF THE RELATIONSHIP: "For Cohort 1, the data show an inverted U-shaped curve, signifying optimal cognitive
  function among individuals reporting 6-9 hours of sleep, with performance diminishing among those with shorter or longer
  sleep durations. In contrast, Cohort 2 shows a relatively stable cognitive function across individuals sleeping 5-9
  hours." Note that Cohort 1's own optimum plateau starts at SIX hours, which sits inside the subject's weekday 5-6 h
  band; and Cohort 2 finds performance flat from 5 h upward. Neither cohort supports a steep penalty in the 5-6 h range
  in midlife.

  "YEARS OF AGEING" EQUIVALENT (derived by me, not stated by the authors): the short-sleep penalty divided by the age
  slope is 0.0567/0.0177 = 3.2 years in Cohort 1 and 0.0052/0.0264 = 0.2 years in Cohort 2. The 15-fold spread between
  the two cohorts of the same biobank is the honest uncertainty on any such statement. This is an age-equivalence, NOT an
  IQ-point statement; see iq_conversion_basis.md.

  The largest coefficient in the whole model is not a sleep variable: never/occasional alcohol consumption carries
  beta = -0.2971 relative to daily drinkers, which is 5x the short-sleep penalty and is obviously not a causal effect of
  abstinence. That is the clearest available illustration of how much residual confounding lives in this design.
