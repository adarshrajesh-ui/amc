rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "Cross-sectional, so no causal direction. Exposure is a single self-reported whole-number hours question ('About how many hours sleep do you get in every 24 hours?'), which is categorized rather than continuous, so no per-hour slope is estimable and the <7 h bin lumps 6 h with 3 h sleepers. Outcome battery is unvalidated and brief: authors concede 'our cognitive dependent variables were created for brief completion on large numbers of participants and hence have not undergone formal validation' and 'tasks were brief and did not parametrically manipulate cognitive load'. Reasoning test Cronbach alpha only 0.62; visual memory retest ICC only 0.16. UK Biobank is a healthy-volunteer-biased sample. Adjustment set includes education and SES, which are plausibly mediators as well as confounders of a habitual-sleep-to-cognition path, so these estimates may be over-adjusted."
funding: "Kyle supported by a UK Medical Research Council Fellowship (MR/K021177/1); UK Biobank application 6818. Full author funding list in the paper."
notes: |
  THE STANDARDIZATION IS INTERNALLY VALIDATED, which is the reason this record is trustworthy despite the raw betas being
  in unlabelled test units. The paper states its own SD-unit conversions for a different contrast: "The apparent small, but
  statistical advantage of those with insomnia versus those without was unexpected and is unlikely to be clinically
  meaningful [note, effect size differences in SD units = .044 (reasoning), .035 (reaction time) and .022 (visual
  memory)]." Dividing the matching Table 2 model-4 betas by the Lyall 2016 baseline SDs reproduces all three exactly:
    reasoning       0.095 / 2.16 = 0.0440  vs stated .044
    reaction time   0.0067 / 0.19 = 0.0353 vs stated .035
    visual memory   0.014 / 0.66 = 0.0212  vs stated .022
  So beta/SD_Lyall is the authors' own conversion, applied here to the sleep-duration rows.

  The SE approximation sqrt(1/n1 + 1/n2) is likewise checked against the reported p-values and reproduces them closely
  (numeric memory implied p = 0.0086 vs reported 0.009; visual memory 0.0018 vs 0.002; reasoning 3.6e-24 vs "< 10^-24").

  MAGNITUDE, FOR THE DOWNSTREAM POOLER: the habitual short-sleep reasoning decrement here is g = -0.069, i.e. about
  1.0 full-scale IQ point if one were willing to treat the 13-item verbal-numerical reasoning test as a fully g-loaded
  measure (it is not; see iq_conversion_basis.md - its first-unrotated-PC loading is 0.774 in Lyall 2016, so the
  g-attributable part is nearer 0.069 * 0.774 * 15 = 0.8 points). This is roughly 18x SMALLER than the acute total-SD
  vigilance effect in lim2010 (g = -0.762) and ~5x smaller than lim2010's reasoning cell (g = -0.125). Two reasons the
  pooler should not treat this as the causal effect of the subject's 5-6 h weekday schedule: (1) the <7 h bin is not a
  5-6 h exposure, and (2) LONG sleep shows a much larger decrement (g = -0.296) in the identical model, the classic
  signature of reverse causation and residual ill-health confounding rather than a sleep-loss dose-response.

  Group sizes used for the SE arithmetic come from the Results text: "73.7% of the sample reported sleep duration between
  7 and 9 hours, 24.6% reported sleep duration <7 hours, while 1.7% reported sleep duration >9 hours."
  Analytic n differs per outcome (Table 3 header): reasoning 115,668; reaction time 332,303; numeric memory 34,753;
  visual memory 333,966; prospective memory 117,438. The header n = 477,529 is the screened cohort, not the analytic n
  for any single outcome.

  pct_female is computed from the two subgroups reported in the Methods (133,314 with insomnia symptoms at 62.1% female
  and 344,215 without at 52.0% female): (0.621*133314 + 0.520*344215)/477529 = 54.8%.

  The headline finding of the paper is about insomnia, not sleep duration, and it is negative/reversed: "In our large UK
  sample frequent insomnia symptoms were not independently associated with cognitive impairment." The sleep-duration
  result is a secondary aim: "Both short (<7 hrs) and long (>9 hrs) sleep duration were associated with poorer
  performance on the reasoning test, basic reaction time test, numeric memory test, visual memory test, and prospective
  memory test."
