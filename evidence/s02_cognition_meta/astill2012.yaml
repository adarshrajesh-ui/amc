rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Large, systematic, century-spanning search with dual independent coding (92% agreement), hierarchical within-study meta-analyses to enforce independence of effect sizes, explicit outlier screening and Winsorization, and trim-and-fill publication-bias adjustment. Serious limitations for our purpose: (1) the constituent studies are overwhelmingly cross-sectional and observational, so nothing here is causal - the authors say so explicitly; (2) 85% rather than 95% CIs are used throughout, which makes the paper's own significance calls more permissive than conventional and is easy to misread; (3) studies reporting only 'nonsignificant' with no statistics were assigned a conservative null at p = .50, which biases pooled estimates toward zero; (4) the subdomain cells that matter most for us (intelligence k = 6, n = 787) are small; (5) age range 5-12 excludes adolescents entirely."
funding: "Netherlands Organization for Scientific Research (NWO) and the European Research Council; full statement in the paper."
notes: |
  THIS IS THE STRONGEST CHILD-SPECIFIC EVIDENCE THAT SLEEP DURATION IS NOT ASSOCIATED WITH MEASURED INTELLIGENCE, and it
  matters for the IQ conversion because it is the one place where a large child literature was pooled with intelligence as
  its own subdomain. But the null must be read honestly and I want to be precise about what it does and does not say:

  The intelligence point estimate is r = .10, which is the JOINT LARGEST of all eight cognitive subdomains - tied with
  multiple-domain cognition and above executive functioning (.07) and school performance (.09). It fails conventional
  significance only because k = 6 and n = 787. So this is an UNDERPOWERED NEAR-MISS (p = .08), not a demonstrated absence
  of association. Anyone citing "sleep duration is not related to intelligence in children" from this paper is
  over-reading it. What the paper does license is the weaker and still useful claim that the intelligence association is
  NOT LARGER than the associations for other domains, and that r = .10 is the upper end of what a cross-sectional child
  literature supports.

  Converted to the shard's IQ scale, r = .10 across the observed range of child sleep durations is small. If one crudely
  treats r as a standardized slope per SD of sleep duration and takes a child-sleep SD of roughly 0.8-1.0 h, then a 1 h
  sleep difference corresponds to about 0.10 SD of intelligence = 1.5 IQ points, with a 95% CI spanning roughly -0.1 to
  +3.1 points. That is a cross-sectional gradient, not a causal effect, and it should be treated as an upper bound.

  THE OTHER FINDING THE POOLER MUST NOT MISS: sustained attention, which is the most sleep-sensitive domain in adults by a
  wide margin (lim2010 g = -0.762), is essentially UNRELATED to habitual sleep duration in children (r = .02, k = 15).
  The authors flag this reversal themselves and it is the reason the adult vigilance literature cannot be transported to a
  young sample without an explicit discount: "Quite unlike typical findings in adults, sleep duration was not associated
  with sustained attention and memory. Methodological issues and brain developmental immaturities are proposed to underlie
  the marked differences."

  NO SUBDOMAIN DIFFERED SIGNIFICANTLY FROM ANY OTHER: "The 85% CIs overlapped; thus, no significant difference between
  cognitive subdomains' relation with sleep could be concluded." So this meta-analysis cannot establish a domain gradient
  in children; it can only fail to find one.

  Publication bias was material for the overall cognition cell: unadjusted r = .08 fell to r = .06 after trim-and-fill.
  The subdomain cells were not separately trim-and-fill adjusted, so the intelligence estimate of .10 is unadjusted and is
  probably optimistic.

  adolescent_match is mixed rather than poor because although the age band (5-12) sits below the target, this is a
  developmental sample rather than a midlife one, and the relevant direction of bias is stated by the authors: effects in
  children may be attenuated by "brain developmental immaturities", implying a young ADULT would if anything be more
  affected than these children. That cuts against transporting the null downward in age but for the target subject at 18
  it means this record should be weighted lightly relative to lo2016 and campbell2024.
