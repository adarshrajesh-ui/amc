rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomized allocation to extension vs restriction with objective actigraphic verification and a within-child baseline-vs-intervention design, which is strong for 2003. BUT the analysed groups are NOT the randomized groups: the authors re-classified children into extension / no-change / restriction according to whether they actually achieved a >=30 min change, which breaks randomization and makes the comparison partly observational (compliance is plausibly correlated with family functioning and baseline sleep). Blinding was impossible. No correction for multiple outcomes across a 7-measure battery; 3 of 7 measures reached p < .05, which is above chance but not by a wide margin. Change-score SDs are not published, so every SE I report rests on an assumed pre-post correlation. Small arms (n = 21 and 28)."
funding: "Not stated in the retrieved text."
notes: |
  THE ORIGIN OF THE "YEARS OF DEVELOPMENT" FRAMING, and this is why the record matters beyond its own effect sizes. Sadeh et al.
  benchmarked their manipulation against the age difference between 4th and 6th graders measured on the same battery in the same
  sample, and concluded: "For better appreciation of the size of the manipulation effects, it should be noted that the size of
  the differential effect of the extension-restriction manipulation on the NES measures was larger than or similar to the highly
  significant age differences between the fourth- and sixth-grade students on these measures. It could be interpreted that the
  manipulation effects on these neurobehavioral functions are similar to those gained by 2 years of development."

  So the claim is: a 1.27 h achieved difference in sleep, sustained 3 nights, moves this battery about as much as 2 years of
  childhood development. That is a QUALITATIVE claim in the original - the authors report the age F values (digit forward
  F(1,60) = 16.90; CPT RT F(1,60) = 12.79; simple RT F(1,60) = 6.82) but never divide one estimate by the other. I did not
  fabricate a ratio for them. The quantified analogue in the right age band is campbell2024, which does the division properly:
  3.85 y (95% CI 2.4-5.3) of adolescent maturation for a 3 h TIB reduction on PVT LSNR, i.e. ~1.28 y per hour of TIB. Sadeh's
  ~2 y for ~1.27 h and Campbell's ~1.6 y for 1.27 h are the same order of magnitude, from independent samples, decades apart,
  which is a genuine and non-trivial convergence.

  DOMAIN PATTERN: the significant effects were on forward digit span (short-term memory, g = -0.76), CPT reaction time
  (sustained attention, g = -0.41) and simple reaction time (g = -0.31); the null was backward digit span (working memory,
  g = -0.37 but F = 0.71). Note this is NOT the adult ordering from lim2010, where simple attention lapses dominate and
  short-term memory is mid-pack. With k = 4 outcomes and n ~ 50 per contrast, the ordering here is not reliable.

  WHY I DID NOT REPORT A g FOR THE ACADEMIC OUTCOME: there is none. The paper measures neurobehavioural tests, not grades. The
  authors bridge to academics only by citing an EXTERNAL correlation (Arcia et al. 1991: digit span correlated r = .56 with
  reading and r = .58 with mathematics on the California Achievement Test). That external correlation is a useful g-loading
  datum in its own right and I use it in iq_conversion_basis.md, but it is secondhand within this paper and I have not turned it
  into an effect estimate here.

  ADOLESCENT MATCH IS "mixed", NOT "exact": ages 9.1-12.2 sit well below the target subject at 18. The transportability
  argument is that campbell2024 found NO TIB-by-age interaction from 9.9 to 22.8 y, which licenses carrying child-age
  restriction effects upward. Without that companion finding I would have downgraded this record much harder.

  ONE MORE FINDING WORTH FLAGGING to anyone modelling recovery: sleep restriction IMPROVED objective sleep quality (higher sleep
  percent, more quiet sleep, fewer night wakings) while simultaneously degrading daytime function. Homeostatic compensation
  makes the sleep itself look better on actigraphy at the same time as the cognitive cost is being paid. A model that infers
  "adequate sleep" from good sleep efficiency will therefore get this subject wrong.
