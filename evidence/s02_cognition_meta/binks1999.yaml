rob:
  tool: ROBINS-I
  judgement: high
  notes: "Design is a parallel-group comparison of a sleep-deprived arm against a separately-recruited normally-sleeping control arm, with NO within-subject baseline cognitive testing and NO successful randomization of ability: the deprived arm was 2.7 Shipley IQ points higher at screening. That single confound is larger than any plausible effect the study was looking for, and it points in the direction that would MASK a deprivation deficit. Severely underpowered: n = 61 total gives a minimum detectable effect of d = 0.72 (about 11 IQ points) at 80% power, so it cannot speak to the small decrements that are actually at issue. It also failed to detect the well-established attention deficit (PASAT g = -0.08) that 34-36 h of wakefulness should reliably produce, which means the battery or the timing of testing lacked sensitivity rather than that sleep loss lacked effect. Time of day of testing relative to the circadian nadir is not reported in the extract I retrieved. Effect sizes are my computations from the dissertation's descriptive tables, not published effect sizes."
funding: "Not stated in the retrieved text."
notes: |
  THIS RECORD ANSWERS TASK ITEM 6 - "is measured IQ depressed by acute sleep loss on test day, and by how much" - and the
  answer that the literature actually supports is narrower and less dramatic than the question implies.

  WHAT THIS STUDY SHOWS: after 34-36 h of continuous total sleep deprivation, a WAIS-R short-form full-scale IQ estimate was
  NOT lower than in rested controls. The point estimate is +3.6 IQ points in the deprived group's favour, and 2.7 of those
  points were present at screening before anyone lost sleep. The authors' own ANCOVA, adjusting for screening IQ, gives
  F(1,56) = 0.46, p = .500. Their title states the conclusion: total sleep deprivation "does not selectively impair higher
  cortical functioning".

  WHAT IT DOES NOT SHOW, and I want this to be impossible to misread: it does not show that acute sleep loss is harmless. It is
  underpowered (MDE about 11 IQ points) and it failed its own positive control (no PASAT attention deficit either). The single
  defensible quantitative claim is the LOWER CONFIDENCE BOUND: 34-36 h without sleep does not cost more than about 1.8
  full-scale IQ points on a psychometric IQ short form. That bound is the useful contribution.

  WHY THIS IS THE RIGHT ANSWER ANYWAY, converging from three independent directions:
  (1) lim2010 pooled 70 articles of short-term total sleep deprivation and found REASONING accuracy - the domain closest to
      psychometric g - to be the SMALLEST and only non-significant effect in the entire meta-analysis (g = -0.125, 95% CI
      [-0.27, 0.02]), against g = -0.776 for lapses of simple attention. A 6-fold domain gradient.
  (2) campbell2024, in the target age band, found working memory completely unaffected by 4 nights at 7 h TIB while vigilance
      moved substantially.
  (3) astill2012 pooled the child literature and found intelligence the least-established of eight cognitive subdomains
      (r = 0.10, p = .08, k = 6).
  Independent designs, independent samples, same conclusion: PSYCHOMETRIC ABILITY MEASURES ARE THE MOST SLEEP-RESISTANT
  COGNITIVE OUTCOMES THAT EXIST. A model that converts a vigilance g into IQ points at 1:1 will overstate the IQ effect by
  roughly the ratio of those two numbers.

  IMPORTANT SCOPE LIMIT FOR THE TARGET SUBJECT: this is ACUTE TOTAL deprivation in a laboratory on a single test day, tested
  once. It says nothing about (a) chronic partial restriction over three years, which is the actual exposure, (b) LEARNING -
  the mechanism by which chronic short sleep would plausibly lower a measured ability score is not same-day performance
  decrement but degraded consolidation and reduced effective instruction over years, for which see huang2016 (GRE vocabulary
  cued recall, g = -0.55) and the school-performance records, or (c) high-stakes timed testing under time pressure, which was
  not the format here. The absence of a same-day IQ decrement is entirely compatible with a chronic cumulative cost.

  ACCESS NOTE: the peer-reviewed Sleep 1999 paper is paywalled. Every number above comes from the author's LSU dissertation on
  the same sample (n = 32 control, n = 29 deprived, 34-36 h protocol, WAIS-R short form, PASAT, Booklet Category Test, word
  fluency), which the Sleep abstract matches on design, n, protocol duration, and conclusion. I have set access_tier to
  full_text with secondhand_via naming the dissertation, because the numbers were read from a primary document by the same
  author about the same study, but a checker should know the tables are the dissertation's tables. The four-subtest WAIS-R short
  form used correlates .95 with the full battery per the dissertation's citation of Silverstein (1982), and the dissertation
  reports the WAIS-R short form correlating r = .57 with the Shipley screening IQ in this sample.
