    conversion_formula: "R = g_reasoning / g_lapses = 0.125/0.762 = 0.1640. Delta method assuming independence: SE(R) = R*sqrt((0.072/0.125)^2 + (0.095/0.762)^2) = 0.0967. Using the mean of the two simple-attention cells (lapses -0.762, RT -0.732) instead gives R = 0.167. This ratio is the WITHIN-META-ANALYSIS empirical discount for converting a vigilance effect size into a reasoning/IQ-loaded effect size, and is independent of any external g-loading estimate."
