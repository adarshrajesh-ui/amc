rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Systematic search of 4 databases through Dec 2008 plus hand searches of Sleep and J Sleep Res 1988-2008 plus solicitation of unpublished data from 8 laboratories; dual independent coding with ICC = .798 for study quality; random-effects weighting. Weaknesses: effect sizes were weighted by a study-quality index for which the authors concede there is no gold standard; no funnel plot / Egger test reported; effect sizes not disattenuated for test-retest reliability, so absolute magnitudes are conservative relative to Philibert 2005; only ONE laboratory supplied unpublished data, so publication bias cannot be ruled out."
funding: "Air Force Office of Scientific Research FA9550-05-1-0293 (Lim); NIH NR004281 and NSBRI/NASA NCC 9-58-159 (Dinges)"
notes: |
  Exposure is ACUTE TOTAL sleep deprivation of 24-48 h, not chronic restriction: "A total SD period of 24-48 hr had a
  significant effect in reducing performance for outcomes in all cognitive domains, except for accuracy measures in tasks of
  processing speed (p = .06), as well as accuracy measures on tests of reasoning and crystallized intelligence (p = .08)."
  Directly relevant to the subject's occasional 3-4 h pre-exam nights, and it is the reference standard for the RELATIVE
  ordering of domain sensitivity, but it does NOT speak to the 5-6 h chronic exposure (use lowe2017 / lo2016 / campbell2024
  for that).

  Sample: "The total sample size for the analysis was 1,533, with an average of 21.3 (SD = 11.1) subjects in each study."
  Coverage: "In total, 70 articles and 147 data sets met inclusion criteria... Altogether, 209 aggregated effect sizes and
  5,104 individual effect sizes were calculated from these data sets." The 11 domain x outcome cells recorded above have
  df totalling 209 aggregated effect sizes exactly (17+26+25+37+12+20+26+17+12+5+12 = 209), confirming the k = df+1 reading.
  Inclusion required "healthy adults aged 18 years and older"; no mean age is reported, so adolescent_match is set to
  good_young_adult on the basis that laboratory total-SD protocols are dominated by 18-30 y volunteers, but the downstream
  model should inflate uncertainty on the age match.

  DISCREPANCY TO REPORT: the abstract of the same paper gives "lapses in simple attention: g = -0.776, 95% CI [-0.96,
  -0.60]" whereas Table 2 gives -0.762 [-0.948, -0.576]. I have used the Table 2 values throughout because they carry the
  variance, SE, Q, df and I2 needed downstream. The 0.014 discrepancy is presumably a late revision that was not carried
  into the abstract; it is immaterial at the precision the pooler needs but the pooler should not double-enter both.

  Domain ordering (accuracy/lapses side, most to least affected): simple attention -0.762 > working memory -0.555 >
  complex attention -0.479 > short-term memory recall -0.383 / recognition -0.378 > processing speed -0.245 (ns) >
  reasoning/crystallized -0.125 (ns). Author summary of the gradient: "Overall, average effect sizes appear to fall along a
  continuum, with tasks of greater complexity affected relatively less after total SD."
  Moderators: only hours awake (homeostatic pressure) predicted heterogeneity, and only for accuracy measures
  (b = -0.22, t(98) = -2.43, p = .02; model R2 = .176).
