rob:
  tool: RoB2
  judgement: low
  notes: "Randomized parallel-group allocation with participants blind to group until day 1 ('They were not informed about their grouping until the first day of the 2-w protocol'), residential boarding-school setting giving strong exposure control, actigraphy plus PSG-verified sleep, and a documented control group that held baseline performance. Groups did not differ at baseline on age, sex, BMI, caffeine, nonverbal intelligence, anxiety, depression, chronotype, sleepiness or habitual sleep. Remaining concerns: small n (30 vs 26); blinding of participants to the manipulation is impossible after day 1; effect sizes are reported only as interaction f2 with no SEs or CIs, so no variance is recoverable for the pooler; single-site East Asian high-achieving sample; 3 dropouts plus 1 protocol violation excluded."
funding: "National Medical Research Council Singapore (STaR/0004/2008 and NMRC/STaR/015/2013) and the Far East Organisation."
notes: |
  THE BEST AGE-MATCHED EXPERIMENTAL RECORD IN THIS SHARD, and it is age-matched twice over. First, the participants ARE
  the target age (15-19 y, mean 16.6). Second, and more usefully, the companion paper on the identical cohort (huang2016,
  Table 1) reports their HABITUAL sleep at screening: weekday TST 5.37 +/- 0.73 h and 5.61 +/- 0.86 h in the two arms,
  weekend TST 7.53 +/- 1.14 h and 7.46 +/- 1.10 h. That is a near-exact match to the target subject's stated pattern
  (weekday ~5-6 h, weekend ~7-8 h). So these adolescents entered the lab ALREADY carrying the subject's exposure, and the
  experiment then imposed a further step down to 5 h TIB. The measured effects are therefore effects ON TOP OF the
  subject's baseline, not effects OF it - which means they overstate the incremental harm of the subject's schedule while
  usefully bounding what a further pre-exam restriction would cost him.

  Achieved sleep, not just opportunity: during the manipulation the SR group's TST was "4.57 +/- 0.07 h and 4.82 +/- 0.07 h"
  while the control group was maintained "between 7.99 h and 8.18 h". Baseline TST did not differ between groups
  (SR 6.89 +/- 0.16 h vs control 6.94 +/- 0.11 h, t(53) = 0.25, P = 0.80).

  SCALE WARNING FOR THE POOLER: every cognitive effect in this paper is a Cohen f2 for a group x day INTERACTION, not a
  Hedges' g. There is no valid algebraic route from an interaction f2 over 10 repeated tests to a between-group
  standardized mean difference, and no SEs or CIs are published, so se is null throughout. Use these numbers for the
  ORDERING of domain sensitivity in an age-matched sample, and take magnitudes from lim2010 / lowe2017 / huang2016.

  THE ORDERING IS THE PAYLOAD, and it replicates lim2010's gradient in exactly the target age group:
    PVT lapses (vigilance)        1.48
    mental arithmetic             1.14
    symbol digit / 3-back         0.72 / 0.70
    verbal 1-back                 0.63
    subjective sleepiness         0.50
    SART A' (sustained attention) 0.20
  Working memory sits at 0.63-0.70 against vigilance at 1.48, a ratio of 0.43-0.47. In lim2010 the working-memory-to-
  vigilance g ratio is 0.555/0.762 = 0.73 and the reasoning-to-vigilance ratio is 0.125/0.762 = 0.16. So both studies agree
  that the further a task sits from raw vigilance, the smaller the sleep-loss effect; the age-matched study puts working
  memory nearer the reasoning end than lim2010 does.

  THE CRITICAL GAP: no reasoning, fluid-intelligence or academic-achievement outcome was administered. Raven's Advanced
  Progressive Matrices was given ONCE, at screening, purely to confirm the groups were matched on nonverbal intelligence
  (huang2016 Table 1: RAPM 10.38 +/- 1.06 vs 9.77 +/- 1.98, t = 1.43, P = 0.16). It was not re-administered under
  restriction. So the single best age-matched experiment in the literature CANNOT tell us whether the subject's IQ score
  would be depressed, only that his vigilance and working memory would be.

  pct_female derived from "56 participants (25 males)": (56-25)/56 = 55.4%.
