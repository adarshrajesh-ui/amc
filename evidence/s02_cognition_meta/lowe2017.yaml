notes: |
  MOST DECISION-RELEVANT META-ANALYSIS IN THIS SHARD for the subject's exposure, because unlike lim2010 the exposure is
  PARTIAL sleep restriction (sleep shortened below the age-recommended range) rather than total deprivation, and unlike
  lim2010 it spans childhood through old age. Overall g = -0.383 across 1,688 participants and 71 populations.

  ANSWER TO THE TASKED QUESTION "did they separate total deprivation from partial restriction": YES, by design. This
  meta-analysis deliberately EXCLUDED total sleep deprivation and analysed only restriction, positioning itself against
  Lim & Dinges 2010. The rationale is stated verbatim on the publisher's landing page: "Nevertheless, TSD seldom occurs
  outside the context of a sleep laboratory and certain professions (e.g., medical personnel or emergency workers), thus,
  the ecological validity of such experimental protocols remains questionable. Conversely, the impact of sleep restriction
  or partial sleep deprivation on basic and complex cognitive processes has received substantially less attention within
  the literature; sleep restriction refers to sleep durations shortened below the age recommended range." So the
  restriction-vs-deprivation comparison must be made ACROSS lowe2017 and lim2010, not within either.

  Age bands analysed: "children (3-5 years), school-aged children (6-13 years), adolescents (14-17 years), young adults
  (18-30), adults (31-59), older adults (60+)", and "Age group ... [was] a significant moderator of the overall effect".
  The direction and magnitude of that age moderation is exactly what the downstream model needs for a 16-19 y old and is
  the single most valuable number I could NOT retrieve (paywalled). Flagged in station_report.md as the top gap.

  COMPARISON WITH LIM & DINGES 2010 (do not double-count; they share primary studies only minimally because lowe2017
  excludes total SD): partial restriction produces roughly HALF the vigilance effect of acute total deprivation
  (-0.409 vs -0.762) but a similar relative sparing of higher-order abilities. Critically for the IQ conversion, the
  intelligence domain was again undetectable, replicating lim2010's null reasoning/crystallized cell in an independent
  study set with a different (more ecologically relevant) exposure.

  SIGN CONVENTION: all values recorded as negative = harm, matching the paper's own sign convention.
shard: "s02_cognition_meta"
