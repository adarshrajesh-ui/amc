rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Search of PubMed, Scopus, Web of Science and PsycInfo (Nov 2016); random-effects models; 7 pre-specified moderators. RoB rating is downgraded because I could not read the full text: no CIs, no per-domain k, no funnel/Egger results, and no risk-of-bias table are visible from the abstract or the publisher excerpt. Because the pooled effects are entered without SEs, this record must not be given a precision-based weight downstream."
