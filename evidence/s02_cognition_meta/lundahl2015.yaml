rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Genuine meta-analysis of EXPERIMENTAL manipulations only (this is its main strength: every included effect is from a sleep restriction or extension protocol, not a correlation), random-effects pooling, funnel-plot and trim-and-fill bias assessment for every cell, moderator analyses pre-specified in a coding manual. Weaknesses: very small k (13 and 6 samples), extreme heterogeneity in the hyperactivity cell (I2 = 91%), publication bias detected in EVERY cell examined, one included study sampled children with diagnosed ADHD (Gruber et al. 2011) which is a different population, and 'attention' is a heterogeneous composite pooling continuous-performance tasks, PVT-like measures, and rating scales that differ substantially in g-loading. No risk-of-bias assessment of the constituent trials is reported."
funding: "Not stated in the retrieved text."
notes: |
  THE ONLY PUBLISHED META-ANALYSIS OF EXPERIMENTAL sleep restriction restricted to youth, so it is the natural source for the
  youth attention parameter. My recommendation to the pooler, in order of preference:

  1. USE g = -0.26 (95% CI -0.46 to -0.05), the trim-and-fill-adjusted extension-vs-restriction estimate. It spans the full
     manipulated range and it is the only cell that stays significant after bias correction.
  2. The unadjusted -0.37 is the headline number but publication bias was detected and shrank it by 30%.
  3. The restricted-vs-baseline contrast (-0.19 unadjusted, -0.14 adjusted, CI crossing zero) is the WEAKER design because the
     comparator is habitual sleep, which in adolescents is itself frequently insufficient. Using habitual sleep as a "control"
     biases the estimate toward zero. That is exactly the bias structure that matters for the target subject, whose "normal" is
     5-6 h: relative to a genuinely rested state, his deficit is larger than any baseline-referenced study would show.

  THE AGE MODERATOR IS THE MOST TEMPTING AND MOST DANGEROUS NUMBER IN THIS PAPER. b = -0.01 per month of mean sample age
  (Q(1) = 9.75, p < .01) says older youth are MORE impaired, not less. Taken literally, with the subset's mean age at about 127
  months, an 18-year-old (216 months) would have g = -0.37 + (-0.01)(216 - 127) = -1.26. THAT IS NOT CREDIBLE: it exceeds the
  pooled effect of full 24-48 h TOTAL sleep deprivation on lapses of attention in adults (lim2010, g = -0.762) for a
  manipulation of one or two hours. The slope is fit on k = 5 studies spanning mean ages of only 100.68 to 182.40 months and it
  is confounded with era, task battery, and restriction dose across those five studies. I record the moderator because its SIGN
  is decision-relevant - it is direct evidence AGAINST the common assumption that adolescents tolerate sleep loss better than
  children - but I explicitly refuse the linear extrapolation to age 18 and the pooler must not perform it either. The
  independent and much better-powered test of the same question is campbell2024, which found NO TIB-by-age interaction from 9.9
  to 22.8 y (p > .48 for all executive indices, p = .34 for PVT). Between a k = 5 meta-regression and a within-subject
  dose-response study covering the actual target age, prefer Campbell: the honest reading is that the sleep-loss effect is
  approximately AGE-INVARIANT across 9-23 y, with weak and unreliable evidence for amplification with age.

  A SEX MODERATOR was also significant (b = -0.03 per proportion male, p < .05) in the same underpowered k = 5 subset,
  suggesting larger deficits in samples with more males. Same caveats; the target subject is male, so if anything this points
  the same direction as the age moderator, but I would not weight it.

  RELATION TO OTHER RECORDS IN THIS SHARD: this meta-analysis subsumes sadeh2003 and vriend2013 as primary studies, so the
  pooler MUST NOT count lundahl2015 alongside sadeh2003 as independent evidence. I wrote sadeh2003 as a separate record only
  because it carries the "2 years of development" benchmark statement that the meta-analysis does not reproduce. If forced to
  pick one, take lundahl2015 for the effect size and sadeh2003 for the developmental-equivalence framing.

  n = 547 in the header is the sum of the two attention cells (268 + 279), which double-counts children who contributed to
  both contrasts. n_studies_pooled = 19 is likewise the sum of samples across cells (13 + 6). Both are upper bounds; the paper
  does not report a single unduplicated total.
shard: "s02_cognition_meta"
