rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "Cross-sectional for the cognitive outcome (the longitudinal component is MRI only). Exposure is self-reported habitual duration, though a UK Biobank accelerometer subsample validation was run (n = 92 and 274 for the two short-sleep groups) and 'Analyses using accelerometer-estimated sleep duration confirmed the findings'. Authors state the samples 'are not representative of the populations from which they are drawn' and that they 'were not thoroughly screened for sleep disorders such as sleep apnea'. Only 20% of <=6 h sleepers could be classified into the strict groups. GCA is assembled from DIFFERENT test batteries in different subsamples (Cattell Culture Fair in CamCAN, WASI in LCBC, UK Biobank fluid intelligence in UKB, NIH Toolbox tasks in HCP, etc.), so the g-factor is not a single instrument; this is mitigated by the authors extracting a per-sample principal component. Direction of causality explicitly not established by the authors."
funding: "European Union Horizon 2020 Grant 732592 (Lifebrain); European Research Council starting grants 283634, 725025 (Fjell) and 313440 (Walhovd); Research Council of Norway; full list in the paper."
notes: |
  THIS IS THE ANCHOR RECORD FOR THE IQ CONVERSION DELIVERABLE. It supplies a peer-reviewed, top-neuroscience-journal
  precedent for converting a standardized cognitive effect into full-scale-IQ-equivalent points at 15 points per SD, and it
  does so on the ONLY kind of outcome for which that conversion is legitimate: an extracted general factor. The arithmetic
  reproduces exactly (0.16 x 15 = 2.40 -> stated 2.4; 0.19 x 15 = 2.85 -> stated 2.9). See iq_conversion_basis.md.

  The same paper also supplies the counterweight the downstream model needs, in the authors' own words: "However, a
  meta-analysis did not find an effect of sleep deprivation on intelligence and reasoning measures (Lowe et al., 2017),
  which are the tests most similar to the present measures of cognitive function. In addition, most sleep deprivation
  experiments involve rapid and dramatic reductions in sleep duration, unlike natural variations in habitual sleep duration
  between people." So the authors themselves flag that their -2.4 IQ-point cross-sectional association is NOT corroborated
  by the experimental literature on the matched (reasoning/intelligence) outcome. The pooler must not treat -2.4 points as
  a causal effect of short sleep.

  n is recorded as 8694 = the number of classified participants with GCA scores ("General cognitive function (GCA) scores
  were available for 8694 of the classified participants"). The full MRI sample is 47,029 and the fully classified sample
  is 9611; neither is the analytic n for the cognitive effects above.

  pct_female is derived from the only sex breakdown given, which is at the MRI-observation level: "26 811 female/24,509
  male observations" -> 52.2%. Recorded as approximate; it is not specifically the GCA subsample.

  OVERLAP WARNING: this sample INCLUDES UK Biobank, so it partially overlaps kyle2017 and west2024. cohort_family is set
  to Lifebrain_UKB_HCP rather than UK_Biobank to signal partial rather than full overlap; the pooler should down-weight
  rather than drop.

  THE BRAIN-STRUCTURE RESULT MATTERS FOR INTERPRETATION even though it is another shard's domain: short sleepers without
  sleepiness had LARGER, not smaller, regional brain volumes than 7-8 h sleepers (estimate = 0.0067 [CI: 0.0030, 0.0103],
  p < 0.001). A cognitive deficit with no structural correlate, no sleepiness gradient, and no experimental corroboration
  on reasoning measures is most parsimoniously read as confounding or as individual differences in sleep need, which is the
  authors' own conclusion: "some people can cope with less sleep without obvious negative associations with brain
  morphometry".

  Age range 20-89 makes this a poor age match for an 18-year-old. HCP contributes young adults but the bulk of the GCA
  sample is UK Biobank and Lifebrain midlife/elderly participants.
shard: "s02_cognition_meta"
