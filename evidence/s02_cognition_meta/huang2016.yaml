rob:
  tool: RoB2
  judgement: low
  notes: "Same randomized parallel-group protocol as lo2016, so the same strengths: residential control of the exposure, actigraphy, balanced arms, blinding to allocation until day 1. Additional concerns specific to this paper: effect sizes are published only as eta-squared from likelihood-ratio models, so all g values here are my conversions rather than reported values; the outcome is a bespoke GRE-word flashcard task rather than a standardized achievement test; and the primary published finding is the SPACING x TIB interaction, meaning the main TIB effect I converted is an average over a condition where the effect is large and one where it is absent."
funding: "National Medical Research Council Singapore (NMRC/STaR/0015/2013) and the Far East Organisation."
notes: |
  SAME PARTICIPANTS AS lo2016 - DO NOT DOUBLE-COUNT. Both papers report "the Need for Sleep Study": 56 adolescents aged
  15-19, 9 h TIB n = 26 and 5 h TIB n = 30, and this paper cites lo2016 as its ref 22 and ref 55. cohort_family is set to
  Need_for_Sleep_Study in both records. lo2016 carries the attention / working-memory / processing-speed outcomes;
  huang2016 carries the vocabulary-learning outcome. They are complementary outcome sets on one sample, so the pooler
  should treat them as one study contributing multiple correlated effects.

  WHY THIS RECORD MATTERS DESPITE THE WIDE CIs: it is the only age-matched experimental evidence I found for an ACADEMIC,
  exam-relevant outcome under exactly the target exposure. The subject's profile includes "occasional 3-4 h nights before
  exams", i.e. cramming under sleep loss, and this study is a direct test of that: adolescents studied GRE-type vocabulary
  either massed (crammed over one session) or spaced across 4 days, under 5 h vs 9 h TIB.

  THE HEADLINE IS CONDITIONAL, AND THE CONDITION IS ACTIONABLE: "Spaced learning conferred strong resistance to the
  effects of sleep restriction on memory, such that cued recall performance was similar in students exposed to 9 h of TIB
  versus 5 h of TIB." The 5 h penalty on crammed material was significant (Tukey P < 0.01) while the penalty on spaced
  material was not (Tukey P = 0.99). So for the target subject, the estimated harm to learned material depends more on
  whether he spaces his study than on whether he sleeps 5 h or 9 h.

  A review session does not undo it: after re-studying all 40 flashcards once, the massed-item deficit persisted
  (Tukey P < 0.01) and the TIB main effect only fell from eta2 = 0.041 to 0.027.

  CONVERSION ARITHMETIC I PERFORMED, spelled out so it can be checked or rejected:
    d = 2*sqrt(eta2/(1-eta2)); J = 1 - 3/(4*df-1) with df = n1+n2-2 = 54; g = d*J; SE(g) = sqrt(1/n1+1/n2+g^2/(2n)).
    retention TIB   eta2 0.041 -> d 0.4135 -> g 0.408, SE 0.271
    review TIB      eta2 0.027 -> d 0.3332 -> g 0.329, SE 0.270
    spacing x TIB   eta2 0.020 -> d 0.2857 -> g 0.282, SE 0.269
  The published LR tests are significant at P < 0.001 / P < 0.01 while my CIs cross zero. That is not a contradiction: the
  LR tests are computed within a repeated-measures model over multiple test sessions and item sets, which is far more
  powerful than the between-group SE formula I used. I have kept the conservative SEs rather than reverse-engineering a
  narrower one from the p-values, and flagged inferred_from_ci: true on all three.

  NOTE ON RAVEN'S: RAPM was administered at screening only, as a group-matching variable (10.38 +/- 1.06 vs 9.77 +/- 1.98,
  t = 1.43, P = 0.16). It was NOT re-administered under sleep restriction. So this cohort still provides no age-matched
  experimental estimate of a fluid-intelligence decrement.
