rob:
  tool: RoB2
  judgement: some_concerns
  notes: >
    Well-suited design for this shard's subject - the protocol was explicitly built to mimic
    "a busy workweek and a recovery weekend" - with a parallel 8 h control group that showed no change
    in any parameter, which strengthens causal attribution. Concerns: small and unequal groups
    (n=15 restricted vs n=8 control); allocation method not described in the abstract; no blinding
    possible; the paper reports per-timepoint means with dispersion rather than differences with CIs,
    so no SE for any effect is recoverable; 4 h TIB is more severe than the subject's 5-6 h; published
    in a low-visibility journal.
funding: null
notes: >
  Target extraction #4, young-MALE component, and the single best exposure-pattern match in the whole
  shard: 5 consecutive nights of restriction followed by 3 recovery nights, in healthy young men only,
  which is structurally the subject's weekday/weekend cycle.
  THREE FINDINGS THAT MATTER:
  (1) Heart rate rose only ~3 bpm (60 -> 63) after the restriction week - a small effect, and note
      that Covassin 2021 found NO heart-rate change at all after 9 nights of 4 h.
  (2) Sympathetic balance shifted (LF/HF 4.6 -> 6.0, +30%), agreeing with Covassin's norepinephrine
      rise. So the autonomic signal replicates across the two best experimental records even though
      the blood-pressure signal does not replicate in men.
  (3) Recovery did NOT restore heart rate; it rose FURTHER to 65 bpm after three 8 h nights. The
      authors do not explain this, and with n=15 it may be noise, but taken at face value it argues
      against the assumption that weekend catch-up sleep resets cardiovascular measures.
  The authors are appropriately cautious about clinical meaning: "To reliably interpret the clinical
  significance of these early signs of physiological stress, a follow-up study would be needed to
  evaluate if the stress responses escalate and lead to more unfavourable reactions, such as elevated
  blood pressure and a subsequent elevated risk for cardiovascular health problems."
  n = 23 = 15 restricted + 8 control. Age is described only as "healthy young men"; no mean is given
  in the abstract, so age_mean is null and adolescent_match is good_young_adult rather than exact.
shard: "s08_cardiovascular"
