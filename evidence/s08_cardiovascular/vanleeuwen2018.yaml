    followup_years: null
    cohort_family: null
    quote: "In the control group, none of the parameters changed. In the experimental group, heart rate increased from 60 ± 1.8 beats per minute (bpm) at BL, to 63 ± 1.1 bpm after SR and further to 65 ± 1.8 bpm after REC."
