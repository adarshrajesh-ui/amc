    scale: raw_units
    unit: "bpm"
    value: 3.0
    se: null
    ci: null
    conversion_formula: >
      Computed as the difference of reported condition means: 63 bpm after sleep restriction minus
      60 bpm at baseline = +3 bpm. The paper reports means with a dispersion term at each timepoint
      (60 ± 1.8 at baseline, 63 ± 1.1 after SR) but NOT the SE of the within-subject difference,
      and these are repeated measures on the same men, so the SE of the difference cannot be derived
      without the within-subject correlation. se therefore null - not invented.
    from_figure: false
    inferred_from_ci: false
    direction_note: "positive = HIGHER resting heart rate after 5 nights of 4 h TIB (harm). Magnitude small (+3 bpm, a 5% increase)."
