rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: >
    Genuinely prospective with hard-ish outcome ascertainment (physician diagnosis, hospital record,
    or cause of death) rather than self-report, and the authors state that adjustment "only partially
    attenuated" the association. Concerns: single-item self-reported sleep duration from the early
    1980s; the covariate set is not enumerated in the abstract so the adequacy of adjustment cannot be
    assessed from what I retrieved; the analysis is presented for the 32-59 y stratum, and reporting a
    subgroup as the headline result invites selective-reporting bias; obesity and diabetes are treated
    as mediators, which if they are in fact confounders would inflate the estimate.
funding: null
notes: >
  This is the origin of the "short sleep doubles hypertension risk" claim and the source of the age
  restriction that the task asks about. Two cautions for the downstream model:
  (1) MAGNITUDE OUTLIER. HR 2.10 is 3-6x larger on the log scale than the pooled meta-analytic
  estimates for the same outcome (Guo 2013 RR 1.23; Itani 2017 RR 1.17; Wang 2012 RR 1.33). A single
  1980s cohort of 4810 people reporting an effect this much larger than the pooled literature is more
  likely to reflect residual confounding or a subgroup-selection artefact than a true effect size.
  (2) AGE DIRECTION. The restriction to 32-59 y is the empirical basis for claiming the association
  is stronger in younger people, but 32-59 is MIDLIFE. Neither this study nor Wang 2012 (<65 y)
  contains anyone near 19 years old. The age-interaction evidence therefore does NOT license
  transporting a larger effect to the subject; it licenses only the weaker statement that the
  association appears in working-age adults and fades in the elderly, which is also the pattern
  expected if competing risks and reverse causation dominate at older ages.
  age_range recorded as [32,59] because that is the stratum the reported effect applies to, not the
  full NHANES I sampling frame.
