    from_figure: false
    inferred_from_ci: false
    direction_note: >
      ABSOLUTE ANCHOR. About 13.5% of this MIDLIFE cohort developed hypertension within a decade. If
      HR 2.10 were transportable, the <=5 h stratum's absolute risk would be roughly 20-25% vs ~11-12%
