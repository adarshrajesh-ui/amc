rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: >
    Very large (153 studies, 5.17 M participants) and restricted to prospective cohorts with >=1 y
    follow-up, which is a strength. Principal weakness for this shard: the exposure is a
    dichotomy ("short" vs "normal") whose cutpoint varies across contributing studies, so the pooled
    RR has no defined dose. The authors' own meta-regression found no dose-response for the
    cardiovascular outcomes, which undercuts using these RRs as if they applied at any particular
    hour. No objective exposure measurement.
funding: null
notes: >
  Included as the largest dichotomous-contrast synthesis, and as an internal consistency check on the
  dose-response papers. Per the extraction instructions I prefer dose-response over dichotomous
  contrasts, so Yin 2017 and Huang 2022 outrank this record; it is retained because (a) it supplies
  a hypertension estimate from prospective data only, and (b) its null meta-regression is itself a
  substantive finding about the shape of the exposure-response relationship.
  Note the tension across records: Itani reports CVD 1.16 / CHD 1.26 for an undefined "short"
  contrast, while Yin's spline puts CVD at 1.02 and CHD at 1.05 at 6 h. Both cannot be simultaneously
  applied to a 6 h sleeper; the dichotomous estimates are dominated by the most extreme sleepers in
  each cohort and overstate risk at 6 h.
  DE-DUPLICATION WARNING FOR THE POOLER: this is the SAME PUBLICATION as the record filed by shard
  s09_obesity_bmi under study_id "itani2017" (identical DOI 10.1016/j.sleep.2016.08.006 and PMID
  27743803). I have deliberately given mine the distinct study_id "itani2017_cvd" so that neither
  record silently overwrites the other if records are keyed by study_id. The two records extract
  DIFFERENT outcomes from the same meta-analysis - cardiovascular/CHD/hypertension here, obesity and
  anthropometric outcomes there - so they are not redundant for a per-outcome pool, but they are NOT
  independent studies and must not be treated as two sources of evidence about the same outcome. Key
  on doi/pmid, not on study_id, when checking independence.
shard: "s08_cardiovascular"
