rob:
  tool: RoB2
  judgement: some_concerns
  notes: >
    Design strengths are unusual for this literature: randomised crossover with a 3-12 month washout,
    16-day inpatient stay, continuous polysomnography confirming the manipulation, controlled
    weight-maintenance diet (so the BP effect cannot be attributed to diet or weight change), 24-h
    ambulatory BP as the prespecified primary outcome rather than office snapshots, and an explicit
    recovery phase. Concerns: n=20 total, so the sex-stratified analyses rest on 11 men and 9 women;
    the sex split was post-hoc and the authors label it exploratory; blinding is impossible; 4 h TIB
    for 9 consecutive nights is more severe than the subject's habitual 5-6 h with weekend recovery.
funding: null
notes: >
  Target extraction #4, primary source. Best-matched experimental record in the shard: mean age 23.4
  years, healthy, and the exposure is multi-night rather than one night of total deprivation.
  All SEs derived as (CI_upper - CI_lower)/3.92 on the mmHg / percent / pg-per-mL scale directly,
  since these are mean differences rather than ratios.
  DECISION-RELEVANT SUMMARY FOR AN 18-19 YEAR OLD MALE:
  - Whole-sample effect on 24-h BP is small but real: MAP +2.1, SBP +3.1, DBP +2.2 mmHg.
  - In MEN specifically there was NO 24-h BP effect at all, and daytime MAP/DBP were LOWER by
    ~3.7-3.8 mmHg. The whole-sample signal is carried by women (24-h SBP +8.0 mmHg).
  - Heart rate did not change.
  - Sympathetic activation (norepinephrine +55.5 pg/mL) and endothelial dysfunction (FMD -2.2%) DID
    occur in the whole sample.
  - Reversal is PARTIAL: 24-h BP normalised within 3 recovery nights, but sleep-time SBP (+3.3 mmHg)
    and FMD (-1.8%) had not.
  The authors also note that the prior experimental literature is largely null: "Previous studies that
  applied sleep restriction models to simulate real-life conditions of protracted partial sleep
  curtailment yielded largely null results in terms of any BP effects, despite applying various
  degrees and duration of sleep truncation" - consistent with the null meta-analysis of RCTs
  (hu2020_bp_rct_ma) in this shard.
  Directly relevant to the subject's weekend-catchup pattern, the authors state: "experimental data
  from our and prior studies suggest that short periods of extended sleep opportunity may be
  insufficient to mitigate the negative effects caused by short sleep during weekdays."
