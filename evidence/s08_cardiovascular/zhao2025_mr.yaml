rob:
  tool: MR-STROBE
  judgement: some_concerns
  notes: >
    Reports MR-Egger intercept tests showing no significant directional pleiotropy, and uses a
    defensible two-step mediation framework. Concerns: 50 exposure-outcome pairs were tested and the
    authors themselves grade many results as merely "suggestive" rather than significant, so
    multiple-testing inflation is a live issue; exposure GWAS are mainly UK Biobank while several
    outcome GWAS also include UK Biobank, so sample overlap and weak-instrument bias are possible;
    total sample sizes for each pairing are not stated in the text I retrieved, hence n is null; the
    short-sleep and continuous-sleep instruments are derived from the same underlying trait and are
    reported as if independent evidence.
funding: "Not stated in the retrieved text. Competing interests: RSM reports extensive pharmaceutical consultancy/speaker fees and is CEO of Braxia Scientific; KMT reports personal fees from Braxia Scientific; other authors declare none."
notes: >
  Second MR record, serving three purposes for this shard.
  (1) INDEPENDENT REPLICATION of the per-hour MR effect on MI: OR 0.89 per extra hour here vs 0.80 in
      Daghlas. Both point the same way; this one is about half the magnitude on the log scale. A
      defensible MR consensus for MI is therefore roughly OR 1.12-1.25 per hour of sleep LOST, with
      the truth plausibly nearer the smaller end given this study's larger and later instrument set.
  (2) STROKE NULL: short sleep shows no causal effect on stroke, matching guo2024_stroke_mr. Insomnia,
      by contrast, does (OR 1.26, 1.03-1.54 here; OR 1.27, 1.10-1.47 in Guo 2024). The sleep-stroke
      pathway appears to run through insomnia, not through duration.
  (3) DEPRESSION AS MEDIATOR (target #7): 8.9-12.7% of the short-sleep effect on CAD/MI/HF is mediated
      by MDD, and short sleep raises depression odds by 83%. For an undergraduate whose short sleep is
      volitional and academic rather than a symptom of depression, this mediated fraction is arguably
      not applicable to him at all, which further shrinks his expected effect.
  The paper also notes that a prior MR by Zhuang et al "failed to establish a causal relationship
  between sleep duration and the risk of CAD and MI", and that a 116 632-person 21-country prospective
  study "reported that short sleep duration was not associated with an increased risk of CVDs" - two
  further discordant results I did not independently retrieve and therefore do not extract.
shard: "s08_cardiovascular"
