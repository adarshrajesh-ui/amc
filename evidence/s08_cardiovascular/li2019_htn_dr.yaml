rob:
  tool: AMSTAR-2
  judgement: critical
  notes: >
    FAILS its own sensitivity analysis. The authors report verbatim: "However, the pooled results were
    reversed after ignoring each included study per time." A leave-one-out analysis that reverses the
    pooled result means no contributing study can be removed without flipping the conclusion, which
    is close to a definition of a non-robust meta-analysis. Combined with only 9 studies / 48 525
    subjects, an implausibly small reported per-hour slope (0.32%), and no CI on that slope, this
    record cannot carry weight. It is retained for completeness of the hypertension dose-response
    search and as a negative comment on the state of that literature.
funding: null
notes: >
  Retained but DOWN-WEIGHTED TO ZERO for pooling. This is the only dose-response meta-analysis of
  sleep duration and hypertension I could locate, which is itself the finding: the hypertension
  dose-response evidence base is one small, self-admittedly non-robust analysis.
  Two internal inconsistencies the downstream model should know about: (a) the categorical contrasts
  at 5 h and 6 h are reported as significant while the continuous slope is 0.32% per hour, which
  cannot both be true on any ordinary scale; (b) the leave-one-out reversal contradicts the
  simultaneous claim that "our results were highly credible" on the basis of an Egger test.
  A PubMed-indexed Comment on this paper exists (J Hum Hypertens. 2019 Mar;33(3):174-176,
  doi 10.1038/s41371-019-0177-z), consistent with the analysis being contested. I did not retrieve it.
  Note also that a 2024 methodological review (Syst Rev. 2024 Aug 6, PMID 39107813) specifically
  assessed the reporting quality of sleep-duration/hypertension meta-analyses - screened and logged
  in screening_log.md - indicating recognised quality problems across this specific literature.
