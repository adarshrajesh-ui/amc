    conversion_formula: >
      Reported directly as a percentage in the abstract; no CI or SE is given, so se is null. Sign
      flipped to negative to encode "risk REDUCED by 0.3207% per additional hour", matching the
      shard convention that positive = harm.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      negative = each extra hour of sleep lowers hypertension risk by 0.32 PERCENT (relative), i.e.
      a multiplicative factor of about 0.9968 per hour. This is a startlingly small slope - three
      orders of magnitude smaller than the categorical RRs of 1.2-1.3 reported by the same
      literature - and I flag it as probably a reporting or unit error in the source rather than a
      credible per-hour effect. It should NOT be pooled without resolution against the full text.
