rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: >
    Largest and most methodologically appropriate dose-response synthesis for this shard's question:
    restricted cubic splines with 4 knots, Greenland-Longnecker piecewise linear trends, maximally
    adjusted per-study estimates, NOS quality 6.9-7.1/9. Key internal caveats that reduce confidence
    in a causal reading: (a) exposure is self-reported in 48/67 studies and interview-based in 19,
    with zero objective (actigraphy/PSG) measurement; (b) when restricted to studies reporting CVD
    INCIDENCE rather than mortality, "there was no significantly increased risk of total CVD at the
    extreme sleep duration" - i.e. the U-shape is driven by mortality studies, which is the pattern
    expected under reverse causation; (c) the authors explicitly declined to stratify by age.
funding: null
notes: >
  Target extraction #2. This is the single most decision-relevant record in the shard because it
  supplies the requested per-hour slope AND the absolute RR at 5 h and 6 h from the nonlinear spline
  (Table 2), which is what the subject's exposure actually is.
  THE DOSE-RESPONSE CURVE (RR vs 7 h referent), read from Table 2:
    sleep h : all-cause mortality : total CVD : CHD : stroke
      3 h   : 1.12 (1.10-1.14) : 1.14 (1.09-1.19) : (not est.) : (not est.)
      4 h   : 1.08 (1.06-1.09) : 1.09 (1.06-1.13) : 1.16 (1.09-1.23) : 1.05 (0.96-1.15)
      5 h   : 1.04 (1.03-1.05) : 1.05 (1.03-1.08) : 1.11 (1.06-1.16) : 1.02 (0.96-1.08)
      6 h   : 1.01 (1.00-1.01) : 1.02 (1.00-1.03) : 1.05 (1.03-1.08) : 0.99 (0.96-1.03)
      7 h   : 1.00 (ref)       : 1.00 (ref)       : 1.00 (ref)       : 1.00 (ref)
      8 h   : 1.04 (1.04-1.05) : 1.03 (1.02-1.05) : 1.01 (0.99-1.03) : 1.08 (1.06-1.11)
      9 h   : 1.15 (1.14-1.16) : 1.16 (1.13-1.19) : 1.14 (1.08-1.20) : 1.30 (1.24-1.37)
     10 h   : 1.32 (1.29-1.35) : 1.37 (1.29-1.45) : 1.34 (1.20-1.50) : 1.64 (1.47-1.82)
     11 h   : 1.53 (1.47-1.59) : (not est.)       : (not est.)       : (not est.)
  n of risk estimates per column: 40 (mortality), 26 (CVD), 20 (CHD), 17 (stroke).
  DIRECTLY RELEVANT TO THE SUBJECT: the curve is markedly ASYMMETRIC. At 6 h - the middle of the
  subject's weekday range - total CVD is 1.02 and stroke is 0.99, i.e. indistinguishable from the
  7 h referent. At 5 h the largest effect is CHD at 1.11. The long-sleep arm is much steeper than
  the short-sleep arm (10 h: CVD 1.37, stroke 1.64), which is hard to explain by a sleep-toxicity
  mechanism and is the signature of confounding by prevalent illness. The subject's occasional
  10-11 h weekend nights sit on the steeper limb but are recovery sleep, not habitual long sleep,
  so this arm is not transportable to him.
  This paper explicitly contradicts Cappuccio 2011 on total CVD ("short duration of sleep was not
  significantly associated with a greater risk of total CVD, possibly because of limited included
  studies") and supersedes it (19 further cohorts, 26 further reports).
  On AGE: the discussion states "several studies found a stronger U-shaped association between
  sleep duration and CVDs in older adults compared with younger adults (cutoff at age 65 years)",
  i.e. the direction of the age interaction for hard CVD endpoints is the OPPOSITE of that reported
  for hypertension - weaker, not stronger, in the young. No age-stratified pooled estimate is given.
