rob:
  tool: AMSTAR-2
  judgement: high
  notes: >
    Only 6 trials with 10-43 participants each, so the pooled sample is on the order of 100-150 people
    and the CIs are correspondingly wide (+/-3 mmHg) - the analysis cannot exclude a clinically
    meaningful 3 mmHg effect. Crucially, the authors flag the measurement limitation themselves: "Only
    one study obtained continuous BP readings", so this pool is essentially about office/resting BP.
    Covassin 2021 makes exactly this criticism of the prior literature and shows that 24-h ambulatory
    monitoring detects an effect that resting measures miss. This record should therefore be read as
    "no effect on resting BP", not "no effect on BP", and its tier-T1 status should not be allowed to
    override the better-instrumented single trial. Published in a nursing-research journal;
    exposure durations and participant ages are not recoverable from the abstract.
funding: null
notes: >
  Target extraction #4, pooled experimental component, and the most important counterweight in the
  shard to alarmist readings of the observational literature. The highest-tier evidence available
  (T1, randomised) finds NO significant effect of sleep restriction on systolic BP, diastolic BP, or
  heart rate in healthy adults.
  How I reconcile this with covassin2021: the two are compatible. Hu 2020 pools mostly resting/office
  BP; Covassin used 24-h ambulatory BP and found +2.1 mmHg overall - within Hu's CI of -2.3 to +4.2.
  And Covassin's male stratum was null, which is exactly what Hu reports for a mostly-male trial
  literature (Covassin notes "most of the previous studies included only men").
  CONVERGENT READING FOR THE SUBJECT: for a young male, the experimental evidence supports
  sympathetic activation and endothelial impairment but does NOT support a measurable sustained rise
  in blood pressure. The best estimate for his BP change is approximately 0 to +3 mmHg systolic, with
  a CI that comfortably includes zero.
  n is null because per-trial sample sizes are given only as a range (10-43) and no total is stated.
  CITATION-STRING ARTEFACT, for any human reviewer: the title above is written with the literal
  entity "&amp;" rather than a plain "&". That is exactly how the publisher registered the title with
  Crossref, and reproducing it verbatim is what allows the automated title-match check in
  src/verify_refs.py to resolve this record (a plain "&" normalises away and drops the similarity
  score to 0.667, below the 0.72 threshold). The DOI and PMID both resolve cleanly on their own; the
  entity is a cosmetic quirk of the source metadata, not a transcription error.
