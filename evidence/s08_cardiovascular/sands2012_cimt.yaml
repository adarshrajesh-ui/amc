rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: >
    Genuine strength: WRIST ACTIGRAPHY rather than self-report, which is rare in this literature and is
    why the record is retained despite its design. Weaknesses: cross-sectional (tier TX), n=617 with
    the reported effect resting on ~259 men, the covariate set is not enumerated in the abstract so
    adequacy of adjustment cannot be judged from what I retrieved, the sex-stratified contrast is not
    accompanied by a reported interaction test, and the authors note the association was driven by one
    carotid segment (the bulb) - a segment-specific finding that is more consistent with measurement
    noise than with diffuse atherosclerosis.
funding: null
notes: >
  Target extraction #6, vascular-marker component. IMPORTANT AGE CORRECTION - this record is commonly
  mis-cited as young-adult evidence because CARDIA stands for "Coronary Artery Risk Development in
  YOUNG ADULTS", but that refers to the cohort's enrolment age in 1985-86. At the time the actigraphy
  and carotid ultrasound were performed the participants were 37-52 years old. This is a MIDLIFE
  sample and adolescent_match is therefore poor_midlife, not good_young_adult.
  MAGNITUDE IN CONTEXT: 0.026 mm per hour. For the subject, ~1.5-2 h below optimum, the implied
  association is ~0.04-0.05 mm of extra cIMT. Typical adult cIMT is roughly 0.6-0.9 mm and progresses
  by about 0.01 mm/year, so this is on the order of 4-5 years of vascular ageing - IF the association
  were causal, IF it were transportable from midlife men to a 19-year-old, and IF cross-sectional
  cIMT differences translate into event risk. All three conditionals are unverified, and the effect
  was absent in women in the same sample.
  This is the closest thing the literature offers to "early vascular markers in young adults" and it is
  thin: one cross-sectional analysis, one sex, one carotid segment. I searched specifically for
  arterial-stiffness and pulse-wave-velocity studies in adolescents and young adults and found only
  scattered small cross-sectional reports (logged in screening_log.md), none prospective, none in
  16-19 year olds.
