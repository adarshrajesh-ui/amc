rob:
  tool: MR-STROBE
  judgement: low
  notes: >
    Strong MR execution: IVW primary with weighted median, MR-Egger, MR-PRESSO and MR-RAPS
    sensitivity analyses; MR-Egger intercept test non-significant for both instruments
    (p = 0.23 continuous, 0.22 short sleep); leave-one-out revealed no driving SNP; instruments
    reconstructed from GWAS excluding shiftworkers and prevalent disease gave similar estimates;
    BMI-adjusted instrument gave OR 0.81 (0.65-0.99). Residual concerns: the instrument IS associated
    with BMI, which the authors concede is "consistent with either a confounding or mediating role";
    one variant distorted weighted-median and MR-Egger estimates and had to be pruned; the continuous
    instrument failed to reach significance in the one-sample replication; sleep duration is
    self-reported in the underlying GWAS; and UK Biobank is a healthy-volunteer cohort.
funding: null
notes: >
  Target extraction #5 (MR) AND target #7 (confounding), the shard's highest-value single record.
  AUTHOR-LIST CORRECTION: the task named "Daghlas, Dashti, Lane, Saxena, Rutter et al." The actual
  author order is Daghlas I, Dashti HS, Lane J, Aragam KG, Rutter MK, Saxena R, Vetter C - Aragam and
  Vetter (senior/corresponding) were omitted from the prompt and Saxena/Rutter are transposed.
  Journal, year and volume match.
  INTERNAL DISCREPANCY IN THE PAPER: the abstract states "5,128 incident cases" of MI while the
  Results text states "5,218 incident MIs over a median follow-up of 7.04 years". Table 1's
  case counts sum to 82+310+1058+3248+375+129+16 = 5,218, which corroborates the Results figure;
  the abstract's 5,128 appears to be a typographical transposition. I use 5,218.
  OBSERVATIONAL vs MR COMPARISON (the comparison target #5 asks for):
    observational, fully adjusted, <6 h vs 6-9 h : HR 1.20 (1.07-1.33)
    MR, short-sleep instrument                   : OR 1.19 (1.09-1.29), UKB replication 1.21 (1.08-1.37)
    MR, continuous, per hour LESS sleep          : OR 1.25 (1.05-1.49); one-sample 1.16 (0.94-1.43), ns
  So the MR DOES support a causal contribution, and its magnitude is of the same order as the adjusted
  observational estimate. But two caveats temper the "MR confirms observation" reading: the two
  headline numbers are on different exposure scales (see the scale warning above), and the continuous
  per-hour instrument did not replicate in the one-sample analysis.
  ADDITIONAL FINDING: healthy sleep duration attenuated MI risk even in the top quartile of CAD
  genetic risk (HR 0.82, 95% CI 0.68-0.998) - a marginal result whose upper bound nearly touches 1.
shard: "s08_cardiovascular"
