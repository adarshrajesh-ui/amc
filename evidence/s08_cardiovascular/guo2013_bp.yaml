rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: >
    24 studies met inclusion, 21 pooled, 225 858 subjects, search to February 2012. Reports that
    "the effects of sleep duration differed by gender, location of the population, and definitions of
    short or long sleep duration" and that meta-regression on seven variables failed to locate the
    source of heterogeneity - i.e. unexplained heterogeneity is acknowledged. Mixes cross-sectional
    and longitudinal designs but pools them separately, which is correct. Four published Letters to
    the Editor commenting on this paper are indexed in PubMed, at least one of which concerns the
    definition of sleep duration used in the meta-analysis - the estimate is contested.
funding: null
notes: >
  Target extraction #3, main pooled estimate. This is the "Guo et al." named in the task; the real
  paper is about high blood pressure generally rather than incident hypertension alone, and it
  pools cross-sectional and longitudinal evidence separately (OR 1.21 and RR 1.23 respectively -
  reassuringly similar).
  age_range 18-106 is the range of the CONTRIBUTING STUDIES' eligibility, not a mean; the paper
  states "Twenty-four adult studies met our inclusion criteria, with ages ranging from 18 to 106
  years". adolescent_match is set to mixed rather than exact_16_19 on that basis - the lower bound
  touches 18 but no estimate is reported for the youngest stratum, and the pooled estimate is
  dominated by midlife cohorts.
  No absolute hypertension incidence is reported.
shard: "s08_cardiovascular"
