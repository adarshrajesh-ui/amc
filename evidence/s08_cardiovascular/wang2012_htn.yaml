rob:
  tool: AMSTAR-2
  judgement: high
  notes: >
    The prospective evidence base here is thin: only 6 prospective studies with a combined N of 9959,
    against 17 cross-sectional studies with N=105 432. The headline incident-hypertension RR of 1.33
    therefore rests on ~10 000 people. The age subgroup is a crude dichotomy at 65 y, was not
    pre-registered as far as can be told from the abstract, and no interaction p-value is reported -
    so "stronger in the young" is an informal comparison of subgroup point estimates, not a tested
    interaction. Search current only to October 2011; superseded in coverage by Itani 2017 (RR 1.17
    for incident hypertension from prospective data only) and Li 2019.
funding: null
notes: >
  Target extraction #3, age-interaction component. HONEST READING: this paper is the origin of the
  widely repeated claim that the short-sleep/hypertension association is stronger in younger people,
  and it does NOT support extending that claim to a 19-year-old. The "younger" stratum is everyone
  under 65. Nothing in this meta-analysis speaks to 16-25 year olds specifically.
  n recorded as 115 391 = 9959 prospective + 105 432 cross-sectional, since the paper reports these
  two pools separately and gives no single total. n_studies_pooled = 23 = 6 prospective + 17
  cross-sectional.
  No absolute hypertension incidence rates are reported, which is a limitation for this shard's
  absolute-risk requirement. Note that "incident hypertension" in these cohorts is largely
  ascertained in midlife adults whose underlying 5-10 y hypertension incidence is on the order of
  10-25%; a 19-year-old male's is far lower, so an RR of 1.33 translates to a much smaller absolute
  excess at his age even if the ratio were transportable.
shard: "s08_cardiovascular"
