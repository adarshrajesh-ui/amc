    se: 0.14161
    ci: [0.08618, 0.64185]
    conversion_formula: "log_rr = ln(1.44) = 0.36464; se = (ln(1.90) - ln(1.09))/3.92 = 0.14161"
    from_figure: false
    inferred_from_ci: true
    direction_note: >
      positive = elevated CHD risk with poor subjective sleep QUALITY. Recorded because it exceeds
      every duration-based estimate in this shard: quality (RR 1.44) outperforms short duration
      (null) within the same meta-analysis. Relevant to the subject only insofar as his restriction
      is volitional and not accompanied by insomnia, which is the more predictive exposure.
    covariates: ["maximally adjusted per-study estimates"]
    followup_years: null
    cohort_family: "pooled_multi_cohort_74_studies"
    quote: "Subjective poor sleep quality was associated with coronary heart disease (risk ratio , 1.44; 95% confidence interval, 1.09-1.90), but no difference in mortality and other outcomes."
rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: >
    Large (74 studies, 3.34 M participants, 242 240 deaths among 2 564 029 with death events), used
    both linear and nonlinear dose-response models and reported them as concordant in the 30 studies
    with >1 000 000 participants. The failure to report a point estimate and CI for the <7 h arm is
    a reporting weakness that prevents this study from entering an inverse-variance pool, but the
    stated null is itself informative given the sample size and the fact that the long-sleep arm
    was detected cleanly in the same analysis.
funding: null
notes: >
  DISCONFIRMING EVIDENCE, deliberately retained. This is the strongest single piece of evidence
  against the premise that the subject's 5-6 h weekday sleep carries measurable cardiovascular
  harm, and it comes from the same journal and the same year-range as Yin 2017 with a comparable
  sample. Its conclusion - "Longer duration of sleep may be more associated with adverse outcomes
  compared with shorter sleep durations" - directly opposes the framing of Cappuccio 2011.
  Where Yin 2017 found RR 1.05-1.06 per hour below 7 h, Kwok 2018 found nothing. Any pooled
  estimate this shard feeds downstream must carry heterogeneity wide enough to contain both.
  Exposure is self-reported throughout (stated in the title), and cohort ages are midlife/older.
shard: "s08_cardiovascular"
