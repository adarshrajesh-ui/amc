effects:
  - outcome_domain: mortality
    outcome_construct: all_cause_mortality_below_7h_null
    exposure: {type: habitual_short_sleep, dose_h: 6, referent_h: 7, duration_days: null,
               contrast_label: "self-reported sleep <7 h vs 7-8 h referent, linear spline dose-response"}
    scale: log_rr
    unit: null
    value: 0.0
    se: null
    ci: null
    conversion_formula: >
      No point estimate or CI is reported for the <7 h arm; the paper states only that no significant
      difference was identified. Recorded as a null (log_rr = 0) with se null rather than fabricating
      a value. The downstream pooler should treat this as a DIRECTIONAL NULL VOTE, not as a precise
      zero, and must not assign it inverse-variance weight.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      Zero = no detected excess risk below 7 h. This is the key DISCONFIRMING record for the short-sleep
      hypothesis: the second-largest dose-response meta-analysis in the field found nothing below 7 h
      while reproducing a clear graded effect above 8 h in the same dataset with the same methods.
    covariates: ["maximally adjusted per-study estimates"]
    followup_years: null
    cohort_family: "pooled_multi_cohort_74_studies"
    quote: "Self-reported duration of sleep >8 hours was associated with a moderate increased risk of all-cause mortality, with risk ratio , 1.14 (1.05-1.25) for 9 hours, risk ratio, 1.30 (1.19-1.42) for 10 hours, and risk ratio, 1.47 (1.33-1.64) for 11 hours. No significant difference was identified for periods of self-reported sleep <7 hours, whereas similar patterns were observed for stroke and cardiovascular disease mortality."
