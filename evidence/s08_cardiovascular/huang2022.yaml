rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: >
    Largest synthesis in the domain by participant count (71 cohorts, 3.8 M). Uses a robust-error
    meta-regression (REMR) model on multivariate-adjusted estimates, which is a defensible
    dose-response method. Weaknesses: reports the shape of the curve and its boundaries rather than
    tabulated RRs with CIs at each hour, so it cannot supply a point estimate at 5 h or 6 h the way
    Yin 2017 can; exposure is self-report throughout; the cerebrovascular non-linearity p-value is
    only 0.05, so the U-shape for stroke is weakly established.
funding: "The authors declare that the research was conducted in the absence of any commercial or financial relationships that could be construed as a potential conflict of interest."
notes: >
  The "newer dose-response synthesis" requested by target #2. Its headline contribution is
  a boundary rather than a slope, and that boundary is strikingly permissive: for CVD, risk is
  not elevated down to 4.3 h/night. Taken at face value this implies essentially ZERO excess CVD
  risk at the subject's 5-6 h weekday exposure - a weaker inference of harm than Yin 2017's
  RR 1.02-1.05 and much weaker than Cappuccio 2011's RR 1.48 for CHD.
  I could not obtain per-hour RRs with CIs from this paper: the results are presented as spline
  boundaries and figures, and the PMC copy would not render; the numbers above were taken from
  the publisher's full text at frontiersin.org and cross-checked against the verified PubMed
  abstract, which states the same boundaries.
  Cohort ages are not summarised in the paper's abstract; the study-characteristics table lists
  constituent cohorts with age ranges such as 35+, 40-80, 65-85, 18-90 - i.e. adult and older
  adult. No adolescent cohorts. Absolute event rates are not reported at the pooled level, which
  is a real limitation for this shard's absolute-risk requirement.
shard: "s08_cardiovascular"
