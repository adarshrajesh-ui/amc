rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: >
    Prospective cohorts only, searched five databases including Chinese-language sources (CNKI,
    Wanfang), which broadens coverage relative to Cappuccio 2011 but may also import lower-quality
    cohorts. Total participant count is not stated in the abstract and I did not obtain the full text,
    so n is null. The dichotomous "short sleep" contrast is again undefined in dose terms, and the
    paper's own conclusion notes the long-sleep arm dominates.
funding: null
notes: >
  Retained as the most recent stroke-specific dose-response synthesis, and above all as a marker of
  how UNSTABLE the stroke estimate is across meta-analyses of largely overlapping literature:
  RR 1.33 here vs 1.15 (Cappuccio 2011) vs 1.02 at 5 h (Yin 2017) vs no significant MR effect for
  sleep duration on stroke (Guo 2024). Stroke is the outcome where this shard's evidence is least
  internally consistent, and the downstream model should widen the stroke interval accordingly.
  The paper's own conclusion - "Extended sleep duration was more associated with adverse outcomes
  compared with short sleep duration" - matches Kwok 2018 and Yin 2017 on the asymmetry.
  Absolute stroke rates are not reported. Cohort ages not reported in the abstract; contributing
  cohorts are adult/older adult.
shard: "s08_cardiovascular"
