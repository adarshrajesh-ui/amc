rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Random-effects pooling of self-reported exposure; study-specific and heterogeneous short-sleep cutpoints are pooled as if equivalent, so the contrast has no single dose interpretation. No publication bias detected (P = 0.95 CHD, 0.30 stroke, 0.46 CVD). Superseded for dose-response purposes by Yin 2017, which includes 19 further cohorts and explicitly contradicts the null total-CVD finding here."
funding: null
notes: >
  Target extraction #1 for this shard. Confirms the task's description: CHD and stroke are reported
  separately and the effects differ markedly (CHD RR 1.48 vs stroke RR 1.15, the latter borderline).
  The total-CVD result is null (1.03) - a fact often omitted when this paper is cited as showing that
  "short sleep causes cardiovascular disease". Author list and journal/year in the task prompt are
  correct. Note the internal inconsistency of the three estimates: a genuine causal effect on CHD of
  RR 1.48 with a null effect on total CVD (of which CHD is a large component) is difficult to
  reconcile and suggests outcome-specific ascertainment or reporting effects. Long sleep effects
  (CHD 1.38, stroke 1.65, CVD 1.41) were larger than short sleep for stroke and CVD, which is a
  pattern more consistent with reverse causation / illness-related sleep change than with a
  short-sleep toxicity mechanism. Age of pooled cohorts not reported in the abstract; the constituent
  cohorts are predominantly midlife and older adults, hence adolescent_match poor_midlife.
shard: "s08_cardiovascular"
