rob:
  tool: MR-STROBE
  judgement: low
  notes: >
    Well-conducted: very large observational arm, MR with the largest available insomnia GWAS
    (2.37 M individuals, 554 loci) and the GIGASTROKE outcome consortium, five pleiotropy-robust
    sensitivity estimators, FDR correction, and explicit reverse-MR checks. Limitations the authors
    state: sleep measures are self-reported and refer only to the last 4 weeks, so they may not capture
    long-term exposure; partial UK Biobank overlap between exposure and outcome GWAS (GIGASTROKE
    included 12% UKB cases for all stroke) risks weak-instrument bias; and critically for this shard,
    "if the relationships are U-shaped, as was suggested for sleep duration and SVD traits, these may
    not be detected by MR" - a linear-instrument MR can miss a genuinely U-shaped duration effect. The
    duration null should be read with that caveat rather than as proof of no effect.
funding: "The authors report no relevant disclosures."
notes: >
  Target extraction #5, stroke component, and a major confounding datapoint for target #7.
  TWO FINDINGS:
  (1) In the observational arm, "we found multiple observational associations, but many of these were no
      longer significant after controlling for cardiovascular risk factors." Only insomnia (HR 1.05,
      1.01-1.11), daytime napping (HR 1.09, 1.05-1.14) and dozing (HR 1.19, 1.08-1.32) survived
      adjustment for stroke - sleep duration did not appear among the survivors.
  (2) In the MR arm, only insomnia was causal for stroke. Sleep duration was not.
  Note how small the surviving adjusted observational HRs are (1.05-1.19) even for the sleep traits
  that DID survive - a useful calibration on how much of any raw sleep-stroke association is
  attributable to vascular-risk-factor confounding.
  The authors' own framing is the honest summary for this shard: "This suggests possible confounding or
  reverse causation, implying caution before proposing sleep disorder modifications" - written about
  dementia but applying with equal force to the duration-stroke literature.
  I record the duration result as a null rather than omitting the study, because a well-powered
  non-finding is evidence and the downstream model must see it.
shard: "s08_cardiovascular"
