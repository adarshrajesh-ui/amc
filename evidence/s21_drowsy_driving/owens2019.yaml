    scale: probability
    unit: "absolute prevalence difference (proportion)"
    value: 0.152000
    se: 0.054592
    ci: [0.045000, 0.259000]
    conversion_formula: >
      Reported as 15.2% (95% CI 4.5%-25.9%) higher adjusted prevalence.
      value 0.152; se = (0.259 - 0.045)/3.92 = 0.054592.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      POSITIVE = HARM associated with evening chronotype. RECORDED AS A CONFOUNDING/EFFECT-MODIFICATION
      WARNING: the chronotype effect (15.2 pp) is slightly LARGER than the sleep-duration effect
      (13.9 pp), and adolescent chronotype is a biological trait that CAUSES short school-night sleep.
      Any model that treats "hours slept" as the sole exposure is partly measuring circadian phase.
      For this subject that is arguably a feature rather than a bug — an 18-year-old whose weekday sleep
      is 5.5-6 h is very likely evening-typed — but it means the two effects cannot be added.
