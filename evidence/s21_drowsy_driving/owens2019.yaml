effects:
  - outcome_domain: mortality
    outcome_construct: self_reported_drowsy_driving_prevalence_difference
    exposure: {type: habitual_short_sleep, dose_h: 6.5, referent_h: 8.5, duration_days: null,
               contrast_label: "SCHOOL-NIGHT sleep < 7 h vs >= 8 h; outcome = ever driven while feeling drowsy in the last year; covariate-adjusted PREVALENCE DIFFERENCE in percentage points"}
    scale: probability
    unit: "absolute prevalence difference (proportion)"
    value: 0.139000
    se: 0.055867
    ci: [0.030000, 0.249000]
    conversion_formula: >
      Reported directly as an adjusted prevalence difference: 13.9% (95% CI 3.0%-24.9%) higher.
      Converted to proportions: value 0.139, ci [0.030, 0.249];
      se = (0.249 - 0.030)/3.92 = 0.055867.
      NOTE: this is an ABSOLUTE RISK DIFFERENCE on a PROBABILITY scale, not a ratio. It must not be
      exponentiated. On a relative scale, against the 47.6% overall drowsy-driving prevalence, +13.9
      percentage points is roughly a 1.3-fold relative increase.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      POSITIVE = HARM. Adolescent drivers sleeping < 7 h on school nights were 13.9 percentage points MORE
      likely to report drowsy driving than those sleeping >= 8 h. THIS IS THE FIRST LINK IN THE CAUSAL
      CHAIN, MEASURED IN EXACTLY THE RIGHT POPULATION: short school-night sleep -> more drowsy driving.
      The outcome is a SELF-REPORTED STATE, NOT A CRASH.
    covariates: ["age", "sex", "race/ethnicity", "grade", "parent education (the abstract states 'covariate-adjusted' without a full list)"]
    followup_years: null
    cohort_family: "FairfaxCounty_Owens"
    quote: >
      The covariate-adjusted prevalence of drowsy driving was 13.9% (95% CI 3.0%-24.9%) higher in students who
