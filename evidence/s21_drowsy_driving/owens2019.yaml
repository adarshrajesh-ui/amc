rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: >
    (1) CROSS-SECTIONAL ONLINE SURVEY, single county, single spring (2015), 431 drivers. Both exposure and
        outcome are self-reported in the same instrument at the same moment, so common-method variance is
        unavoidable: a student who thinks of himself as tired will report both less sleep and more drowsy
        driving.
    (2) THE OUTCOME IS NOT A CRASH. It is "having ever driven a car or motor vehicle while feeling drowsy
        in the last year" — a dichotomised, unverifiable, extremely low-threshold self-report. It cannot
        be converted into crash risk without an external multiplier, which this paper does not supply.
        This is why `tier` is TX (context only), not T5.
    (3) SELECTION: online survey of one affluent, high-achieving suburban school district (Fairfax County
        VA). Response rate not stated in the abstract. Generalisability to a national teen is unknown.
    (4) NO CRASH OUTCOME MEANS NO EFFECT ON MORTALITY CAN BE READ OFF THIS RECORD DIRECTLY.
    (5) The 15.5-18.7 y age range is an exact match to the subject's exposure window, which is why the
        record is retained despite (1)-(4).
funding: "Not stated in the retrievable abstract."
notes: >
  REQUIRED EXTRACTION #2 (young drivers specifically; "any study of sleep duration and crash risk in high
  school or college students"). REPORTING REALITY: I could not find a study of high-school or college
  students that measured SLEEP DURATION against an OBJECTIVELY VERIFIED CRASH outcome in a US sample. The
  closest are this record (right population, right exposure, WRONG outcome — a self-reported state, not a
  crash), pizza2010 (right population, self-reported crashes, Italian high schools) and martiniuk2013
  (right age band, POLICE-REPORTED crashes, but Australian and 17-24 y). THE US ADOLESCENT
  SLEEP-DURATION-TO-VERIFIED-CRASH STUDY DOES NOT EXIST.
  .
  VERBATIM QUOTES (abstract, PMID 30392873):
  DESIGN: "Cross-sectional observational data were obtained from an online survey in spring 2015 of 431
  drivers, age 15.5-18.7 years, attending Fairfax County (Virginia) Public schools. Drowsy driving was
  defined as having ever 'driven a car or motor vehicle while feeling drowsy' in the last year.
  School-night sleep duration was calculated from school-night bedtime and wake time. Those with scores in
  the lower and upper tertiles of the Morningness-Eveningness Scale for Children were designated as having
  an evening or morning chronotype, respectively."
  RESULTS: "Among survey respondents, 63.1% drove at least several times a week and 47.6% reported drowsy
  driving. The covariate-adjusted prevalence of drowsy driving was 13.9% (95% CI 3.0%-24.9%) higher in
  students who slept <7 hours on school-nights than in those who slept 8 or more hours. Compared with
  those with a morning chronotype, the adjusted prevalence of drowsy driving was 15.2% (95% CI 4.5%-25.9%)
  higher among those with an evening chronotype."
  .
  HOW I USE THIS IN injury_channel.md: as the SECOND-STAGE MULTIPLIER in the mechanistic cross-check
  (Route 3). The GHSA/SHRP2 figure is that 1.57% of all baseline driving is done in an observably drowsy
  state. If short school-night sleep raises drowsy-driving propensity by roughly the relative amount
  implied here (+13.9 pp on a 47.6% base, i.e. about 1.3-fold), then the subject's drowsy-driving
  share rises from about 1.57% to about 2.1% of his driving time, and combining that with the
  naturalistic drowsy-crash odds ratio gives an independent estimate of his excess crash risk. That route
  gives the LOWEST of my three estimates, and I report it rather than discarding it.
  .
  IMPORTANT COINCIDENCE THE DOWNSTREAM MODEL SHOULD KNOW ABOUT: this survey is Fairfax County, spring
  2015 — the SAME COUNTY and the SAME SCHOOL YEAR as the start-time change evaluated in binhasan2020, by
  an overlapping author team. It documents that even a district that delayed start times still had
  47.6% of its student drivers reporting drowsy driving, which is a direct argument that start-time
  delays deliver a small dose. cohort_family FairfaxCounty_Owens is set to flag the overlap; the two
  records use different data (survey vs DMV crash records) so they are not the same effect, but they are
  not independent samples of the world either.
  .
  ACCESS: abstract_only (Elsevier full text paywalled). Every number above is verbatim from PubMed.
