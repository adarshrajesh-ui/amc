rob:
  tool: ROBINS-I
  judgement: high
  notes: >
    A GENUINE PRE-POST WITH A CONTEMPORANEOUS CONTROL, so `quasi_experiment` / T2 is defensible — but at
    the weak end of T2, well below foss2019.
    STRENGTHS: (1) a real intervention (50-min delay, county-wide, fall 2015) with 2 years before and 2
    years after; (2) a contemporaneous comparison group ("the rest of Virginia") that showed no
    significant change; (3) restricted to Sep-Jun (school months) and to 16-18 y licensed drivers;
    (4) rate denominators are licensed drivers, and the direction matches four other analyses.
    WEAKNESSES THAT MATTER:
    (a) TWO PERIODS, NOT A TIME SERIES. There is no modelling of pre-existing trend. US teen crash rates
        were changing nationally over 2013-2017, and a 7% between-period difference is well inside the
        range of ordinary secular drift. foss2019 handled this with ARIMA; this paper did not.
    (b) THE CONTROL GROUP CONTAINS THE OTHER STUDIES' TREATED UNITS. "The rest of Virginia" includes
        Virginia Beach, Chesapeake, Henrico and Chesterfield — the jurisdictions vorona2011 and
        vorona2014 claim are differentially affected by start times. The control is not clean.
    (c) NO SLEEP MEASURED. The mediator is assumed, not observed. Fairfax County's own survey work
        (owens2019, same senior author, same county, overlapping years) shows school-night sleep was
        still well under 8 h after the change, so the dose delivered was small.
    (d) EFFECT IS 7% WITH A LOWER CI BOUND OF EXACTLY 1.00.
    (e) The largest subtype effect is distraction-related, not drowsiness-related.
    (f) Outcome is police-reported crashes of any severity, not injuries or deaths.
