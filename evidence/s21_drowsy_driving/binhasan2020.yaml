notes: >
  REQUIRED EXTRACTION #3 — this is the "newer replication" the task asked me to look for, and it is real.
  .
  VERBATIM QUOTE (abstract, PMID 31992393): "The crash rate per 1000 in 16- to 18-year-old licensed
  drivers in FC during T1 was significantly higher compared to T2, 31.63 versus 29.59 accidents per
  1,000 (95% confidence interval, 1.0-1.14, odds ratio 1.07, P = .03). In contrast, adolescent crash
  rates in the rest of Virginia were not statistically significantly different at T1 versus T2. With
  regard to subtypes of crashes, there was a trend toward significance in distraction-related crashes
  per 1,000 in FC at T1 compared to T2 at 7.01 versus 6.13 (95% confidence interval, 0.99-1.31, odds
  ratio 1.14, P = .05), but were not significantly different in the remainder of the state."
  METHODS, VERBATIM: "Virginia Department of Motor Vehicles crash data in drivers age 16 to 18 years old
  between September and June of each year in FC versus the rest of the state were compared in the
  combined 2-year periods preceding (2013-2014 and 2014-2015; T1) and following (2015-2016 and 2016-2017;
  T2) school start time change in the fall of 2015."
  .
  THE MAGNITUDE PROBLEM IN THE SST LITERATURE, STATED PLAINLY. Five analyses, same nominal direction,
  wildly different magnitudes:
    binhasan2020 (Fairfax pre-post, 50-min delay)                 RR ~1.07
    foss2019     (NC interrupted time series, 75-min delay)       RR ~1.16, p = .076 (not significant)
    vorona2014   (Henrico vs Chesterfield cross-section)          RR ~1.27-1.29
    vorona2011   (Virginia Beach vs Chesapeake cross-section)     RR ~1.28-1.41
    danner2008   (Kentucky county pre-post, 60-min delay)         RR ~1.17 (16.5% reduction)
  THE TWO DESIGNS WITH ACTUAL PRE-POST IDENTIFICATION (this one and foss2019) GIVE THE TWO SMALLEST
  ESTIMATES, and the two pure cross-sections give the two largest. That ordering is exactly what you
  expect if the cross-sectional estimates are inflated by between-place confounding. I use this pattern
  in injury_channel.md as evidence for a causal fraction near 0.5 rather than near 1.
  .
  DOSE CAVEAT (applies to the whole SST literature and is the reason none of it can be scaled up to this
  subject's exposure): a 50-75 min start-time delay buys adolescents perhaps 20-45 min more school-night
  sleep, not the 1.5-2.5 h that separates a 5.5-6 h sleeper from a 7.5-8 h sleeper. The SST studies
  therefore bound the effect of a SMALL dose change and cannot be linearly extrapolated to a large one.
  .
