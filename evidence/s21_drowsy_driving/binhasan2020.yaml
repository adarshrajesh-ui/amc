    from_figure: false
    inferred_from_ci: true
    direction_note: >
      POSITIVE = HARM from the EARLIER start time, i.e. the pre-change (earlier-start) period had 1.07x
      the crash odds of the post-change (later-start) period. A 7% effect. The lower CI bound is exactly
      1.00, so this is the weakest possible "significant" result (P = .03 as printed).
