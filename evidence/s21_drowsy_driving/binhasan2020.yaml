    ci: [0.000000, 0.131028]
    conversion_formula: >
      The paper reports OR 1.07 (95% CI 1.00-1.14), P = .03, for BEFORE vs AFTER.
      log_or = ln(1.07) = 0.067659; se = (ln(1.14) - ln(1.00))/3.92 = 0.033426;
