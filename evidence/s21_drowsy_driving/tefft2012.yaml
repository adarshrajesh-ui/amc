rob:
  tool: none
  judgement: na
  notes: >
    A PREVALENCE ESTIMATION EXERCISE, not a study of an exposure-outcome relation, so RoB tools do not
    apply; `tool: none` / `judgement: na`.
    THE CENTRAL METHODOLOGICAL QUESTION is whether the multiple-imputation model is right, and that cannot
    be checked from the abstract. The imputation assumes drowsiness is missing-at-random CONDITIONAL ON
    OBSERVED CRASH CHARACTERISTICS (time of day, crash configuration, road type, and so on). If drivers
    with unknown status are systematically LESS drowsy than the observed pattern predicts, 16.5% is too
    high. If they are systematically MORE drowsy — which is the more plausible direction, because the
    commonest reason drowsiness is unknown in a fatal crash is that the driver died and no witness survived,
    and single-occupant run-off-road-at-night crashes are exactly the drowsy signature — then 16.5% is too
    LOW. I judge the residual bias to point UPWARD but I cannot quantify it.
    SUPPORTING EXTERNAL VALIDATION, which is why I take the imputed figure seriously: an entirely
    independent method (PERCLOS video, owens2018_aaa) gives 8.8-9.5% for ALL crashes against this paper's
    7.0%, and a later application of the same imputation family to 2017-2021 FARS (tefft2024_aaa) gives
    17.6% for fatal crashes against this paper's 16.5%.
    Limitation for our purpose: NO AGE STRATIFICATION is reported in the abstract, so this record cannot
    tell us whether the drowsy share is higher for 16-19-year-olds. tefft2024_aaa says qualitatively that
    it is highest at 16-20.
funding: "AAA Foundation for Traffic Safety (author affiliation). Data from NHTSA (NASS GES, NASS CDS, FARS)."
notes: >
  REQUIRED EXTRACTION #4, second bullet, AND REQUIRED EXTRACTION #5. This is the single most important
  record for the "report BOTH and explain why" instruction, because the explanation is INSIDE THIS ONE
  PAPER rather than being a dispute between two camps.
  .
  VERBATIM QUOTE (abstract, PMID 22269499): "The proportion of motor vehicle crashes that involve a drowsy
  driver likely is greater than existing crash databases reflect, due to the possibility that some drivers
  whose pre-crash state of attention was unknown may have been drowsy. This study estimated the proportion
  of crashes that involved a drowsy driver in a representative sample of 47,597 crashes in the United
  States from 1999 through 2008 that involved a passenger vehicle that was towed from the scene. Multiple
  imputation was used to address missing data on driver drowsiness. In the original (non-imputed) data,
  3.9% of all crashes, 7.7% of non-fatal crashes that resulted in hospital admission, and 3.6% of fatal
  crashes involved a driver coded as drowsy; however, the drowsiness status of 45% of drivers was unknown.
  In the imputed data, an estimated 7.0% of all crashes (95% confidence interval: 4.6%, 9.3%), 13.1% of
  non-fatal crashes that resulted in hospital admission (95% confidence interval: 8.8%, 17.3%), and 16.5%
  of fatal crashes (95% confidence interval: 12.5%, 20.6%) involved a drowsy driver. Results suggest that
  the prevalence of fatal crashes that involve a drowsy driver is over 350% greater than has been reported
  previously."
  .
  THE ORDER-OF-MAGNITUDE EXPLANATION, WRITTEN OUT, SINCE THE TASK ASKED FOR IT EXPLICITLY.
  There are FOUR distinct reasons the police-reported figure (1.4-2.4%) and the research figures
  (7-17.6%) differ, and only the first is about statistics:
  (1) MISSING-DATA CODING. 45% of drivers in this sample had UNKNOWN drowsiness. Official statistics
      effectively code unknown as not-drowsy. Fixing only that raises fatal-crash prevalence from 3.6% to
      16.5%. This is most of the gap.
  (2) NO ROADSIDE TEST EXISTS. Alcohol has a breathalyzer; drowsiness has nothing. owens2018_aaa puts it
      exactly: "there is no test analogous to a breathalyzer that the police can administer at the
      roadside to assess a driver's level of drowsiness at or shortly after the time of a crash."
  (3) THE EVIDENCE DESTROYS ITSELF. A driver who was drowsy before the crash is fully awake after it, and
      may not recognise or may not volunteer that he was drowsy. In a fatal single-occupant crash there is
      no one left to ask.
  (4) REPORTING POLICY VARIES BY STATE AND AGENCY (stated in the GHSA report, ghsa2026), so the national
      FARS number is an aggregate of inconsistent local practice.
  NONE of these four is a reason to prefer the low number. All four bias the police figure DOWNWARD.
  I therefore use the research-based share (with the naturalistic estimate as a lower anchor) in
  injury_channel.md, and I report the police figure only as a floor.
  .
  n = 47,597, the number of crashes in the representative sample, quoted from the abstract.
  .
  DE-DUPLICATION: cohort_family NASS_GES_CDS_FARS_1999_2008. Overlaps in spirit but not in sample with
  tefft2024_aaa (CISS + FARS 2017-2021) and tefft2016_aaa / tefft2018 (NMVCCS 2005-2007). Same author,
  three different NHTSA sampling systems, three different periods. They are methodologically related and
  should not be treated as fully independent replications.
  .
  ACCESS: abstract_only (Elsevier paywall). Every number above is verbatim from PubMed.
