rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: >
    This is the ONLY study in existence that measures pre-crash driver drowsiness OBJECTIVELY in a
    general-population sample, so it is uniquely valuable and uniquely unreplicated.
    Strengths: (1) exposure is PERCLOS (percentage of eyelid closure) coded frame-by-frame from
    in-vehicle video of the final 1-3 minutes before each crash, by trained reductionists — no
    self-report, no post-hoc attribution, no police judgement; (2) 3,593 drivers monitored continuously
    for months in their own vehicles (SHRP2 NDS, Oct 2010-Dec 2013); (3) crash severity classified on an
    objective scale (delta-V, airbag deployment, property damage); (4) the sample was "generally
    representative of the driving public" apart from deliberate over-sampling of young and old drivers.
    Weaknesses: (1) NO FATAL CRASHES OCCURRED IN THE SHRP2 NDS, so the headline 9.5% CANNOT be
    extrapolated to fatal crashes — the authors say so explicitly, and this is the central limitation
    for our purposes because our outcome is death; (2) only 701 of 905 crashes were codable (23% excluded
    because the driver's eyes were not visible for >=75% of the window); (3) the 12%-of-frames PERCLOS
    threshold is a validated but arbitrary dichotomy, and the brief notes that a separate subjective
    6-second assessment identified additional drowsy drivers who did not meet it, so 9.5% is a floor for
    the PERCLOS-detectable phenomenon; (4) volunteers who consented to in-car cameras may not behave
    like the general population; (5) drowsiness at the moment of the crash does not establish that the
    drowsiness CAUSED the crash — this is a prevalence study with no control window, so it yields NO
    relative risk and NO odds ratio for drowsiness itself. That is the single most important thing to
    understand about it: it quantifies HOW COMMON drowsiness is in crashes, not HOW MUCH drowsiness
    RAISES crash risk.
funding: "AAA Foundation for Traffic Safety. Underlying SHRP2 NDS data collection federally funded via the Transportation Research Board / National Academy of Sciences."
notes: >
  REQUIRED EXTRACTION #4(b): the independent naturalistic-driving estimate that differs from NHTSA's
  counted figure by roughly an order of magnitude. Also supplies REQUIRED EXTRACTION #2's objective
  age-specific numbers.
  .
  VERIFICATION STATUS: agency research brief, no DOI, no PMID; Crossref/PubMed verification impossible,
  so status is UNVERIFIED. NOT secondhand — full text retrieved directly (HTTP 200) and stored at
  src/owens2018_aaa_brief.txt, sha256
  243f17585cde482717b4bbc1a19c9779a367cc73d9388f06cd55883cc2ae0c66. The work was presented at the 97th
  TRB Annual Meeting as an extended abstract (Owens et al. 2018) but I found no peer-reviewed journal
  version, so no VERIFIED substitute exists for these numbers.
  .
  WHY tier T4 AND design prospective_cohort_objective: drivers were enrolled and monitored prospectively
  with an OBJECTIVE exposure measure (video-derived PERCLOS). The estimand is a prevalence proportion
  rather than a hazard, which is why the effects are recorded on the `probability` scale with binomial
  SEs I computed myself from the published cell counts (arithmetic shown in each conversion_formula).
  .
  THE ORDER-OF-MAGNITUDE DISCREPANCY, IN THE BRIEF'S OWN WORDS AND NUMBERS:
    objective PERCLOS, all crashes            8.8% - 9.5%
    objective PERCLOS, police-reportable      10.6% - 10.8%
    NHTSA police reports, all crashes         1.4%
    NHTSA police reports, injury crashes      2.0%
    NHTSA police reports, fatal crashes       2.4%
  Ratio at comparable severity: 10.7 / 2.0 = 5.4x. Headline press ratio ("8 times") comes from
  comparing 10.8% with the 1.4% all-crash figure, which is not a like-for-like comparison. I use 5-7x as
  the honest range.
  .
  WHY THE TWO SOURCES DISAGREE — the brief's own explanation, which I accept: "Unlike impairment by
  substances such as alcohol, there is no test analogous to a breathalyzer that the police can
  administer at the roadside to assess a driver's level of drowsiness at or shortly after the time of a
  crash. Moreover, a driver who was drowsy before a crash may appear fully alert afterward and may be
  reluctant to volunteer to the police that he or she was drowsy. In the case of a driver who was not
  actually asleep at the time of the crash but was operating at a reduced level of alertness, the driver
  may not even recognize that he or she was drowsy nor that drowsiness may have contributed to the
  crash. In extreme cases, all relevant information about the driver's pre-crash state is lost if the
  driver is deceased and there are no passengers able to provide information about the driver's pre-crash
  state." The last sentence is critical: the undercount is WORST precisely for fatal crashes, which is
  our outcome.
  .
  CONVERGENT INDEPENDENT ESTIMATES CITED IN THE BRIEF (all model-based, none from this dataset):
  Masten et al. (2006) ~15% of drivers in fatal crashes drowsy; Tefft (2012) 7% of all reported crashes,
  13% of severe-injury crashes, 16.5% of fatal crashes. These bracket the AAA 2024 model estimate of
  17.6% of fatal crashes (see tefft2024_aaa) and Connor 2002's measured 19% PAR.
  .
  VERBATIM QUOTES:
  HEADLINE: "Using this measure, drowsiness was identified in 8.8%-9.5% of all crashes examined and
  10.6%-10.8% of crashes that resulted in significant property damage, airbag deployment, or injury."
  AGE TABLE (3-min PERCLOS, Table 2): "Total 589 56 (9.5) Driver Age 16 to 19 158 14 (8.9) 20 to 24 160
  18 (11.3) 25 to 34 63 5 (7.9) 35 to 49 35 4 (11.4) 50 to 64 59 1 (1.7) 65 to 74 39 5 (12.8) 75+ 75 9
  (12.0) Gender Male 266 26 (9.8) Female 323 30 (9.3) Lighting Conditions Daylight 408 25 (6.1)
  Dawn/Dusk 28 2 (7.1) Dark 153 29 (19.0) Crash Severity b Severe 76 5 (6.6) Moderate 110 15 (13.6)
  Total Police-Reportable c 186 20 (10.8) Minor 403 36 (8.9)"
  NON-SIGNIFICANCE BY AGE: "The proportion of crashes that involved drowsiness varied significantly in
  relation to lighting conditions (P < 0.001; Fisher's exact test), with drowsiness evident in over three
  times the proportion of crashes in darkness as in daylight. Also of note, more than half of all crashes
  that involved drowsiness occurred in darkness. Variation by age, sex, and crash severity was not
  statistically significant (all P > 0.20)."
  NO FATAL CRASHES: "The SHRP 2 NDS involved few crashes that resulted in severe injuries and no fatal
  crashes ... No fatal crashes occurred in the SHRP 2 NDS, so the results of the current study cannot be
  generalized directly to fatal crashes."
  WHY IT STILL BEARS ON FATAL CRASHES: "Of note, however, is the fact that crashes that occurred in
  darkness were more than three times as likely as those that occurred during daylight to involve
  drowsiness. While the proportion of crashes that occurred in darkness in the current study was similar
  to the corresponding proportion among all police-reported crashes nationwide (26%), the proportion of
  fatal crashes that occur in darkness is much higher, at 48% (NHTSA, 2017)."
  PERCLOS THRESHOLD IS A FLOOR: "Finally, it is possible that some drivers who did not meet the current
  study's criteria for classification as drowsy (i.e., eyes closed for 12 percent or more of the one- or
  three-minute coding window) may have nonetheless been drowsy at the times of crashes. In a more
  subjective assessment of drowsiness not included in the current study, data reductionists viewed only
  the final six seconds of video prior to each crash and coded drowsiness based only on obvious signs
  (e.g., yawning, rubbing eyes, slack musculature, etc.). In this more subjective assessment, a small
  number of additional drivers who did not meet the objective PERCLOS-based criteria for drowsiness were
  judged to have been drowsy at the times of crashes."
  YOUNG-DRIVER OVER-REPRESENTATION: "Drivers under age 25 accounted for more than half of all
  crash-involved drivers in the current study, compared with 23% of all crashes nationwide (NHTSA, 2017).
  However, the proportion of crashes found to involve drowsiness did not vary significantly by age in the
  current study; thus, the over representation of young drivers should not itself significantly influence
  the overall results."
  .
  DARK-VS-DAYLIGHT ARITHMETIC NOTE: the brief prints counts and percentages but no CI or test statistic
  other than "P < 0.001, Fisher's exact test". The recorded log risk ratio and its SE are MY OWN
  computation from the published cell counts (29/153 vs 25/408) using the standard delta-method formula
  for a log risk ratio from two independent binomials. Every input to that arithmetic is a number printed
  in the brief; nothing is imputed. The authors used Fisher's exact test rather than a normal
  approximation, so my normal-approximation interval is an approximation to their inference, not a
  reproduction of it.
  .
  NOTE ON AUTHORSHIP CONFUSION: the first author here is Justin M. OWENS (Virginia Tech Transportation
  Institute, naturalistic driving). This is a DIFFERENT PERSON from Judith A. OWENS (Boston Children's
  Hospital, paediatric sleep), who is first author of `owens2019` and a co-author of `binhasan2020` in
  this same shard. Do not merge them.
  .
  pct_female 54.1 = 379/701 from the 1-minute table (Male 322, Female 379).
