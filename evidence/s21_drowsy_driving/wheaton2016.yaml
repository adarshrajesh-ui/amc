      of interest — also had more infrequent seatbelt use, more riding with drinking drivers and more
      drinking and driving than 9-h sleepers. A U-shaped association with RISK BEHAVIOUR is the classic
      signature of confounding by an unmeasured third factor (household chaos, depression, substance use,
      truancy) rather than of a dose-dependent physiological effect of sleep duration. If short sleep caused
