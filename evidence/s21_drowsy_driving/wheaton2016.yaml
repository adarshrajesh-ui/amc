    direction_note: >
      DIRECTION: SHORT SLEEPERS WEAR SEATBELTS LESS. THIS IS THE MOST DAMAGING SINGLE FACT FOR THE
      INTERPRETATION OF THIS WHOLE CHANNEL, and it cuts in a specific and underappreciated way. Seatbelt
      non-use does not change the probability of CRASHING; it changes the probability of DYING GIVEN A CRASH.
      So a study that finds short sleepers have more fatal crashes cannot distinguish "sleep loss caused the
      crash" from "the kind of teenager who sleeps 6 h is the kind who does not belt up, so his crashes kill
      him more often". IIHS reports belt use among fatally injured 16-19-year-old drivers is well below
      universal, so there is ample room for this pathway to operate.
