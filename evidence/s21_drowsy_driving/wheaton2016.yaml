rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: >
    (1) CROSS-SECTIONAL, SELF-REPORTED EXPOSURE AND SELF-REPORTED OUTCOMES in the same questionnaire, so
        common-method variance is guaranteed. tier TX.
    (2) THE OUTCOMES ARE NOT CRASHES. They are self-reported risk BEHAVIOURS. This record contributes
        nothing to the magnitude of the mortality effect and everything to its interpretation.
    (3) NO EFFECT SIZES RETRIEVABLE. The abstract reports direction and significance only; the MMWR tables
        contain the prevalence ratios and I could not obtain them. Every effect here therefore has
        value 0 / se null, which is a deliberate representation of "direction known, magnitude not".
        A downstream model must NOT treat these as zero effects.
    (4) STRENGTH THAT JUSTIFIES KEEPING IT: n = 50,370 across four national YRBS waves, i.e. this is the
        nationally representative US high-school picture, which is exactly the population of interest, and
        the associations are consistent across all five behaviours and four survey years.
    (5) The U-shape in the >= 10 h group (see above) is itself evidence about the causal structure and is
        the single most useful thing in the record.
funding: "US Centers for Disease Control and Prevention (MMWR is a CDC publication)."
notes: >
  THIS RECORD EXISTS TO DISCHARGE THE TASK'S CRITICAL HONESTY REQUIREMENT: "Most drowsy-driving evidence is
  confounded: people who sleep less also drive more at night, drink more, and are younger. State how much of
  the association you think is causal and why." IT IS THE QUANTITATIVE BASIS, IN THE RIGHT POPULATION, FOR
  THAT CONCERN — and the CDC's own authors say so.
  .
  VERBATIM QUOTE (abstract, PMID 27054407): "To evaluate the association between self-reported sleep duration
  on an average school night and several injury-related risk behaviors (infrequent bicycle helmet use,
  infrequent seatbelt use, riding with a driver who had been drinking, drinking and driving, and texting
  while driving) among U.S. high school students, CDC analyzed data from 50,370 high school students (grades
  9-12) who participated in the national Youth Risk Behavior Surveys (YRBSs) in 2007, 2009, 2011, or 2013.
  The likelihood of each of the five risk behaviors was significantly higher for students who reported
  sleeping <=7 hours on an average school night; infrequent seatbelt use, riding with a drinking driver, and
  drinking and driving were also more likely for students who reported sleeping >=10 hours compared with 9
  hours on an average school night."
  THE AUTHORS' OWN CAUSAL STATEMENT, VERBATIM AND EXACTLY ON POINT: "Although insufficient sleep directly
  contributes to injury risk, some of the increased risk associated with insufficient sleep might be caused
  by engaging in injury-related risk behaviors."
  .
  HOW THIS SHAPES MY CAUSAL FRACTION, EXPLICITLY. Three separate things in this record argue for a causal
  fraction meaningfully below 1:
  (a) THE BUNDLE. Short-sleeping US high-school students drink and drive, ride with drinking drivers, skip
      seatbelts and text while driving, all significantly, all in a nationally representative sample. Some of
      the observed crash-mortality association in studies like tefft2016_aaa and pizza2010 must be these
      behaviours rather than vigilance.
  (b) THE SEATBELT CHANNEL IS ABOUT CASE-FATALITY, NOT CRASH RISK. It inflates the FATAL-crash association
      specifically, which is precisely the outcome this shard is pricing.
  (c) THE U-SHAPE FAILS THE NEGATIVE CONTROL. Long sleepers show the same risk behaviours. Physiological
      sleepiness cannot explain that; a third factor can.
  AGAINST all three, and the reason I do not push the causal fraction below about 0.3: gottlieb2018 adjusts
  for MILES DRIVEN and the association survives; martiniuk2013 adjusts for risky driving behaviour, substance
  use, psychological distress and hours driven per week and the RR only falls from 1.42 to 1.37 for its own
  exposure; and the mechanism has direct lab support in the vigilance literature plus direct observational
  support in PERCLOS video of eyes closing before crashes. So the association is not all confounding. I
  settle on 0.5 (0.25-0.8) and show the sensitivity.
  .
  ACCESS: abstract_only. n = 50,370 quoted from the abstract. age_range [14, 18] is the standard grade 9-12
  range and is inferred by me; the abstract prints grades, not ages, and I have not invented an age_mean.
shard: "s21_drowsy_driving"
