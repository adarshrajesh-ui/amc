rob:
  tool: ROBINS-I
  judgement: critical
  notes: >
    SAME DESIGN FLAW AS vorona2011, SAME TEAM, SAME DATA SOURCE, DIFFERENT COUNTIES. `design` is
    `cross_sectional` and `tier` is TX, NOT `quasi_experiment` / T2, because nothing changed anywhere in
    this study: two counties that already differed were compared.
    (1) NO INTERVENTION, NO PRE-POST. The identifying assumption is that Henrico and Chesterfield are
        exchangeable apart from school start time, supported only by an adult-crash-rate comparison and
        a congestion comparison.
    (2) N = 2 CLUSTERS. Any county-level difference — road mix, licensure age profile, share of teens
        who drive to school, enforcement, reporting thresholds, trip length — is perfectly confounded
        with start time. The p-values quantify Poisson noise in crash counts and nothing else.
    (3) NO SLEEP MEASURED, in either county, at any point.
    (4) OUTCOME-DEFINITION AND AGE-WINDOW FLEXIBILITY across the two study years (16-18 in 2009-2010,
        16-17 in 2010-2011) with the wider window non-significant.
    (5) THE PAPER'S OWN MECHANISM TEST POINTS THE WRONG WAY (run-off-road-right, see above).
    (6) The morning/afternoon crash-peak timing difference the authors offer as corroboration is exactly
        what foss2019 showed to be EXPOSURE DISPLACEMENT rather than drowsiness.
funding: "Not stated in the retrievable abstract."
notes: >
  REQUIRED EXTRACTION #3. This is the second of the "weak two-county comparisons" the task warned about,
  and I am recording it as such (TX, ROBINS-I critical) rather than as quasi-experimental evidence.
  .
  VERBATIM QUOTE (abstract, PMID 25325600): "Virginia Department of Motor Vehicles supplied
  de-identified aggregate data on weekday crashes and time-of-day for 16-18 year old (teen) and adult
  drivers for school years 2009-2010 and 2010-2011 in Henrico and Chesterfield Counties. Teen crash
  rates for counties with early versus later school start-times were compared using two-sample Z-tests
  and these compared to adult crash rates using pair-wise tests. RESULTS: Henrico teens manifested a
  statistically higher crash rate of 48.8/1000 licensed drivers versus Chesterfield's 37.9/1000
  (p = 0.04) for 2009-2010. For 2010-2011, HC 16-17 year old teens demonstrated a statistically
  significant higher crash rate (53.2/1000 versus 42.0/1000), while for 16-18 teens a similar trend was
  found, albeit nonsignificant (p = 0.09). Crash peaks occurred 1 hour earlier in the morning and 2
  hours earlier in the afternoon in Chesterfield, consistent with commute times. Post hoc analyses found
  significantly more run-off road crashes to the right (potentially sleep-related) in Chesterfield teens.
  Adult crash rates and traffic congestion did not differ between counties."
  .
  WHAT IT IS WORTH: the SIGN. Across five independent analyses (danner2008 Kentucky pre-post, vorona2011
  Virginia Beach/Chesapeake, this one, binhasan2020 Fairfax pre-post, foss2019 North Carolina ITS) the
  direction is the same. Consistency of sign across designs with different failure modes is worth
  something. What it is NOT worth is a magnitude: the implied effects range from about 6% (binhasan2020)
  to about 41% (vorona2011 2008), and no design in the set can adjudicate.
  .
  COHORT-FAMILY WARNING: cohort_family Virginia_DMV_SST is shared with vorona2011 (Virginia Beach /
  Chesapeake) and binhasan2020 (Fairfax County vs "the rest of Virginia", where "the rest of Virginia"
  INCLUDES Virginia Beach, Chesapeake, Henrico and Chesterfield). These three records draw on the same
  state administrative crash system and overlapping jurisdictions and are NOT independent replications.
  .
  ACCESS: abstract_only (Europe PMC returns 404 for PMC4224716; NCBI PMC serves a publisher restriction).
  n: null. The abstract gives rates per 1000 licensed drivers but not the licensed-driver counts, so I
  cannot state an n and have not invented one.
