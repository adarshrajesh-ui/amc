effects:
  - outcome_domain: comparator
    outcome_construct: expert_consensus_threshold_for_unfitness_to_drive
    exposure: {type: total_deprivation, dose_h: 2.0, referent_h: 7.5, duration_days: 1,
               contrast_label: "EXPERT CONSENSUS THRESHOLD: '<= 2 h of sleep in the preceding 24 h' = not fit to operate a motor vehicle"}
    scale: hours
    unit: "hours slept in the preceding 24 h at which a Delphi panel judged a healthy driver definitively unfit"
    value: 2.000000
    se: null
    ci: null
    conversion_formula: >
      Not an effect estimate. This is a CONSENSUS THRESHOLD reported as a number of hours, recorded on the
      `hours` scale so the downstream model can see where the expert community placed its bright line. There
      is no sampling distribution and se is null by construction, not by omission.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      LOWER = MORE IMPAIRED. RECORDED PRIMARILY AS A CALIBRATION RECORD, AND THE CALIBRATION CUTS AGAINST A
      LARGE EFFECT FOR THIS SUBJECT. A 15-member expert panel with two rounds of Delphi voting, working from
      a systematic review of 346 studies, was willing to declare unfitness only at <= 2 h of sleep in 24 h.
      The subject sleeps 5.5-6 h on weekdays, which is roughly three times that threshold. The panel's
      secondary, softer statement covers him: "most healthy drivers would likely be impaired with only 3 to
      5 hours of sleep during the prior 24 hours" — and even that softer band sits BELOW his habitual dose.
      This is the clearest available expert-community signal that 5.5-6 h habitual sleep is not regarded as
      an acute fitness-to-drive problem, whatever its statistical association with crash rates.
    covariates: []
    followup_years: null
    cohort_family: null
    quote: >
      'Drivers who have slept for two hours or less in the preceding 24 hours are not fit to operate a motor
      vehicle.'
  - outcome_domain: comparator
    outcome_construct: expert_consensus_probable_impairment_band
    exposure: {type: total_deprivation, dose_h: 4.0, referent_h: 7.5, duration_days: 1,
               contrast_label: "SOFTER CONSENSUS BAND: 'most healthy drivers would likely be impaired with only 3 to 5 hours of sleep during the prior 24 hours' (midpoint 4 h recorded)"}
    scale: hours
    unit: "hours slept in the preceding 24 h at which the panel expected probable impairment"
    value: 4.000000
    se: null
    ci: null
    conversion_formula: >
      Recorded as the midpoint of the published 3-5 h band. NOT AN EFFECT ESTIMATE and not a measurement;
      se null by construction.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      LOWER = MORE IMPAIRED. The 3-5 h band is where the panel expected impairment in most healthy drivers.
      NOTE THE ALIGNMENT WITH THE EPIDEMIOLOGY: tefft2016_aaa's acute odds ratios are 4.3 at 4-5 h and 11.5
      at < 4 h, but only 1.9 at 5-6 h and 1.3 at 6-7 h. The expert threshold and the crash data agree that
      the sharp non-linearity sits BELOW 5 h, i.e. below this subject's routine weekday sleep and at the
      level of his occasional 3-4 h pre-exam nights.
    covariates: []
    followup_years: null
    cohort_family: null
    quote: >
      Panelists further agreed that most healthy drivers would likely be impaired with only 3 to 5 hours of sleep
      during the prior 24 hours.
rob:
  tool: none
  judgement: na
  notes: >
    A DELPHI CONSENSUS STATEMENT, NOT A STUDY. RoB tools do not apply. `n_studies_pooled: 346` records the
    size of the underlying literature review, but no quantitative synthesis was performed — panellists were
    given abstracted studies and voted. So this record carries EXPERT OPINION, appropriately tiered TX.
    WHY IT IS STILL WORTH RECORDING: (a) the panel included the authors of several primary records in this
    shard (Tefft, Czeisler), so it tells me how the people who generated the crash odds ratios interpret
    their own numbers; (b) it is the only source that states an explicit dose threshold; (c) it is a
    CONSERVATIVE anchor produced by advocates for the drowsy-driving problem, which makes its conservatism
    informative — the panel had every incentive to set the bar high and set it at 2 h.
    LIMITATIONS: (i) opinion, not data; (ii) the question asked was about ACUTE sleep in the preceding 24 h,
    which is NOT this subject's exposure (he is a habitual short sleeper who is not acutely deprived relative
    to his own baseline on a typical school night); (iii) no adolescent-specific statement — adolescents need
    more sleep than adults, so an adult threshold understates their impairment at a given dose; (iv) a modified
    RAND/UCLA appropriateness process with 15 panellists is sensitive to panel composition.
funding: "National Sleep Foundation convened the panel. Individual panellist disclosures are in the full text, which I did not retrieve."
notes: >
  A CALIBRATION AND COMPARATOR RECORD. It contributes no effect estimate to the meta-analysis and is
  deliberately tiered TX.
  .
  VERBATIM QUOTES (abstract, PMID 28923267): "The National Sleep Foundation assembled a expert panel
  comprised of experts from the sleep community and experts appointed by stakeholder organizations. A
  systematic literature review identified 346 studies that were abstracted and provided to the panelists for
  review. A modified Delphi RAND/UCLA Appropriateness Method with 2 rounds of voting was used to reach
  consensus. ... After reviewing growing evidence of impairment and increased crash risk among drivers who
  obtained less than optimal sleep duration in the preceding 24 hours, the panelists recognized the need for
  public policy guidance as to when it is certainly unsafe to drive. Toward this end, the panelists agreed
  upon the following expert consensus statement: 'Drivers who have slept for two hours or less in the
  preceding 24 hours are not fit to operate a motor vehicle.' Panelists further agreed that most healthy
  drivers would likely be impaired with only 3 to 5 hours of sleep during the prior 24 hours. ... There is
  consensus among experts that healthy individuals who have slept for 2 hours or less in the preceding 24
  hours are too impaired to safely operate a motor vehicle."
  .
  WHY I INCLUDED A RECORD THAT ARGUES AGAINST MY OWN SHARD'S HEADLINE. The task asked me to price a channel
  that two red-team reviewers thought might dominate the subject's mortality. The honest finding is that it
  does not, and part of the reason is visible here: the sleep-medicine community's own consensus places the
  fitness-to-drive cliff at 2 h, and probable impairment at 3-5 h, while this subject sleeps 5.5-6 h on
  weekdays and 7-8 h at weekends and in holidays. His routine exposure sits ABOVE the band the field itself
  identifies as dangerous. His occasional 3-4 h pre-exam nights sit INSIDE it — and those, not his routine,
  are where tefft2016_aaa's large odds ratios (OR 3.0 for sleeping 2-3 h below one's own usual amount) apply.
  This is one of the two main reasons my central estimate is a few hundredths of a month rather than a few
  tenths.
  .
  ONE THING THIS RECORD DOES NOT LICENSE. It must not be read as saying 5.5-6 h is safe. The panel addressed
  ACUTE deprivation and fitness-to-drive policy, i.e. where to draw a legal-style bright line, not where
  crash risk begins to rise. Crash risk is continuous and gottlieb2018 finds it rising at 1.13 per hour of
  sleep lost with no threshold. A threshold suitable for declaring someone legally unfit is necessarily far
  more extreme than the point at which risk starts to increase measurably.
shard: "s21_drowsy_driving"
