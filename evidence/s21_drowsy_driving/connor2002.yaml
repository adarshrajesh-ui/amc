rob:
  tool: Newcastle-Ottawa
  judgement: low
  notes: >
    The best-designed study in this literature. Strengths: (1) population-based case-control with
    571 crash drivers where at least one occupant was hospitalised or killed — a HARD outcome, not
    self-report; (2) 588 controls recruited WHILE DRIVING ON PUBLIC ROADS, sampled to be representative
    of all time spent driving in the region during the study period, which is the correct
    exposure-proportional control sampling and makes the OR interpretable as a rate ratio; (3)
    concurrent measurement of sleepiness at the time of driving (Stanford Sleepiness Scale) rather than
    retrospective attribution; (4) adjustment for major confounders including alcohol.
    Weaknesses: (1) exposure is still self-reported and cases report after a serious crash, some from
    hospital, so recall and attribution bias remain — a driver who crashed may over-report having been
    sleepy; (2) the <=5 h contrast uses >5 h as the referent, so the referent contains 5-7 h sleepers
    and the estimate is diluted relative to a 7+ h referent; (3) single region (Auckland), 1998-1999,
    left-hand-traffic, so transportability of ABSOLUTE rates to the modern US is limited (the relative
    effects transport better); (4) no age-stratified estimates reported, so nothing here is specific to
    16-19 year olds; (5) CIs are wide (the 02:00-05:00 estimate spans 1.4 to 22.7).
funding: "Health Research Council of New Zealand; Accident Compensation Corporation; Auckland Medical Research Foundation (full statement not in abstract)."
notes: >
  PRIMARY TARGET #2 for this shard, and the study the task named. Its real numbers match what the task
  implied.
  .
  THE SINGLE MOST IMPORTANT HONESTY FINDING IN THIS RECORD, AND IT CUTS AGAINST THE SHARD'S THESIS:
  "No increase in risk was associated with measures of chronic sleepiness."
  This is the only study in the literature that measured BOTH acute and chronic sleepiness against a
  hard injury-crash outcome in the same population with exposure-proportional controls, and it found
  the acute measures strongly predictive (OR 2.7-8.2) and the CHRONIC measures NULL. Our subject's
  exposure is chronic. This is direct, high-quality, adverse evidence and it must not be buried.
  Combined with tefft2016_aaa BLOCK B (habitual 5-6 h -> null OR 1.4), TWO independent
  well-designed studies find that HABITUAL short sleep is a much weaker predictor of crash than ACUTE
  short sleep. The mechanism that kills is being sleepy on a particular drive, and a habitual 5-6 h
  sleeper is only sometimes in that state.
  .
  WHY THE 19% PAR MUST NOT BE APPLIED NAIVELY: the 19% is for "one or more of the acute sleepiness risk
  factors", which includes DRIVING BETWEEN 02:00 AND 05:00. Night-time driving is partly a lifestyle
  choice correlated with, but not caused by, short habitual sleep. Attributing the whole 19% to sleep
  duration would overstate the sleep-duration channel by a large and unquantified factor.
  .
  VERBATIM QUOTE (abstract, PMID 12003884): "PARTICIPANTS: 571 car drivers involved in crashes where at
  least one occupant was admitted to hospital or killed ("injury crash"); 588 car drivers recruited
  while driving on public roads (controls), representative of all time spent driving in the study region
  during the study period. ... RESULTS: There was a strong association between measures of acute
  sleepiness and the risk of an injury crash. After adjustment for major confounders significantly
  increased risk was associated with drivers who identified themselves as sleepy (Stanford sleepiness
  score 4-7 v 1-3; odds ratio 8.2, 95% confidence interval 3.4 to 19.7); with drivers who reported five
  hours or less of sleep in the previous 24 hours compared with more than five hours (2.7, 1.4 to 5.4);
  and with driving between 2 am and 5 am compared with other times of day (5.6, 1.4 to 22.7). No
  increase in risk was associated with measures of chronic sleepiness. The population attributable risk
  for driving with one or more of the acute sleepiness risk factors was 19% (15% to 25%). CONCLUSIONS:
  Acute sleepiness in car drivers significantly increases the risk of a crash in which a car occupant is
  injured or killed."
  .
  ACCESS: abstract_only. BMJ returns HTTP 403 to automated retrieval and PMC/NCBI return
  "The publisher of this article does not allow downloading of the full text in XML form" for PMC107904.
  Every number above is present verbatim in the quoted abstract. I did NOT extract anything from the
  body of the paper, and in particular I could not retrieve the full covariate list or the
  age-stratified analyses — recorded as a gap, not guessed.
  .
  n = 1159 = 571 cases + 588 controls.
  .
  SCHEMA MAPPING NOTE: population-based case-control study. The schema `design` enum has no
  `case_control` value; `cross_sectional` is nearest. tier T5 (analytic observational, self-reported
  exposure, no prospective follow-up). This is the LOWEST risk-of-bias study in the shard and the
  T5/cross_sectional labels understate it — the downstream model should weight it on the rob field, not
  on the tier.
shard: "s21_drowsy_driving"
