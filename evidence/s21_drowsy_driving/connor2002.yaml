    scale: log_or
    unit: null
    value: 0.993252
    se: 0.344369
    ci: [0.336472, 1.686399]
    conversion_formula: "log_or = ln(2.7) = 0.993252; se = (ln(5.4) - ln(1.4))/3.92 = 0.344369"
    from_figure: false
    inferred_from_ci: true
    direction_note: "POSITIVE = HARM. OR 2.7. THE MOST IMPORTANT SINGLE NUMBER IN THIS SHARD FOR A *SERIOUS* OUTCOME: unlike Tefft's culpability studies (all crash severities, no fatal crashes), the outcome here is an injury crash in which at least one occupant was ADMITTED TO HOSPITAL OR KILLED. Controls were sampled in proportion to time spent driving, so the OR estimates a rate ratio. Referent is >5 h, not 7+ h, so this contrast is DILUTED relative to Tefft's — the referent group contains 5-7 h sleepers."
