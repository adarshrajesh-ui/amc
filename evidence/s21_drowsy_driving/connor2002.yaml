    exposure: {type: other, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "driver self-rated ACUTELY sleepy (Stanford Sleepiness Scale 4-7) vs alert (SSS 1-3) at the time of driving"}
    scale: log_or
    unit: null
    value: 2.104134
    se: 0.448174
    ci: [1.223775, 2.980619]
    conversion_formula: "log_or = ln(8.2) = 2.104134; se = (ln(19.7) - ln(3.4))/3.92 = 0.448174"
    from_figure: false
    inferred_from_ci: true
    direction_note: "POSITIVE = HARM. OR 8.2. This is the largest well-measured sleepiness effect in the literature, BUT it is the effect of BEING SLEEPY AT THE WHEEL RIGHT NOW, not of habitually sleeping 5-6 h. It is the mediator, not the exposure. Using 8.2 for a chronic short sleeper would be a category error."
    covariates: ["age", "sex", "alcohol", "other major confounders"]
    followup_years: null
    cohort_family: "Auckland_car_crash_injury_study"
    quote: >
