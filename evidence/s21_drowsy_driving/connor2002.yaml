    scale: log_or
    unit: null
    value: 1.722767
    se: 0.710687
    ci: [0.336472, 3.122365]
    conversion_formula: "log_or = ln(5.6) = 1.722767; se = (ln(22.7) - ln(1.4))/3.92 = 0.710687"
    from_figure: false
    inferred_from_ci: true
    direction_note: "POSITIVE = HARM. OR 5.6 for the circadian trough hours, INDEPENDENT of self-rated sleepiness and hours slept. This is the exposure-timing channel: a sleep-restricted teenager who also drives at 03:00 stacks two effects. It is also the main reason the association is confounded — people who sleep less drive later."
