effects:
  - outcome_domain: exposure_measurement
    outcome_construct: fraction_of_baseline_driving_time_spent_observably_drowsy
    exposure: {type: descriptive, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "share of all BASELINE (non-crash) driving time in the SHRP2 naturalistic driving study during which the driver was observably drowsy by PERCLOS eyelid-closure coding"}
    scale: probability
    unit: "proportion of driving time"
    value: 0.015700
    se: null
    ci: null
    conversion_formula: >
      Reported directly: "researchers have also estimated that about 1.57% of baseline driving is drowsy."
      No interval is published in the GHSA report and I did not retrieve the underlying primary analysis,
      so se is null.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      THIS IS THE MISSING DENOMINATOR OF THE WHOLE FIELD AND IT IS THE MOST USEFUL SINGLE NUMBER IN THIS
      RECORD. Every other source reports what share of CRASHES involve drowsiness; this reports what share
      of DRIVING involves drowsiness. Having both lets me compute the drowsy-driving crash odds ratio from
      first principles, with no self-report and no police coding anywhere in it:
        OR = [0.095/(1-0.095)] / [0.0157/(1-0.0157)] = 0.104972 / 0.015950 = 6.58
      using owens2018_aaa's PERCLOS-observed 9.5% of crashes and this record's 1.57% of baseline driving.
      A drowsy-driving crash odds ratio of about 6.6, derived entirely from video of drivers' eyes, is the
      cleanest causal anchor available in this literature. I use it in Route 3 of injury_channel.md.
    covariates: []
    followup_years: null
    cohort_family: "SHRP2_NDS"
    quote: >
      researchers have also estimated that about 1.57% of baseline driving is drowsy. This means that at any given
      moment on the road, three out of every 200 people behind the wheel are driving drowsy.
