rob:
  tool: none
  judgement: na
  notes: >
    A PREVALENCE ESTIMATION EXERCISE, so RoB tools do not apply.
    STRENGTHS: (1) the largest relevant sample ever assembled — 208,727 passenger-vehicle drivers in
    152,174 fatal crashes (FARS census 2017-2021), with the imputation model built on 20,292 drivers in
    11,268 CISS in-depth investigations; (2) the model was VALIDATED by masking drowsiness in cases where
    it was actually known and comparing imputed to actual, which is the right check and is more than
    tefft2012 reported; (3) the estimate (17.6%) closely reproduces tefft2012's independent 16.5% on
    different data, a decade earlier, with a different imputation approach.
    WEAKNESSES: (a) GREY LITERATURE — no journal peer review, no DOI, no PMID, and I could not retrieve
    the full report, only the publisher's brief; (b) NO CONFIDENCE INTERVALS in the retrievable text, so
    every effect in this record has se null; (c) the whole estimate is model-based — nobody observed these
    208,727 drivers' eyelids, unlike owens2018_aaa; (d) motorcycles, large trucks and buses excluded, so
    it is not "all fatal crashes" in the strictest sense despite the wording; (e) the crucial
    age-stratified numbers exist in the full report but were not retrievable.
funding: "AAA Foundation for Traffic Safety. Underlying data from NHTSA (CISS and FARS)."
notes: >
  REQUIRED EXTRACTION #4, second bullet. This is the CURRENT best estimate of the drowsy share of US fatal
  crashes and the upper term in the order-of-magnitude comparison.
  .
  VERIFICATION AND PROVENANCE. No DOI or PMID exists for an AAA Foundation research brief, so `status` is
  UNVERIFIED. It is NOT secondhand for the numbers I extracted: I retrieved the publisher's own research-
  brief page from aaafoundation.org (HTTP 200) and stored the extracted text at
  src/tefft2024_aaa_drowsy_fatal.txt. I ALSO independently corroborated every headline number against the
  Governors Highway Safety Association's 2026 report (src/ghsa2026_wakeupcall.txt, record ghsa2026), which
  cites this brief and restates 17.6% and the 5,967 annual average. `access_tier` is abstract_only rather
  than full_text because I retrieved the brief-level summary, not the full report with its tables — three
  attempts at candidate PDF paths on aaafoundation.org returned HTTP 404.
  .
  VERBATIM QUOTES (publisher research brief, src/tefft2024_aaa_drowsy_fatal.txt):
  SCOPE: "The current study included data from 20,292 drivers of passenger vehicles in transport that were
  towed from the scenes of 11,268 unique crashes included in CISS in years 2017-2021. Data on drivers of
  passenger vehicles involved in fatal crashes were obtained from the NHTSA's Fatality Analysis Reporting
  System (FARS). The current study included data from 208,727 drivers of passenger vehicles involved in
  152,174 unique fatal crashes in years 2017-2021; drivers of other types of vehicles (e.g., large trucks,
  buses, motorcycles, etc.) were not examined."
  HEADLINE: "Results show that an estimated 17.6% of all fatal crashes in years 2017-2021 involved a drowsy
  driver. Over the 5-year study period, an estimated 29,834 people were killed in crashes that involved
  drowsy drivers. The percentage of fatal crashes involving drowsy driving remained approximately constant
  over the study period; however, the annual number of fatal drowsy driving crashes increased significantly
  over the study period due to a large increase in total annual fatal crashes."
  AGE AND SEX AND ALCOHOL: "In percentage terms, the proportion of fatal-crash-involved drivers who were
  drowsy was greatest among drivers aged 16-20; however, the largest number of drowsy drivers in crashes
  were aged 21-34. Men were significantly more likely than women to be drowsy, and men accounted for the
  vast majority of drowsy drivers involved in fatal crashes. Approximately two-thirds of drowsy drivers in
  fatal crashes had not been drinking alcohol (blood alcohol concentration, BAC = 0.00), however, one-third
  had non-zero BAC values. Drowsiness was significantly more prevalent among drivers who had been drinking
  than among those who had not. An estimated 17% of drivers with BAC of 0.01-0.07 and 20% of drivers with
  BAC >=0.08 were drowsy, compared with 11% of those who had not been drinking."
  TIMING: "The greatest number of fatal drowsy driving crashes occurred between 11:00 PM and 2:59 AM; the
  percentage of drivers who were drowsy was highest among those who crashed between the hours of 3:00 AM
  and 6:59 AM."
  THE OFFICIAL FIGURE THIS BRIEF IS ARGUING AGAINST, QUOTED IN THE BRIEF ITSELF: "The National Highway
  Traffic Safety Administration (NHTSA) states that 91,000 police-reported crashes resulting in 50,000
  injuries and 800 fatalities annually—amounting to approximately 1%-2% of all crashes, injuries, and
  deaths—involve drowsy driving; however, the contribution of drowsy driving in motor vehicle crashes is
  difficult to measure. Although reports by police officers who investigate crashes sometimes indicate that
  a driver was drowsy, data derived from these reports are widely regarded as substantial underestimates of
  the true scope of the problem."
  .
  THE TIMING POINT MATTERS FOR THIS SUBJECT AND IS WORTH SPELLING OUT. Drowsy fatal crashes concentrate at
  23:00-02:59 by COUNT and at 03:00-06:59 by PERCENTAGE. From iihs2024_fars, 35% of all teen crash deaths
  occur between 21:00 and 03:00. So the hours where teens die and the hours where drowsiness dominates
  overlap heavily. Separately, NMVCCS — the dataset behind the tefft2016_aaa and tefft2018 odds ratios —
  EXCLUDED midnight to 05:59 entirely. The best odds ratios available for this shard therefore come from a
  dataset that omitted the worst hours, which is a structural reason to treat those odds ratios as a floor.
  .
  n = 208,727, the number of FARS passenger-vehicle drivers analysed.
shard: "s21_drowsy_driving"
