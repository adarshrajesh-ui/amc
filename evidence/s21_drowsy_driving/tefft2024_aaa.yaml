    direction_note: >
      RECORDED DELIBERATELY AS A CONFOUNDING RECORD, NOT AS A HARM ESTIMATE. Drowsiness and alcohol
      CO-OCCUR: 20% of legally-drunk fatal-crash drivers were drowsy versus 11% of sober ones, and one
      third of drowsy drivers in fatal crashes had been drinking. Sleep-restricted young people also drink
