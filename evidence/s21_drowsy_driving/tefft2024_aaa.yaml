    conversion_formula: >
      Reported directly as "an estimated 17.6% of all fatal crashes in years 2017-2021 involved a drowsy
      driver". NO CONFIDENCE INTERVAL IS PUBLISHED IN THE RETRIEVABLE BRIEF, so se is null and I have not
      invented one.
      FOR ORIENTATION ONLY, NOT USED AS THE SE: tefft2012's comparable estimate of 16.5% carried a CI of
      12.5-20.6%, implying se ~0.021. If a downstream model needs a precision for 17.6%, borrowing that
      relative width (se ~0.022) is the least arbitrary choice available, but it would be an assumption,
