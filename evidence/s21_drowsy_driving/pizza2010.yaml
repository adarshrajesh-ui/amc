effects:
  - outcome_domain: mortality
    outcome_construct: self_reported_ever_car_crash
    exposure: {type: other, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "SELF-REPORTED 'BAD SLEEP' (subjective sleep quality) vs not; outcome = ever had at least one car crash; multivariate logistic model"}
    scale: log_or
    unit: null
    value: 0.641854
    se: 0.323140
    ci: [0.008499, 1.275209]
    conversion_formula: >
      Reported as "bad sleep (p = 0.047; odds ratio = 1.9)". No CI published.
      log_or = ln(1.9) = 0.641854.
      SE backed out from the p-value: z = |Phi^-1(0.047/2)| = 1.9863; se = 0.641854/1.9863 = 0.323140.
      ci = 0.641854 +/- 1.96 * 0.323140 = [0.008499, 1.275209], i.e. OR 1.01 to 3.58.
      This is an INFERRED SE.
    from_figure: false
    inferred_from_ci: true
    direction_note: >
      POSITIVE = HARM. OR 1.9 for poor subjective sleep quality. NOTE THE EXPOSURE IS SLEEP QUALITY, NOT
      SLEEP DURATION — this paper does not report a duration-based crash OR, which is why it cannot serve
      as the adolescent dose-response estimate this shard needs.
    covariates: ["male sex", "tobacco use", "sleepiness while driving", "and the other variables entered into the multivariate logistic model (driving frequency, night driving, stimulant/caffeine use, drug use)"]
    followup_years: null
    cohort_family: "Bologna_HS_2010"
    quote: >
      The logistic procedure established a significant predictive role of male sex (p < 0.0001; odds ratio = 3.3),
      tobacco use (p < 0.0001; odds ratio = 3.2), sleepiness while driving (p = 0.010; odds ratio = 2.1), and bad
      sleep (p = 0.047; odds ratio = 1.9) for the crash risk.
