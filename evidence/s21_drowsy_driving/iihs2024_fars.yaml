  # ============================================================================
  # BLOCK B — ALL-SEATING-POSITION OCCUPANT RATES (2023), which is what the task
  # literally asked for ("annual motor-vehicle death rate per 100,000 for US
  # males aged 16-19 and 20-24"). Reported for completeness; NOT used as the
  # denominator, because only DRIVER deaths are exposed to the subject's own sleep.
