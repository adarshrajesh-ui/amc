    unit: "deaths per 100,000 population per year"
    value: 14.600000
    se: 0.402400
    ci: [13.811296, 15.388704]
    conversion_formula: >
      IIHS "Fatality Facts 2023: Males and females" prints 14.6.
      Cross-check: 1,317 / 9,006,150 * 100,000 = 14.624. se = sqrt(1317)/9,006,150 * 100,000 = 0.40290.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      Descriptive. THE NUMBER THE TASK ASKED FOR, for males 16-19. It is roughly DOUBLE the female rate
      of 7.4. NOTE THE SCOPE LIMITS: passenger-vehicle occupants only — it EXCLUDES motorcyclists,
      pedestrians, bicyclists and large-truck occupants, so it is NOT the all-motor-vehicle death rate.
    covariates: []
    followup_years: 1.0
    cohort_family: "FARS"
    quote: >
      "| 16-19 | 9,006,150 | 1,317 | 14.6 | 8,596,938 | 632 | 7.4 | 17,603,088 | 1,950 | 11.1 |"
  - outcome_domain: baseline_risk
