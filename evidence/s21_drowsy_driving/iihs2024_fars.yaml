  # ============================================================================
  # BLOCK A — THE DENOMINATOR THE WHOLE SHARD RESTS ON.
  # Deaths of MALE PASSENGER-VEHICLE DRIVERS per 100,000 population, by single
  # year of age, 2024. These are the numbers used in injury_channel.md Step 1.
  # ============================================================================
  - outcome_domain: baseline_risk
    outcome_construct: male_passenger_vehicle_driver_death_rate_per_100k_population_age16
    exposure: {type: descriptive, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "US males aged 16, 2024: 123 passenger-vehicle DRIVER deaths in a population of 2,322,582"}
    scale: raw_units
    unit: "deaths per 100,000 population per year"
    value: 5.300000
    se: 0.477850
    ci: [4.363414, 6.236586]
    conversion_formula: >
      Rate printed directly by IIHS as 5.3. Cross-check: 123 / 2,322,582 * 100,000 = 5.295.
      se computed by me as a Poisson SE on the numerator: sqrt(123)/2,322,582 * 100,000 = 0.47785.
      ci = 5.3 +/- 1.96 * 0.47785. THIS SE REFLECTS ONLY SAMPLING NOISE IN A SINGLE YEAR'S DEATH COUNT.
      FARS is a CENSUS of fatal crashes, so the "real" uncertainty here is not sampling error at all — it
      is year-to-year variation and the question of which year to use. The Poisson SE is a reasonable
      stand-in for the latter (2020-2024 rates for teens moved between 17.0 and 19.9 per 100,000 overall).
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      Descriptive baseline hazard, not an exposure effect. Higher = more deaths.
    covariates: []
    followup_years: 1.0
    cohort_family: "FARS"
    quote: >
      "| 16 | 2,322,582 | 123 | 5.3 | 71 | 3.1 | ..."
  - outcome_domain: baseline_risk
