    unit: "deaths per 100,000 population per year"
    value: 17.400000
    se: 0.395500
    ci: [16.624820, 18.175180]
    conversion_formula: >
      IIHS prints 17.4. Cross-check: 1,937 / 11,126,811 * 100,000 = 17.409.
      se = sqrt(1937)/11,126,811 * 100,000 = 0.39560.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      Descriptive. THE NUMBER THE TASK ASKED FOR, for males 20-24. Note the ordering: OCCUPANT death rates
