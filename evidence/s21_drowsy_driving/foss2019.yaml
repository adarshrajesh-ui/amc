effects:
  - outcome_domain: mortality
    outcome_construct: teen_driver_crash_rate_level_shift_after_start_time_delay
    exposure: {type: other, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "AFTER a 75-min delay in high-school start time (07:30 -> 08:45, all public high schools in one North Carolina county) vs BEFORE; ARIMA interrupted time series; crashes of 16-17 y drivers on school-session days"}
    scale: log_rr
    unit: null
    value: -0.150823
    se: 0.085000
    ci: [-0.317423, 0.015778]
    conversion_formula: >
      The paper reports "a 14% downward shift in the time-series ... (p = .076)" and does not print a CI.
      log_rr = ln(0.86) = -0.150823.
      SE backed out from the reported two-sided p-value: z = |Phi^-1(0.076/2)| = 1.7744;
      se = |log_rr| / z = 0.150823 / 1.7744 = 0.085000.
      ci = -0.150823 +/- 1.96 * 0.085000 = [-0.317423, +0.015778], i.e. RR 0.73 to 1.02.
      This is an INFERRED SE, not a published one.
    from_figure: false
    inferred_from_ci: true
    direction_note: >
      NEGATIVE = BENEFIT from the later start (fewer crashes). Equivalently, the earlier start time
      carried RR 1/0.86 = 1.16 relative to the later one. NOT statistically significant at 0.05
      (p = .076); the CI includes no effect.
    covariates: ["3 matched comparison counties with comparable urban-rural population distribution", "restricted to days when school was in session", "ARIMA modelling of trend, seasonality and autocorrelation"]
    followup_years: null
    cohort_family: "NC_SST_Foss"
    quote: >
      In the intervention county, there was a 14% downward shift in the time-series following the 75 min delay in
      school start times (p = .076). There was no change approaching statistical significance in any of the other
      three counties.
  - outcome_domain: mortality
    outcome_construct: teen_driver_crash_rate_by_clock_hour_after_start_time_delay
    exposure: {type: other, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "07:00-07:59 crashes AFTER vs BEFORE the 75-min delay: -25%"}
    scale: log_rr
    unit: null
    value: -0.287682
    se: 0.108475
    ci: [-0.500292, -0.075072]
    conversion_formula: >
      log_rr = ln(0.75) = -0.287682. p = .008 -> z = 2.6521; se = 0.287682/2.6521 = 0.108475.
    from_figure: false
    inferred_from_ci: true
    direction_note: >
      NEGATIVE = fewer crashes in the 07:00 hour after the delay. THIS IS NOT A DROWSINESS EFFECT.
      It is EXPOSURE DISPLACEMENT: teens stopped driving to school at 07:00 and started driving at 08:00
      instead. See the companion effect below, which is almost exactly equal and opposite.
    covariates: []
    followup_years: null
    cohort_family: "NC_SST_Foss"
    quote: >
      Crashes from 7 to 7:59 am decreased sharply (-25%, p = .008), but increased similarly from 8 to 8:59 am
      (21%, p = .004).
  - outcome_domain: mortality
    outcome_construct: teen_driver_crash_rate_by_clock_hour_after_start_time_delay
    exposure: {type: other, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "08:00-08:59 crashes AFTER vs BEFORE the 75-min delay: +21%"}
    scale: log_rr
    unit: null
    value: 0.190620
    se: 0.066230
    ci: [0.060810, 0.320431]
    conversion_formula: >
      log_rr = ln(1.21) = 0.190620. p = .004 -> z = 2.8782; se = 0.190620/2.8782 = 0.066230.
    from_figure: false
    inferred_from_ci: true
    direction_note: >
      POSITIVE = MORE crashes in the 08:00 hour after the delay. Crashes MOVED with the commute; they
      were not eliminated. -25% at 07:00 and +21% at 08:00 nearly cancel. THIS IS THE SINGLE MOST
      IMPORTANT NUMBER IN THE WHOLE SCHOOL-START-TIME LITERATURE FOR OUR PURPOSE, because it shows the
      mechanism is largely traffic-exposure timing, not sleep.
    covariates: []
    followup_years: null
    cohort_family: "NC_SST_Foss"
    quote: >
      Crashes from 7 to 7:59 am decreased sharply (-25%, p = .008), but increased similarly from 8 to 8:59 am
      (21%, p = .004).
  - outcome_domain: mortality
    outcome_construct: teen_driver_crash_rate_by_clock_hour_after_start_time_delay
    exposure: {type: other, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "14:00-14:59 crashes AFTER vs BEFORE the 75-min delay: -48%"}
    scale: log_rr
    unit: null
    value: -0.653926
    se: 0.187869
    ci: [-1.022150, -0.285703]
    conversion_formula: >
      log_rr = ln(0.52) = -0.653926. Paper reports "p = .000"; I used p = .0005 as a conservative
      stand-in (a smaller assumed p would give a SMALLER se, so this choice widens the interval rather
      than narrowing it). z = 3.4808; se = 0.653926/3.4808 = 0.187869.
    from_figure: false
    inferred_from_ci: true
    direction_note: >
      NEGATIVE = far fewer crashes in the 14:00 hour after the delay. Again exposure displacement: the
      afternoon dismissal moved to 15:00, where crashes rose +32% (p = .024). The AFTERNOON pattern
      cannot be a sleep-restriction effect at all — nobody is more rested at 15:00 because school
      started at 08:45 rather than 07:30 that same morning by any mechanism other than sleep, and the
      crashes simply relocated by one hour.
    covariates: []
    followup_years: null
    cohort_family: "NC_SST_Foss"
    quote: >
      Crashes from 2 to 2:59 pm declined dramatically (-48%, p = .000), then increased to a lesser degree from 3
      to 3:59 pm (32%, p = .024) and non-significantly from 4 to 4:59 (19%, p = .102).
