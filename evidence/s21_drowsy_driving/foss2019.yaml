      or nighttime crashes, when drowsiness-induced crashes might have been expected to be most common."
      I have recorded value 0 with se: null to represent a reported NULL, and I have NOT invented an SE.
      A downstream model must treat this as qualitative, not as a precise zero.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      REPORTED NULL. This is a FALSIFICATION TEST OF THE DROWSINESS MECHANISM AND THE MECHANISM FAILED
      IT in the best-designed study available. If later start times reduced crashes by reducing sleep
      debt, the benefit should show up in the drowsiness-dense hours (night and 03:00-06:59). It did not.
    covariates: []
    followup_years: null
    cohort_family: "NC_SST_Foss"
    quote: >
      There was no meaningful change in early morning or nighttime crashes, when drowsiness-induced crashes might
      have been expected to be most common.
rob:
  tool: ROBINS-I
  judgement: moderate
  notes: >
    THIS IS THE BEST-IDENTIFIED SCHOOL-START-TIME CRASH STUDY IN EXISTENCE and it is the only one in
    this shard I am willing to call `quasi_experiment` / T2.
    STRENGTHS: (1) a real, sharp, county-wide intervention (07:30 -> 08:45, 75 min, all public high
    schools at once); (2) ARIMA INTERRUPTED TIME SERIES rather than a two-group cross-section, so
    pre-existing level and trend are modelled explicitly; (3) THREE matched comparison counties, none
    of which showed any change approaching significance — a genuine placebo test that passed;
    (4) analysis restricted to 16-17 y drivers on school-session days, which is the population and the
    days where the intervention can act; (5) the authors ran the hour-by-hour decomposition that
    distinguishes the two candidate mechanisms, and reported the answer that undercuts their own
    headline.
    LIMITATIONS: (1) the headline effect is NOT significant (14%, p = .076) — with one treated cluster
    the effective n for the intervention is 1; (2) sleep was never measured, so even the 14% is not tied
    to sleep; (3) crash counts, not injury or death counts — the severity mix could differ;
    (4) a single county in one state, so external validity to a national teen is unestablished;
    (5) the inferred SEs in this record come from published p-values, not published intervals.
funding: "Not stated in the retrievable abstract."
notes: >
  REQUIRED EXTRACTION #3, and the record that should DOMINATE how the downstream model reads that
  requirement. The task said "several of these are weak two-county comparisons and you should say so".
  This one is NOT that; it is the one with real identification. And what it finds is a small, borderline
  reduction whose hour-by-hour signature points at TRAFFIC-EXPOSURE DISPLACEMENT rather than at sleep.
  .
  THE AUTHORS' OWN INTERPRETATION, VERBATIM (abstract, PMID 29706226): "Further analysis indicated
  marked, statistically significant shifts in hourly crash rates in the intervention county, reflecting
  effects of the change in school start time on young driver exposure. Crashes from 7 to 7:59 am
  decreased sharply (-25%, p = .008), but increased similarly from 8 to 8:59 am (21%, p = .004). Crashes
  from 2 to 2:59 pm declined dramatically (-48%, p = .000), then increased to a lesser degree from 3 to
  3:59 pm (32%, p = .024) and non-significantly from 4 to 4:59 (19%, p = .102). There was no meaningful
  change in early morning or nighttime crashes, when drowsiness-induced crashes might have been expected
  to be most common."
  AND THE HEADLINE, VERBATIM: "In the intervention county, there was a 14% downward shift in the
  time-series following the 75 min delay in school start times (p = .076). There was no change
  approaching statistical significance in any of the other three counties."
  AND THE AUTHORS' OWN CONCLUSION, VERBATIM: "Later high school start times (>8:30 am) appear to be
  associated with lower adolescent driver crash rates, but additional research is needed to confirm this
  and to identify the mechanism by which this occurs (reduced drowsiness or reduced exposure)."
  AND ON THE PRIOR LITERATURE, VERBATIM: "All these studies, including the present one, have
  limitations, but the similar findings suggest that crashes and school start times are indeed related,
  with earlier start times equating to more crashes."
  .
  WHY THIS MATTERS FOR THE CAUSAL FRACTION IN injury_channel.md. The school-start-time literature is
  the ONLY quasi-experimental leverage anyone has on this question. If the best-identified member of
  that literature finds (a) a non-significant total effect and (b) an hour-by-hour pattern consistent
  with exposure displacement and INCONSISTENT with drowsiness, then the school-start-time evidence
  cannot be used to argue that the observational sleep-crash associations are mostly causal. I use this
  record as the primary reason to hold the causal fraction near 0.5 rather than near 1.0.
  .
  A CAVEAT IN THE OTHER DIRECTION, STATED FAIRLY: the null in night/early-morning hours is a null over
  small counts in one county, so it is weak evidence of absence rather than strong. And a start-time
  delay is a poor instrument for our exposure: it moves sleep by perhaps 20-30 min on school nights,
  not by the 1.5-2.5 h that separates this subject from a 7-8 h sleeper. A small, noisy effect from a
  small dose shift is not evidence against a larger effect from a larger dose shift. What it does rule
  out is the strong claim that most teen crashes are sleep-driven.
  .
  ACCESS: abstract_only. Elsevier full text is paywalled; I retrieved the complete structured abstract
  from PubMed (efetch) and every number in this record is quoted verbatim above from it. I did not see
  the ARIMA tables, so I cannot report model coefficients or exact CIs, only the percentages and
  p-values the abstract prints.
  .
  n: NOT REPORTED in the abstract as a count of drivers or crashes; set to null rather than guessed.
shard: "s21_drowsy_driving"
