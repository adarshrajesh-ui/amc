rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: >
    Design strengths: (1) nationally representative probability sample of police-reported crashes
    (NMVCCS) in which at least one passenger vehicle was towed and EMS was dispatched, with
    on-scene investigation by specially trained multidisciplinary teams rather than routine police
    reporting; (2) sleep in the past 24 h reconstructed from reported start/end times of every sleep
    interval >30 min, then internally cross-checked against the last sleep interval and time since
    waking, with inconsistencies recomputed; (3) quasi-induced-exposure ("culpability") design, which
    means the odds ratio approximates an exposure-based RATE RATIO rather than a prevalence contrast;
    (4) four-way sensitivity analysis (unmatched/matched x two case definitions) reported in full.
    .
    Weaknesses that matter for this shard:
    (a) CRASHES BETWEEN MIDNIGHT AND 05:59 WERE EXCLUDED FROM NMVCCS ENTIRELY. Those are the hours
        in which drowsy crashes concentrate (Tefft 2024: most fatal drowsy crashes 23:00-02:59, highest
        drowsy PERCENTAGE 03:00-06:59). The author states this makes the study an UNDERestimate. This
        is the single most important bias and it points UPWARD.
    (b) Exposure is self-reported by a driver who has just crashed and may face liability; recall and
        social-desirability bias are plausible in both directions.
    (c) Culpability assignment ("critical reason") is an investigator judgement made with knowledge of
        the crash circumstances, so it is not blind to time of day or single-vehicle configuration —
        the very features that co-vary with drowsiness. This inflates the association.
    (d) The habitual-sleep bins are extremely sparse (13, 30 and 102 drivers in the <4, 4-5 and 5-6 h
        cells respectively) and the habitual analysis is internally incoherent (usual <4 h gives
        OR 0.8, and 0.1 in the matched analysis).
    (e) Grey literature: no journal peer review, no DOI, no PMID. The acute-sleep analysis was
        subsequently peer-reviewed and published as tefft2018 (PMID 30239905), where the 4 h estimate
        fell from 4.3 to 2.9 and the <4 h estimate rose from 11.5 to 15.1 — so the specific point
        estimates in this report are not stable across peer review.
funding: "AAA Foundation for Traffic Safety (501(c)(3); funding from AAA/CAA motor clubs, club members, insurance companies). Data collected by NHTSA."
notes: >
  PRIMARY TARGET #1 for this shard. This is the report the task described as "the most directly usable
  numbers in existence for this question", and that description is correct — it is the only source that
  reports crash rate ratios in exactly the 4-5 h / 5-6 h / 6-7 h bins the task asked for.
  .
  VERIFICATION STATUS — READ THIS. This is an AGENCY TECHNICAL REPORT. It has no DOI and no PMID, so
  Crossref and PubMed verification are not possible and `status` is UNVERIFIED, not VERIFIED. It is
  NOT secondhand: I retrieved the full PDF directly from the publisher's own domain
  (aaafoundation.org), HTTP 200, and stored the extracted text at
  src/tefft2016_aaa_acutesleep.txt (sha256 b392f20b4ef17ecd25ccea7c5ca95ffb180ab3aed00b464b9102d75ddc15f52b).
  A second copy retrieved from the 2017 upload path is stored at src/tefft2016_aaa_acutesleep_v2017.txt
  (sha256 9357f4adbf6547b6f11c8385e0991fd704ef356e02f4d197bc0136aae2dbb1b1); the two agree on every
  number extracted here. Under gate G2, the PEER-REVIEWED TWIN `tefft2018` (VERIFIED) should carry the
  acute-sleep effects in the primary model; this record should carry only the HABITUAL-sleep and
  DEVIATION-FROM-USUAL effects, which tefft2018 does not report.
  .
  DE-DUPLICATION WARNING: `tefft2016_aaa` and `tefft2018` ANALYSE THE SAME 6,845-7,234 DRIVERS FROM THE
  SAME NMVCCS 2005-2007 SAMPLE. They are ONE dataset, not two. cohort_family: NMVCCS_2005_2007 on both.
  Averaging them is double-counting.
  .
  THE CENTRAL FINDING OF THIS RECORD, STATED PLAINLY: the acute and habitual analyses of the same data
  disagree by a factor of ~2 at the subject's dose.
    acute    5-6 h in past 24 h  -> OR 1.9 (1.3-2.6)   SIGNIFICANT
    habitual usual 5-6 h daily   -> OR 1.4 (0.5-3.6)   NULL
  The subject is a habitual 5-6 h weekday sleeper who is not acutely deprived relative to his own
  baseline on a typical Tuesday. Using 1.9 for him is the optimistic-for-harm reading; 1.4 is the
  like-for-like reading. I carry both forward and use 1.4-1.9 as the range in injury_channel.md.
  .
  EXPOSURE PREVALENCE IN THE SOURCE POPULATION (weighted column %, all 7,234 drivers), useful for PAF
  arithmetic: past-24-h sleep <4:00 1.4%, 4:00-4:59 0.9%, 5:00-5:59 1.4%, 6:00-6:59 7.9%, >=7:00 88.4%.
  USUAL daily sleep: <4:00 0.3%, 4:00-4:59 0.4%, 5:00-5:59 1.2%, 6:00-6:59 5.6%, >=7:00 92.5%.
  Note how rare habitual short sleep is in this driving population — 1.2% at 5-6 h — which is why the
  habitual CIs are so wide.
  .
  AGE STRUCTURE (all drivers, weighted %): 14-17 5.5%, 18-20 11.4%, 21-24 11.3%, 25-34 21.3%,
  35-54 30.2%, 55-64 10.0%, 65-74 6.3%, 75+ 4.0%. So ~28% of the sample is under 25 and the ORs are
  ADJUSTED for age; no age-stratified sleep ORs are reported, which is this record's key gap for us.
  .
  VERBATIM QUOTES SUPPORTING THE NUMBERS ABOVE:
  BLOCK A: "After adjustment for driver age, relation to intersection, time of day, and recent change
  in sleep schedule, drivers who reported having slept for less than 4 hours in the past 24 hours had
  an estimated 11.5 times the odds of having contributed to the crash in which they were involved,
  compared with drivers who reported having slept for 7 or more hours in the past 24 hours (Odds Ratio
  [OR] 11.5; 95% Confidence Interval [CI] 2.9 - 45.7) (Figure 1). Drivers who reported having slept for
  4:00 - 4:59, 5:00 - 5:59, and 6:00 - 6:59 had 4.3 (CI 2.2 - 8.3), 1.9 (CI 1.3 - 2.6), and 1.3 (CI
  1.1 - 1.7) times the odds, respectively, of having contributed to the crash in which they were
  involved compared with drivers who had slept for 7 hours or longer."
  BLOCK B: "Drivers who reported usually sleeping for between 4 and 5 hours daily had an estimated 5.4
  (CI 1.6 - 17.6) times the odds of having contributed to the crash in which they were involved
  compared with drivers who reported usually sleeping for 7 hours or longer (Figure 2). Odds ratios
  associated with usually sleeping for less than 4 hours, 5-6 hours, and 6-7 hours daily were not
  statistically significant." [Table 3, unmatched, critical-reason: "Usual daily hours of sleep ...
