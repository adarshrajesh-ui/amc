    conversion_formula: >
      Reported as a point figure with no interval: 2.4% of crashes that resulted in a death, years
      2011-2015. This is a CENSUS TABULATION of a coded field, not an estimate, so no sampling interval
      exists; se is null and inventing one would misrepresent the quantity.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      Descriptive. THIS IS THE LOW TERM IN THE ORDER-OF-MAGNITUDE COMPARISON THE TASK ASKED FOR.
      2.4% here versus 16.5% (tefft2012) and 17.6% (tefft2024_aaa) — a ratio of about 7x. THE LOW NUMBER
      SHOULD NOT BE READ AS A COMPETING ESTIMATE OF THE TRUTH. It is a count of how often a police officer
      wrote "drowsy" on a form, in a system where the officer never observed the driver before the crash,
      where 45% of drivers' drowsiness status is coded unknown (tefft2012), where unknown is effectively
      treated as not-drowsy, and where reporting policy varies by state. Every one of those features biases
      it DOWNWARD.
