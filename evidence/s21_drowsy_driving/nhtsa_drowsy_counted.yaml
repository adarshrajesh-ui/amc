rob:
  tool: none
  judgement: na
  notes: >
    THIS RECORD IS SECONDHAND AND I AM MARKING IT AS SUCH RATHER THAN PRETENDING OTHERWISE.
    I attempted direct retrieval from nhtsa.gov (HTTP 403, blocked) and from
    crashstats.nhtsa.dot.gov/Api/Public/ViewPublication (HTTP 404 for the publication ID I tried). I could
    not obtain an NHTSA-published document. Every number in this record is therefore a VERBATIM QUOTATION
    OF NHTSA FIGURES AS PRINTED IN THREE INDEPENDENT SECONDARY SOURCES that I did retrieve directly
    (owens2018_aaa, tefft2024_aaa, ghsa2026). Two of those three are AAA Foundation documents arguing that
    the NHTSA figures are too low — i.e. they have an interest in quoting them accurately and low, and they
    agree with the GHSA, a different organisation. I judge the transcription reliable. But the primary
    source is unverified and `access_tier: secondhand` reflects that.
    The substantive point is not a bias in the counting: it is that a COUNT OF A CODED FIELD is not an
    ESTIMATE OF A PREVALENCE when 45% of the field is missing.
funding: "US Department of Transportation (NHTSA). Secondary sources: AAA Foundation for Traffic Safety; Governors Highway Safety Association."
notes: >
  REQUIRED EXTRACTION #4, second bullet — the task said "NHTSA's counted figure and the independent
  naturalistic-driving estimates differ by roughly an order of magnitude - report BOTH and explain why."
  This record is the "counted figure" half. The other half is in tefft2012, tefft2024_aaa and
  owens2018_aaa. THE TASK'S CHARACTERISATION IS CORRECT: the ratio is 7x on the share of fatal crashes
  (2.4% vs 17.6%) and 9.4x on the annual death count (633 vs 5,967 to 6,326).
  .
  VERBATIM QUOTES, WITH THEIR SOURCES:
  FROM owens2018_aaa (src/owens2018_aaa_brief.txt): "The results of this study stand in stark contrast to
  official statistics published by the National Highway Traffic Safety Administration (NHTSA), which report
  that driver drowsiness was involved in an estimated 1.4% of all police reported crashes nationwide, 2.0%
  of crashes that resulted in injuries and 2.4% of crashes that resulted in a death in years 2011-2015
  (National Center for Statistics & Analysis, 2017)."
  FROM tefft2024_aaa (src/tefft2024_aaa_drowsy_fatal.txt): "The National Highway Traffic Safety
  Administration (NHTSA) states that 91,000 police-reported crashes resulting in 50,000 injuries and 800
  fatalities annually—amounting to approximately 1%-2% of all crashes, injuries, and deaths—involve drowsy
  driving; however, the contribution of drowsy driving in motor vehicle crashes is difficult to measure.
  Although reports by police officers who investigate crashes sometimes indicate that a driver was drowsy,
  data derived from these reports are widely regarded as substantial underestimates of the true scope of the
  problem."
  FROM ghsa2026 (src/ghsa2026_wakeupcall.txt): "In 2023 (the most recent year for which data are
  available), FARS indicated that 1.5% of fatal crashes involved a drowsy driver and 1.8% of drivers in
  fatal crashes were either 'drowsy, asleep, fatigued, ill or black[ed] out.' Using these data, NHTSA
  reported that 633 people were killed in drowsy driving crashes in 2023."
  AND: "Police reports, from which the FARS data are derived, substantially underestimate drowsy driving
  because officers have no direct observation of drivers before they crash and states and localities have
  different policies on how to report suspected drowsy driving. As a result, the national raw FARS numbers
  are a substantial undercount of the total prevalence of drowsy driving among all traffic fatalities."
  AND THE ARITHMETIC OF THE GAP, ALSO FROM ghsa2026: "Applying this estimate to the FARS fatality totals
  for 2017-2021 yields an annual drowsy driving fatality average of 5,967. ... Assuming the same proportion
  of fatalities in 2023 involved drowsy driving, there would have been 6,326 roadway deaths in 2023 caused
  by drowsy driving. This is ten times more than the raw FARS data reported by NHTSA."
  .
  WHICH NUMBER I USE, AND WHY. I use the model-based share (17.6%, with 7-13% as lower anchors from
  all-crash and injury-crash data) in injury_channel.md, and I report 1.5-2.4% only as an explicit FLOOR
  scenario. The reason is not that the higher number is more convenient — it is that the low number is
  arithmetically incapable of being a prevalence estimate. tefft2012 shows within a single dataset that
  the identical data give 3.6% when unknowns are coded as not-drowsy and 16.5% when they are imputed, and
  45% of drivers were unknown. If I used 2.4% I would be asserting that essentially none of the 45%
  unknown drivers were drowsy, which nothing supports.
  HOW MUCH THIS CHOICE MOVES THE ANSWER: in Route 2 of injury_channel.md, substituting 2.4% for 17.6%
  reduces the life-expectancy loss from about 0.034 months to about 0.005 months, i.e. by a factor of 7.
  That single choice is the largest discrete fork in the whole calculation and I have reported both ends.
