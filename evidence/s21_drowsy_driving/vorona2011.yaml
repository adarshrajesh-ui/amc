rob:
  tool: ROBINS-I
  judgement: critical
  notes: >
    THIS IS NOT A QUASI-EXPERIMENT AND I HAVE DELIBERATELY NOT LABELLED IT AS ONE. It is a
    CROSS-SECTIONAL ECOLOGICAL COMPARISON OF TWO CITIES, which is why design is `cross_sectional` and
    tier is TX rather than T2. Nothing changed; the authors compared two places that already differed.
    (1) NO PRE-POST, NO INTERVENTION. There is no start-time change anywhere in this study. The entire
        identifying assumption is that Virginia Beach and Chesapeake are exchangeable apart from school
        start time. The authors support this only with a demographic-similarity assertion and a traffic
        congestion comparison.
    (2) N = 2 CLUSTERS. With two units there is no way to distinguish the start-time difference from any
        other city-level difference: road geometry, speed limits, urban/suburban mix, military-base
        commuting patterns (both cities are in the Hampton Roads Navy area), enforcement intensity,
        crash-reporting thresholds, average trip length, or the share of teens who drive to school at all.
        The reported CIs quantify Poisson noise in crash counts and NOTHING ELSE. They are not confidence
        intervals for a causal effect.
    (3) NO SLEEP MEASUREMENT AT ALL. The proposed mediator was never measured in either city. The paper's
        own conclusion concedes this: "Future studies using individual level data may clarify if sleep
        restriction, circadian dyssynchrony, and sleep inertia MIGHT contribute."
    (4) The one piece of mechanism evidence — that the morning crash peak occurred an hour earlier in
        Virginia Beach — is equally consistent with pure EXPOSURE SHIFT (more teens on the road at a
        given clock hour) as with drowsiness, and exposure shift is what foss2019 actually found when it
        tested the two explanations against each other.
    (5) Denominator is LICENSED DRIVERS, not miles driven. If teens in the early-start city drive more
        (e.g. because bus service or school choice differs), the whole difference is exposure.
    (6) The effect size is not stable across the two available years (1.41 in 2008, 1.28 in 2007).
funding: "Not stated in the retrievable abstract."
notes: >
  REQUIRED EXTRACTION #3. The task warned that "several of these are weak two-county comparisons and you
  should say so." THIS IS THE ARCHETYPE OF THAT PROBLEM, and I am recording it as TX/critical rather than
  as quasi-experimental evidence, because calling a two-city cross-section a quasi-experiment would
  misinform the downstream model about what tier T2 means.
  .
  WHY IT IS STILL WORTH RECORDING: taken together with vorona2014 (a different pair of Virginia
  jurisdictions), danner2008 (Kentucky, pre-post), foss2019 (North Carolina, interrupted time series) and
  binhasan2020 (Fairfax County, pre-post), five independent analyses all point the same direction. The
  CONSISTENCY OF SIGN across designs is worth something even when no individual design is credible. What
  it is NOT worth is a magnitude: the five studies' implied effects range from ~6% to ~22% and their
  designs are too weak to adjudicate between those.
  .
  A SPECIFIC INTERNAL CONTRADICTION WORTH FLAGGING, WHICH THE AUTHORS THEMSELVES REPORT IN THE FOLLOW-UP:
  in vorona2014, post-hoc analysis found significantly MORE run-off-road-to-the-right crashes
  (the crash type the authors call "potentially sleep-related") in the LATE-start county, i.e. the
  OPPOSITE direction to the overall finding. If the mechanism were drowsiness, the sleep-related crash
  subtype should move WITH the total, not against it.
  .
  VERBATIM QUOTE (abstract, PMID 21509328): "Virginia Beach (VB) and Chesapeake are adjacent,
  demographically similar cities. VB high schools start 75-80 minutes earlier than Chesapeake's. We
  hypothesized that VB teens would manifest a higher crash rate than Chesapeake teens. METHODS: The
  Virginia Department of Motor Vehicles (DMV) provided de-identified, aggregate 2008 and 2007 data for
  weekday crashes and crash times in VB and Chesapeake for drivers aged 16-18 years ("teens"), and
  provided 2008 and 2007 crash data for all drivers. ... RESULTS: In 2008, there were 12,916 and 8,459
  Virginia Beach and Chesapeake 16- to 18-year-old drivers, respectively. For VB and Chesapeake, teen
  drivers' crash rates in 2008 were 65.8/1000 and 46.6/1000 (p < 0.001), respectively, and in 2007 were
  71.2/1000 and 55.6/1000. Teen drivers' crash peaks in the morning occurred one hour earlier in VB than
  Chesapeake, consistent with school commute time. Congestion data for VB and Chesapeake did not explain
  the different crash rates. CONCLUSIONS: A significantly increased teen crash rate for both 2008 and 2007
  occurred in VB, the city with earlier high school start times. Future studies using individual level
  data may clarify if sleep restriction, circadian dyssynchrony, and sleep inertia might contribute to
  this increased crash rate."
  .
  ACCESS: abstract_only (Europe PMC 404; NCBI efetch for PMC3077341 returns publisher restriction).
  n = 21,375 = 12,916 + 8,459 licensed 16-18 y drivers in the 2008 comparison.
  .
  COHORT-FAMILY WARNING: vorona2011 and vorona2014 both use Virginia DMV aggregate crash data on 16-18 y
  drivers, same team, same design template, adjacent years, DIFFERENT jurisdictions. binhasan2020 ALSO
  uses Virginia DMV data on 16-18 y drivers, for Fairfax County and "the rest of the state" — which
  INCLUDES Virginia Beach, Chesapeake, Henrico and Chesterfield. These three records are therefore NOT
  fully independent. I have set cohort_family: Virginia_DMV_SST on all three so the pooler cannot treat
  them as independent replications.
shard: "s21_drowsy_driving"
