    ci: [0.225581, 0.464457]
    conversion_formula: >
      Rate ratio computed by me from the two published rates: 65.8 / 46.6 = 1.412017;
      log_rr = 0.345019.
      SE computed from implied crash counts, since the paper reports rates and driver denominators but
      not a CI: crashes_VB = 65.8/1000 * 12916 = 850; crashes_Ches = 46.6/1000 * 8459 = 394;
      se(log RR) = sqrt(1/850 + 1/394) = sqrt(0.00117647 + 0.00253807) = sqrt(0.00371454) = 0.060938.
      ci = 0.345019 +/- 1.96 * 0.060938. The paper reports p < 0.001, consistent with this SE.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      POSITIVE = HARM from the earlier start time. Teens in the early-start city had 1.41x the crash rate.
      BUT SEE rob: THIS IS A CROSS-SECTIONAL COMPARISON OF TWO CITIES WITH NO BEFORE-AND-AFTER, so the
      1.41 is a between-city rate ratio, not a causal effect of start time. The narrow CI reflects large
      crash counts and says nothing about the (unquantifiable) between-city confounding.
