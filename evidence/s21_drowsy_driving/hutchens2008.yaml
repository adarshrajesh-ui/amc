      were the ONLY behavioural predictors that survived. RECORDED DELIBERATELY AS A CONFOUNDING YARDSTICK.
      This exactly reproduces pizza2010's Italian finding (smoking OR 3.2, drowsy driving OR 2.1), in a US
      national sample. Two independent samples on two continents both find that the crash-prone young driver
      is characterised jointly by smoking and drowsy driving. That pairing is much easier to explain as a
      shared behavioural/impulsivity phenotype than as two independent physiological mechanisms.
