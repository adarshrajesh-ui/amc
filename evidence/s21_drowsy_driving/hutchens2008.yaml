rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: >
    (1) CROSS-SECTIONAL TELEPHONE SURVEY, 2005, N = 900 young drivers aged 14-22 of whom 506 licensed drivers
        were analysed (learners excluded). Self-reported exposure AND self-reported crash history in one
        instrument.
    (2) OUTCOME IS "CRASH INVOLVEMENT (EVER) AS A DRIVER", with no time window and no verification. Because
        exposure is measured now and the crash may predate it, temporal ordering is not established and
        reverse causation is fully open.
    (3) EXPOSURE IS "DRIVING ALONE WHILE DROWSY", NOT SLEEP DURATION. This study reports no sleep-duration
        contrast at all, so it cannot contribute to the dose-response question. That is why tier is TX.
    (4) NO EFFECT SIZES RETRIEVABLE. Both effects in this record are direction-only.
    (5) SMALL: 506 analysed.
    (6) STRENGTH THAT JUSTIFIES KEEPING IT: NATIONALLY REPRESENTATIVE US SAMPLE, EXACTLY THE RIGHT AGE BAND
        (14-22), and drowsy driving survived a multivariate model. For requirement #2 this is one of the few
        US young-driver records that exists at all.
funding: "Not stated in the retrievable abstract. The authors' affiliations point to the Children's Hospital of Philadelphia / Annenberg Public Policy Center National Annenberg Survey of Youth programme."
notes: >
  REQUIRED EXTRACTION #2 ("Look for work on young-driver drowsy-driving crashes"). This is the most on-point
  US nationally-representative young-driver study I could find, AND I AM REPORTING THAT ITS NUMBERS ARE NOT
  RETRIEVABLE rather than filling the gap.
  .
  VERBATIM QUOTE (abstract, PMID 18460353): "Motor vehicle crashes are the leading cause of death for young
  people in the United States. The goal of this study was to identify risk factor profiles of teen and young
  adult drivers involved in crashes. General demographic and behavioral as well as driving-related factors
  were considered. Analysis of a nationally representative telephone survey of U.S. young drivers ages 14 to
  22 (N=900) conducted in 2005 was restricted to 506 licensed drivers (learners excluded). Statistically
  significant univariate associations between factors of interest and the primary outcome, crash involvement
  (ever) as a driver, were identified and included within a multivariate logistic regression model,
  controlling for potential demographic confounders. Aside from length of licensure, only driving alone while
  drowsy and being a current smoker were associated with having been in a crash. Gaining a better
  understanding of these behaviors could enhance the development of more customized interventions for new
  drivers."
  .
  ONE INFERENCE FROM THIS RECORD THAT IS WORTH MORE THAN ITS MISSING ODDS RATIO. The abstract says that of
  all the general demographic, behavioural and driving-related factors screened, only THREE survived: length
  of licensure, drowsy driving and smoking. Length of licensure is driving exposure. So in a nationally
  representative US sample of young drivers, drowsy driving is one of only two BEHAVIOURAL predictors of
  crash involvement that survives adjustment — which is a genuine argument that the drowsiness channel is
  real and not merely one entry in a long list of correlated risk markers. Against that, the surviving
  companion is smoking, which has no plausible direct vigilance mechanism, so the pair is equally readable as
  a single latent behavioural factor.
  .
  n = 506, the analysed sample of licensed drivers (not the 900 surveyed). age_range [14, 22] is quoted from
  the abstract; no age_mean is published and I have not invented one. `adolescent_match: exact_16_19` because
  the band brackets the subject's exposure window tightly, though it extends to 22.
  .
  ACCESS: abstract_only. Elsevier paywall; no PMC deposit.
