rob:
  tool: AMSTAR-2
  judgement: low
  notes: |
    Methodologically the strongest prevalence meta-analysis in this shard. PROSPERO-registered
    (CRD42023402745), PRISMA-adherent, 3 databases to April 2024, 6,732 titles/abstracts and 621
    full texts screened in duplicate to 47 included studies. Crucially it applied restrictive
    eligibility criteria that most prevalence reviews do not: general population only, TRUE RANDOM
    sample required, and a diagnosis established either by interview, by DSM-based self-report
    questions, or by a questionnaire with a DSM-anchored cut-off. Three-level hierarchical
    random-effects model, stratified by diagnosis type, adjusted for gender and mean age, quality
    assessed, and - to their credit - PREDICTION intervals reported alongside confidence intervals.
    The single limitation that matters most for us is not a flaw in the review but a gap in the
    underlying literature: mean sample ages span 37.0 to 84.3 years, so ADOLESCENTS AND YOUNG
    ADULTS ARE ENTIRELY ABSENT. The authors also note the intervals are wide (prediction interval
    3.5%-35.5% for the interview-based estimate) and that 87% of studies failed one quality item on
    sample coverage.
funding: "None. 'Funding: The authors received no specific funding for this work.'"
notes: |
  THIS IS THE "RECENT META-ANALYSIS" THE TASK ASKED FOR on insomnia prevalence, and it is the
  best-conducted prevalence synthesis I found. It does three things for this shard, one of which is
  a caution against using it naively.

  1. IT ANCHORS THE MEASUREMENT-MODE CORRECTION. Interview 12.4% vs self-report 16.3% vs
     high-quality 10.7% vs low-quality 17.1%. Every adolescent insomnia figure I extracted
     (hysing2013 18.5%, sivertsen2019 22.2%, williams2020 22.1%) is questionnaire-based, and the
     only interview-based adolescent figure I have (johnson2006, 10.7% lifetime DSM-IV) is the
     lowest. The direction and rough magnitude of that gap is now quantified: expect
     questionnaire-based prevalence to run ~1.3x the interview-based value. My adopted adolescent
     prior of 18% is therefore more likely to be too HIGH than too low.

  2. IT INDEPENDENTLY CORROBORATES THE ISI >= 10 CUT-OFF. Defining insomnia as ISI >= 10 produced
     a population prevalence of 12.5%, against 12.4% from DSM diagnostic interviews. The authors
     make this argument explicitly in their conclusion: "the two instruments we currently recommend
     are the Sleep Condition Indictor ... or the Insomnia Severity Index with a cut- off of 10,
     which although based on the DSM- IV resulted in a prevalence estimate close to that of the
     clinical interviews." That is population-level criterion validation reached by a different
     route from Morin's ROC analysis (morin2011.yaml, sensitivity 86.1%/specificity 87.7% at >= 10),
     and it also supports ISI >= 15 as a referral threshold (7.5% of the population).

  3. DO NOT USE 12.4% AS OUR SUBJECT'S PRIOR, AND DO NOT READ THE NULL AGE MODERATOR AS LICENSING
     THAT. The mean age of contributing studies ranges from 37.0 to 84.3 years. There is no
     adolescent or young-adult data in this synthesis, so the finding that "mean age was not
     associated with prevalence (p = 0.98)" is a statement about the 37-84 y range only. Applying
     it to an 18-19 year old would be extrapolating a null result outside its support. I have kept
     my adolescent-specific prior (18%, range 10.7-22.2%) sourced from age-matched primaries, and
     I now flag that it should probably be shaded downwards toward the interview-based end.

  A NOTE ON WHAT "NEW INSOMNIA PREVALENCE META-ANALYSIS" DID NOT DELIVER: I was hoping for an
  age-stratified estimate covering 16-25 y. It does not exist here. That absence is itself a
  finding and I have recorded it in station_report.md as part of the biggest evidence gap.
shard: "s19_sleep_disorders"
