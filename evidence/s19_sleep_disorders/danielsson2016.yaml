rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Random sample of 1,000 Uppsala residents aged 16-26 with a 68% response rate - a much better response rate than sivertsen2021's 30.8% - and the only retrieved study to apply full DSM-5 DSPD criteria and to separate the trait from the disorder by design. Weaknesses: n = 680 gives wide CIs; single Swedish city; all questionnaire-based with no actigraphy or DLMO; the DSP definition ('late sleep onset and a preferred late wake-up time') is not numerically specified in the abstract and I could not read the full text to audit it (Unpaywall reports no OA location for 10.1080/07420528.2016.1217002)."
funding: "Not stated in the abstract"
notes: |
  ACCESS: abstract only.
  DECISION-RELEVANT DISSOCIATION REPORTED BY THIS PAPER: DSP (trait) was more common in MALES and was associated
  with "not attending educational activity or work", shift work, nicotine and alcohol use, and LESS rumination.
  DSPD (disorder) was EQUALLY common in males and females and was associated with elevated ANXIETY. So the trait
  tracks lifestyle/substance/schedule freedom, while the disorder tracks anxiety. For our subject - a male student
  in full-time education, no reported substance use, no reported anxiety - the profile that fits is neither cleanly.
  The absence of "not attending educational activity" (he is entering his second year of college) is a mild point
  AGAINST both DSP and DSPD, since disengagement from a fixed schedule is the strongest correlate of both in this
  cohort.
  THE SEX FINDING CONTRADICTS sivertsen2021. Danielsson finds DSPD equally common in males and females;
  sivertsen2021 finds males 4.7% vs females 2.7%; sivertsen2013 finds boys 2.7% vs girls 3.7%. I therefore do NOT
  apply a male-sex likelihood ratio to the DSWPD prior in the recommended posterior, and I say so explicitly in
  screening_priors.md.
