    direction_note: "descriptive persistence. HIGHLY RELEVANT TO A THREE-YEAR EXPOSURE HISTORY: adolescent insomnia is not transient - 88% of ever-cases were still cases at interview, and the median age of onset was 11. If our subject has insomnia disorder rather than behavioural restriction, the prior probability that it has been continuously present across the whole 16-to-19 window is high, and the report should not treat 'it started with A-levels' as evidence against a disorder."
