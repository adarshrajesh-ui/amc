rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Genuine strengths that no other insomnia record in this shard has: a random household sample, a 71.2% response rate, and DSM-IV insomnia ascertained by structured diagnostic interview rather than self-administered questionnaire. Limitations for this shard: the age range is 13-16, i.e. BELOW our subject's 16-19 exposure window and below the age at which circadian phase peaks in lateness (19.2 y in males per fischer2017), so it will understate the late-adolescent prior; single US metropolitan area within one health maintenance organisation, so it is an insured population; the headline estimate is LIFETIME not point prevalence; and the abstract reports no CIs. Abstract-only access on my side."
funding: "NIMH NIH HHS"
notes: |
  ACCESS: abstract only. Note that the DOI printed by PubMed's elocationid field was empty on my first query; I
  retrieved 10.1542/peds.2004-2629 from the efetch ArticleIdList and confirmed it against the record. The seed task
  described this as "Johnson et al. (Pediatrics, approx 2006)" and that is correct: Pediatrics 2006;117(2):e247-256.
  WHY IT IS IN THE SHARD DESPITE THE AGE MISMATCH: it is the operationalization source that sivertsen2013 explicitly
  followed for its ICSD-R delayed-sleep-phase rule ("To approximate assessment of the ICSD-R criteria for DSPS, the
  following criteria were used ... as specified in Johnson et al. published in Pediatrics [8]"). It also supplies the
  only interview-based adolescent insomnia estimate I could obtain, which anchors the low end of the prior interval.
  THE COMORBIDITY NUMBER MATTERS FOR THE DIFFERENTIAL: 52.8% of adolescent insomnia cases had a comorbid psychiatric
  disorder. sivertsen2013 independently found DSPS adolescents scored 8.8 vs 5.7 on the SMFQ depression scale, and
  danielsson2016 found DSPD associated with elevated anxiety. So any screen that returns a positive insomnia or
  circadian result in this subject should trigger a mood/anxiety screen as well - the report should say so.
  THE SEX FINDING IS NOT TRANSPORTABLE TO OUR SUBJECT: the emergent gender difference was tied to onset of menses
  ("onset of menses was associated with a 2.75-fold increased risk for insomnia ... In contrast, maturational
  development was not associated with insomnia in boys"). For a male subject, pubertal status carried no insomnia
  risk information in this cohort. I therefore did not code the 2.75-fold estimate as an effect.
shard: "s19_sleep_disorders"
