    conversion_formula: "'Lifetime prevalence of insomnia was 10.7%' verbatim. n = 1014. se = sqrt(0.107*0.893/1014) = 0.00971; Wald 95% CI = [0.0880, 0.1260]. My construction; the paper reports no CI in the abstract."
    from_figure: false
