    direction_note: "descriptive LIFETIME prevalence, not point prevalence. LOWER than hysing2013's 23.8% DSM-IV POINT prevalence in Norwegian 16-19 year olds, which is the opposite of what nesting would predict and therefore signals a large method effect: Johnson used a structured diagnostic interview in a US health-maintenance-organisation sample, Hysing used a self-administered questionnaire in a Norwegian county census. Interview-based ascertainment gives roughly half the questionnaire-based figure. The report should treat 10-11% as the interview-anchored floor of the adolescent insomnia prior and 18-24% as the questionnaire-anchored ceiling."
