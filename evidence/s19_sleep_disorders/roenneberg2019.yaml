    ci: null
    conversion_formula: "If SD_f <= SD_w:  MSFsc = MSF = SO_f + SD_f/2.  If SD_f > SD_w:  MSFsc = MSF - (SD_f - SD_week)/2 = SO_f + SD_week/2. Where SD_w = sleep duration on workdays, SD_f = sleep duration on work-free days, SD_week = weekly average sleep duration = (5*SD_w + 2*SD_f)/7 for a 5-workday week, SO_f = sleep onset on work-free days, MSF = midsleep on free days."
    from_figure: false
    inferred_from_ci: false
    direction_note: "later MSFsc = later (more delayed) chronotype. The value field is a non-informative placeholder because this record carries a FORMULA, not an estimate; the formula is in conversion_formula and quoted verbatim below."
    covariates: []
    followup_years: null
    cohort_family: "MCTQ_database"
    quote: "To clean chronotype of the confounder sleep debt, we correct MSF (MSF sc = sleep corrected MSF). For this correction, we first calculate the average sleep duration across the entire week (SD week ) and then correct MSF by subtracting half of the oversleep. This correction is only applied for people who sleep longer on work-free days than on workdays (SD f > SD w ):   If SD f <= SD w : MSF sc = MSF = SO f + SD f /2   (1)   If SD f > SD w : MSF sc = MSF - (SD f - SD week )/2 = SO f + SD week /2   (2)"

