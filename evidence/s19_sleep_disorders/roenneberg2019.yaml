rob:
  tool: none
  judgement: na
  notes: "Narrative (explicitly self-critical) review by the instrument's own developers -- a conflict of interest for judgements about the instrument's validity, though the methodological caveats they raise cut against their own tool. The MCTQ database is a self-selected online convenience sample skewed towards Central Europe and towards people interested in chronobiology; it is a reference distribution, not a population norm. The paper reports quartiles/figures rather than tabulated means and SDs by age, so I could not extract an age-18-19 MSFsc mean and SD from this source (see fischer2017.yaml for a population-representative age-resolved alternative, though that one uses uncorrected MSFWe)."
funding: "Not stated in the retrieved text."
notes: |
  WHY THIS RECORD MATTERS: it supplies the exact arithmetic the report needs to convert our subject's
  self-reported schedule into a chronotype number, plus the mechanistic argument that his reported
  pattern is the signature of circadian delay rather than evidence against it.

  WORKED EXAMPLE USING OUR SUBJECT'S OWN REPORTED NUMBERS (this arithmetic is MINE, not the paper's;
  it is illustrative and depends entirely on sleep-onset times he has not yet supplied):
    Take SD_w = 5.5 h (his 5-6 h weekday sleep) and SD_f = 7.5 h (his 7-8 h weekend sleep).
    SD_week = (5*5.5 + 2*7.5)/7 = (27.5 + 15)/7 = 42.5/7 = 6.07 h.
    Since SD_f (7.5) > SD_w (5.5), equation (2) applies:
      MSFsc = SO_f + SD_week/2 = SO_f + 3.04 h.
    So if he falls asleep at 01:30 on a free night, MSFsc = 04:32.
    If he falls asleep at 02:30 on a free night, MSFsc = 05:32.
    Under the 10-11 h weekend variant (SD_f = 10.5): SD_week = (27.5 + 21)/7 = 6.93 h,
      MSFsc = SO_f + 3.46 h.
    CRITICAL MISSING INPUT: sleep ONSET time on free days is the dominant term and we do not have it.
    Without SO_f no chronotype can be computed. This is the single highest-value question to ask him.

  Also note the authors' warning against a common error the report must avoid, verbatim:
    "Considering time-in-bed as time-spent-asleep, for example, is a common confusion: four out of the
    26 studies selected for full-text reading in the review (~15%) used bedtime or time spent in bed to
    compute SJL. Additionally, two other studies used MSF sc instead of MSF when computing SJL."
  i.e. SJL must be computed from MSF (uncorrected), while chronotype must be computed from MSFsc.

  Full text retrieved from PubMed Central and parsed to plain text; all quotes verbatim from that
  retrieval. Unicode subscripts in the original render as spaced characters (e.g. "MSF sc") in my
  plain-text extraction; I have preserved that spacing in quotes rather than silently editing them.
