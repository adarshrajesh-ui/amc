    exposure: {type: descriptive, dose_h: null, referent_h: null, duration_days: null, contrast_label: "incidence of OSA (obstructive apnoea-hypopnoea index >= 5 events/h on PSG) at mean age 20.2, in a community cohort followed 10.4 years from mean age 9.8"}
