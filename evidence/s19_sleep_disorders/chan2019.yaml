    from_figure: false
    inferred_from_ci: false
    direction_note: "positive = male sex and higher BMI raise risk. THE TWO-FACTOR SPLIT IS WHAT MAKES THIS USABLE FOR OUR SUBJECT: he carries one risk factor (male) and lacks the other (his BMI is presumed normal). Since BMI is the dominant driver in every OSA prevalence model I retrieved - in peppard2013 the lean-to-obese gradient within men aged 30-49 is 7.0% -> 79.5% for AHI >= 5, an 11-fold range, far larger than the 30-49 -> 50-70 age gradient - a normal BMI is the single most protective fact available about this subject, and it is the reason the recommended symptomatic-OSA posterior is ~1%."
