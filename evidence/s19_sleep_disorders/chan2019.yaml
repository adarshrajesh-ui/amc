    se: 0.0266
    ci: [0.168, 0.272]
    conversion_formula: "'Incidence of adolescent/adult OSA with an OAHI >= 5 events/h at follow-up was 22%' verbatim. n = 243. se = sqrt(0.22*0.78/243) = 0.02659; Wald 95% CI = [0.168, 0.272]. My construction. THE DENOMINATOR IS UNCERTAIN: 'incidence' should be computed among those without OSA at baseline, which is a subset of 243, so this se is if anything too narrow - flagged."
    from_figure: false
    inferred_from_ci: false
    direction_note: "higher = more disease. THIS IS THE ONLY OBJECTIVE (POLYSOMNOGRAPHIC) SLEEP-APNOEA DATA I COULD RETRIEVE AT OUR SUBJECT'S ACTUAL AGE (mean 20.2 years), AND IT MUST NOT BE READ AS A POPULATION PREVALENCE. The cohort was assembled from 'a cohort established for an OSA prevalence study', i.e. it is enriched for childhood OSA cases and their comparators, and 22% is an incidence within that enriched sample. It sets no upper bound on, and gives no unbiased estimate of, prevalence in an unselected lean 19-year-old. I record it because its RISK-FACTOR finding is directly usable even though its rate is not."
    covariates: ["sex", "baseline BMI z score", "baseline OAHI"]
    followup_years: 10.4
    cohort_family: "HongKong_childhood_OSA_cohort"
    quote: "Two hundred and forty-three participants (59% male) took part, and their mean age was 9.8 (SD, +/- 1.8) and 20.2 (SD, +/- 1.9) years at baseline and follow-up, respectively. The mean follow-up duration was 10.4 (SD, +/- 1.1) years. ... Overall polysomnographic remission rate (with OAHI < 1 event/h at follow-up) of childhood OSA was 30%, and 69% had an OAHI < 5 events/h at follow-up. Complete remission of OSA was associated with female sex. Incidence of adolescent/adult OSA with an OAHI >= 5 events/h at follow-up was 22%. Male sex and higher baseline BMI z score were associated with incident OSA."
