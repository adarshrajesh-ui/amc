rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "Design strengths: prospective, 10.4-year follow-up, and OUTCOME ASCERTAINED BY POLYSOMNOGRAPHY at a mean age of 20.2 - which is why it is the only objective apnoea record in this shard at the right age. Fatal weaknesses for prevalence purposes: (1) the sample is drawn from a cohort originally established for an OSA prevalence study and is therefore enriched for cases, so neither the 22% incidence nor any implied prevalence transports to an unselected population; (2) n = 243 with an unstated attrition denominator from the original cohort, so selective retention is unquantifiable; (3) single Hong Kong Chinese population, and craniofacial risk profiles for OSA differ substantially by ancestry, which matters when the comparator (peppard2013) is 96% non-Hispanic white; (4) no adjusted effect sizes in the abstract and no full-text access on my side. Tier T4 reflects the prospective-with-objective-exposure design; the TX-like interpretive weight is enforced through rob and through the direction_note warnings."
funding: "Not stated in the abstract"
notes: |
  ACCESS: abstract only.
  WHY IT IS IN THE SHARD. The task asked for young-adult-specific OSA data. peppard2013 stops at 30 and
  benjafield2019 stops at 30. This is the only retrievable study that put a polysomnograph on people at our subject's
  age and reported apnoea-hypopnoea indices. Its rate is unusable for a prevalence prior because of case enrichment,
  but two things it says ARE usable:
    1. Childhood and adolescent OSA are described as 'distinct entities, with the latter more likely to persist into
       adulthood' - so a subject with no childhood history of snoring/apnoea/adenotonsillectomy has a lower prior
       still, and the report should ask that history question because it is free.
    2. The risk factors at this age are male sex and BMI. Our subject has one and not the other.
  A CONCRETE SCREENING IMPLICATION: because obesity dominates and our subject is lean, the pre-test probability of
  clinically meaningful sleep-disordered breathing is low enough that a home sleep apnoea test is NOT indicated on the
  presentation as described. It becomes indicated only if the screen returns habitual snoring, witnessed apnoeas,
  unrefreshing sleep despite adequate time in bed, or an Epworth score above 10 that survives a time-in-bed extension
  trial. That conditional-referral logic is written into instruments.md rather than being left implicit.
shard: "s19_sleep_disorders"
