    scale: raw_units
    unit: "qualitative direction code (+1 = boys show the LARGER weekday-weekend discrepancy)"
    value: 1.0
    se: null
    ci: null
    conversion_formula: "No magnitude is given in the abstract, only the direction: 'boys reported later bedtimes and a larger weekday-weekend discrepancy on several sleep parameters'. Coded +1 for direction so the record is schema-valid. No arithmetic, no se."
    from_figure: false
    inferred_from_ci: false
    direction_note: "positive = boys normally show the larger weekday-weekend discrepancy. DIRECTLY LOWERS THE DIAGNOSTIC VALUE OF OUR SUBJECT'S PRESENTING FEATURE: he is male, and a large weekday-weekend discrepancy is the NORMATIVE male pattern in this age band. The feature that the task premise treats as a DSWPD red flag is in fact the modal presentation of a healthy 16-19 year old boy."
    covariates: ["sex"]
    followup_years: null
    cohort_family: "ung_hordaland"
    quote: "Girls reported longer sleep onset latency and a higher rate of insomnia than boys, while boys reported later bedtimes and a larger weekday-weekend discrepancy on several sleep parameters."
rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Same very large population-based cohort as sivertsen2013 (ung@hordaland 2012, n = 10,220, ages 16-18/19), and the criteria-set comparison (DSM-IV vs DSM-5 vs Quantitative Criteria for Insomnia in the same respondents) is a genuine methodological strength. Weaknesses: entirely self-report, including derived quantities (sleep duration = time in bed minus latency minus wake-after-sleep-onset); no actigraphy; the abstract reports no SDs and no CIs; and the sex contrast is stated qualitatively with no magnitude. Abstract-only access on my side (Unpaywall reports no OA location for 10.1111/jsr.12055), so I could not read the tables. Where I needed SDs for the same cohort I used sivertsen2013, which I do hold in full text."
funding: "Not stated in the abstract"
notes: |
  ACCESS: abstract only, but the SAME COHORT is available to me in full text as sivertsen2013 (PMC3878844), from
  which I took the weekday/weekend means and SDs used for the likelihood-ratio derivations. cohort_family is
  ung_hordaland on both records so the pooler counts them once.
  THE THREE INSOMNIA NUMBERS AND WHAT THEY MEAN FOR THE PRIOR: DSM-IV 23.8%, DSM-5 18.5%, Quantitative Criteria for
  Insomnia 13.6%. DSM-5 tightened the frequency/duration requirements relative to DSM-IV, and the Quantitative
  Criteria (Lineberger et al., Behav Res Ther 2003) are the most restrictive. I use 18.5% as the headline
  adolescent insomnia prior and carry 13.6-23.8% as the definitional interval.
  WHY THIS RECORD MATTERS MOST FOR WHAT IT RULES OUT: it supplies the two population BASE RATES that the report needs
  in order not to over-read our subject's presentation - a mean weekday sleep of 6:25 (so 5-6 h is common) and a 65%
  base rate for sleep latency over 30 minutes (so that threshold cannot discriminate). Both push the DSWPD posterior
  DOWN relative to a naive reading of the presenting complaint.
  ALSO NOTED: girls reported longer sleep onset latency and a higher insomnia rate than boys. Our subject is male, so
  the insomnia prior for him should sit below the mixed-sex 18.5% - sivertsen2019 gives the male-specific student
  figure (22.2%) in an older sample, and hysing2013 does not give a male-specific split in the abstract, so I carry
  both and widen the interval.
