    value: 0.185
    se: 0.00384
    ci: [0.1775, 0.1925]
    conversion_formula: "'Insomnia prevalence rates ranged from a total prevalence of 23.8 (DSM-IV criteria), 18.5 (DSM-V criteria) and 13.6% (quantitative criteria for insomnia)' verbatim. value = 0.185 for DSM-5. se = sqrt(0.185*0.815/10220) = 0.00384; Wald 95% CI = [0.1775, 0.1925]. My construction. The DSM-IV (0.238) and Quantitative-Criteria (0.136) figures are recorded in notes as a definitional sensitivity range rather than as separate effects, because all three are the same people scored three ways."
    from_figure: false
    inferred_from_ci: false
    direction_note: "descriptive prevalence. THE DEFINITIONAL RANGE IS THE FINDING: 23.8% / 18.5% / 13.6% in ONE sample of 10,220 adolescents depending purely on which criteria set is applied - a 1.75-fold spread. Any claim about whether our subject 'has insomnia' is therefore roughly as sensitive to the definition chosen as to his actual symptoms, and the report must name the criteria set."
    covariates: []
    followup_years: null
    cohort_family: "ung_hordaland"
    quote: "Insomnia prevalence rates ranged from a total prevalence of 23.8 (DSM-IV criteria), 18.5 (DSM-V criteria) and 13.6% (quantitative criteria for insomnia)."
