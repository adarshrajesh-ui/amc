    exposure: {type: habitual_short_sleep, dose_h: null, referent_h: null, duration_days: null, contrast_label: "mean self-reported weekday sleep duration, unselected Norwegian 16-19 year olds"}
    scale: hours
    unit: "hours of weekday total sleep time"
    value: 6.417
    se: null
    ci: null
    conversion_formula: "'The adolescents reported short sleep duration on weekdays (mean 6:25 hours), resulting in a sleep deficiency of about 2 h' verbatim. 6:25 = 6 + 25/60 = 6.417 h. The abstract gives no SD, so se is null rather than invented. The same cohort's SD (weekday sleep duration 1:38 in the non-DSPS group) is available from sivertsen2013 Table 2."
    from_figure: false
    inferred_from_ci: false
    direction_note: "descriptive population mean, not an effect. CALIBRATES HOW DEVIANT OUR SUBJECT IS: the unselected 16-19 year old population mean weekday sleep is 6 h 25 min. Our subject's reported 5-6 h is therefore roughly 0.4-0.9 h below the population mean, i.e. about 0.3-0.6 SD - well inside the distribution, not an outlier. He is not unusual for sleeping short; he would be unusual only if the shortfall is driving measurable impairment."
    covariates: []
    followup_years: null
    cohort_family: "ung_hordaland"
    quote: "The adolescents reported short sleep duration on weekdays (mean 6:25 hours), resulting in a sleep deficiency of about 2 h."
  - outcome_domain: exposure_measurement
    outcome_construct: population_base_rate_sol_over_30min
    exposure: {type: descriptive, dose_h: null, referent_h: null, duration_days: null, contrast_label: "proportion of unselected 16-19 year olds reporting sleep onset latency exceeding 30 minutes"}
    scale: probability
    unit: "proportion of adolescents"
    value: 0.65
    se: 0.00472
    ci: [0.6407, 0.6593]
    conversion_formula: "'A majority of the adolescents (65%) reported sleep onset latency exceeding 30 min' verbatim. se = sqrt(0.65*0.35/10220) = 0.00472; Wald 95% CI = [0.6407, 0.6593]. My construction."
    from_figure: false
    inferred_from_ci: false
    direction_note: "descriptive base rate. THIS NUMBER DESTROYS THE >30-MINUTE SLEEP-LATENCY THRESHOLD AS A SCREENING TOOL IN LATE ADOLESCENTS: if 65% of the unselected population exceeds it, its maximum achievable positive likelihood ratio is 1/0.65 = 1.54 even if it were perfectly sensitive. It also directly contradicts williams2020, where only 20.3% of US college students exceeded 30 min. Two large samples, one quantity, a threefold disagreement - so the report must NOT score our subject against a literature latency threshold; it must measure his latency prospectively by diary and compare weekday to free-day nights WITHIN him."
    covariates: []
    followup_years: null
    cohort_family: "ung_hordaland"
    quote: "A majority of the adolescents (65%) reported sleep onset latency exceeding 30 min."
