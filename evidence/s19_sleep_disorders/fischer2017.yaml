rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: |
    STRENGTHS: nationally representative (American Time Use Survey, 12 pooled years 2003-2014,
    n = 53,689), survey-weighted, age resolved to single years, sex stratified.
    CRITICAL MEASUREMENT LIMITATION: chronotype here is MSFWe -- mid-sleep on WEEKENDS from a
    ONE-DAY time-use diary. It is NOT MSFsc. Three consequences: (a) no sleep-debt correction is
    applied, so these values are biased LATE relative to true MSFsc (Roenneberg 2019 states the
    sleep correction "makes the distribution slightly earlier"); (b) a single diary day cannot
    average across free days; (c) alarm-clock use on the diary day was not excluded, whereas the
    MCTQ reference distribution excludes it. Therefore these numbers should be used as an
    age/sex-matched WEEKEND MID-SLEEP norm, and must not be compared directly to an MSFsc cut-off.
    Also cross-sectional: the apparent 16->19 delay could in principle be cohort rather than age,
    though the authors argue against that ("Roenneberg et al. found a similar age-specific chronotype
    profile when looking at yearly entries in their large database between 2003 and 2012, providing
    some evidence for an age- vs. cohort- effect. We confirmed their finding in our study, observing
    the same age- and sex-pattern for each year of survey (2003-2012).").
funding: "Not extracted from the retrieved text."
notes: |
  WHY THIS IS THE MOST DECISION-RELEVANT NORMATIVE RECORD IN MY SET: it gives an age-exact,
  sex-exact, population-representative chronotype norm for an 18-19 year old US male, which is what
  the report needs in order to say whether our subject is normatively late or pathologically late.

  THE AGE CURVE IN MALES (Table 1, Men column, verbatim numbers):
    age 15: n=325, MSFWe 4.02 (04:01), SD 1.53
    age 16: n=494, MSFWe 4.34 (04:20), SD 1.79
    age 17: n=458, MSFWe 4.58 (04:35), SD 2.23
    age 18: n=303, MSFWe 4.62 (04:37), SD 2.14
    age 19: n=229, MSFWe 5.03 (05:02), SD 2.60
    age 20: n=214, MSFWe 4.86 (04:52), SD 2.39
    whole male sample: n=23,463, MSFWe 3.45 (03:27), SD 2.44
    whole sample: n=53,689, MSFWe 3.43 (03:26), SD 2.31

  IMPLICATION FOR THE REPORT (this inference is MINE): a US male's mid-sleep on weekends rises from
  04:01 at 15 to 05:02 at 19 and then falls. If our subject's free-day mid-sleep is ~04:30-05:00 he
  is at, not beyond, the age-and-sex norm -- that is a normal delayed adolescent chronotype, not
  DSWPD. DSWPD requires impairment plus an inability to sleep at the desired time, not merely a
  late phase. Conversely if his free-day mid-sleep is 07:00+ he is roughly +1 SD to +2 SD beyond
  even the latest age band and the DSWPD hypothesis is substantially strengthened. This is the
  quantitative fork the report should present.

  ALSO USEFUL AS CONTEXT (verbatim, quantifies the schedule clash):
    "According to the CDC, 82.3% of public schools in the US (with an estimated total enrollment of
    4.2 million students) start school at 8:30 a.m. or earlier. Our study shows an average chronotype
    of 4:30 a.m. in the group of 17- and 18-year olds, suggesting that senior high school students get
    up and go to school in their biological night."
    "...which is in line with another CDC report showing that 68.8% of US high school students sleep
    less than 8h during an average school night"

  Full text retrieved from PubMed Central / PLOS and parsed to plain text; Table 1 values read from
  the parsed table stream and re-checked against the in-text 15-19 band figures (4:31 +/- 1.99 h for
  males), which are consistent with the single-year rows.
