rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: |
    Strengths: n = 250, gold-standard comparator (SCID-5 structured clinical interview for DSM-5
    insomnia disorder - the strongest reference standard of any instrument-validation study in this
    shard), pre-specified acceptability criteria for the cut-off (sensitivity >= 0.85 AND
    specificity >= 0.75), multiple cut-offs reported for different purposes.
    Concerns: (1) YOUNG ADULT CANCER SURVIVORS, not healthy young adults - survivorship raises both
    insomnia prevalence and the frequency of competing somatic causes of sleep disruption, so
    specificity may be pessimistic relative to a healthy sample; (2) ABSTRACT ONLY, so I could not
    verify the age range, sex distribution, time since treatment, or obtain a CI on the AUC;
    (3) cross-sectional single-administration design with no test-retest data; (4) the ISI is
    DSM-IV-based while the reference standard is DSM-5, a mismatch the authors themselves note.
funding: "NCI NIH HHS (per PubMed grant record)."
notes: |
  WHY THIS RECORD MATTERS: it is the only ISI validation I found that uses a STRUCTURED DSM-5
  CLINICAL INTERVIEW as the reference standard in a YOUNG ADULT sample, and it disagrees with the
  cut-off I recommend from Morin 2011.

  THE DISAGREEMENT, AND HOW I RESOLVED IT:

  | Source | Population | Reference standard | Screening cut-off | LR+ | LR- |
  |---|---|---|---|---|---|
  | morin2011 | community adults (Canada) | insomnia case criteria | >= 10 | 7.00 | 0.159 |
  | michaud2021 (this) | young adults (cancer survivors, US) | SCID-5 interview | >= 8 | 3.70 | 0.195 |
  |            |                            |                     | >= 7 | 3.20 | 0.057 |

  All LRs above are DERIVED BY ME from the reported sensitivity/specificity pairs.

  The younger sample yielded a LOWER optimal screening threshold (8 vs 10). That direction is what
  you would expect if young adults under-report or normalise insomnia symptoms, but with two
  studies in different populations I cannot attribute the difference to age with any confidence -
  the cancer-survivorship confound is at least as plausible an explanation.

  The authors' own closing caution is the most useful thing in the paper and the report should
  quote it: "Results of this study and prior studies of the ISI offer important reminders that
  cut-off scores derived from different populations are not generalizable." Neither >= 10 nor >= 8
  has been validated in healthy 18-19 year olds. That remains a genuine gap.

  PRACTICAL RECOMMENDATION I DRAW FROM HAVING BOTH: use the ISI as a graded instrument rather than
  a single dichotomy, because the two validations agree far more about the extremes than about the
  middle.
    - ISI < 7  -> insomnia disorder effectively excluded (LR- 0.057; posterior ~1% from an 18%
                 prior). This is the strongest rule-out in my entire instrument set.
    - ISI 7-9  -> INDETERMINATE ZONE. Positive by michaud2021, negative by morin2011. Do not
                 dichotomise here; proceed to the 14-day diary.
    - ISI >= 10 -> positive by both (LR+ 3.7-7.0; posterior ~45-61% from an 18% prior).
    - ISI >= 15 -> moderate-severe band; refer for CBT-I. Selects ~7.5% of the general population
                 (vanstraten2025.yaml).
  This graded reading is my synthesis [judgement], not a published algorithm.

  UNCHANGED CAVEAT FROM sletten2018: whatever threshold is used, the ISI does not separate insomnia
  disorder from DSWPD - DLMO-confirmed DSWPD patients averaged ISI 12.93 and would screen positive
  on every cut-off in the table above.
