rob:
  tool: AMSTAR-2
  judgement: high
  notes: "Systematic PubMed/Embase search for objectively-tested OSA prevalence, but the synthesis is a modelled global extrapolation with substantial and acknowledged fragility: reliable prevalence data existed for only 16 countries from 17 studies, all other countries were IMPUTED by matching to a 'similar country' on population BMI, race and geographical proximity; a newly developed conversion algorithm was applied to harmonize non-AASM-2012 scoring criteria; and, decisively for this shard, 'The presence of symptoms was not specifically analysed because of scarce information about symptoms in the reference studies' - so these are ANATOMICAL prevalence figures with no symptom requirement, which is not the quantity that drives management. Funded by ResMed, a manufacturer of CPAP devices, which is a direct commercial interest in a large prevalence estimate. Age restricted to 30-69. Abstract-only access on my side."
funding: "ResMed (declared in the abstract's Funding section)"
notes: |
  ACCESS: abstract only. Unpaywall/Europe PMC show a green PMC deposit (PMC7007763) but Europe PMC returned no
  full-text XML for it, and the pmc.ncbi.nlm.nih.gov route began returning reCAPTCHA challenges partway through this
  shard's work, so I did not obtain the tables. All numbers above are verbatim from the PubMed abstract.
  THE HONEST FINDING IS A NEGATIVE ONE, AND THE TASK ASKED ME TO REPORT REALITY: the two papers the seed named as the
  sources for OSA prevalence in our subject - Peppard 2013 (Wisconsin) and Benjafield 2019 (global) - between them
  contain no data on anyone under 30 years old. Peppard's youngest stratum is 30-49; Benjafield's primary outcome is
  explicitly 30-69. There is therefore NO directly applicable published OSA prevalence for a lean 18-25 year old male
  from either source, and the report must say so rather than quoting "1 billion people have OSA" as if it bore on this
  subject.
  WHAT I USED INSTEAD, IN ORDER OF PREFERENCE:
    1. peppard2013 Tables 2-5, lean-male 30-49 stratum, extrapolated DOWN in age (see that record for the arithmetic).
    2. chan2019, a 10-year community-based follow-up in which participants were re-polysomnographed at mean age 20.2 -
       the only retrievable OBJECTIVE sleep-study data at our subject's actual age - though its cohort was assembled
       from an OSA prevalence study and so is enriched for cases.
  THE ResMed FUNDING IS NOT A REASON TO DISCARD THE PAPER but it is a reason to prefer the unfunded, PSG-based,
  stratified Wisconsin estimates for a probability statement about an individual, which is what I have done.
