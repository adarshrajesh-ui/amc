rob:
  tool: AMSTAR-2
  judgement: some_concerns
  notes: "PROSPERO-registered (CRD42023458889), PRISMA 2020 + MOOSE, NIH observational quality tool applied (scores 5-9 of 11). Two important limitations for our use: (1) the authors fitted COMMON-EFFECT (fixed-effect) models even where I^2 = 53-62%, which understates the CI width - the sensitivity analysis with I^2 = 0% is the more trustworthy estimate; (2) all component studies are cross-sectional or case-control, so the DSWPD -> depression direction is NOT established and reverse causation (depression delaying sleep) is fully compatible with the data. The prevalence figures I extracted are NARRATIVE introduction statements, not meta-analysed outputs, and inherit the weaknesses of their sources."
funding: "None. 'Funding: The authors received no financial support for the research, authorship, and/or publication of this article.'"
notes: |
  WHY THIS RECORD MATTERS FOR THIS SHARD: it is the most recent systematic review restricted to
  exactly my target construct (DSWPD in adolescents and young adults) and it independently
  confirms that the primaries I extracted are the right ones - its reference list contains
  Sivertsen 2013 (PMID 24330358), Danielsson 2016 (PMID 27537980) and Sivertsen 2021
  (PMID 33097403), all of which I have already extracted directly. That is a coverage check on
  my search, not new evidence.

  TWO USES DOWNSTREAM:
  1. STAKES OF A MISSED DIAGNOSIS. If our subject does have DSWPD, the expected depressive
     symptom burden is large (d ~ 0.9-1.0). This is the quantitative justification for treating
     the DSWPD-vs-behavioural question as high-priority rather than academic. It is NOT evidence
     that treating DSWPD would reduce depression - the design cannot support that.
  2. THE AGE GRADIENT IN THE PRIOR. The review's own framing (0.13-0.17% general population vs
     3.3-17.9% in young people) is the cleanest published statement of why an 18-19 y male must
     not be given an adult base rate.

  IMPORTANT CAUTION ON THE 3.3-17.9% RANGE: this is an introductory narrative range citing four
  surveys, not a pooled estimate, and the review did not meta-analyse prevalence at all. The
  upper bound (17.9%) comes from loose self-report operationalisations. My own prior in
  screening_priors.md is anchored on the strict-criteria primaries (Danielsson 2016: 4.0% by
  ICSD-3-like criteria; Sivertsen 2021: 3.3% in Norwegian students) rather than on this range.
  Reporting the range here because the task asked for AASM/review-level prevalence statements.

  DIRECTION-OF-CAUSATION WARNING for the report: because depression itself delays sleep timing
  and impairs morning rising, a subject with both a delayed pattern and low mood cannot be
  assigned to "DSWPD" on that basis. This is an additional differential the report must carry,
  and it is why I recommend a mood screen alongside the circadian workup (see instruments.md).
shard: "s19_sleep_disorders"
