rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: |
    Strengths: population-based sampling frame, exactly our age band (mean 16.8 y at baseline,
    followed into early adulthood), 8 nights of GENEActiv actigraphy plus 3 nights of iButton
    skin-temperature recording at both follow-ups - i.e. genuinely objective sleep and circadian
    proxy measures, which is rare in this literature.
    Concerns: (1) DSP at T1 was SELF-REPORTED, so the exposure that defines the cohort is
    subjective; (2) the follow-up sample was deliberately DSP-WEIGHTED (N = 315 at T2, N = 207 at
    T3 out of 1374), so the 70% stability figure applies to an enriched sample and is not a
    population transition probability; (3) attrition from 315 to 207 between T2 and T3 is
    substantial and differential attrition is not characterised in the abstract; (4) 66% girls,
    whereas our subject is male, and DSP prevalence and correlates are sex-patterned;
    (5) ABSTRACT ONLY - the full text is paywalled and I could not verify the analysis, the
    DSP operationalisation at follow-up, or obtain any confidence intervals.
funding: "Not stated in the abstract; full text not accessible. Crossref returned no funder records."
notes: |
  WHY I ADDED THIS RECORD LATE: it surfaced on a re-run of my DSWPD prevalence search and it is
  directly decision-relevant, so I extracted it rather than logging it as a near-miss.

  IT ANSWERS A QUESTION THE REST OF MY EVIDENCE COULD NOT: every other prevalence source in this
  shard is cross-sectional, so none of them can say whether a delayed pattern in a 16-19 y old
  resolves on its own. This one can, and the answer is mostly no - 70% of DSP-positive
  adolescents were still DSP-positive 19 months later. The practical consequence for the report
  is that "he will grow out of it" is not a safe default: if the subject really is phase-delayed,
  waiting is more likely than not to leave him delayed through the college years, which is
  exactly the window in which the academic cost lands.

  IT ALSO CUTS THE OTHER WAY, AND I WANT THAT ON THE RECORD. The authors' own conclusion is that
  BEHAVIOURAL factors (self-control, ADHD symptoms, alcohol) rather than the physiological
  circadian markers they measured explained DSP trajectories, and their measured physiological
  variables (skin-temperature rhythm, physical activity) showed NO association with DSP
  continuity. So this paper is evidence AGAINST a purely physiological-circadian framing of
  adolescent DSP, and it partially supports the behavioural reading that our subject himself
  offers. It should temper, not inflate, the DSWPD posterior. Two caveats keep it from settling
  the question: the behavioural block explained only 18% (82% unexplained), and absence of
  association with a skin-temperature proxy is weak evidence about the underlying circadian
  pacemaker, since skin temperature is a noisy surrogate for melatonin phase (DLMO).

  ARITHMETIC I DID NOT DO: I deliberately did not compute a CI on the 70% figure. The abstract
  gives two candidate denominators (315 and 207) and does not say which applies; picking one
  would have produced a fake interval. Downstream should treat 0.70 as a point estimate with
  unquantified uncertainty from a DSP-enriched sample.

  IMPORTANT: DSP here is the delayed sleep phase TRAIT/pattern, not the ICSD-3 DISORDER. The
  abstract never states that clinical impairment criteria were applied. Do not merge this
  70% persistence figure with disorder-level prevalence estimates.
shard: "s19_sleep_disorders"
