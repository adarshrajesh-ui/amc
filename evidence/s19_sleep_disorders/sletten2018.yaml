rob:
  tool: RoB2
  judgement: low
  notes: |
    A genuinely well-conducted trial and the strongest single piece of treatment evidence in this
    shard. Randomised, placebo-controlled, DOUBLE-BLIND, prospectively registered
    (ACTRN12612000425897), intention-to-treat analysis, objective primary outcome (actigraphic
    sleep onset time), adverse events reported, no differential adherence ("The groups did not
    differ in the number of nights treatment was taken per protocol"), and - unusually for this
    literature - participants were selected on OBJECTIVE circadian phase (salivary DLMO relative to
    desired bedtime) rather than on symptoms alone.
    Limitations relevant to us: (1) mean age 29.0 y, range 16-65, so this is an ADULT outpatient
    sample and only a minority are in our subject's age band - no age-stratified results are
    reported; (2) the DLMO substudy (n = 43 of 116) was underpowered for the phase-shift outcome,
    which the authors acknowledge; (3) both arms received behavioural sleep-wake scheduling, so the
    trial estimates the INCREMENTAL effect of melatonin on top of scheduling, not the effect of
    melatonin alone - this is the clinically relevant contrast but it is not the same as a
    melatonin-vs-nothing comparison; (4) 4 weeks only, so long-term efficacy and safety are
    explicitly not assessed; (5) generalisability restricted to DSWPD patients WITH a confirmed
    phase delay - the authors state it "remains unknown whether the same treatment regime would
    benefit patients experiencing DSWPD sleep symptomology without a delay in the endogenous
    melatonin rhythm."
funding: "NCATS NIH HHS (per PubMed grant record). Full funding statement not extracted."
notes: |
  WHY THIS RECORD MATTERS: the task asked for the AASM guideline's melatonin dose and timing. This
  is the randomised evidence UNDERNEATH that recommendation, and it post-dates the 2015 guideline.
  The authors note at the outset that "Although there are published therapeutic guidelines for the
  administration of melatonin for DSWPD, to our knowledge, randomised controlled trials are
  lacking" - i.e. the AASM 2015 recommendation was made without a trial of this kind.

  THE REGIMEN, EXACTLY AS TESTED (this is what the report should quote if it recommends melatonin):
  0.5 mg FAST-RELEASE melatonin, taken 1 hour before the patient's DESIRED bedtime, on at least 5
  consecutive nights per week, for 4 weeks, COMBINED WITH behavioural sleep-wake scheduling in
  which bedtime is scheduled at the desired bedtime. Note that 0.5 mg is far lower than the 5 mg
  in the AASM adult recommendation (auger2015.yaml) and is consistent with that guideline's
  statement that timing matters more than dose.

  EFFECT SIZE, HONESTLY: sleep onset 34 min earlier (95% CI -60 to -8) and NNT ~3.5 for
  clinician-rated marked improvement (RR 2.20, 95% CI 1.26-3.83 [derived]). Real but modest. For
  comparison, the CBT + bright light trial in ADOLESCENTS (gradisar2011rct.yaml) produced a
  55.9 min reduction in school-night sleep onset latency and NNT 1.4. On the available evidence,
  behavioural/light therapy in adolescents looks stronger than melatonin in adults, though these
  are different populations, outcomes and comparators and I am not pooling them.

  THE MECHANISTIC SURPRISE, AND IT CHANGES HOW MELATONIN SHOULD BE DESCRIBED: post-treatment DLMO
  was NOT significantly advanced (difference 0.49 h, 95% CI -0.20 to +1.18 h [derived]), and the
  authors conclude "Improvements were achieved largely through the sleep-promoting effects of
  melatonin, combined with behavioural sleep-wake scheduling." So at 0.5 mg given 1 h before
  bedtime, melatonin worked mainly as a mild HYPNOTIC, not as a chronobiotic that moved the clock.
  The report should not tell the subject that melatonin "resets his body clock" on the strength of
  this trial. Caveat: the DLMO substudy was underpowered (n = 43), so absence of a detected phase
  shift is not proof of absence.

  TWO INCIDENTAL FINDINGS THAT ARE ARGUABLY MORE USEFUL TO MY SHARD THAN THE TREATMENT EFFECT,
  because they come from the only DLMO-CONFIRMED DSWPD sample I have and therefore describe the
  disease-present distribution of two instruments I recommend:

  1. THE EPWORTH IS A POOR DSWPD SCREEN. 84.5% of DLMO-confirmed DSWPD patients scored in the
     NORMAL/borderline ESS range (0-9); only 15.5% exceeded the conventional >9 threshold. An ESS
     used to screen for DSWPD would miss roughly five in six confirmed cases. This is a
     quantitative version of the point that DSWPD sleepiness is schedule-dependent rather than
     constitutional, and it also helps separate DSWPD from BIISS, where irrepressible sleepiness is
     a REQUIRED criterion. Practical consequence for our subject: a normal ESS does essentially
     nothing to lower the DSWPD posterior, and the report must not treat "he isn't very sleepy" as
     reassuring on that axis.

  2. THE ISI DOES NOT SEPARATE DSWPD FROM INSOMNIA DISORDER. Mean baseline ISI in confirmed DSWPD
     was 12.93 (SD 4.86) - inside the ISI's own "subthreshold insomnia" band (8-14) and ABOVE the
     >=10 case-detection cut-off I recommend for insomnia (morin2011.yaml). 43.6% were subthreshold
     and 16.4% scored in the "insomnia absent" band. So (a) an ISI >= 10 in our subject would be
     equally consistent with DSWPD as with insomnia disorder and cannot adjudicate between them,
     and (b) an ISI below 10 does not exclude DSWPD. The ISI remains the best instrument for
     grading insomnia SEVERITY; it is not a differential-diagnostic test. This qualifies the
     "highest information-per-minute measurement" claim I made for the ISI in screening_priors.md
     section 3.3 - that claim holds for the insomnia-vs-no-insomnia question only.
shard: "s19_sleep_disorders"
