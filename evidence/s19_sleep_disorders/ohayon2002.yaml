rob:
  tool: AMSTAR-2
  judgement: high
  notes: "A narrative review of more than 50 community surveys, not a systematic review with a registered protocol: no reported search strategy, no inclusion/exclusion table, no risk-of-bias appraisal of the included surveys, no quantitative pooling and therefore no pooled variance. It is 24 years old, predates DSM-5 and ICSD-3, and reports general-adult rather than adolescent estimates. It earns its place only as the canonical statement of the definitional-sensitivity problem, which the report needs in order to justify naming a criteria set. Abstract-only access on my side (Unpaywall reports no OA location for 10.1053/smrv.2002.0186); the four prevalence figures are verbatim from the PubMed abstract."
funding: "Not stated in the abstract"
notes: |
  ACCESS: abstract only.
  ROLE: definitional-sensitivity anchor, not a prior source. The adolescent/young-adult insomnia priors used in
  screening_priors.md come from hysing2013 (18.5% DSM-5, 16-19 y), sivertsen2019 (22.2% DSM-5, male students) and
  johnson2006 (10.7% lifetime DSM-IV by interview, 13-16 y). Ohayon supplies the reason those three numbers disagree.
  ONE FURTHER LINE WORTH CARRYING INTO THE REPORT, VERBATIM FROM THE ABSTRACT: "The prevalence of insomnia symptoms
  generally increases with age, while the rates of sleep dissatisfaction and diagnoses have little variation with
  age." So the DIAGNOSIS rate - the rung that matters for management - is roughly age-flat, which is mild support for
  transporting an adult diagnosis-level figure to a 19-year-old, in contrast to DSWPD where the age gradient is steep
  (0.2-1.5% all-age versus 3.3-4.7% at 16-35, per futenma2023).
  ALSO: "individuals with insomnia are more likely to have a major depressive illness. Longitudinal studies have shown
  that the persistence of insomnia is associated with the appearance of a new depressive episode." This is the
  bidirectional-risk statement that justifies pairing any positive insomnia screen with a mood screen.
