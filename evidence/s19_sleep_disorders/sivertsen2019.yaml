    conversion_formula: "'The overall prevalence of insomnia was 34.2% in women and 22.2% in men' verbatim. n_male = 50054 x (1 - 0.691) = 15467. se = sqrt(0.222*0.778/15467) = 0.00334; Wald 95% CI = [0.2155, 0.2285]. My construction. As with sivertsen2021 the Wald interval reflects only sampling error and is far narrower than the true uncertainty given a 30.8% response rate."
    from_figure: false
    inferred_from_ci: false
    direction_note: "descriptive prevalence. THE MALE-SPECIFIC, STUDENT-SPECIFIC, DSM-5 INSOMNIA PRIOR - the closest available match to our subject on sex, age and setting. It is HIGH: roughly one in five male students meets DSM-5 insomnia criteria. Insomnia is the single most prevalent candidate condition in the differential, more than four times as common as DSWPD."
