    outcome_construct: student_weekday_and_weekend_sleep_duration
    exposure: {type: weekend_catchup, dose_h: 7.4, referent_h: 8.417, duration_days: null, contrast_label: "mean sleep duration on weekdays (7:24) versus weekends (8:25), unselected Norwegian university students"}
    scale: hours
    unit: "hours of weekend-minus-weekday sleep duration"
    value: 1.017
    se: null
    ci: null
    conversion_formula: "'Both male and female students obtained a mean sleep duration in the lower end of the normal range on weekdays (7:24 hr), but met their own sleep need and sleep recommendations at weekends (8:25 hr)' verbatim. 8:25 - 7:24 = 1:01 = 1.017 h. The abstract gives no SDs and no CI, so se is null rather than invented."
    from_figure: false
    inferred_from_ci: false
    direction_note: "positive = students sleep longer at weekends. THE NORMATIVE STUDENT COMPARATOR OUR SUBJECT SHOULD BE SCORED AGAINST, AND HE IS AN OUTLIER ON BOTH LIMBS: unselected students average 7:24 on weekdays (he reports 5-6 h, i.e. ~1.5-2.4 h below) and 8:25 at weekends (he reports 7-8 h, i.e. ~0.4-1.4 h BELOW). The weekend shortfall is the more diagnostically interesting of the two: unlike the average student, our subject does NOT reach his sleep need even when free. That is an argument AGAINST DSWPD criterion 3 (which requires normal sleep duration for age on an ad libitum schedule) and an argument FOR restriction that persists across the whole week."
    covariates: []
    followup_years: null
    cohort_family: "SHoT_Norway"
    quote: "The results from 2018 showed large weekday-weekend differences across most sleep parameters. Both male and female students obtained a mean sleep duration in the lower end of the normal range on weekdays (7:24 hr), but met their own sleep need and sleep recommendations at weekends (8:25 hr)."
