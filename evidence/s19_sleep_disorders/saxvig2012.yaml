    exposure: {type: descriptive, dose_h: null, referent_h: null, duration_days: null, contrast_label: "delayed sleep phase PLUS inability to advance sleep PLUS >=1 daytime consequence, ages 16-19"}
    scale: probability
    unit: "proportion of high school students"
    value: 0.057
    se: 0.00647
    ci: [0.0443, 0.0697]
    conversion_formula: "'68% of these students (5.7% of the total sample)' verbatim from abstract. se = sqrt(0.057*0.943/1285) = 0.00647; Wald 95% CI = [0.0443, 0.0697]. My construction."
    from_figure: false
    inferred_from_ci: false
    direction_note: "descriptive. THE TRAIT-TO-DISORDER ATTRITION IS THE POINT: adding the two clinically decisive requirements (cannot advance the sleep period; at least one daytime consequence) removes only 32% of cases, 8.4% -> 5.7%. So among 16-19 year olds with a delayed phase, TWO THIRDS already carry impairment. This is the strongest argument in the shard for actually screening rather than assuming benign lateness."
