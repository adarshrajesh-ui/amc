rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "Randomized sample of 1,285 Norwegian high-school students aged 16-19 - the best age match in the whole shard - but everything is self-report via an internet questionnaire, the delayed-sleep-phase definition is a two-item symptom rule that does not attempt ICSD criteria, and no response rate is given in the abstract. The 02:00 sleep-onset threshold is an arbitrary clock time rather than a phase measure, so it will misclassify anyone whose social schedule is itself late. Abstract-only access (Unpaywall is_oa = false), so I could not audit the item wording, the response rate, or the sex breakdown."
funding: "Not stated in the abstract"
notes: |
  ACCESS: abstract only. Unpaywall reports is_oa = false for 10.1016/j.sleep.2011.10.024.
  SAME COHORT AS pallesen2011: both are the n=1285 Hordaland high-school internet survey (16-19 y) by the same
  Bergen group. pallesen2011 reports BIISS = 10.4% in that identical sample and saxvig2012 reports delayed sleep
  phase = 8.4% in it. cohort_family Hordaland_HS_2005 is set on both so the pooler does not treat them as
  independent. THAT OVERLAP IS ITSELF A FINDING: in one sample of 1,285 late adolescents, ~8% screen positive for
  a delayed phase and ~10% screen positive for behaviourally induced insufficient sleep, and the paper does not
  report how many are the same people. The two hypotheses in our subject's differential are NOT rare-versus-common;
  they are both roughly one-in-ten phenomena in this age band.
  WHY I RECORDED BOTH THE 8.4% AND THE 5.7%. The task explicitly asked for the prevalence of a delayed chronotype
  as distinct from the disorder. 8.4% is the trait-ish figure and 5.7% is the closest this paper gets to a
  disorder-level figure. Neither is an ICSD-3 diagnosis. The ICSD-3-anchored numbers come from sivertsen2021
  (4.7% males) and danielsson2016 (4.0% DSM-5 DSPD).
shard: "s19_sleep_disorders"
