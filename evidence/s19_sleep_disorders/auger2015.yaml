rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "GRADE-based AASM clinical practice guideline. Underlying evidence for every DSWPD recommendation was rated LOW except the paediatric melatonin dosing study (MODERATE, single RCT, n=64 analysed, ages 6-12). All DSWPD recommendations are WEAK FOR (conditional). Major limitation for our subject: the paediatric melatonin dose-finding RCT enrolled 6-12 year olds, NOT 16-19 year olds, so the 0.15 mg/kg figure is extrapolated upward in age; the psychiatric-comorbidity studies were also 6-12 y and all had ADHD. No adolescent-specific circadian-timed (DLMO-referenced) dosing trial existed at guideline publication. Melatonin trials mostly used CLOCK-time dosing (19:00-21:00) rather than DLMO-referenced dosing, yet the guideline notes that earlier circadian timing produced larger phase advances."
funding: "American Academy of Sleep Medicine (task force members declared no conflicts of interest)"
notes: |
  KEY GUIDELINE STATEMENTS RELEVANT TO OUR 18-19 YEAR OLD MALE (all verbatim):

  (1) Recommendation for adolescents, no comorbidity:
      "5.2.6.2.1a The TF suggests that clinicians treat children and adolescents with DSWPD (and no
      comorbidities) with strategically timed melatonin (versus no treatment). [WEAK FOR]"
      Dosing basis: "Optimal results were obtained with a dose of 0.15 mg/kg, taken 1.5-2.0 hours
      prior to habitual bedtime, for 6 nights." For a 70 kg 19-year-old, 0.15 mg/kg = 10.5 mg, which
      is FAR above the doses that are usually clinically effective for phase-shifting; the paediatric
      RCT's actual mean administered dose in the 0.15 mg/kg arm was 4.4 +/- 1.0 mg in 6-12 year olds
      (verbatim: "The three active treatment groups received melatonin at dosages of 0.05 mg/kg,
      0.1 mg/kg, and 0.15 mg/kg, with respective mean doses of 1.6 +/- 0.4 mg (n = 16), 2.9 +/- 0.9 mg
      (n = 19), and 4.4 +/- 1.0 mg (n = 18)."). I flag this explicitly: mg/kg scaling to adult body
      mass is NOT supported by the source data and the report should not do it naively.

  (2) Recommendation for adults:
      "5.2.6.1a The TF suggests that clinicians treat DSWPD in adults with and without depression with
      strategically timed melatonin (versus no treatment). [WEAK FOR]"
      Dosing basis: "Positive results were obtained with a 5 mg dose timed between 19:00-21:00 (no
      circadian-based timing), for a period of 28 days."

  (3) Timing matters more than dose (both the adult and paediatric trials):
      "the authors reported an inverse relationship between the timing of melatonin administration
      (irrespective of dose) and the magnitude of DLMO phase advance, such that earlier timing of the
      former (in relation to DLMO) resulted in greater phase advances."
      and: "As with the previously discussed Mundey study, a positive relationship between DLMO phase
      advances and an earlier circadian TOA was described (no relationship observed with respect to
      clock TOA), but no differences were observed between the various melatonin dosage groups."

  (4) Things the guideline explicitly could NOT recommend for DSWPD:
      - "There is insufficient evidence to support the use of strategic avoidance of light as a
        treatment for patients with DSWPD (versus no treatment). No recommendation."
      - "There is insufficient evidence to support efficacy of post-awakening light therapy
        (monotherapy) as a treatment for DSWPD (versus no treatment). No recommendation."
      - "There is insufficient evidence to support the use of sleep-promoting medications as a
        treatment for patients with DSWPD (versus no treatment). No recommendation."
      - "There is no evidence to support the use of wakefulness-promoting medications as a treatment
        for patients with DSWPD. No recommendation."
      - "There is insufficient evidence to support the use of oral vitamin B12 (and no evidence to
        support alternate somatic interventions) among patients with DSWPD (versus no treatment).
        No recommendation."

  (5) On DIAGNOSIS (ICSD-3 change, relevant to our measurement protocol):
      "Other major changes include the recommendation that CRSWD diagnoses are ascertained via
      actigraphy derived data when possible (with inclusion of both work/school and free days), to
      provide objective longitudinal documentation of sleep-wake patterns. Consistent with this
      emphasis on objective measures, circadian phase assessments (e.g., dim light melatonin onset,
      or DLMO) are also recommended, if feasible."
      Note the explicit requirement to include BOTH school days AND free days -- exactly the
      weekday/weekend contrast our subject reports.

  (6) Blue-blocking glasses: mentioned only as indirect evidence in insomnia patients, not a DSWPD
      recommendation: "adult insomnia patients who wore 'blue blocker' (< 550 nm) glasses during the
      3 hours prior to habitual bedtime demonstrated improved subjective sleep quality compared with
      the placebo intervention (yellow-tinted glasses that blocked only ultraviolet light).
      Importantly, there are no tangible risks associated with these interventions."

  Full text retrieved from PubMed Central (PMC4582061) and parsed to plain text; all quotes above are
  verbatim from that retrieval.
