    exposure: {type: other, dose_h: null, referent_h: null, duration_days: 6, contrast_label: "melatonin 0.15 mg/kg taken 1.5-2.0 h before habitual bedtime x 6 nights vs placebo; actigraphic sleep onset time; children 6-12 y with DSWPD"}
    scale: raw_units
    unit: "minutes (negative = sleep onset advanced/earlier)"
    value: -42.77
    se: 10.72
    ci: [-63.78, -21.77]
    conversion_formula: "se = (upper - lower)/3.92 = (-21.77 - -63.78)/3.92 = 42.01/3.92 = 10.72 min"
    from_figure: false
    inferred_from_ci: true
    direction_note: "negative = sleep onset time moved EARLIER (therapeutic direction for DSWPD)"
