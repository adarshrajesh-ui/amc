rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "Enormous sample (50,054) drawn from a national census invitation of all 162,512 Norwegian full-time students, BUT the response rate was 30.8% and respondents were 69.1% women against a real student population that is roughly half male - so male non-response is severe and the male prevalence estimate is the one most exposed to selection bias. DSWPD was ascertained ENTIRELY by self-report questionnaire operationalizing ICSD-3; no actigraphy, no sleep diary, no DLMO, no clinician. ICSD-3 criterion C (normal sleep on an ad libitum schedule) and criterion E (not better explained by another disorder) cannot be verified by questionnaire, so this is a symptom-cluster prevalence, and the direction of the resulting bias is not determinable a priori. Abstract-only access on my side: Unpaywall reports is_oa = false and Europe PMC reports no PMC deposit for 10.1016/j.sleep.2020.09.028, so I could not read the operationalization, the CIs, or the male-subgroup table."
funding: "Not stated in the abstract"
notes: |
  ACCESS: abstract only (Unpaywall is_oa = false; Europe PMC isOpenAccess = N, no PMCID). Every number above is
  verbatim from the PubMed abstract. I did NOT extract the correlates (overweight, physical inactivity, self-harm,
  suicidality) as effects because the abstract gives no effect sizes for them.
  WHAT I WANTED FROM THIS PAPER AND COULD NOT GET: the exact self-report items used to operationalize ICSD-3, and
  the male-specific CI. Both matter because 4.7% is the single number that most influences the DSWPD prior for our
  subject, and I cannot audit it.
  THE THREE-WAY DISAGREEMENT ON SEX. sivertsen2021 (18-35 y students): males 4.7% > females 2.7%. sivertsen2013
  (16-18 y, same group, ICSD-R): boys 2.7% < girls 3.7%. danielsson2016 (16-26 y, DSM-5): DSPD "equally common in
  males and females" but DSP (the trait, not the disorder) "more common in males". futenma2023 reviews this and
  concludes the sex literature is inconsistent. The report should NOT claim male sex raises DSWPD risk; it should
  claim that sex is uninformative and that the pooled prior across all four population estimates is 3-5%.
  THIS RECORD AND sivertsen2019 SHARE THE SHoT SURVEY (2018 wave, n=50,054, same 30.8% response rate). Both carry
  cohort_family SHoT_Norway so the pooler treats them as one family.
