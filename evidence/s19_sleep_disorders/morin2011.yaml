rob:
  tool: Newcastle-Ottawa
  judgement: low
  notes: |
    Strong design for a psychometric paper: population-based community sample (n=959) for case
    detection plus an independent clinical sample (183 treatment-seekers + 62 non-insomnia controls)
    with sleep diaries, POLYSOMNOGRAPHY and diagnostic interviews to validate insomnia status, and an
    independent assessor for the treatment-response anchor. Cut-off derived by ROC rather than
    asserted. LIMITATIONS FOR OUR USE: (a) ABSTRACT-ONLY retrieval, so I have no ROC curve, no CIs on
    sensitivity/specificity, no cell counts and no age-stratified analysis; (b) adult Canadian sample
    with no stated age range in the abstract, so the cut-off's performance in 18-19 year olds is
    assumed, not demonstrated; (c) cut-offs derived in one population do not transport perfectly, and
    the community cut-off of 10 will over-call in a low-prevalence setting.
funding: "Not available (abstract-only retrieval)."
notes: |
  n field = 1,204 = 959 (community) + 183 (clinical insomnia) + 62 (clinical controls), summed from the
  abstract: "Participants were 959 individuals selected from the community for an epidemiological study
  of insomnia (Community sample) and 183 individuals evaluated for insomnia treatment and 62 controls
  without insomnia (Clinical sample)." The cut-off of 10 was derived in the 959-person community
  subsample only.

  THIS IS THE BEST-EVIDENCED INSTRUMENT IN MY WHOLE SET. Unlike the ESS >10 threshold (a normal-range
  boundary from an occupational survey) and unlike the absent adolescent ESS cut-off, the ISI >= 10
  cut-off has a real ROC derivation against interview-validated caseness, and it yields usable
  likelihood ratios (LR+ 7.0, LR- 0.16 -- my arithmetic, shown above).

  There is a separate Iranian adolescent ISI psychometrics paper (PMID 34381573, Sleep Sci 2021,
  "Psychometric properties of insomnia severity index in Iranian adolescents") that I found in
  screening but did not extract: it is a translation/factor-structure study in a different
  population and would not change the cut-off used here. Logged as excluded in screening_log.md.

  HOW THE REPORT SHOULD USE THIS: the ISI is the rule-OUT instrument in the protocol. Our subject's
  differential turns on whether he has trouble INITIATING sleep when he tries. An ISI below 10,
  combined with a short sleep-onset latency on free nights, argues against both insomnia disorder and
  DSWPD and towards behaviourally induced insufficient sleep. An ISI of 10+ with long sleep-onset
  latency on weekday nights but SHORT latency on free nights points to DSWPD rather than insomnia --
  the ISI alone cannot make that distinction, which is why it must be paired with the sleep diary.
shard: "s19_sleep_disorders"
