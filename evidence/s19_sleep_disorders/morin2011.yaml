    scale: probability
    unit: "proportion (specificity)"
    value: 0.877
    se: null
    ci: null
    conversion_formula: "reported directly as 87.7%; no CI or cell counts in the abstract, so no SE derivable"
    from_figure: false
    inferred_from_ci: false
    direction_note: "Specificity. See the LR arithmetic in the sensitivity record above."
    covariates: []
