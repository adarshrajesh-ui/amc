effects:
  - outcome_domain: exposure_measurement
    outcome_construct: isi_optimal_cutoff_community_case_detection
    exposure: {type: descriptive, dose_h: null, referent_h: null, duration_days: null, contrast_label: "ROC-optimal ISI cut-off for detecting insomnia cases in a population-based community sample (n=959)"}
    scale: raw_units
    unit: "ISI points (0-28); score >= 10 = screen positive"
    value: 10.0
    se: null
    ci: null
    conversion_formula: null
    from_figure: false
    inferred_from_ci: false
    direction_note: "HIGHER ISI = more severe insomnia. This is a genuine ROC-derived cut-off against interview-validated insomnia status, unlike the ESS >10 threshold which is a normal-range boundary. Note this is the COMMUNITY cut-off; a higher threshold (13) is conventionally used in clinical samples, but that figure is not in this abstract and I have not extracted it."
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "A cutoff score of 10 was optimal (86.1% sensitivity and 87.7% specificity) for detecting insomnia cases in the community sample."

  - outcome_domain: exposure_measurement
    outcome_construct: isi_sensitivity_at_cutoff_10
    exposure: {type: descriptive, dose_h: null, referent_h: null, duration_days: null, contrast_label: "sensitivity of ISI >= 10 for interview-validated insomnia, community sample"}
    scale: probability
    unit: "proportion (sensitivity)"
    value: 0.861
    se: null
    ci: null
    conversion_formula: "reported directly as 86.1%. No CI is given in the abstract and the number of true cases in the community sample is not stated, so I cannot compute an SE -- se left null rather than invented."
    from_figure: false
    inferred_from_ci: false
    direction_note: "Sensitivity. Combined with specificity 0.877 this yields LR+ = 0.861/(1-0.877) = 7.00 and LR- = (1-0.861)/0.877 = 0.159. Those two LRs are MY arithmetic from the reported sensitivity/specificity pair, and are the numbers the report should use to update on an ISI result."
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "A cutoff score of 10 was optimal (86.1% sensitivity and 87.7% specificity) for detecting insomnia cases in the community sample."

