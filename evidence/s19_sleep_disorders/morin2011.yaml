  - outcome_domain: exposure_measurement
    outcome_construct: isi_likelihood_ratio_positive_derived
    exposure: {type: descriptive, dose_h: null, referent_h: null, duration_days: null, contrast_label: "LR+ for ISI >= 10, derived from the reported sensitivity/specificity pair"}
    scale: raw_units
    unit: "likelihood ratio (positive)"
    value: 7.00
    se: null
    ci: null
    conversion_formula: "LR+ = sensitivity/(1 - specificity) = 0.861/(1 - 0.877) = 0.861/0.123 = 7.00. THIS IS MY ARITHMETIC, not a number reported by the paper."
    from_figure: false
    inferred_from_ci: false
    direction_note: "LR+ = 7.0 means a positive ISI screen multiplies the pre-test odds of insomnia by 7. Applied to a male young-adult insomnia prior of ~0.22 (see sivertsen2019.yaml), pre-test odds 0.282 -> post-test odds 1.97 -> posterior 0.664."
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "A cutoff score of 10 was optimal (86.1% sensitivity and 87.7% specificity) for detecting insomnia cases in the community sample."

  - outcome_domain: exposure_measurement
    outcome_construct: isi_likelihood_ratio_negative_derived
    exposure: {type: descriptive, dose_h: null, referent_h: null, duration_days: null, contrast_label: "LR- for ISI < 10, derived from the reported sensitivity/specificity pair"}
    scale: raw_units
    unit: "likelihood ratio (negative)"
    value: 0.159
    se: null
    ci: null
    conversion_formula: "LR- = (1 - sensitivity)/specificity = (1 - 0.861)/0.877 = 0.139/0.877 = 0.1585. THIS IS MY ARITHMETIC, not reported by the paper."
    from_figure: false
    inferred_from_ci: false
    direction_note: "LR- = 0.16 means a negative ISI screen divides the odds of insomnia by ~6.3. Applied to a prior of 0.22: pre-test odds 0.282 -> 0.0447 -> posterior 0.043. A negative ISI is therefore strong evidence AGAINST insomnia disorder, which is how the report should use it: as a rule-out."
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "A cutoff score of 10 was optimal (86.1% sensitivity and 87.7% specificity) for detecting insomnia cases in the community sample."

