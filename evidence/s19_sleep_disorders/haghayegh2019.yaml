rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: |
    Strengths: PRISMA-adherent, 7 databases, 3085 records screened to 22 studies with 8 contributing
    quantitative data; random-effects models; heterogeneity essentially absent for every pooled
    parameter (I^2 = 0-24%); the authors report prediction intervals as well as CIs; and critically
    they STRATIFY by device generation, which is the analysis that makes the literature coherent.
    Concerns: (1) only 3 comparisons underpin every current-generation estimate, so these are
    fragile and the CIs are wide relative to their point estimates; (2) SE for sleep-staging models
    rests on a SINGLE comparison; (3) Fitbit only - does not cover Oura, Apple Watch, Garmin,
    Whoop or Samsung, so it cannot be read as a statement about consumer wearables generally;
    (4) 2019 vintage, so "current generation" means Fitbit Charge 2 / Alta HR era hardware, not
    2025 devices; (5) validation samples were adults, largely not adolescents, and mostly single
    laboratory nights with normal time in bed - accuracy on the short and irregular nights that
    characterise our subject is not established here; (6) effect sizes are standardised by the
    PSG SD, which varies across samples, so pooled g values are less interpretable than the raw
    minute biases (I extracted both).
funding: "Not stated in the retrieved full text; no funder records in Crossref and no grant records in the PubMed entry."
notes: |
  WHY I ADDED THIS THIRD WEARABLE RECORD: it resolves an apparent contradiction between my other
  two sources, and it changes a protocol recommendation.

  RECONCILIATION. Chinoy 2021 found Fitbit Alta HR TST bias of only +2.6 min; Lee 2025 pooled
  across many consumer devices and found -16.9 min. Those look inconsistent. Haghayegh's
  stratification explains it: DEVICE GENERATION is the moderator. Movement-only devices
  overestimate TST substantially (g = -0.51, 95% CI -0.71 to -0.30; +7 to +67 min), whereas
  devices that add heart-rate variability to staging show no significant TST bias (g = -0.15,
  95% CI -0.43 to 0.13; absolute bias < 12 min). So the honest answer to the task's question
  "how accurate are CURRENT-generation wearables for total sleep time" is: bias under ~12 min,
  which is acceptable for estimating habitual sleep duration.

  THE FINDING THAT MATTERS MORE, AND IT IS A WARNING. Current-generation Fitbits SIGNIFICANTLY
  UNDERESTIMATE SLEEP ONSET LATENCY (g = 0.32, 95% CI 0.04 to 0.60, P = .03). Sleep onset latency
  is the single most decision-relevant measurement in my entire shard - it carries LR 0.21 (fast
  onset) to 3.4 (>90 min) for DSWPD, far more information than any other one-question item. A
  device that systematically shortens the measured latency biases that test in the FALSELY
  REASSURING direction: it will tend to make a phase-delayed subject look like he falls asleep
  promptly, pushing the DSWPD posterior down when it should go up. The mechanism is visible in the
  same paper - specificity for wake is only 0.58-0.69 even in current devices, so quiet wakeful
  lying-in-bed before sleep onset is scored as sleep.

  PROTOCOL CONSEQUENCE: do not take sleep onset latency from a wearable. Take it from the sleep
  diary, and use the wearable only for sleep duration and timing. This is consistent with the AASM
  actigraphy guideline (smith2018.yaml), which covers FDA-cleared actigraphs and explicitly does
  not extend to consumer devices.

  DEVICE-GENERATION CAVEAT: "current generation" in a 2019 review means the Charge 2 / Alta HR
  era. Whether 2025-2026 hardware has closed the wake-specificity gap is not answered by this
  record, and Lee 2025 (newer, broader) still found a significant pooled TST underestimate across
  brands, so I would not assume the problem has been solved.
shard: "s19_sleep_disorders"
