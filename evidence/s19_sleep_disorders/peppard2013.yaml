rob:
  tool: Newcastle-Ottawa
  judgement: low
  notes: "The strongest design in this shard for its purpose: a community-based cohort randomly selected from an employed population, 1,520 participants contributing 4,563 in-laboratory POLYSOMNOGRAMS over 1988-2011, with prevalence modelled on age, sex, BMI and BMI-squared and then standardized to NHANES BMI distributions. The critical limitation for us is not internal validity but TRANSPORTABILITY: the cohort was 30-60 years old at enrolment and the youngest analytic stratum is 30-49, so there is NO observation below age 30 and every number must be extrapolated downward in age. Secondary limitations: 96% non-Hispanic white; an employed population, which excludes the most severely affected; and treated cases were classified as AHI > 15, which inflates the severe categories slightly. Also note the printed Table 2 row for men 30-49 with BMI 30-39.9 gives '44.6  48.7, 50.2', where the point estimate falls outside its own stated interval - an evident typographical error in the source. It does not affect the BMI < 25 row I use, but I flag it because it shows the tables were not perfectly proofed."
funding: "NIA NIH HHS; NCATS NIH HHS; NICHD NIH HHS; NHLBI NIH HHS; NCRR NIH HHS"
notes: |
  THE TASK ASKED FOR OSA PREVALENCE IN MALES AGED 18-25 WITH NORMAL BMI AND THAT NUMBER DOES NOT EXIST IN THIS PAPER
  OR IN benjafield2019. Both are restricted to adults 30 and over (Peppard 30-70, Benjafield 30-69). REPORTING REALITY,
  as the extraction instructions require: the best available evidence is a downward age extrapolation from the lean-male
  30-49 stratum, and the honest statement is an upper bound rather than a point estimate.
  WHAT I DID GET, AND IT IS BETTER THAN EXPECTED: the full BMI-by-age-by-sex stratified tables, including the lean
  (BMI < 25) male rows for all four SDB definitions, PLUS the fitted logistic coefficients. I reproduced all three of
  the tabulated lean-male estimates from the coefficients to within coefficient-rounding error (0.0789 vs 0.070;
  0.0109 vs 0.0093; 0.0333 vs 0.027), which is my verification that I parsed the tables correctly rather than
  misreading a column.
  FULL LEAN-MALE PICTURE, AGES 30-49, BMI < 25:
    AHI >= 5                         7.0%  (95% CI 5.0, 9.3)
    AHI >= 15                        0.93% (95% CI 0.49, 1.59)
    AHI >= 5  AND ESS > 10           2.7%  (95% CI 1.5, 4.2)
    AHI >= 15 AND ESS > 10           0.39% (95% CI 0.10, 0.87)
  AGE GRADIENT IN THE SAME LEAN-MALE STRATUM (30-49 -> 50-70): AHI>=5 7.0% -> 18.9%; AHI>=15 0.93% -> 3.6%;
  AHI>=5+ESS>10 2.7% -> 7.7%. Roughly a 2.7-3.9x rise across two decades of age. Extrapolating the same log-linear
  gradient DOWNWARD by the ~1.1 decades from 39.5 (the 30-49 midpoint) to 19 would divide these by roughly 1.8-2.2,
  which is the basis for the ~1% symptomatic-OSA prior in screening_priors.md. THAT DOWNWARD EXTRAPOLATION IS MY
  JUDGEMENT, NOT THE PAPER'S, and it is flagged as such wherever it is used.
  ONE PIECE OF GOOD NEWS FOR THE SUBJECT: sivertsen2013 found BMI identical in DSPS and non-DSPS adolescents (22.2 vs
  22.2, Cohen's d = 0.00), so a normal BMI does not argue against a circadian diagnosis while it argues strongly
  against sleep-disordered breathing. The two hypotheses are separated by BMI in opposite ways.
