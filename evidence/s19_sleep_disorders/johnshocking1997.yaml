rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: |
    ABSTRACT-ONLY retrieval: I could not obtain the full text, so I have no subgroup denominators, no
    ESS distribution table, and no regression coefficients. Response rate 65% (non-response bias
    possible, plausibly in either direction for a sleep survey). Single-employer occupational sample
    aged 22-59 in Australia in the 1990s -- this contains NO adolescents, so the 'normal range 0-10'
    is being transported across a ~4-decade age gap and across a period of substantial change in
    adolescent sleep. 'Normal sleepers without evidence of a sleep disorder' was defined by
    questionnaire, not by PSG, so the reference group is impure. Most importantly the >10 threshold is
    a normal-range boundary, not an ROC-derived cut-off, and no sensitivity/specificity against any
    diagnostic standard is reported here.
funding: "Not available (abstract-only retrieval)."
notes: |
  THIS IS THE SOURCE OF THE ESS CUT-OFF, and it is weaker than its ubiquity suggests. The task asked
  for "the normal range, and the cut-off indicating excessive daytime sleepiness". Those come from
  this paper, not from the 1991 original validation:
    normal range in normal sleepers            = 0 to 10 (mean 4.6, SD 2.8)
    cut-off for excessive daytime sleepiness    = ESS > 10 (i.e. >= 11)
    range in central hypersomnolence patients   = 12 to 24
    prevalence of ESS > 10 in healthy workers   = 10.9%

  See johns1991.yaml for the original construct-validation paper, which does NOT itself supply a
  cut-off. Together these two records are the citation chain the report should use; citing Johns 1991
  for the ">10" threshold, which is common practice, is incorrect.

  ADOLESCENT NORMS: this paper cannot supply them (age range 22-59). See janssen2017.yaml, which
  validates the adolescent version of the instrument (ESS-CHAD) but states explicitly that
  adolescent cut-off points are NOT yet established. That is a genuine, unresolved gap in the
  literature and the report must not paper over it by applying the adult >10 threshold to a
  19-year-old as though it were validated.
