rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "GRADE-based AASM clinical practice guideline; every one of the seven recommendations is CONDITIONAL, none is STRONG. Only FDA-approved devices are within scope, which explicitly excludes consumer wearables (verbatim: 'only apply to the use of FDA-approved devices'). The 72-hour floor is driven by CPT billing convention rather than by measurement science, which is a real limitation when the clinical question is a weekday-vs-weekend contrast."
funding: "American Academy of Sleep Medicine"
notes: |
  ALL SEVEN RECOMMENDATIONS, VERBATIM (every one is Conditional / 'We suggest'):
   1. "We suggest that clinicians use actigraphy to estimate sleep parameters in adult patients with
      insomnia disorder. (Conditional)"
   2. "We suggest that clinicians use actigraphy in the assessment of pediatric patients with insomnia
      disorder. (Conditional)"
   3. "We suggest that clinicians use actigraphy in the assessment of adult patients with circadian
      rhythm sleep-wake disorder. (Conditional)"
   4. "We suggest that clinicians use actigraphy in the assessment of pediatric patients with circadian
      rhythm sleep-wake disorder. (Conditional)"
   5. "We suggest that clinicians use actigraphy integrated with home sleep apnea test devices to
      estimate total sleep time during recording (in the absence of alternative objective measurements
      of total sleep time) in adult patients suspected of sleep-disordered breathing. (Conditional)"
   6. "We suggest that clinicians use actigraphy to monitor total sleep time prior to testing with the
      Multiple Sleep Latency Test in adult and pediatric patients with suspected central disorders of
      hypersomnolence. (Conditional)"
   7. "We suggest that clinicians use actigraphy to estimate total sleep time in adult patients with
      suspected insufficient sleep syndrome. (Conditional)"

  SCOPE LIMITATION (important for the report's measurement protocol -- consumer wearables are OUT OF
  SCOPE of this guideline):
      "The following recommendations are intended as a guide for clinicians using actigraphy in
      evaluating patients with sleep disorders and circadian rhythm sleep-wake disorders, and only
      apply to the use of FDA-approved devices."

  BILLING/DURATION CONSTRAINT:
      "as noted by the descriptor for actigraphy, a minimum of 72 hours (with a maximum of 14 days) of
      consecutive recording is required, and the code cannot be used concurrently with HSAT or PSG
      codes."

  MY READ ON THE DURATION QUESTION (flagged as judgement, not from the source): the guideline's floor
  is 72 h, and the only place a 7-14 day figure appears is the pre-MSLT remark. Because the clinical
  question here is specifically the size of the weekday-weekend sleep discrepancy, a 72-hour recording
  can easily contain zero or one free day and is therefore inadequate for this indication. I recommend
  14 consecutive days (2 weekends) as the protocol length; that is the top of the AASM-permitted range
  and is consistent with the Auger 2015 requirement to include "both work/school and free days".
