rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Very large population-based sample (10,220 of an invited county cohort, 16-18 y), official register linkage for the school-attendance outcome. Weaknesses for this shard: (1) DSPS is defined entirely by SELF-REPORT approximating ICSD-R criteria - no actigraphy, no DLMO, no clinical interview, so the 'DSPS' group is a symptom cluster not a verified diagnosis; (2) the ICSD-R operationalization the authors used follows Johnson et al. (Pediatrics 2006) and requires only a 1-hour shift, which is looser than ICSD-3; (3) all sleep parameters are self-reported and derived (sleep duration = TIB - (SOL + WASO)); (4) the DSPS cell is n=306, so subgroup SDs (especially weekend TST, SD 1:05) are less stable than the non-DSPS cell. My derived likelihood ratios assume normality of continuous sleep parameters within groups, which is doubtful for SOL and weekend TST (both right-skewed); the LR direction is robust but the tail magnitudes are not."
funding: "Not stated in the retrieved full text"
notes: |
  WHY THIS IS THE MOST IMPORTANT RECORD IN THE SHARD. It is the only retrievable source that reports weekday AND
  weekend sleep parameters, with means and SDs, SEPARATELY for a DSPS group and a non-DSPS group, in exactly our
  subject's age band. That makes it the only source from which likelihood ratios for the subject's presenting
  features can be COMPUTED rather than guessed.
  DERIVED LIKELIHOOD RATIOS (normal approximation to the published means/SDs; arithmetic reproducible from the
  quoted Table 2 values). Point-density LR = f_DSPS(x)/f_nonDSPS(x); threshold LR+ = P(>=x|DSPS)/P(>=x|non-DSPS).
    weekday-weekend TST discrepancy:  x=2.0 h -> LR(point) 0.95, LR+ 1.30
                                      x=3.0 h -> LR(point) 1.24, LR+ 1.47
                                      x=5.0 h -> LR(point) 1.68, LR+ 1.70
    weekday TST:                      x=5.5 h -> LR(point) 1.42;  P(<=5.5|DSPS)=0.446 vs 0.280 -> LR 1.59
    weekend TST:                      x=10.5 h -> LR(point) 0.49, LR+ 0.19   (AGAINST DSPS)
    weekday-weekend BEDTIME diff:     x=2.0 h -> LR+ 1.11 ; x=3.0 h -> LR+ 0.63   (essentially uninformative;
                                      the paper's own test is P = .434)
    weekday-weekend RISETIME diff:    x=5.0 h -> LR+ 1.75 ; x=6.0 h -> LR+ 2.14
    sleep onset latency:              x=1.0 h -> LR+ 1.62 ; x=2.0 h -> LR+ 2.17 ; x=2.5 h -> LR+ 2.37
    oversleeping most days/always:    LR+ 5.52, LR- 0.76   (direct from percentages, no distributional assumption)
    meets insomnia criteria:          LR+ 4.54, LR- 0.50   (direct from percentages)
  THE AUTHORS THEMSELVES MAKE THE POINT THIS SHARD EXISTS TO MAKE: "The misalignment criteria of the DSPS is at a
  level that might be regarded as the norm for adolescents, with the observed mean difference in bedtime and
  risetime for weekdays versus weekends being 2:15 hours and 4:28 hours respectively. What perhaps differentiate
  these normal sleep patterns from a diagnostic level of DSPS may therefore only partly be the sleep
  characteristics; more important are their functional impact and outcomes."
  ALSO EXTRACTED BUT NOT CODED AS SEPARATE EFFECTS (all from the quoted Table 1/Table 2 blocks):
    weekday bedtime 23:17 (0:59) vs 23:46 (1:04), d 0.42 ; weekday risetime 06:47 (0:40) vs 07:00 (0:48), d 0.30
    weekday TIB 07:30 (1:00) vs 07:14 (1:07), d -0.20 ; weekday TST 06:27 (1:38) vs 05:41 (1:21), d -0.45
    weekday sleep efficiency 84.8% vs 78.0%, d -0.43 ; WASO 0:14 vs 0:11, P = .130 (NULL)
    subjective sleep need 08:34 (1:52) vs 09:09 (1:58), d 0.25
    sleep deficiency weekdays 02:07 vs 03:28, d -0.48 ; weekends +00:04 vs -00:40, d -0.25
    sleepiness 2.25 vs 3.09 days/wk, d 0.39 ; tiredness 3.68 vs 4.87 days/wk, d 0.65
    insomnia comorbid 12.3% vs 55.9%, d 1.04 ; SMFQ depression 5.7 vs 8.8, d 0.53
    register-based school non-attendance 3.9 vs 7.1 days and 7.2 vs 15.4 hours over 6 months
    adjusted OR for days of non-attendance in boys 3.22 (95% CI 1.94-5.34)
  SAME COHORT AS hysing2013 (ung@hordaland 2012). cohort_family is set to ung_hordaland on every effect so the
  pooler does not double-count these two records against each other.
