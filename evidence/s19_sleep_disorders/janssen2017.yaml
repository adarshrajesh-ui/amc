rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: |
    ABSTRACT-ONLY retrieval; no mean/SD by age or sex, no item thresholds, no reliability
    coefficients, no external criterion. n = 297 from only TWO independent (i.e. private,
    fee-paying) schools in Victoria, Australia -- a narrow and socioeconomically unrepresentative
    sampling frame, so even if norms had been reported they would not be population norms. Purely
    internal-structure validation: no external criterion (no MSLT, no PSG, no clinical diagnosis)
    was used, which is exactly why no cut-off could be derived. Co-authored by the ESS's original
    developer (M.W. Johns), a conflict of interest for judgements about the instrument.
funding: "Not available (abstract-only retrieval)."
notes: |
  RECORDED PRIMARILY AS A DOCUMENTED ABSENCE. The task brief asked for adolescent ESS norms; the
  honest answer from the adolescent-instrument validation literature is that the modified instrument
  (ESS-CHAD) is internally valid in 12-18 year olds but has no established cut-off and no published
  population norms in this paper. I searched PubMed for adolescent ESS normative/reference-value
  studies (queries: "Epworth Sleepiness Scale adolescents normative values reference";
  "Epworth Sleepiness Scale reliability validity adolescents") and the returned records were
  non-English-language translations/validations of the ESS or ESS-CHAD (Slovenian, Malay, Spanish,
  Bangla), a narcolepsy-with-cataplexy paediatric validation, and unrelated instruments -- none of
  them a large representative adolescent normative sample with a derived cut-off.

  CONSEQUENCE FOR THE REPORT: use the ESS-CHAD item wording, score it 0-24 as usual, and interpret it
  against the ADULT thresholds while stating plainly that the thresholds are unvalidated in this age
  group:
      ESS 0-10   within the adult normal-sleeper range
      ESS 11+    above the adult normal range ("excessive daytime sleepiness")
      ESS 12-24  the range occupied by adult central-hypersomnolence patients
  and treat the ESS as a severity/triage measure rather than as a diagnostic test. This limitation is
  not fatal to the protocol -- for our differential the ESS is doing triage work (is he sleepy enough
  to warrant objective testing?) rather than case-definition work.
