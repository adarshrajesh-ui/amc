    from_figure: false
    inferred_from_ci: false
    direction_note: "spread only. THE SINGLE MOST IMPORTANT NUMBER IN THIS SHARD for exposure uncertainty: in age-matched adolescents the individual-level discrepancy has SD ~1.5 h."
