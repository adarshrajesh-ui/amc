rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "population-based birth cohort, one week of wrist actigraphy (Actiwatch Spectrum), double-scored; but the actigraphy 'duration' variable is a SLEEP-PERIOD measure (see notes) so the reported bias against true TST is an UNDERESTIMATE; self-report derived from usual bed/wake times, so it is closer to time in bed than to total sleep time; single wave, cross-sectional."
funding: "NIH (NIHMS2121673 author manuscript; FFCWS supported by NICHD)"
notes: |
  BEST AGE MATCH in the shard (mean age 15.4 y, US, 51% Black). Verbatim support:
  (1) Abstract: "Self-reported sleep duration overestimated actigraphy-assessed duration by 27.87 minutes (95% CI: 34.96,
      20.78) after adjustment. Agreement between duration categories was 73% (kw = 0.12, 95% CI: 0.07, 0.18). The mean
      difference was larger on weekends (74.3 +/- 144.7 minutes) than weekdays (27.5 +/- 92.7 minutes)."
  (2) Table 2 Total Sample: "Overall | 506.6 +/- 69.4 | 465.8 +/- 62.5 | 40.8 +/- 82.9 | 0.21 | 0.14, 0.29";
      "Weekdays | 481.4 +/- 73.4 | 453.9 +/- 71.6 | 27.5 +/- 92.7 | 0.18 | 0.11, 0.26";
      "Weekend | 569.7 +/- 115.6 | 495.4 +/- 102.8 | 74.3 +/- 144.7 | 0.13 | 0.05, 0.20"
  (3) Table 3 Adjusted Stratified Models: "Overall | -27.87 | -34.96, -20.78 | 0.19 | 0.13, 0.26";
      "Weekday (N=634) | -32.84 | -40.77, -24.91 | 0.19 | 0.11, 0.26"
  (4) "The estimate for calibration, the change in self-reported duration relative to the change in actigraphy-assessed
      duration, was beta = 0.19 (95% CI: 0.13, 0.26) after adjustment for sex, caregiver education, income, race and
      ethnicity (Table 3)."
  (5) IMPORTANT MEASUREMENT CAVEAT (verbatim): "Actigraphy-assessed sleep duration was defined as the period between the
      first and last scored sleep epochs, encompassing sleep onset latency (SOL) and wake after sleep onset (WASO)."
      That is a sleep-PERIOD measure, not total sleep time. Because SOL+WASO in adolescents is roughly 1.5 h by
      actigraphy (see short2012diary.yaml: WASO 74 min, and galland2018.yaml: SOL 19.4 min), the self-report minus true
      TST bias in this cohort is plausibly ~1.5 h larger than the 0.46 h weekday figure reported here. Do not treat
      0.46 h as the self-report-minus-TST bias.
  (6) "adolescents are generally less knowledgeable about the amount of sleep they need and are subsequently less likely
      to use clinical guidelines to anchor their responses when reporting their bed and wake times."
  DERIVED numbers, arithmetic shown in each conversion_formula field. Weekday LoA = -2.57 to +3.49 h.
shard: "s06_sleep_need_measurement"
