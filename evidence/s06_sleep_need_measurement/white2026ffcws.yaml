    se: 0.0332
    ci: [0.13, 0.26]
    conversion_formula: "Table 3 adjusted overall beta = 0.19 (0.13, 0.26); se = (0.26-0.13)/3.92 = 0.0332. This is the REVERSE regression (truth on report) the exposure model needs."
    from_figure: false
    inferred_from_ci: true
    direction_note: "slope of 0.19 (not 1.0) means an adolescent's self-report is only weakly informative about true sleep; E[true | report] shrinks hard toward the population mean"
