rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "good design (three concurrent instruments in the same 225 adolescents, which is what makes it useful) but the age band is 11-13, below our subject's 16-19 window; school-based sample; no SDs of the differences reported in Table 1, only CIs of the means, so between-person LoA are not derivable."
funding: "not stated in retrieved text"
notes: |
  Verbatim support, Table 1 ("Mean differences between the three sleep measures for average weekday, weekend and combined
  sleep duration in 225 adolescents"):
    Average weekday sleep duration (minutes): Self-report vs Sleep diary 13.6, p=0.017, 95% CI 1.8, 25.4
                                              Self-report vs Actigraphy  95.5, p<0.001, 95% CI 83.7, 107.3
                                              Actigraphy vs Sleep diary -81.9, p<0.001, 95% CI -93.7, -70.1
    Average weekend sleep duration (minutes): Self-report vs Actigraphy 156.7, p<0.001, 95% CI 140.2, 173.3
    Average combined sleep duration (minutes): Self-report vs Actigraphy 111.8, p<0.001, 95% CI 99.0, 124.6
  Verbatim: "Self-reported sleep duration was not significantly correlated with actigraphy sleep duration for weekday or
  combined sleep duration. Sleep diary estimated sleep duration was significantly correlated with actigraphy for weekday,
  weekend and combined sleep duration."
  Methods (verbatim): "Adolescents (n=225) aged 11-13 years provided estimates for weekday, weekend and combined sleep
  duration based on self-reported survey data, a 7-day sleep diary, and wrist-worn actigraphy."
  DECOMPOSITION THAT MATTERS: 95.5 min total weekday gap = 13.6 min (recall/retrospection) + 81.9 min (diary vs actigraphy).
  So in adolescents the dominant term is NOT faulty recall; it is the systematic offset between any subjective account of
  sleep and what actigraphy scores as sleep (largely SOL + WASO, see short2012diary). That decomposition is what justifies
  routing the exposure model through an explicit time-in-bed -> total-sleep-time step (sleep efficiency) rather than a
  single lumped 'bias' term.
