rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "well-conducted systematic review (5 databases, dual independent screening of 5,644 abstracts and 160 full texts, 19 independent samples, 45,328 twins). Main limitation for our purposes is the construct: it meta-analyses heritability of MEASURED/REPORTED duration, and the authors themselves note that 'Heritability estimates for actigraphic and Polysomnography (PSG)-estimated sleep were based on few small samples, warranting more research'. Abstract-only access."
funding: "not stated in retrieved abstract"
notes: |
  Verbatim (abstract, retrieved from PubMed): "We conducted a systematic literature search in five online databases on January
  24th 2020. Two authors independently screened 5644 abstracts, and 160 complete articles for the inclusion criteria of twin
  studies from the general population reporting heritability statistics on sleep duration and/or quality, and written in English.
  We ultimately included 23 papers (19 independent samples: 45,328 twins between 6 mo and 88 y) for sleep duration, and 13
  papers (10 independent samples: 39,020 twins between 16 and 95 y) for sleep quality. Collectively, we showed that 46% of the
  variability in sleep duration and 44% of the variability in sleep quality is genetically determined. The remaining variation
  in the sleep characteristics can mostly be attributed to the unique environment the twins experience, although the shared
  environment seemed to play a role for the variability of childhood sleep duration. Meta-analyzed heritability estimates for
  sleep duration, however, varied substantially with age (17% infancy, 20-52% childhood, 69% adolescence and 42-45% adulthood)
  and reporter (8% parent-report, 38-52% self-report). Heritability estimates for actigraphic and Polysomnography
  (PSG)-estimated sleep were based on few small samples, warranting more research."
  HOW TO USE THIS, AND HOW NOT TO. A tempting but WRONG inference is: "h2 = 46-69%, and the population SD of sleep duration is
  ~1.1 h, therefore the genetic (i.e. 'true need') SD is sqrt(0.46)*1.1 = 0.75 h." That arithmetic is superficially close to
  kitamura2016's directly measured 0.70 h, which makes it seductive, but it is not a valid derivation:
    - heritable variance in observed duration includes heritable variance in CHRONOTYPE, school/work schedule sorting, and
      reporting style, none of which is sleep need;
    - klerman2005 shows most of the observed duration spread is self-imposed restriction, and restriction is not need;
    - the 6-fold reporter effect (8% vs 38-52%) proves a large slice of the estimated h2 is measurement artefact.
  So I record the heritability numbers as CONTEXT that a genetic component of sleep need exists, and I do NOT use them to set the
  SD of need. The SD comes from kitamura2016 alone. This is deliberate and is flagged as the shard's central weakness in
  station_report.md.
shard: "s06_sleep_need_measurement"
