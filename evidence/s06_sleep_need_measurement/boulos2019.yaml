rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Large, PROSPERO-registered (CRD42017074319), restricted to level-1 in-laboratory PSG scored to AASM 2007/2012 criteria, random-effects pooling with multivariate mixed-effects meta-regression on age and sex. Weaknesses: 'healthy controls' recruited as comparison groups for other studies rather than as a population sample, so healthy-volunteer selection is likely; English-language only; single laboratory nights with first-night effects; adults only, so nothing below 18 y; I could only access the abstract, so I could not read the pooled INTERCEPT for sleep efficiency (see notes)."
funding: "None (stated in the abstract)"
notes: |
  ACCESS: abstract only. Unpaywall reports is_oa = false for 10.1016/S2213-2600(19)30057-8 and there is no PMC deposit
  (elink returns only pubmed_pmc_refs). Every number above is verbatim from the PubMed abstract.
  WHAT I WANTED AND COULD NOT GET: the abstract says "We report normative data stratified by age and sex" but the actual
  stratified table (which would give the pooled sleep-efficiency MEAN and SD for the youngest adult stratum, the single most
  useful number for shard task 8) is in the paywalled full text. I therefore use this paper only for the age SLOPES and take
  the sleep-efficiency LEVEL from mitterling2015 (0.870 at <= 30 y) and meredithjones2024 (0.891 at ages 8-16), both of which
  I did retrieve. This is the one place in the shard where a better-accessed source would materially tighten a prior.
  HOW THE SLOPE IS USED IN exposure_priors.md section (iii): sleep efficiency falls 2.1 points per decade in adults. Working
  from the Mitterling <= 30 y median of 87.0% (a stratum whose mean age is unknown but is bounded above by 30), an 18-19 year
  old should sit at or slightly ABOVE 87%. Working down from the Meredith-Jones 8-16 y mean of 89.1%, he should sit at or
  slightly BELOW 89.1%. The two bracket 0.87-0.89 and the slope is consistent with the direction of the bracket, so I take
  0.88 as the central value.
  CONSISTENCY CHECK against the older meta-analysis: Ohayon 2004 fitted an exponential age equation for sleep efficiency in
  in-laboratory recordings with b = -0.003 per year and 63% of variance explained (its Table 4), which over a decade implies a
  relative decline of about 1 - exp(-0.03) = 3.0%, i.e. roughly 2.6 percentage points from a base of 87%. That is closely
  consistent with the 2.1 points per decade found here from a completely different and much larger study set 15 years later.
  Two independent meta-analyses agreeing on the age slope is one of the better-supported quantities in this shard.
shard: "s06_sleep_need_measurement"
