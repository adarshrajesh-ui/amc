effects:
  - outcome_domain: exposure_measurement
    outcome_construct: psg_sleep_efficiency_change_per_decade_of_age
    exposure: {type: descriptive, dose_h: null, referent_h: null, duration_days: 1, contrast_label: "change in PSG sleep efficiency per additional decade of age, meta-regression"}
    scale: per_hour_beta
    unit: "percentage points of sleep efficiency per decade of age"
    value: -2.1
    se: 0.2806
    ci: [-2.6, -1.5]
    conversion_formula: "Abstract: 'sleep efficiency decreased by 2.1% (1.5 to 2.6)' per decade. Sign made explicit as negative (the abstract states 'decreased'). se = (2.6-1.5)/3.92 = 0.2806."
    from_figure: false
    inferred_from_ci: true
    direction_note: "negative = sleep efficiency falls with age. USE: this is the age-adjustment term for borrowing a sleep-efficiency norm measured in an older sample down to a 16-19 year old. It also means our subject sits at the TOP of the adult efficiency distribution, so an efficiency prior estimated in midlife adults would UNDERSTATE his efficiency and hence OVERSTATE his sleep debt in the TIB -> TST conversion."
    covariates: ["age", "sex"]
    followup_years: null
    cohort_family: null
    quote: "For each decade of age, total sleep time decreased by 10.1 min (95% CI 7.5 to 12.8), sleep efficiency decreased by 2.1% (1.5 to 2.6), wake after sleep onset increased by 9.7 min (6.9 to 12.4), sleep onset latency increased by 1.1 min (0.3 to 1.9)"
  - outcome_domain: sleep_need
    outcome_construct: psg_total_sleep_time_change_per_decade_of_age
    exposure: {type: descriptive, dose_h: null, referent_h: null, duration_days: 1, contrast_label: "change in PSG total sleep time per additional decade of age, meta-regression"}
    scale: per_hour_beta
    unit: "minutes of total sleep time per decade of age"
    value: -10.1
    se: 1.3520
    ci: [-12.8, -7.5]
    conversion_formula: "Abstract: 'total sleep time decreased by 10.1 min (95% CI 7.5 to 12.8)' per decade. se = (12.8-7.5)/3.92 = 1.3520."
    from_figure: false
    inferred_from_ci: true
    direction_note: "negative = less sleep at older ages. Magnitude is SMALL: 10 min per decade means only ~0.17 h between an 18-year-old and a 28-year-old, i.e. the age gradient in laboratory sleep across young adulthood is negligible compared with the 1.5 h measurement-error SD. This licenses pooling the 18-25 and 25-30 bands."
    covariates: ["age", "sex"]
    followup_years: null
    cohort_family: null
    quote: "For each decade of age, total sleep time decreased by 10.1 min (95% CI 7.5 to 12.8), sleep efficiency decreased by 2.1% (1.5 to 2.6)"
  - outcome_domain: exposure_measurement
    outcome_construct: psg_wake_after_sleep_onset_change_per_decade
    exposure: {type: descriptive, dose_h: null, referent_h: null, duration_days: 1, contrast_label: "change in PSG wake after sleep onset per decade of age"}
    scale: per_hour_beta
    unit: "minutes of WASO per decade of age"
    value: 9.7
    se: 1.4031
    ci: [6.9, 12.4]
    conversion_formula: "Abstract: 'wake after sleep onset increased by 9.7 min (6.9 to 12.4)' per decade. se = (12.4-6.9)/3.92 = 1.4031."
    from_figure: false
    inferred_from_ci: true
    direction_note: "positive = more fragmented sleep at older ages. Note this nearly accounts for the whole TST decline (9.7 min more WASO vs 10.1 min less TST), i.e. across adulthood the TIB stays similar and the sleep is progressively eaten by wake. Our 16-19 year old is at the low-WASO end."
    covariates: ["age", "sex"]
