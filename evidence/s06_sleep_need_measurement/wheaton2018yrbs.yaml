    scale: probability
    unit: "proportion sleeping under 7 h on an average school night"
    value: 0.430
    se: null
    ci: null
    conversion_formula: "DERIVED by summing the reported whole-hour distribution for high school students: 7.5% (<=4 h) + 12.6% (5 h) + 22.9% (6 h) = 43.0%. The paper does not publish a <7 h category or its CI (its own cutoff is <8 h), so se: null. Because responses are whole hours, '6 hours' means the 6-hour option was selected, so this sum is exactly the proportion choosing 6 h or less."
    from_figure: false
    inferred_from_ci: false
    direction_note: "THE ANSWER TO 'where does our subject sit in the distribution'. 43% of US high schoolers report <7 h on school nights, so his reported 5-6 h weekday sleep is common rather than exceptional: roughly the 20th-43rd percentile of the reported distribution."
