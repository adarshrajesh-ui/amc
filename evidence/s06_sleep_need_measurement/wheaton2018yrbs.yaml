rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "nationally representative probability sample with weighting for complex design (a strength for prevalence). Fatal weakness for our purposes: the exposure is a SINGLE self-reported whole-hour item, i.e. exactly the instrument this shard's Part B shows to be biased by ~0.5-1.6 h in adolescents and correlated with actigraphy at only rho ~0.18. These are prevalences of REPORTED sleep, not of true sleep."
funding: "CDC"
notes: |
  VERBATIM instrument wording (this is the rounding evidence): "All students in the national, state, and large urban school
  district surveys were asked to respond to this question about sleep duration: 'On an average school night, how many hours of
  sleep do you get?' Possible responses were 4 or less hours, 5 hours, 6 hours, 7 hours, 8 hours, 9 hours, and 10 or more hours.
  Short sleep duration was defined as <9 hours for students aged 6-12 years and <8 hours for those aged 13-18 years."
  VERBATIM high school distribution: "At the high school level, nationwide, the prevalence of short sleep duration was 72.7%
  (Table 2). The distribution of sleep duration was 7.5% for <=4 hours, 12.6% for 5 hours, 22.9% for 6 hours, 29.7% for 7 hours,
  20.6% for 8 hours, 5.0% for 9 hours, and 1.7% for >=10 hours. The prevalence of short sleep duration was higher among female
  students (75.6%) than among male students (69.9%), lower among students in grade 9 (65.6%) than in other grades (71.7%-77.6%),
  and higher among black (76.5%) and Asian (79.3%) students than white (72.0%) and Hispanic (70.2%) students. State-level
  estimates of short sleep duration for the 30 states ranged from 61.8% (South Dakota) to 82.5% (West Virginia)."
  VERBATIM Table 2 rows used above: "National survey | 14,471 | 72.7 (70.4-74.9)"; "Female | 7,250 | 75.6 (73.3-77.7)";
  "Male | 7,165 | 69.9 (66.9-72.7)"; "9 | 3,673 | 65.6 (62.6-68.5)"; "10 | 3,593 | 71.7 (69.2-74.0)";
  "11 | 3,695 | 77.1 (73.5-80.3)"; "12 | 3,426 | 77.6 (74.7-80.2)".
  VERBATIM guideline framing: "children aged 6-12 years should regularly sleep 9-12 hours per 24 hours and teens aged 13-18 years
  should sleep 8-10 hours per 24 hours".
  DERIVED CUMULATIVE DISTRIBUTION OF REPORTED SCHOOL-NIGHT SLEEP (my arithmetic from the quoted percentages; US high school, 2015):
    <=4 h  7.5%    cumulative  7.5%
     5 h  12.6%    cumulative 20.1%
     6 h  22.9%    cumulative 43.0%
     7 h  29.7%    cumulative 72.7%   <- matches the published 72.7% <8 h, an internal consistency check that my sum is right
     8 h  20.6%    cumulative 93.3%
     9 h   5.0%    cumulative 98.3%
    >=10 h 1.7%    cumulative 100.0%
  The fact that my cumulative sum through 7 h reproduces the independently published 72.7% confirms the derived <7 h figure of
  43.0% is arithmetically sound.
  CAUTION ON DOUBLE-COUNTING: cohort_family is YRBS. Any other shard using CDC YRBS or MMWR adolescent sleep prevalence is using
  the same underlying survey; do not pool.
shard: "s06_sleep_need_measurement"
