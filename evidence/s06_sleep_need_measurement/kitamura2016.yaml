rob:
  tool: RoB2
  judgement: some_concerns
  notes: "T1 design (9 consecutive nights of 12-h PSG-monitored sleep opportunity with exponential-decay curve fitting to an individual asymptote) and the best available construct for 'sleep need'; but n=15, men only, Japanese, and curve fitting failed to converge for 2 of the 15 (handled by substituting their mean extended-session TST). All dispersion reported as SEM, so the SDs used downstream are my arithmetic, not the authors'."
funding: "not stated in retrieved text"
notes: |
  THE PIVOTAL STUDY FOR THE SD OF INDIVIDUAL SLEEP NEED. All quotations verbatim from the PMC full text.
  SAMPLE: "To estimate OSD and PSD, we recruited 15 healthy young men (mean age, 23.1 +/- 2.1 years; range, 20-26 years). They
  recorded their daily HSD at home using an actigraph and sleep diary for approximately 2 weeks."
  DISPERSION CONVENTION: "All results are expressed as means +/- SEM." (This is why the +/- 0.18 is converted to an SD below.)
  MAIN RESULT: "From the exponential decay curve fitting for the decrease in TST over the 9 days of extended sleep sessions, we
  were able to obtain an asymptote (the estimation of OSD) from individual TSTs (R2 = 0.244-0.946) for 13 participants. TSTs for
  2 of the participants (S05 and S11) did not converge for curve fitting. These results indicate that sleep debt did not exist
  for these 2 participants, and therefore instead of an asymptote, we treated the mean TST value over the extended sleep
  sessions as the estimate of OSD. The mean estimated OSD was 8.41 +/- 0.18 h (range, 7.29-9.26 h). The range of OSD was smaller
  than the range of HSD (Fig. 2a). There was a significant correlation between estimated OSD and HSD (r = 0.514, p = 0.050),
  suggesting that OSD is a determinant of sleep habits, even in actual daily life where society's schedule plays a role.
  However, HSD was significantly shorter than OSD (t(14) = 4.547, p < 0.001; Fig. 2a), and the result of the trial calculation
  of mean PSD (i.e., the difference between OSD and HSD) for the 15 participants was 1.04 +/- 0.24 h (range, -0.58 to 2.73 h;
  95% confidence interval: 0.57-1.58 h; Fig. 2b)."
  THE SENTENCE THAT SETTLES THE 'IS VARIATION IN DURATION VARIATION IN NEED?' QUESTION (verbatim):
  "In this study, OSD and HSD exhibit a trend where sleep habits followed the sleep need of each individual, but most
  participants (13/15) had HSD lower than OSD. The mean PSD was approximately 1 h but with a range of 3 h among the 15
  participants. PSD did not correlate with OSD but showed a high correlation with HSD (r = 0.76). This suggests that short sleep
  times in daily life, more than individual differences in sleep need, contribute to the [sleep debt]."
  => "The range of OSD was smaller than the range of HSD" is the key structural finding: the requirement varies LESS between
  people than observed sleep does. Concretely, OSD ranged 7.29-9.26 h (1.97 h) whereas the HSD distribution is wider. So the
  modeller must NOT use the population SD of habitual sleep duration (~1.0-1.2 h) as a proxy for the SD of sleep need
  (~0.6-0.7 h); doing so roughly doubles the variance of the requirement and washes out the debt signal.
  ALSO CITED IN THIS PAPER (secondhand, useful for triangulation): "a sleep need of 8.16 h for preventing cumulative
  neurobehavioral deficits" (their citation 18, i.e. Van Dongen 2003), and "When Klerman and Dijk gave young and elderly
  subjects the opportunity to sleep 16 h/day, sleep time showed exponential decay in both groups and asymptotic values were
  obtained at 8.9 h and 7.4 h, respectively" (their citation 19; I retrieved that paper independently, see klerman2008.yaml).
  Three independent laboratory estimates of young-adult sleep need therefore cluster at 8.16 / 8.41 / 8.9 h.
  DERIVED SDs (arithmetic in the conversion_formula fields): SD of OSD = 0.697 h; SD of PSD = 0.930 h.
