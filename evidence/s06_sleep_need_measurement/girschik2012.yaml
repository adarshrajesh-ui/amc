rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "n=56, women only, age 18-80, and the key duration-dependence finding is explicitly caveated by the authors as based on small subgroups with no numbers given. Include for DIRECTION of the differential error and for the modal-vs-mean insight, NOT for magnitude."
funding: "not stated in retrieved text"
notes: |
  Two findings, both about the SHAPE rather than the size of the measurement error.
  (1) DUPLICATE-DIRECTION EVIDENCE ON DIFFERENTIAL ERROR (verbatim): "In particular, all participants who self-reported a
      usual sleep duration of 6 hours or less recorded an objective mean sleep duration of greater than 6 hours. In
      contrast, participants who self-reported sleeping 8 hours or more tended to overestimate their sleep as compared with
      objective measures, although group numbers were small."
      This is the empirical face of the same phenomenon that lauderdale2008 captures parametrically with a calibration
      slope of 0.51: reported and true sleep regress toward each other. Lauderdale's slope says short sleepers over-report
      MORE when you condition on TRUE sleep; Girschik's observation says short REPORTERS under-report when you condition on
      the REPORT. Both are true simultaneously and they are not contradictory - they are the forward and reverse regression
      of the same joint distribution. The exposure model must condition on the REPORT (that is all we observe for our
      subject), which means Girschik's direction is the operative one.
  (2) RECALL BEHAVIOUR (verbatim): "We also examined modal sleep duration in addition to mean duration, because
      participants may estimate their usual sleep by using a typical night rather than by averaging sleep across nights.
      Unlike Mullington et al, we found that the use of modal data improved correlations with estimates of sleep duration,
      when compared with mean sleep. However, the overall results still failed to show strong agreement with actigraphy data."
  (3) Overall conclusion (verbatim): "This study found that self-reported usual sleep duration on workdays and non-workdays
      did not agree with actigraphically recorded actual sleep."
  Population is a poor match (adult women, wide age range). Downweight the magnitude entirely; keep the two structural
  findings, which are the reason exposure_priors.md section (ii) recommends a reverse-regression calibration rather than a
  fixed additive bias correction.
