rob:
  tool: RoB2
  judgement: some_concerns
  notes: "T1 design with 2-week outpatient habitual assessment followed by inpatient MSLT and a 3-day 16-h bedrest-extension protocol; but n=17, healthy volunteers, and abstract-only access means no effect sizes, no SDs, and no coefficient for the key negative association are available to me. The construct is 'bedrest duration' (time in bed), not total sleep time, for the habitual measure."
funding: "NIH (paper is in PMC via NIH public access)"
notes: |
  This is the paper that most directly answers the question "is the between-person spread in sleep duration a spread in sleep
  NEED?" and its answer is essentially NO. Verbatim (abstract, retrieved from PubMed):
  "STUDY OBJECTIVE: To determine whether variation in sleep duration reflects variation in sleep need or self-imposed sleep
  restriction.
  DESIGN: After habitual bedrest duration of participants was assessed during a 2-week outpatient protocol, volunteers were
  scheduled to sleep according to this schedule for 1 week prior to and the first night after admission to a general clinical
  research center. The inpatient protocol included multiple sleep latency testing on the second day and sleep recordings during
  a bedrest extension protocol that included 16 hours of sleep opportunity (12 hours at night and 4 hours at midday) for 3
  consecutive days.
  PARTICIPANTS: Seventeen healthy volunteers (10 women) aged 18-32 years without clinical sleep disorders.
  MEASUREMENTS AND RESULTS: The habitual bedrest duration varied from 6.1 to 10.3 hours. Individuals with shorter habitual
  bedrest duration fell asleep more quickly and frequently during the multiple sleep latency test than did those with longer
  habitual bedrest duration. On the first day of extended sleep opportunity, the total sleep time of all individuals was greater
  than their habitual bedrest duration; the average increase in total sleep time was 4.9 hours (P = 0.001). The increase in
  total sleep time declined across the 3 day bedrest-extension protocol (P = 0.003 for trend). During the third day of
  increased sleep opportunity, the total sleep time was negatively associated with habitual bedrest duration (P = 0.005);
  individuals with shorter habitual bedrest duration continued to sleep more than those with longer habitual bedrest duration.
  CONCLUSION: Those individuals with shorter habitual sleep durations carry a higher sleep debt than do those with longer
  habitual sleep duration. Interindividual variation in sleep duration may primarily reflect variation in self-selected sleep
  restriction or wake extension."
  WHY THIS IS DECISION-RELEVANT: it licenses the model to treat our subject's short habitual sleep as DEBT rather than as
  evidence of a low personal requirement. Two independent signals in this study point that way: short habitual sleepers had
  SHORTER MSLT latencies (objectively sleepier at baseline) and they were still sleeping MORE than long habitual sleepers on
  day 3 of extended opportunity. Both are the opposite of what a low-requirement phenotype would produce.
  IMPLICATION FOR THE SD OF NEED: because the observed spread in duration (6.1-10.3 h) is mostly restriction, the SD of NEED
  must be substantially SMALLER than the SD of observed duration. Combined with kitamura2016's direct estimate (SD ~0.70 h vs an
  HSD SD of ~1.0 h in klerman2008), this is the basis for recommending a sleep-need SD near 0.7 h rather than 1.0-1.2 h. See
  exposure_priors.md section (iv).
