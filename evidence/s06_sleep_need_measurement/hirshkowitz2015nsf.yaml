rob:
  tool: AMSTAR-2
  judgement: high
  notes: "Expert-opinion appropriateness ratings, not a pooled evidence synthesis. The panel explicitly used RAM because evidence-based methods 'fall short'. Voting-based, 2 rounds, 18 panellists, and panellists self-rated whether their scores rested on convincing evidence, weaker evidence, expert opinion, or personal experience - the paper does not report the distribution of those self-ratings. Treat as TX context, never as a primary effect estimate."
funding: "National Sleep Foundation"
notes: |
  VERBATIM Table 2 ("Expert panel recommended sleep durations"), the two bands that matter for our subject:
    Age                     | Recommended, h | May be appropriate, h | Not recommended, h
    Teenagers 14-17y        | 8 to 10        | 7 ... 11              | Less than 7 ... More than 11
    Young adults 18-25y     | 7 to 9         | 6 ... 10 to 11        | Less than 6 ... More than 11
  (In the source the "may be appropriate" and "not recommended" cells are split over two printed lines per age band; the
  lower-side value appears on the first line and the upper-side value on the second.)
  VERBATIM abstract: "The panel agreed that, for healthy individuals with normal sleep, the appropriate sleep duration for
  newborns is between 14 and 17 hours, infants between 12 and 15 hours, toddlers between 11 and 14 hours, preschoolers
  between 10 and 13 hours, and school-aged children between 9 and 11 hours. For teenagers, 8 to 10 hours was considered
  appropriate, 7 to 9 hours for young adults and adults, and 7 to 8 hours of sleep for older adults."
  VERBATIM methodology: "The NSF convened an 18-member multidisciplinary expert panel, representing 12 stakeholder
  organizations, to evaluate scientific literature concerning sleep duration recommendations. We determined expert
  recommendations for sufficient sleep durations across the lifespan using the RAND/UCLA Appropriateness Method."
  "Fifty-eight searches using combinations of search terms related to sleep... yielded 2412 articles. The review team
  identified 575 articles for full-text review. Of the 575 articles, 312 met our inclusion criteria."
  "In total, the expert panel met 4 times over the course of 9 months and participated in 2 rounds of voting."
  EVIDENCE-STRENGTH ADMISSION (verbatim): "It provides a process by which conclusions can be reached using the
  best-available information when evidence-based medicine methods fall short. To fill the gaps in our understanding, expert
  panelists reviewed the literature, deliberated, and voted on the appropriateness..."  and "Panelists also noted whether
  scores were based on convincing scientific evidence, weaker scientific evidence, expert opinion, or their own experience."
  INDIVIDUAL VARIATION (verbatim): "Importantly, the panel emphasized that some individuals might sleep longer or shorter
  than the recommended times with no adverse effects."
  *** THE MOST IMPORTANT SENTENCE IN THIS PAPER FOR OUR PIPELINE (verbatim) ***
  "It is important to remember that this project focused on sleep duration. The literature, especially cohort and population
  studies, often do not distinguish between time in bed and actual sleep time. However, actual sleep time is typically less
  than time in bed, which biases data toward higher sleep duration estimates. By contrast, intervention studies using
  laboratory measured sleep time will typically produce shorter sleep durations. This data disparity is particularly
  important when interpreting laboratory-based findings."
  => The NSF bands are partly anchored on TIME-IN-BED-contaminated self-report. If the exposure engine expresses our
  subject's sleep as actigraphic/PSG TOTAL SLEEP TIME and compares it to these bands, it will OVERSTATE the sleep debt by
  roughly the TIB-TST gap (~0.8-1.5 h; see exposure_priors.md section iii). Units must be matched on both sides of the
  subtraction. This is the single largest systematic error available to the downstream model.
