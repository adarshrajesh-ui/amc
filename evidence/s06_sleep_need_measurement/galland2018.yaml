rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Systematic search of eight databases, 79 studies meta-analysed with random-effects models and age as a meta-regression covariate. Weaknesses: pooled across heterogeneous actigraphs, wear sites and scoring algorithms, which meredithjones2024 shows can move sleep-duration estimates by tens of minutes and sleep efficiency by up to 18 points; no SDs in the abstract; actigraphy over-counts sleep relative to PSG (specificity 63.8% in meredithjones2024), so the 7.4 h figure for 15-18 year olds is if anything an OVERESTIMATE of true total sleep time; I had abstract-only access."
funding: "Not stated in the abstract"
notes: |
  ACCESS: abstract only, despite the article being open access. Unpaywall reports is_oa = true with an OUP PDF location, but
  academic.oup.com returns a Cloudflare interstitial to a scripted download and the figshare mirror record
  (13450679) exposes no downloadable files through the figshare API. There is no PMC deposit. All numbers above are verbatim
  from the PubMed abstract.
  WHY THIS RECORD MATTERS: it is the age-matched POPULATION NORM for shard task 3. Placing the three quantities side by side
  for our subject's age band is the whole point:
    what 15-18 year olds need (laboratory, short2018sleepneed) : 9.0 h satiated, 9.35 h for optimal sustained attention
    what 15-18 year olds get  (actigraphy, this paper)         : 7.4 h
    what our subject reports getting on weekdays               : 5-6 h
  So the average adolescent already runs a deficit of roughly 1.6 h, and our subject reports being a further 1.4-2.4 h below
  the average. The modeller must not benchmark him against the population norm, or the deficit will be understated by ~1.6 h.
  SECOND USE: the 19.4 min sleep-onset latency is one of only two age-appropriate SOL estimates I retrieved (the other is the
  36 min TIB-minus-sleep-period gap derivable from meredithjones2024, which also contains time awake in bed before rising and
  so should be larger). Both feed exposure_priors.md section (iii).
  NOTE ON THE AUTHOR OVERLAP: the first author here (Galland) is also an author on meredithjones2024, and the second author
  (Short MA) is the first author of short2012diary and short2018sleepneed. These are separate studies with separate data, so
  they are not double-counting, but the pooler should be aware that the adolescent actigraphy literature is written by a small
  number of overlapping groups and the effective number of independent research teams is smaller than the study count.
shard: "s06_sleep_need_measurement"
