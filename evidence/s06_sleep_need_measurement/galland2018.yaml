    from_figure: false
    inferred_from_ci: false
    direction_note: "descriptive. FLAGGED DISAGREEMENT WITH THE BAND ESTIMATE ABOVE: the continuous equation predicts 6.5-7.2 h at ages 16-18 whereas the pooled 15-18 y band estimate is 7.4 h. The quadratic is fitted over the whole 0-18 range and steepens at the top, so it extrapolates low at the boundary. PREFER THE BAND ESTIMATE (7.4 h) for a 16-18 year old and treat 6.5-7.4 h as the plausible range of the population norm."
    covariates: []
