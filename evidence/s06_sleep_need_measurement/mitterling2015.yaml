    scale: hours
    unit: "hours"
    value: 6.892
    se: null
    ci: [5.760, 7.532]
    conversion_formula: "Abstract: 'total sleep time [<= 30 y: 413.5 (345.6-451.9) min ...]'. value = 413.5/60 = 6.892 h (median); ci = 345.6/60 and 451.9/60."
    from_figure: false
    inferred_from_ci: true
    direction_note: "descriptive only. THIS IS NOT A SLEEP-NEED ESTIMATE: it is one lab night under a laboratory schedule, and it is CENSORED by the time in bed the protocol allowed. Contrast with the sleep-satiation designs (klerman2008 8.9 h, kitamura2016 8.41 h, short2018sleepneed 9.0 h) which deliberately removed that ceiling."
    covariates: []
    followup_years: null
