    quote: "a decrease was found for sleep efficiency [<= 30 y: 87.0 (71.9-94.1)% versus > 60 y: 79.7 (44.5-90.9)%], total sleep time [<= 30 y: 413.5 (345.6-451.9) min versus > 60 y: 378.3 (216.0-440.0) min]"
rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Strengths: healthy sleepers drawn from a representative population sample via two-step screening, current AASM scoring criteria, single site. Weaknesses for our purpose: only ONE laboratory night per subject with no habituation night reported in the abstract, so the values carry a first-night effect that biases sleep efficiency DOWNWARD; the <= 30 y stratum is not broken out further, so the n for ages 19-25 is unknown and the stratum may be dominated by people in their late twenties; medians with unlabelled percentile ranges rather than means with SDs; single-country (Austria), all Caucasian; 8% of this 'healthy' sample had an apnea-hypopnea index > 15/h."
funding: "Not stated in the abstract"
notes: |
  PRIMARY SOURCE for shard task 8 (sleep-efficiency norms in a young-adult band) because it is the only retrieved study
  reporting PSG sleep efficiency for a stratum (<= 30 y) that actually contains 18-25 year olds. Access is abstract-only:
  the PMC deposit (PMC4434553) contains the abstract but not the tables or the percentile curves, and the OUP PDF is
  behind Cloudflare. Everything above is quoted from the abstract verbatim.
  ARITHMETIC CHECK on internal consistency of the <= 30 y stratum: TST 413.5 min at 87.0% efficiency implies time in bed
  of 413.5/0.870 = 475.3 min = 7.92 h, and hence a TIB-minus-TST gap of 61.8 min. WASO accounts for 6.0% of TIB
  = 28.5 min of that, leaving ~33 min for sleep-onset latency plus time awake before rising. That is consistent with the
  independent pediatric sleep-onset-latency estimate of 19.4 min in galland2018.
  WHY THE MEDIAN, NOT THE MEAN, IS WHAT IS REPORTED: the paper's design goal was percentile CURVES for clinical reference,
  so it reports medians. For a Bayesian prior on a bounded, left-skewed quantity the median is arguably the better central
  anchor anyway, but the modeller should not treat 0.870 as a mean of a symmetric distribution.
  TRIANGULATION for sleep efficiency (TST/TIB), all from PSG:
    Mitterling 2015, <= 30 y, Austria, lab       : 0.870 (median; percentile range 0.719-0.941)
    Meredith-Jones 2024, ages 8-16, NZ, at home  : 0.891 (mean; SD 0.125)  <- see meredithjones2024.yaml
    Boulos 2019, adult PSG meta-analysis         : declines 2.1 percentage points per decade of age <- see boulos2019.yaml
  Ohayon 2004 independently establishes that sleep efficiency does NOT change across adolescence (effect size 0.01, 95% CI
  -0.13 to 0.15; see ohayon2004.yaml), which is what licenses borrowing the 8-16 y and <= 30 y values for a 16-19 year old.
  The two point estimates bracket 0.87-0.89 and that is the basis for exposure_priors.md section (iii).
shard: "s06_sleep_need_measurement"
