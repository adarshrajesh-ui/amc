effects:
  - outcome_domain: exposure_measurement
    outcome_construct: psg_sleep_efficiency_tst_over_tib_under_30y
    exposure: {type: descriptive, dose_h: null, referent_h: null, duration_days: 1, contrast_label: "PSG sleep efficiency (TST/time in bed), youngest age stratum (<= 30 y), single in-laboratory night"}
    scale: probability
    unit: "proportion of time in bed spent asleep"
    value: 0.870
    se: null
    ci: [0.719, 0.941]
    conversion_formula: "Abstract reports 'sleep efficiency [<= 30 y: 87.0 (71.9-94.1)%]'. value = 87.0/100 = 0.870 (this is a MEDIAN, not a mean). ci field holds the bracketed percentile range as printed, /100. DERIVED SD: the paper states it produced 'percentile curves' but the abstract does not label which percentiles the bracketed values are. If 5th-95th, SD ~ (94.1-71.9)/3.29 = 6.75 percentage points (0.0675). If 10th-90th, SD ~ (94.1-71.9)/2.56 = 8.67 points (0.0867). I did not get the full text, so the SD is NOT recorded as a point estimate here; se is left null."
    from_figure: false
    inferred_from_ci: true
    direction_note: "higher = more of time in bed is actually asleep. This is the multiplier the model needs to convert a reported TIME IN BED into TOTAL SLEEP TIME. Note the distribution is left-skewed (median 87.0 sits 15.1 points above the lower bound but only 7.1 points below the upper), because efficiency is bounded at 100%."
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "Percentile curves showed age-related differences in sleep architecture: a decrease was found for sleep efficiency [<= 30 y: 87.0 (71.9-94.1)% versus > 60 y: 79.7 (44.5-90.9)%]"
  - outcome_domain: exposure_measurement
    outcome_construct: psg_waso_percent_under_30y
    exposure: {type: descriptive, dose_h: null, referent_h: null, duration_days: 1, contrast_label: "PSG wake after sleep onset as % of time in bed, <= 30 y"}
    scale: probability
    unit: "proportion of time in bed awake after sleep onset"
    value: 0.060
    se: null
    ci: [0.019, 0.228]
    conversion_formula: "Abstract: 'the percentage of wake time after sleep onset increased with age [<= 30 y 6.0 (1.9-22.8)% versus > 60 y: 15.2 (6.3-48.7)%]'. value = 6.0/100 (median); ci = printed percentile range /100."
    from_figure: false
    inferred_from_ci: true
    direction_note: "higher = more fragmented sleep. Together with sleep-onset latency this is the arithmetic complement of sleep efficiency; it decomposes WHERE the TIB-TST gap comes from in young adults (median only 6% WASO, so most of the 13% inefficiency at <= 30 y is sleep-onset latency plus time awake before rising)."
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "whereas the percentage of wake time after sleep onset increased with age [<= 30 y 6.0 (1.9-22.8)% versus > 60 y: 15.2 (6.3-48.7)%]"
