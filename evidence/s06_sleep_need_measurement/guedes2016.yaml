rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "n=37 total, so the sex-stratified estimates rest on roughly 15-22 people per stratum and the SDs (1.4-2.8 h) are very imprecisely estimated; convenience sample; abstract-only access. Include for DIRECTION and for the sex contrast, not as a precise magnitude."
funding: null
notes: |
  Verbatim (abstract): "Thirty-seven subjects, aged 12 to 17 years, answered questions about nocturnal sleep duration and
  used actigraphy for seven days... A mean difference of about one hour (SD = 2.1; median = 0.5; p < 0.01) was found
  between both strategies, which was higher among boys, 1.9 hours (SD = 2.8; median = 1.6; p < 0.05), than among girls,
  0.5 hours (SD = 1.4; median = 0.3; p = 0.11). The graphical evaluation showed similar results, as well as the intraclass
  correlation coefficient: 0.06 (95%CI = -0.33 - 0.46; p = 0.489) for boys and 0.43 (95%CI = 0.12 - 0.83; p < 0.001) for
  girls." Conclusion: "they reinforce the need of a careful use of nocturnal sleep measures among adolescents, mainly
  among boys."
  WHY THIS MATTERS DESPITE n=37: it is the only retrieved study that stratifies the adolescent self-report bias by sex, and
  it points the same way as cespedes2016hchs (agreement worse in males). Two independent studies agreeing that the male
  adolescent self-report is the least reliable case is the justification for putting our subject at the wide end of the
  measurement-error prior. The SD of 2.8 h for boys should be treated as an upper bound rather than a point estimate given
  the sample size.
