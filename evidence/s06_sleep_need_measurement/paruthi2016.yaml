rob:
  tool: AMSTAR-2
  judgement: high
  notes: "modified RAND Appropriateness Method with 13 panellists, guided by the Oxford grading system, but the statement itself publishes NO evidence grades, NO voting distributions, and NO effect sizes. The supporting methodology manuscript is a separate publication. Consensus statement: context only."
funding: "American Academy of Sleep Medicine"
notes: |
  VERBATIM recommendation for our subject's age band, retrieved from the PMC full text:
  "Teenagers 13 to 18 years of age should sleep 8 to 10 hours per 24 hours on a regular basis to promote optimal health."
  Adjacent bands for context (verbatim): "Children 6 to 12 years of age should sleep 9 to 12 hours per 24 hours on a
  regular basis to promote optimal health."
  VERBATIM consequence statements:
  "Sleeping the number of recommended hours on a regular basis is associated with better health outcomes including:
  improved attention, behavior, learning, memory, emotional regulation, quality of life, and mental and physical health."
  "Regularly sleeping fewer than the number of recommended hours is associated with attention, behavior, and learning
  problems. Insufficient sleep also increases the risk of accidents, injuries, hypertension, obesity, diabetes, and
  depression. Insufficient sleep in teenagers is associated with increased risk of self-harm, suicidal thoughts, and
  suicide attempts."
  VERBATIM methodology / EVIDENCE STRENGTH: "A panel of 13 experts in sleep medicine and research used a modified RAND
  Appropriateness Method to develop recommendations regarding the sleep duration range that promotes optimal health in
  children aged 0-18 years. The expert panel reviewed published scientific evidence addressing the relationship between
  sleep duration and health using a broad set of National Library of Medicine Medical Subject Headings (MeSH) terms and no
  date restrictions, which resulted in a total of 864 scientific articles. The process was further guided by the Oxford
  grading system. The panel focused on seven health categories with the best available evidence in relation to sleep
  duration: general health, cardiovascular health, metabolic health, mental health, immunologic function, developmental
  health, and human performance."
  VERBATIM on individual variation: "Current evidence supports the general recommendations for obtaining an adequate number
  of hours of sleep per 24 hours on a regular basis to promote optimal health among children aged 4 months to 18 years.
  Individual variability in sleep need is influenced by genetic, behavioral, medical, and environmental factors. A clearer
  understanding of the precise biological mechanisms underlying sleep need requires further scientific investigation."
  => The panel asserts individual variability in sleep need exists but publishes NO quantification of it. Neither AASM
  consensus statement (pediatric or adult) provides a between-person SD. That gap is why exposure_priors.md has to fall back
  on a single n=15 laboratory study (kitamura2016) for the SD of individual need.
  IMPORTANT AGE-BAND NOTE: AASM's teenage band is 13-18 y, NSF's is 14-17 y. The two guidelines therefore give a DIFFERENT
  answer for an exactly-18-year-old: AASM still says 8-10 h (18 is inside 13-18), while NSF has already moved him to the
  18-25 y band at 7-9 h. Our subject turns 18 during the exposure window, so this is a live disagreement, not a technicality.
