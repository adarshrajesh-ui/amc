rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "large school-based adolescent sample with concurrent diary + actigraphy, excellent age match; but the comparator is a prospective diary, not the retrospective single-item 'usual sleep' question that epidemiology (and our subject) actually uses; abstract-only access so no SDs or limits of agreement; authors themselves flag possible actigraphic mis-scoring in pubertally mature boys, which is exactly our subject's demographic."
funding: null
notes: |
  Verbatim (abstract): "Participants were 385 adolescents aged 13-18years (X=15.6, standard deviation [SD]=0.95; 60% male)
  from eight high schools in South Australia... Actigraphic estimates of wake after sleep onset (WASO) were substantially
  greater than sleep diary estimates (74min actigraphy vs. 7min sleep diary) and actigraphic estimates of total sleep time
  were substantially less than sleep diary and parent report (6h 51min actigraphy vs. 8h 16min sleep diary vs. 8h 51
  parent report). Actigraphy displayed no significant relationship with daytime functioning and weak relationships with
  concomitantly recorded sleep diary variables. Sex and puberty-related differences in actigraphic scoring were found, with
  more WASO and less sleep scored in boys compared to girls and more WASO scored amongst pubertally-mature boys than boys
  of less advanced pubertal development."
  Conclusion (verbatim): "There may be differences in the sleep of adolescents that result in less actigraphic total sleep
  scored than perceived, particularly in boys, possibly because of increased sleep motor activity in adolescents that
  actigraphic algorithms score as wake. This is a significant concern that requires further examination with polysomnography."
  DIRECTION-OF-BIAS WARNING for the modeller: this paper argues the adolescent self-report-vs-actigraphy gap is inflated by
  actigraphy UNDER-counting sleep in adolescent boys, not solely by over-reporting. If true, the correct calibration
  target (PSG) sits between the self-report and the actigraphy value, so the modeller should not apply the full
  self-report-minus-actigraphy bias as if actigraphy were the gold standard. This is the main reason my recommended bias
  prior (exposure_priors.md) is centred BELOW the raw adolescent actigraphy discrepancies.
  cohort_family recorded as MASSES_no to make explicit that this is NOT the Arora/MASSES sample - it is an independent
  South Australian school cohort. Do not de-duplicate against arora2013.
shard: "s06_sleep_need_measurement"
