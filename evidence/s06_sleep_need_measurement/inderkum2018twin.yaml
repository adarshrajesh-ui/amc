rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "VERY SMALL for a twin design: 16 monozygotic pairs (n=32) and 10 dizygotic pairs (n=20), 26 pairs total. Structural equation model heritability estimates from 26 pairs are extremely imprecise and the abstract reports no confidence intervals, so the point estimates (15% vs 68%) should be read as a DIRECTION and a rough magnitude, not as precise variance components. Strengths: unusually long actigraphy window (6 months) which substantially reduces night-to-night noise and is exactly what a trait estimate needs, and prespecified school/free-day contrast. Mean age 12.8 y, younger than our subject. Single site, Switzerland. Abstract-only access."
funding: "Not stated in the abstract"
notes: |
  ACCESS: abstract only. No PMC deposit (elink with linkname=pubmed_pmc returns nothing) and Sleep 2018 content is behind
  the OUP paywall for scripted access. Every number above is verbatim from the PubMed abstract.
  WHY I ADDED THIS RECORD LATE. My original sleep-need-variance evidence rested on a single n=15 laboratory study
  (kitamura2016) plus a heritability meta-analysis (kocevska2021herit) that I had explicitly declined to convert into an SD.
  This study is a genuinely independent line of evidence on the same question and it points the same way, so it materially
  strengthens the section (iv) prior even though it cannot by itself pin a number.
  THE CONVERGENCE THAT MATTERS. Three completely different designs now agree that the observed spread in adolescent sleep
  duration is mostly schedule, not requirement:
    ohayon2004      (meta-analysis, PSG/actigraphy) : duration falls with age across adolescence on SCHOOL days
                                                      (d = -0.57) but NOT on nonschool days (d = -0.04)
    inderkum2018twin (twin SEM, 6 mo actigraphy)    : duration heritability 15% on SCHOOL days, 68% on FREE days
    klerman2005      (T1 sleep extension)           : short habitual sleepers were objectively sleepier at baseline and
                                                      still slept MORE on day 3 of extended opportunity, i.e. their short
                                                      duration was debt, not a low requirement
  Any one of these could be dismissed; all three together make the "our subject may simply need less sleep" explanation
  hard to sustain.
  CAN I GET AN SD OF SLEEP NEED OUT OF THIS? Only a loose bracket, and I want to be explicit about why not more.
  If free-day duration has between-person SD sigma_free and heritability 0.68, the additive-genetic SD of free-day duration
  is sqrt(0.68) * sigma_free = 0.82 * sigma_free. Taking sigma_free of roughly 1.0-1.2 h (the between-person SD of
  adolescent actigraphy sleep duration; white2026ffcws reports 1.19 h on weekdays) gives a trait SD of about 0.82-0.98 h.
  That is an UPPER bound on the SD of sleep need, not an estimate of it, because free-day duration also contains
  heritable chronotype and heritable weekend catch-up behaviour, neither of which is sleep need - and note this same paper
  finds sleep MIDPOINT is 90% heritable on free days, which is precisely the chronotype contamination. Kitamura's directly
  measured 0.70 h sits just below this bracket, which is the pattern one would expect if the bracket is an upper bound.
  Recorded that way in exposure_priors.md section (iv): central SD 0.70 h, plausible range 0.4-1.0 h.
