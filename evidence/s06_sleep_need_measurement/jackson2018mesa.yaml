rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "large multi-ethnic cohort with BOTH 7-day actigraphy and in-home PSG, which is why it is worth including despite the elderly age; self-report derived from bed/wake times so it approximates time in bed; single PSG night subject to first-night effect; abstract-only access."
funding: "NIH/NHLBI (MESA); NIEHS intramural"
notes: |
  Included specifically because it is the only retrieved study giving the self-report bias against BOTH actigraphy and PSG
  in the same people, which lets the modeller separate the two reference standards.
  Verbatim (abstract): "Among 1910 adults, self-reported sleep duration, determined by differences between bed and wake
  times, was overestimated in all racial groups compared with PSG and actigraphy. Compared with whites (rho = 0.45),
  correlations were significantly lower only in blacks (rho = 0.28). Self-reporting bias for total sleep time compared
  with wrist actigraphy was 66 min (95% confidence interval [CI]: 61-71) for whites, 58 min (95% CI: 48-69) for blacks,
  66 min (95% CI: 57-74) for Hispanics, and 60 min (95% CI: 49-70) for Chinese adults. Compared with PSG, self-reporting
  bias in whites at 73 min (95% CI: 67-79) was higher than in blacks (54 min [95% CI: 42-65]) and Chinese (49 min [95%
  CI: 37-61]) but not different from Hispanics (67 min [95% CI: 56-78]). Slight agreement/concordance was observed between
  self-reported and actigraphy-based total sleep time (k = 0.14 for whites, 0.10 for blacks, 0.17 for Hispanics, and 0.11
  for Chinese) and PSG (wk = 0.08 for whites, 0.04 for blacks, 0.05 for Hispanics, and 0.01 for Chinese) across
  race/ethnicity."
  Range of the actigraphy bias across the four groups: 58-66 min (0.97-1.10 h) - remarkably stable, and consistent with
  cespedes2016hchs (1.11 h) and lauderdale2008 (0.80 h at 6 h). Age here is ~54-93 (MESA exam 5), so downweight heavily
  for a 16-19 year old; it is the ADULT anchor, not the adolescent one.
shard: "s06_sleep_need_measurement"
