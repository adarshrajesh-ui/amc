rob:
  tool: RoB2
  judgement: some_concerns
  notes: "T1 within-subject laboratory dose-response design with three TIB arms (5 h / 7.5 h / 10 h) over 9 nights, which is the strongest available design for estimating sleep need; but n=34 split across three arms, healthy volunteers, and abstract-only access means I cannot check the model form, the CI on 9.35 h, or whether an asymptote was genuinely reached. The 'sleep need' construct is model-dependent."
funding: "not stated in retrieved abstract"
notes: |
  Verbatim (abstract, retrieved from PubMed):
  "STUDY OBJECTIVES: This study will (1) estimate the nightly sleep need of human adolescents, (2) determine the time course
  and severity of sleep-related deficits when sleep is reduced below this optimal quantity, and (3) determine whether sleep
  restriction perturbs the circadian system as well as the sleep homeostat.
  METHODS: Thirty-four adolescents aged 15 to 17 years spent 10 days and nine nights in the sleep laboratory. Between two
  baseline nights and two recovery nights with 10 hours' time in bed (TIB) per night, participants experienced either severe
  sleep restriction (5-hour TIB), moderate sleep restriction (7.5-hour TIB), or no sleep restriction (10-hour TIB) for five
  nights. A 10-minute psychomotor vigilance task (PVT; lapse = response after 500 ms) and the Karolinska Sleepiness Scale were
  administered every 3 hours during wake. Salivary dim-light melatonin onset was calculated at baseline and after four nights
  of each sleep dose to estimate circadian phase.
  RESULTS: Dose-dependent deficits to sleep duration, circadian phase timing, lapses of attention, and subjective sleepiness
  occurred. Less TIB resulted in less sleep, more lapses of attention, greater subjective sleepiness, and larger circadian
  phase delays. Sleep need estimated from 10-hour TIB sleep opportunities was approximately 9 hours, while modeling PVT lapse
  data suggested that 9.35 hours of sleep is needed to maintain optimal sustained attention performance.
  CONCLUSIONS: Sleep restriction perturbs homeostatic and circadian systems, leading to dose-dependent deficits to sustained
  attention and sleepiness. Adolescents require more sleep for optimal functioning than typically obtained."
  WHY THIS IS THE ANCHOR FOR AGES 16-18: it is the only T1 estimate of sleep need measured in 15-17 year olds. Both of its
  numbers (9.0 h satiated, 9.35 h for optimal PVT) sit at or ABOVE the top of the NSF 8-10 h band midpoint and well above the
  7 h adult floor. Anyone anchoring a 16-17 year old's requirement at 8 h is using a number this study contradicts.
  ALSO NOTE THE 5-HOUR ARM: this protocol restricted adolescents to 5-hour TIB for five consecutive nights, which is almost
  exactly our subject's reported weekday exposure. The dose-response deficits it documents (PVT lapses, sleepiness, circadian
  phase delay) are the direct experimental analogue of the exposure being modelled, though the OUTCOME magnitudes belong to
  the cognition shard, not this one.
  WHAT IS MISSING: no between-person SD of sleep need is reported in the abstract. So this paper pins the CENTRE of the
  adolescent sleep-need prior but contributes nothing to its SPREAD. The spread has to come from kitamura2016 (n=15, ages
  20-26). See exposure_priors.md section (iv) and station_report.md for why this is the shard's biggest gap.
