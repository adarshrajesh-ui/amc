rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Large systematic search of four databases (7079 titles screened), studies with known psychiatric or medical comorbidity excluded, random-effects pooling, funnel plot with trim-and-fill, and formal moderator analyses including actigraphy device type and number of nights (neither of which moderated the effect sizes). THE AUTHORS' OWN QUALITY VERDICT IS NEGATIVE AND I AM RECORDING IT: 'The quality of the evidence was considered insufficient for sleep duration, sleep efficiency, and wake-up time ages 6-21.' Further limitations: the decade averages in Table 3 are unweighted averages of STUDY-level means, so they carry no participant-level dispersion and are vulnerable to small-study influence (the 10-19.99 y efficiency figure rests on only 12 studies); actigraphy over-counts sleep relative to PSG (see meredithjones2024) so the duration figures are upper bounds; fewer than half the studies reported race/ethnicity."
funding: "Not extracted"
notes: |
  RETRIEVED AS FULL TEXT. The PMC XML deposit (PMC8436145) contains only the abstract, so I fetched and parsed the PMC
  article HTML instead, which carries the complete results text and Tables 2, 3 and 5.
  WHY THIS IS THE BEST SOURCE IN THE SHARD FOR SLEEP EFFICIENCY. It is the only retrieved source that gives all three of:
  (a) an age band that actually contains 16-19 year olds, (b) the TST/TIB definition the model needs, stated explicitly
  ("Sleep efficiency was operationalized as sleep duration divided by time in bed and multiplied by 100"), and (c) a large
  pooled evidence base (53 articles, 11,525 participants for the efficiency analysis).
  FOUR-WAY CONVERGENCE ON SLEEP EFFICIENCY (TST/TIB), across two measurement modalities and four independent evidence bases:
    evans2021actigraphy  actigraphy meta-analysis, ages 10-19.99   0.8720   (12 studies)
    evans2021actigraphy  actigraphy meta-analysis, ages 20-29.99   0.8779   ( 9 studies)
    mitterling2015       PSG, ages <= 30, Austria                  0.870    (median)
    meredithjones2024    PSG, ages 8-16, New Zealand               0.891    (mean, SD 0.125)
  Central value 0.875. This is now one of the better-supported quantities in the shard and it is the basis for
  exposure_priors.md section (iii). Ohayon 2004 (d = 0.01 across adolescence) and this paper (r = -0.05 across the whole
  lifespan, fragile) both say the age adjustment is unnecessary.
  ONE TENSION I AM FLAGGING RATHER THAN SMOOTHING OVER. The Table 3 decade means for the young bands are about 87%, but the
  Discussion notes that "the average sleep efficiency was below 85% (a common threshold for insomnia) for half of the
  included studies". Those two statements are compatible - the first is a decade-band average, the second is the median of
  the study-level distribution across ALL ages including the elderly bands where efficiency is much lower (74.52% at
  60-69.99 y) - but together they show the between-study spread is wide. That spread, plus the participant-level SD of 0.125
  from meredithjones2024, is why I recommend an efficiency SD of 0.06 rather than something tighter: 0.06 is narrower than a
  single-night participant SD (correct, because a 3-year habitual average averages out night-to-night noise) but wide enough
  to cover the study-to-study disagreement.
shard: "s06_sleep_need_measurement"
