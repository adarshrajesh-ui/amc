rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Landmark meta-analysis, extensive moderator analyses (mental illness, physical illness, drugs/alcohol, sleep apnea, other sleep disorders, sex, fixed vs habitual schedule, and for children school vs nonschool day). Weaknesses: literature to 2003, so pre-AASM-2007 scoring (all but 5 PSG studies used Rechtschaffen and Kales criteria); every homogeneity Q statistic in the main tables is significant, so substantial unexplained heterogeneity; reports standardized AGE-ASSOCIATION effect sizes rather than age-band means and SDs, which limits its use for absolute normative values; the paper itself notes that data in adolescents are scarce ('The number of studies that examined the evolution of sleep parameters with age are scant among school-aged children, adolescents, and middle-aged adults')."
funding: "Not extracted"
notes: |
  RETRIEVED AS FULL TEXT (PDF, 19 pages, text extracted with pdfplumber).
  SAMPLE (verbatim): "Overall, 65 studies met all inclusion criteria. These studies represented 3,577 subjects aged 5 years
  to 102 years. The research reports devoted to children and adolescents totaled 1,186 subjects aged between 5 years and 19
  years." The effect-size metric is the bias-corrected standardized mean difference (verbatim: "The formula given by Hedges
  and Olkin was used: unbiased estimate of d = d x (1 - [3/{4(M1 + M2)-9}]). Values of d are interpreted according to Cohen
  guidelines: effect sizes at .2 are considered small, at .5 ..."), which is why scale is recorded as smd throughout.
  WHAT THIS PAPER DOES AND DOES NOT GIVE. The seed task asked for "means and SDs by age band" from this meta-analysis. It does
  not report those. What it reports is (a) standardized effect sizes for the ASSOCIATION of each sleep parameter with age,
  (b) fitted exponential age equations with the coefficient b and the proportion of variance explained, and (c) extensive
  moderator analyses. I extracted the effect sizes and the equation coefficient and did NOT manufacture age-band means from
  the figures. Absolute normative values in this shard come from galland2018, mitterling2015, meredithjones2024 and
  white2026ffcws instead.
  OVERALL LIFESPAN CORRELATIONS (verbatim, for context): "As can be observed, TST (r = -.76, P < .0001), sleep efficiency
  (r = -.82, P < .0001), percentage of SWS (r = -.56, P < .0001), and percentage of REM sleep (r = -.34, P < .0001) each
  showed a significant decrease with age. On the other hand, sleep latency (r = .16, P < .0001), percentage of stage 1 sleep
  (r = .16, P < .0001), percentage of stage 2 sleep (r = .34, P < .0001), and WASO (r = .75, P < .0001) each increased with
  age." These are cross-study correlations of study-level means against study-level mean age across the WHOLE 5-102 y range,
  so they are ecological and much larger than any within-age-band association; do not use them as individual-level slopes.
  ADOLESCENT SUMMARY (verbatim): "Sleep latency, sleep efficiency, and percentage of stage 1 had nonsignificant effect sizes."
  And from Table 11's summary of direction across life stages, with C = children 5-12 y and A = adolescents 13-18 y, the
  children-to-adolescents column shows total sleep time UNCHANGED and sleep efficiency UNCHANGED, while slow-wave sleep
  decreases and stage 2 increases. So across adolescence the ARCHITECTURE changes substantially but the DURATION and the
  EFFICIENCY do not.
  THE SCHOOL-DAY / NONSCHOOL-DAY DISSOCIATION IS THE HEADLINE FOR THIS SHARD. Verbatim from the abstract: "In children and
  adolescents, total sleep time decreased with age only in studies performed on school days." Effect size -0.57 (school) vs
  -0.04 (nonschool). Two readings of the same raw fact - "adolescents sleep less as they get older" - are being separated
  here, and only one of them survives: opportunity shrinks, need does not. This is independent corroboration of the
  laboratory finding in short2018sleepneed that 15-17 year olds still need about 9 h, and it is the empirical answer to the
  awkward one-hour step down in the NSF guideline at the 18th birthday.
shard: "s06_sleep_need_measurement"
