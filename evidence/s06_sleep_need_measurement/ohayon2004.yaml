    from_figure: false
    inferred_from_ci: false
    direction_note: "NULL. THIS IS THE MOST IMPORTANT EFFECT IN THIS RECORD FOR THE WHOLE PIPELINE. Sleep duration falls across adolescence ONLY when the recording is made on a school day (-0.57); on nonschool days there is NO decline (-0.04, CI straddling zero). The adolescent sleep decline is therefore SCHEDULE-IMPOSED OPPORTUNITY LOSS, not a developmental fall in sleep need. Any model that reads the age-related decline in observed adolescent sleep as evidence that older adolescents NEED less sleep has the causality backwards, and would wrongly shrink the requirement for our 16-19 year old exactly where the guidelines already step down by an hour (see hirshkowitz2015nsf)."
