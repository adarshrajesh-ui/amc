rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Very large individual-participant-data meta-analysis (36 Dutch studies plus UK Biobank plus US data), systematic search of Embase/Medline/Web of Science, prespecified inclusion (published 2000-2017, >= 100 participants, general population). Key weakness for this shard: the sleep-duration reference charts are built from QUESTIONNAIRE data ('data on sleep assessed with questionnaires'), i.e. from exactly the self-report instrument this shard is trying to calibrate, so the charts inherit the over-reporting bias documented in lauderdale2008 and white2026ffcws. Three countries only. Abstract-only access on my side."
funding: "Not stated in the abstract"
notes: |
  ACCESS: abstract only. Unpaywall reports is_oa = false for 10.1038/s41562-020-00965-x, Europe PMC reports
  isOpenAccess = 'N' with no PMC id, and there is no accepted-manuscript deposit I could find. All numbers above are
  verbatim from the PubMed abstract.
  WHAT THE TASK ASKED FOR AND WHAT I COULD ACTUALLY GET. The task asked for "means and SDs by age band, from OBJECTIVE
  measurement where possible" from this paper. The abstract states that the paper "provides age- and sex-specific population
  reference charts for sleep duration and efficiency", but those charts are figures in the paywalled full text and the
  abstract reports NO age-band means and NO SDs. I therefore did not extract any mean or SD from this paper, and I did not
  reconstruct any from the figures. The age-banded normative role in this shard is instead filled by galland2018 (actigraphy,
  pooled mean 7.4 h for 15-18 y), white2026ffcws (actigraphy, 7.57 h weekday at mean age 15.4 y) and mitterling2015 (PSG,
  6.89 h median at <= 30 y). Recording this openly because the seed task named this paper as a primary source for the
  normative distribution and it could not serve that role.
  THE PART OF THIS PAPER THAT IS STILL DECISION-RELEVANT: the prevalence framing. Among teenagers 51.5% are below the
  recommended 8-10 h. Combined with wheaton2018yrbs (US high-school students: 74.6% below 8 h, 20.0% below 6 h) this places
  our subject's reported 5-6 h weekday sleep in the lower tail but NOT at an extreme that would strain credibility. A
  self-report of 5-6 h on school nights is a common report, which is relevant to how much prior weight the model should put
  on the report being roughly honest as opposed to being a rounded stereotype.
  THE SEX SIGN-REVERSAL IS THE MOST USEFUL SINGLE SENTENCE. Self-report and actigraphy disagree about the DIRECTION of the
  female-vs-male sleep-duration contrast in the same people. A modeller tempted to treat self-report as truth-plus-noise
  should read that sentence first: noise cannot reverse a sign, only bias that correlates with the covariate of interest can.
  Our subject is male, and cespedes2016hchs and guedes2016 both find male self-report agrees WORSE with actigraphy, so the
  relevant sex is the one with the weaker report.
shard: "s06_sleep_need_measurement"
