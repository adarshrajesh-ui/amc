    value: -1.0
    se: null
    ci: null
    conversion_formula: "No numeric magnitude is given in the abstract. Coded as -1 to denote that the self-reported and actigraphic estimates of the SAME sex contrast point in OPPOSITE directions. No arithmetic performed."
