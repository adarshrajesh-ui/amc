    inferred_from_ci: false
    direction_note: "A SIGN REVERSAL, not a magnitude. Women report sleeping SHORTER and less efficiently than men, but actigraphy says they sleep LONGER and more efficiently. This is the strongest available demonstration that self-report bias is not random noise but a systematic, subgroup-varying distortion large enough to flip the sign of a real contrast. It is the reason the shard treats measurement error as structural rather than as additive noise."
