rob:
  tool: none
  judgement: critical
  notes: "n = 2 carriers, one family, ascertained BECAUSE of the extreme phenotype, and the human sleep duration is SELF-REPORTED (the mouse and fly work in this paper is experimental but the human phenotype is not). Maximal ascertainment bias. Include only to bound the plausible lower tail of sleep need, never as an effect estimate."
funding: "NIH (paper is a PMC author manuscript)"
notes: |
  Verbatim (full text, retrieved from PMC): "However, these two individuals have sleep-onset times that are similar to that of
  conventional sleepers. The habitual self-reported total sleep time per 24-hour day was much shorter in mutation carriers
  (average 6.25 hours) compared with the noncarriers (average 8.06 hours) in this family. Thus, they represent 'natural short
  sleepers' who routinely sleep less than individuals with familial advanced sleep-phase syndrome (FASPS) or general controls
  (Table 1). The average total sleep time for American adults on nonworkdays is ~7.4 hours."
  ROLE IN THIS SHARD: this is the LOWER-TAIL bound on individual sleep need. It establishes that a human sleep requirement near
  6.25 h exists and is genetically specified. Two things stop it from widening the sleep-need prior much:
  (1) POPULATION PENETRANCE IS ABSENT. weedon2022 tested this exact variant class in 191,929 population-sequenced people and found
      no association with sleep duration. The 6.25 h phenotype does not generalise out of the ascertained pedigree.
  (2) THE PHENOTYPE DOES NOT MATCH OUR SUBJECT. Genuine FNSS carriers sleep short and do NOT extend when free to (note the paper's
      own observation that their sleep-onset times are normal, i.e. they wake early rather than going to bed late). Our subject
      reports 7-8 h at weekends and occasional 10-11 h nights, which is a catch-up pattern and is diagnostically inconsistent with
      FNSS.
  Recommended use: if the modeller wants a heavy lower tail on sleep need, cap the mixture weight on a ~6.25 h component at <1%
  and justify it from weedon2022's null rather than from this pedigree.
  ALSO WORTH KNOWING for the sleep-need normative question, quoted from this paper: "The average total sleep time for American
  adults on nonworkdays is ~7.4 hours."
shard: "s06_sleep_need_measurement"
