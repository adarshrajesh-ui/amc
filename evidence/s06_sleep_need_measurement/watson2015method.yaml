rob:
  tool: AMSTAR-2
  judgement: high
  notes: "methodology/discussion companion to a consensus statement. Included solely for its explicit statements about the strength and nature of the evidence base, which the one-page consensus statement omits."
funding: "American Academy of Sleep Medicine and Sleep Research Society; CDC cooperative agreement 1U50DP004930-01"
notes: |
  Included because the task asked specifically for "the strength of the evidence base the panels cited". This paper is where
  the AASM/SRS panel says it out loud. All quotations verbatim from the PMC full text.
  ON INTER-INDIVIDUAL VARIATION AND SLEEP NEED:
  "These observations raise a critical question: How much sleep is needed for optimal health? Sleep duration shows
  substantial intra- and inter-individual variation. Twin studies show sleep duration heritability between 31% and 55%,
  suggesting substantial genetic influences on sleep need. Environmental factors, such as occupational duties and commute
  time, family responsibilities, and social and recreational opportunities, can lead to substantial discrepancies between the
  amount of sleep needed and the amount of sleep obtained."
  "Sleep is a biological imperative. Meeting our need for sleep duration, timing, regularity, and quality requires volitional
  behaviors partially dictated by genetic and physiologic factors. However, a large proportion of inter-individual variability
  in sleep is likely explained by psychological, behavioral, social, cultural, and environmental factors."
  "We need to better understand the genetic factors related to individual sleep need, resilience to sleep loss, and perception
  of sleep."
  "Identify biomarker(s) of sleep need or sleep deprivation." (listed as a FUTURE research priority, i.e. no such biomarker
  exists)
  ON THE MEASUREMENT PROBLEM (this is the evidence-strength admission that matters most to this shard):
  "The panel faced many challenges in the process of generating the consensus recommendation. Perhaps the biggest issue was
  the heterogeneity of sleep duration measurement. Retrospective self-report, the most common method in epidemiologic studies
  and in clinical practice, is easy and has good face validity. However, sleep duration can vary substantially over time, and
  there is little information on how individuals account for such variation in their reports. Also, self-report questions may
  have captured time in bed rather than time asleep. This distinction is particularly important among individuals with chronic
  illness who spend long periods of time in bed. It is also uncertain, in some studies, whether individuals include nap time
  in their reports of total sleep time. Self-reported sleep duration often differs considerably from objective measures of
  sleep duration, and may underestimate or overestimate sleep duration compared to these other methods."
  "Polysomnography (PSG) and actigraphy were utilized as objective measures in some studies. Actigraphy has better sensitivity
  (detecting sleep) than specificity (detecting wake). As a result it often overestimates sleep duration relative to
  self-reports and to a lesser extent polysomnography, particularly in poor sleepers."
  "while the focus on objective, physiological sleep is a strength of laboratory studies, these objective measures correlate
  weakly with self-reported sleep duration, which is the method most relevant to clinical, public health, and policy
  recommendations. Standard methods to model such discrepancies must be sought until accurate, scalable, objective measures of
  sleep duration are developed for utilization in large epidemiological studies."
  ON THE FINAL VOTE: "...was appropriate to support optimal health in adults: 7 hours."
  BOTTOM LINE FOR THE POOLER: the 7 h adult floor is derived from a literature the panel itself describes as (a) mostly
  retrospective self-report, (b) possibly measuring time in bed rather than sleep, (c) weakly correlated with objective sleep,
  and (d) lacking any biomarker of sleep need. Any downstream "sleep debt = reported sleep minus 7 h" calculation inherits all
  four problems. There is also a note of caution in the panel's own words that they are aware "there is little information on
  how individuals account for such variation in their reports" - which is directly the recall-rounding question in
  exposure_priors.md section (v), and the answer is that essentially nobody has studied it.
shard: "s06_sleep_need_measurement"
