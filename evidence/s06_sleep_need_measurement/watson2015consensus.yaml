rob:
  tool: AMSTAR-2
  judgement: high
  notes: "modified RAND Appropriateness Method; the recommendation is a one-sided threshold derived from voting, and the panel's own methodology paper concedes the underlying literature is dominated by retrospective self-report and that objective measures 'correlate weakly' with it. Context only, never a primary effect."
funding: "American Academy of Sleep Medicine and Sleep Research Society; CDC cooperative agreement 1U50DP004930-01"
notes: |
  FULL VERBATIM CONSENSUS STATEMENT (retrieved from the JCSM dual publication PDF, J Clin Sleep Med 2015;11(6):591-592,
  DOI 10.5664/jcsm.4758, which Crossref confirms carries the identical title; the SLEEP version 38(6):843-844 with
  DOI 10.5665/sleep.4716 / PMID 26039963 is the record cited above and both were verified):
    "- Adults should sleep 7 or more hours per night on a regular basis to promote optimal health.
     - Sleeping less than 7 hours per night on a regular basis is associated with adverse health outcomes, including weight
       gain and obesity, diabetes, hypertension, heart disease and stroke, depression, and increased risk of death. Sleeping
       less than 7 hours per night is also associated with impaired immune function, increased pain, impaired performance,
       increased errors, and greater risk of accidents.
     - Sleeping more than 9 hours per night on a regular basis may be appropriate for young adults, individuals recovering
       from sleep debt, and individuals with illnesses. For others, it is uncertain whether sleeping more than 9 hours per
       night is associated with health risk.
     - People concerned they are sleeping too little or too much should consult their healthcare provider."
  VERBATIM methodology/evidence strength: "A panel of 15 experts in sleep medicine and research used a modified RAND
  Appropriateness Method to develop a recommendation regarding the sleep duration, or sleep duration range, that promotes
  optimal health in adults aged 18 to 60 years. The expert panel reviewed published scientific evidence addressing the
  relationship between sleep duration and health, using a broad set of National Library of Medicine Medical Subject Headings
  (MeSH) terms and no date restrictions, which resulted in a total of 5,314 scientific articles. The process was further
  guided by the Oxford grading system. The panel focused on nine health categories with the best available evidence in
  relation to sleep duration: general health, cardiovascular health, metabolic health, mental health, immunologic function,
  human performance, cancer, pain, and mortality. Consistent with the RAND Appropriateness Method, multiple rounds of
  evidence review, discussion, and voting were conducted to arrive at the final recommendation."
  VERBATIM on individual variation: "Current evidence supports the general recommendation for obtaining 7 or more hours of
  sleep per night on a regular basis to promote optimal health among adults aged 18 to 60 years. Individual variability in
  sleep need is influenced by genetic, behavioral, medical, and environmental factors. A clearer understanding of the
  precise biological mechanisms underlying sleep need continues to require further scientific investigation."
  KEY INTERPRETIVE POINT: "7 or more hours" is a FLOOR, not a requirement estimate. Using 7 h as the sleep-need central
  value for an 18-19 year old (as a naive reading of this guideline invites) understates need by 1.4-1.9 h relative to the
  laboratory sleep-satiation estimates in klerman2008 (8.9 h) and kitamura2016 (8.41 h), and contradicts this same
  statement's own carve-out that >9 h may be appropriate for young adults. The guideline floor and the lab asymptote answer
  different questions; exposure_priors.md section (iv) keeps them separate.
