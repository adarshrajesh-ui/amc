rob:
  tool: none
  judgement: critical
  notes: "family-ascertained rare-variant discovery study; the human phenotyping is observational and the causal work is done in mice. Ascertainment is deliberately extreme. Include only as a bound on the lower tail of sleep need, never as a population effect estimate."
funding: "NIH (PMC author manuscript)"
notes: |
  Verbatim (full text, retrieved from PMC): "It is likely that 'required sleep time' is a genetic trait resulting from
  contributions of many variants in many genes. The >50 FNSS families identified to date have a sufficiently strong phenotype
  (lifelong requirement of <6.5 hours per/night) so that we have enriched for single mutations of large effect. Still, there is
  variability in the expression of FNSS among affected individuals, even within the same family. Taken together, these
  observations suggest that FNSS is caused by alleles of strong effect and that the phenotype is modified by the genetic
  background of each [individual]."
  Verbatim (abstract/summary): "A rare variant of ADRB1 was found in humans who sleep fewer hours than most. Using mouse
  modeling and calcium imaging experiments, Shi et al demonstrated that dorsal pons ADRB1+ neurons activity is increased in the
  mutant, correlating with increased wakefulness."
  TWO USES IN THIS SHARD:
  (1) The phrase "required sleep time is a genetic trait resulting from contributions of many variants in many genes" is the
      polygenic framing that justifies modelling sleep need as an approximately NORMAL latent variable rather than as a mixture
      of discrete phenotypes. That is the functional form recommended in exposure_priors.md section (iv).
  (2) The <6.5 h "lifelong requirement" threshold bounds how low a genuine requirement plausibly goes. Combined with
      he2009dec2's 6.25 h carriers, the documented floor of human sleep need is roughly 6.0-6.5 h, and it is rare. Since our
      subject reports sleeping 5-6 h on weekdays, even the most extreme documented natural-short-sleeper requirement would leave
      him in deficit on his worst nights - though that inference should lean on weedon2022's population null, which shows these
      variants are not penetrant outside ascertained pedigrees, rather than on these pedigrees themselves.
  n field: the schema requires an integer; I recorded 50 to represent the ">50 FNSS families" the authors reference, which is the
  only countable denominator in the quoted passage. It is a count of FAMILIES, not of phenotyped individuals, and the ADRB1
  discovery pedigree itself is a single family. Do not use this n for weighting.
shard: "s06_sleep_need_measurement"
