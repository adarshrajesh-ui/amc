rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "large population-based sample with >5 nights of actigraphy (a strength: multi-night actigraphy is a better habitual reference than the 3 nights in lauderdale2008); Hispanic/Latino only; abstract-only access so I could not check the full Bland-Altman limits of agreement or the age-stratified slopes."
funding: "NIH/NHLBI (HCHS/SOL)"
notes: |
  Verbatim support (abstract, retrieved from PMC): "Mean amount of time spent asleep was 7.85 (standard deviation, 1.12)
  hours by self-report and 6.74 (standard deviation, 1.02) hours by actigraphy; correlation between them was 0.43. For
  each additional hour of self-reported sleep, actigraphy time spent asleep increased by 20 minutes (95% confidence
  interval: 19, 22). Correlations between self-reported and actigraphy-assessed time spent asleep were lower with male
  sex, younger age, sleep efficiency <85%, and night-to-night variability in sleep duration >=1.5 hours. Adding
  sociodemographic and sleep factors to self-reports increased the proportion of variance explained in actigraphy-assessed
  sleep slightly (18%-32%)."
  DIRECTLY RELEVANT MODERATOR FINDING: agreement is WORSE for male sex, younger age, sleep efficiency <85%, and
  night-to-night variability >= 1.5 h. Our subject is male, 16-19, and has night-to-night variability far above 1.5 h
  (5-6 h weekdays vs 7-8 h weekends vs 3-4 h before exams vs 10-11 h occasional). Every one of the four moderators points
  the same way: his self-report is at the LOW end of the reliability distribution, so the model should widen the
  measurement-error SD relative to the pooled figure, not narrow it.
  WORKED REVERSE-REGRESSION EXAMPLE for the modeller (my arithmetic, not the paper's):
    E[actigraphy | report] = 6.74 + 0.333*(report - 7.85)
    report = 5.5 h -> 6.74 + 0.333*(-2.35) = 5.96 h
    report = 6.0 h -> 6.74 + 0.333*(-1.85) = 6.12 h
  i.e. calibrating the report through the reverse regression moves true sleep UP relative to the report, the opposite
  direction to naively subtracting the 1.11 h mean bias. See exposure_priors.md section (ii).
