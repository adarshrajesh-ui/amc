rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Prospective, with sleep measured by DAILY DIARY over 13 days (better than a single recall question), a real vaccine, and antibody assayed at baseline, 1 month and 4 months. Weaknesses: n = 83; exposure entirely self-reported; the significant result is for ONE of three viral strains (A/New Caledonia), with A/Panama only at p<0.10 and the B strain not reported as significant - so this is a 1-of-3 outcome selection issue, which matters because spiegel2023_vaccine_meta's protocol was to use 'the most significant result in the expected direction', inflating its pooled estimate; abstract-only access, so I have no effect sizes."
funding: "not stated in the abstract"
notes: |
  ACCESS: abstract only (Int J Behav Med, paywalled, no PMC copy). Design details cross-checked against
  Table 2 of spiegel2023_vaccine_meta, which describes this study verbatim as: "healthy young adults|83|
  18-25|37/46|Influenza (A/New Caldonia (H1N1) and A/Panama (H3N2) and B/Yamanashi or B/Victoria
  (H1N1))|1|Ab to the 3 influenza viral strains via hemagglutination inhibition assays at 0, 1, and
  4mths|13days self-reported (diary-based) for 3 nights prior and 10 nights following vaccination.|
  *13days sleep duration linked to Ab to A/New caledonia (H1N1) at 1 and 4mths (largely driven by the
  2 nights preceding vaccination);# A/Panama viral strain at 1mth|". pct_female derived from that
  table's 37/46 male/female split = 55.4% female.
  WHY THIS RECORD MATTERS DESPITE BEING SMALL AND ABSTRACT-ONLY: the age range is 18-25. It is one of
  only two vaccine-response datasets in the target age band (the other, the college-student insomnia
  study cited in besedovsky2019_review, was NULL). For a shard about an 18-year-old, that is worth
  more than another midlife cohort.
  It is one of the three prospective studies pooled in spiegel2023_vaccine_meta (self-report arm,
  pooled ES 0.29 overall / 0.59 in under-65s) - do not double-count.
  STRAIN-SELECTION CAVEAT, stated because it cuts against the pooled vaccine estimate: only 1 of 3
  strains reached p<.05. The meta-analysis's rule of taking the most significant strain per study
  means its 0.79/0.59 pooled estimates are biased upward relative to a pre-specified single-strain
  analysis.
shard: "s10_immune"
