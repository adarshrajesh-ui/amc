rob:
  tool: ROBINS-I
  judgement: moderate
  notes: "Exposure objectively measured (actigraphy) and prospectively precedes randomly-timed viral challenge, so reverse causation is excluded and the outcome is biologically verified - unusually strong for an observational immune exposure. But: sleep itself was NOT randomised, so residual confounding remains; volunteers were selected for LOW prechallenge antibody to maximise infection rate (limits transportability of absolute rates); category ns are small (>7 h referent n = 22, only ~3 colds), which is why the CIs are enormous; 14 separate one-covariate-at-a-time models raise multiplicity concerns. Actigraphy mean TST 5.8 h vs diary 7.5 h in the same people - a 1.7 h discrepancy that matters for dose calibration."
funding: "NIH (per PMC record: grants supporting the Pittsburgh Common Cold Project)"
notes: |
  DOSE CALIBRATION WARNING for the downstream model: the exposure here is ACTIGRAPHIC TST, and
  actigraphy mean was 5.8 h while diary mean in the same 164 people was 7.5 h (Table 1). A subject
  who self-reports 5-6 h weekday sleep is therefore probably in this study's "<5 h" actigraphic
  category, not its "5-6 h" category. Do not equate self-reported and actigraphic hours.
  MECHANISM SPLIT: the effect is on CLINICAL COLD (infection + objective illness signs), not on
  infection per se; sleep duration was unrelated to infection rate (P = 0.543) and only marginally
  related to illness expression among the infected (b = -0.32, SE = 0.19, P = 0.090). The authors
  write "the association with cold incidence appears to be primarily driven by illness expression."
  So this is better read as evidence about symptom severity/inflammatory regulation than about
  host resistance to viral entry.
  Sleep FRAGMENTATION was null (b = -0.01, SE = 0.02, P = 0.755 fully adjusted), and self-reported
  duration and efficiency were also null in this sample - which contradicts the same group's
  earlier Cohen 2009 self-report finding.
  Continuous per-hour estimate: b = -0.44 (SE 0.17, P = 0.011) adjusting for age + antibody;
  b = -0.49 (SE 0.20, P = 0.012) fully adjusted; b = -0.56 (SE 0.21, P = 0.006) also adjusting for
  fragmentation. Approx OR per 1 h less sleep = exp(0.44) = 1.55.
  Shares the Pittsburgh viral-challenge infrastructure with cohen2009_cold but a different,
  later-recruited sample (2007-2011 vs earlier); cohort_family tagged identically so the pooler
  can decide whether to treat them as correlated.
