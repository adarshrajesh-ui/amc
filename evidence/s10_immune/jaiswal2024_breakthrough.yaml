    from_figure: false
    inferred_from_ci: false
    direction_note: "positive = HARM, but SMALL and of unclear meaning - the authors say so themselves. Once again the sleep dimension that predicts an immune outcome is CONTINUITY/fragmentation, not duration: same pattern as cohen2009_cold (efficiency beat duration), patel2012_pneumonia (perceived inadequacy beat duration), pratherleung2016_nhanes (disturbance beat duration) and irwin2016_inflammation_meta (disturbance beat duration). The absolute difference here is 0.19 awakenings/hour - tiny."
    covariates: ["age", "gender"]
    followup_years: null
    cohort_family: "DETECT"
    quote: "Increased awakening frequency was associated with breakthrough infection after the 1st booster with 3.01 +/- 0.65 awakenings/hour in the breakthrough group compared to 2.82 +/- 0.65 awakenings/hour in those without breakthrough (P < 0.001). Cox proportional hazards modeling showed that age < 60 years (hazard ratio 2.15, P < 0.001) and frequency of awakenings (hazard ratio 1.17, P = 0.019) were associated with breakthrough infection after the 1st booster. ... While increased awakening frequency during sleep was associated with breakthrough infection beyond traditional risk factors, the clinical implications of this finding are unclear."
rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Big (5,265 and 2,583), prospective, with OBJECTIVE wearable-measured exposure preceding the outcome - unusual and valuable for this literature. Weaknesses: outcome is SELF-REPORTED breakthrough infection in a digitally-recruited app cohort, so ascertainment depends on the participant testing and reporting; consumer wearables estimate sleep imperfectly; digitally recruited volunteers are unrepresentative (health-engaged, likely older and wealthier than average); models adjusted only for age and gender; abstract-only access, so I could not see the sleep-duration effect estimate or its CI, which limits how tightly I can bound the null."
funding: "not stated in the abstract; authors declare no competing interests"
notes: |
  ACCESS: abstract only (a PMC copy exists, PMC10897487, which I did not retrieve). Everything recorded
  is from the PubMed abstract.
  WHY THIS IS THE MOST IMPORTANT NULL FOR THE DOWNSTREAM MODEL: the entire vaccine-response chain of
  reasoning is antibody titre -> presumed reduced protection -> more infection. This study tested the
  last link directly, with objective sleep measurement and 837 total breakthrough events, and found
  nothing for sleep duration. spiegel2023_vaccine_meta explicitly noted that no COVID-vaccine sleep
  data existed when it was written and speculated that the antibody effect would carry over; this
  study is the closest test of that speculation and it did not.
  HOW TO RECONCILE with spiegel2023_vaccine_meta's ES of 0.79: an antibody-titre shift of that size
  need not translate into measurable differences in clinical breakthrough, because protection is a
  saturating function of titre and most vaccinated people sit well above the protective threshold.
  That is the most parsimonious reading, and it argues for translating the vaccine finding into
  outcomes CAUTIOUSLY rather than assuming proportional infection risk.
  LIMITATION ON THE NULL ITSELF: with no reported CI for the duration effect I cannot state how large
  an effect is excluded. The null is directionally informative, not a tight equivalence bound.
