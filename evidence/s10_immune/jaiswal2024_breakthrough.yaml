    direction_note: "THE STRONGEST SINGLE NULL IN THIS SHARD, AND THE ONE WITH THE MOST REAL-WORLD OUTCOME. positive would = harm. Objectively measured sleep duration around vaccination did NOT predict actual breakthrough COVID-19 infection in 5,265 people (256 events) after dose 2, nor in 2,583 people (581 events) after the booster. This is the clinical endpoint that the vaccine-antibody literature is a proxy for, measured with OBJECTIVE exposure and a large sample - and it is null."
