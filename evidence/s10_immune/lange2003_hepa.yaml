    direction_note: "MECHANISM, not an outcome. Sleep raised growth hormone, prolactin and dopamine (p<.01) and lowered TSH, noradrenaline and adrenaline (p<.02). White-blood-cell subset counts were only marginally affected - i.e. the antibody effect is not explained by cell trafficking."
    covariates: []
    followup_years: null
    cohort_family: "Luebeck_Lange_vaccination"
    quote: "Compared with wakefulness, sleep after vaccination distinctly increased release of several immune-stimulating hormones including growth hormone, prolactin, and dopamine (p <.01). Concentrations of thyrotropin, norepinephrine, and epinephrine were lowered by sleep (p <.02), whereas sleep only marginally influenced WBC subset counts."
rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Experimental manipulation of sleep with a hard immunological endpoint, which is the right design. But n = 19 total across two parallel groups is very small; abstract only, so I cannot verify randomisation, whether the assay was blinded, or baseline comparability; and the exposure is ONE night of total deprivation, which is not the subject's exposure (chronic partial restriction). Single-centre."
funding: "not stated in the abstract"
notes: |
  ACCESS: abstract only. Psychosomatic Medicine 2003 is paywalled and has no PMC copy. Every number
  above is from the PubMed abstract, retrieved with efetch. No table or figure values are recorded.
  EXPOSURE MISMATCH warning for the pooler: this is a single night of TOTAL sleep deprivation on the
  night immediately after immunisation - a targeted attack on the consolidation window - not habitual
  short sleep. It bounds the immunological importance of sleep-around-vaccination but should not be
  used to estimate the effect of a 5-6 h habitual schedule.
  This study is one of the four experimental studies pooled in spiegel2023_vaccine_meta; do not
  double-count it against that record.
  The same group's follow-up (lange2011_memory, PMID 21632713) extended this design to three
  vaccinations with 1-year follow-up and is the best available evidence on whether the deficit
  persists.
