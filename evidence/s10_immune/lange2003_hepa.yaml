    ci: null
    conversion_formula: "Abstract reports a 'nearly two-fold higher' titre in the sleep group at 4 weeks, p = .018. Encoded as approximately +100% for the sleep group (equivalently roughly -50% for the deprived group). Group means and SDs are in the paywalled full text, which I could not retrieve, so se is null rather than invented. The p-value (.018) with n = 19 implies roughly |d| ~ 1.2, but I have NOT recorded that as an effect because the group split (n per arm) is not stated in the abstract."
    from_figure: false
    inferred_from_ci: false
    direction_note: "positive = BENEFIT of sleep. Sleeping normally after vaccination produced nearly double the antibody titre of staying awake for one night. Framed as harm: a single night of no sleep after immunisation roughly halved the 4-week antibody response."
