    outcome_construct: hepatitis_a_antibody_titre_4wk
    exposure: {type: total_deprivation, dose_h: 0, referent_h: 8, duration_days: 1, contrast_label: "ONE night of total sleep deprivation on the night after primary HAV vaccination vs regular sleep; titre at 4 weeks"}
    scale: pct_change
