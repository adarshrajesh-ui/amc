rob:
  tool: ROBINS-I
  judgement: moderate
  notes: "Strengths: 14 consecutive daily interviews (not a single recall question), exposure precedes a standardised viral challenge, biologically verified outcome, robust to 16 covariates entered singly and jointly. Weaknesses: exposure is SELF-REPORT (the same group's later actigraphy study found self-reported duration and efficiency were null - prather2015_rhinovirus); tertile cells are small; participants selected for prechallenge antibody titer <=4, so absolute infection rate (88%) is engineered and not generalisable; duration and efficiency effects overlap and only efficiency survived joint entry, so the duration OR is partly a proxy for continuity."
funding: "NIH / NCCAM (Pittsburgh Common Cold Project)"
notes: |
  KEY NUANCE ON INFECTION vs ILLNESS, quoted verbatim: "When the components of clinical illness
  (infection and signs or symptoms) were examined separately, sleep efficiency but not duration was
  associated with signs and symptoms of illness. However, neither was associated with infection
  (analysis not reported). This study was designed to maximize the infection rate (participants
  selected for low antibody levels) and was not powered to fairly test whether sleep is associated
  with infection (over 88% were infected). Consequently no conclusions about the role of sleep in
  infection can be made from this null effect."
  So BOTH Pittsburgh challenge studies find the effect on symptomatic illness, not on infection.
  Continuous estimates (age + antibody adjusted): duration B = -0.39, SE 0.15, P<.02; efficiency
  B = -8.93, SE 2.97, P<.003. Fully adjusted (16 covariates): duration b = -0.39, SE 0.18, P<.03;
  efficiency b = -6.93, SE 3.37, P<.04. Joint entry: efficiency B = -7.34, SE 3.14, P<.02 remained
  significant, duration B = -0.27, SE 0.16, P>.10 did not.
  Tertile ns: duration low <7 h N=58, middle 7-<8 N=52, high >=8 N=43; efficiency low <92% N=48,
  middle 92-98% N=53, high >98-100% N=52.
  Extreme-efficiency contrast: efficiency <=85% (N=13) vs rest, OR 5.37 (1.51-19.1);
  log_or = 1.6808, se = 0.6473.
  "Feeling rested" (the evaluative measure) was NOT associated with colds (P>.17) - an internal null
  that argues the effect is not pure symptom-reporting bias.
  Note this cohort is age 21-55, mean 37 - poor age match to an 18-year-old. Population match
  labelled poor_midlife accordingly.
  Same viral-challenge infrastructure as prather2015_rhinovirus; tag as one cohort_family.
shard: "s10_immune"
