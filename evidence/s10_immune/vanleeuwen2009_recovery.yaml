rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Lab protocol with a parallel control arm (6 men kept at 8 h TIB throughout) whose markers stayed at baseline at all timepoints - that internal control substantially strengthens the causal reading. Weaknesses: 13 restricted + 6 controls is very small and unbalanced; single-sex; percentages-of-baseline are reported without dispersion, so no effect size or SE is recoverable for most outcomes; many markers tested at three timepoints with no stated multiplicity correction; the title's causal claim about cardiovascular disease far outruns what a 9-day study can show."
funding: "not extracted"
notes: |
  PROTOCOL, verbatim: "After 2 baseline nights of 8 hours time in bed (TIB), 13 healthy young men had
  only 4 hours TIB per night for 5 nights, followed by 2 recovery nights with 8 hours TIB. 6 control
  subjects had 8 hours TIB per night throughout the experiment."
  n recorded as 19 = 13 restricted + 6 control.
  This is one of THREE independent experiments in this shard addressing recovery, and it lands on the
  pessimistic side, agreeing with simpson2016_repeated_recovery and disagreeing with
  pejovic2013_recovery. The authors' own conclusion is the strongest durability claim in my evidence
  set: "Therefore, long-term sleep restriction may lead to persistent changes in the immune system."
  I flag that as an EXTRAPOLATION by the authors from a 9-day study, not a demonstrated durable
  effect: nothing here was measured beyond two recovery nights, so "persistent" means "still abnormal
  after 48 hours", not "permanent".
  KEY MECHANISTIC READ: the study separates (a) cell trafficking, which reverses fast, from
  (b) acute-phase/cytokine responses, which do not reverse within two nights. For the downstream
  model, the reversibility prior should be marker-specific.
shard: "s10_immune"
