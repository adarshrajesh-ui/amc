rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Intra-individual crossover with a control condition in the same 14 people, PSG-controlled, and uniquely it models the REAL-WORLD weekday-restrict/weekend-catch-up cycle over three weeks - the closest experimental analogue to the target exposure that exists. Weaknesses: n = 14 is small; the persistence findings sit at p<0.05 and p=0.09, i.e. right at the boundary, with several 'trended' results the authors correctly do not overclaim; magnitudes are only in figures, so I could extract direction and significance but not effect sizes; monocyte IL-6 expression is a mechanistic readout whose mapping onto clinical infection risk is unestablished; only 3 weeks, not 3 years."
funding: "not extracted"
notes: |
  PROTOCOL, verbatim: "This common sleep pattern was experimentally modeled with three weeks of
  5 nights of sleep restricted to 4 hours followed by two nights of 8-hour recovery sleep. In an
  intra-individual design, 14 healthy adults completed both the sleep deprivation and an 8-hour
  control condition."
  THIS RECORD IS THE DIRECT ANSWER TO REQUIRED EXTRACTION #6, and it complicates the optimistic story.
  Pair it with pejovic2013_recovery, which found that circulating 24-h IL-6 DID fully normalise after
  2 nights of 10 h sleep following ONE week of 6 h nights. The two are reconcilable:
    - one cycle, mild restriction (6 h), generous recovery (10 h), PLASMA IL-6  -> fully reverses
    - repeated cycles, severe restriction (4 h), ordinary recovery (8 h), MONOCYTE IL-6 -> does not
  So the reversibility of inflammation depends on cycle repetition, restriction depth, and how much
  recovery sleep is actually taken. The subject's pattern (5-6 h weekdays, 7-8 h weekends, sustained
  for ~3 years) sits closer to the Simpson design in repetition but closer to Pejovic in depth.
  THIRD SUPPORTING SOURCE, quoted by this paper: "using a five night sleep restriction/two night
  recovery protocol, van Leeuwen and colleagues showed that IL-6 mRNA levels remained elevated after
  two nights of recovery sleep (van Leeuwen et al., 2009)." That is vanleeuwen2009_recovery in this
  shard - so two independent labs found incomplete inflammatory recovery after a weekend.
  ALSO NOTABLE: glucocorticoid sensitivity of monocytes went UP, not down, during restriction. The
  popular "sleep loss causes glucocorticoid resistance" framing is not what these data show.
