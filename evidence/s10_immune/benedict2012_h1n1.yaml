rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Experimental sleep manipulation with a parallel control, a real vaccine, standard hemagglutination-inhibition assay, and follow-up to 52 days - the right design for the durability question. Weaknesses: n = 24 total (11 men, 13 females) split across two conditions, so the sex-stratified day-5 analysis rests on roughly 5-6 men per arm; that is far too small to trust the point estimate, and equally too small for the later-timepoint nulls to exclude modest effects; four timepoints x two sexes invites multiplicity; exposure is one night of total deprivation, not chronic restriction."
funding: "not extracted"
notes: |
  THIS RECORD IS THE MAIN COUNTERWEIGHT TO THE VACCINE ALARM in my evidence set, and it is worth
  stating plainly what it does and does not show.
  WHAT IT SHOWS: losing one night's sleep at the moment of vaccination slows the EARLY antibody
  response (day 5, men), but by day 10 and out to day 52 the deprived group had caught up.
  WHAT IT DOES NOT SHOW: it does not address chronic restriction, and it does not measure the cellular
  memory compartment that lange2011_memory found still altered at 1 year. Antibody titre and
  antigen-specific T-cell frequency are different outcomes, and the two studies may both be right.
  THE THREE-WAY TENSION worth carrying downstream:
    - spiegel2002 (secondhand): day-10 antibody halved, gap GONE by 3-4 weeks -> transient
    - benedict2012 (this record): day-5 deficit in men, gone by day 10, null to day 52 -> transient
    - lange2011_memory: Th cell and IgG1 advantage of sleep still present at 1 YEAR, and 3 wake-group
      participants never reached seroprotection -> durable
  Reasonable synthesis: for a single mistimed night, the humoral deficit is a kinetic delay that
  resolves; the durable signal appears when deprivation is repeated across multiple immunisations
  (Lange's 3-dose design) or when it pushes someone below the seroprotection threshold, at which point
  catching up on sleep cannot retroactively fix it.
  This study is one of the four experimental studies pooled in spiegel2023_vaccine_meta - do not
  double-count.
