rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "TIER TX - CONTEXT ONLY. Cross-sectional, entirely self-reported on both sides, with a 3-month recall window for infections, collected in Norwegian GP waiting rooms during 2020 (a pandemic year, which distorts both infection rates and sleep). The population is people currently seeking medical care, so baseline infection prevalence is ~50% and selection is severe. Strengths: 1,848 unselected consecutive patients, validated insomnia instrument (Bergen Insomnia Scale), modified Poisson so RRs (not ORs) are reported, and - unusually and creditably - the paper reports absolute risks and breaks results out by infection SITE, which is what reveals the respiratory null."
funding: "not extracted"
notes: |
  WHY I KEPT THIS: it is the only record that disaggregates infection by SITE, and doing so overturns
  the headline. The composite 'any infection' result (RR 1.27) is significant, but the RESPIRATORY
  component - the mechanism everyone invokes - is null (RR 1.16, 0.96-1.42). If short sleep impaired
  antiviral host defence in the way the rhinovirus-challenge literature suggests, respiratory
  infection is precisely where the effect should appear.
  U-SHAPE AGAIN: >9 h had higher risk than <6 h for any infection (1.44 vs 1.27) and much higher for
  GI infection (2.33 vs 1.92). Fifth independent dataset in this shard showing the long-sleep arm is
  as bad or worse - a strong collective argument that these observational associations are
  substantially reverse-caused.
  SLEEP PROBLEM vs SLEEP DURATION: chronic insomnia disorder (aRR 1.15, 1.05-1.27) and chronic sleep
  problem (aRR 1.13, 1.03-1.24) were significant for any infection, and chronic sleep problem was the
  strongest predictor of GI infection (aRR 1.59, 1.20-2.11) while insomnia was not (1.30, 0.97-1.73).
  Data collected "in the spring and fall of 2020" - i.e. during COVID-19, when both respiratory
  infection exposure and sleep patterns were highly atypical. Weight accordingly.
shard: "s10_immune"
