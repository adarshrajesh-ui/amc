rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Parallel-group design with a proper control arm (9 men who slept 3 consecutive 8 h nights, in whom all parameters remained unchanged), continuous PSG, and daily 7 a.m. blood draws - good internal validity. Weaknesses: 4 arms of only 9-12 men each (total 40); abstract-only access, so no magnitudes, no SEs, and no check on randomisation or blinding; exposure is a single 2 h night (acute severe deprivation), which is not the target exposure; leukocyte/neutrophil counts are trafficking markers whose link to clinical immune competence is not established."
funding: "not stated in the abstract"
notes: |
  ACCESS: abstract only (Brain Behav Immun 2011, paywalled; no PMC copy found). All content is from
  the PubMed abstract retrieved by efetch. n = 40 recorded as the sum of the four arms: 8 h recovery
  n = 12, nap + 8 h recovery n = 10, 10 h extended recovery n = 9, control n = 9.
  WHY THIS RECORD IS DISPROPORTIONATELY USEFUL despite being abstract-only: it is the only study in my
  set that VARIES THE RECOVERY DOSE while holding the restriction constant. That converts the
  recovery literature from a contradiction into a dose-response:
    - 8 h recovery      -> abnormalities persist (this study; simpson2016; vanleeuwen2009)
    - 10 h recovery or nap + 8 h -> return to baseline (this study; pejovic2013 used 10 h)
  For the target subject, whose weekend sleep is 7-8 h with occasional 10-11 h nights, this predicts
  incomplete weekly normalisation on ordinary weekends and fuller normalisation on the long ones.
  CAUTION: this is a single small study read at abstract level, and "returned nearly to baseline" is
  the authors' phrasing, not a statistical equivalence test.
