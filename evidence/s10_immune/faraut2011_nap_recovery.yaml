    direction_note: "REVERSIBILITY, WITH A DOSE REQUIREMENT - THE MOST ACTIONABLE FINDING IN THE RECOVERY SET. The same abnormality that persisted after 8 h of recovery resolved when recovery was EXTENDED (10 h) or supplemented with a 30-min nap. So 'does it reverse?' depends on the recovery dose, not just on whether a recovery night occurred. This reconciles pejovic2013_recovery (10 h recovery -> full IL-6 normalisation) with simpson2016_repeated_recovery and vanleeuwen2009_recovery (8 h recovery -> incomplete normalisation)."
