rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "TIER TX - CONTEXT ONLY, NOT A PRIMARY CAUSAL ESTIMATE. Cross-sectional: sleep duration and 30-day infection history were reported at the same interview, so a cold could have caused the short sleep rather than the reverse (colds disrupt sleep), and the paper cannot distinguish these. Exposure and outcome are BOTH self-reported, the outcome by recall over 30 days. Strengths: very large (22,726), nationally representative with survey weights, and it reports absolute weighted rates by category, which is why I retained it - it is my best source of population-level ABSOLUTE infection rates. Mean age 46 y, so poorly matched to an 18-year-old."
funding: "not extracted (research letter)"
notes: |
  Sample: "Participants were 22 726 Americans (mean [SE] age, 46.2 [0.3] years) enrolled in the 2005 to
  2012 National Health and Nutrition Examination Surveys (NHANES)". Exposure distribution: 13.6%
  reported <=5 h, 23.0% 6 h, 56.3% 7-8 h, 7.1% >=9 h.
  WHY THIS RECORD EARNS ITS PLACE despite being TX: it is the only source in my set that gives
  population ABSOLUTE 30-day infection rates by sleep-duration category, which the summary needs.
  THE MOST DECISION-RELEVANT FEATURE is the shape, not the size: a clear step at <=5 h and NOTHING at
  6 h. Combined with prather2015_rhinovirus (threshold at ~6 h actigraphic) and patel2012_pneumonia
  (6 h null after full adjustment), three independent datasets place the inflection point around 5-6 h.
  Two other rows in the same table are worth flagging: SLEEP DISTURBANCE ("trouble sleeping" told to a
  physician) was associated with colds at OR 1.27 (1.13-1.42) in Model 2 - a MORE robust association
  than short duration itself. Diagnosed sleep disorder predicted infections at OR 1.88 (1.39-2.53).
  This reproduces the pattern in irwin2016_inflammation_meta: sleep DISTURBANCE beats sleep DURATION
  as a predictor of immune outcomes.
  Note on the infections outcome definition: footnote c in the published table defines it as
  influenza, pneumonia, or ear infections in the past 30 days.
