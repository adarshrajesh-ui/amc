rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Large, well-conducted, prespecified analysis stratified by assessment method (a real strength). Limitations acknowledged by the authors: meta-analysis of observational data is open to residual confounding; many contributing studies did not report adjusted estimates; the vast majority used questionnaires rather than actigraphy/PSG; long-sleep effects may reflect uncontrolled comorbidity. Some publication-bias signal for the sleep-disturbance strand only, removed by trimming |ES|>1.0. Experimental strata are severely underpowered (N as low as 30 across 4 samples for CRP)."
funding: "NIH (Irwin lab, UCLA Cousins Center for Psychoneuroimmunology)"
notes: |
  THIS RECORD IS THE ANSWER TO THE SHARD'S SPECIFIC QUESTION ABOUT WHETHER SHORT SLEEP DURATION
  RAISES INFLAMMATION. The answer is: mostly no, and the paper says so explicitly in its own
  conclusion. Verbatim conclusion: "Sleep disturbance and long sleep duration, but not short sleep
  duration, are associated with increases in markers of systemic inflammation."
  Verbatim abstract result: "Shorter sleep duration, but not the extreme of short sleep, was
  associated with higher levels of CRP (ES .09; 95% CI = .01-.17) but not IL-6 (ES .03; 95% CI:
  -.09 to .14). The extreme of long sleep duration was associated with higher levels of CRP (ES .17;
  95% CI = .01-.34) and IL-6 (ES .11; 95% CI = .02-20). Neither sleep disturbances nor sleep
  duration was associated with TNFa. Neither experimental sleep deprivation nor sleep restriction
  was associated with CRP, IL-6, or TNFa."
  SCORECARD for short sleep across the 12 short-sleep tests in this paper: 2 significant
  (CRP continuous combined ES 0.09; IL-6 continuous objective-only ES 0.29), 10 null. Both
  significant results are small and neither survives the categorical (<7 h vs 7-8 h) specification.
  ABSTRACT/BODY INCONSISTENCY worth flagging to the pooler: the abstract's IL-6 short-sleep figure
  (0.03; -0.09 to 0.14) is the SUBJECTIVE-continuous estimate (9 samples), whereas the body's
  combined subjective+objective continuous estimate is 0.11 (-0.01 to 0.23) and the categorical
  estimate is 0.08 (-0.02 to 0.18). All three are null, so the conclusion is unaffected, but a
  downstream extractor reading only the abstract would record a different number than one reading
  the results section. Both are provided as separate effects above.
  DEFINITIONS: "the reference category for sleep duration was 7-8 h per night in the majority of
  studies. Hence, short sleep was defined as < 7 h per night, and long sleep was defined as > 8 h
  per night." Note this means the <7 h bin lumps a 6.5 h sleeper with a 4 h sleeper, so a threshold
  effect below ~5-6 h could be diluted to null by this binning - a real limitation when applying
  the null to a subject sleeping 5-6 h.
  MECHANISM the authors propose: loss of the normal nocturnal drop in sympathetic outflow ->
  beta-adrenergic signalling -> NF-kB -> proinflammatory gene expression.
  Tier assigned TX rather than T1/T5 because this is a mixed meta-analysis whose observational
  strand dominates; the embedded experimental strata are tiny. Use the strata separately.
  DOUBLE-COUNTING WARNING FOR THE POOLER: this record's four EXPERIMENTAL effects (restriction and
  total-deprivation strata, 5 and 6 samples) pool largely the same primaries as
  ballesio2026_experimental_meta, which searched to March 2025 and has k up to 6 per contrast.
  Do not enter both experimental strands. Prefer ballesio2026 for the experimental question and
  this record for the OBSERVATIONAL duration-inflammation question; the two answer different
  questions and only the observational strand here is non-redundant. cohort_family is set to
  "Irwin2016_inflammation_meta" on every effect to make this record blockable as a unit.
