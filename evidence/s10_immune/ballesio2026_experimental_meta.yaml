rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Up-to-date (searched to March 2025), PRISMA-compliant, 35 experimental studies / 887 participants, random-effects DerSimonian-Laird, and the authors report both all-studies and outlier-excluded models - which is exactly the transparency needed. Weaknesses: the two headline significant results (IL-6 d = 0.42, CRP d = 0.76) BOTH depend on excluding a single study, and the excluded studies were dropped for being outliers rather than for methodological flaws; k = 5 per analysis is very thin; heterogeneity is substantial in most models; the authors note that only 82.8% of studies handled confounders adequately. Small-study/publication bias cannot be excluded with k = 5."
funding: "not extracted"
notes: |
  THIS IS THE BEST AVAILABLE EXPERIMENTAL ANSWER on sleep restriction and inflammation, and it is
  more equivocal than the popular claim.
  What the paper concludes, verbatim from the abstract: "Compared to normal sleep, multiple nights of
  experimental partial sleep deprivation (sleep duration reduced to ~4.30 h for 3+ nights) were
  associated with a significant increase of interleukin-6 [IL-6, k = 5, d = 0.42, [95% CI = 0.11 to
  0.73], p < 0.01] and C-reactive protein [CRP, k = 5, d = 0.76, [95% CI = 0.09 to 1.43], p = 0.03]
  in blood. A single night of total or partial sleep deprivation was not associated with changes in
  inflammation. Results suggest that the upregulation of inflammatory proteins in blood may only
  manifest following persistent p[artial sleep deprivation]."
  So: the DOSE PATTERN is the finding. Acute single nights do nothing measurable; sustained partial
  restriction over roughly a week or more does raise IL-6 and CRP - and even then only after outlier
  exclusion, and only for IL-6 and CRP, not TNF-alpha (which went the other way).
  CRUCIAL SCOPE LIMIT for the transient-vs-durable question: EVERY estimate here is a marker measured
  DURING or immediately after the restriction protocol. Nothing in this meta-analysis speaks to
  whether the elevation persists after recovery sleep. For that see pejovic2013_recovery (IL-6
  normalised) and simpson2016_repeated_recovery (monocyte IL-6 did NOT normalise).
  Contrast with irwin2016_inflammation_meta, which pooled the OBSERVATIONAL literature and found
  short sleep duration NOT associated with CRP/IL-6 categorically. The experimental and observational
  literatures disagree, and the experimental one is the better-identified of the two.
  Reduced-dose detail: multi-night PSD studies restricted sleep to 240 min (CRP analyses) / 276 +/- 53
  min (IL-6 analyses) - i.e. 4-4.6 h, HARSHER than the subject's 5-6 h weekday schedule. Effects at
  5-6 h should be assumed smaller.
