effects:
  - outcome_domain: immune
    outcome_construct: hepatitis_b_clinical_protection_status_6mo
    exposure: {type: per_hour_less_sleep, dose_h: null, referent_h: null, duration_days: 7, contrast_label: "per +1 h actigraphy sleep duration, 7 days around first immunisation; outcome = anti-HBs IgG >=10 mIU/ml at 6 mo"}
    scale: log_or
    unit: null
    value: 1.2613
    se: 0.5435
    ci: [0.1989, 2.3292]
    conversion_formula: "OR 3.53 (1.22-10.27) for BEING PROTECTED per +1 h sleep -> log_or = ln(3.53) = 1.2613; se = (ln 10.27 - ln 1.22)/3.92 = 0.5435. For HARM framing, invert: OR 0.283 (0.097-0.820) of protection per 1 h LESS sleep, i.e. log_or = -1.2613."
    from_figure: false
    inferred_from_ci: true
    direction_note: "positive = BENEFIT of longer sleep (higher odds of being clinically protected). Each additional hour of actigraphic sleep multiplied the odds of clinical protection by 3.53. Equivalently, each hour LESS sleep cut the odds of protection by ~72%."
    covariates: ["age", "sex", "BMI"]
    followup_years: 0.5
    cohort_family: "Pittsburgh_HepB_vaccine"
    quote: "Shorter sleep duration, as measured by actigraphy, was also associated with a decreased likelihood of being clinically protected, controlling for age, sex, and BMI (OR, 3.53; 95% CI, 1.22-10.27, P = 0.02)."
  - outcome_domain: immune
    outcome_construct: hepatitis_b_clinical_protection_status_6mo
    exposure: {type: habitual_short_sleep, dose_h: 5.5, referent_h: 7.5, duration_days: 7, contrast_label: "actigraphy <6 h/night vs >7 h/night (approximate tertiles); outcome = clinically protected at 6 mo"}
    scale: log_or
    unit: null
    value: -2.4079
    se: 1.1590
    ci: [-4.6052, -0.0619]
    conversion_formula: "OR 0.09 (0.01-0.94) -> log_or = ln(0.09) = -2.4079; se = (ln 0.94 - ln 0.01)/3.92 = 1.1590"
    from_figure: false
    inferred_from_ci: true
    direction_note: "negative = HARM. Sleeping <6 h/night around vaccination reduced the odds of achieving clinical protection to 0.09 of the >7 h group (a ~91% reduction in the ODDS of protection). CI is extremely wide (0.01-0.94); the point estimate should not be taken literally."
    covariates: ["age", "sex", "BMI"]
    followup_years: 0.5
    cohort_family: "Pittsburgh_HepB_vaccine"
    quote: "Furthermore, using approximate tertiles of sleep duration to predict protection status, sleeping fewer than 6 hr conferred a significant risk of being unprotected as compared with sleeping more than 7 hr per night (for < 6 hr/night, OR, 0.09; 95% CI, 0.01-0.94; for 6-7 hr/night, OR, 0.36; 95% CI, 0.04-3.67; > 7 hr/night [reference]."
  - outcome_domain: immune
    outcome_construct: hepatitis_b_clinical_protection_status_6mo
    exposure: {type: habitual_short_sleep, dose_h: 6.5, referent_h: 7.5, duration_days: 7, contrast_label: "actigraphy 6-7 h/night vs >7 h/night"}
    scale: log_or
    unit: null
    value: -1.0217
    se: 1.1528
    ci: [-3.2189, 1.3002]
    conversion_formula: "OR 0.36 (0.04-3.67) -> log_or = ln(0.36) = -1.0217; se = (ln 3.67 - ln 0.04)/3.92 = 1.1528"
    from_figure: false
    inferred_from_ci: true
    direction_note: "NULL (CI spans 1). negative would = harm. The 6-7 h category was not significantly worse than >7 h, consistent with a threshold near 6 h rather than a smooth gradient - but the study is far too small to resolve this."
    covariates: ["age", "sex", "BMI"]
    followup_years: 0.5
    cohort_family: "Pittsburgh_HepB_vaccine"
    quote: "for 6-7 hr/night, OR, 0.36; 95% CI, 0.04-3.67; > 7 hr/night [reference]."
