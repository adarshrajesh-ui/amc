    exposure: {type: descriptive, dose_h: null, referent_h: null, duration_days: 7, contrast_label: "diary-reported sleep duration and sleep efficiency vs antibody outcomes (all null)"}
    scale: raw_units
    unit: "beta on log-antibody scale for diary sleep duration"
    value: 0.0
    se: null
    ci: null
    conversion_formula: "No usable coefficient reported; effect recorded as an explicit null with value 0 and se null. Do NOT pool this as a numeric estimate; it is a qualitative null flag."
    from_figure: false
    inferred_from_ci: false
    direction_note: "IMPORTANT NULL / MEASUREMENT WARNING. Self-reported (diary) sleep duration and sleep efficiency were UNRELATED to secondary antibody magnitude in the very same people in whom actigraphic duration WAS related. Objective and self-reported exposure are not interchangeable here."
    covariates: []
    followup_years: null
    cohort_family: "Pittsburgh_HepB_vaccine"
    quote: "Contrary to expectation, there were no associations of actigraphy-derived sleep efficiency, diary-based sleep duration, or subjective sleep quality with magnitude of secondary antibody response."
rob:
  tool: ROBINS-I
  judgement: moderate
  notes: "Exposure objectively measured (actigraphy) and measured BEFORE the outcome, with a hard clinical endpoint (anti-HBs >=10 mIU/ml). But: observational, so confounding by health behaviours remains; actigraphy subgroup only n=104 for the exposure of interest, and protection-status models rest on a small number of unprotected participants, hence the extreme CIs (0.01-0.94). Midlife sample (mean age 50.4 y) - poor age match to an 18-year-old, and vaccine responsiveness declines with age, so the absolute effect in a young man is likely smaller. Multiple sleep metrics tested, only one significant (multiplicity)."
funding: "NIH (HL076852/HL076858 per PMC record); first author supported by an NIH training grant"
notes: |
  Sample: 125 healthy midlife adults given the standard 3-dose hepatitis B series; n = 122 with
  usable secondary antibody data after dropping one >9 SD outlier; actigraphy subgroup n = 104.
  Tertile ns for the actigraphy categorical analysis: <6 h n = 38 (approx), 6-7 h n = 37, >7 h n = 29.
  KEY QUALIFICATION for the downstream model: the significant effects are for the SECONDARY antibody
  response and for clinical protection, not for the primary response. Also note the same paper found
  the association was "slightly attenuated" after adjusting for stress, and diary-based sleep was null.
  DURABILITY NOTE: this is one of the few immune records in this shard with a genuinely durable
  outcome - clinical protection status measured 6 months after the final immunisation. A missed
  seroconversion is not a transient marker change. But the exposure was only one week around each
  vaccination, so it speaks to sleep-at-the-time-of-immunisation, not to 3 years of restriction.
shard: "s10_immune"
