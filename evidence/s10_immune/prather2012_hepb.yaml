    scale: pct_change
    unit: "% change in secondary anti-HBs antibody level per +1 h actigraphic sleep"
    value: 56.0
    se: null
    ci: null
    conversion_formula: "Reported directly as a 56% increase in secondary antibody levels per additional hour, derived by the authors from predicted geometric means. Underlying regression: b = 0.44, SE = 0.22, P < 0.05 on the natural-log antibody scale; exp(0.44) = 1.553, i.e. +55.3%, which reproduces the authors' 56%. No CI reported for the percentage; se left null rather than invented."
    from_figure: false
    inferred_from_ci: false
    direction_note: "positive = BENEFIT of longer sleep. Each additional hour of actigraphic sleep in the week around immunisation raised secondary antibody titre by 56%; each hour LESS lowered it by ~36% (1 - 1/1.56)."
    covariates: ["age", "sex", "BMI", "responder status to initial dose"]
    followup_years: null
    cohort_family: "Pittsburgh_HepB_vaccine"
    quote: "Estimated from predicted geometric means (model adjusted for age [mean = 50.4 yr], sex [female], BMI [mean = 25.3 kg/m2], and responder status [nonresponder]), each additional hr of sleep was associated with a 56% increase in secondary antibody levels."
