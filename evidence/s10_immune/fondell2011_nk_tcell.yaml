rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "TIER TX - CONTEXT ONLY. n = 36 (29 with three consecutive morning draws, 7 with one), cross-sectional, exposure is self-reported sleep on the single night before each draw, and there is no clinical outcome - only ex vivo functional assays whose relationship to real-world infection risk is unestablished. Multiple immune functions tested (NKCA, T cell responses to PHA/influenza/SEA+B, B cell response to PWM) with several exposures (sleep, stress, physical activity), so multiplicity is a serious concern for a study this small. The authors themselves call for replication and for the clinical consequences to be explored."
funding: "not stated in the abstract"
notes: |
  ACCESS: abstract only (Brain Behav Immun 2011, paywalled). All numbers from the PubMed abstract.
  WHY I INCLUDED A SMALL CROSS-SECTIONAL STUDY: because it is the cleanest single demonstration in my
  set that sleep loss does not produce uniform "immunosuppression". In the same 36 people, on the same
  mornings, short prior sleep went with T cell function 49% HIGHER and NK cell activity 30% LOWER.
  Any downstream model that treats "immune competence" as a single latent variable moving in one
  direction will misrepresent this literature.
  This pattern recurs elsewhere in the shard: vanleeuwen2009_recovery found IL-6 and IL-1beta mRNA UP
  but TNF-alpha protein DOWN; ballesio2026_experimental_meta found IL-6/CRP up but TNF-alpha
  non-significantly DOWN; simpson2016_repeated_recovery found glucocorticoid sensitivity UP rather
  than down. Marker-level heterogeneity is the rule, not the exception.
  CONFOUNDING NOTE the abstract itself raises: high perceived stress was independently associated with
  39% higher PHA-induced T cell function (95% CI 0/94%) - almost the same magnitude as the short-sleep
  association - so stress and short sleep are hard to separate here.
shard: "s10_immune"
