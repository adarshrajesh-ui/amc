    direction_note: "positive = HARM. THE ABSOLUTE SCALE OF THE SERIOUS-INFECTION EFFECT: 2.7 extra pneumonias per 1000 person-years, i.e. about 1 extra case per 370 short-sleeping person-years. Even taking the association at face value as causal, a serious respiratory infection attributable to short sleep is a rare event - and this is in 37-57 year-old women, who are at higher baseline pneumonia risk than an 18-year-old man."
