    inferred_from_ci: false
    direction_note: "NON-LINEARITY, IN A PROSPECTIVE DESIGN. positive = HARM. Long sleep (RR 1.38) carries essentially the SAME risk as <=5 h (RR 1.39). This U-shape recurs across pratherleung2016_nhanes (weaker), martinezalbert2025_infection (stronger for long sleep), irwin2016_inflammation_meta (long sleep, not short, associated with CRP) and zhang2023_mr_inflammation. A symmetric U is hard to explain by a mechanism in which sleep loss impairs immunity; it points to illness-driven sleep change and shared confounding."
