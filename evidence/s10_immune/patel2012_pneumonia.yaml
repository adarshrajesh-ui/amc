rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Genuinely prospective with a validated hard outcome (physician diagnosis PLUS chest radiograph), 977 events over 217,500 person-years, >90% follow-up, and healthy-at-baseline restriction (excluded prior pneumonia, cancer, CVD, diabetes, asthma) - which removes the most obvious reverse-causation pathway. Weaknesses: exposure is a SINGLE self-reported question at baseline, so misclassification is certain (the authors report validation rho = 0.79 against a week of diaries, and note self-report OVERestimates true sleep, biasing the effect toward the null); residual confounding by unmeasured illness remains, evidenced by the symmetric long-sleep risk; all-female, 37-57 y, mostly white nurses - poor transportability to an 18-year-old man."
funding: "not extracted"
notes: |
  Sample construction, verbatim: "Thus, 56,953 women were included in this analysis. The distribution
  of habitual sleep duration was 5.2%, 23.3%, 42.7%, 23.7%, and 5.0% for <= 5, 6, 7, 8, and >= 9 h,
  respectively." 977 pneumonia cases over 217,500 person-years.
  WHY THIS RECORD MATTERS DESPITE THE POOR AGE MATCH: it is the only prospective study in my set with
  a biologically verified SERIOUS infection outcome and enough events to estimate it precisely, and it
  supplies the absolute rate needed to put the relative risks in perspective (2.7 extra pneumonias per
  1000 person-years).
  MEASUREMENT-BIAS NOTE THE AUTHORS MAKE THEMSELVES, and it cuts in the harmful direction: "objective
  measurement of sleep habits suggests individuals typically overestimate their actual sleep time, and
  the less one sleeps, the greater the overestimate. ... As a result of this reporting bias, the effect
  of reduced sleep on pneumonia risk would tend to be underestimated by relying on self-report."
  This is the same point that makes the objective-vs-self-report gap in spiegel2023_vaccine_meta and
  prather2015_rhinovirus so important for dose calibration.
  THRESHOLD PATTERN: only <=5 h survived full adjustment; 6 h and 7 h did not. Consistent with
  pratherleung2016_nhanes (nothing at 6 h) and prather2015_rhinovirus (threshold at ~6 h actigraphic).
shard: "s10_immune"
