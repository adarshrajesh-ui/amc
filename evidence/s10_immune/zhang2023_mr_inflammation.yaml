rob:
  tool: MR-STROBE
  judgement: moderate
  notes: "Two-sample MR with inverse-variance-weighted primary analysis plus multiple sensitivity analyses reported as consistent - the appropriate design for asking about causal direction, and MR is the only tool here that can. Weaknesses: MR estimates are on genetically-predicted lifetime exposure scales that do not translate into 'hours of sleep' or 'mg/L of CRP', so the coefficients (0.017, -0.006, 0.006) are NOT interpretable as clinical magnitudes and I have deliberately not converted them; the CIs are extremely tight against zero (IL-6 lower bound 0.000), so these are marginal findings; the accompanying quantitative synthesis of 44 publications is a separate observational meta-analysis subject to all the usual confounding; horizontal pleiotropy cannot be fully excluded; abstract-only access. There is also a published Comment on this paper (Sleep 2023;46(10):zsad223) which I did not retrieve."
funding: "not stated in the abstract"
notes: |
  ACCESS: abstract only (Sleep 2023, paywalled). All numbers from the PubMed abstract.
  THIS IS THE ONLY TIER-3 (MENDELIAN RANDOMIZATION) RECORD IN MY SHARD, and it is included precisely
  because it addresses the question no observational study can: which way does the arrow point?
  The answer it gives is uncomfortable for the standard story. The MR arm found evidence that
  inflammation causes altered sleep duration, not the reverse - and that higher CRP causes LONGER
  sleep and LESS short sleep.
  A CAVEAT I WANT ON THE RECORD, because it would be easy to overclaim in the other direction: absence
  of an MR effect of short sleep on inflammation was not, per the abstract, formally tested in the
  reported direction with the same rigour; the abstract reports the inflammation->sleep direction. So
  this record supports "the observational association is substantially reverse-caused" more strongly
  than it supports "short sleep has no causal inflammatory effect". Those are different claims.
  A published Comment exists on this paper (doi 10.1093/sleep/zsad223) which may qualify these
  conclusions; I did not retrieve it and flag that as a known gap in my reading.
