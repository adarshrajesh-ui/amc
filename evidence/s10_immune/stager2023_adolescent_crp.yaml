    se: 0.358
    ci: [-0.842, 0.562]
    conversion_formula: "From the reported adjusted means: Group 1 'shortest' M = 3.21, SE = 0.29; Group 2 'stable recommended' M = 3.35, SE = 0.21. Difference = 3.21 - 3.35 = -0.14 mg/L. se of difference = sqrt(0.29^2 + 0.21^2) = 0.358; ci = -0.14 +/- 1.96*0.358. DERIVED by me from the published group means and SEs; the paper does not report this contrast directly, because it was not significant."
    from_figure: false
    inferred_from_ci: false
    direction_note: "THE MOST IMPORTANT NULL IN THIS SHARD FOR THE TARGET SUBJECT, and it points the WRONG WAY for the harm hypothesis. positive would = harm (higher adult CRP). Adolescents on the SHORTEST sleep trajectory had adult CRP of 3.21 mg/L, slightly LOWER than the stable-recommended group's 3.35 mg/L, and the CI comfortably includes zero. In the single best age-matched longitudinal dataset available, chronically short adolescent sleep did NOT produce elevated systemic inflammation in young adulthood."
    covariates: ["race", "and see paper for model"]
    followup_years: 14.0
    cohort_family: "Add_Health"
    quote: "Trajectory group predicted Wave V CRP (F(2, 127)= 3.80, p <0.05; Table 2). Individuals in Group 3, 'varied' (M=5.23 SE=0.68) had significantly higher CRP as compared with individuals in Group 1, 'shortest' (M=3.21 SE=0.29; t(2, 127)=2.72, p <0.01), and group 2, 'stable recommended' (M=3.35 SE=0.21; t(2, 127)=-2.60, p <0.05; Figure 2a)."
