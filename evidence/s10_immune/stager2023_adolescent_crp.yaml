    conversion_formula: "Group 3 'varied' M = 5.23, SE = 0.68 vs Group 2 'stable recommended' M = 3.35, SE = 0.21. Difference = 1.88 mg/L; se = sqrt(0.68^2 + 0.21^2) = 0.712; ci = 1.88 +/- 1.96*0.712. The paper reports this contrast as significant (t = -2.60, p < .05)."
    from_figure: false
    inferred_from_ci: false
    direction_note: "positive = higher CRP, but the exposure is LONG/INCREASING sleep, not short sleep. The only trajectory group with elevated adult CRP was the one whose sleep rose ABOVE recommended levels. Again the U-shape: whatever links sleep duration to CRP in observational data, it is not a simple 'less sleep = more inflammation' gradient. This group is only 8% of the sample (n approximately 190) and CRP is highly skewed, so treat with caution."
    covariates: ["race"]
    followup_years: 14.0
    cohort_family: "Add_Health"
    quote: "Regardless of race, individuals with patterns of sleep duration increasing to above what is recommended across waves (Group 3) had elevated CRP."
rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Design strengths that make the null informative rather than merely uninformative: genuinely longitudinal (5 waves, adolescence to adulthood, ~14 years), exposure measured repeatedly at exactly the target ages (grades 7-12, mean age 15.7 at Wave I), and the OUTCOME IS OBJECTIVELY MEASURED CRP, not self-reported. Weaknesses: exposure is self-reported sleep duration; group-based trajectory modelling imposes discrete classes on continuous data, and the class labels ('shortest', 'varied') hide the actual hour values, which the abstract does not state; the reported F test df (2, 127) is far smaller than N = 2,399, indicating the CRP analysis ran on a much smaller subsample - so the null may simply be underpowered; CRP was measured once; residual confounding by adiposity is likely given the parallel WtHR/BMI findings."
funding: "not extracted"
notes: |
  THIS IS THE CLOSEST THING IN MY EVIDENCE SET TO THE ACTUAL QUESTION ASKED - does short sleep across
  adolescence leave a durable inflammatory mark in young adulthood? - AND THE ANSWER IS NO.
  Sample: "Participants (N=2,399; M age =15.7; 40.2% male; 79.2% White, 20.8% Black) from the Add
  Health database who provided sleep data in Waves I-IV. Grades 7-12 at Wave I."
  Trajectories: "Three sleep trajectories emerged: Group 1 'shortest' (24.4%), Group 2 'stable
  recommended' (67.6%), and Group 3 'varied' (8%)."
  IMPORTANT CAVEAT ON MY OWN NULL: the F-test degrees of freedom for the CRP model are (2, 127),
  implying the CRP analysis used roughly 130 people, not 2,399. A null on n ~ 130 for a marker as
  noisy as CRP is weak evidence of absence. My derived CI (-0.84 to +0.56 mg/L) is the honest
  statement: it excludes a large durable CRP elevation but not a small one.
  ONE MORE CAUTION about the paper's own abstract: it says "Poor longitudinal sleep predicted elevated
  CRP and WtHR", which reads as supporting the harm hypothesis. But the CRP elevation was in the
  'varied'/increasing group, NOT the 'shortest' group - the paper's own numbers contradict the natural
  reading of its abstract. This is exactly the kind of claim-vs-data gap the task asked me to catch.
  A significant health disparity finding worth noting though outside my domain: "Black individuals and
  older individuals were more likely to be in Group 1 compared with Group 2."
