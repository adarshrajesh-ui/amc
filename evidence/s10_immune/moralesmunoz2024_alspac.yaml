rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Large well-characterised birth cohort (ALSPAC), 12,394 children for trajectory modelling, 3,962 for the outcome analyses, prospectively measured exposure at 7 timepoints and objectively assayed inflammatory markers - a strong design. Weaknesses for MY purposes: the exposure window is infancy through age 7, which is not the target subject's exposure; parent-reported sleep in early childhood; mediation analysis on observational data cannot establish that IL-6 is causal in the pathway; attrition from 12,394 to 3,962 is substantial and likely non-random; abstract-only access, so I could not check the mediation model specification or the proportion of effect mediated."
funding: "See paper; one author reports NIHR Oxford Health Biomedical Research Centre support and various industry fees outside the submitted work."
notes: |
  ACCESS: abstract only (retrieved via PubMed efetch). A PMC copy exists (PMC11079792) but I did not
  retrieve the full text, so I have no table values and record only what the abstract states.
  RELEVANCE, STATED HONESTLY: this record is included because it is the ONLY prospective evidence I
  found that a sustained short-sleep pattern in the young leaves a measurable inflammatory trace
  years later (IL-6 at age 9). That is directly on point for the durable-vs-transient question.
  BUT THREE THINGS LIMIT IT SHARPLY:
  1. Exposure window is 6 months to 7 years - early childhood, when sleep architecture and immune
     development differ fundamentally from age 16-19. It is NOT evidence about adolescent restriction.
  2. The mediated effect is tiny (0.003) relative to a total association of OR 2.50-3.64. Inflammation
     is a minor pathway even in the authors' own model.
  3. CRP - the marker most used to argue that short sleep causes systemic inflammation - was null at
     BOTH 9 and 15 years.
  So this cuts both ways and should not be read as vindication of the durable-inflammation story.
shard: "s10_immune"
