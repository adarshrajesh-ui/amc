    quote: "In the antibody titer measurement 10 days after vaccination, in which the antibody increased logarithmically, the average antibody titer of the sleep-deprived group was less than half of that of the normal sleep group. However, there was no significant difference in the antibody titers between the two groups 3-4 weeks after vaccination. [Kim ES & Oh CE, Kosin Med J 2022;37:27-36, describing Spiegel et al. 2002]"
rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomised parallel-group lab restriction protocol with an objectively enforced sleep schedule and a hard immunological endpoint - the strongest design available in this domain. BUT: n = 25 total (11 restricted vs 14 control per one secondary source), all male, single site, and I could not read the primary report, so I cannot check allocation concealment, whether antibody assays were blinded, or the exact group means. The design also confounds restriction with subsequent 12 h recovery sleep in the restricted arm, which is precisely why the 3-4 week null is informative but not cleanly attributable."
funding: "not verifiable from the sources I could retrieve"
notes: |
  ACCESS LIMITATION, stated plainly: this is the single most-cited study in the sleep-and-vaccination
  literature and I could NOT retrieve its full text. It is a two-page JAMA research letter, paywalled,
  with no PubMed abstract and no PMC copy; a WebFetch of the JAMA page timed out. Everything above is
  secondhand from two sources that had the paper, one of which (Curr Biol 2023) is by the same first
  author and obtained individual-participant data from her own study. I have therefore set
  access_tier: secondhand and se: null throughout. The downstream model should widen uncertainty
  accordingly and should NOT treat "-50%" as a measured effect size.
  PROTOCOL as described in Spiegel 2023 Table 1: "|25|18-27|25/0|4 nights of PSD (4h in bed) before
  vaccination followed by 2 nights of PSD and 7 nights of 12h in bed vs. 8h in bed|Influenza,
  trivalent types A and B|1|Anti-influenza Ab (IgG)|0, 10 and 21-30days|*t= 10days and overall|"
  A second secondary source (Kim & Oh, Kosin Med J 2022) gives group sizes as 11 restricted vs 14
  control and mean age 23 y, verbatim: "In 25 young men with an average age of 23 years, one group of
  11 participants slept only 4 hours during the first 6 days, and the other group of 14 participants
  slept 7.5-8.5 hours as usual. Influenza vaccine was administered on the morning of the 4th day."
  This study's individual effect size is one of the four experimental studies pooled in
  spiegel2023_vaccine_meta (objective pooled ES 0.79, 95% CI 0.40-1.18), so the downstream pooler
  should use the meta-analytic record rather than double-counting this one.
