    outcome_construct: antigen_specific_th_cell_frequency
    exposure: {type: total_deprivation, dose_h: 0, referent_h: 8, duration_days: 1, contrast_label: "one night awake vs asleep after each of 3 hepatitis A vaccinations (weeks 0, 8, 16); antigen-specific Th cells followed 1 year"}
