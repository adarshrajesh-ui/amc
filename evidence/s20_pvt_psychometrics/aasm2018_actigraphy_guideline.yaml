  notes: "Formal AASM clinical practice guideline developed by a commissioned expert task force using GRADE, based on an accompanying systematic review and meta-analysis (Smith et al., J Clin Sleep Med 2018;14(7):1209-1230, DOI 10.5664/jcsm.7228, PMID 29991438, PMCID PMC6040804). Contributes no effect estimate. THE CRITICAL SCOPE LIMITATION FOR OUR USE, in the guideline's own words: 'The prior practice parameters established the validity of actigraphy to assess sleep in normal, healthy adult populations, and therefore, this guideline does not address the use of actigraphy to assess normal sleep.' Every recommendation is framed for PATIENTS with suspected or diagnosed sleep disorders. It also explicitly excludes consumer wearables. Using it to justify a night count in a healthy self-experiment is therefore an extrapolation and must be labelled as one."
