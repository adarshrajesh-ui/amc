notes: |
  ===== PART C9: WHAT THE GUIDELINE ACTUALLY SAYS, AND WHAT IT DOES NOT =====
  Full text obtained from PMC (PMC6040807) via the rendered-HTML route.

  MY BRIEF ASKED FOR "the SRS/AASM consensus on how many nights of actigraphy or diary are needed to
  reliably estimate habitual sleep duration in an individual." REPORTING REALITY (instruction 4): that
  consensus statement DOES NOT EXIST in the form the brief assumes. What exists is:
    * a duration RANGE in the AASM clinical practice guideline, justified by BILLING CODES rather than
      by reliability analysis; and
    * a separate empirical psychometric literature (Acebo 1999, Knutson 2007, Aili 2017) that answers
      the reliability question directly.
  The AASM guideline additionally disclaims the exact use case we have: it says it "does not address
  the use of actigraphy to assess normal sleep."

  VERBATIM QUOTES
  ---------------
  The only duration statement in the guideline:
  "The recommended duration of actigraphy recording is a minimum of 72 hours to 14 consecutive days, in
  accordance with the Current Procedural Terminology (CPT) coding requirements."

  The billing basis, restated elsewhere in the document:
  "as a separate service using a stand-alone actigraphy device, the code for actigraphy (CPT 95803)
  specifically requires a minimum of 72 hours of testing."

  The scope disclaimer that limits our use of this record:
  "The prior practice parameters established the validity of actigraphy to assess sleep in normal,
  healthy adult populations, and therefore, this guideline does not address the use of actigraphy to
  assess normal sleep."
  "The review focused exclusively on clinical grade devices approved by the FDA as an actigraphy device
  or equivalent device that uses an accelerometer to measure limb activity associated with movement
  during sleep for physiologic applications. The review did not cover consumer wearable devices, or
  other non-prescription devices directly marketed to consumers, which are beyond the scope of this
  clinical practice guideline."

  THE MOST USEFUL SUBSTANTIVE FINDING FOR OUR PROTOCOL - actigraphy is NOT redundant with a diary:
  "When comparing TST estimated by actigraphy to sleep logs in the 2-week period prior to the MSLT, the
  study demonstrated a clinically significant large mean difference. When comparing TST recorded by
  actigraphy to PSG on the night before the MSLT, the study demonstrated a clinically significant small
  mean difference; however, the range of possible differences exceeded the clinical significance
  threshold. These data, in conjunction with supporting evidence from other sleep disorders described in
  this clinical practice guideline demonstrate that actigraphy provides objective data that are unique
  from patient-reported data."
  (The magnitude is characterised only as "a clinically significant large mean difference" - no number
  is given in the guideline text, so no numeric effect is extracted for it here. The systematic review,
  DOI 10.5664/jcsm.7228, would contain the number; I did not retrieve it.)

  Establishing habitual timing is named as a legitimate use:
  "Additionally, actigraphy may be useful to establish habitual sleep-wake timing in the evaluation of
  patients with complaints of hypersomnia, which may reveal other sleep disorders such as insufficient
  sleep syndrome and CRSWDs, and may impact the interpretation of the MSLT."
  "We suggest that clinicians use actigraphy to monitor total sleep time prior to testing with the
  Multiple Sleep Latency Test in adult and pediatric patients with suspected central disorders of
  hypersomnolence. (Conditional)"

  Adolescent applicability of the pediatric recommendations:
  "Studies reviewed included young children and adolescents ranging in age from 3-19 years old."
  (Recommendation 2, pediatric insomnia) and "Studies reviewed included patients ranging in age from
  2-21 years old." (Recommendation 4, pediatric CRSWD).

  HOW TO USE THIS IN THE REPORT
  -----------------------------
  Cite the AASM guideline for the UPPER end of its range (14 consecutive days) and say why: the
  guideline's own 72-hour floor is a reimbursement artefact, and the independent psychometric evidence
  says 3 nights is far too few for DURATION specifically (Acebo 1999: 1-2 night aggregates "poor for
  all measures"; Aili 2017: R = 0.70 for TST not reached even at 7 nights; Knutson 2007 variance
  components imply 13 nights for R = 0.80). All four sources are simultaneously satisfied by
  "14 consecutive nights of actigraphy with a concurrent daily diary", which is the specification I
  carry into protocol_basis.md. Do NOT present 72 hours as an AASM-endorsed sufficient duration for
  estimating habitual sleep need - that would be a misreading of a CPT coding requirement.
