  # ---------- Table 4: raw within-subject differences and SDs (the power-calculation inputs) ----------
  - outcome_domain: cognition
    outcome_construct: pvt_mean_reciprocal_rt_within_subject_difference
    exposure: {type: chronic_restriction, dose_h: 4, referent_h: 10, duration_days: 1, contrast_label: "1 night 4h TIB (day R1) vs day after baseline night 2 (10h TIB); 10-min PVT; daily mean of 3 bouts at 12:00/16:00/20:00"}
    scale: raw_units
    unit: "s^-1 (mean 1/RT, i.e. reciprocal response time in inverse seconds)"
    value: -0.125
    se: 0.0323
    ci: [-0.188, -0.063]
    conversion_formula: "Table 4 published difference (SDP-NSDP) with nonparametric bootstrap CI; se = (0.188-0.063)/3.92 = 0.0319 (reported 0.0323 from se = SD_diff/sqrt(n) = 0.212/sqrt(43) = 0.0323)"
    from_figure: false
    inferred_from_ci: false
    direction_note: "negative = slower responding (lower response speed) = worse after restriction. THE COMPANION SD OF THE WITHIN-SUBJECT DIFFERENCE IS 0.212 s^-1 (95% CI 0.162-0.254) - this is the sigma_d used for the n-of-1 power calculation."
    covariates: []
    followup_years: null
    cohort_family: "UPenn_Dinges_TSD_PSD"
    quote: "Table 4 - Retrospective power calculation for the outcomes mean 1/RT and number of lapses ... 1 Night of 4 h TIB ... Difference SDP - NSDP [1/s] -0.125 (-0.188; -0.063) ... Standard Deviation SDP - NSDP [1/s] 0.212 (0.162; 0.254) ... Effect Size 0.59 (0.32; 0.92) ... Required Sample Size [N] 25 (12; 81)"
  - outcome_domain: cognition
