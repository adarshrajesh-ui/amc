    unit: "d_z (paired)"
    value: 0.88
    se: 0.112
    ci: [0.69, 1.13]
    conversion_formula: "published d_z; se = (1.13-0.69)/3.92 = 0.112"
    from_figure: false
    inferred_from_ci: true
    direction_note: "positive = worse. RANK 8 of 10 under PSD - lapse probability was NOT more sensitive than raw lapse count."
    covariates: []
    followup_years: null
    cohort_family: "UPenn_Dinges_TSD_PSD"
    quote: "Lapse Probability 0.88 (0.69; 1.13)"
  - outcome_domain: cognition
