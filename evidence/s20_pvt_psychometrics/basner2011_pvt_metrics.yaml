effects:
  # ---------- PART A1: rank-ordered sensitivity of the 10 PVT metrics ----------
  - outcome_domain: cognition
    outcome_construct: pvt_mean_reciprocal_rt_response_speed
    exposure: {type: chronic_restriction, dose_h: 4, referent_h: 10, duration_days: 5, contrast_label: "5 nights 4h TIB (day after R5) vs day after baseline night 2 (10h TIB); 10-min PVT"}
    scale: cohens_d
    unit: "d_z (paired: mean within-subject difference / SD of within-subject differences)"
    value: 1.21
    se: 0.166
    ci: [0.94, 1.59]
    conversion_formula: "value as published (d_z). se approximated from the published nonparametric bootstrap CI: se = (1.59-0.94)/3.92 = 0.166"
    from_figure: false
    inferred_from_ci: true
    direction_note: "positive = larger deficit; sign of mean 1/RT effect sizes was multiplied by -1 by the authors so that larger = worse. RANK 1 of 10 metrics under chronic partial sleep deprivation."
    covariates: []
    followup_years: null
    cohort_family: "UPenn_Dinges_TSD_PSD"
    quote: "Effect sizes were high for both TSD (1.59-1.94) and PSD (0.88-1.21) for PVT metrics related to lapses and to measures of psychomotor speed, i.e., mean 1/RT (response time) and mean slowest 10% 1/RT. In contrast, PVT mean and median RT outcomes scored low to moderate effect sizes influenced by extreme values."
  - outcome_domain: cognition
    outcome_construct: pvt_lapses_500ms
    exposure: {type: chronic_restriction, dose_h: 4, referent_h: 10, duration_days: 5, contrast_label: "5 nights 4h TIB (day after R5) vs day after baseline night 2 (10h TIB); 10-min PVT"}
    scale: cohens_d
    unit: "d_z (paired)"
    value: 0.91
    se: 0.120
    ci: [0.71, 1.18]
    conversion_formula: "published d_z; se = (1.18-0.71)/3.92 = 0.120"
    from_figure: false
    inferred_from_ci: true
    direction_note: "positive = more lapses = worse. RANK 5 of 10 metrics under PSD (Table 2)."
    covariates: []
    followup_years: null
    cohort_family: "UPenn_Dinges_TSD_PSD"
    quote: "Table 2 - Rank order of effect sizes of 10 PVT outcome metrics for the 10-min PVT in both acute total and chronic partial sleep deprivation ... Chronic Partial Sleep Deprivation ... Number of Lapses 0.91 (0.71; 1.18)"
  - outcome_domain: cognition
    outcome_construct: pvt_lapse_probability
