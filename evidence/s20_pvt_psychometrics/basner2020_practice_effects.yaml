rob:
  tool: none
  judgement: na
  notes: "Methodological/normative study, not an intervention trial, so RoB2 does not apply. Design strength: each of 46 subjects performed all 15 battery versions in a randomised but balanced order, which is what allows practice and stimulus-set effects to be disentangled. Weaknesses for this shard: mean age 32.5 (range 25-54) so adolescent_match poor_midlife; the PVT here is the ~3-min Cognition-battery PVT embedded in a 10-test battery, so carryover fatigue from the other 9 tests is present and the practice estimate is not for a stand-alone PVT; the metrics are 'PVT Slowness (10 - 1/s)' and 'PVT Accuracy (%)', not lapse count."
funding: "Not extracted from the retrieved manuscript text; NASA-related (Cognition was developed for spaceflight)."
notes: |
  THIS IS THE RECORD THAT SETTLES THE PRACTICE-EFFECT / WASHOUT QUESTION QUANTITATIVELY, and it
  partially CONTRADICTS the Dinges-group review claim (repeated verbatim in both basner2011 papers)
  that "PVT performance does not improve as a function of repeated administration". Measured
  directly across 15 administrations in the same 46 people:
    - PVT response SPEED: standardized practice beta = 0.02 (SE 0.03), P = 0.44 -> genuinely null.
      This is the strongest available justification for using mean 1/RT as the n-of-1 primary
      outcome: it needs essentially NO practice-effect washout.
    - PVT ACCURACY (the lapse side): standardized beta = 0.09 (SE 0.04), P = 0.02 -> small but real.
      A lapse-based primary outcome WOULD need a run-in and/or an explicit practice term in the model.
    - Every other test in the battery had a significant speed practice effect, with standardized
      effects >= 0.31 for BART, ERT, DSST and VOLT and <= 0.19 for the rest.

  Direct quote on the residual practice effect and its implication for choosing outcomes:
  "Thus, effect sizes are small to negligible for most accuracy domains while notable for four speed
  domains. That effects were stronger for speed than accuracy would suggest caution in using speed
  measures as primary outcome in treatment studies, unless a control group is included with the same
  number of repeated measures or correction algorithms as the ones derived in this study are
  available." Note that this general caution does NOT apply to the PVT, which is the exception.

  PRACTICAL CONSEQUENCE FOR THE PROTOCOL. Because the practice slope is logarithmic (steepest early)
  and the PVT-speed slope is null while PVT-accuracy is small-but-real, the run-in requirement is
  driven by (a) the accuracy metric, and (b) Thompson 2022's finding of a significant systematic
  mean-RT shift between sessions 1 and 2. protocol_basis.md therefore specifies a >=5-session
  familiarisation run-in whose data are DISCARDED, plus a loge(session) practice covariate retained
  in the analysis model as insurance. That is a design choice I am making from these two records; it
  is not itself an extracted number.
shard: "s20_pvt_psychometrics"
