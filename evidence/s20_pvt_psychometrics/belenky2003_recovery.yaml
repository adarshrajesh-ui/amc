notes: |
  ===== PART B7: THE 3-NIGHT RECOVERY NULL =====
  Belenky 2003 is the canonical demonstration that PVT deficits from mild-to-moderate chronic
  restriction do NOT resolve over three nights of normal (8 h) sleep. It is the necessary complement
  to Pejovic 2013 (which used 10 h recovery nights and found the same non-recovery of PVT while
  subjective and physiological sleepiness normalised).

  ACCESS LIMITATION - STATED PLAINLY: this record is ABSTRACT ONLY. The J Sleep Res full text is
  paywalled; Unpaywall reports is_oa = False and no repository copy was found. All numbers below are
  verbatim from the PubMed abstract. No effect sizes, SDs, or CIs are available, so both effects are
  recorded as qualitative nulls with se: null.

  VERBATIM QUOTES
  ---------------
  Design:
  "Sixty-six normal volunteers spent either 3 (n = 18), 5 (n= 16), 7 (n = 16), or 9 h (n = 16) daily
  time in bed (TIB) for 7 days (restriction/augmentation) followed by 3 days with 8 h daily TIB
  (recovery)."

  Restriction phase - the adaptation/plateau pattern that makes self-assessment unreliable:
  "In the 3-h group, speed (mean and fastest 10% of responses) on the psychomotor vigilance task (PVT)
  declined, and PVT lapses (reaction times greater than 500 ms) increased steadily across the 7 days
  of sleep restriction. In the 7- and 5-h groups speed initially declined, then appeared to stabilize
  at a reduced level; lapses were increased only in the 5-h group. In the 9-h group, speed and lapses
  remained at baseline levels."

  THE RECOVERY NULL (the key sentence for the report):
  "During recovery, PVT speed in the 7- and 5-h groups (and lapses in the 5-h group) remained at the
  stable, but reduced levels seen during the last days of the experimental phase, with no evidence of
  recovery. Speed and lapses in the 3-h group recovered rapidly following the first night of recovery
  sleep; however, recovery was incomplete with speed and lapses stabilizing at a level comparable
  with the 7- and 5-h groups. Performance in the 9-h group remained at baseline levels during the
  recovery phase."

  Authors' interpretation - directly relevant to the "you cannot tell" claim:
  "These results suggest that the brain adapts to chronic sleep restriction. In mild to moderate sleep
  restriction this adaptation is sufficient to stabilize performance, although at a reduced level.
  These adaptive changes are hypothesized to restrict brain operational capacity and to persist for
  several days after normal sleep duration is restored, delaying recovery."

  WHY THIS MATTERS FOR THE N-OF-1 PROTOCOL DESIGN (Part C)
  -------------------------------------------------------
  This is the single most important CARRYOVER result in my shard. In a crossover n-of-1 design,
  Belenky implies that a restriction period contaminates the FOLLOWING period for at least 3 nights,
  and possibly longer, because 3 nights of 8 h TIB did not restore performance. Consequences:
    * A washout of 3 nights at 8 h TIB is DEMONSTRABLY INSUFFICIENT.
    * The design must therefore either (a) use long washouts (>= 5-7 nights at the subject's ad-lib
      duration, per Kitamura 2016's 4-day-to-asymptote result for only ~1 h of debt), or
    * (b) abandon the assumption of no carryover and instead FIT period/carryover terms explicitly
      (CENT 2015 checklist item 12c requires exactly this), or
    * (c) counterbalance order so that carryover is orthogonal to condition.
  It also means the 9 h TIB arm is the only arm that stayed at baseline, which supports using an
  EXTENSION arm rather than a "normal" arm as the comparator.

  RELATION TO THE OTHER RECOVERY RECORDS
  --------------------------------------
    Belenky 2003 : 3 nights x 8 h TIB      -> no recovery of PVT speed (5 h and 7 h arms)
    Pejovic 2013 : 2 nights x 10 h TIB     -> no recovery of PVT lapses; SSS and MSLT over-recover
    Banks 2010   : 1 night x up to 10 h TIB -> recovery incomplete even at the maximum dose
    Cohen 2010   : 10 h sleep every cycle  -> morning performance looks normal, late-day does not
    Kitamura 2016: 12 h TIB x 9 days       -> ~1 h of debt needs ~4 days of extended sleep to clear
  Four independent labs, four different recovery doses, same conclusion.
