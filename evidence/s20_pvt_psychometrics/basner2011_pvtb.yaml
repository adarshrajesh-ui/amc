rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Same 74-subject TSD/PSD dataset as basner2011_pvt_metrics - the two records are NOT independent and must not be pooled as separate studies. Authors themselves flag a confound: the two tests ran on different hardware with different ISI ranges and subjects knew the durations differed, and test order was not counterbalanced in a crossover; they state that 'More studies using the same hardware for both tests and counter-balancing the order of test administration in a cross-over fashion are needed'. Effect sizes for individual PVT-B metrics are reported only in Figure 2, so only the values restated in the text/abstract are extractable."
funding: "Not stated in the retrieved manuscript text; NASA-related (the PVT-B is the basis of the ISS 'Reaction Self Test')."
notes: |
  REALITY CHECK vs THE TASK BRIEF. The task asked for "the correlation and the effect-size
  attenuation". The attenuation is reported (22.7% mean, 6.9-67.8% range). A CORRELATION
  COEFFICIENT BETWEEN PVT-B AND PVT IS NOT REPORTED ANYWHERE IN THIS PAPER. The authors validated
  concordance with (a) effect-size comparison and (b) mixed-model ANOVA version x time interaction
  tests over 1,656 paired administrations. I did not fabricate an r. The nearest published
  PVT-shortening correlation I could verify is in Grant et al. 2017 (grant2017_pvt3_smartphone),
  which does report significant lapse-count correlations between a 3-min smartphone/tablet PVT
  and a 10-min laptop PVT.

  PVT-B DESIGN SPECIFICATION (needed to build the protocol):
    - duration 3 min (70% shorter than the 10-min PVT)
    - inter-stimulus interval 1-4 s (vs the standard 2-10 s). Because ISIs were shortened, the
      SAMPLING RATE only fell 32.4% even though duration fell 70%.
    - lapse threshold must be lowered from 500 ms to 355 ms, otherwise PVT-B under-counts lapses
      and shows genuine differential insensitivity to sleep loss (version x time interaction
      p<0.0001 with the 500 ms threshold; p=0.3531 with 355 ms in PSD, p=0.1554 in TSD).
    - recommended primary outcomes for the PVT-B: mean 1/RT and slowest 10% 1/RT (the only two
      metrics that retained LARGE Cohen effect sizes under chronic partial sleep deprivation),
      plus the performance score (= 100% minus lapses+false starts over valid stimuli+false starts)
      which lost the least sensitivity (6.9%) relative to the 10-min PVT.
    - PVT-B responses are systematically FASTER, with MORE false starts and FEWER 500-ms lapses
      than the 10-min PVT (all p<0.01), so PVT-B and PVT scores are NOT interchangeable in
      absolute terms - only within-subject change is comparable.
  Verbatim: "the utility of the PVT-B depends on the outcome metric" and, on PSD, "On the PVT-B,
  only mean 1/RT and slowest 10% 1/RT still scored large effect sizes. The effect sizes of lapses
  (both 500 ms and 355 ms definitions) and the performance score dropped to medium (>0.5 and
  <0.8), while the effect size of fastest 10% RT dropped to low (>0.2 and <0.5)."

  Also carries the group's (secondhand, chapter-cited) practice-effect claim: "An advantage the
  PVT has over nearly all other cognitive tests is that it is virtually unaffected by either
  aptitude (inter-individual variability) or learning (intra-subject variability) - that is, PVT
  performance does not improve as a function of repeated administration. The test has high
  reliability, with intra-class correlations measuring test-retest reliability above 0.8."
  For a directly measured test of that claim see basner2020_practice_effects.
