rob:
  tool: none
  judgement: na
  notes: "Software validation/engineering study, not a clinical or behavioural trial - RoB2 inapplicable. Abstract-only access. It validates TIMING ACCURACY against the PVT-192, not sensitivity to sleep loss (for that, see basner2011_pvt_metrics and grant2017_pvt3_smartphone). No human sample size reported in the abstract, hence n = null. Developed and published by the US Army BHSAI; the download URL was live as published in 2014 and I did NOT verify that it still resolves in 2026."
funding: "US Army Medical Research and Materiel Command / Telemedicine and Advanced Technology Research Center (BHSAI)."
notes: |
  PART A5 ANSWER, part 1 of 3. This is the primary freely available, validated, timing-characterised
  PVT implementation. Two operationally critical findings for a self-administered protocol:
    1. Millisecond accuracy is NOT automatic on consumer hardware. Verbatim: "general-purpose
       computers are not designed with the millisecond-level accuracy of operation required for such
       applications. Software that does not control for the various sources of delay may return
       reaction time values that are substantially different from the true reaction times."
       Only 15 of the 44 tested hardware configurations achieved <10 ms average delay in the
       follow-up paper (reifman2018_pcpvt2).
    2. THE INPUT DEVICE IS THE DOMINANT ERROR SOURCE: "The most critical aspect of hardware
       selection is the type of mouse used for response detection, with gaming mice showing a
       significant advantage over standard ones."
  Protocol consequence: the same computer, the same input device and the same software build must be
  used for all 4 weeks, and a gaming-grade (high-polling-rate) mouse or an external button is
  preferred. A device change mid-protocol would inject a step change of the same order as the
  effect being measured.
