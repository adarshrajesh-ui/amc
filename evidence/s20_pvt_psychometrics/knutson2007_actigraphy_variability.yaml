      referent_h: null
      duration_days: 1
      contrast_label: "intraclass correlation of a SINGLE night of actigraphic sleep duration, derived from the reported variance components"
    scale: raw_units
    unit: "ICC (proportion of variance between persons)"
    value: 0.236
    se: null
    ci: null
    conversion_formula: "MY DERIVATION, not reported by the authors: ICC(1 night) = sigma_between^2 / (sigma_between^2 + sigma_within_daily^2) = 0.70^2 / (0.70^2 + 1.26^2) = 0.4900 / (0.4900 + 1.5876) = 0.4900/2.0776 = 0.2358. Uses only the two reported Table 2 SDs; ignores the within-subject YEARLY component (0.39 h), which is appropriate when the target is the person's mean within a single measurement window."
    from_figure: false
    inferred_from_ci: false
    direction_note: "Higher = more reliable. 0.236 is POOR: about 76% of the variance in a single night's actigraphic sleep duration is within-person noise rather than stable individual signal. A one-night or even three-night estimate of habitual sleep duration is close to useless."
    covariates: ["age", "race", "sex", "weekend night indicator"]
