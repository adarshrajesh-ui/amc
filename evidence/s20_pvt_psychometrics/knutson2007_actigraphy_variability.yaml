    scale: raw_units
    unit: "nights"
    value: 13.0
    se: null
    ci: null
    conversion_formula: "MY DERIVATION via Spearman-Brown, k = R(1 - r) / (r(1 - R)) with r = ICC(1 night) = 0.2358: k = 0.80*(1-0.2358) / (0.2358*(1-0.80)) = 0.61136/0.047160 = 12.96 -> 13 nights. Companion values: R=0.70 needs k = 0.70*0.7642/(0.2358*0.30) = 7.56 -> 8 nights; R=0.90 needs k = 0.90*0.7642/(0.2358*0.10) = 29.16 -> 30 nights."
    from_figure: false
    inferred_from_ci: false
    direction_note: "Higher = more nights of monitoring needed. 13 nights for R=0.80 is the reliability-based answer for Part C9 and is the reason the protocol should run 14 nights of actigraphy, not 7."
    covariates: []
    followup_years: null
    cohort_family: CARDIA
rob:
  tool: Newcastle-Ottawa
  judgement: low
  notes: "Large (n = 669), population-based CARDIA ancillary study with two measurement occasions ~1 year apart and an explicit three-way variance decomposition - this is the right design for the question and the estimates are precise. TWO IMPORTANT LIMITATIONS FOR OUR USE: (1) age 38-50 y, so adolescent_match is poor_midlife; adolescents and young adults have MORE socially-driven night-to-night variability (weekday/weekend swings), so 1.26 h is likely an UNDERESTIMATE of the night-to-night SD in an 18-year-old college student. (2) Only 3 nights per occasion (mostly Wed/Thu/Fri), so the daily variance component is estimated from a narrow, mostly-weekday window; the authors adjusted for weekend nights in the mean model but the design cannot fully characterise weekend structure."
funding: "NIH / NHLBI (CARDIA)"
notes: |
  ===== PART C9: THE QUANTITATIVE BASIS FOR "HOW MANY NIGHTS OF ACTIGRAPHY?" =====
  This is the record that makes the actigraphy-nights requirement a calculation rather than a
  convention. Everything else in Part C9 (Acebo 1999, Aili 2017, AASM 2018) gives night COUNTS;
  Knutson gives the VARIANCE COMPONENTS from which any night count can be derived for any target.

  VERBATIM QUOTES
  ---------------
  Abstract:
  "For each sleep parameter, total variance was decomposed into between-subject variance, within
  subject variance from day to day, and within-subject variance from year to year. The standard
  deviation was calculated from the variance. Analysis yielded a within-subject daily standard
  deviation (SD) of 1.26 hours and a within-subject yearly SD of 0.39 hours for sleep duration."
  "For each of the 4 sleep characteristics, nightly variability was much greater than yearly
  variability, meaning sleep behavior changes little in one year in this cohort of early middle-aged
  adults, despite large daily fluctuations. These results have important methodological implications,
  including that single-day measures of sleep may not accurately reflect habitual behavior."

  TABLE 2 VERBATIM (columns: Year-to-Year Correlation | Between-subject SD | Within-subject yearly SD |
  Within-subject daily SD; all models adjust for age, race, sex, and weekend nights, n = 667):
      Time in Bed (hr)      0.67 | 0.74 | 0.52 | 1.31   (CVs: 0.10 | 0.07 | 0.17)
      Sleep Duration (hr)   0.76 | 0.70 | 0.39 | 1.26   (CVs: 0.12 | 0.06 | 0.21)
      Sleep Latency (min)   0.93 | 22.2 |  6.3 | 30.7   (CVs: 0.98 | 0.28 | 1.36)
      Sleep Efficiency (%)  0.90 |  8.1 |  2.7 |  8.4   (CVs: 0.10 | 0.03 | 0.10)

  The interpretive sentence that matters most:
  "For all the sleep variables, the largest standard deviation was for within-subject daily variance.
  This means that the greatest amount of variance in these 3 sleep variables was explained by
  day-to-day variability."
  "The within-subject daily standard deviation expresses the degree to which the sleep measure varies
  from day to day for a given subject in a given year. For example, the daily standard deviation was
  over an hour for both sleep duration and time in bed, and it was 31 minutes for sleep latency. This
  means that individuals differ more from day to day than they do from each other."

  Recommendation:
  "However, day-to-day variation within subjects is very large; therefore, it is recommended that
  researchers record multiple days when measuring sleep characteristics. A single day will be a very
  "noisy" measure and only weakly reflect the multiple-day within-subject averages, whereas a
  multiple-day average likely reflects a true average over a longer observation window, such as one
  year."

  Weekend adjustment (important - the 1.26 h is a RESIDUAL, not a raw, night-to-night SD):
  "In addition, as these data typically included one weekend night for each subject, which may increase
  within-subject daily variability, we included a variable in the mean model identifying weekend days
  to adjust for weekend effects."

  Measurement protocol (a usable template):
  "Each occasion included 3 days of wrist actigraphy (Actiwatch, Mini Mitter, Inc) and accompanying
  sleep log. ... The Actiwatch model used has an event marker button to record specific times, and we
  asked the participants to press this button each night when they began to try to fall asleep and
  again when they got out of bed each morning. The subjects were instructed to wear the Actiwatches
  from a Wednesday afternoon to a Saturday morning."

  ===== ALL ARITHMETIC I PERFORMED (reproduce with these lines) =====
  Inputs (Table 2, sleep duration): sigma_between = 0.70 h ; sigma_within_daily = 1.26 h

  (A) SINGLE-NIGHT ICC
      ICC(1) = 0.70^2 / (0.70^2 + 1.26^2) = 0.4900 / 2.0776 = 0.2358

  (B) RELIABILITY ROUTE (Spearman-Brown): k = R(1-r) / (r(1-R)), r = 0.2358
      R = 0.70 -> k =  7.56 -> 8 nights
      R = 0.80 -> k = 12.96 -> 13 nights
      R = 0.90 -> k = 29.16 -> 30 nights

  (C) PRECISION ROUTE (standard error of THIS person's own mean): SEM(k) = 1.26/sqrt(k)
      k =  1 -> 1.260 h = 75.6 min   (95% CI half-width 148.2 min)
      k =  3 -> 0.727 h = 43.6 min   (95% CI half-width  85.5 min)
      k =  5 -> 0.563 h = 33.8 min   (95% CI half-width  66.3 min)
      k =  7 -> 0.476 h = 28.6 min   (95% CI half-width  56.0 min)
      k = 14 -> 0.337 h = 20.2 min   (95% CI half-width  39.6 min)
      k = 21 -> 0.275 h = 16.5 min   (95% CI half-width  32.3 min)
      k = 28 -> 0.238 h = 14.3 min   (95% CI half-width  28.0 min)
      Inverting: SEM <= 30 min needs k >=  6.35 ->  7 nights
                 SEM <= 20 min needs k >= 14.29 -> 15 nights
                 SEM <= 15 min needs k >= 25.40 -> 26 nights
                 SEM <= 10 min needs k >= 57.15 -> 58 nights

  WHICH ROUTE IS THE RIGHT ONE FOR AN N-OF-1?
  Route (C). The reliability/ICC route (B) answers "how many nights to RANK PEOPLE reliably", which is
  a between-person question and depends on sigma_between - a quantity that is irrelevant when there is
  only one person. For a single subject the question is "how precisely do I know HIS mean?", which is
  route (C) and depends only on his own night-to-night SD. Both routes are reported because the
  published literature (Acebo, Aili, AASM) is phrased in route-(B) terms and the report needs to
  reconcile with it. Conveniently they converge on the same practical answer: 13 nights (route B,
  R=0.80) and 15 nights (route C, SEM <= 20 min) both round to "two full weeks".

  A CAVEAT THE REPORT MUST STATE
  The index subject has a large, SYSTEMATIC weekday/weekend split (weekday ~5-6 h, weekend ~7-8 h).
  Knutson's 1.26 h is a weekend-ADJUSTED residual SD, so it does not include that systematic component.
  Consequently: (a) 14 nights must be a whole number of weeks (exactly 10 weekday + 4 weekend nights)
  so the weekday/weekend mix is balanced, and (b) weekday mean and weekend mean should be estimated
  and reported SEPARATELY, not collapsed into one "habitual duration". With only 10 weekday nights in
  a 14-night window, SEM(weekday mean) = 1.26/sqrt(10) = 0.398 h = 23.9 min - which is another reason
  to prefer 28 nights (20 weekday nights, SEM 16.9 min) if the subject will tolerate it.
