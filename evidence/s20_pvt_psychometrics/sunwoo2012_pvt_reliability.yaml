rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Large (n=372) but a clinical sample of commercial vehicle operators OVERSAMPLED FOR OSA RISK, i.e. an adult occupational population with sleep pathology, not healthy adolescents - adolescent_match poor_midlife. Crucially the four 'repeats' were WITHIN ONE DAY (before each MSLT nap), so this ICC mixes measurement error with circadian/time-of-day variation and does NOT estimate DAY-TO-DAY test-retest reliability. The authors did adjust for administration order. Age/sex not extracted (abstract-only access)."
funding: "Not extracted."
notes: |
  WHY THIS RECORD MATTERS DESPITE ITS LIMITATIONS. It is the largest published PVT reliability
  estimate (n=372) and it directly contradicts the frequently repeated claim that PVT test-retest
  ICCs are "above 0.8" for lapses (a claim traced to Dorrian, Rogers & Dinges 2005, a book chapter
  I could not retrieve). Measured here, on a continuous scale, lapses give ICC = 0.51 and median RT
  gives 0.69. That is a materially worse measurement instrument than the folklore suggests, and it
  is the reason the protocol in protocol_basis.md (a) uses mean 1/RT rather than lapse count and
  (b) averages multiple bouts per day.

  Time-of-day matters and must be controlled: "Statistically significant time of day effects were
  seen in both the MSLT and PVT but not the DADT." A daily-PVT protocol must therefore fix the
  clock time of testing, or time of day will masquerade as a treatment effect.
