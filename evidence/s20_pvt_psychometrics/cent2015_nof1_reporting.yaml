  ===== PART C8: THE DESIGN AND ANALYSIS FEATURES CENT REQUIRES =====
  Full text obtained as PDF via a Wayback Machine snapshot of the BMJ PDF
  (https://web.archive.org/web/20171007091737id_/https://www.bmj.com/content/bmj/350/bmj.h1738.full.pdf),
  because bmj.com and jclinepi.com both served an interstitial HTML page instead of the PDF.
  Text extracted with pdfminer.six. The CENT 2015 Explanation & Elaboration paper (BMJ 2015;350:h1793,
  DOI 10.1136/bmj.h1793) is open access but every Wayback snapshot I could fetch truncated at exactly
  1 MiB and would not parse, so the E&E is NOT part of this record.

  WHAT CENT SAYS AN N-OF-1 TRIAL *IS* (Box 1, verbatim)
  ----------------------------------------------------
  "N-of-1 trial - An experimental clinical study design to determine the effect of an intervention in
  a single study participant. CENT is intended to be used to report repeated challenge-withdrawal
  (that is, "ABAB") trials, commonly used in medicine, in which multiple crossovers between
  treatment(s) and control (placebo, standard care, alternate treatment) are continued for a
  pre-specified amount of time or until treatment effectiveness is determined. More than two treatment
  alternatives may be compared to each other or control (that is, "ABCABC")"

  "Period - The time during which a single treatment (A or B) is administered. Period length is
  typically determined a priori and may vary within a trial. The order of periods within a pair or
  treatment block may be randomised."

  "Block or pair - A repeated unit of a set number of period in N-of-1 trials is referred to as a
  block, in which the sequence of periods may or may not be randomised (for example, three repeating
  blocks of four periods may look like "AABB BBAA ABAB"). By convention, when the repeated unit
  contains only two periods (for example, three repeating pairs may look like "AB BA BA"), it is
  conventionally referred to as a pair."

  "Sequence - Multiple pairs or blocks comprise an entire sequence. The sequence is the consecutive
  set of periods, which may or may not indicate size of the repeated unit."

  "Washout period - A period in which no intervention is administered. A washout may be administered
  between different treatment periods or may act as a period in itself, as in a "reversal" design (to
  "wash out" the effects of a treatment before it is re-administered)."

  "Run-in period - A pre-specified duration of time before a trial begins, during which trial
  treatments may be initiated (for example, to get to a stable therapeutic dose), to determine
  potential patient compliance with study regimens, or to allow for washout of a medication(s) a
  patient may have been taking before the trial."

  THE CENT-SPECIFIC CHECKLIST ITEMS THAT DICTATE THE PROTOCOL (verbatim from Table 1)
  ----------------------------------------------------------------------------------
  Item 1a (title):        "Identify as an "N-of-1 trial" in the title
                           For series: Identify as "a series of N-of-1 trials" in the title"
  Item 3a (rationale):    "Rationale for using N-of-1 approach"
  Item 3a/4a (design):    "Describe trial design, planned number of periods, and duration of each
                           period (including run-in and wash out, if applicable)"
  Item 6a.1 (OUTCOMES):   "Description and measurement properties (validity and reliability) of
                           outcome assessment tools"
  Item 8a (RANDOMISATION):"Whether the order of treatment periods was randomised, with rationale, and
                           method used to generate allocation sequence"
  Item 8b:                "When applicable, type of randomisation; details of any restrictions (such
                           as pairs, blocking)"
  Item 8c:                "Full, intended sequence of periods"
  Item 12a (ANALYSIS):    "Methods used to summarize data and compare interventions for primary and
                           secondary outcomes"
  Item 12c (ANALYSIS):    "Statistical methods used to account for carryover effect, period effects,
                           and intra-subject correlation"
  Item 13a (RESULTS):     "Number and sequence of periods completed, and any changes from original plan
                           with reasons"
  Item 15/16 (RESULTS):   "For each intervention, number of periods analysed."
  Item 17a:               "For each primary and secondary outcome, results for each period; an
                           accompanying figure displaying the trial data is recommended."
  Item 17b:               "For each primary and secondary outcome, the estimated effect size and its
                           precision (such as 95% confidence interval)"
  Item 18 (ANCILLARY):    "Results of any other analyses performed, including assessment of carryover
                           effects, period effects, intra-subject correlation"
  Diagram:                the recommended CENT trial diagram is drawn as
                           "Run-in | A | B (or washout) | A | B (or washout)" with period counts,
                           i.e. an ABAB reversal with washout occupying the B slot when appropriate.
  Registration:           "N-of-1 trials can be prospectively registered in existing trial registries
                           (albeit with some modifications)."

  THE FIVE DESIGN REQUIREMENTS THIS IMPOSES ON THE SELF-EXPERIMENT
  ---------------------------------------------------------------
  1. MULTIPLE CROSSOVERS, not one A-then-B comparison. CENT's scope is explicitly the repeated
     challenge-withdrawal ABAB family; a single before/after contrast is a "pre-post design" which
     Fig 1 of CENT classifies as NON-EXPERIMENTAL and outside CENT's scope. A 4-week protocol must
     therefore contain at least 2 and preferably 3+ AB pairs.
  2. RANDOMISED PERIOD ORDER within pairs or blocks (item 8a-8c), with the full intended sequence
     pre-specified. For a sleep manipulation the practical form is: pre-generate the randomised
     sequence of restriction/extension weeks (or nights) before the trial starts and commit to it.
  3. A RUN-IN, whose purpose CENT names as reaching stable conditions and washing out prior state.
     In our setting the run-in has to do double duty: clear the pre-existing sleep debt (Part C10) and
     exhaust the PVT practice effect (Part A3).
  4. WASHOUT between periods, or explicit modelling of carryover. Item 12c makes carryover, period
     effects and intra-subject correlation MANDATORY analysis targets, not optional refinements. This
     is the single most important CENT requirement for a sleep experiment, because Belenky 2003 shows
     3 nights of normal sleep does not wash out a restriction period.
  5. OUTCOME MEASUREMENT PROPERTIES must be reported (item 6a.1). This is why the ICC and
     within-person SD extractions in Part A3 are not optional background - CENT requires them.

  BLINDING - WHAT CENT ACTUALLY SAYS, AND THE HONEST LIMITATION
  ------------------------------------------------------------
  CENT leaves CONSORT items 11a and 11b unmodified: "If done, who was blinded after assignment to
  interventions (for example, participants, care providers, those assessing outcomes) and how" and
  "If relevant, description of the similarity of interventions". CENT does NOT require blinding and
  provides no n-of-1-specific guidance on it. For a sleep-duration self-experiment participant
  blinding is IMPOSSIBLE - the subject necessarily knows how long he slept. The best available
  substitutes, which the report should state as mitigations rather than as blinding:
    * the PVT outcome is an objective reaction-time measure, not a rated judgement, so it is not
      directly falsifiable by expectancy in the way a symptom score is;
    * pre-register the analysis and the randomised sequence so the analysis cannot drift;
    * collect the subjective rating BEFORE each PVT run at every session, so expectancy contamination
      of the objective measure can at least be estimated rather than assumed absent;
    * treat the unblinded design as a permanent RoB2 "some concerns" and say so in the report.

  SCOPE WARNING FOR THE DOWNSTREAM MODEL
  --------------------------------------
  CENT is a REPORTING guideline. It specifies what must be disclosed; it does NOT tell you how many
  periods are needed for 80% power, and it contains no sample-size formulae. Item 7a is simply "How
  sample size was determined". The quantitative power machinery has to come from Senn 2019
  (senn2019_nof1_sample_size.yaml) plus the within-person SD extracted in Part A3.
