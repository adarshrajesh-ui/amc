  # ---------- PART B6: the subjective sleepiness plateau ----------
  - outcome_domain: cognition
    outcome_construct: subjective_sleepiness_response_curvature_chronic_restriction
    exposure: {type: chronic_restriction, dose_h: 6, referent_h: 8, duration_days: 14, contrast_label: "curvature parameter theta of the sleepiness response over 14 days, pooled across the 8h/6h/4h TIB conditions; Stanford Sleepiness Scale"}
    scale: raw_units
    unit: "theta (curvature parameter; theta -> 1 = near-linear accumulation, theta -> 0 = saturating/plateau)"
    value: 0.24
    se: 0.04
    ci: [0.162, 0.318]
    conversion_formula: "published estimate +/- s.e. (0.24 +/- 0.04); CI = 0.24 +/- 1.96*0.04 computed by me"
    from_figure: false
    inferred_from_ci: false
    direction_note: "LOW theta = subjective sleepiness SATURATES (plateaus) across days of chronic restriction. Contrast the SAME parameter for the SAME scale under total sleep deprivation: 0.86 +/- 0.14, i.e. near-linear. THIS PAIR OF NUMBERS IS THE QUANTITATIVE CORE OF THE 'YOU CANNOT TELL HOW IMPAIRED YOU ARE' CLAIM."
    covariates: []
    followup_years: null
    cohort_family: "UPenn_Dinges_dose_response_2003"
    quote: "The curvature for subjective sleepiness as assessed by the SSS was statistically estimated to be 0.86 +/- 0.14 for the 0 h sleep condition, and 0.24 +/- 0.04 for the 8 h, 6 h and 4 h sleep period conditions (theta estimate +/- s.e.). Thus, the profile of subjective sleepiness across days was near-linear for the 0 h sleep condition, while it was near-saturating for the 4 h and 6 h sleep period conditions (Figure 1B)."
  - outcome_domain: cognition
    outcome_construct: pvt_lapse_response_curvature_chronic_restriction
    exposure: {type: chronic_restriction, dose_h: 6, referent_h: 8, duration_days: 14, contrast_label: "curvature parameter theta of the PVT lapse response over 14 days, pooled across 8h/6h/4h TIB conditions"}
    scale: raw_units
    unit: "theta (curvature parameter)"
    value: 0.78
    se: 0.04
    ci: [0.702, 0.858]
    conversion_formula: "published estimate +/- s.e. (0.78 +/- 0.04); CI computed by me as 0.78 +/- 1.96*0.04"
    from_figure: false
    inferred_from_ci: false
    direction_note: "HIGH theta = PVT impairment accumulates NEAR-LINEARLY and does NOT plateau. Directly compare with the SSS theta of 0.24 in the SAME subjects, SAME conditions, SAME days: objective deficit keeps growing while the feeling of sleepiness flattens out. This is a within-study, within-subject dissociation, which is the strongest possible design for this claim."
    covariates: []
    followup_years: null
    cohort_family: "UPenn_Dinges_dose_response_2003"
    quote: "For the 8 h, 6 h and 4 h sleep period conditions, curvature (parameter theta in equation (1)) was statistically estimated to be 0.78 +/- 0.04 for psychomotor vigilance task performance, 0.59 +/- 0.04 for digit symbol substitution task performance, and 0.45 +/- 0.04 for serial addition/subtraction task performance (estimate +/- s.e.)."
