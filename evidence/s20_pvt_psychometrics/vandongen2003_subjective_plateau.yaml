    direction_note: "Positive = sleepier. After 14 nights at 4-6 h, the subject FEELS about 1 SSS unit sleepier - i.e. 'only slightly sleepy' - while their PVT performance has degraded to a level equal to 1-2 nights of total sleep deprivation. The felt signal understates the measured deficit by roughly half on the same instrument's scale."
