  # ---------- the critical wake duration: the basis for the ad-lib sleep-need estimate ----------
  - outcome_domain: sleep_need
    outcome_construct: critical_wake_duration_xi_implied_sleep_need
    exposure: {type: descriptive, dose_h: null, referent_h: null, duration_days: null, contrast_label: "statistically estimated subject-specific critical wake duration xi beyond which PVT lapses accumulate near-linearly, pooled across 4h/6h/8h/0h conditions"}
    scale: hours
    unit: "hours of wakefulness per 24 h beyond which behavioural-alertness deficits accumulate"
    value: 15.84
    se: 0.73
    ci: [14.41, 17.27]
    conversion_formula: "published estimate 15.84 h (s.e. 0.73 h); CI = 15.84 +/- 1.96*0.73 computed by me. IMPLIED DAILY SLEEP NEED = 24 - 15.84 = 8.16 h (s.e. 0.73 h)."
    from_figure: false
    inferred_from_ci: false
    direction_note: "Wakefulness in EXCESS of ~15.84 h/day is what accumulates a neurobehavioural cost. The complement, 8.16 h, is the group-average daily sleep need implied by performance data rather than by opinion. Used in protocol_basis.md to convert a TIB contrast into an excess-wakefulness dose."
    covariates: []
    followup_years: null
    cohort_family: "UPenn_Dinges_dose_response_2003"
    quote: "A statistical model revealed that, regardless of the mode of sleep deprivation, lapses in behavioral alertness were near-linearly related to the cumulative duration of wakefulness in excess of 15.84 h (s.e. 0.73 h)."
  - outcome_domain: sleep_need
    outcome_construct: critical_wake_duration_matches_habitual_wake_duration
    exposure: {type: descriptive, dose_h: null, referent_h: null, duration_days: null, contrast_label: "difference between each subject's empirical-Bayes critical wake duration xi and their actigraphy-derived habitual wake duration"}
    scale: hours
    unit: "hours (habitual wake duration minus critical wake duration xi)"
    value: 0.1
    se: 0.5
    ci: [-0.88, 1.08]
    conversion_formula: "published mean +/- s.e. (0.1 +/- 0.5 h), t23 = 0.17, P = 0.86; CI = 0.1 +/- 1.96*0.5 computed by me"
    from_figure: false
    inferred_from_ci: false
    direction_note: "Indistinguishable from zero: a person's performance-derived sleep NEED matches their pre-study habitual sleep duration on average. IMPORTANT CAVEAT FOR THIS SUBJECT: this equivalence was found in adults whose habitual sleep was NOT chronically curtailed to 5-6 h, so it cannot be read as 'whatever you habitually sleep is what you need'. The paper's own companion finding cuts the other way: longer habitual sleepers were MORE affected by imposed restriction (r32 = 0.29, P = 0.048)."
    covariates: []
    followup_years: null
    cohort_family: "UPenn_Dinges_dose_response_2003"
    quote: "The subject-specific values for xi, statistically determined with empirical Bayes estimation, were similar to the subject-specific habitual wake durations (derived from average sleep durations in the 5 days prior to the experiment). The difference between habitual wake duration and critical wake duration xi was 0.1 +/- 0.5 h (mean +/- s.e.), which was not significantly different from zero (t23 = 0.17, P = 0.86)."
rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomised to 4h/6h/8h TIB for 14 days (parallel-arm for the restriction doses) plus a separate 3-day TSD experiment, 12 days inpatient with continuous monitoring - a strong design, but no blinding is possible and the TSD comparison is a separate experiment rather than a randomised arm of the same one. n = 48 across both experiments so per-arm n is ~13. Healthy adults 21-38, adolescent_match fair_adult. Curvature parameters come from a specific non-linear mixed model (equation 1), so they are model-dependent quantities, not model-free descriptive statistics."
funding: "Not extracted from the retrieved PDF; NIH-supported UPenn programme."
notes: |
  THIS IS THE PRIMARY SOURCE FOR THE ENTIRE 'YOU CANNOT TELL HOW IMPAIRED YOU ARE' CLAIM, and it is
  best stated as the within-study contrast of two curvature parameters estimated in the SAME people
  on the SAME days:
      PVT lapses, chronic restriction:            theta = 0.78 +/- 0.04  (near-linear accumulation)
      Stanford Sleepiness Scale, same conditions: theta = 0.24 +/- 0.04  (near-saturating plateau)
      Stanford Sleepiness Scale, total deprivation: theta = 0.86 +/- 0.14 (near-linear - so the
          plateau is NOT a ceiling artefact of the scale)
  The authors make the no-ceiling argument explicitly: "It is unlikely that this was the result of a
  ceiling effect or other metric-related artifact, because subjects in the total sleep deprivation
  condition reported considerably greater levels of sleepiness, and did not show evidence of
  adaptation."

  THE FULL DISCUSSION PASSAGE, verbatim, because it is the most quotable statement of the finding:
  "Chronic restriction of sleep to 4 h and 6 h initially elevated subjective sleepiness ratings on
  both the Stanford Sleepiness Scale and the Karolinska Sleepiness Scale, but as sleep restriction
  continued, there were only minor further increases in these ratings (Figure 1B). In fact, unlike
  PVT and DSST performance functions (Figures 1A, 1C), sleepiness ratings never reached levels
  equivalent to those found after 2 nights of total sleep deprivation. Surprisingly, by the end of
  the 14 days of sleep restriction, when performance was at its worst levels, subjects in the 4 h and
  6 h sleep period conditions reported feeling only slightly sleepy. Therefore, unlike performance
  measures, sleepiness ratings appeared to show adaptation to chronic partial sleep deprivation."

  AND THE MECHANISM/IMPLICATION, verbatim: "These findings for subjective sleepiness suggest that
  once sleep restriction is chronic, subjects either cannot reliably introspect with regard to their
  actual sleepiness levels, or as long as they are receiving at least approximately 4 h of sleep
  nightly they do not experience a sense of sleepiness anywhere near the levels found for total sleep
  deprivation. Regardless of the explanation, the lack of reports of intense feelings of sleepiness
  during chronic sleep restriction may explain why sleep restriction is widely practiced - people
  have the subjective impression they have adapted to it because they do not feel particularly
  sleepy."

  And the abstract's summary sentence: "Sleepiness ratings suggest that subjects were largely unaware
  of these increasing cognitive deficits, which may explain why the impact of chronic sleep
  restriction on waking cognitive functions is often assumed to be benign."

  MAGNITUDE ANCHOR for the deficit the subject cannot feel: "In the 4 h sleep period condition,
  lapses in behavioral alertness and reductions in working memory performance reached levels
  equivalent to those observed after 2 nights without sleep (Figures 1A, 1C). ... Subjects in the 6 h
  sleep period condition also reached levels of impairment equivalent to those observed after 1 night
  of total sleep loss for lapses in behavioral alertness and working memory performance."

  MODEL FIT: with between-subject variance in xi and gamma taken into account, the cumulative-excess-
  wakefulness model "explained 83.0% of the variance in the PVT data" with curvature theta = 0.67
  +/- 0.05. This is what licenses the linearisation used in protocol_basis.md to convert a 1-2 h
  nightly TIB contrast into an expected mean-1/RT effect.

  NOTE ON OVERLAP: shard s01 (cognition_dose_response) and s06 (sleep_need_measurement) will almost
  certainly also extract from this paper. My record deliberately extracts only the SUBJECTIVE/
  OBJECTIVE DISSOCIATION parameters and the critical-wake-duration/sleep-need parameters, not the
  primary dose-response lapse effect sizes. De-duplicate on cohort_family = UPenn_Dinges_dose_response_2003.
