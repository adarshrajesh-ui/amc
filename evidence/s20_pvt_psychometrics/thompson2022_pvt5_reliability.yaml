rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Abstract-only access (Elsevier, not in PMC). Sample size not stated in the abstract, so n is null - a real limitation for weighting. Females only, aged 20-63 (mean not given), so adolescent_match poor_midlife and sex-restricted. Only TWO administrations, which is the minimum for an ICC and cannot characterise a learning CURVE - the authors infer a learning curve indirectly from a significant systematic mean shift. No absolute (ms) SEM extractable without the full text."
funding: "Not extracted."
notes: |
  THIS RECORD SUPPLIES TWO THINGS THE PROTOCOL NEEDS AND NOTHING ELSE I RETRIEVED SUPPLIES.

  (1) A between-DAY (not within-day) test-retest reliability for a SHORT PVT in a rested state:
      ICC 0.79 (mean RT) and 0.83 (fastest 10% RT), with SEM% of 4.14% and 4.43%. These are the
      only rested-baseline, between-day, short-PVT reliability figures I could verify.

  (2) DIRECT EVIDENCE AGAINST THE CLAIM THAT THE PVT IS PRACTICE-EFFECT-FREE, in the metric most
      people use: mean RT showed a statistically significant systematic between-session shift
      (P = 0.01) which the authors attribute to a learning curve. Combined with basner2020_practice
      (which found NO significant practice effect for PVT response SPEED across 15 administrations,
      std beta = 0.02, P = 0.44, but DID find a small significant one for PVT ACCURACY,
      std beta = 0.09, P = 0.02), the honest reading is: the PVT has the SMALLEST practice effect of
      any common cognitive test but it is not exactly zero, and it is detectable at the second
      administration in mean RT. Hence the protocol's practice-effect washout requirement.

  CAUTION on 3-min vs 5-min: this paper asserts, citing others, that "the 5-minute version has been
  suggested to be more valid than the 3-minute". Basner's own data (basner2011_pvt_metrics) show
  effect sizes saturating after the third minute under chronic partial restriction, and the
  validated PVT-B is 3 min. This is an unresolved disagreement in the literature; the protocol
  hedges by specifying a 3-min PVT-B with the 355-ms lapse threshold AND mean 1/RT as primary,
  and notes that 5 min would be strictly better if compliance allows.
