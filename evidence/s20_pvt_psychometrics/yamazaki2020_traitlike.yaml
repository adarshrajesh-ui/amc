rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Largest sample in this literature (n=83) and the only one to test demographic moderators, but the two 'replicates' were again DIFFERENT sleep-loss types (5x4h SR vs 36 h TSD), so the ICC measures cross-paradigm generalisation rather than pure test-retest. Age range not extracted from the retrieved text. Healthy screened volunteers only. Overlaps in personnel/laboratory lineage with dennis2017_traitlike and vandongen2004_traitlike - do not treat the trait-ICC estimates as fully independent."
funding: "Not extracted from the retrieved text."
notes: |
  PROTOCOL, verbatim: "Eighty-three adults completed two baseline nights (10 h-12 h time-in-bed,
  TIB) followed by five 4 h TIB SR nights or 36 h TSD. Participants then received four 12-h TIB
  recovery nights followed by five SR nights or 36 h TSD, in counterbalanced order to the first
  sleep loss sequence. Neurobehavioral tests were completed every 2 h during wakefulness."
  This is the design template for a washed-out 2-period sleep crossover: 2 baseline nights at
  10-12 h TIB, exposure, then FOUR 12-h-TIB recovery nights before the second exposure.
  Testing every 2 h during wakefulness (i.e. many bouts per day) is how the laboratory keeps the
  daily measurement error small - a real-world n-of-1 with 2-3 bouts/day will have a larger
  day-level sigma than these studies.

  Together with vandongen2004_traitlike (ICC 0.675-0.922, n=21), rupp2012_traitlike (PVT lapses
  0.89, speed 0.86, n=19) and dennis2017_traitlike (72-95% over months to years, n=23/24), the
  trait-like ICC for the neurobehavioral response to sleep loss is reproducibly in the 0.68-0.92
  band across four independent samples and two laboratories.

  WHY THIS IS THE JUSTIFICATION FOR AN N-OF-1 DESIGN, stated arithmetically: if ICC ~ 0.8, then
  80% of the between-person spread in the sleep-loss response is a stable person-level property.
  A population mean effect therefore carries a person-level prediction interval roughly
  sqrt(sigma2_bs + sigma2_ws) wide; using Van Dongen 2004's PVT components that is
  sqrt(286+138) = 20.6 lapses around a group mean. No population estimate can resolve where in
  that interval this particular 19-year-old sits. Only measuring him can.
