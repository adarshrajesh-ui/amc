notes: |
  ===== THE BEST AGE MATCH IN MY SHARD, AND THE MOST FRUSTRATING ACCESS FAILURE =====
  Only three records in this shard are adolescent_match exact_16_19: acebo1999_actigraphy_nights (actigraphy
  night counts), wilson2010_pvt5_adolescent (PVT reliability in a classroom) and this one. Critically, EVERY
  record that contributes to the effect size or the within-person SD used in the power calculation is in
  adults - Pejovic mean age 24.7 is the closest, then Basner 22-45, Thompson 20-63, Knutson 38-50. Short
  et al. 2018 is 15-17 year olds, i.e. the right band for a subject who was 16-19 across the exposure window,
  and it is methodologically the adolescent replication of Van Dongen 2003: a dose-response model fitted to
  PVT lapse data to back out the sleep duration that keeps performance at optimum.

  FULL ABSTRACT, VERBATIM (this is the entirety of what I hold firsthand):
  "This study will (1) estimate the nightly sleep need of human adolescents, (2) determine the time
  course and severity of sleep-related deficits when sleep is reduced below this optimal quantity, and
  (3) determine whether sleep restriction perturbs the circadian system as well as the sleep homeostat.
  Thirty-four adolescents aged 15 to 17 years spent 10 days and nine nights in the sleep laboratory.
  Between two baseline nights and two recovery nights with 10 hours' time in bed (TIB) per night,
  participants experienced either severe sleep restriction (5-hour TIB), moderate sleep restriction
  (7.5-hour TIB), or no sleep restriction (10-hour TIB) for five nights. A 10-minute psychomotor
  vigilance task (PVT; lapse = response after 500 ms) and the Karolinska Sleepiness Scale were
  administered every 3 hours during wake. Salivary dim-light melatonin onset was calculated at baseline
  and after four nights of each sleep dose to estimate circadian phase. Dose-dependent deficits to sleep
  duration, circadian phase timing, lapses of attention, and subjective sleepiness occurred. Less TIB
  resulted in less sleep, more lapses of attention, greater subjective sleepiness, and larger circadian
  phase delays. Sleep restriction perturbs homeostatic and circadian systems, leading to dose-dependent
  deficits to sustained attention and sleepiness. Adolescents require more sleep for optimal functioning
  than typically obtained."

  THE TWO SLEEP-NEED CONVERGENCES, AND WHY THEY MATTER FOR THE PROTOCOL
  --------------------------------------------------------------------
  Within this study:      opportunity-based ~9.0 h   vs   PVT-performance-based 9.35 h
  Across studies (adults): Kitamura 2016 ad-lib asymptote 8.41 +/- 0.18 h  vs  Van Dongen 2003
                           PVT-derived 8.16 h (24 - 15.84 h critical wake duration)
  The two methods agree within each age band, and the adolescent figures sit ~0.9-1.2 h ABOVE the adult
  figures. Practical consequence for protocol_basis.md section 10: the "extension" arm's target TIB must
  be set from the SUBJECT'S OWN measured asymptote, and the prior for an 18-19 year old should be ~8.5-9 h
  rather than the ~8.4 h adult figure, because he sits between the Short (15-17 y) and Kitamura (20-26 y)
  bands. Using an 8.0 h extension arm would risk making the "rested" condition itself mildly restricted,
  which would attenuate the contrast and bias the whole experiment toward a null.

  WHAT I WANTED FROM THIS PAPER AND COULD NOT GET
  ----------------------------------------------
  The 7.5-h vs 10-h TIB arm is a 2.5 h/night contrast for 5 nights in 15-17 year olds - almost exactly
  the manipulation the n-of-1 protocol will run, in almost exactly the right age group. The per-condition
  PVT lapse means, SDs and effect sizes from that contrast would be the single best calibration anchor
  available for the power calculation, replacing my current reliance on Pejovic 2013 (adults, 2 h/night)
  plus a Basner/Van Dongen dose linearisation. They are in the paywalled full text. This is recorded as
  the top-priority full-text retrieval in station_report.md.
