    direction_note: "THIS IS A DIRECTLY MEASURED WITHIN-PERSON SESSION-TO-SESSION SD - the quantity an n-of-1 power calculation needs. It is measured in the SLEEP-DEPRIVED state (36 h awake) on a 20-min PVT, so it is an UPPER bound on the rested-baseline, 3-to-10-min-PVT equivalent. Companion between-person component sigma2_bs = 286 (SE 124) -> sigma_bs = 16.9 lapses."
    covariates: []
