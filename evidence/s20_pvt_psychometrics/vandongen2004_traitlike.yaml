rob:
  tool: RoB2
  judgement: some_concerns
  notes: "n = 21 completers; ICC estimates from n=21 with only 2 replicates per person are imprecise (SEs on the variance components are 35-45% of the point estimates). PVT was the one measure with a statistically significant ORDER effect (F = 4.36, P = .014), i.e. lapses got WORSE with repeated exposure, which the authors corrected for in the mixed model but which complicates the 'no practice effect' story. Homogeneous healthy screened young adults; the authors note ICCs in a more heterogeneous general population would be HIGHER."
funding: "Not extracted from the retrieved PDF text."
notes: |
  FULL PUBLISHED TABLE 2 (reconstructed from the PDF text layer and then VERIFIED by
  independently recomputing every ICC from the published variance components -
  ICC = sigma2_bs/(sigma2_bs+sigma2_ws) - all 13 reproduced to +/-0.003):
    Test    sigma2_bs (SE)  sigma2_ws (SE)   ICC     Z     P      OrderF  P
    KSS-1     3.92 (1.38)     0.42 (0.14)   0.904   2.84  .002    0.40   .81
    VAS-F1    3.84 (1.36)     0.44 (0.15)   0.897   2.83  .002    0.39   .81
    VAS-M1    1.59 (0.57)     0.21 (0.07)   0.882   2.79  .003    2.92   .053
    SAST       495 (185)       138 (46)     0.782   2.68  .004    1.22   .34
    DSST      2081 (760)       473 (158)    0.815   2.74  .003    2.22   .11
    WDT       25.0 (8.5)       2.1 (0.7)    0.922   2.95  .002    2.99   .047
    RARST     76.5 (27.5)     15.6 (5.2)    0.831   2.78  .003    2.25   .11
    PVT        286 (124)       138 (48)     0.675   2.31  .011    4.36   .014
    KSS-2     4.00 (1.44)     0.60 (0.21)   0.869   2.78  .003    0.51   .73
    VAS-F2    4.21 (1.52)     0.67 (0.23)   0.862   2.76  .003    0.82   .53
    VAS-M2    1.55 (0.55)     0.18 (0.06)   0.894   2.82  .002    3.28   .036
    PERF      0.67 (0.25)     0.17 (0.06)   0.793   2.63  .004    1.78   .18
    EFF       0.55 (0.19)     0.06 (0.02)   0.899   2.91  .002    1.37   .28
  Check: PVT 286/424=0.6745; DSST 2081/2554=0.8148; WDT 25.0/27.1=0.9225; KSS-1 3.92/4.34=0.9033;
  SAST 495/633=0.7820; RARST 76.5/92.1=0.8306; EFF 0.55/0.61=0.9016; PERF 0.67/0.84=0.7976. All match.

  UNITS. PVT here is the 20-MINUTE PVT (confirmed in the text: "behavioral alertness, as measured
  by the 20-minute PVT") and the outcome measure is, per Table 1, "Number of lapses (RT >= 500 ms)".
  So sigma_ws = sqrt(138) = 11.75 lapses / 20-min PVT and sigma_bs = sqrt(286) = 16.91 lapses.

  DESIGN. 21 healthy adults, 3 separate 36-h TSD sessions >=2 weeks apart, each preceded by a week
  of either 6 h/day sleep restriction (PSR) or 12 h/day sleep extension (PSE), randomised and
  counterbalanced. The ICCs above use ONLY the two identical PSE sessions, so they are a clean
  test-retest of the sleep-loss response. Mean sleep-history manipulation = 4.1 h/day difference.

  KEY SECOND FINDING: the interindividual differences were NOT explained by sleep history and NOT
  generally explained by baseline functioning. Verbatim: "The magnitude of interindividual
  variability was substantial relative to the magnitude of the effect of prior sleep restriction
  (which on average involved a reduction of 4.1 hours sleep per day, compared to prior sleep
  extension, for 7 days)." And: "Although differences in baseline neurobehavioral functioning
  contributed significantly to the between-subjects variability during sleep deprivation,
  controlling for baseline functioning did not generally negate the systematic interindividual
  differences during sleep deprivation."

  THIRD FINDING relevant to which outcome to measure: variability loaded on 3 orthogonal factors -
  "self-evaluation of sleepiness, fatigue, and mood; cognitive processing capability; and
  behavioral alertness as measured by sustained attention performance." The PVT loaded on its OWN
  factor, separate from everything else: "the test battery except for the PVT, which was captured
  in the remaining [factor]". Subjective sleepiness and PVT performance are therefore NOT
  interchangeable readouts even at the level of individual differences.

  COMPANION PAPER, same dataset, slightly different ICC computation: Van Dongen HPA, Maislin G,
  Dinges DF, "Dealing with inter-individual differences in the temporal dynamics of fatigue and
  performance: importance and techniques", Aviat Space Environ Med 2004;75(3 Suppl):A147-54.
  Verbatim from that paper's retrieved text: "For the digit-symbol substitution task, the ICC was
  found to be 0.82 (Z 2.74, p 0.003); and for the psychomotor vigilance task, the ICC was 0.69
  (Z 2.40, p 0.008" - i.e. PVT ICC 0.69 there vs 0.675 in the Sleep paper (order-effect handling
  differs slightly). Both land in the "substantial" band.
