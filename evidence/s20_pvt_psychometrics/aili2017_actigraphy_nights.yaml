  notes: "Descriptive reliability study, so RoB2 is not applicable. Limitations for our use: (a) n = 54 (49 entering the 7-night ICC analysis, 51 for the 4-night analysis, 38 after excluding weekend workers) - small for variance-component estimation, so the night-count thresholds are imprecise; (b) all participants worked at the same location, and the authors themselves flag this: 'the studied group is more homogenous than a random sample from a general population would be'; (c) only 7 nights were recorded, so the total-sleep-time requirement is censored and unidentified above 7; (d) working adults, not students, so adolescent_match is fair_adult. Age and sex distribution are not stated in the text I retrieved, hence nulls."
funding: "Stockholm Stress Center, a FAS/Forte Center of Excellence (dnr 2009-1758); Future Occupational Health Services FAS/Forte 2010-1563. 'This was not an industry supported study.'"
notes: |
  ===== PART C9: THE STUDY THAT ASKED OUR EXACT QUESTION =====
  Full text obtained from PMC (PMC5181612) by fetching the rendered article HTML with a browser
  user-agent and flattening it, because the BioC API, the Europe PMC fullTextXML endpoint and the
  PMC OA service all refused this article (the OA service returns
  "identifier 'PMC5181612' is not Open Access") and jcsm.aasm.org served no PDF to curl.

  WHAT I COULD NOT GET: Table 4 (the per-parameter single-measure ICC values) and Figure 3 (the
  Spearman-Brown curves) are IMAGES in the PMC rendering, so the numeric ICCs are NOT in this record.
  I have the night-count thresholds, the method, and the discussion, but not the underlying ICCs. The
  ICC-based arithmetic in protocol_basis.md therefore uses Knutson 2007's variance components, not
  Aili's ICCs.

  VERBATIM QUOTES
  ---------------
  Aim - this is precisely the Part C9 question:
  "The aim of the study was to investigate how many nights of measurement are needed for a reliable
  measure of sleep in a working population including adult women and men."

  Method:
  "In all, 54 individuals participated in the study. Sleep was assessed for 7 consecutive nights using
  actigraphy as an objective measure, and the Karolinska sleep diary for a subjective measure of
  quality. Using intra-class correlation and the Spearman-Brown formula, calculations of how many
  nights of measurements were required for a reliable measure were performed."
  "An intra-class correlation (ICC) coefficient was calculated using a two-way random model, which
  provides a ratio of the between-subjects variance to the sum of all the variance components. The
  intra-class correlation estimates the reliability of the measures for each parameter on a single
  night of measurement. In this study setting, a low single-measure intra-class correlation indicates a
  high intra-individual day-by-day variation."
  "The Spearman-Brown formula was then applied to estimate the effects of changes in number of
  aggregated days of measurement on the reliability of each test."
  "A Spearman-Brown reliability coefficient of >= 0.7 was used to indicate acceptable reliability, in
  accordance with the previous literature."

  THE RESULTS (Conclusions section, verbatim):
  "The results in the present study suggest that data from at least two nights are to be recommended
  when assessing the actigraphy sleep measure sleep percent and at least five nights when assessing
  (actigraphy) sleep efficiency. For actigraphy measured total sleep time, more than seven nights are
  recommended. At least six nights of measurements are required for a reliable measure of self-reported
  sleep quality. However, if measurements are performed on Monday through Thursday, four nights of
  measurement seem to be sufficient to obtain a reliable objective and subjective measure. Depending on
  the purpose of the sleep assessment, it may be preferable to collect data during weeknights only.
  Information on whether weekend nights are included or not are important when presenting the results
  of sleep studies. The low overall correlations between actigraphy sleep measurements and self-reports
  in this study suggest that subjectively and actigraphy measured sleep capture different dimensions of
  sleep."

  The censoring statement (why "more than seven" is all they can say):
  "Our study suggests that not even measurements lasting a full week would give a satisfactorily
  reliable measure of total sleep time."
  "When including individuals working during the weekend, sufficient reliability (a Spearman Brown
  coefficient >= 0.7) was not reached over the 7-day period."

  Their reconciliation with the rest of the literature, which is useful for the report:
  "Knutson and colleagues found that five or six days of measurement of sleep duration (using the same
  definition as for the parameter total sleep time that was used in our study) should be sufficient for
  adults, and in a study including only women it was suggested that at least five days of measurement
  are needed."
  Note the tension: Aili could not reach R = 0.70 for TST in 7 nights, whereas she reports Knutson as
  recommending 5-6 days. My own Spearman-Brown derivation from Knutson 2007's published variance
  components gives 8 nights for R = 0.70 and 13 nights for R = 0.80 - closer to Aili's empirical result
  than to the 5-6 day figure. The report should quote the range and not pretend the literature is
  unanimous.

  WEEKDAY-ONLY MEASUREMENT: A TEMPTATION TO REFUSE
  -----------------------------------------------
  "Further, higher reliability was observed for measurements when including only week nights (Monday to
  Thursday) than when including weekend nights."
  "We chose to let four nights represent week nights, i.e., the nights of Monday through Thursday, for
  two reasons. One is that the night between Sunday and Monday may not be representative of a "normal"
  week night."
  Restricting to Mon-Thu raises reliability because it removes a real, systematic source of variance.
  For THIS subject that variance IS the exposure of interest (weekday 5-6 h vs weekend 7-8 h), so
  weekday-only measurement would be measuring the wrong thing. Take the reliability hit, record all 7
  nights, and estimate weekday and weekend means separately. Acebo 1999 points the same way (month-to-
  month stability required weekend nights to be included).

  SECONDARY FINDING WORTH CARRYING INTO PART B6
  --------------------------------------------
  "Overall, there was a low correlation between the investigated actigraphy sleep parameters and
  subjective sleep quality, suggesting that the two methods of measurement capture different dimensions
  of sleep." and "the correlations were overall very low and in most cases nonsignificant."
  This is the SLEEP-measurement analogue of the subjective/objective dissociation my Part B documents
  for PERFORMANCE: the subject's rating of how he slept is a poor proxy for how he actually slept, just
  as his rating of how alert he is is a poor proxy for how he actually performs. Both diaries AND
  actigraphy are therefore required; neither substitutes for the other.
