rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Small (n=16), no blinding possible, healthy screened adults 22-40 so adolescent_match fair_adult. Abstract-only access, so all four extracted quantities are directional or bounded rather than point estimates - this is the weakest-quantified record in my shard and I have marked every value accordingly. Validation was against ACUTE TOTAL sleep deprivation (38 h), not against the chronic 1-2 h restriction this protocol targets, so sensitivity in the target dose range is extrapolated. Design strength: it did include a dedicated PRACTICE DAY before the baseline day."
funding: "Not extracted."
notes: |
  PART A5 ANSWER, part 3 of 3, and the closest available answer to the task's PVT-B "correlation"
  request. Included because it is the only verified validation of a 3-min PVT running on ordinary
  consumer smartphone/tablet hardware against a conventional 10-min PVT, and because it covers the
  RECOVERY direction as well as the deprivation direction ("valid instruments for measuring reduced
  alertness due to sleep deprivation and restored alertness following recovery sleep"), which the
  protocol needs for its recovery arm.

  Design feature worth copying verbatim into the protocol: the study "included a practice and a
  baseline day" before the deprivation period, and testing occurred "every 3 h". A practice day is
  the empirical implementation of the run-in requirement.

  Reinforces two hard constraints already established elsewhere in this shard:
    - fix the device (RTs differ systematically between smartphone, tablet and laptop);
    - fix the clock time (time-on-task effects were "modulated by time awake and time of day").
shard: "s20_pvt_psychometrics"
