rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Abstract-only access (Springer/Psychonomic Society, 2004, not in PMC). Sample size, age and sex are not stated in the abstract, so n is null and adolescent_match is 'mixed' - a real weighting limitation. The three 'tests' are nested (the 5-min and 2-min data are the opening minutes of the same 10-min administrations), so they are perfectly dependent by construction; this isolates duration cleanly but means the short versions were performed with a 10-min expectation, which is the opposite confound to the one Basner 2011's PVT-B paper had (different hardware and known durations). Acute total sleep deprivation only - no chronic partial restriction, which is the exposure of interest here."
funding: "Not extracted."
notes: |
  ADDED TO PART A2 BECAUSE THE PVT-B PAPER ALONE IS THIN. Basner, Mollicone & Dinges 2011 reports the
  3-min PVT-B's effect-size attenuation (22.7% on average) but reports NO correlation with the 10-min
  PVT (see the reality-check note in basner2011_pvtb.yaml). Loh 2004 is the independent, earlier,
  differently-designed test of the same question, and it agrees on both of the points the protocol
  depends on:
    (1) sensitivity falls monotonically as the test is shortened - there is no free lunch in going from
        10 min to 3 min;
    (2) the metric that breaks first is the LAPSE-based one, while reaction-speed metrics survive.
  Point (2) is the decisive one for this shard, because it converges with three other independent
  sources on the same conclusion:
    Loh 2004        lapse percentage loses significance at 5 and 2 min; speed metrics do not
    Basner 2011     mean 1/RT rank 1 of 10 under chronic restriction (d_z 1.21); lapses rank 5 (0.91)
    Sunwoo 2012     lapse-count ICC 0.51 vs median-RT ICC 0.69 (n = 372)
    Thompson 2022   error/lapse metric SEM% 32.60-168.69% on a 5-min PVT vs 4.14% for mean RT
  Four independent datasets, four different designs, same answer: use a SPEED metric (mean 1/RT), not
  a lapse count, as the primary outcome of a short daily PVT.

  DISAGREEMENT WITH BASNER ON THE MINIMUM DURATION, REPORTED AS REALITY. Loh 2004 endorses 5 min and is
  non-committal about 2 min; Basner & Dinges 2011 found effect sizes saturating after the THIRD minute
  under chronic partial restriction, and the validated PVT-B is 3 min. Thompson 2022 asserts (citing
  others) that 5 min is "more valid" than 3 min. The literature genuinely does not agree on 3 vs 5 min.
  protocol_basis.md handles this by specifying a 3-min PVT-B (because compliance dominates everything
  else in a self-experiment) with the 355-ms lapse threshold and mean 1/RT as primary, while noting that
  5 min would be strictly better if the subject will tolerate it, and by applying Basner's published
  22.7% effect-size attenuation as a power penalty rather than pretending the short test is free.
shard: "s20_pvt_psychometrics"
