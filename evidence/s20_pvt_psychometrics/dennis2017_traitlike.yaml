rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Abstract-level extraction only (I did not retrieve the full text, so the per-measure ICCs and the PVT-specific value are not in hand - only the published ranges). n = 23 (TSD arm) + 24 (SR arm) with substantial likely overlap of individuals across arms; the recorded n=47 is the sum and should NOT be treated as 47 independent people. Retrospective assembly of repeat participants introduces selection (people who returned for a second study). Same laboratory lineage as yamazaki2020_traitlike and vandongen2004_traitlike."
funding: "Not extracted."
notes: |
  Included because it is the ONLY evidence on whether the vulnerability phenotype is stable over
  the timescale that matters here: this subject has been chronically restricted for ~3 years, and
  the question is whether a 4-week measurement now generalises. It does: intervals ran up to
  3,058 days (8.4 years) for the restriction arm and the ICCs stayed in the 0.72-0.92 band.

  ACCESS LIMITATION, stated honestly: PMC5668275 exists and is open access, but I extracted only
  the PubMed abstract for this record and did not pull the per-measure table, so no PVT-specific
  ICC is recorded here. The PVT-specific trait ICCs used in the protocol come from
  vandongen2004_traitlike (0.675, 20-min PVT lapses) and rupp2012_traitlike (0.89 lapses /
  0.86 speed), both full-text verified.
