notes: |
  ===== PART B7 SUPPORTING RECORD: ONE NIGHT IS NOT ENOUGH, AT ANY DOSE =====
  ACCESS LIMITATION: abstract only. Both the DOI (Crossref) and the PMID (PubMed) resolve to the
  correct title. All quotes below are verbatim from the PubMed abstract; I did not retrieve the full
  text, so the numeric per-dose recovery functions are NOT in this record.

  VERBATIM QUOTES
  ---------------
  Design (this is the best-powered recovery-dose experiment in the field):
  "Intent-to-treat design in which subjects were randomized to 1 of 6 recovery sleep doses (0, 2, 4,
  6, 8, or 10 h TIB) for 1 night following 5 nights of sleep restriction to 4 h TIB."
  "N = 159 healthy adults (aged 22-45 y), median = 29 y)."
  "Following a week of home monitoring with actigraphy and 2 baseline nights of 10 h TIB, subjects
  were randomized to either sleep restriction to 4 h TIB per night for 5 nights followed by
  randomization to 1 of 6 nocturnal acute recovery sleep conditions (N = 142), or to a control
  condition involving 10 h TIB on all nights (N = 17)."

  THE KEY RESULT:
  "Analyses based on return to baseline and on estimated intersection with control condition means
  revealed recovery was incomplete at the 10 h TIB (8.96 h TST) for PVT performance, KSS sleepiness,
  and POMS fatigue. Both TST and SWE were elevated above baseline at the maximum recovery dose of 10 h
  TIB."
  "Neurobehavioral deficits induced by 5 nights of sleep restricted to 4 h improved monotonically as
  acute recovery sleep dose increased, but some deficits remained after 10 h TIB for recovery.
  Complete recovery from such sleep restriction may require a longer sleep period during 1 night,
  and/or multiple nights of recovery sleep."

  FUNCTIONAL FORM (why "one big weekend lie-in" underperforms expectations):
  "While TST, stage 2, REM sleep and NREM slow wave energy (SWE) increased linearly across recovery
  sleep doses, best-fitting neurobehavioral recovery functions were exponential across recovery sleep
  doses for PVT and KSS outcomes, and linear for the MWT."

  A NOTE ON THE SUBJECTIVE MEASURE, WHICH CUTS THE OTHER WAY FROM PEJOVIC 2013
  ---------------------------------------------------------------------------
  Here KSS subjective sleepiness was ALSO still impaired at the 10 h recovery dose, i.e. subjective
  and objective measures agreed. Pejovic 2013 found SSS fully normalised (indeed over-normalised)
  while PVT did not. The difference is the recovery DOSE and DURATION: Banks gave ONE recovery night,
  Pejovic gave TWO nights of 10 h. The honest synthesis for the report is:
    * after ONE recovery night, both subjective and objective measures are still impaired, so the
      subject would correctly feel bad;
    * after TWO nights of extended sleep, the SUBJECTIVE signal switches off (and even overshoots)
      while the OBJECTIVE deficit persists.
  That is precisely the window in which the index subject will wrongly conclude he is fine. This
  nuance should be stated rather than smoothed over.

  ALSO RELEVANT TO PART C9 (habitual-sleep measurement):
  "Following a week of home monitoring with actigraphy..." -> 7 nights of actigraphy is the de facto
  standard run-in in the Dinges lab protocols.

  ALSO RELEVANT TO PART C10 (baseline satiation):
  "2 baseline nights of 10 h TIB" -> the standard debt-clearing baseline before a restriction
  challenge in this lab is 2 nights at 10 h TIB, which Klerman 2005 and Kitamura 2016 both show is
  NOT enough to reach the ad-lib asymptote. The n-of-1 protocol should use a longer satiation run-in.
