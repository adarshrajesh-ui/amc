  notes: "Descriptive psychometric study pooling three datasets; not an intervention study, so RoB2 does not apply. ABSTRACT ONLY - the full text is paywalled at Sleep/OUP and I did not retrieve it, so I have the recommended night counts and the reliability threshold but NOT the individual ICC values per measure per number of nights. n = 224 is the sum of the two reported groups (169 children aged 12-60 months + 55 adolescents aged 11-16 years); the 5-night and 7-night recommendations are stated for the combined child-and-adolescent population, and I could not separate the adolescent-only estimates. Note the published erratum (Sleep 1999 Mar 15;22(2):143), whose content I have not seen - a caution if any specific tabled value is later needed."
funding: "NIH (see paper); E.P. Bradley Hospital / Brown University"
notes: |
  ===== PART C9: THE AGE-APPROPRIATE NIGHT-COUNT RECORD =====
  This is the ONLY record in my Part C9 set whose population actually resembles the index subject.
  Acebo's adolescent subgroup was 55 adolescents aged 11-16 years living at home on SELF-SELECTED
  sleep-wake schedules - i.e. exactly the free-living, socially-constrained, high-variability condition
  the index subject is in, rather than a midlife occupational cohort (Aili 2017, Knutson 2007) or a
  clinical population (AASM 2018). Hence adolescent_match: exact_16_19 despite the 11-16 range.

  VERBATIM QUOTES
  ---------------
  Objective:
  "This study provides estimates of reliability for aggregated values from 1 to 7 recording nights for
  five commonly used actigraphic measures of sleep patterns, reliability as a function of night type
  (weeknight or weekend night), and stability of measures over several months."

  Population and setting:
  "Data are from three studies that obtained 7 nights of actigraph data (using Mini Motionlogger
  actigraphs and associated validated algorithms [ASA]) on children and adolescents living at home on
  self-selected sleep-wake schedules."
  "Participants were 169 children aged 12-60 months, and 55 adolescents aged 11-16 years."

  THE RESULTS THAT MATTER:
  "Up to 28% of weekly recordings may be unacceptable for analysis in young participants because of
  illness, technical problems, and participant noncompliance; studies aiming to collect 5 nights of
  actigraph data should record for at least 1 full week. Reliability estimates for values aggregated
  over any 5 nights were adequate (> or = .70) for sleep start time, wake minutes, and sleep
  efficiency. Measures of sleep minutes and sleep period were less reliable and may require 7 or more
  nights for estimates of stable individual differences. Reliability for 1- or 2-night aggregates were
  poor for all measures. We found significant and high correlations between summer and fall session
  measures for all five variables when weekend nights were included."

  Conclusion:
  "Five or more nights of usable recordings are required to obtain reliable actigraph measures of sleep
  for children and adolescents."

  THREE OPERATIONAL RULES THIS GIVES THE PROTOCOL
  ----------------------------------------------
  1. "Reliability for 1- or 2-night aggregates were poor for ALL measures." So the common practice of a
     weekend-plus-a-weekday spot check is worthless. This independently corroborates the derived
     single-night ICC of 0.236 in knutson2007_actigraphy_variability.yaml.
  2. DURATION IS THE HARD MEASURE. Sleep minutes / sleep period need 7+ nights while timing and
     efficiency need 5. Every source in my Part C9 set agrees on this ordering:
        Acebo 1999 : timing/efficiency 5 nights, DURATION 7+ nights
        Aili 2017  : sleep percent 2 nights, efficiency 5 nights, DURATION >7 nights
        Knutson 2007 (my derivation): DURATION 13 nights for R = 0.80
     Because the protocol's target quantity IS duration, the binding constraint is the largest of
     these, not the smallest.
  3. OVERSAMPLE FOR ATTRITION. "studies aiming to collect 5 nights of actigraph data should record for
     at least 1 full week" - a 40% oversample. Applying the same 28% loss ceiling to a 14-usable-night
     target gives 14/0.72 = 19.4, i.e. schedule ~20 nights of recording to bank 14 usable ones. For a
     self-experiment run by the subject himself, compliance is plausibly better than in a
     12-60-month-old cohort, but the 28% figure is the only empirical loss rate I have and using it is
     the conservative choice.

  WEEKEND STRUCTURE
  "reliability as a function of night type (weeknight or weekend night)" was an explicit aim and
  "significant and high correlations between summer and fall session measures for all five variables
  WHEN WEEKEND NIGHTS WERE INCLUDED" - i.e. stability over months required the weekend nights to be
  present. This argues AGAINST Aili 2017's suggestion of restricting measurement to weeknights only:
  for a subject whose entire exposure pattern is a weekday/weekend oscillation, dropping weekends
  would discard the signal of interest. Record all 7 nights per week and model weekday/weekend
  separately.
