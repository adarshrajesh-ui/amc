effects:
  # ===== THE HEADLINE: EVERY SUBJECT SLEPT MORE THAN HIS/HER HABITUAL DURATION ON NIGHT 1 =====
  - outcome_domain: sleep_need
    outcome_construct: first_night_tst_increase_under_16h_sleep_opportunity
    exposure:
      type: sleep_extension
      dose_h: 16.0
      referent_h: null
      duration_days: 1
      contrast_label: "total sleep time on day 1 of a 16 h/day sleep opportunity (12 h nocturnal + 4 h midday) minus the subject's own habitual bedrest duration measured over the preceding week"
    scale: hours
    unit: "hours of additional total sleep time"
    value: 4.9
    se: null
    ci: null
    conversion_formula: "Reported directly: 'On the first day of extended sleep opportunity, the total sleep time of all individuals was greater than their habitual bedrest duration; the average increase in total sleep time was 4.9 hours (P = 0.001).' No SD or SE is reported for the mean increase, so se: null."
    from_figure: false
    inferred_from_ci: false
    direction_note: "POSITIVE = slept this many hours MORE than habitual. A 4.9 h first-night rebound in healthy 18-32 year olds who were NOT complaining of sleepiness is the magnitude of the latent sleep debt these young adults were carrying."
    covariates: []
    followup_years: null
    cohort_family: BWH_bedrest_extension
  - outcome_domain: sleep_need
    outcome_construct: tst_on_third_day_of_16h_sleep_opportunity
    exposure:
      type: sleep_extension
      dose_h: 16.0
      referent_h: null
      duration_days: 3
      contrast_label: "average total sleep time on the THIRD (last) day of the 16 h/day bedrest-extension protocol"
    scale: hours
    unit: "hours of total sleep time per 24 h"
    value: 10.2
    se: null
    ci: null
    conversion_formula: "Reported directly in the Discussion: 'On average, volunteers slept 10.2 hours on the third day of bedrest extension in this protocol.' No dispersion reported, se: null."
    from_figure: false
    inferred_from_ci: false
    direction_note: "Still 10.2 h at day 3, i.e. STILL WELL ABOVE any plausible steady-state sleep need. This is the key protocol-design number: 3 days of ad-lib sleep is NOT long enough to reach the asymptote, so 3 days cannot be used to measure sleep need."
    covariates: []
    followup_years: null
    cohort_family: BWH_bedrest_extension
  - outcome_domain: sleep_need
    outcome_construct: habitual_bedrest_duration_range_in_young_adults
    exposure:
      type: descriptive
      dose_h: null
      referent_h: null
      duration_days: 7
      contrast_label: "range of habitual bedrest duration across 17 healthy 18-32 year olds, from 1 week of diary + time-stamped call-ins + wrist actigraphy"
    scale: hours
    unit: "hours (range of habitual bedrest duration)"
    value: 4.2
    se: null
    ci: [6.1, 10.3]
    conversion_formula: "Reported directly: 'The habitual bedrest duration varied from 6.1 to 10.3 hours.' value = 10.3 - 6.1 = 4.2 h span; the ci field carries the reported MIN and MAX (not a confidence interval - flagged because the schema has no range field)."
    from_figure: false
    inferred_from_ci: false
    direction_note: "Descriptive spread, not a harm. A 4.2 h spread in habitual duration among healthy young adults is why sleep need must be measured for THIS subject rather than assumed from a population mean."
    covariates: []
    followup_years: null
    cohort_family: BWH_bedrest_extension
  - outcome_domain: sleep_need
    outcome_construct: mslt_short_latency_prevalence_in_healthy_young_adults
    exposure:
      type: descriptive
      dose_h: null
      referent_h: null
      duration_days: null
      contrast_label: "proportion of healthy young adults with at least one MSLT sleep latency under 5 minutes on their habitual sleep schedule"
    scale: probability
    unit: "proportion of subjects"
    value: 0.824
    se: null
    ci: null
    conversion_formula: "Reported directly: '14 of the 17 volunteers had at least one sleep latency (out of five possible opportunities) less than 5 minutes'. 14/17 = 0.8235."
    from_figure: false
    inferred_from_ci: false
    direction_note: "Higher = more pathologically sleepy. 82% of healthy, non-complaining 18-32 year olds on their OWN habitual schedule fell asleep in under 5 minutes at least once - a level conventionally read as severe sleepiness. Objective evidence that the normal young-adult baseline is already sleep-deprived."
    covariates: []
    followup_years: null
