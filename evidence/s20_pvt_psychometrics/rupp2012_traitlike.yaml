rob:
  tool: RoB2
  judgement: some_concerns
  notes: "n = 19; variance-component SEs are 33-37% of the point estimates so the ICCs are imprecise. The two 'replicate' exposures were deliberately DIFFERENT (63 h TSD vs 7 nights of 3 h TIB), which is the point of the paper (cross-paradigm generalisation) but means sigma_ws is not a pure test-retest term. An erratum exists (Sleep. 2013 Jun;36(6):959)."
funding: "US Army Medical Research and Materiel Command / Walter Reed Army Institute of Research (military laboratory)."
notes: |
  FULL PUBLISHED TABLE 3 rows I could align, verified by recomputing ICC from the components:
    Measure      sigma2_bs (SE)     sigma2_ws (SE)    ICC   check
    PVT lapses    83.90 (30.62)      10.45 (3.59)     0.89  83.90/94.35 = 0.8892  OK
    PVT speed      0.74 (0.28)        0.12 (0.04)     0.86  0.74/0.86   = 0.8605  OK
    MATH          35.82 (15.52)      17.21 (5.9)      0.68  35.82/53.03 = 0.6755  OK
    1-Back       729.38 (268.46)    102.50 (35.16)    0.88  729.38/831.88 = 0.8768 OK
  Mood/other ICCs from the abstract: vigor 0.91, fatigue 0.73, happiness 0.85.

  Table 4 repeats the analysis WITH baseline performance as a covariate; PVT lapses stayed at
  ICC = 0.89 (sigma2_bs 52.74 (20.66), sigma2_ws 6.77 (2.62); check 52.74/59.51 = 0.886), but PVT
  SPEED collapsed to ICC = 0.54 (sigma2_bs 0.19 (0.12), sigma2_ws 0.16 (0.06); check 0.19/0.35 =
  0.543). Interpretation that matters for the protocol: much of the apparent trait-like stability
  of PVT RESPONSE SPEED is inherited from stable baseline speed differences, whereas trait-like
  stability of LAPSE vulnerability survives baseline adjustment. For an n-of-1 design (where the
  person is their own baseline) this is reassuring in one direction - baseline aptitude cancels -
  and a caution in the other: the person's own baseline speed must be measured well.

  DESIGN detail worth copying: both sleep-loss conditions were preceded by SEVEN in-laboratory
  nights at 10 h TIB, i.e. a long sleep-satiation run-in, and followed by 3 recovery nights at 8 h
  TIB, with the two conditions separated by 2-4 weeks. That is the closest published analogue of an
  adequately washed-out 2-period crossover for sleep dose.
