notes: |
  ===== PART C8: A FULLY WORKED, REAL EXAMPLE OF A SERIES OF N-OF-1 RCTs =====
  Included for METHOD ONLY. The clinical topic (statins and muscle symptoms) has nothing to do with
  sleep; what makes this record valuable is that it is a large, rigorous, fully reported n-of-1 series
  that states its individual-level power, its randomisation scheme, its washout handling and its exact
  statistical model. Open access via the NIHR Journals Library; PDF downloaded from
  https://njl-admin.nihr.ac.uk/document/download/2036169 and text extracted with pdfminer.six.

  THE DESIGN, VERBATIM
  --------------------
  "Participants were randomised to a sequence of six 2-month treatment periods during which they
  received either atorvastatin 20 mg daily or placebo."
  "duration of the trial was 1 year for each participant and comprised six 2-month treatment periods
  (three of placebo and three of active treatment) in a randomly allocated order"
  "consisted of six treatment periods of 8 weeks' duration each (i.e. 56 daily capsules). During each
  treatment period participants received 20 mg of atorvastatin or placebo."
  "Eight treatment sequences were defined (Table 1) and given an equal corresponding range of values
  between 0 and 1."
  Blinding: "Patients, general practice staff and trial staff were blind to allocation in each
  treatment period."
  Outcome timing: "On the last week of each treatment period, participants rated their [symptoms]"
  and "Secondary outcomes were collected on the last day of each treatment period".

  THE POWER STATEMENT, VERBATIM (the most important sentence in this record)
  -------------------------------------------------------------------------
  "To increase the statistical power for the analysis of individual N-of-1 trials, we asked
  participants to report symptoms daily in the last week of each period, rather than once per period.
  Full adherence throughout the trial would provide between 55% and 70% power to detect effects of
  >= 10 mm for individual treatment comparisons."

  And on attrition:
  "We anticipated that some patients will not provide complete data in each treatment period, and that
  some would not complete their 12-month follow-up. By designing this study as a series of N-of-1
  trials, which offer individual participant benefit in the form of an individualised estimate of
  effect, we hoped to minimise this type of dropout. However, we accounted for this in our sample size
  calculation by allowing for 40% loss to follow-up."

  THE ANALYSIS MODEL, VERBATIM (this is the template for the self-experiment's analysis)
  ------------------------------------------------------------------------------------
  "The primary analysis was a linear mixed model for VAS muscle symptom scores with random effects for
  participant and treatment. Residual errors were modelled using a first-order auto-regressive error
  structure within each treatment period to account for correlation between the seven daily
  measurements, with robust standard errors to account for non-normality of the VAS scores. Although
  VAS muscle symptom scores are not normally distributed, analysing such data using normal-based
  methods is likely to be a sufficiently robust approach. All tests were two-sided, with a p-value of
  < 0.05 being considered as statistically significant."

  Individual feedback (relevant because our subject IS the participant):
  "At the end of the trial, patients were shown numerical and graphical summaries of their individual
  data in relation to their statin and placebo periods, and were asked if this was helpful and whether
  or not they would restart a statin."

  FIVE TRANSFERABLE DESIGN LESSONS FOR THE 4-WEEK SLEEP SELF-EXPERIMENT
  --------------------------------------------------------------------
  1. POWER LEVER = REPEATED MEASUREMENTS WITHIN PERIOD. StatinWISE bought power by moving from 1 to 7
     measurements per period. A daily PVT is the sleep analogue and is exactly why a 3-minute PVT-B
     (which a real person will actually do every day) may beat a 10-minute PVT that gets skipped.
  2. AUTOCORRELATION MUST BE MODELLED, NOT IGNORED. Their AR(1) within-period error structure is the
     right default for a daily PVT series too. A naive paired t-test over daily values will
     UNDERSTATE the standard error, which is why the n I compute in protocol_basis.md is a lower bound.
  3. ROBUST STANDARD ERRORS for a non-normal outcome. PVT lapse counts are strongly right-skewed and
     bounded below at zero, so the same remedy applies (or analyse 1/RT, which Basner & Dinges 2011
     show is near-normal, or the sqrt(x)+sqrt(x+1) lapse transform Pejovic 2013 used).
  4. THREE CROSSOVERS (6 periods) IS WHAT A SERIOUS N-OF-1 LOOKS LIKE, and it still only reached
     55-70% individual power for a moderate effect. A 4-week sleep protocol therefore cannot promise
     80% individual power on a single 2-period comparison - the honest framing is either more pairs,
     or daily measurements, or both, and an explicit statement of the power actually achieved.
  5. PRE-GENERATED, EXTERNALLY HELD RANDOMISATION SEQUENCE. Eight fixed sequences with equal
     probability. The self-experiment analogue: generate the randomised night-order in advance,
     record it before starting, and do not regenerate it.

  A CAUTION THE REPORT SHOULD NOT SKIP
  ------------------------------------
  StatinWISE could blind its intervention with an identical placebo capsule. A sleep-duration
  manipulation CANNOT be blinded. So StatinWISE's 55-70% individual power is an OPTIMISTIC ceiling
  for our design in one respect (they had blinding) and a pessimistic floor in another (their outcome
  was a subjective VAS with large day-to-day noise; a PVT metric may be less noisy). Do not transfer
  the 55-70% figure directly as our expected power - it is a reality anchor, not our estimate.
