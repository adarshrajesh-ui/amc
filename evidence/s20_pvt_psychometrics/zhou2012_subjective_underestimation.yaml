notes: |
  ===== PART B6: DIRECT EVIDENCE OF UNDERESTIMATION, IN YOUNG MALES =====
  This is the cleanest published statement that sleep-restricted people under-estimate their own
  impairment, and it is in 27 young healthy MALES - the closest population match in my shard to an
  18-year-old male. Its analytic design is also the one the n-of-1 protocol should copy: both the
  subjective and the objective measure were converted to z-scores against EACH SUBJECT'S OWN rested
  baseline mean and SD, which makes the two directly comparable on a common within-person scale.

  ACCESS LIMITATION - STATED PLAINLY: abstract only. Unpaywall reports is_oa = true for this DOI but
  returns no usable PDF location, and there is no PMC deposit. I therefore have the DIRECTION and the
  MODERATOR (circadian phase) but NOT the z-score magnitudes or any correlation coefficient. The
  single effect in this record is a sign-only placeholder and must not be pooled as a magnitude.

  VERBATIM QUOTES
  ---------------
  Question and design:
  "Subjective alertness may provide some insight into reduced performance capacity under conditions
  suboptimal to neurobehavioural functioning, yet the accuracy of this insight remains unclear. We
  therefore investigated whether subjective alertness reflects the full extent of neurobehavioural
  impairment during the biological night when sleep is restricted. Twenty-seven young healthy males
  were assigned to a standard forced desynchrony (FD) protocol (n = 13; 9.33 h in bed/28 h day) or a
  sleep-restricted FD protocol (n = 14; 4.67 h in bed/28 h day)."

  THE ANALYTIC TRICK WORTH COPYING (within-person z-scoring):
  "For both protocols, subjective alertness and neurobehavioural performance were measured using a
  visual analogue scale (VAS) and the psychomotor vigilance task (PVT), respectively; both measures
  were given at various combinations of prior wake and circadian phase (biological night versus
  biological day). Scores on both measures were standardized within individuals against their
  respective baseline average and standard deviation."

  THE RESULT:
  "We found that PVT performance and VAS rating deviated from their respective baseline to a similar
  extent during the standard protocol, yet a greater deviation was observed for PVT performance than
  VAS rating during the sleep-restricted protocol. The discrepancy between the two measures during the
  sleep-restricted protocol was particularly prominent during the biological night compared with the
  biological day."

  THE CONCLUSION (quote this):
  "Thus, subjective alertness did not reflect the full extent of performance impairment when sleep was
  restricted, particularly during the biological night. Given that subjective alertness is often the
  only available information upon which performance capacity is assessed, our results suggest that
  sleep-restricted individuals are likely to under-estimate neurobehavioural impairment, particularly
  during the biological night."

  WHY THE MODERATOR MATTERS FOR THE PROTOCOL
  ------------------------------------------
  The mismatch is largest during the BIOLOGICAL NIGHT. For a college student, the biological night
  includes the late-evening and small-hours study window in which he is most likely to be working and
  most likely to be judging himself as "fine". The protocol implication is the same one Cohen 2010
  gives from the objective side: schedule at least one fixed LATE test slot, not just a morning one,
  and record a subjective rating at the same instants as the PVT so the individual mismatch can be
  quantified for this subject rather than assumed.

  NOTE ON DIRECTIONAL CONSISTENCY WITH THE REST OF THE SHARD
  ---------------------------------------------------------
  Zhou 2012 (subjective deviation SMALLER than objective) is consistent with:
    * vandongen2003_subjective_plateau.yaml - subjective response saturates (theta = 0.24) while PVT
      impairment accumulates near-linearly (theta = 0.78) in the same subjects;
    * pejovic2013_recovery_dissociation.yaml - after 2 recovery nights the subjective signal switches
      off while the PVT deficit persists;
    * kitamura2016_adlib_sleep_debt.yaml - subjects with a mean 3.2 h first-night sleep rebound
      reported no awareness of sleep loss at all.
  Note the apparent tension with Pejovic 2013, where the SSS effect of restriction (|d_z| = 0.97) was
  LARGER than the PVT lapse effect (|d_z| = 0.33). These are not contradictory: subjective sleepiness
  is a sensitive detector of a CHANGE in sleep, but a badly calibrated and quickly-resetting indicator
  of the accumulated PERFORMANCE deficit. The report should make this distinction explicitly instead
  of claiming that subjective ratings are simply insensitive.
