rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Abstract-only. Sample is 75 MALE primary-school students, mean age 11.82 (SD 1.12) - younger than the 18-19 y/o target, and single-sex; I set adolescent_match to exact_16_19 because it is the only PEDIATRIC/ADOLESCENT PVT reliability estimate available and is far closer in age than the adult alternatives, but the age gap (11.8 vs 19) is real and the downstream model should inflate uncertainty accordingly. Test-retest subsample only n=37. Palm PDA hardware, timing precision not characterised (contrast the PC-PVT papers, which show hardware timing can add tens of ms of error)."
funding: "Not extracted."
notes: |
  Kept for two reasons: (a) it is the ONLY reliability estimate in a young sample, and (b) it is
  the only one obtained in a genuinely uncontrolled, real-world environment - which is exactly the
  setting of an at-home student self-experiment. The finding that classroom vs isolated-room
  administration did not shift mean RT is direct evidence that a bedroom/dorm-administered PVT is
  not automatically invalid, provided the clock time and the device are held constant.

  The order effect for lapses in the isolated setting is another data point on the
  practice/order-effect question and again points away from lapse count as the primary outcome.
