  notes: "Software/engineering validation, RoB2 inapplicable. Abstract-only access (Elsevier, not in PMC), and the abstract is truncated mid-sentence in the PubMed record so the full hardware recipe is not extractable. Windows 10 only as published in 2018; current OS compatibility not verified. Free-download status of version 2.0 not confirmed from the abstract (version 1.0 was explicitly free)."
