notes: |
  PART A5 ANSWER, part 2 of 3. Updates khitrov2014_pcpvt. Two additions relevant to the protocol:
    1. Quantifies the hardware risk precisely: 15/44 configurations acceptable. Any protocol that
       says "install a PVT app and use it daily" without pinning hardware is measuring an unknown
       amount of device noise on top of the biology.
    2. PC-PVT 2.0 couples the test schedule to the subject's sleep/wake AND CAFFEINE schedule and
       produces individualised performance predictions. Verbatim: "the PC-PVT 2.0 for Windows 10
       operating system, which has the capability to couple PVT tests of a study protocol with the
       study's sleep/wake and caffeine schedules, and make real-time individualized predictions of
       PVT performance for such schedules." Caffeine scheduling is a first-class confounder in a
       student self-experiment and this tool at least makes it explicit.
