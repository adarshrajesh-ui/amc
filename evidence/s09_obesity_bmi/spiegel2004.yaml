rob:
  tool: RoB2
  judgement: some_concerns
  notes: Randomised crossover, tightly controlled caloric intake and activity - a genuine mechanistic experiment. But n=12 young men only, ONLY 2 DAYS per condition, and the comparator is sleep EXTENSION (10 h) rather than normal sleep, which widens the contrast to 6 h and inflates the apparent effect. Authors note they did not measure energy expenditure.
funding: not stated in abstract
notes: 'BEST AGE MATCH for the hormone question (mean age 22 +/- 2 y, BMI 23.6 +/- 2.0, all male - closely matches our subject). BUT: the 4 h vs 10 h contrast is much larger than our subject''s exposure, the protocol is only 2 days, and nedeltcheva2009 failed to replicate the leptin/ghrelin changes over 14 days. Treat the 18%/28% figures as an acute upper bound, not a chronic steady state.'
