rob:
  tool: RoB2
  judgement: some_concerns
  notes: Randomised parallel groups but small and unequal (CON n=8 vs SR/WR n=14 each), so the between-group weight comparison is underpowered. Ad libitum in-laboratory feeding causes weight gain in ALL arms, which is the key interpretive limitation.
funding: NIH; Office of Naval Research; PAC-12 conference; Somalogic (K.P. Wright disclosures)
notes: 'BEST AGE MATCH of the laboratory studies (healthy young adults, mean age 23-27 y across groups) AND the only one that tests the weekday-restriction/weekend-catch-up pattern our subject actually has. Two findings matter: (1) weekend recovery sleep did NOT prevent weight gain or insulin-sensitivity loss; (2) controls gained nearly as much weight, so the sleep-specific weight effect in this protocol is small and imprecise.'
