rob:
  tool: RoB2
  judgement: some_concerns
  notes: Randomised-order crossover, 14 days per condition (longest of the classic protocols), objective TEE. But n=11, mean age 39 y, mean BMI 26.5, and sleep was reduced by only 122 min/night - a milder dose than Spiegel's 4 h.
funding: not stated in abstract
notes: 'CRITICAL COUNTERWEIGHT to the leptin/ghrelin narrative: with a 2-week protocol and objectively measured 122 min/night sleep loss, NO leptin or ghrelin change was found, and the intake effect was confined to snacks (meals unchanged).'
