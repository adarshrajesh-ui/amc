  quote: Furthermore, students with 3 or more h of CUS had significantly lower BMI z-scores (beta = -0.18, p < 0.001), an association that was also observed in those with perceived insufficient sleep (beta = -0.16, p = 0.003). The analysis showed a dose-dependent pattern, with greater weekend CUS being associated with a stepwise reduction in BMI z-scores.
rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: 'Very large (n = 12,434) and in exactly the target age band, but CROSS-SECTIONAL with self-reported sleep and calculated (not measured) BMI. Reverse causation is not excludable and is arguably the more likely explanation: adolescents with obesity sleep worse and catch up less.'
funding: authors declare no competing financial interests
notes: 'LARGEST AVAILABLE DATASET ON THE EXACT EXPOSURE PATTERN (short weekdays + weekend catch-up) IN THE EXACT AGE BAND. Corroborates choi2023 in direction and size. Both are cross-sectional and both conflict with depner2019''s randomised laboratory finding that weekend recovery sleep did not prevent weight gain. Authors'' framing: ''Weekend CUS may serve as an important compensatory mechanism for adolescents to reduce the risk of being overweight or obese.'''
