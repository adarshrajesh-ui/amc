rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: Pools predominantly CROSS-SECTIONAL studies; authors state causal inference is difficult. Adult per-hour BMI coefficient is ~10x larger than prospective pediatric estimates (Miller 2018), consistent with reverse causation and confounding inflating cross-sectional slopes.
funding: not stated in abstract
notes: 'This is the most-cited source of the ''-0.35 kg/m2 per hour'' figure. It is cross-sectional and should be treated as an UPPER bound. Authors'' own conclusion: ''Causal inference is difficult due to lack of control for important confounders and inconsistent evidence of temporal sequence in prospective studies.'' 634,511 participants (30,002 children and 604,509 adults).'
