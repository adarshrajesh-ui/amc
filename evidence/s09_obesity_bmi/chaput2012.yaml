rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: 'CRITICAL LIMITATION: this is an OBSERVATIONAL, NON-RANDOMISED comparison of n=23 vs n=20 self-selected sleep-changers within an obesity-enriched family cohort. People who spontaneously start sleeping more are very likely to differ in health behaviour, shift work, life stage and stress. Confounding by indication is severe. The observed contrast is also ''less future gain'', NOT ''loss of previously gained weight''.'
funding: not stated in abstract
notes: 'THE MOST DIRECTLY RELEVANT REVERSIBILITY RECORD IN THE PUBLISHED LITERATURE, and it is weak: n=43 short sleepers split into 23 who normalised and 20 who did not, unrandomised, adults aged 18-64. The authors'' own framing is deliberately cautious: ''This study suggests for the first time that shifting sleep duration from a short to a healthier length is associated with an attenuation of fat mass gain.'' ATTENUATION OF GAIN, not reversal of gain. Same cohort as chaput2008.'
