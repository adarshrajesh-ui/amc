rob:
  tool: RoB2
  judgement: some_concerns
  notes: Largest laboratory sample to date (n=225) but ~8:1 allocation to restriction, only 37 subjects had caloric intake data (31 restricted, 6 control), and the restriction condition confounds short sleep with a 04:00 bedtime (circadian misalignment). Only 5 nights, so no information on durable weight change.
funding: NIH (not specified in abstract)
notes: The 29.4-percentage-point intake effect has an unreliable derived se (see conversion_formula) - the downstream pooler should prefer the +385 kcal/day pooled estimate from alkhatib2017 and treat this record's intake effect as corroborative only. Weight-gain effect (0.86 kg over 5 nights) is the cleanest number here.
