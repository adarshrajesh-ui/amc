rob:
  tool: MR-STROBE
  judgement: moderate
  notes: 'Large one-sample MR with linear and nonlinear (stratified) analyses. TWO MAJOR CAVEATS: (1) the outcome is PREDICTED, not measured, VAT (a model-imputed phenotype), which can inflate precision; (2) one-sample MR in UK Biobank is vulnerable to weak-instrument bias toward the observational estimate. Mean age 57 y - poor transport to 18 y.'
funding: not stated in abstract
notes: 'The one MR result in this shard with a clearly non-null adiposity effect, and it is for VISCERAL FAT rather than BMI, with an L-shaped dose-response: ''The causal association of sleep duration with VAT was L-type. Our findings support that short sleep duration is a risk factor for increasing VAT.'' Note the discordance: MR finds an effect on visceral fat depot but not on BMI (hayes2023), which is compatible with body-composition redistribution without a BMI change.'
shard: s09_obesity_bmi
