  notes: Umbrella review; does not report pooled effect sizes for obesity, only directional concordance between observational and MR evidence. Its conclusion that MR supports causality for obesity conflicts with the specific MR estimates extracted in hayes2023 and wang2019 (adults) - the umbrella review does not name which MR study or which adiposity trait carried the obesity signal.
funding: not stated in abstract
notes: 'CONTEXT-ONLY RECORD, included because it is the highest-level synthesis of the MR-vs-observational comparison. Verbatim: ''Short sleep duration was associated with a higher risk of obesity, type 2 diabetes (T2D), hypertension, stroke, and coronary heart disease (CHD) in observational studies, while a causal role was only demonstrated in obesity, hypertension, and CHD by MR.'' DO NOT TREAT AS AN EFFECT ESTIMATE: no magnitude is given, and the primary MR papers retrieved in this shard (hayes2023 for adult BMI and clinical obesity; wang2019 for adult BMI) report NULLS. The discrepancy is unresolved and is flagged as a gap in station_report.md.'
