rob:
  tool: RoB2
  judgement: some_concerns
  notes: Randomised crossover with whole-room indirect calorimetry (gold-standard measurement) but n=10 NON-OBESE PREMENOPAUSAL WOMEN ONLY, 3 nights per condition. Severely underpowered and not transportable to an 18-year-old male.
funding: not stated in abstract
notes: 'Narrows down WHERE the expenditure story can live. Authors'' own redirection is the useful conclusion: ''In exploring a role of sleep duration on EE, research should focus on potential alterations in physical activity to explain the increased obesity risk in short sleepers.'' i.e. if short sleep alters expenditure it is probably through activity, not thermogenesis - and reduced daytime activity would work AGAINST the Markwald offset.'
