funding: not stated in abstract
notes: 'THE requested dose-response per-hour coefficient for adults: RR 1.09 (1.05-1.14) per hour below 7 h. Applied to our subject''s ~2 h weekday deficit (5-6 h vs 7-8 h) this implies an obesity RR on the order of 1.09^2 = 1.19 if the weekday exposure were his whole-week exposure - it is not, because he sleeps 7-8 h on weekends/holidays, so the effective annualised deficit is smaller.'
