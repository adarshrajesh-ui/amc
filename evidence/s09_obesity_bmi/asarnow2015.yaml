  quote: Later average bedtime during the workweek, in hours, from adolescence to adulthood was associated with an increase in BMI over time (b = 0.035 kg/m(2) per min later bedtime per 6 years; standard error = 0.016; t = 2.12, degrees of freedom = 3,238, P < 0.05). These results remained significant after controlling for demographic characteristics and baseline BMI.
rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: Three waves of a nationally representative cohort spanning exactly the age transition of interest, with adjustment for baseline BMI. Self-reported bedtime and BMI in Add Health waves. The effect is borderline (t = 2.12, P just under 0.05) and the reported units ('in hours' in the sentence but 'per min' in the coefficient) are internally ambiguous in the abstract.
funding: not stated in abstract
notes: 'MECHANISTICALLY IMPORTANT DISSOCIATION for our subject, whose late-night studying implies both short sleep AND late bedtimes. Verbatim: ''Although sleep duration, screen time, and exercise frequency did not attenuate the relationship between workday bedtime and BMI over time, fast-food consumption was recognized as a significant partial mediator of the relationship between bedtimes and BMI longitudinally.'' Same cohort as suglia2014, sokol2020, krueger2015 (Add_Health) - DO NOT POOL AS INDEPENDENT. Note the unit ambiguity flagged in rob.notes when using this coefficient.'
