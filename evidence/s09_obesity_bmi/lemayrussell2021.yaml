  quote: Wake time (p = 0.03) and sleep midpoint (p = 0.02) were inversely associated with 1-year fat mass, such that earlier wake time and midpoint were associated with higher 1-year fat mass. No other facet of sleep was significantly associated with 1-year fat mass (p > 0.09).
rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: 'Objective actigraphy over 14 days and objectively measured fat mass - the best exposure and outcome measurement of any observational record here. But it is a CONVENIENCE SAMPLE of only 137 youths with 1-year follow-up, so it is underpowered to detect the small effects that the prospective meta-analyses estimate (Miller 2018: -0.03 kg/m2 per hour). Treat as ''no signal detected at this power'', not ''effect ruled out''. Age 8-17 (mean 12.5) is younger than our subject.'
funding: NIH intramural (NICHD, NIDDK); US Government employees
notes: IMPORTANT because it is T4 (objective exposure). The self-report literature finds duration effects; the one objectively-measured prospective paediatric study here does not, and the significant findings run in the COUNTERINTUITIVE direction (earlier wake time predicted MORE fat gain). Note the direction of the timing finding is opposite to asarnow2015's late-bedtime finding; together they indicate the timing literature is not yet coherent.
