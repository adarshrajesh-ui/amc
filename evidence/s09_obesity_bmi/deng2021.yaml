rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: Prospective cohorts only. Crucially, the dose-response signal was confined to ages 1-13; no significant dose-response stratum was reported for adolescents >13 y, which directly limits transportability to a 16-19 year old.
funding: not stated in abstract
notes: 'IMPORTANT LIMITATION for this shard: authors conclude the effect is concentrated ''especially within 3-13 years of age''. No >13 y dose-response stratum was significant, i.e. the strongest paediatric dose-response evidence does NOT cover our subject''s age band.'
