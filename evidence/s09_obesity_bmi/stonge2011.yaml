  direction_note: NEGATIVE/NULL = energy expenditure did NOT rise (in fact trivially fell). Directly contradicts Markwald 2013's +111 kcal/d. Under this study's numbers there is NO expenditure offset, so the full ~296 kcal/d intake surplus accrues.
  covariates: []
  followup_years: null
  cohort_family: null
  quote: 'Resting metabolic rate (short sleep: 1455.4 +/- 129.0 kcal/d; habitual sleep: 1486.5 +/- 129.5 kcal/d; P = 0.136) and total energy expenditure (short sleep: 2589.2 +/- 526.5 kcal/d; habitual sleep: 2611.1 +/- 529.0 kcal/d; P = 0.832) did not differ significantly between sleep phases.'
rob:
  tool: RoB2
  judgement: some_concerns
  notes: Randomised crossover with objective DLW expenditure - a strength. But intake measured on a SINGLE day (day 5), participants aged 30-49 y (poor match to an 18-year-old), and only 5 nights per condition.
funding: not stated in abstract; registered NCT00935402
notes: 'Authors'' own conditional framing is important for the reversibility question: ''If sustained, as observed, and not compensated by increased energy expenditure, the dietary intakes of individuals undergoing short sleep predispose to obesity.'' Both conditions of that ''if'' are unverified over months-to-years timescales.'
