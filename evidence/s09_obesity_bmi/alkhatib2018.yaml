rob:
  tool: RoB2
  judgement: some_concerns
  notes: Randomised, free-living, actigraphy-verified, 100% participation with 6.5% attrition - good conduct. But explicitly a FEASIBILITY PILOT (n=42, normal-weight participants), dietary intake by self-reported food diaries, only 4 weeks, and underpowered for energy-balance endpoints. The significant free-sugar finding survived only in a plausible-reporters sensitivity analysis for several nutrients.
funding: not stated in abstract; ClinicalTrials.gov NCT02787577
notes: 'Included as the honest counterweight to tasali2022: a second randomised sleep-extension trial in habitual short sleepers found NO energy-balance effect. The key mechanistic detail is the leaky conversion of time in bed to sleep (+0:55 h in bed -> only +0:21 h sleep), which caps the achievable dose of any real-world sleep-normalisation attempt.'
