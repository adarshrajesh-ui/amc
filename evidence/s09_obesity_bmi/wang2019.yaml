rob:
  tool: MR-STROBE
  judgement: moderate
  notes: Well-designed triangulation (observational cohort + MR in the same paper). 54-SNP instrument for sleep duration is weak. The sex-specific longitudinal finding (girls only) is likely a subgroup finding and should not be over-interpreted.
funding: not stated in abstract
notes: 'Authors'' own hedged conclusion: ''A small beneficial effect of sleep on BMI in children cannot be ruled out.'' That is the honest ceiling of the MR evidence for young people. The MR estimate for children (-0.29 SD/h) is ~3x smaller than hayes2023''s unstable -0.93 SD/h, which supports treating the latter as inflated.'
