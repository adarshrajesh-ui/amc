  quote: Short sleep was associated with low leptin (p for slope = 0.01), with a predicted 15.5% lower leptin for habitual sleep of 5 h versus 8 h, and high ghrelin (p for slope = 0.008), with a predicted 14.9% higher ghrelin for nocturnal (polysomnographic) sleep of 5 h versus 8 h, independent of BMI.
- outcome_domain: anthropometric
  outcome_construct: bmi_per_hour_less_sleep
  exposure:
    type: per_hour_less_sleep
    dose_h: 5.0
    referent_h: 8.0
    duration_days: null
    contrast_label: average nightly sleep 8 h -> 5 h, quadratic-fit predicted BMI, at cohort mean age 53.1 y
  scale: per_hour_beta
  unit: kg/m2 per hour less sleep
  value: 0.3667
  se: null
  ci: null
  conversion_formula: 'Reported: BMI rises from 31.3 to 32.4 (+3.6%) going from 8 h to 5 h, i.e. +1.1 kg/m2 over 3 h = +0.367 kg/m2 per hour. No SE reported for the predicted values, so se is null. NOTE the curve is quadratic, so a single per-hour slope is an approximation over this interval only.'
  from_figure: false
  inferred_from_ci: false
  direction_note: positive = each hour LESS sleep associated with +0.37 kg/m2 (harm). Almost identical in magnitude to Cappuccio 2008's cross-sectional -0.35 kg/m2/h, and ~12x the prospective paediatric estimate (Miller 2018, 0.03 kg/m2/h).
  covariates:
  - age
  - sex
  followup_years: null
  cohort_family: Wisconsin_Sleep_Cohort
  quote: An increase in BMI from 31.3 to 32.4 (+3.6%) corresponded to an average nightly sleep duration decrease from 8 h to 5 h, as estimated at the mean age (53.1 y) and sex distribution (54.4% male) of the sample with available sleep diary data.
rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: Population-based sample with objective polysomnography and 6-day sleep diaries - strong exposure measurement. But the hormone-BMI analysis is CROSS-SECTIONAL, mean age 53 y, mean BMI ~31 (obese), so it is a poor transport to a lean 18-year-old. Direction of causation is not established.
funding: Howard Hughes Medical Institute / NIH (Wisconsin Sleep Cohort)
notes: 'The requested ''Wisconsin Sleep Cohort ghrelin/leptin paper''. Verbatim on the shape: ''The minimum BMI was predicted at 7.7 h of average nightly sleep. The most striking portion of the curve was for persons sleeping less than 8 h (74.4% of the sample), where increased BMI was proportional to decreased sleep.'' The +3.6% BMI figure is computed at BMI ~31-32 in 53-year-olds; rescaled to an 18-year-old at BMI 22 the same PROPORTIONAL effect would be ~0.8 kg/m2 over a 3 h deficit, but this is an extrapolation the paper does not license.'
