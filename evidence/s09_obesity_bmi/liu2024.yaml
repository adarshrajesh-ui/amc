  quote: Our meta-analysis showed no significant overall effect on children's BMI as a result of participation in an intervention with a sleep component (Cohen's d = 0.18, 95% CI= -0.04, 0.40, Z = 1.56, P = .11), though caution is warranted due to substantial heterogeneity observed across studies (Tau2 = 0.08; X2 = 23.05, df = 7; I2 = 83.73%).
rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: PROSPERO-registered, RoB2-assessed. But 4 of 8 studies were rated HIGH risk of bias and only one isolated sleep as the intervention component. I2 = 83.7% means the pooled estimate is barely interpretable.
funding: US Government work (not under copyright protection in the US)
notes: 'Second, more recent, pooled null for sleep-focused interventions on paediatric BMI. Authors'' own bottom line names precisely the gap this shard cares about: ''Findings from this study highlight the need for additional RCTs isolating sleep as a component, focusing on children and adolescents living with overweight and obesity.'' Note the one study that DID isolate sleep ''reported statistically significant decreases in weight and waist circumference compared to control, though we rated it at high risk of bias.'''
