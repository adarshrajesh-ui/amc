  direction_note: 'ESSENTIALLY EXACT ZERO with a tight CI: a real-world policy that lengthens adolescent school-night sleep produced NO detectable BMI benefit over 2 years. The 95% CI excludes any effect larger than +/-0.6 kg/m2. THIS IS THE BEST QUASI-EXPERIMENTAL EVIDENCE IN THE CORRECT AGE BAND AND IT IS NULL.'
