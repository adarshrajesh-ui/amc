rob:
  tool: ROBINS-I
  judgement: moderate
  notes: 'Genuine natural experiment with objectively MEASURED height and weight, annual follow-up, difference-in-differences estimator, and the exact target age band. LIMITATIONS: only 5 schools (2 intervention), so school-level confounding cannot be fully excluded; the start-time delay (50-65 min) increases sleep OPPORTUNITY by less than an hour, and prior START publications indicate the achieved sleep gain is smaller still; 2-year follow-up may be too short for BMI divergence.'
funding: not stated in retrieved text
notes: 'STRONG, PRECISE NULL IN THE RIGHT POPULATION. Verbatim from the abstract: ''Students'' BMIs increased in parallel in both policy change and comparison schools over time.'' And from the results: ''Over the three waves of data collection, the mean objective BMI increased in both the policy change and comparison schools. At baseline, in the policy change schools, the mean crude BMI was 22.8 [22.5, 23.2] and increased to 24.1 [23.7, 24.4] at follow-up 2; in comparison schools the mead crude BMI was 22.8 kg/m2 [95% CI = 22.4, 23.2] and increased to 24.0 kg/m2 [95% CI = 23.6, 24.5] at follow-up 2 (Table 2).'' Weight-related BEHAVIOURS did improve, but BMI did not.'
