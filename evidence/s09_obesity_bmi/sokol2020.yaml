rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: Cross-lag modelling is the right tool for the directionality question and the age window is ideal (12-18 -> 18-24 -> 24-32). Self-reported sleep. Sample size not stated in the abstract (Add Health waves I-IV; the retrieved secondary description says 'over 20,000 individuals'), so n is left null rather than guessed.
funding: Carolina Population Center (P2C HD050924, T32 HD007168); Carolina Consortium for Human Development (T32 HD07376)
notes: 'THE MOST DIRECTLY DECISION-RELEVANT LONGITUDINAL RECORD. Same cohort as suglia2014 and krueger2015 (Add_Health) - DO NOT POOL AS INDEPENDENT. Authors'' warning is worth quoting in full to the downstream model: ''Findings suggest that researchers should be cautious when interpreting cross-sectional relationships between sleep and BMI, as higher BMI may precede shorter sleep during adolescence to young adulthood.'''
