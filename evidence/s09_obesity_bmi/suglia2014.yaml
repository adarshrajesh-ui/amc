rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: Large nationally representative cohort with MEASURED height and weight (a real strength) and the exact age window of interest (16 -> 21 y). Exposure is self-reported sleep in coarse categories (<6, 6-8, >8 h), single time point, and residual confounding by socioeconomic status, screen time and depression is likely.
funding: not stated in abstract
notes: 'BEST AGE MATCH of any observational record in this shard (mean age 16 -> 21 y, US, both sexes, measured anthropometry). The 1.2 (1.0-1.6) longitudinal RR is the single most transportable obesity-incidence estimate for our subject. Contrast with the same cohort''s cross-sectional male PR of 1.8: prospective attenuation is ~50% on the log scale.'
