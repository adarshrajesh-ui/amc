rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: Prospective cohorts, mean 3.4 y follow-up, dose-response modelled. Authors describe the association as 'modest'. The reference sleep durations (10-12 h) are paediatric, so the per-hour slope is being read off a very different part of the sleep-duration distribution than a 16-19 year old occupies.
funding: not stated in abstract
notes: 'The only paediatric dose-response meta-analysis giving a per-hour BMI GAIN RATE. Authors'' own summary: ''Accumulated literature indicates a modest inverse association between sleep duration and the risk of childhood overweight/obesity.'''
