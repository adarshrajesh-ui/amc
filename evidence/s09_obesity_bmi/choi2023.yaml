  quote: In addition, as the WK-E increased by 30 min, the risk of overweight/obesity decreased by a factor of 0.93, following adjustment of the covariates.
rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: CROSS-SECTIONAL nationally representative survey; self-reported sleep; the paper contains at least one internally inconsistent risk figure (the 'factor of 0.39' per 30 min). The authors themselves demand prospective confirmation.
funding: authors declare no commercial or financial relationships
notes: 'Included ONLY because it is the closest published match to our subject''s actual exposure PATTERN (short weekdays plus weekend catch-up) in the correct age band. Authors'' own caveat, verbatim: ''However, further prospective studies are needed to establish the causality between extended weekend sleep and obesity.'' The direction here (catch-up helps) CONFLICTS with depner2019 (catch-up did not prevent weight gain in the laboratory); the conflict is unresolved.'
