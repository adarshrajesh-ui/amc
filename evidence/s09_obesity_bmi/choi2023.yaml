  direction_note: positive = among short weekday sleepers, getting LESS than 3 h of weekend catch-up sleep nearly DOUBLED overweight/obesity risk vs getting more. Implies weekend catch-up may partially buffer weekday restriction - the OPPOSITE of Depner 2019's laboratory finding. Cross-sectional, so causal weight is low.
