  from_figure: false
  inferred_from_ci: false
  direction_note: negative = each extra 30 min of weekend catch-up sleep associated with 7% lower overweight/obesity risk. NOTE the abstract also reports a 'factor of 0.39' for each 30-min increment in total weekend sleep duration, which is not interpretable as a per-30-min multiplicative risk and is likely a reporting error - do not use that figure.
  covariates: []
