rob:
  tool: RoB2
  judgement: low
  notes: 'Well-conducted RCT with objectively assessed energy intake (doubly labelled water + DXA body-composition change), actigraphy-verified exposure, free-living setting, weights hidden from participants, intention-to-treat analysis. LIMITATIONS for our purposes: participants had OVERWEIGHT (BMI 25.0-29.9) and were aged 21-40 (mean 29.8), the follow-up was only 2 weeks, and there is no evidence that the weight change persists.'
funding: see paper; authors report no conflicts of interest. ClinicalTrials.gov NCT02253368
notes: 'STRONGEST CAUSAL EVIDENCE IN THIS SHARD ON THE REVERSIBILITY QUESTION, though indirect: it shows that raising sleep in habitual short sleepers produces a negative energy balance and measurable weight LOSS within 2 weeks. It does NOT establish that weight accumulated over years of prior short sleep is recovered - and the authors are explicit that this had been unknown: ''However, it remains unknown whether extending sleep duration can be an effective strategy for preventing or reversing obesity.'' Their cited dynamic-model benchmark is useful for scaling: ''a sustained increase in energy intake of even 100 kcal/d would result in a weight gain of about 4.5 kg over 3 years.'''
shard: s09_obesity_bmi
