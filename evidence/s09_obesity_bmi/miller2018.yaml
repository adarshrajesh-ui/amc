rob:
  tool: AMSTAR-2
  judgement: low
  notes: Prospective studies only, follow-up >=1 year, age-stratified because of high heterogeneity. Exposure is mostly self-/parent-reported. The middle-childhood RR of 2.23 (2.18-2.27) has an implausibly narrow CI for 3 studies and should be discounted.
funding: not stated in abstract
notes: KEY RECORD for the per-hour BMI question. The prospective per-hour BMI coefficient (-0.03 kg/m2/h) and the per-hour BMI-z coefficient (-0.03/h) are an order of magnitude smaller than Cappuccio 2008's cross-sectional adult coefficient (-0.35 kg/m2/h). n field = 31,665 (the BMI-z analysis); the adolescent RR stratum had 26,652 participants.
