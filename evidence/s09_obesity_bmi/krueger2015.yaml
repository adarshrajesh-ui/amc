rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: The only record that explicitly models CUMULATIVE exposure, which is the right structure for a multi-year exposure. But the 'short sleep' definition is distributional (-0.50 SD from age/sex mean) rather than absolute hours, so the dose cannot be translated into hours for our subject. Self-reported sleep. Same cohort as suglia2014 and sokol2020.
funding: not stated in abstract
notes: 'Directly addresses the DOSE structure (''3 years of exposure''): ''Cumulative exposure to short sleep exhibits dose-response associations with obesity and elevated waist circumference.'' Note that even FOUR waves of sustained short sleep across 15 years produced only OR 1.45 with a lower bound of 1.03. IMPORTANT: this study says NOTHING about what happens after sleep normalises - it measures accumulation, not reversal.'
