notes: 'MOST DECISION-RELEVANT ENERGY-INTAKE NUMBER: +385 kcal/day (252-517). Authors'' own caveat is explicit: ''which in the long term may contribute to weight gain'' - i.e. the durable weight consequence is extrapolated, not measured. 17 studies (n=496) in the systematic review; 11 studies (n=172) in the meta-analysis.'
