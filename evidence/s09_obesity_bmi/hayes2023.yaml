rob:
  tool: MR-STROBE
  judgement: moderate
  notes: Large, well-conducted bidirectional two-sample MR with MR-Egger, weighted-median, weighted-mode, radial and Steiger sensitivity analyses. Instruments are weak for sleep duration (instruments explained 0.13-2.07% of exposure variance across traits), and the sleep-duration GWAS is in middle-aged/older adults, which limits transport to adolescence.
funding: MRC Integrative Epidemiology Unit; NIHR Bristol BRC
notes: 'THE CENTRAL MR RECORD FOR THIS SHARD. Authors'' summary sentence: ''There was little evidence for effects of sleep traits on adiposity traits.'' Insomnia (NOT short sleep duration) was the sleep trait with a causal effect on adiposity (BMI 0.47 SD, 95% CI 0.22-0.73). Reverse direction was also null: ''BMI Sleep duration 446, 118 0.01 (-0.04 to 0.07) 6.30 E-01''. The child-BMI estimate should be treated as an artefact, not an effect size, because Steiger filtering indicated shared causal variants and attenuated it to -1.77 SD (95% CI -7.24 to 3.39).'
