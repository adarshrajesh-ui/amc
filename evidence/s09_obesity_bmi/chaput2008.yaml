rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: 'Objective body-composition measurement and adjustment for energy intake and physical activity are strengths. MAJOR SELECTION ISSUE stated by the authors: ''More than half of the sample is drawn from families with at least 1 parent and 1 offspring with a body mass index of 32 kg/m2 or higher'', i.e. an obesity-enriched family cohort. Also a U-shaped association (long sleepers gained 1.58 kg more), which argues against a simple monotonic sleep-deficit mechanism.'
funding: not stated in abstract
notes: Provides the baseline (no-change) comparator for chaput2012's reversibility analysis, which uses the same cohort. cohort_family = Quebec_Family_Study for both - DO NOT POOL AS INDEPENDENT.
