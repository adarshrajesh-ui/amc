rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: Large, nationally representative, multilevel-modelled, and the exposure (school start time) is exogenous to the individual, which reduces reverse-causation concern. But CROSS-SECTIONAL, BMI is estimated rather than measured ('We estimated body mass indices'), and school start time is only a proxy for sleep duration.
funding: not stated in abstract
notes: Useful because the exposure is quasi-exogenous, but the finding is borderline (CI touches zero) and the clinical endpoint is null. Compare directly with widome2023, which tested the SAME exposure LONGITUDINALLY with measured BMI and found nothing. The contrast between these two records is a clean illustration of cross-sectional inflation in this literature.
