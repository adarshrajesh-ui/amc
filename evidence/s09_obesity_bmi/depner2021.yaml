  conversion_formula: difference = 10% (SR and SR+WR) - 4% (control) = 6 percentage points. se = sqrt(1^2 + 3^2) = 3.162 using the reported +/-values. ci = 6.0 +/- 1.96*3.162.
  from_figure: false
  inferred_from_ci: false
  direction_note: positive = insufficient sleep RAISED energy expenditure ~6 percentage points more than adequate sleep, replicating Markwald 2013's offset direction.
  covariates: []
  followup_years: null
  cohort_family: null
  quote: Percent change from baseline in 24 h-EE was higher (p < 0.05) on day 2 of insufficient sleep (SR and SR + WR groups; 10 +/- 1%) versus adequate sleep (control group; 4 +/- 3%).
rob:
  tool: RoB2
  judgement: some_concerns
  notes: Same cohort/protocol as depner2019 - DO NOT POOL AS INDEPENDENT. Between-group design with small unequal groups; the authors themselves flag that within-subject crossover and free-living designs are needed.
funding: NIH (see paper)
notes: 'SAME PARTICIPANTS as depner2019 (cohort_family should be treated as identical). This is the strongest single piece of laboratory evidence AGAINST a large sleep-specific energy-balance effect: ''In this between-group study, the effects of adequate sleep and insufficient sleep, with or without or weekend recovery sleep, on 24 h-EB were similar.'''
