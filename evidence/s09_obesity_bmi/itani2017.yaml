notes: 'Important negative detail: ''Meta-regression analyses found a linear association between a statistically significant increase in mortality and sleep duration at less than six hours. No dose-response was identified in the other outcomes.'' i.e. this large synthesis did NOT find an obesity dose-response, in contrast to Zhou 2019. Total n = 5,172,710 across ALL outcomes, not obesity alone.'
