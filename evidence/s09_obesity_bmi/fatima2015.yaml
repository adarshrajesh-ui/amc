rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: Longitudinal (prospective) design, so temporality is respected, but exposure is self-/parent-reported and the contrast is short vs LONG (not short vs recommended), which inflates the odds ratio relative to a short-vs-normal contrast. Bias-adjusted (inverse-variance heterogeneity) model used.
funding: not stated in abstract
notes: 22 longitudinal studies reviewed, 11 pooled. Contrast is short vs LONG sleep, not short vs recommended sleep - this is the single biggest reason this OR (2.15) exceeds Miller 2018's adolescent RR (1.30). Age range covers childhood and adolescence; the adolescent-only subset is not separately reported in the abstract.
