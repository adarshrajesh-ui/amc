rob:
  tool: none
  judgement: moderate
  notes: Life-table analysis on a single, small (n=3457), all-white, mid-20th-century New England cohort.
    Baseline BMI is assumed to persist. The adjusted early-BMI finding is reported without a number in
    the abstract and is vulnerable to regression dilution in the later-life BMI adjustment, which would
    EXAGGERATE the apparent independent early effect.
funding: Netherlands Organization for Scientific Research / NEDCOM (per report)
notes: 'Two distinct roles. (1) The 3.1 y figure for male nonsmoker overweight at 40 is my primary BMI
  pro-rata input: 3.1 y / e(40)=38.6 y = 0.080 y per exposure-year, so 3 years = 0.24 y. (2) The adjusted
  early-BMI claim is the ONLY retrievable evidence bearing on BMI IRREVERSIBILITY, and it is qualitative.
  That is a real gap - see station_report.md.'
