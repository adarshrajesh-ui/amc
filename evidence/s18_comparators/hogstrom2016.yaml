rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: Outstanding exposure measurement (maximal cycle ergometry, whole-population conscription, n=1.3
    million) and outstanding age match. But fitness at 18 is measured ONCE and tracks into midlife, so
    this HR prices a lifelong fitness trajectory, not a 3-year exposure. The strongest cause-specific
    association being death from alcohol and narcotics abuse (HR 0.20) is a loud signal that fitness at
    18 is partly a marker of a whole behavioural and social phenotype, not an isolated physiological exposure.
funding: Swedish Research Council and others (per report)
notes: 'The single best AGE-MATCHED comparator record in the shard. Its role is to bound the ''adolescent
  exposure leaves a permanent mark'' hypothesis for the inactivity channel: HR 2.04 for the least-fit
  applied permanently from 19 gives ~9 y (convert.py). That is an over-attribution for a 3-year exposure
  for the tracking and phenotype-marker reasons above, but it establishes that fitness AT 18 has a large,
  register-confirmed association with lifespan.'
