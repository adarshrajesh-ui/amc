rob:
  tool: none
  judgement: moderate
  notes: Comparative risk assessment, not a study. PAFs depend on modelled exposure distributions, on
    relative risks meta-analysed from heterogeneous sources, and on strong assumptions about unrecorded
    consumption. Attributable fractions are not individual risks. The zero-minimum-risk finding has been
    substantively criticised for how it handles the abstainer referent.
funding: Bill & Melinda Gates Foundation
notes: 'Included because it is the only source in the shard that prices a comparator AT OUR SUBJECT''S
  AGE BAND. It changes the shape of the alcohol comparator entirely: the chronic-disease pro-rata figure
  (0.04-0.35 y for 3 years) must be ADDED to an acute-injury window term that is at least 0.02 y for an
  average male and plausibly 0.07-0.29 y for a heavy-drinking one (convert.py sensitivity over HR 1.5-3.0).
  Alcohol is the one comparator where the WINDOW model dominates the PRO-RATA model.'
shard: s18_comparators
