  conversion_formula: PAF 12.2% (95% UI 10.8-13.6). se on the PERCENTAGE scale = (13.6-10.8)/3.919928
    = 0.714298. Implied population-average hazard ratio over this age band = 1/(1-0.122) = 1.139; applied
    to ages 16-18 of the US male 2023 life table that is 0.020 y = 7.4 days of life expectancy (convert.py).
  from_figure: false
  inferred_from_ci: false
  direction_note: 'positive = share of male deaths at 15-49 ATTRIBUTABLE to alcohol (harm). THE CRITICAL
    ASYMMETRY IN THIS SHARD: alcohol is the LEADING risk factor at exactly our subject''s age, and the
    mechanism is acute (road injury, self-harm), not chronic disease. Alcohol harm is FRONT-LOADED into
    the 16-24 window and therefore must NOT be pro-rated from a midlife estimate.'
  covariates: []
  followup_years: null
  cohort_family: GBD
  quote: Among the population aged 15-49 years, alcohol use was the leading risk factor globally in 2016,
    with 3.8% (95% UI 3.2-4.3) of female deaths and 12.2% (10.8-13.6) of male deaths attributable to alcohol
    use. For the population aged 15-49 years, female attributable DALYs were 2.3% (95% UI 2.0-2.6) and
    male attributable DALYs were 8.9% (7.8-9.9). The three leading causes of attributable deaths in this
    age group were tuberculosis (1.4% [95% UI 1.0-1.7] of total deaths), road injuries (1.2% [0.7-1.9]),
    and self-harm (1.1% [0.6-1.5]).
