rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: Weight at age 18/21 is RECALLED, in some cases decades later, which is a major exposure misclassification
    problem. 97% white health professionals. The exposure is weight CHANGE over 34-37 years, so it says
    nothing about a 3-year window.
funding: US National Institutes of Health (per report)
notes: Screened in as the closest available evidence on whether adiposity acquired in late adolescence
  persists and matters. It does establish that the weight-gain TRAJECTORY from 18 to 55 predicts worse
  outcomes, which is the empirical reason to worry that a sleep-restriction-induced weight gain at 16-19
  is not a 3-year exposure at all but the start of a trajectory. It does NOT provide a life-expectancy
  figure and should carry little weight in the comparator table.
