  quote: For any given degree of overweight, younger adults generally had greater YLL than did older adults.
    The maximum YLL for white men aged 20 to 30 years with a severe level of obesity (BMI >45) is 13 and
    is 8 for white women. For men, this could represent a 22% reduction in expected remaining life span.
rob:
  tool: none
  judgement: moderate
  notes: A life-table modelling exercise, not a cohort. It stacks NHANES prevalence on NHANES follow-up
    mortality and 1999 US life tables, and assumes BMI at baseline persists for life. The BMI >45 stratum
    is small and the estimates are unstable (the black-male estimate of 20 y against a black-female estimate
    of 5 y is implausibly divergent, signalling sparse data). No uncertainty intervals published for the
    YLL figures.
funding: US National Institutes of Health (per report)
notes: Included specifically to answer 'YLL for a given BMI at a given age' in the age band nearest our
  subject. The transportable finding is the DIRECTION of the age gradient - 'for any given degree of overweight,
  younger adults generally had greater YLL' - which corroborates Global BMI 2016's stronger HR when BMI
  is measured earlier. The BMI >45 point value is NOT usable as a comparator for a 3-year exposure; it
  is a ceiling on the whole obesity channel.
