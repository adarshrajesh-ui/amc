rob:
  tool: none
  judgement: high
  notes: 'A commissioned economic modelling report (client: Vitality Health), peer reviewed within RAND''s
    process but not in a journal. Its outputs are GDP and working days, not health. Its mortality inputs
    are borrowed from the observational short-sleep literature and inherit all of its confounding; RAND
    then treats them as causal in a macroeconomic model. Attempting to convert its $411 bn to a per-person
    life expectancy or QALY figure would require assumptions RAND does not supply and I do not make.'
funding: Vitality Health (commissioned); research conducted by RAND Europe
notes: 'THE ANSWER TO TASK ITEM 6 IS LARGELY NEGATIVE. RAND is the most-cited attempt to price insufficient
  sleep and it does NOT put sleep on a life-expectancy or QALY scale at all - it prices lost GDP and lost
  working days. The most-quoted figures are: ''The US sustains by far the highest economic losses (up
  to $411 billion a year)'' and ''On an annual basis, the US loses an equivalent of about 1.23 million
  working days due to insufficient sleep.'' Neither is commensurable with years of life. The only health
  quantity RAND uses is a borrowed mortality RR. See li2024sleep for the closest thing to a genuine sleep
  life-expectancy estimate, and welter2026 for the fact that GBD omits sleep entirely.'
