  exposure:
    type: other
    dose_h: null
    referent_h: null
    duration_days: null
    contrast_label: BMI 30-35 kg/m2 vs the 22.5-25 optimum, sustained from ~age 46
  scale: years
  unit: years of median survival lost
  value: -3.0
  se: null
  ci: null
  conversion_formula: Reported as a range, '2-4 years'; midpoint 3.0 recorded. The 2-4 span is a ROUNDED
    RANGE across the BMI band, NOT a confidence interval, so ci is left null and se null. Modellers wanting
    an interval should use [-4, -2].
  from_figure: false
  inferred_from_ci: false
  direction_note: negative = median survival LOST. Sustained lifelong exposure from midlife, NOT 3 years.
  covariates:
  - age
  - sex
  - smoking status
  - study
  followup_years: 8.0
  cohort_family: Prospective_Studies_Collaboration
  quote: At 30-35 kg/m(2), median survival is reduced by 2-4 years; at 40-45 kg/m(2), it is reduced by
    8-10 years (which is comparable with the effects of smoking).
