rob:
  tool: AMSTAR-2
  judgement: low
  notes: IPD collaboration, first 5 years of follow-up excluded to limit reverse causation, adjusted for
    smoking. Single baseline BMI measurement means regression dilution (the paper corrects for it). Mean
    recruitment age 46, so wholly extrapolated to a 16-19 year old.
funding: UK Medical Research Council, British Heart Foundation, Cancer Research UK, EU BIOMED programme
  (per report)
notes: 'The per-5-kg/m2 HR asked for in the task. Note the important asymmetry the abstract flags: below
  22.5 kg/m2 the association REVERSES, and that inverse limb is smoking-confounded. For our subject (lean
  18-year-old) only the upper limb is relevant. Conversion to 3 years is in comparator_scale.md.'
