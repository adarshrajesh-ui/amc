  cohort_family: Prospective_Studies_Collaboration
  quote: In both sexes, mortality was lowest at about 22.5-25 kg/m(2). Above this range, positive associations
    were recorded for several specific causes and inverse associations for none, the absolute excess risks
    for higher BMI and smoking were roughly additive, and each 5 kg/m(2) higher BMI was on average associated
    with about 30% higher overall mortality (hazard ratio per 5 kg/m(2) [HR] 1.29 [95% CI 1.27-1.32])
