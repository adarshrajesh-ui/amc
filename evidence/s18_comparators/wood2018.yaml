rob:
  tool: AMSTAR-2
  judgement: low
  notes: 'Exceptionally strong on exposure measurement error: intake was corrected for long-term variability
    using 152 640 repeat assessments, which most alcohol studies do not do. CURRENT DRINKERS ONLY, so
    sick-quitter bias is designed out. Two limitations for us: the referent is light drinking rather than
    abstention, and the analysis is of chronic disease in middle-aged and older adults, so it captures
    essentially NONE of the acute injury mortality that dominates alcohol harm at ages 16-24.'
funding: UK Medical Research Council, British Heart Foundation, National Institute for Health Research,
  European Union Framework 7, European Research Council
notes: 'The requested years-of-life-lost-by-drinking-category record, and the only comparator in this
  shard whose published output is ALREADY a life expectancy at a known starting age (40). Pro-rata over
  e(40)=38.6: 100-200 g/wk = 0.039 y per 3 years; 200-350 g/wk = 0.117 y; >350 g/wk = 0.350 y. BUT for
  a 16-19 year old this UNDERSTATES the risk badly because it omits the injury channel - see gbd2016alcohol.'
