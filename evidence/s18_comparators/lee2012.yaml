rob:
  tool: none
  judgement: moderate
  notes: Comparative-risk-assessment / life-table modelling with self-reported activity prevalence and
    relative risks drawn from observational cohorts, so it inherits all of their confounding plus prevalence
    measurement error. The authors state they used 'conservative assumptions'. Causal language ('inactivity
    causes') is not licensed by the design.
funding: None (per report)
notes: 'Included because the task asked for it, but the modeller must NOT use the 0.68 y figure as a comparator:
  it is a population-level counterfactual, not the life expectancy an individual inactive person loses.
  Use moore2012 for the individual contrast. The main value here is the 9% PAF as a burden-of-disease
  framing number.'
