rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: Independent (Japanese) cohort, which is a genuine addition to a reversibility evidence base otherwise
    entirely UK/US/Australian. But age at initiation and at cessation are both RECALLED at ages 40-79,
    so exposure misclassification is substantial; the 'negligible' finding for quitters under 50 is reported
    without a point estimate; and the cohort enrols at 40-79, so anyone who died before 40 is excluded
    by design (survivor bias, which biases the cessation benefit upward).
funding: Japanese Ministry of Education, Culture, Sports, Science and Technology / JACC Study (per report)
notes: 'Added late in screening and worth it: it is the only record I found that crosses AGE AT INITIATION
  with AGE AT CESSATION, which is exactly the two-dimensional question our subject poses (exposure begun
  at 16, ended at 19). Its answer is that initiation before 20 is not independently damaging on the ALL-CAUSE
  scale provided cessation is early; what drives the residual harm is total DURATION, i.e. how late you
  stop. That supports treating our subject''s 3-year window as a small cumulative dose rather than a developmental
  insult. CANCER mortality is the documented exception. DOI is registered with JaLC, not Crossref, so
  the Crossref API returns 404; the DOI nonetheless resolves through doi.org with HTTP 200 to the Nagoya
  University repository, and the PMID resolves in PubMed, so status is VERIFIED.'
