rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: MEDIAN FOLLOW-UP IS ONLY 4.3 YEARS while the outcome is life expectancy at age 30, so the LE
    figure is an extrapolation from a flexible parametric survival model far outside the observed data
    - the 4.7 y point estimate is model-dependent and its CI (2.7-6.7) almost certainly understates the
    true uncertainty. Exposure is self-reported at a single interview, mean age 47, and the composite
    score mixes duration with insomnia symptoms and hypnotic use, so reverse causation from prevalent
    illness is a serious threat.
funding: Not stated in abstract
notes: 'The one record that comes close to answering task item 6 with a life-expectancy number. Two cautions
  before it is used as our subject''s comparator: (a) the exposure is a poor-sleep PHENOTYPE at mean age
  47, not 3 years of adolescent restriction, and (b) the sex difference (4.7 y men vs 2.4 y women) is
  not mechanistically explained and hints at residual confounding. It is nonetheless the right order-of-magnitude
  reference point: a SUSTAINED poor sleep phenotype sits between overweight (3.1 y) and >350 g/wk alcohol
  (4.5 y) on the same scale.'
