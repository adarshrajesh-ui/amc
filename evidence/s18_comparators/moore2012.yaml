rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: Self-reported leisure-time activity at a single baseline; occupational and incidental activity
    ignored. Median follow-up only 10 y, so reverse causation (illness reducing activity) is a live threat
    despite adjustment. The '0 MET-h/wk' referent group is small and unusual and is likely to be sick
    and socially disadvantaged, which inflates the contrast.
funding: US National Cancer Institute Intramural Research Program (per report)
notes: 'The individual-level physical-activity life-expectancy anchor the task asked for. Pro-rata conversion:
  3.4 y over e(40)=38.6 remaining years = 0.088 y per exposure-year, so 3 years of total inactivity =
  0.26 y. Prefer this over lee2012''s 0.68 y, which is a population figure.'
