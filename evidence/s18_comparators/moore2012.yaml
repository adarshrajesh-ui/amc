- outcome_domain: comparator
  outcome_construct: life_expectancy_gain_after_40_at_lowest_nonzero_activity
  exposure:
    type: other
    dose_h: null
    referent_h: null
    duration_days: null
    contrast_label: 0.1-3.74 MET-h/wk (brisk walking <=75 min/wk) vs 0 MET-h/wk, from age 40
  scale: years
  unit: years of life expectancy gained after age 40
  value: 1.8
  se: 0.102043
  ci:
  - 1.6
  - 2.0
  conversion_formula: Gain 1.8 y (95% CI 1.6-2.0). se = (2.0-1.6)/3.919928 = 0.102043 on the YEARS scale.
  from_figure: false
  inferred_from_ci: false
  direction_note: 'positive = life expectancy GAINED. Shows the dose-response is steeply concave: half
    the total benefit arrives at a trivial dose, so ''inactivity'' harm depends heavily on where the referent
    is set.'
  covariates:
  - age
  - sex
  - smoking
  - BMI
  - alcohol
  - education
  - marital status (per report)
  followup_years: 10.0
  cohort_family: NCI_Cohort_Consortium
  quote: 'A physical activity level of 0.1-3.74 MET-h/wk, equivalent to brisk walking for up to 75 min/wk,
    was associated with a gain of 1.8 (95% CI: 1.6-2.0) y in life expectancy relative to no leisure time
    activity (0 MET-h/wk). Higher levels of physical activity were associated with greater gains in life
    expectancy, with a gain of 4.5 (95% CI: 4.3-4.7) y at the highest level (22.5+ MET-h/wk, equivalent
    to brisk walking for 450+ min/wk).'
