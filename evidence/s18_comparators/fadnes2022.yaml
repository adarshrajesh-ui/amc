rob:
  tool: none
  judgement: moderate
  notes: 'The authors are unusually candid about the limitations and I reproduce their own list: ''The
    methodology provides population estimates under given assumptions and is not meant as individualized
    forecasting, with study limitations that include uncertainty for time to achieve full effects, the
    effect of eggs, white meat, and oils, individual variation in protective and risk factors, uncertainties
    for future development of medical treatments; and changes in lifestyle.'' They graded their own evidence
    base as MODERATE on NutriGrade. The model also sums food-group effects that are estimated from separate
    meta-analyses, which risks double-counting shared causal pathways and probably overstates the total.'
funding: Not stated in abstract
notes: 'The requested Fadnes record and the diet comparator''s backbone. TWO conversion routes, which
  disagree by 2x: naive pro-rata over e(20)=56.7 gives 0.69 y for 3 years, whereas the authors'' own age
  gradient gives 0.32 y and implies the true figure at 16-19 is lower still. I recommend the age-gradient
  route. The 13-year headline should be treated with suspicion for the double-counting reason in rob.notes;
  it is by far the largest single-exposure life-expectancy claim in this shard.'
