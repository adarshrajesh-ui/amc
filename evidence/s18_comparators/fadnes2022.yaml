  conversion_formula: 'Gain 8.8 y (95% UI 6.8-10.0) for men changing at 60. se on the YEARS scale = (10.0-6.8)/3.919928
    = 0.816341. PAIRED WITH THE AGE-20 FIGURE THIS GIVES A DELAYED-CESSATION CONVERSION: eating badly
    from 20 to 60 (40 exposure-years) costs 13.0-8.8 = 4.2 y, i.e. 0.105 y per exposure-year, so 3 years
    = 0.32 y. The 60-to-80 segment gives 0.27 y per exposure-year, so the marginal cost of a bad-diet
    year RISES steeply with age and 0.105 OVERSTATES the cost at 16-19.'
