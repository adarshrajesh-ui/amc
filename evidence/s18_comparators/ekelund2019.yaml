rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: Objective exposure measurement (device-based) is a genuine advance and is why this is T4, not
    T5. But mean age 62.6 y, 73% women, and median follow-up of only 5.8 y. In an elderly cohort with
    short follow-up, low measured activity is substantially a MARKER of subclinical disease, so the HR
    of 0.27 is a mixture of the causal effect and reverse causation. The authors' own conclusion is restricted
    to 'middle aged and older adults'. Transport to a healthy 18-year-old is very poor.
funding: Research Council of Norway and others (per report)
notes: 'Requested by the task. Retained as the best DEVICE-MEASURED dose-response, but flagged as an OUTLIER
  on the high side: it implies an inactive-vs-active HR of 3.7 in the elderly, which converts (convert.py,
  10.85*ln(HR)) to ~14 y of life expectancy - larger than smoking. That is not credible as a causal effect
  of inactivity and I do NOT use it in the comparator table. It is useful only as an upper bound and as
  a demonstration of how much reverse causation can inflate activity-mortality estimates in old cohorts.'
