  quote: 'For each 1 kJ/kg/day per year increase in PAEE (equivalent to a trajectory of being inactive
    at baseline and gradually, over five years, meeting the World Health Organization minimum physical
    activity guidelines of 150 minutes/week of moderate-intensity physical activity), hazard ratios were:
    0.76 (95% confidence interval 0.71 to 0.82) for all cause mortality, 0.71 (0.62 to 0.82) for cardiovascular
    disease mortality, and 0.89 (0.79 to 0.99) for cancer mortality, adjusted for baseline PAEE, and established
    risk factors.'
