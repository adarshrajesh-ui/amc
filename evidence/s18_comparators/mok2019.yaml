  quote: Joint analyses with baseline and trajectories of physical activity show that, compared with consistently
    inactive individuals, those with increasing physical activity trajectories over time experienced lower
    risks of mortality from all causes, with hazard ratios of 0.76 (0.65 to 0.88), 0.62 (0.53 to 0.72),
    and 0.58 (0.43 to 0.78) at low, medium, and high baseline physical activity, respectively.
rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: 'Repeated exposure assessment calibrated against combined heart-rate and movement sensing is
    a real strength and is the reason this is the best reversibility evidence for activity. But activity
    change is not randomised: people who become more active are people who became able to, so reverse
    causation and healthy-adopter bias remain. Ages 40-79 only.'
funding: UK Medical Research Council and Cancer Research UK (per report)
notes: 'The physical-inactivity analogue of the smoking-cessation evidence. It is the best available answer
  to ''is inactivity reversible?'' and the answer is largely yes. NOTE THE ASYMMETRY WITH SMOKING: for
  smoking we have direct evidence on quitting YOUNG (Pirie 2013, quit at 25-34); for inactivity the reversibility
  evidence is entirely from people aged 40-79, so applying it to a 19-year-old is an extrapolation, albeit
  a conservative one (recovery should be easier at 19).'
