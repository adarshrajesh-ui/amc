  judgement: high
  notes: Cause-deleted life-table analysis that ASSUMES the sitting-mortality association is fully causal
    and fully removable, applied to self-reported sitting prevalence from NHANES. Both assumptions are
    strong. Cause-deletion also assumes independence between the deleted risk and competing risks, which
    is false for sedentary behaviour.
