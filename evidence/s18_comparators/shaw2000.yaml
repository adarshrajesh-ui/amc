  notes: A one-page BMJ letter, not a peer-reviewed analysis. The estimate is pure division of a life-expectancy
    gap by a lifetime cigarette count; it therefore ASSUMES that harm is linear in cigarettes and that
    every cigarette in a career carries equal weight. Its mortality input (6.5 y) is now known to be roughly
    40% too small.
