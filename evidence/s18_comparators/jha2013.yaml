rob:
  tool: Newcastle-Ottawa
  judgement: low
  notes: Nationally representative US sample with National Death Index linkage; adjusted for adiposity
    and alcohol, which most smoking cohorts do not do. Self-reported smoking histories; quit-age groups
    are recalled and therefore subject to misclassification and to sick-quitter bias, which would bias
    the cessation benefit DOWNWARD, not upward.
funding: US National Cancer Institute; Canadian Institutes of Health Research (per report)
notes: 'The single most transportable smoking record for our purpose, because it prices CESSATION AT A
  YOUNG AGE rather than lifetime exposure. Downstream arithmetic (see convert.py): 90% avoidance applied
  to a 10-year deficit leaves ~1.0 y as the ceiling for a smoker who smoked from ~17 to <40 and then quit.
  Three years of exposure is a small fraction of that career, so the realised cost of a 3-year adolescent
  smoking exposure is BELOW 1 y.'
shard: s18_comparators
