rob:
  tool: none
  judgement: moderate
  notes: 'Peer-reviewed Addiction article but analytically a short re-derivation, not new data. The central
    weakness for OUR purpose: dividing a lifetime life-expectancy deficit by a lifetime cigarette count
    IMPOSES linearity in cumulative dose. Real smoking hazards are strongly super-linear in DURATION (Doll/Peto:
    lung-cancer incidence scales roughly with duration to the 4th-5th power), so an equal-share attribution
    OVERSTATES the harm of the FIRST 3 years of a career and understates the last. Also UK-specific and
    does not credit cessation-related recovery.'
funding: Cancer Research UK; analysis commissioned by the UK Department of Health and Social Care (per
  paper)
notes: 'THE most useful smoking record in this shard, because it is the only one denominated per unit
  of exposure. Downstream (convert.py): 3 years at 20 cig/day for a MALE = 20*365.25*3 cigarettes * 17
  min = 0.708 y (8.5 months); at 10 cig/day = 0.354 y (4.3 months). Compare with the cessation-based estimate
  from Pirie 2013 (~0.3 y for a WHOLE young-adult career) - the two disagree by a factor of ~2, and that
  disagreement IS the cumulative-versus-reversible tension this shard exists to expose. Not in PubMed
  at time of extraction; identifier verified by Crossref only.'
