  conversion_formula: RR 1.05 (95% CI 1.00-1.11). log_hr = ln(1.05) = 0.048790. se = (ln(1.11)-ln(1.00))/3.919928
    = 0.026627.
  from_figure: false
  inferred_from_ci: false
  direction_note: positive = residual excess mortality still present after quitting young, but only 5%
    excess versus 197% for continuing smokers. THE cleanest quantitative reversibility benchmark in this
    shard for an exposure stopped in early adulthood.
  covariates:
  - age
  - region
  - socioeconomic status
  - alcohol
  - BMI
  - physical activity (per report)
  followup_years: 12.0
  cohort_family: Million_Women_Study
  quote: Among ex-smokers who had stopped permanently at ages 25-34 years or at ages 35-44 years, the
    respective relative risks were 1.05 (95% CI 1.00-1.11) and 1.20 (1.14-1.26) for all-cause mortality
    and 1.84 (1.45-2.34) and 3.34 (2.76-4.03) for lung cancer mortality. Thus, although some excess mortality
    remains among these long-term ex-smokers, it is only 3% and 10% of the excess mortality among continuing
    smokers.
