rob:
  tool: Newcastle-Ottawa
  judgement: low
  notes: 'Very large cohort with repeat exposure measurement at 3 and 8 years, which removes most of the
    exposure-misclassification and reverse-causation problem that plagues single-baseline smoking cohorts.
    WOMEN ONLY: transport to a male subject requires the assumption that the cessation gradient is sex-invariant,
    which Jha 2013 (both sexes) supports.'
funding: Cancer Research UK, Medical Research Council
notes: Included specifically for the reversibility question, where it is the strongest evidence available
  for ANY of my comparators. The RR of 1.05 (1.00-1.11) for women who quit at 25-34 says that a young-adult
  smoking career followed by permanent cessation leaves an all-cause excess of ~5%, i.e. ~0.3 y of the
  11-year deficit (see convert.py). Population is women; recorded as poor_midlife and sex-mismatched so
  the pooler can inflate uncertainty.
shard: s18_comparators
