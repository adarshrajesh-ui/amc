  - weight
  - physical activity level
  followup_years: null
  cohort_family: GBD_Food4HealthyLife
  quote: 'For 40-y-olds, estimated life expectancy gains ranged from 6.2 y (with uncertainty interval
    [UI]: 5.7, 7.5 y) for Chinese females to 9.7 y (UI: 8.1, 11.3 y) for United States males following
    sustained changes from typical country-specific dietary patterns to longevity-optimized dietary changes'
rob:
  tool: none
  judgement: moderate
  notes: Same modelling family and therefore the same structural limitations as fadnes2022 (summation
    of separately estimated food-group effects, dose-response curves from observational meta-analyses).
    NOT independent of fadnes2022 - same authors, same method, overlapping inputs. Must not be pooled
    with it as a second study; cohort_family is set to GBD_Food4HealthyLife for both so the pooler de-duplicates.
funding: Trond Mohn Foundation and others (per report)
notes: Included as the updated, covariate-adjusted version of the diet estimate and as a partial check
  on whether the 2022 headline was driven by confounding with adiposity and activity. It was not. Starts
  at 40, so it is worse age-matched than fadnes2022; use fadnes2022 for the comparator table.
