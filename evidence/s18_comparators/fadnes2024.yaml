  conversion_formula: Gain 9.7 y (UI 8.1-11.3) for US males at 40. se on the YEARS scale = (11.3-8.1)/3.919928
    = 0.816341. Pro-rata over e(40)=38.6 gives 0.754 y per 3 years, closely matching the fadnes2022 pro-rata
    route.
  from_figure: false
  inferred_from_ci: false
  direction_note: positive = life expectancy GAINED. Reversed sign, the cost of a typical US diet sustained
    from 40. This 2024 version adds adjustment for height, weight and physical activity, which the 2022
    model lacked, and the estimate BARELY MOVED (9.7 y at 40 vs 8.8 y at 60 in 2022) - modest reassurance
    against confounding by adiposity and activity.
  covariates:
