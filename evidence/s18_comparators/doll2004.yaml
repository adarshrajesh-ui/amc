rob:
  tool: Newcastle-Ottawa
  judgement: low
  notes: '50-year follow-up, near-complete mortality ascertainment, repeated exposure measurement. Male
    British doctors only: a socially and behaviourally atypical cohort. Observational, so residual confounding
    by other risk behaviours cannot be excluded, but the effect size is far too large to be confounding
    alone.'
funding: UK Medical Research Council, Cancer Research UK, British Heart Foundation (per report)
notes: 'THE canonical smoking life-expectancy anchor. Note carefully: the 10-year figure is for PROLONGED
  (lifelong) smoking, not 3 years. The cessation gradient (3/6/9/10 y for quitting at 60/50/40/30) is
  what makes this study usable for our subject, who is stopping an exposure at 19. The abstract''s conclusion
  is even more explicit: ''cessation at age 50 halved the hazard, and cessation at age 30 avoided almost
  all of it.'' Full text not retrievable (BMJ blocks PMC XML download), so the per-cigarettes-per-day
  dose table could not be extracted here; see banks2015 for dose.'
