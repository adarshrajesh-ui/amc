rob:
  tool: AMSTAR-2
  judgement: low
  notes: 'Best-in-class confounding control for BMI: never-smokers only, no chronic disease at recruitment,
    first 5 years of follow-up excluded. Still observational and still a single baseline BMI, and still
    no one under ~20 contributing exposure.'
funding: UK Medical Research Council, British Heart Foundation, National Institute for Health Research,
  US National Institutes of Health
notes: 'Preferred over PSC 2009 for the HR per 5 kg/m2 because of the never-smoker restriction. Two findings
  matter most for transport to a 16-19 year old: (a) the hazard ratio is ~18% larger for MEN than women
  (1.51 vs 1.30), and (b) it is ~26% larger when adiposity is measured at 35-49 than the all-age pooled
  figure. Both push the young-male estimate UP, not down.'
