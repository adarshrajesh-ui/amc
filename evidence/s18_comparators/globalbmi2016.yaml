    older people (1.52, 95% CI 1.47-1.56, for BMI measured at 35-49 years vs 1.21, 1.17-1.25, for BMI
    measured at 70-89 years; pheterogeneity<0.0001), greater in men than women (1.51, 1.46-1.56, vs 1.30,
    1.26-1.33; pheterogeneity<0.0001), but similar in studies with self-reported and measured BMI.
