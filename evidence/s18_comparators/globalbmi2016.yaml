    = 0.015069.
  from_figure: false
  inferred_from_ci: false
  direction_note: 'positive = ELEVATED mortality. CRITICAL FOR TRANSPORT: the BMI-mortality hazard ratio
    is LARGER when adiposity is measured EARLIER in life (1.52 at 35-49 vs 1.21 at 70-89). Extrapolating
    the 35-49 gradient toward ages 16-19 is the direction the data point, so using the pooled 1.29 for
    a young subject is CONSERVATIVE.'
