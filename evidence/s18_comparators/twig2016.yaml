rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: 'CRITICAL LIMITATION for this shard''s purpose: BMI was measured ONCE, at age ~17, and no adult
    BMI was available. Adolescent BMI tracks strongly into adulthood, so these hazard ratios price a LIFELONG
    adiposity TRAJECTORY that merely starts in adolescence - they are not the effect of a transient 3-year
    exposure. Exposure measurement itself is excellent (measured, not self-reported, whole-population
    conscription examination, n=2.3 million).'
funding: Environment and Health Fund
notes: 'Included because it is the only record in this shard whose EXPOSURE IS MEASURED AT EXACTLY OUR
  SUBJECT''S AGE (mean 17.3 y, adolescent_match exact_16_19). It supplies the upper bound for the ''irreversible
  adolescent insult'' story: HR 3.5 for CV death applied permanently from 19 would be ~16 y of life expectancy
  (convert.py). That number is almost certainly an over-attribution and must NOT be used as a 3-year-exposure
  effect. Also note the graded risk began WITHIN the normal BMI range (50th-74th percentile), which matters
  for a subject whose weight gain is modest.'
shard: s18_comparators
