  cohort_family: NHS_HPFS
  quote: The multivariable-adjusted hazard ratios for mortality in adults with 5 compared with zero low-risk
    factors were 0.26 (95% confidence interval [CI], 0.22-0.31) for all-cause mortality, 0.35 (95% CI,
    0.27-0.45) for cancer mortality, and 0.18 (95% CI, 0.12-0.26) for cardiovascular disease mortality.
rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: Health professionals, 90%+ white, all self-reported exposures - a highly selected and unrepresentative
    population, so the absolute life expectancies do not transport. The zero-low-risk-factor group is
    small and multiply disadvantaged, which inflates the contrast. Life expectancy is projected by life
    table from a 30-year follow-up, not observed.
funding: US National Institutes of Health (per report)
notes: 'Screened in as an INTERNAL CONSISTENCY CHECK rather than as a comparator in its own right. It
  is the only source that prices SEVERAL of my comparators jointly, and it caps the whole set at ~12 y
  for a man. It also cross-validates my HR-to-years conversion: its own life-table answer (12.2 y) is
  ~20% smaller than what 10.85*ln(HR) predicts from its own HR, which is the same ~18-20% overshoot the
  convert.py calibration found against four other published anchors. That agreement is why I recommend
  a 0.80 correction factor on life-table-derived YLL.'
