  unit: log hazard ratio
  value: -1.347074
  se: 0.087488
  ci:
  - -1.514128
  - -1.171183
  conversion_formula: HR 0.26 (95% CI 0.22-0.31). log_hr = ln(0.26) = -1.347074. se = (ln(0.31)-ln(0.22))/3.919928
    = 0.087486. Inverted, the worst-lifestyle group has HR 3.85. Applying 10.85*ln(HR) gives 14.6 y, against
    the paper's own life-table figure of 12.2 y for men - a 20% discrepancy that quantifies how HOT the
    naive HR-to-years rule runs (see convert.py calibration).
  from_figure: false
