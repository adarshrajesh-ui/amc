  - 0.058269
  - 0.165514
  conversion_formula: RR 1.12 (95% CI 1.06-1.18). log_rr = ln(1.12) = 0.113329. se = (ln(1.18)-ln(1.06))/3.919928
    = 0.027352. Applied permanently from age 40 in the US male 2023 life table this is 1.23 y of life
    expectancy (convert.py); the same figure applied for 3 years at ages 16-18 only is 0.018 y = 6.4 days.
  from_figure: false
  inferred_from_ci: false
  direction_note: positive = ELEVATED all-cause mortality with short sleep (harm). THE ANCHOR THAT PUTS
    OUR OWN EXPOSURE ON THE COMPARATOR SCALE. Note it is far smaller than the composite-phenotype HR of
    1.43 in li2024sleep.
  covariates:
