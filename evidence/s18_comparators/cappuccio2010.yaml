  followup_years: null
  cohort_family: Cappuccio_2010_pool
  quote: 'In the pooled analysis, short duration of sleep was associated with a greater risk of death
    (RR: 1.12; 95% CI 1.06 to 1.18; P < 0.01) with no evidence of publication bias (P = 0.74) but heterogeneity
    between studies (P = 0.02).'
- outcome_domain: comparator
  outcome_construct: all_cause_mortality_long_sleep_vs_normal
  exposure:
    type: habitual_short_sleep
    dose_h: null
    referent_h: null
    duration_days: null
    contrast_label: long habitual sleep duration vs normal (study-specific definitions)
  scale: log_hr
  unit: log relative risk
  value: 0.262364
  se: 0.031437
  ci:
  - 0.198851
  - 0.322083
  conversion_formula: RR 1.30 (95% CI 1.22-1.38). log_rr = ln(1.30) = 0.262364. se = (ln(1.38)-ln(1.22))/3.919928
    = 0.031333.
  from_figure: false
  inferred_from_ci: false
  direction_note: 'positive = ELEVATED mortality with LONG sleep. Recorded because it is the loudest warning
    sign in the sleep-mortality literature: long sleep, which has no plausible causal mechanism of this
    size, shows a LARGER risk than short sleep. That pattern is the signature of reverse causation and
    confounding by illness, and it should discount the short-sleep estimate too.'
  covariates:
  - study-specific; heterogeneous
  followup_years: null
  cohort_family: Cappuccio_2010_pool
  quote: Long duration of sleep was also associated with a greater risk of death (1.30; [1.22 to 1.38];
    P < 0.0001) with no evidence of publication bias (P = 0.18) but significant heterogeneity between
    studies (P < 0.0001).
rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: Now 16 years old and superseded by larger dose-response meta-analyses. Self-reported sleep duration
    with study-specific and inconsistent cut-points, significant heterogeneity, predominantly middle-aged
    and older cohorts, and the long-sleep result strongly suggests uncontrolled confounding by prevalent
    illness.
funding: Not stated in abstract
notes: Included so that the comparator table has a same-scale figure for OUR OWN exposure, and because
  it is the source of the mortality RRs that RAND (hafner2016) used. cohort_family is set to Cappuccio_2010_pool
  and hafner2016's borrowed RR is flagged, so the pooler must not count them twice. Shard s13_mortality
  owns the definitive sleep-mortality synthesis; this record exists here only for commensurability.
shard: s18_comparators
