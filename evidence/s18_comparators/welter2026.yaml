  notes: An editorial, not a study, so risk-of-bias tools do not apply. Its factual claim about GBD's
    risk-factor and cause hierarchies is verifiable and is what I rely on; its advocacy content is not
    extracted. The authors state the reason for the exclusion is unknown to them, so no mechanism is offered.
funding: Not stated
notes: Recorded because a negative finding of this kind is exactly the sort of thing a downstream report
  gets wrong. GBD 2017 diet, GBD 2016 alcohol, GBD physical inactivity and GBD high-BMI all exist and
  are quotable; there is NO GBD sleep counterpart. Any attempt to compare our subject's exposure to the
  others in DALY space is therefore impossible from GBD and must go through life expectancy instead. The
  authors also note GBD 'could be informed by primary data from large epidemiological resources, such
  as the UK Biobank', i.e. the omission is not a data-availability problem.
