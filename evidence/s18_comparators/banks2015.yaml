rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: Large linked-data cohort with BMI and alcohol adjustment. Volunteer cohort (~18% response), so
    selection bias is likely, though relative risks are usually robust to it. Short follow-up (mean 4.26
    y). Cessation categories are self-reported and recall-based; 'quit before 45' carries survivor bias.
funding: Australian NHMRC; Cancer Council NSW (per report)
notes: Supplies the DOSE gradient the task asked for (cigarettes/day) that Doll 2004's abstract does not,
  plus a third independent 10-year life-expectancy figure and a cessation-before-45 reversibility datum.
  The two-fold RR at a mean of 10 cigarettes/day is the figure to use if the modeller wants a 'moderate
  smoker' rather than a pack-a-day comparator.
