  - outcome_domain: exposure_measurement
    outcome_construct: median_and_mean_rt_should_not_be_used_as_primary_pvt_outcomes
    exposure: {type: descriptive, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "measurement-validity ranking of 10 candidate PVT outcome metrics"}
    scale: raw_units
    unit: "1 = the authors explicitly advise against mean and median RT as primary measures"
    value: 1.0
    se: null
    ci: null
    conversion_formula: "Binary encoding of an explicit measurement recommendation, recorded because it
      changes how OTHER records in this shard should be weighted. Studies whose primary PVT outcome is
      median RT - notably Cohen 2010 and the median-RT slope in Axelsson 2008 - are using a metric this
      paper shows to be among the least sensitive, so their reported effects are conservative and should
      not be averaged on equal footing with lapse-based effects. Conversely, the lapse-based effects that
      dominate this shard (Van Dongen 2003, Belenky 2003, Lo 2016) are on the recommended metrics."
    from_figure: false
    inferred_from_ci: false
    direction_note: "1 = advice against; use lapse counts, mean 1/RT, and mean slowest 10% 1/RT instead"
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "In contrast, PVT mean and median RT outcomes scored low to moderate effect sizes influenced by
      extreme values. ... Due to their superior conceptual and statistical properties and high sensitivity
      to sleep deprivation, metrics involving response speed and lapses should be considered primary
      outcomes for the 10-min PVT. In contrast, PVT mean and median metrics, which are among the most
      widely used outcomes, should be avoided as primary measures of alertness."
rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Two separate single-arm within-subject experiments (33 h TSD, n = 31; 5 nights at 4 h TIB,
    n = 43) with no non-restricted control arm in either, so the paired baseline-versus-exposure contrast
    is confounded with any practice or order effect. The confound is small for the PVT specifically -
    Van Dongen 2003's 8 h control arm drifted only +2.6 lapses over 14 days of 9-times-daily testing -
    but it is not zero and it is not measured here. The primary purpose was psychometric (metric and
    duration optimisation), so the effect sizes are a by-product and the paper reports them only as
    RANGES across metrics rather than per metric; that is why two bracketing effects are recorded above
    instead of one point estimate. Access is abstract-only: the PMC deposit contains the structured
    abstract but no body or tables (checked PMC and Europe PMC full-text endpoints; both returned no
    body), so the per-metric effect sizes, which are the most valuable content, could not be extracted.
    Adults aged 22-45, so transportability to a 16-19 year old is only fair."
funding: "Not stated in the retrieved abstract (NIH and NASA support per the parent programme; not verified)"
notes: |
  DUAL ROLE. This record supplies (a) a properly standardised effect size for a 5-night 4 h TIB dose, and
  (b) the measurement-validity rules that determine how much weight every other PVT-based record in this
  shard should get.

  THE EFFECT SIZES, as reported: 5 nights at 4 h TIB gives d = 0.88 to 1.21 on the sensitive metrics
  (lapses, mean 1/RT, mean slowest 10% 1/RT), n = 43. Thirty-three hours awake gives d = 1.59 to 1.94,
  n = 31. Both from paired within-subject comparisons in one laboratory with one metric set.

  A CROSS-CHECK THAT INCREASES CONFIDENCE IN THIS SHARD'S CENTRAL ESTIMATE. Van Dongen 2003's 4 h arm
  versus 8 h arm at day 14 gives |g| = 1.44 (SE 0.49) from my digitisation of Figure 1 and the
  band-derived SD (recorded as +1.435 in vandongen2003.yaml, where positive = more lapses = worse; the
  sign convention differs between records because the constructs differ, so compare magnitudes only).
  Basner's independent, directly measured, better-powered estimate for a shorter
  exposure at the same dose is d = 0.88-1.21. The two agree closely once duration is accounted for -
  Basner's 5 nights should sit just below Van Dongen's 14 nights, and it does. That is meaningful
  corroboration of the digitised Van Dongen effect, which is otherwise the single most load-bearing and
  most methodologically fragile number in this shard.

  THE PER-HOUR-OF-LOST-SLEEP COMPARISON IS WORTH STATING EXPLICITLY, because it inverts the intuitive
  ordering. Five nights at 4 h TIB against an 8 h referent forfeits about 20 h of sleep and yields
  d ~ 1.05. Thirty-three hours awake forfeits about 8 h of sleep relative to a normal night and yields
  d ~ 1.77. Per episode the all-nighter is worse; per hour of sleep lost the all-nighter is about four
  times more potent. So chronic restriction is not a "diluted" all-nighter - it produces less impairment
  per hour forfeited but is applied over vastly more hours. Over three years at 5-6 h on weekdays our
  subject forfeits on the order of 1,500-2,000 hours of sleep, which is why the chronic exposure
  dominates despite its lower potency per hour.

  METRIC GUIDANCE THAT SHOULD PROPAGATE DOWNSTREAM: prefer lapse counts, mean 1/RT (response speed) and
  mean slowest 10% 1/RT. Avoid mean RT and median RT, which are distorted by extreme values and scored
  only low-to-moderate sensitivity. Also relevant to any future data collection: "for some outcomes, high
  effect sizes could be achieved with PVT durations considerably shorter than 10 min, although metrics
  involving lapses seemed to profit from longer test durations in TSD."
shard: "s01_cognition_dose_response"
