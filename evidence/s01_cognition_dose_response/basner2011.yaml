effects:
  - outcome_domain: cognition
    outcome_construct: pvt_lapse_and_speed_effect_size_5_nights_of_4h_tib_lower_bound
    exposure: {type: chronic_restriction, dose_h: 4, referent_h: null, duration_days: 5,
               contrast_label: "5 nights of 4h TIB vs own rested baseline, paired t-test, n=43; LOWER end of the reported range"}
    scale: cohens_d
    unit: null
    value: -0.88
    se: 0.1526
    ci: [-1.179, -0.581]
    conversion_formula: "The paper reports a RANGE of effect sizes (0.88-1.21) across the PVT metrics
      related to lapses and to psychomotor speed, in a paired within-subject design with n = 43. I record
      the two endpoints as two separate conservative effects rather than inventing a point estimate.
      SE for a one-sample/paired standardised mean difference: SE = sqrt(1/n + d^2/(2n)) =
      sqrt(1/43 + 0.88^2/86) = 0.1526. CI = d +/- 1.96*SE. Sign set negative to mean impairment,
      matching the convention used elsewhere in this shard.
      WHY THIS IS THE MOST DIRECTLY USABLE NUMBER IN THE RECORD: it is a purpose-built, adequately powered
      (n = 43) standardised effect for exactly 5 consecutive nights at 4 h TIB - the canonical
      short-chronic dose - measured with the metrics the same paper identifies as optimal."
    from_figure: false
    inferred_from_ci: false
    direction_note: "negative = impaired. Magnitude ~0.9-1.2 SD for lapses and speed after 5 nights at
      4h TIB, versus 1.59-1.94 SD for 33h total deprivation in the same laboratory with the same metrics."
    covariates: ["paired within-subject comparison against each subject's own rested baseline"]
    followup_years: null
    cohort_family: null
    quote: "In a paired t-test paradigm and for both TSD and PSD, effect sizes of 10 different PVT
      performance outcomes were calculated. Effect sizes were high for both TSD (1.59-1.94) and PSD
      (0.88-1.21) for PVT metrics related to lapses and to measures of psychomotor speed, i.e., mean 1/RT
      (response time) and mean slowest 10% 1/RT."
