    outcome_construct: pvt_lapse_and_speed_effect_size_5_nights_of_4h_tib_upper_bound
    exposure: {type: chronic_restriction, dose_h: 4, referent_h: null, duration_days: 5,
               contrast_label: "5 nights of 4h TIB vs own rested baseline, paired t-test, n=43; UPPER end of the reported range"}
    scale: cohens_d
    unit: null
    value: -1.21
    se: 0.1657
    ci: [-1.535, -0.885]
    conversion_formula: "Upper endpoint of the reported 0.88-1.21 range. SE = sqrt(1/43 + 1.21^2/86) =
      0.1657; CI = d +/- 1.96*SE. Best-performing metrics per the paper are lapse counts, mean 1/RT and
      mean slowest 10% 1/RT. The two endpoints should be treated as bracketing a single quantity, not as
