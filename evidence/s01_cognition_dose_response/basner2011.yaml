  - outcome_domain: comparator
    outcome_construct: ratio_of_total_deprivation_to_chronic_restriction_effect_size
    exposure: {type: total_deprivation, dose_h: 0, referent_h: 4, duration_days: 1,
               contrast_label: "33h total sleep deprivation (n=31) vs 5 nights of 4h TIB (n=43), same lab, same metrics"}
    scale: raw_units
    unit: "ratio of the TSD effect-size range midpoint to the PSD effect-size range midpoint"
    value: 1.69
    se: null
    ci: null
    conversion_formula: "Midpoints: TSD (1.59+1.94)/2 = 1.765; PSD (0.88+1.21)/2 = 1.045; ratio =
      1.765/1.045 = 1.69. Computed here; no SE derivable without the covariance of the two ranges.
      INTERPRETATION: one night of total deprivation is worth roughly 1.7x five nights at 4 h TIB on the
      same metrics in the same laboratory - so about 3 nights at 4 h TIB per all-nighter equivalent.
      This is the single cleanest within-laboratory calibration between the two exposure types available
      in this shard, and it is far more trustworthy than comparing across the meta-analyses (Lim & Dinges
      2010 pooled TSD lapse g = -0.76 versus Lowe 2017 pooled restriction g = -0.41), because it holds
      the laboratory, the task, the metric set and the analysis constant."
    from_figure: false
    inferred_from_ci: false
    direction_note: "larger = total deprivation is relatively more damaging per episode; note that on a
      per-hour-of-lost-sleep basis restriction is MORE efficient at producing impairment, since 5 nights
      at 4h loses ~20h of sleep versus ~8h for one all-nighter yet produces 60% of the effect"
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "Repeated-measures experiments involving 10-min PVT assessments every 2 h across both acute
