rob:
  tool: none
  judgement: na
  notes: "Theoretical / biomathematical paper, not a new experiment. It contributes no independent
    observations; all data are re-used from Van Dongen 2003 (n=48) and Belenky 2003 (n=66), both of
    which are separately recorded in this shard. Each effect therefore carries the cohort_family of the
    data it was fitted to - UPenn_GCRC_2003 for the two parameters fitted to Van Dongen's 404
    group-average points, WRAIR_2003 for the out-of-sample check on Belenky - using the SAME strings
    vandongen2003 and belenky2003 use, so a pooler de-duplicating on that field will collapse them
    instead of counting a refit of existing data as new evidence. The fourth effect is a structural
    claim about two models disagreeing, not a sample estimate, so it stays null.
    Included ONLY as the source of a published functional
    form and of the 3.8 h bifurcation estimate. The 404 fitted points are group averages, so the fit
    ignores between-subject variance and the reported explained-variance figures are NOT comparable to
    subject-level R-squared. Wc = 20.2 h has no published confidence interval, which matters because
    the qualitative claim (converge vs diverge) hinges on which side of it a dose falls."
funding: "Congressionally Directed Medical Research Program award W81XWH-05-1-0099; Air Force Office of
  Scientific Research; NIH grants NR004281, RR00040"
notes: |
  WHY THIS RECORD EXISTS. Van Dongen 2003 and Belenky 2003 appear to contradict each other: Van Dongen
  found impairment still accumulating at day 14 with no plateau, Belenky found stabilisation in the 5 h
  and 7 h arms but escalation in the 3 h arm. This paper resolves the contradiction with a single model
  possessing a bifurcation: below a critical daily wakefulness Wc, trajectories CONVERGE to a stable
  plateau; above Wc they DIVERGE. Both datasets are then explained by one parameter set. The verbatim
  equations and the fitted coefficients are reproduced in notes_for_modeller.md.

  THE ESTIMATE THAT MATTERS: Wc = 20.2 h wake / 3.8 h sleep per day. Our subject's habitual weekday
  dose of 5-6 h sits comfortably in the CONVERGENT regime, which predicts his weekday deficit reaches a
  plateau rather than growing without limit over three years. His occasional 3-4 h pre-exam nights sit
  at or below Wc, in the divergent regime, which predicts disproportionate impairment on exactly those
  nights. A model that is linear in nightly sleep hours will get both of these wrong in opposite
  directions.

  IMPORTANT CAVEAT ON "PLATEAU". Convergence to a stable equilibrium does NOT mean recovery, and it does
  not mean the plateau is at an unimpaired level. It means the deficit stops growing at a level set by
  the prevailing wake/sleep ratio. The plateau level itself is dose-dependent and, per Eqs (23), rises
  as W rises.

  KEY MECHANISTIC CLAIM WITH A DOSE COROLLARY. The authors tie Wc to slow-wave activity: "SWA during
  sleep is substantially preserved when wake duration is no greater than ~20h per day (Brunner et al.,
  1993; Van Dongen et al., 2003). However, when daily wakefulness is extended beyond ~20h, then
  insufficient time for sleep remains to fully express SWA". They hypothesise SWA is a correlate of
  adenosine-receptor downregulation during sleep. If correct, the threshold is a property of how much
  sleep time is needed to express a fixed amount of SWA, which is age-dependent - and adolescents have
  substantially higher SWA. Nothing in this paper calibrates Wc in adolescents, and I could find no
  paper that does. Flagged as the largest transportability hole in the functional-form literature.

  SUCCESSOR MODEL. McCauley et al. 2013 (Sleep 36(12):1987-1997, PMID 24293775, doi 10.5665/sleep.3246)
  updates the same model class with time-dependent circadian amplitude and reports that "the
  homeostatic equilibrium for sleep/wake regulation-and thus sensitivity to sleep loss-depends not only
  on the duration but also on the circadian timing of prior sleep". Only the abstract was retrievable,
  so no parameters were extracted from it; it is logged as screened-abstract-only rather than given its
  own record.

  THREE POSITIVE STRUCTURAL PREDICTIONS THE MODEL MAKES, verbatim, that the modeller can treat as
  testable priors: (a) performance is "a function of the prevailing wake/sleep ratio" rather than of
  cumulative debt; (b) "Sleep/wake history is fully represented by the current performance level (p or
  q) and the current level of the asymptote (u or v), and past amounts of sleep and wake have no
  further impact beyond the present"; (c) at exactly W = Wc "there is no equilibrium state, resulting
  in an asymptotically linear build-up of performance impairment across days" - i.e. the observed
  quasi-linear accumulation in Van Dongen's 4 h arm is what a system sitting near its bifurcation
  looks like, not evidence of true unbounded linearity.
