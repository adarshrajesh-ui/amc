  - outcome_domain: sleep_need
    outcome_construct: objective_sleepiness_dose_response_attenuates_with_age_while_vigilance_dose_response_does_not
    exposure: {type: chronic_restriction, dose_h: 7, referent_h: 10, duration_days: 4,
               contrast_label: "MSLT sleep-onset log-likelihood, 7h and 8.5h vs 10h TIB, and its interaction with age"}
    scale: log_or
    unit: "log-odds of falling asleep per minute of the MSLT, 7h TIB vs 10h TIB"
    value: 1.90
    se: 0.08
    ci: [1.7432, 2.0568]
    conversion_formula: "Reported directly as a log-likelihood increment with SE: 'Reducing TIB from 10 to 7
      hours increased the log-likelihood by 1.90 +/- 0.08 (t75 = 24.8, p < 0.0001), or a 6.7-fold increase in
      the odds of falling asleep in each minute.' Recorded on the log_or scale as reported;
      exp(1.90) = 6.69, matching the authors' 6.7-fold statement. CI = 1.90 +/- 1.96 x 0.08.
      The intermediate dose is 0.86 +/- 0.07 for 8.5h vs 10h (t75 = 11.6, p < 0.0001), a 2.4-fold odds
      increase. THREE-POINT DOSE LADDER ON A LOG-ODDS SCALE: 0 (10h), 0.86 (8.5h), 1.90 (7h). Note this is
      MORE than linear - halving the TIB decrement from 3h to 1.5h cuts the log-odds by more than half
      (0.86/1.90 = 0.45), i.e. objective sleep propensity accelerates as TIB falls, which is the opposite of
      saturation and is consistent with the convex/accelerating shape Van Dongen 2003 found for lapses.
      Age main effect: 0.46 +/- 0.04 per year (1.6-fold per year of age).
      THE DISSOCIATION THIS RECORD EXISTS TO DOCUMENT, and it is quantified on both sides:
        SLEEPINESS (MSLT): the dose effect SHRINKS with age - for 7h vs 10h the log-likelihood increment
          falls by 0.14 +/- 0.05 per year (t75 = -2.83, p = 0.0060), a factor of 0.87/year.
        VIGILANCE (PVT):   the dose effect DOES NOT shrink with age - F2,2318 = 2.10, p = 0.12 (null).
      So in the same subjects, on the same nights, physiological sleep pressure becomes progressively LESS
      responsive to sleep dose across adolescence while objective performance stays exactly as responsive.
      An older adolescent therefore registers less of a sleepiness signal for the same performance cost.
      THIS IS THE ADOLESCENT-SPECIFIC MECHANISM FOR THE SUBJECTIVE/OBJECTIVE DISSOCIATION the brief asks
      about, and it is worse than the adult version: in adults (Van Dongen 2003) the subjective signal
      plateaus over DAYS within an exposure; here the sleepiness channel's very sensitivity to dose is
      eroding over YEARS of maturation, precisely across the ages our subject was exposed."
    from_figure: false
    inferred_from_ci: false
    direction_note: "POSITIVE = greater sleep propensity = more impaired/sleepier. Larger log-odds means
      restriction made them fall asleep faster during the MSLT."
    covariates: ["time of day", "order (adaptation to lab)", "age as continuous", "nonlinear mixed-effects survival analysis"]
    followup_years: 3.0
    cohort_family: Campbell_Feinberg_Davis
    quote: "Reducing TIB from 10 to 8.5 hours increased the log-likelihood by 0.86 +/- 0.07 (t75 = 11.6,
      p < 0.0001), or a 2.4-fold (e0.86) increase in the odds of falling asleep in each minute. Reducing TIB
