    se: 0.8
    ci: [39.93, 43.07]
    conversion_formula: "Reported directly with its SE: 'a significant (F1,471 = 2777, p < 0.0001) increase
      of 41.5 +/- 0.8 minutes of TST for each additional hour of TIB'. CI = 41.5 +/- 1.96 x 0.8.
      THIS IS THE TIB-TO-TST CONVERSION FACTOR THE WHOLE SHARD NEEDS, measured in adolescents by PSG, and it
      is the single most reusable number in this record. 41.5 min TST per hour of TIB = 0.692 h/h, i.e. only
      69% of an hour of time in bed converts into sleep in this age group.
      CONSEQUENCES:
        - Every dose expressed in TIB in this shard (4/6/8h in Van Dongen 2003; 3/5/7/9h in Belenky 2003;
          5/9h in Lo; 7/8.5/10h here) OVERSTATES actual sleep. A '6h TIB' arm is roughly 5.1h of sleep.
        - Effects expressed per hour of TIB must be divided by 0.692 to become effects per hour of SLEEP,
          which INFLATES them by ~45%. Mixing TIB-based and TST-based dose scales without this conversion is
          a silent 45% error, and both scales appear in this shard's sources.
        - Our subject's self-reported 5-6h is presumably closer to time in bed than to sleep, so his true
          sleep may be nearer 3.5-4.2h on the 5h nights - i.e. the exposure may be MORE severe than the
          nominal figures imply.
      Per-arm night-4 TST (mean +/- SE, 3-year average): 405 +/- 1 min at 7h TIB, 471 +/- 2 min at 8.5h TIB,
