  - outcome_domain: cognition
    outcome_construct: pvt_shows_no_practice_effect_and_instead_carries_over_prior_dose_damage
    exposure: {type: descriptive, dose_h: 7, referent_h: 10, duration_days: 4,
               contrast_label: "order/carryover effect on PVT across repeated laboratory visits in adolescents"}
    scale: raw_units
    unit: "-1 = performance DECLINED across repeated testing (no practice gain); decline largest after the most restricted prior condition"
    value: -1.0
    se: null
    ci: null
    conversion_formula: "Directional encoding of an explicitly reported methodological finding; no effect
      size is printed for it, so se is null.
      THIS IS THE MOST IMPORTANT PRACTICE-EFFECT DATUM IN THIS SHARD FOR ADOLESCENTS, and it answers the
      brief's fourth specific request directly. Two separate claims:
        (a) DIRECTION. 'Instead of showing a learning effect, PVT performance decreased with repeated visits
            to the lab.' So on the PVT there is no practice confound to subtract in adolescents - the naive
            worry that repeated testing inflates apparent recovery does not apply. This agrees with
            Cohen 2010's finding of negligible PVT practice effects in adults and with Basner & Dinges 2011's
            recommendation of lapses/speed as the stable metrics.
        (b) CARRYOVER, which is the bigger deal. 'the performance decline depended on the preceding
            conditions; the decline was greatest following the 7-hour TIB condition.' Damage from a
            restriction arm persisted into subsequent arms even after intervening washout - the same
            residual-deficit phenomenon that Yamazaki 2021 reports after 4 nights of 12h recovery TIB and
            that Koa 2024 calls ratcheting. Here it is visible in ADOLESCENTS and it was strong enough that
            the authors had to enter the full order history as a covariate (they enumerate five distinct
            orders for the 7h condition alone) to recover an unbiased TIB effect.
      MODELLING CONSEQUENCE: a within-subject crossover analysed WITHOUT order covariates will
      UNDERESTIMATE the dose-response, because the control arms of later blocks are contaminated by earlier
      restriction. Effect sizes from crossover studies that do not adjust for order should be treated as
      lower bounds."
    from_figure: false
    inferred_from_ci: false
    direction_note: "-1 = repeated testing made performance WORSE, not better; and the worsening was
      proportional to how restricted the preceding condition had been. Practice does not mask harm here;
      carryover masks harm."
    covariates: ["order of TIB conditions entered as a covariate with five enumerated orders for the 7h condition"]
    followup_years: 3.0
    cohort_family: Campbell_Feinberg_Davis
    quote: "An order effect was also apparent in the PVT results. Instead of showing a learning effect, PVT
      performance decreased with repeated visits to the lab. As has been observed in adults, the performance
      decline depended on the preceding conditions; the decline was greatest following the 7-hour TIB
      condition. This confound was overcome by including in the TIB model the order of each TIB condition as
