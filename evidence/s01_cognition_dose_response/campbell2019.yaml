               contrast_label: "does the TIB effect on PVT shrink between ages 9.8 and 16.2? (age x TIB interaction)"}
    scale: raw_units
    unit: "0 = no significant age moderation of the TIB effect on PVT"
    value: 0.0
    se: null
    ci: null
    conversion_formula: "Encoding of the reported null interaction: F2,2318 = 2.10, p = 0.12 on the
      categorical-TIB model, and F1,2067 = 2.19, p = 0.14 on the continuous-TST model. Two independent
      specifications, both null, in a LONGITUDINAL within-subject design spanning ages 9.8-16.2 - which is
      the strongest available test of this question because each child serves as his own control as he ages.
      se is null: a null interaction has no point estimate to attach an SE to.
      WHY THIS IS DECISION-RELEVANT AND NOT JUST A NULL: the natural objection to using adolescent
      restriction data for an 18-year-old is that older adolescents might tolerate short sleep better. On the
      PVT that objection is unsupported: the vigilance cost per hour of lost TIB is the same at 16 as at 10.
      It licenses carrying the 0.24 dB/h slope across the whole 16-19 window without an age discount.
      THE CAVEAT THE AUTHORS THEMSELVES RAISE, and it cuts against over-reading the null: 'for the older
      participants 10 hours TIB did not produce better performance than 8.5 hours TIB', with a significant
      10-vs-8.5h benefit in the youngest quartile (F1,562 = 6.47, p = 0.011) but not the oldest
      (F1,544 = 1.17, p = 0.28). So the TOP of the dose curve may flatten with age even though the overall
      slope does not - i.e. for a 16-19 year old the marginal value of the 9th and 10th hour may be smaller
      than for a 10 year old, while the cost of dropping to 7h is undiminished. That asymmetry matters for
      our subject because it means his weekend catch-up above ~8.5h may buy less than a linear model implies,
      while his weekday deficit costs full price."
    from_figure: false
    inferred_from_ci: false
    direction_note: "0 = no age moderation. The per-hour vigilance penalty does not shrink as adolescents
