      year of age (t75 = -2.83, p = 0.0060)."
rob:
  tool: RoB2
  judgement: some_concerns
  notes: "STRENGTHS: three TIB doses (7 / 8.5 / 10 h) x four consecutive nights, every participant
    completing all three each year, repeated ANNUALLY for 3 years across ages 9.8-16.2 - so both the dose
    contrast and the age contrast are within-subject, which is the only design that can cleanly test whether
    sleep need changes with age. All-night PSG on nights 2 and 4 of every condition verified the exposure
    objectively; adherence was enforced (TIB deviations >1h caused rescheduling or exclusion, affecting <1%
    of conditions); time of day was controlled by four test batteries at fixed 2-hour intervals and entered
    in every model. The PVT outcome (log signal-to-noise ratio) was chosen specifically to avoid ceiling and
    floor artefacts in a longitudinal design.
    CONCERNS: (1) CONDITION ORDER WAS NOT RANDOMISED - 'Allowing flexibility in scheduling (to accommodate
    schoolwork, etc.) prevented us from randomly assigning the order in which each participant completed the
    schedules', handled by entering order as a covariate rather than by design. This matters more than usual
    here because the paper itself shows a real carryover effect whose size depends on the preceding dose, so
    the adjustment is doing genuine work and residual confounding cannot be excluded. (2) NO MEASURE OF
    CIRCADIAN PHASE, and restriction was achieved by delaying bedtime while holding rise time fixed, so an
    unmeasured phase delay could contribute to the TIB effect - the authors flag this explicitly, and
    Short 2018 (PMID 29325109) measured exactly this and found dose-dependent delays, so the concern is
    substantiated rather than hypothetical. (3) The 8.5h TIB washout preceding every condition 'may have
    produced a sleep debt preceding the four-night TIB schedule', so all three arms sit on a mildly
    restricted baseline and the 10h arm is not a true well-rested reference - this biases the dose-response
    toward zero. (4) Attrition: 76 of the original cohort completed >=2 of 3 years, 67 completed year 3, and
    the commonest reason for withdrawal was conflict between schoolwork and the TIB schedules, which is
    plausibly correlated with the exposure of interest. (5) FOUR NIGHTS ONLY - this study measures dose
    sensitivity, not accumulation, and cannot speak to the 14-day trajectory question.
    (6) Age range 9.8-16.2 sits BELOW our subject's 16-19 at its upper edge; adolescent_match is recorded as
    exact_16_19 because the upper tail reaches 16.2 and because the paper's own null age-interaction result
    is the licence for extrapolating to 19, but the mean age is 13.2 and that should inflate uncertainty."
funding: "U.S. Public Health Service grant R01-HL116490."
notes: |
  WHAT THIS RECORD UNIQUELY SUPPLIES. Four things no other study in this shard provides together:

  1. A PER-HOUR VIGILANCE SLOPE IN ADOLESCENTS, on a scale with no ceiling or floor: 0.24 dB of PVT
     log-signal-to-noise per hour of TIB (equivalently 0.29 +/- 0.04 dB per hour of actual sleep, which the
     paper estimates independently). Restricting from 10h to 7h TIB for four nights costs 15.5% of
     information-processing fidelity. The three per-dose model estimates (12.15 / 12.55 / 12.88 dB at
     7 / 8.5 / 10 h) are almost exactly collinear, so the adolescent dose-response is LINEAR in TIB across
     the mild-to-moderate range - a genuinely useful structural fact, because the adult literature
     (Van Dongen 2003) finds convex acceleration at 4-6h. Linear in the mild range, convex in the severe
     range is a coherent overall shape.

  2. THE TIB-TO-TST CONVERSION FACTOR, by PSG, in adolescents: 41.5 +/- 0.8 min of sleep per hour of time in
     bed, i.e. 69% efficiency, with per-arm values 405 / 471 / 530 min at 7 / 8.5 / 10 h TIB. This is a
     housekeeping number but it silently rescales every other effect in the shard by ~45% if you convert
     between TIB-dose and sleep-dose. Two of the four required studies in the brief (Van Dongen 2003,
     Belenky 2003) express dose as TIB; Lo 2016 and this one do too. Any spline fitted on a sleep axis needs
     this factor.

  3. EVIDENCE THAT THE ADOLESCENT VIGILANCE PENALTY DOES NOT SHRINK WITH AGE (F2,2318 = 2.10, p = 0.12 on
     TIB; F1,2067 = 2.19, p = 0.14 on TST). This is the formal licence for transporting adolescent
     dose-response estimates across the 16-19 window. The one qualification, and it is a real one: the
     10-vs-8.5h benefit was significant in the youngest quartile but not the oldest, so the TOP of the curve
     may flatten with age. Read together: for our subject the cost of falling to 7h is undiminished, but the
     benefit of climbing above 8.5h may be smaller than a linear model predicts. That asymmetry makes
     weekend catch-up look worse, not better.

  4. THE CLEANEST ADOLESCENT INSTANCE OF THE SUBJECTIVE/PHYSIOLOGICAL VERSUS OBJECTIVE DISSOCIATION, and it
     is a DIFFERENT mechanism from the adult one. In adults the subjective signal plateaus across days
     within an exposure (Van Dongen 2003). Here, in the same subjects on the same nights, the MSLT
     sleepiness response to dose ATTENUATES WITH AGE (-0.14 +/- 0.05 log-odds per year, p = 0.0060) while
     the PVT response to dose does not attenuate at all (p = 0.12). The authors call the pair of findings
     paradoxical and attribute them to different maturation rates in arousal versus information-processing
     systems. For our subject the implication is uncomfortable and specific: across exactly the ages he was
     exposed, his physiological sleepiness signal was becoming a progressively worse indicator of his actual
     vigilance cost. He would not have felt the deficit growing.

  PLUS THE PRACTICE-EFFECT ANSWER THE BRIEF ASKS FOR. 'Instead of showing a learning effect, PVT performance
  decreased with repeated visits to the lab... the decline was greatest following the 7-hour TIB condition.'
  Two conclusions: there is no PVT practice gain to subtract in adolescents (consistent with Cohen 2010 in
  adults), and restriction damage carries across blocks in proportion to prior dose. The second means
  unadjusted crossover analyses understate the dose-response, so such estimates are lower bounds.

  RELATION TO THE OTHER TWO RECORDS FROM THIS PROGRAMME. campbell2017 (PMID 28419388, n = 77, ages 9.9-14)
  is year 1 of the same protocol reporting MSLT and KSS; campbell2024 (PMID 39283917, n = 159, ages
  9.9-22.8) extends the programme to a cognitive battery and an older cohort. All three share
  cohort_family Campbell_Feinberg_Davis and OVERLAP IN PARTICIPANTS - the pooler must not treat them as
  independent samples. They are kept as separate records because they report non-overlapping OUTCOMES
  (this one: PVT LSNR + MSLT + TST; campbell2017: MSLT + KSS; campbell2024: executive/working-memory
  battery), and the brief asks for outcome-level detail.
shard: "s01_cognition_dose_response"
