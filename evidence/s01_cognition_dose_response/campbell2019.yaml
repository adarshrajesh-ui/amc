  - outcome_domain: cognition
    outcome_construct: pvt_fidelity_of_information_processing_pct_loss_7h_vs_10h
    exposure: {type: chronic_restriction, dose_h: 7, referent_h: 10, duration_days: 4,
               contrast_label: "7h TIB vs 10h TIB for 4 consecutive nights, adolescents, PVT information-processing fidelity"}
    scale: pct_change
    unit: "% loss in fidelity of information processing at 7h TIB relative to 10h TIB"
    value: -15.47
    se: null
    ci: null
    conversion_formula: "The paper states the 7h->10h direction as an 18.3% IMPROVEMENT. Expressed the other
      way round, as the loss incurred by restricting from 10h to 7h:
        10^((12.15 - 12.88)/10) - 1 = 10^(-0.073) - 1 = 0.8453 - 1 = -0.1547, i.e. -15.47%.
      (18.3% gain going up and 15.5% loss coming down are the same ratio, 1.183 = 1/0.8453; both are
      correct, they differ only in the denominator. Recorded in the loss direction so the sign convention
      matches the rest of this shard.) se is null because the paper reports no interval on this derived
      percentage.
      WHY LSNR RATHER THAN LAPSES: the authors chose log signal-to-noise ratio deliberately because it has
      no ceiling or floor and because, in a LONGITUDINAL study where the reference level is itself moving
      with maturation, a dB change means the same thing regardless of baseline - 'a -3dB change in LSNR
      always means a 50% reduction in the fidelity of information processing regardless of the reference
      point'. For our subject, who was exposed from 16 to 19 while still maturing, that scale-invariance is
      exactly the property needed, and it is why this record is worth more than its small effect size
      suggests.
      CALIBRATION ANCHOR SUPPLIED BY THE AUTHORS: a full night of total sleep deprivation costs adults about
      -3 dB (50%) at the circadian trough. Four nights at 7h TIB costs adolescents -0.73 dB. So four nights
      of mild-to-moderate restriction buys roughly a quarter of the LSNR decrement of one all-nighter.
      That is a useful sanity bound on how much a single short week can do."
