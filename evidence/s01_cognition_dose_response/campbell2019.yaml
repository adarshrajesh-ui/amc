               contrast_label: "PVT LSNR per additional hour of TIB, modelled at age 13.2 y and 09:00, across 7 / 8.5 / 10 h TIB x 4 nights"}
    scale: per_hour_beta
    unit: "dB of PVT log signal-to-noise ratio per additional hour of TIB (positive = better)"
    value: 0.2433
    se: 0.0509
    ci: [0.1435, 0.3431]
    conversion_formula: "DERIVED BY THIS SHARD by two independent routes, which agree to within 20%.
      ROUTE 1 - OLS through the three published per-dose model estimates. The paper prints LSNR = 12.15 dB
      (7h), 12.55 dB (8.5h), 12.88 dB (10h), centred at age 13.2 y and 09:00.
        mean TIB = 8.5 ; mean LSNR = (12.15+12.55+12.88)/3 = 12.52667
        Sxx = (-1.5)^2 + 0^2 + (1.5)^2 = 4.5
        Sxy = (-1.5)(-0.37667) + 0 + (1.5)(0.35333) = 0.565 + 0.530 = 1.095
        slope = 1.095 / 4.5 = 0.24333 dB per hour of TIB
      The three points are almost perfectly collinear (residuals -0.0117, +0.0233, -0.0117 dB), so the
      within-fit SE is a meaningless 0.011 dB/h - it measures only the straightness of the published curve,
      not sampling error. That collinearity is itself a substantive finding and is why this record claims the
      adolescent dose-response is LINEAR in TIB across 7-10h.
      ROUTE 2 - the paper's own independently estimated continuous-TST slope, rescaled to a TIB axis using
      the PSG-measured conversion factor reported in the same paper:
        LSNR rose 0.29 +/- 0.04 dB per hour of TOTAL SLEEP TIME (F1,2067 = 45.2, p < 0.0001)
        41.5 +/- 0.8 min TST per hour of TIB = 0.69167 h TST per h TIB
        slope = 0.29 x 0.69167 = 0.20058 dB per h TIB ; SE = 0.04 x 0.69167 = 0.02767
      REPORTED VALUE = 0.2433 (Route 1, because the brief asks for per-arm data).
      REPORTED SE = 0.0509, formed by combining Route 2's sampling SE with the between-route discrepancy in
      quadrature: discrepancy = 0.24333 - 0.20058 = 0.04275;
      SE = sqrt(0.02767^2 + 0.04275^2) = sqrt(0.00076563 + 0.00182756) = sqrt(0.00259319) = 0.05092.
      CI = 0.24333 +/- 1.96 x 0.05092 = [0.1435, 0.3431]. This deliberately carries the structural
      uncertainty between the two estimators rather than quoting the narrower of the two.
      DIRECTION: positive slope = MORE TIB gives BETTER performance, so restriction is harmful."
    from_figure: false
    inferred_from_ci: false
    direction_note: "POSITIVE = better vigilance with more sleep. Harm from restriction is the negative of
      this: each hour of TIB LOST costs 0.24 dB of PVT signal-to-noise in adolescents."
