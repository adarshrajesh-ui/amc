    conversion_formula: "Structural encoding of the model's defining assumption. No parameters could be
      extracted: the paper is paywalled at Elsevier, is not in PMC, and Unpaywall lists no OA copy, so only
      the abstract was retrievable. I have NOT transcribed any equations or coefficients for this model, and
      none should be attributed to it.
      WHY THE RECENCY WEIGHTING IS THE DECISION-RELEVANT PART: it is a third position on the question that
      divides Van Dongen 2003 from McCauley 2009. Van Dongen's excess-wakefulness model weights ALL past
      sleep loss equally (Sigma is an unweighted cumulative sum). McCauley's model weights only the PRESENT
      state ('past amounts of sleep and wake have no further impact beyond the present'). Rajdev's model sits
      between them: history matters, but with an exponential-style decay so recent weeks dominate.
      FOR OUR SUBJECT THIS IS THE DIFFERENCE BETWEEN THREE MODELS OF A THREE-YEAR EXPOSURE: unweighted
      accumulation implies the deficit reflects all 1,000+ short nights; pure state-dependence implies only
      the last few nights matter; recency weighting implies the deficit reflects roughly the last few weeks.
      These give very different answers and the literature does not settle between them."
