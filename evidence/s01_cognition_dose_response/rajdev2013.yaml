    quote: "To better quantify performance during both CSR and TSD, we developed a unified mathematical model
      that incorporates extant sleep debt as a function of a known sleep/wake history, with recent history
      exerting greater influence. This incorporation of sleep/wake history into the classical two-process
      model captures an individual's capacity to recover during sleep as a function of sleep debt and
      naturally bridges the continuum from CSR to TSD by reducing to the classical two-process model in the
      case of TSD."
