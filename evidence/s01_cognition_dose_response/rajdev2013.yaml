  judgement: na
  notes: "Theoretical paper contributing no new observations; all data are re-used from three prior
    experiments. Included solely as a candidate functional form. Two specific reasons to discount it relative
    to McCauley 2009: first, ACCESS - only the abstract was retrievable (Elsevier paywall, not in PMC,
    Unpaywall reports no OA location), so unlike McCauley 2009 I could not extract a single equation or
    coefficient, and this record therefore cannot be used to implement anything; second, INDEPENDENCE - the
    author group overlaps with the sleep-banking experiment (Rupp 2009) that the model is credited with
    reproducing, so that particular success is a fit rather than a validation. The claim of superiority over
    'two previously published models' also cannot be checked without the full text, and the identity of those
    comparators is not stated in the abstract. Treat as a pointer, not as a usable model - and follow the
    pointer to ramakrishnan2016, the same group's successor paper, which was retrieved in full and does carry
    the equations and fitted parameters this record lacks."
funding: "US Army Medical Research and Materiel Command / Telemedicine and Advanced Technology Research Center
  (per the author affiliations; not restated in the retrieved abstract)"
notes: |
  RECORDED FOR ONE REASON: it is the third distinct published answer to the question of how sleep/wake
  history should enter a dose-response function, and the three answers have materially different implications
  for a three-year exposure.

    Van Dongen 2003 (excess wakefulness)  Sigma = unweighted cumulative sum of excess wake hours.
                                          All history counts equally. No recovery term at all.
    McCauley 2009 (bifurcation)           State-dependent. "Sleep/wake history is fully represented by the
                                          current performance level ... and the current level of the
                                          asymptote ... past amounts of sleep and wake have no further impact
                                          beyond the present."
    Rajdev 2013 (unified)                 Recency-weighted: "incorporates extant sleep debt as a function of
                                          a known sleep/wake history, with recent history exerting greater
                                          influence."

  For our subject the practical difference is large. Under the unweighted form, three years of weekday
  restriction has been integrating since age 16 and his deficit should be far larger than a two-week
  laboratory subject's. Under the state-dependent form, only his current wake/sleep ratio matters and his
  deficit should look like any short-sleeping person's regardless of how long they have done it. Under the
  recency-weighted form, roughly his last few weeks dominate, so his deficit tracks his current term's
  schedule rather than his cumulative three-year history. NO EXPERIMENT IN THIS SHARD RUNS LONG ENOUGH TO
  DISCRIMINATE BETWEEN THESE - the longest is Smith 2021 at six weeks - so this is irreducible structural
  uncertainty and the largest single reason the downstream model should carry wide intervals on any
  three-year extrapolation.

  READ THIS RECORD TOGETHER WITH ramakrishnan2016, WHICH SUPERSEDES IT. A successor paper from the same group
  - Ramakrishnan S, Wesensten NJ, Balkin TJ, Reifman J. "A Unified Model of Performance: Validation of its
  Predictions across Different Sleep/Wake Schedules." Sleep 2016;39(1):249-262, PMID 26518594 - was retrieved
  in full text and has its own record in this shard, carrying the complete UMP equation set, all eight fitted
  parameters with standard errors, and an out-of-sample validation across 14 conditions in 5 studies. The
  recency-weighted form described here is therefore IMPLEMENTABLE after all, just not from this paper. The
  single parameter that matters most for our subject, tau_LA = 7.00 +/- 1.67 days, comes from that record and
  quantifies how fast the recency weighting decays; it is what turns the qualitative claim below ("recent
  history exerting greater influence") into a number. Use ramakrishnan2016, not this record, to implement
  anything - but keep this one for the structural taxonomy above and because it is the earlier statement of
  the idea.

  All extractable functional forms - Van Dongen's two, Belenky's verbal asymptotic form, McCauley's ODE system
  with its full parameter set, Cohen's slope-multiplier form, Banks 2010's exponential recovery function, and
  the fully parameterised UMP from ramakrishnan2016 - are reproduced verbatim in notes_for_modeller.md. This
  paper's own equations are the ones I could NOT retrieve (Elsevier paywall, no OA copy), and that absence is
  recorded there too; the successor closes the gap.
