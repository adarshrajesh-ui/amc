    quote: "We validated the proposed unified model using psychomotor vigilance task data from three prior
      studies involving TSD, CSR, and sleep extension. We compared and contrasted the fits, within-study
      predictions, and across-study predictions from the unified model against predictions generated by two
      previously published models, and found that the unified model more accurately represented multiple
      experimental studies and consistently predicted sleep restriction scenarios better than the existing
      models. ... Furthermore, this model better accounted for the relatively slow recovery process that is
