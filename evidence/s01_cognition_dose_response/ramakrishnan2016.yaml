notes: |
  ROLE OF THIS RECORD. It is the shard's best single source for a PUBLISHED, OUT-OF-SAMPLE-VALIDATED
  functional form for the accumulation of neurobehavioural deficit under chronic restriction, and it supplies
  the accumulation-rate estimate the brief asks for. The complete equation set and all eight fitted
  parameters are transcribed verbatim into notes_for_modeller.md.

  THE FULL MODEL, as printed in the paper's Table 2 (transcribed verbatim in notes_for_modeller.md):
    (1) P(t) = S(t) + kappa x C(t)
    (2) C(t) = sum_{i=1..5} a_i sin[i x (2 pi / tau) x (t + phi)],  a = (0.97, 0.22, 0.07, 0.03, 0.001)
    (3) dS(t)/dt = [U - S(t)] / tau_w  during wakefulness ;  [L(t) - S(t)] / tau_s  during sleep
    (4) L(t) = U x Debt(t)
    (5) dDebt(t)/dt = [Loss(t) - Debt(t)] / tau_LA ,  Loss(t) = +1 awake, -2 asleep
  Fitted on Belenky 2003 (7 nights at 3 / 5 / 7 / 9 h TIB, 4 arms simultaneously):
    U = 18.35 (0.73) lapses ; tau_w = 40.00 (3.19) h ; tau_s = 2.11 (0.11) h ; S0 = 0.00 (0.66) lapses ;
    kappa = 3.26 (0.26) lapses ; phi = 2.31 (0.26) h ; tau_LA = 7.00 (1.67) d ; L0 = -4.96 (0.00) lapses.

  THE THREE STRUCTURAL CLAIMS THE DOWNSTREAM MODEL SHOULD TAKE FROM THIS, in order of importance.

  1. THE DEFICIT SATURATES ON A ~7-DAY TIME CONSTANT, NOT LINEARLY. This is the direct answer to the brief's
     question about whether the decrement continues to accumulate or plateaus. 63% of the asymptote by day
     7, 86% by day 14, 95% by day 21. Van Dongen 2003's 14-day trajectory looks near-linear precisely
     BECAUSE 14 days is only two time constants - the curvature is there but modest over that window, which
     is why the same data support both a "cumulative, still rising at day 14" reading and an exponential
     saturation. Extrapolating the apparent linear slope to 3 years is the error this parameter forbids.
     The 95% interval on tau_LA (3.7-10.3 d) means that at one month saturation is between 94.6% (tau =
     10.27 d) and 99.97% (tau = 3.73 d) complete - so the qualitative conclusion is robust across the whole
     admissible range even though the parameter itself is loose to a factor of three.

  2. HARM IS BOUNDED IN MAGNITUDE AS WELL AS IN TIME. U = 18.35 lapses caps the homeostatic contribution;
     with kappa = 3.26 the model's worst attainable state is about 21.6 lapses per 10-min PVT. Observed data
     in Van Dongen 2003's 4h arm and Belenky 2003's 3h arm reach only about half of that, so the ceiling is
     an extrapolation of the functional form rather than an observed plateau - weakly identified, but it
     rules out unbounded dose-response functions.

  3. DEBT ACCUMULATES ~9x MORE READILY THAN IT CAN BE BANKED. Loss(t) = +1 while awake but the debt floor is
     -0.11 (revised from -2), because well-rested young adults cannot sleep more than ~8.9 h/day even given
     16 h of opportunity. This asymmetry is the model-side explanation for why weekend catch-up underperforms
     intuition, and it converges with three independent empirical records in this shard (banks2010,
     yamazaki2021, smith2021).

  WHY THIS IS PREFERRED OVER THE OTHER TWO MODEL RECORDS, and where they disagree. mccauley2009 posits a
  BIFURCATION at 3.8 h of daily sleep (20.2 h of wakefulness), below which deficits diverge without bound
  rather than saturating; rajdev2013 is the direct antecedent of this model (the UMP's origin paper) but was
  retrievable only as an abstract, so no equations could be taken from it. This paper is the only one of the
  three that fits its parameters to one dataset and then predicts others without refitting. THE DISAGREEMENT
  THAT MATTERS FOR OUR SUBJECT: on the UMP, a 5-6 h weekday schedule saturates within weeks at a bounded
  deficit; on McCauley's bifurcating model, a schedule below the critical threshold diverges. Our subject's
  weekday sleep of 5-6 h TIB (perhaps 3.5-4.2 h of actual sleep after applying Campbell's 69% TIB-to-TST
  efficiency) sits UNCOMFORTABLY CLOSE TO McCAULEY'S 3.8 h CRITICAL VALUE, and his occasional 3-4 h
  pre-exam nights fall below it. The two published models therefore give qualitatively different answers for
  exactly this subject, and that structural disagreement - not parameter uncertainty within either model -
  is the dominant uncertainty in the shard's dose-response backbone. It is documented in full in
  notes_for_modeller.md and flagged in station_report.md as the largest gap.
shard: "s01_cognition_dose_response"
