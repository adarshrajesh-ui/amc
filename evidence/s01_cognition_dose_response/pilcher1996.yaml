rob:
  tool: AMSTAR-2
  judgement: high
  notes: "Thirty years old and superseded on every axis that matters here. Only 19 studies (against 61 in
    Lowe 2017 and 70 in Lim & Dinges 2010), literature ending before 1996 - which means it predates ALL
    of the modern dose-controlled chronic-restriction experiments: Dinges 1997, Van Dongen 2003,
    Belenky 2003 and the entire Lo adolescent series are all later than its search. Its 'partial sleep
    deprivation' category is heterogeneous and, in the mid-1990s literature, would have been dominated by
    single-night or few-night protocols rather than sustained multi-week restriction. Mood, cognitive and
    motor outcomes were aggregated into coarse classes. No per-dose or per-duration breakdown.
    Abstract-only access here, so its methods cannot be independently assessed. I include it for exactly
    one thing - its explicit partial-versus-total moderator finding, which later work has not overturned
    and which the modern primaries corroborate - and I would give it near-zero weight on anything else."
funding: "Not stated in the retrieved abstract"
notes: |
  WHY A 1996 META-ANALYSIS IS STILL WORTH A RECORD. It is the earliest quantitative source for the claim
  that chronic PARTIAL restriction is more damaging than acute TOTAL deprivation, and it is the claim
  that justifies treating this shard - rather than the total-deprivation literature - as the causal
  backbone for a subject who has never had a single catastrophic night but has had roughly a thousand
  mildly insufficient ones.

  The authors also warned, in 1996, that "the effects of sleep deprivation may be underestimated in some
  narrative reviews, particularly those concerning the effects of partial sleep deprivation". Everything
  extracted in this shard since - Van Dongen's 14-night accumulation with no plateau, Belenky's residual
  deficit after three recovery nights, Lo's adolescent lapse rates at 5 h TIB exceeding adult rates at
  4 h TIB - has borne that warning out.

  WHAT I DELIBERATELY DID NOT DO. Several secondary sources quote specific pooled d values from this
  paper. I could not retrieve the full text, so I have not transcribed any of them; a number remembered
  or copied from a third party is exactly the kind of defect the extraction rules forbid. The two effects
  above are recorded as binary direction flags with the verbatim abstract sentence attached, and carry
  se: null. If the pipeline later obtains the PDF, the pooled partial-SD effect size is the one number
  worth adding.
shard: "s01_cognition_dose_response"
