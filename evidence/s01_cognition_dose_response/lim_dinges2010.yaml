rob:
  tool: AMSTAR-2
  judgement: low
  notes: "Strong methodology for its purpose: 70 articles / 147 data sets / 209 aggregated and 5,104
    individual effect sizes; a priori inclusion criteria; hand searches of Sleep and J Sleep Res
    1988-2008 plus reference-list screening; eight laboratories contacted for unpublished data with a
    100% response rate, which is unusually thorough publication-bias mitigation; study-quality coding;
    speed and accuracy kept separate rather than aggregated; full per-domain Q, df and I2 reported.
    THE DECISIVE LIMITATION FOR THIS SHARD IS EXPOSURE MISMATCH, NOT QUALITY: inclusion was restricted
    to SHORT-TERM TOTAL sleep deprivation (<48 h). None of these pooled estimates describes chronic
    partial restriction, and the authors' own within-subject SD estimation reverted to a between-groups
    formula whenever pre-post correlations were unavailable, which biases within-subject effects toward
    zero. Heterogeneity was moderate (I2 ~ 5-66%) and the authors attribute it to test heterogeneity
    within their taxonomy. Use this record for the DOMAIN HIERARCHY, never for a dose-response slope."
funding: "NIH grants NR004281 and RR00040 (per the parent programme); not restated in the retrieved text"
notes: |
  ROLE IN THIS SHARD: comparator and domain-weighting source, NOT a dose-response source. The exposure
  is acute total deprivation under 48 hours, which is not our subject's exposure. What it supplies that
  nothing else does is a precisely estimated, externally validated RANKING of which cognitive outcomes
  respond to sleep loss, with real published SEs rather than bounds.

  THE HIERARCHY, from Table 2 (all Hedges' g, negative = impaired):
    simple attention lapses          -0.762 (SE 0.095)
    simple attention reaction time   -0.732 (SE 0.072)
    working memory accuracy          -0.555 (SE 0.095)
    working memory reaction time     -0.515 (SE 0.097)
    complex attention accuracy       -0.479 (SE 0.082)
    short-term memory recall         -0.383 (SE 0.135)
    short-term memory recognition    -0.378 (SE 0.125)
    complex attention reaction time  -0.312 (SE 0.059)
    processing speed reaction time   -0.302 (SE 0.083)
    processing speed accuracy        -0.245 (SE 0.130)  n.s.
    reasoning accuracy               -0.125 (SE 0.072)  n.s.
  Pooled across domains: accuracy and lapses -0.407, reaction time -0.450 (Table 3). Within each domain
  there was no significant speed-accuracy difference (Table 4, all z < 1.65), so speed and accuracy can
  be treated as interchangeable indices of the same underlying deficit.

  ONE MODERATOR RESULT WORTH CARRYING: "Of several moderators tested, only time awake was a significant
  predictor of between-studies variability, and only for accuracy measures". So even within acute
  deprivation, DURATION of the exposure moves the effect - the same duration-dependence that Lowe 2017
  found for restriction ("cumulative days of restricted sleep" a significant moderator) and that
  Van Dongen 2003 quantified as a power law in days.

  A CROSS-EXPOSURE CALIBRATION THAT IS USEFUL DESPITE THE MISMATCH. One night of total deprivation
  produces a pooled lapse effect of |g| = 0.76. In this shard's primaries, 14 nights at 4 h TIB produces
  |g| = 1.44 (Van Dongen 2003, 4h vs 8h at day 14) and 7 nights at 5 h TIB in adolescents produces
  |g| = 2.40 (Lo 2016 at night 7; 2.31 on the baseline-unadjusted contrast). Magnitudes only - the sign
  convention differs between records because the constructs differ. Chronic partial restriction sustained for one to two
  weeks therefore reaches and exceeds the impairment of a single all-nighter - which is precisely the
  claim Van Dongen 2003 and Banks & Dinges 2007 make, here supported by an independently pooled anchor
  for the all-nighter side of the comparison.

  ALSO NOTE, for the practice-effect question in the shard brief, the authors' rationale for the PVT:
  the task is chosen throughout this literature partly because it is nearly practice-free. Cohen 2010
  states this explicitly ("The PVT does not display appreciable practice effects"), and Van Dongen 2003's
  8 h control arm gives the direct empirical bound (+2.6 lapses over 14 days, versus +9.6 correct
  responses on DSST over the same period). See vandongen2003.yaml and cohen2010.yaml.
shard: "s01_cognition_dose_response"
