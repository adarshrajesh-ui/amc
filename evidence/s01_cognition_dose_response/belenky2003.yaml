    exposure: {type: per_hour_less_sleep, dose_h: null, referent_h: 9, duration_days: 7,
               contrast_label: "linear dose slope across 9h/7h/5h/3h TIB arms at night 7"}
    scale: per_hour_beta
    unit: "additional PVT lapses per session at night 7, per 1 h less TIB"
    value: 2.455
    se: null
    ci: null
    conversion_formula: "OLS of E7-minus-baseline lapse change on nominal TIB over 4 arms:
      (9, +0.035), (7, +2.053), (5, +4.715), (3, +15.514) -> slope -2.455 lapses per hour TIB.
      Using measured TST instead of TIB (9h arm 7.93 h, 7h 6.28 h, 5h 4.66 h, 3h 2.87 h, from the
      paper's text) the slope is -2.948 lapses per hour of actual sleep. STRONGLY CONVEX: the step
      from 5h to 3h TIB costs 5.4 lapses/h while 9h to 7h costs 1.0 lapses/h, so a single linear
