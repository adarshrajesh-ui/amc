    E1     0.6972  0.8667  0.5335  0.5001
    E2     0.7412  0.8144  0.5275  0.4632
    E3     0.9471  0.8925  0.6275  0.5028
    E4     1.0648  0.9835  0.7213  0.4626
    E5     0.9543  1.1022  0.6469  0.4431
    E6     0.9205  1.0715  0.7728  0.4119
    E7     1.0131  1.0149  0.7619  0.4723
    R1     0.8825  0.9543  0.7575  0.4673
