  Note the SD roughly DOUBLES in the restricted arms while staying flat in the 9h arm: sleep
  restriction inflates between-subject variance as well as shifting the mean.

  KEY VERBATIM QUOTES
  Summary of the dose pattern: "In the 3-h group, speed (mean and fastest 10% of responses) on the
  psychomotor vigilance task (PVT) declined, and PVT lapses (reaction times greater than 500 ms)
  increased steadily across the 7 days of sleep restriction. In the 7- and 5-h groups speed initially
  declined, then appeared to stabilize at a reduced level; lapses were increased only in the 5-h
  group. In the 9-h group, speed and lapses remained at baseline levels."
  Recovery: "During recovery, PVT speed in the 7- and 5-h groups (and lapses in the 5-h group)
  remained at the stable, but reduced levels seen during the last days of the experimental phase,
  with no evidence of recovery. Speed and lapses in the 3-h group recovered rapidly following the
  first night of recovery sleep; however, recovery was incomplete with speed and lapses stabilizing
  at a level comparable with the 7- and 5-h groups."
  Adaptation claim: "These results suggest that the brain adapts to chronic sleep restriction. In
  mild to moderate sleep restriction this adaptation is sufficient to stabilize performance, although
  at a reduced level. These adaptive changes are hypothesized to restrict brain operational capacity
  and to persist for several days after normal sleep duration is restored, delaying recovery."
  The inflection point (the paper's own dose threshold): "Based on these findings, it appears that the
  inflection point (i.e. the minimum amount of nightly sleep required to achieve a state of
  equilibrium in which daytime alertness and performance can be maintained at a stable, albeit
  reduced, level) is approximately 4 h per night. If less than 4 h of sleep per night is obtained,
  daily decrements in performance capacity may be unavoidable - at least across a 7-day period of
  sleep restriction."
  Asymptotic functional form, stated verbally: "sleep durations that do not satisfy the core sleep
  requirement would, across days, result in continued degradation of alertness and performance;
  whereas sleep durations that satisfy the core requirement would produce deficits in alertness and
  performance relative to baseline, but degradation would not continue across days indefinitely - an
  asymptotic, stable level of reduced alertness and performance would eventually be achieved; and
  additional sleep (i.e. incremental increases in the duration of sleep beyond the core requirement)
  would produce correspondingly higher, and stable, levels of alertness and performance."
  Even 1 h of loss matters: "our finding that PVT performance was decremented during recovery
  following 7 days of a mild, 1-h reduction of nightly TIB - from 8 to 7 h - suggests that meaningful
  recuperation continues to accrue as sleep durations are extended beyond the hypothesized core sleep
  requirement."
  Failure to recover: "Following chronic, mild to moderate sleep restriction (5 or 7 h TIB), 3 days
  of recovery sleep (8-h TIB) did not restore performance to baseline levels."
  TST per dose: "Average TST over the 7 days of sleep restriction/augmentation were 7.93 h for the
  9-h TIB group, 6.28 h for the 7-h TIB group, 4.66 h for the 5-h TIB group, and 2.87 h for the 3-h
  TIB group."
  Lapse significance pattern: "During the experimental phase more lapses occurred in the 3-h TIB
  group than (a) the 9-h group on E3-E7; (b) the 7-h group on E4-E7; and (c) the 5-h group on E6 and
  E7. Mean number of lapses did not differ among the 5-, 7- and 9-h TIB groups during the
  experimental phase."
  Time-of-day interaction: "A significant three-way Group x Day x Time of Day interaction
  (F(30,520) = 1.67, P = 0.0235) indicated that the time of day effect (more lapses at 09:00 h vs.
  21:00 h) was greatest in the 3-h group, and that these time of day differences in the 3-h group
  increased across the experimental phase."
