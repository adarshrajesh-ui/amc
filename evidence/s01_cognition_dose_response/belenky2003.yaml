rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Four-arm dose-response with in-laboratory PSG monitoring; the widest dose range available
    (3/5/7/9 h). Concerns: no blinding; PVT attrition (66 enrolled, analysable n = 13/13/14/16 after
    technical data loss); age 24-62 (mean ~39) makes this the WORST population match to a 16-19
    year old of any T1 study in this shard; only ONE baseline day; SDs published for mean speed only,
    so lapse effects cannot be standardised; recovery TIB (8 h) differed from the 9 h control dose."
funding: "US Army Medical Research and Materiel Command / Walter Reed Army Institute of Research"
notes: |
  DESIGN: 66 volunteers -> 3 h (n=18), 5 h (n=16), 7 h (n=16) or 9 h (n=16) daily TIB for 7 nights
  (E1-E7), then 3 nights at 8 h TIB (R1-R3). Analysable PVT n: 3h=13, 5h=13, 7h=14, 9h=16.
  Wake time fixed at 07:00. PVT administered 4x/day; plotted values are collapsed across time of day.

  THIS STUDY IS THE MAIN COUNTERWEIGHT TO VAN DONGEN 2003 on the accumulate-vs-plateau question and
  the two must be modelled jointly. Belenky found STABILISATION at 5 h and 7 h TIB but continuous
  decline at 3 h; Van Dongen found continued accumulation at 4 h and 6 h across 14 days. McCauley
  et al. 2009 (see mccauley2009.yaml) reconciles the two: a bifurcation at ~20.2 h daily wakefulness
  (~3.8 h daily sleep) separates convergent from divergent trajectories, and Belenky's 7-day window
  is too short to distinguish slow convergence from linear accumulation.

  DIGITISED RAW DATA (vector drawing coordinates from the publisher PDF; series identified by glyph
  style matched to the legend; day columns matched to x-axis label positions within +-4 px).
  PVT mean number of lapses (Fig 4):
    9h: B 1.04  E1 1.15  E2 0.93  E3 1.34  E4 1.03  E5 0.84  E6 0.76  E7 1.07  R1 1.21  R2 1.15  R3 0.98
    7h: B 1.76  E1 1.85  E2 1.73  E3 2.53  E4 2.96  E5 2.96  E6 3.87  E7 3.82  R1 3.71  R2 3.82  R3 4.06
    5h: B 2.28  E1 3.13  E2 3.28  E3 4.57  E4 4.82  E5 6.07  E6 7.00  E7 7.00  R1 5.46  R2 6.36  R3 6.65
    3h: B 1.61  E1 4.42  E2 5.22  E3 10.11 E4 11.40 E5 12.67 E6 14.43 E7 17.13 R1 7.47  R2 5.40  R3 7.55
  PVT mean speed, (1/RT)*1000 (Fig 3):
    9h: B 3.960 E1 3.992 E2 4.011 E3 4.020 E4 4.014 E5 4.031 E6 4.025 E7 4.046 R1 3.971 R2 3.994 R3 4.003
    7h: B 3.893 E1 3.899 E2 3.828 E3 3.802 E4 3.786 E5 3.683 E6 3.593 E7 3.622 R1 3.644 R2 3.487 R3 3.509
    5h: B 3.953 E1 3.761 E2 3.744 E3 3.538 E4 3.426 E5 3.260 E6 3.310 E7 3.294 R1 3.471 R2 3.406 R3 3.361
    3h: B 3.828 E1 3.485 E2 3.396 E3 2.985 E4 2.838 E5 2.734 E6 2.587 E7 2.349 R1 3.130 R2 3.294 R3 3.174
  PVT mean speed of the fastest 10% of responses (Fig 5) - the "optimum capacity" measure:
