    5h: B 5.460 E1 5.260 E2 5.161 E3 5.091 E4 5.091 E5 5.036 E6 4.971 E7 4.952 R1 5.104 R2 5.011 R3 5.064
    3h: B 5.159 E1 4.926 E2 4.931 E3 4.780 E4 4.622 E5 4.691 E6 4.598 E7 4.564 R1 4.867 R2 4.862 R3 4.814
  Mean Stanford Sleepiness Scale score (Fig 7):
