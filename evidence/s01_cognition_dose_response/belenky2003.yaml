    7h: B 1.77 E1 1.67 E2 1.63 E3 1.61 E4 1.72 E5 1.68 E6 1.60 E7 1.55 R1 1.58 R2 1.63 R3 1.47
    5h: B 1.82 E1 1.92 E2 2.06 E3 2.00 E4 2.05 E5 2.27 E6 2.12 E7 2.23 R1 2.06 R2 2.08 R3 1.90
    3h: B 1.84 E1 2.13 E2 2.53 E3 2.56 E4 2.46 E5 2.72 E6 2.74 E7 2.54 R1 1.85 R2 1.80 R3 1.65
