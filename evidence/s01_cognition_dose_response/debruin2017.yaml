    value: 1.0
    se: null
    ci: null
    conversion_formula: "Directional encoding of a NARRATIVE synthesis. This review performed no
      meta-analysis and reports no pooled effect size, so no magnitude and no se are extractable - the
      authors state explicitly that 'Due to the great diversity of tests and lack of coherent results,
      decisive conclusions could not be drawn about which domains in particular were influenced by sleep
      manipulation.'
      WHY IT IS INCLUDED DESPITE HAVING NO NUMBER. It is the only systematic review in this shard whose
      inclusion criteria are AGE-MATCHED to our subject (participants' mean age between 10 and 19 y) AND
      which required objective sleep measurement. It therefore functions as a CALIBRATION CHECK on the
      adolescent literature as a whole, and it independently reproduces the outcome hierarchy that five other
      records in this shard arrive at separately (lim_dinges2010, lowe2017, campbell2024, smith2021,
      vandongen2003): vigilant attention is the most sensitive and most reliably detected domain.
      It also converges with Lowe 2017's meta-analytic finding that sustained attention carries the largest
      pooled effect, and with Basner & Dinges 2011's recommendation that PVT lapses/speed are the metrics to
      use. Six independent routes, one ranking. That consistency is worth more to the downstream model than
      any single point estimate, because it justifies weighting PVT-based evidence most heavily when
      constructing the dose-response backbone."
