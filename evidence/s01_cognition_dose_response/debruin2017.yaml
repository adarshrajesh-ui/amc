rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "A genuine systematic review with pre-specified, defensible inclusion criteria (experimental sleep
    manipulation; participants' mean age 10-19 y; OBJECTIVE sleep measures required; cognitive performance
    outcomes; English language) and a librarian co-author (Staaks) which usually signals a competent search.
    LIMITATIONS THAT DETERMINE HOW MUCH WEIGHT IT SHOULD CARRY: (1) NARRATIVE SYNTHESIS ONLY - no
    meta-analysis, no pooled effect sizes, no forest plots, so it contributes direction and consistency but
    no magnitude and no SE, and all three effects in this record are directional encodings; (2) only 16
    included studies, and the authors themselves attribute their inability to resolve domain-specific effects
    to small participant numbers, unmeasured sleep quality, individual differences in sleep need, adolescent
    compensatory mechanisms and the task-impurity problem; (3) the search window closes in early 2016, which
    excludes most of the strongest age-matched experimental evidence now available (epub 3 March 2016, print
    April 2017) - a substantial currency problem given how much this literature grew after 2016; (4) it pools heterogeneous
    manipulations (total deprivation, partial restriction, extension, sleep improvement) whose expected
    effects differ in both sign and size, which mechanically dilutes any single verdict; (5) ABSTRACT-ONLY
    ACCESS here - Sleep Medicine Reviews is Elsevier-paywalled with no PMCID and no OA location in Europe
    PMC, Unpaywall or OpenAlex - so the included-study list, the individual study characteristics and any
    domain-level tabulation could not be inspected. That last point limits what this record can be used for:
    it cannot be checked for overlap with the primary studies already extracted in this shard, so the pooler
    should NOT combine it with those primaries as if it were independent evidence."
funding: "Not stated in the retrieved abstract."
notes: |
  WHY A REVIEW WITH NO POOLED NUMBER EARNED A RECORD. Two reasons, both about calibration rather than
  estimation.

  FIRST, IT IS THE SHARD'S PRINCIPAL DISCONFIRMING EVIDENCE. Its verdict - 'Partial sleep restriction had
  small or no effects on adolescent cognitive functioning' - runs against nearly every other record here. The
  extraction instructions require reporting reality rather than the hypothesis, and a shard that returned
  only confirming evidence for the Tier-1 causal backbone would corrupt the downstream posterior. This record
  is the counterweight. It should widen the credible interval on adolescent cognitive harm, particularly for
  non-vigilance domains.

  SECOND, IT IS THE ONLY AGE-MATCHED SYSTEMATIC REVIEW. Its inclusion criterion - participants' mean age
  between 10 and 19 - matches our subject's exposure window, unlike lowe2017 (mixed ages, adults dominant)
  and lim_dinges2010 (mostly young adults, short-term total deprivation). So when it and the primaries
  disagree, the disagreement cannot be dismissed as an age-transportability artefact.

  HOW THE DISAGREEMENT RESOLVES, on the evidence available. Four things narrow it considerably:
    - The review's own strongest positive finding is the PVT, the very outcome the shard's backbone rests on.
      So it endorses the vigilance dose-response while doubting the higher-order cognitive battery - which is
      exactly campbell2024's threshold structure (PVT graded from 10h down; executive control impaired only
      below ~8.5h; working memory unaffected at any dose).
    - Its search closed no later than early 2016 (epub 3 March 2016), before Lo 2017/2019/2022, Short 2018,
      Campbell 2019/2024, Cousins 2019, Koa 2024 and Duraccio 2024. The adolescent experimental literature
      roughly doubled afterwards, with larger samples and better-laddered doses.
    - It pools mild and severe protocols together, which dilutes toward null.
    - Its finding that EXTENSION improves working memory while restriction does little implies adolescents'
      habitual sleep already sits on the descending limb - headroom above, little room below within the mild
      range. That is consistent with, not contrary to, Short 2018's 9.35 h adolescent requirement.

  BOTTOM LINE FOR THE POOLER. Weight this record heavily against large effects in NON-VIGILANCE adolescent
  cognitive domains; weight it only lightly against the PVT/vigilance dose-response, which it partly
  supports. Do not treat it as independent of the primary studies in this shard - the included-study list
  could not be retrieved, so overlap with lo2016 and others cannot be ruled out.
shard: "s01_cognition_dose_response"
