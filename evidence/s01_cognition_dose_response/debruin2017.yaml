    scale: raw_units
    unit: "1 = extension/improvement interventions produced working-memory gains"
    value: 1.0
    se: null
    ci: null
    conversion_formula: "Directional encoding; no pooled magnitude reported, so se is null.
      WHY THIS ASYMMETRY IS INTERESTING RATHER THAN TRIVIAL. The same review found partial RESTRICTION had
      'small or no effects' on cognition, but EXTENSION improved working memory. If restriction does nothing
      and extension helps, the implication is that habitually sleeping adolescents are ALREADY on the
      descending limb of the dose-response curve - i.e. their baseline is restricted, so there is headroom
      above it but little further to fall within the mild range tested. That reading reconciles the review's
      apparently null restriction verdict with the rest of this shard, and it converges independently on
      Short 2018's estimate that adolescents need 9.35 h of sleep, far above what they habitually obtain.
      It also matters directly for our subject: it implies his 7-8 h weekend sleep is not a neutral baseline
      but is itself below optimum, which is what campbell2024 shows directly for the PVT (performance fell
      going from 10 h to 8.5 h TIB).
      CAUTION: extension studies are unblinded and unblindable, and expectancy plus practice effects on
      working-memory tasks are plausible. Working memory is also the domain where campbell2024 found NO
      restriction effect at any dose (Sternberg), and where Lim & Dinges 2010's pooled effect is smaller than
      for lapses. So the extension-improves-working-memory result should be held loosely."
    from_figure: false
