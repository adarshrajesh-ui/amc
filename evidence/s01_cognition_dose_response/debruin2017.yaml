  - outcome_domain: cognition
    outcome_construct: partial_sleep_restriction_had_small_or_no_effects_on_adolescent_cognition
    exposure: {type: chronic_restriction, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "partial sleep restriction (as opposed to total deprivation) vs control, pooled qualitatively across adolescent experiments"}
    scale: raw_units
    unit: "0 = review's verdict was 'small or no effects' of PARTIAL restriction on adolescent cognition"
    value: 0.0
    se: null
    ci: null
    conversion_formula: "Directional encoding of the review's headline verdict. No pooled estimate exists to
      convert, so se is null.
      THIS IS THE MOST IMPORTANT DISCONFIRMING RECORD IN THE SHARD AND IT IS DELIBERATELY INCLUDED AS SUCH.
      Every other record here documents substantial harm. This age-matched systematic review, applying
      pre-specified criteria to 16 adolescent experiments, concluded that PARTIAL sleep restriction had
      'small or no effects on adolescent cognitive functioning', reserving the reliable findings for TOTAL
      deprivation. A shard that reports only the confirming evidence would mislead the Bayesian pooler, so
      this record exists to pull the posterior toward zero and to widen it.
      HOW TO RECONCILE IT WITH THE REST OF THIS SHARD - four specific, checkable reasons the verdict may
      understate the effect rather than refute it:
        (1) VINTAGE. The article was published online on 3 March 2016 and appeared in the April 2017 print
            volume, so its literature search closed no later than early 2016 and it PRE-DATES most of the
            strongest age-matched evidence in this shard: Lo 2016 (n=56) was concurrent, and Lo 2017,
            Lo 2019, Lo 2022 (n=194, four doses), Short 2018 (5/7.5/10h in 15-17 y olds), Campbell 2019,
            Campbell 2024, Cousins 2019, Koa 2024 and Duraccio 2024 all appeared afterwards. The adolescent
            experimental literature roughly doubled after this review's window, and the newer studies are
            larger and better dosed.
        (2) DOSE. Many pre-2016 adolescent 'partial restriction' protocols used mild doses for few nights.
            The studies that find large effects use 5h TIB for 5-7 nights (Lo) or ladder three doses
            (Campbell, Short). A review pooling mild short exposures with severe sustained ones will dilute
            toward null.
        (3) POWER AND HETEROGENEITY. The authors themselves list the reasons their synthesis could not
            resolve domains: 'Small number of participants, not accounting for the role of sleep quality,
            individual differences in sleep need, compensatory mechanisms in adolescent sleep and cognitive
            functioning, and the impurity problem of cognitive tests'. Individual differences in
            vulnerability are large and trait-like (vandongen2004), so small-n adolescent studies are badly
            underpowered for between-group contrasts.
        (4) THE PVT EXCEPTION IS DOING REAL WORK. The review's own most consistent positive finding is the
            PVT - which is precisely the outcome this shard's dose-response backbone is built on. So the
            'small or no effects' verdict applies mainly to the heterogeneous higher-order cognitive battery,
            not to vigilant attention. Read that way, this review AGREES with campbell2024's threshold
            finding (PVT graded from 10h down; executive measures only impaired below ~8.5h; working memory
            unaffected at any dose) rather than contradicting it.
      NET RECOMMENDATION TO THE POOLER: treat this as strong evidence that NON-VIGILANCE cognitive domains in
      adolescents have small and poorly estimated restriction effects, and as weak evidence against the
      vigilance dose-response, which it partially endorses."
    from_figure: false
    inferred_from_ci: false
    direction_note: "0 = null/small verdict. This record REDUCES the expected harm for non-vigilance
      cognitive domains and should widen the downstream posterior."
