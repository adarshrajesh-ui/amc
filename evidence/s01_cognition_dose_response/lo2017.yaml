rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomised to nap vs no-nap with residential control and PSG; arms balanced on age, sex,
    BMI, caffeine, chronotype, daytime sleepiness, chronic sleep reduction and actigraphic habitual
    sleep. Concerns: the 9 h control arm is a HISTORICAL control carried over from NFS1 (lo2016)
    rather than concurrently randomised, so the control contrast is quasi-experimental even though
    the nap/no-nap contrast is randomised; the nap-vs-no-nap randomisation is not the contrast of
    primary interest for this shard; per-arm means/SDs are not tabulated, only F and p."
funding: "National Medical Research Council Singapore (NMRC/STaR/015/2013);
  National Research Foundation (NRF2016-SOL002-001); Far East Organization"
notes: |
  NEED FOR SLEEP STUDY 2 (NFS2). The single best experimental simulation of the target subject's
  actual weekly pattern: two consecutive simulated school weeks of 5 h TIB with weekend catch-up
  in between, in 15-19 year olds.

  DESIGN: 15-day residential protocol. 2 baseline nights at 9 h TIB, then cycle 1 = five nights at
  5 h TIB (01:00-06:00, M11-M15) + two recovery nights at 9 h TIB (R11-R12), then cycle 2 = three
  nights at 5 h TIB (M21-M23) + two recovery nights. Randomised to a 1-h nap at 14:00 after each
  restricted night (n=29) or no nap (n=28); 26 participants given 9 h TIB nightly in NFS1 serve as
  the control arm. Battery 3x/day (10:00, 15:45, 20:00).

  THREE FINDINGS THE MODEL NEEDS
  1. Within a week, PVT lapses rise LINEARLY from night 2 to night 5 - no plateau, matching
     Van Dongen 2003 (theta=0.78) and contradicting a fast-adaptation model.
  2. Two nights of 9 h weekend catch-up do NOT restore baseline, and the second catch-up night adds
     nothing beyond the first (p = .62). Recovery is fast-then-flat and incomplete.
  3. The SLOPE of deterioration is steeper in week 2 than week 1, and week 2 starts from a worse
     level than week 1 ended. Repeated weekly cycles therefore ratchet, which is the central
     structural question for a 3-year exposure. This must be encoded as a slowly rising offset or a
     slope multiplier, not as an independent repetition of one week.

  KEY VERBATIM QUOTES
  Abstract: "Participants who were not allowed to nap showed progressive decline in sustained
  attention that did not return to baseline after two nights of recovery sleep. Exposure to the second
  period of sleep restriction increased the rate of vigilance deterioration. Similar patterns were
  found for other neurobehavioral measures. Napping attenuated but did not eliminate performance
  decline. These findings contrasted with the stable performance of adolescents, given 9-hr TIB each
  night in our recent study."
  Conclusions: "Adolescents' neurobehavioral functions may not adapt to successive cycles of sleep
  curtailment and recovery. In sleep-restricted adolescents, weekend 'catch-up sleep,' even when
  combined with napping during weekdays, is inferior to receiving a 9-hr sleep opportunity each night."
  Linear accumulation and onset: "Changes in sustained attention, as indexed by the number of PVT
  lapses, differed significantly among the three groups (group x day interaction: F = 8.02, p < .001).
  While performance remained relatively stable for the control group, lapses increased in the no nap
  group after the second night of 5-hr sleep opportunity (akin to a 'Tuesday,' p < .001; Figure 2A).
  The increase in lapses continued linearly until the end of the first sleep restriction period (like
  a 'Friday')."
  Incomplete and saturating recovery: "After the first night of recovery sleep, the number of lapses in
  the no nap group dropped significantly (p = .004) but still remained above baseline (p < .001). Even
  a second night of recovery sleep did not offer additional benefit (p = .62). Thus, after two nights
  of recovery sleep, simulating extended sleep on weekends, sustained attention did not fully recover."
  Ratcheting across weeks: "On reexposure to sleep restriction, the number of lapses in the no nap
  group not only increased relative to the end of the previous recovery period (i.e., 'Monday' vs 'the
  Sunday before,' p < .001) but was also worse than at the end of the first sleep restriction period
  (i.e., worse this 'Monday' than last 'Friday,' p = .02). Furthermore, the rate of deterioration was
  faster during the second period of sleep restriction than the first period. Finally, although the
  second recovery sleep period resulted in a prominent drop in the number of lapses (p < .001),
  sustained attention did not return to baseline levels, and remained at the level observed at the
  beginning of the second sleep restriction period (p = .57)."
  Other domains ratchet too, and a domain can look 'recovered' yet be sensitised: "The cumulative
  effect of repeated exposure to sleep restriction was also observed, albeit to a lesser extent, for
  other neurobehavioral measures. ... Strikingly, although working memory/executive function (i.e., A'
  in the 3-back performance) did return to baseline level after two nights of recovery sleep, a faster
  rate of decline was observed upon reexposure to sleep restriction."
  Real-world framing from the significance statement: "Simulating 2 school weeks, the present study
  demonstrated that the negative effects of weekday sleep restriction on neurobehavioral function
  cumulated and were incompletely reversed by weekend catch-up sleep. Deficits were compounded by a
  second successive period of sleep restriction, indicating failure to adapt to successive cycles of
  sleep restriction."
shard: "s01_cognition_dose_response"
