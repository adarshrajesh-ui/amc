        KSS morning: B2 3.33 -> SR4 5.38 -> SR7 5.38. EXACTLY ZERO further change.
        KSS evening: B2 3.25 -> SR4 4.17 -> SR7 4.00. Moved -0.17, i.e. the WRONG WAY, and never reached
