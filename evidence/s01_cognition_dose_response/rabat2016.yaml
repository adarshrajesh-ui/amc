  - outcome_domain: recovery
    outcome_construct: both_subjective_and_objective_sleepiness_fully_normalise_by_recovery_night_13
    exposure: {type: recovery_sleep, dose_h: 8, referent_h: 4, duration_days: 13,
               contrast_label: "KSS and MWT at recovery night 13 (8h TIB) vs baseline B2, after 7 nights at 4h TIB"}
    scale: hedges_g
    unit: null
    value: -0.105
    se: 0.290
    ci: [-0.673, 0.463]
    conversion_formula: "COMPUTED BY THIS SHARD for the MWT daily latency at R13 vs B2, from Table 1:
      B2 = 38.80 +/- 0.73, R13 = 38.52 +/- 0.75 (no significance marker, i.e. p > 0.05).
      SD_B2 = 2.52879 ; SD_R13 = 2.59808 ; SD_pooled = sqrt((6.39478 + 6.75)/2) = sqrt(6.57239) = 2.56367.
      d_av = (38.52 - 38.80)/2.56367 = -0.28/2.56367 = -0.10921 ; g = -0.10921 x 0.96552 = -0.10544 -> -0.105.
      SE at r = 0.5 = sqrt(0.08333 + 0.10921^2/24) = sqrt(0.08333 + 0.00050) = 0.28954. CI = g +/- 1.96 x SE.
      COMPANION VALUES, same derivation: MWT at R3 g = -0.430 (SE 0.303) - still about a third of a standard
      deviation below baseline though not statistically significant with n = 12; KSS daily at R13
      g = -0.234, i.e. very slightly BELOW (better than) baseline.
      WHY THIS RECORD REPORTS A NULL, AND WHY THE NULL IS IMPORTANT RATHER THAN EMPTY. Several records in
      this shard establish that vigilance deficits persist after recovery sleep: yamazaki2021 (deficits after
      4 nights of 12h TIB), banks2010 (incomplete recovery even at 10h TIB), smith2021 (six weekends
      insufficient), koa2024 (ratcheting across two weeks). THIS study, with a 4h x 7-night exposure at least
      as severe, found that BOTH sleepiness channels were back to baseline by the 13th recovery day, and the
      SRTT lapse deficit had already cleared by the 3rd. Reporting only the persistence studies would
      overstate the case.
      THE RECONCILIATION, WHICH IS SPECIFIC AND TESTABLE: the discriminating variable is not exposure
      severity but RECOVERY DOSE AND DURATION. Here recovery was 8h TIB for 3 consecutive nights and then a
      further 8 days of unrestricted living before R12-R13 - roughly TWELVE recovery nights before the final
      measurement. Yamazaki gave 4 nights, Banks gave 1 night, Smith gave 2-night weekends embedded in
      continuing restriction, and Koa gave weekends that never interrupted the cycle. So the evidence is
      consistent with: vigilance recovers, but needs more than a weekend; a fortnight of adequate sleep
      appears to suffice. FOR OUR SUBJECT THAT IS THE UNFAVOURABLE READING - across three years he never got
      a fortnight, because his weekends were 2 nights and his holidays were at 7-8h rather than 8h+.
      LIMITATIONS ON THIS NULL: n = 12, so it is underpowered to exclude a small residual deficit - the R3
      MWT g of -0.430 would need roughly n = 45 to reach significance. And the Go-NoGo executive deficit was
      still significant at R3, so 'full recovery' applies to the sleepiness and vigilance channels, NOT to
      inhibitory control, which was not re-tested at R13 in a way this record could extract."
