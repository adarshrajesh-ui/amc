    conversion_formula: "COMPUTED BY THIS SHARD from Table 1 (means +/- SEM, n = 12).
      KSS daily score: B2 = 3.22 +/- 0.31, SR7 = 4.73 +/- 0.43 (### p < 0.001 vs B2).
      SD = SEM x sqrt(n) = SEM x 3.46410:  SD_B2 = 1.07387, SD_SR7 = 1.48956.
      SD_pooled = sqrt((1.07387^2 + 1.48956^2)/2) = sqrt((1.15320 + 2.21878)/2) = sqrt(1.68599) = 1.29845.
      d_av = (4.73 - 3.22)/1.29845 = 1.51/1.29845 = 1.16292.
      Hedges correction J = 1 - 3/(4 x df - 1) with df = 2n-2 = 22: J = 1 - 3/87 = 0.96552.
      g = 1.16292 x 0.96552 = 1.12281 -> 1.123.
      SE: r between repeated measures is NOT reported, so SE(d) = sqrt(2(1-r)/n + d^2/(2n)) evaluated at an
      assumed r = 0.5 (typical for repeated subjective measures) = sqrt(0.08333 + 0.05636) = 0.37375.
      SENSITIVITY TO THAT ASSUMPTION: SE = 0.4722 at r = 0, 0.3737 at r = 0.5, 0.3261 at r = 0.7. The choice
      of r changes the SE by about +/-25% and never changes the sign or significance. CI = g +/- 1.96 x SE.
      THE PLATEAU, WHICH IS THE POINT OF THIS EFFECT AND THE DIRECT ANSWER TO THE BRIEF'S HABITUATION
      QUESTION. Comparing what the subjective channel did in days 1-4 with what it did in days 4-7:
        KSS daily:   B2 3.22 -> SR4 4.66 (+1.44) -> SR7 4.73 (+0.07). The day-4-to-day-7 increment is
