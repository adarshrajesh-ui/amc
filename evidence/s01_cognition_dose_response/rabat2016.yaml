      not require comparing across studies, scales, or timepoints: both channels are in one table.
      SUPPORTING TIME-COURSE DETAIL: the MWT was NOT significantly reduced after ONE night ('not after one
      night of sleep restriction'), became significant after ~4 nights, and worsened further by 7. So the
