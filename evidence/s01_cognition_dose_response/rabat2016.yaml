  - outcome_domain: sleep_need
    outcome_construct: slow_wave_sleep_is_preferentially_protected_when_total_sleep_is_halved
    exposure: {type: chronic_restriction, dose_h: 4, referent_h: 8, duration_days: 7,
               contrast_label: "N3 (slow-wave) sleep minutes and share of TST across 7 nights at 4h TIB vs 8h TIB baseline"}
    scale: pct_change
    unit: "% reduction in N3 minutes when total sleep time is cut roughly in half"
    value: -13.2
    se: null
    ci: null
    conversion_formula: "(136 - 118)/136 = 0.1324 -> a 13.2% reduction in N3 minutes (mean 118 min across the
      seven restriction nights vs 136 min at B2), i.e. a factor of 1.15. Meanwhile TIB fell from 480 +/- 0 min
      to 239.9 +/- 0.11 min and TST fell by roughly a factor of two, and the other stages fell by much larger
      factors: N1 by 3.75, N2 by 2.8, REM by 2.5 (all reported by the authors). N3's SHARE of total sleep
      therefore rose from 32.4% to 53.1%, a factor of 1.64. se is null - the paper reports these as means
      without dispersion for the derived percentages.
      WHY A SLEEP-ARCHITECTURE NUMBER EARNS A PLACE IN A COGNITION SHARD. It identifies the compensatory
      mechanism that makes chronic restriction survivable, and simultaneously explains why the compensation
      is incomplete. When sleep is halved, the system sacrifices light and REM sleep almost proportionally
      while defending slow-wave sleep almost entirely. If N3 carries the restorative process that Feinberg
      and Campbell's synaptic-elimination account attributes to it, then a subject on 4-5h TIB retains most
      of his slow-wave 'core' - which is why the observed deficits are moderate rather than catastrophic,
      and why the deficit SATURATES rather than growing without bound (converging on the tau_LA = 7 d
      saturation in ramakrishnan2016).
      THE COST IS PAID ELSEWHERE, AND IT LANDS ON OUR SUBJECT'S AGE GROUP SPECIFICALLY. REM fell by a factor
      of 2.5 and N2 by 2.8. Sleep spindles live in N2 and REM is implicated in emotional and procedural
      consolidation, so the stages being sacrificed are the ones tied to memory consolidation and affect
      rather than to basic vigilance - which is consistent with this study finding NO effect on
      decision-making but clear effects on vigilance and inhibition, and with the adolescent spindle
      literature surfaced in screening (PMID 36916319). A model that treats 'hours of sleep lost' as a single
      exposure will therefore mis-attribute WHICH functions are harmed: the hours removed are
      disproportionately REM and N2, not N3.
      ONE HONEST CAVEAT: this is a 4h TIB protocol in adults aged 20-37. Adolescents have far more slow-wave
      activity to begin with (NREM delta power declines >60% between ages 12 and 16.5 per Campbell's
      programme), so the size of the protective reserve almost certainly differs by age, in an unknown
      direction. No study in this shard measures the N3-preservation fraction in adolescents."
    from_figure: false
    inferred_from_ci: false
    direction_note: "NEGATIVE = reduction in N3 minutes, but the point is that it is a SMALL reduction
      relative to the ~50% cut in total sleep - i.e. this is a protective/compensatory finding, not a harm."
    covariates: ["all-night polysomnography on every night", "AASM scoring", "N3 share computed as % of TST"]
    followup_years: null
    cohort_family: Rabat_IRBA_CSR
    quote: "Despite the fact that total amount of sleep is reduced by a factor of two during the sleep
      restriction period, amounts of N3 sleep stage were only reduced by a factor of 1.15 (a mean of 118 min
      across the seven nights of sleep restriction compared to 136 min at B2) whereas amounts of other sleep
      stages were reduced by a higher factor (3.75 for N1, 2.8 for N2 and 2.5 for REM sleep). As a logical
      consequence, there was a significant sleep restriction/recovery effect on the proportion (% of TST) of
      N3 sleep (F(13,143) = 23.55; p < 10-6), that was significantly higher during all the nights of the
      sleep restriction period (a mean proportion of 53.1% instead of 32.4% at B2; Figure 2F)"
rob:
  tool: RoB2
  judgement: some_concerns
  notes: "STRENGTHS, and they are why this small study earns five effects: a 14-day fully in-laboratory
    protocol with all-night PSG on EVERY night (2 baseline at 8h TIB, 7 restriction at 4h TIB, 3 recovery at
    8h, plus 2 more recovery nights 8 days later), so exposure verification is essentially perfect - achieved
    TIB was 239.9 +/- 0.11 min against a prescribed 240; four MWT and KSS sessions per day at fixed clock
    times, allowing the morning/evening dissociation to be resolved; a cognitive battery spanning FOUR
    distinct process levels (sustained attention, motor inhibition, sensory-motor decision-making,
    visuo-motor pursuit) tested at matched morning and evening slots, which is what makes the differential-
    kinetics finding possible; and an unusually long follow-up to R12-R13, giving roughly twelve recovery
    nights - longer than any other recovery arm in this shard. Numeric means with SEM are tabulated for the
    KSS and MWT, which is why those two effects carry computed g values while the Figure-3 cognitive
    outcomes do not.
    CONCERNS: (1) n = 12, which is the binding limitation - all effects are imprecise (SEs around 0.30-0.42
    on the g scale) and the recovery nulls are underpowered, e.g. the R3 MWT g of -0.430 would need roughly
    n = 45 to reach significance, so 'recovered' should be read as 'not detectably impaired' rather than
    'demonstrably normal'. (2) ALL MALE (12 men), so no sex generalisation. (3) Age 29.3 +/- 1.37 (SEM),
    range 20-37 - adult, not adolescent; adolescent_match is fair_adult and the N3-preservation result in
    particular is unlikely to transport, since adolescent slow-wave activity is far higher and falling
    steeply with age. (4) SINGLE DOSE ARM (4h TIB only) - this study contributes nothing to the dose-response
    shape and is used here purely for KINETICS, i.e. the shape in TIME. (5) No randomisation and no control
    arm: every subject underwent the same fixed sequence baseline -> restriction -> recovery, so time,
    order and practice are perfectly confounded with condition. That confound is DEMONSTRABLY ACTIVE here -
    response speed on the Go-NoGo and Simon tasks was FASTER at R2, R3 and R13 than at baseline, which is a
    practice effect, not a recovery benefit. Deficits measured against a first-week baseline in a design
    like this are therefore biased toward zero for any task with a learning curve, and the vigilance-type
    measures (SRTT lapses, MWT) are the ones least affected. (6) Multiplicity: many outcomes, many
    timepoints, no stated correction, so individual p-values around 0.01-0.05 should be discounted."
funding: "Not extracted from the retrieved text; the protocol is registered as ClinicalTrials NCT01989741 and was conducted at IRBA (French Armed Forces Biomedical Research Institute)."
notes: |
  THIS RECORD'S PRIMARY CONTRIBUTION IS THE HABITUATION QUANTIFICATION THE BRIEF ASKS FOR, and it is the only
  place in the shard where both channels come from a single published table so no cross-study scaling is
  needed. Days 4 to 7 of 4h TIB, same 12 men, measurements minutes apart:

      SUBJECTIVE (KSS daily):   4.66 -> 4.73   ( +0.07 points; +4.9% of its own day-0-to-day-4 change )
      SUBJECTIVE (KSS morning): 5.38 -> 5.38   ( exactly zero )
      SUBJECTIVE (KSS evening): 4.17 -> 4.00   ( moved the wrong way; never significant at any timepoint )
      OBJECTIVE  (MWT latency): 34.29 -> 28.78 ( -5.51 min; +122% of its own day-0-to-day-4 change )

  On standardised scales the subjective effect SHRANK (d 1.341 -> 1.163, because variance widened while the
  mean stood still) while the objective effect nearly DOUBLED (d -0.647 -> -1.183). By day 7 these men could
  resist sleep for only 74% as long as at baseline while reporting no more sleepiness than three days
  earlier. The authors name the ceiling themselves: the subjective complaint 'seems to rapidly ceil at a
  score of 5' on a 9-point scale - self-report saturated near the middle of its range.

  A SECOND, INDEPENDENT DISSOCIATION IN THE SAME DATA - BY TIME OF DAY. The restriction x time-of-day
  interaction was significant (F(5,110) = 2.38, p < 0.05): MORNING KSS rose significantly (3.33 -> 5.38,
  p < 0.001) while EVENING KSS did not move significantly at any point (3.25 -> 4.00, p > 0.06). So whether a
  restricted person reports feeling impaired depends on when you ask, and asking in the evening - when a
  student would most plausibly self-assess - detects nothing. This compounds the plateau problem: the
  subjective signal is both bounded and phase-dependent.

  THE OTHER MAJOR CONTRIBUTION IS THAT THE COGNITIVE HIERARCHY IS NOT ONE-DIMENSIONAL. Five other records in
  this shard converge on an ordering by SENSITIVITY (vigilance > executive > working memory). This study adds
  an orthogonal axis - RECOVERY RATE - and the two do not line up:
      sustained attention (SRTT): fails FIRST (speed significant on SR1) and recovers FIRST (clear by R3)
      executive inhibition (Go-NoGo): fails during restriction and is STILL impaired at R3
      sensory-motor decision-making (Simon): never significantly affected at this dose
      visuo-motor pursuit: never significantly affected
  So the fastest-failing measure is not the slowest-recovering one. A model with a single latent impairment
  state scaled per-outcome cannot produce this pattern; at minimum two processes with different time
  constants are needed.

  WHY THAT IS THE MOST DECISION-RELEVANT THING HERE FOR A WEEKDAY/WEEKEND CYCLE. Our subject's schedule is
  ~5 short nights then ~2 longer ones, repeated for three years. On this evidence a 2-night recovery clears
  NEITHER deficit (SRTT lapses and Go-NoGo errors were both still significant at R2); vigilance clears only
  by the third night; inhibitory control had not cleared even then. That predicts SELECTIVE ACCUMULATION -
  the vigilance deficit partially resets each weekend while the inhibitory-control deficit carries over -
  which is a mechanism for the ratcheting Koa 2024 measured and for Smith 2021's finding that six weekends
  failed to restore vigilance.

  AND A COUNTERWEIGHT THAT SHOULD NOT BE SUPPRESSED. By recovery night 13, after roughly twelve nights of
  adequate sleep, both KSS (g = -0.234) and MWT (g = -0.105) were indistinguishable from baseline. Several
  other records here emphasise incomplete recovery; this one shows complete recovery of the sleepiness and
  vigilance channels given ENOUGH time. Read together with banks2010 (1 night, incomplete), yamazaki2021
  (4 nights, incomplete) and smith2021 (weekends, incomplete), the discriminating variable looks like
  recovery DURATION rather than exposure severity: more than a weekend, less than a fortnight. Our subject
  never received a fortnight, which is why this reassuring finding does not transfer to him - but it does
  bound the harm as reversible in principle, which matters for prognosis.

  FINALLY, A PRACTICE-EFFECT WARNING VISIBLE INSIDE THIS DATASET. Go-NoGo and Simon response speeds were
  FASTER at R2, R3 and R13 than at baseline - learning, not recovery - while the PVT-like SRTT showed no such
  gain. This is the confound the brief asks about, demonstrated in one sample: vigilance measures are
  practice-stable, higher-order tasks are not, and uncorrected pre-post designs will understate harm on
  exactly the tasks where learning is strongest.
