  - outcome_domain: cognition
    outcome_construct: sustained_attention_and_executive_inhibition_have_different_recovery_kinetics
    exposure: {type: recovery_sleep, dose_h: 8, referent_h: 4, duration_days: 3,
               contrast_label: "which deficits persist after 2-3 nights of 8h recovery TIB following 7 nights at 4h: SRTT lapses vs Go-NoGo commission errors"}
    scale: raw_units
    unit: "number of recovery nights at 8h TIB still showing a significant deficit vs baseline (attention = 2, executive inhibition = 3)"
    value: 3.0
    se: null
    ci: null
    conversion_formula: "Encoding of the recovery timepoint at which each deficit ceased to differ from
      baseline. No effect sizes are printed for the Figure 3 panels (values are in figures only, and this
      record does not digitise them), so se is null.
      THE ORDERING, WHICH IS THE FINDING:
        SUSTAINED ATTENTION (SRTT lapses): significantly elevated throughout restriction AND after TWO
          recovery nights (p < 0.01), but 'No significant differences were observed after the third night of
          sleep recovery.' -> recovered by R3.
        EXECUTIVE INHIBITION (Go-NoGo commission errors): significantly elevated throughout restriction and
          'stayed significantly higher during the 2nd and the 3rd night of sleep recovery in comparison with
          baseline values (p < 0.01)' -> STILL impaired at R3.
        SENSORY-MOTOR DECISION-MAKING (Simon task errors): no significant restriction effect at all
          (F(6,66) = 1.63, p > 0.15), nor for compatible or incompatible trials separately.
        VISUO-MOTOR PURSUIT: no significant effect (F(6,66) = 0.767, p > 0.59).
      SO THE HIERARCHY IS NOT MONOTONE IN THE WAY THE SHARD'S OTHER RECORDS IMPLY. Vigilance degrades
      FASTEST (SRTT speed was already significant on SR1) but also recovers FASTEST (by R3). Executive
      inhibition degrades and then LINGERS LONGER. Higher-order decision-making was not measurably affected
      at all at this dose. That is a genuinely different structure from a single latent 'impairment' factor
      scaled by sensitivity: the fast-failing measure is not the slow-recovering one.
      WHY THIS MATTERS FOR A THREE-YEAR EXPOSURE WITH WEEKEND RECOVERY. Our subject's schedule is a repeating
      cycle of ~5 restricted nights followed by ~2 longer nights. On this evidence a 2-night recovery window
      is enough to clear neither deficit (both SRTT lapses and Go-NoGo errors were still significant at R2),
      and is long enough to clear vigilance only if it extends to a third night. Executive inhibition would
      not clear even then. That predicts SELECTIVE ACCUMULATION across weeks: the vigilance deficit resets
      partially every weekend while the inhibitory-control deficit does not - which is a mechanistic account
      of the 'ratcheting' Koa 2024 observed and of why Smith 2021 found six weekends insufficient.
      CAUTION ON THE UPSIDE: the paper also reports that response SPEED on the Go-NoGo and Simon tasks
      INCREASED at R2, R3 and R13 relative to baseline, which is almost certainly a practice effect on those
      tasks and not a benefit of recovery. It is a useful reminder that non-PVT tasks in repeated-measures
      protocols carry learning gains that can mask deficits - the confound the brief asks about, visible here
      in the same dataset in which the PVT-like SRTT shows no such gain."
    from_figure: false
    inferred_from_ci: false
    direction_note: "Higher = deficit persisted through more recovery nights. Executive inhibition (3) is
      SLOWER to recover than sustained attention (2), despite attention failing sooner."
