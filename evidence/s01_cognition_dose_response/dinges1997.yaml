rob:
  tool: RoB2
  judgement: high
  notes: "Single-arm within-subject design with no parallel non-restricted control, so day-over-day
    change is confounded with practice on the PVT and with laboratory-residence effects; this is the
    exact confound Van Dongen 2003 later controlled by retaining an 8 h TIB arm (which showed a
    +2.6-lapse rise over 14 days from practice/protocol alone - see vandongen2003.yaml). Dose was
    individualised (33% below each subject's habitual sleep) rather than fixed, so 'the dose' is a
    distribution centred on 4.98 h, not a single level. Several key conclusions (continuation past day 7,
    2-night recovery, MSLT decrease) rest on unspecified SUBSETS of the 16 subjects. Abstract only: no
    means, SDs, or per-day values could be extracted, so this study contributes qualitative shape
    evidence and the achieved-dose figure, not effect sizes. Historical importance is high (it is the
    primary that motivated Van Dongen 2003 and Belenky 2003) but its quantitative content here is thin."
funding: "Not stated in the retrieved abstract (NIH-supported per the parent programme; not verified)"
notes: |
  WHY IT IS HERE. This is the founding chronic-restriction experiment at a ~5 h dose - the dose that
  matches our subject's habitual weekday sleep more closely than any adult study in this shard - and it
  is the source of the claim that the deficit is CUMULATIVE rather than self-limiting. Banks & Dinges
  2007 cite it as the primary for that claim, and Van Dongen 2003 was designed as its dose-ranging
  successor.

  DESIGN: 16 healthy young adults, laboratory residence, sleep restricted to 33% below each individual's
  habitual duration -> achieved mean 4.98 h/night (SD 0.57) for 7 consecutive nights. Testing 3x daily
  (10:00, 16:00, 22:00): SSS, POMS, PVT, probed memory, serial addition. Visual analogue scales once
  daily. MSLT and post-day-7 continuation in subsets.

  THE ONE SENTENCE THE MODELLER SHOULD CARRY: "asymptotic or steady-state sleepiness was not achieved in
  response to sleep restriction". At a 5 h dose over 7 nights, nothing had levelled off. This is
  concordant with Van Dongen 2003 at 14 nights and with Lo 2016 in adolescents at 5 h over 7 nights, and
  it is the empirical basis for treating the 5-6 h weekday dose as producing a deficit that is still
  growing at the end of a school week.

  A TIMING DETAIL WITH DIRECT BEARING ON THE HABITUATION QUESTION: "Subjective changes tended to precede
  performance changes by 1 day, but overall changes in both classes of measure were greatest during the
  first 2 days (P1, P2) and last 2 days (P6, P7) of sleep restriction." So at a 5 h dose over one week
  the subjective and objective trajectories were broadly PARALLEL, with subjective leading by a day -
  no dissociation yet. The dissociation documented by Van Dongen 2003 emerges over 14 nights, and the
  dissociation documented by Rupp 2009 emerges at a 3 h dose. One week at 5 h is evidently not long
  enough or severe enough to open the gap. This is a consistent and important boundary condition: the
  subjective/objective divergence is a function of DURATION and SEVERITY, not a fixed property of the
  measures.

  WHAT I COULD NOT GET. Sleep (Oxford) content from 1997 is paywalled and not in PMC; direct PDF
  retrieval returned 403 behind Cloudflare, and no author-repository copy was located. All numbers above
  come from the PubMed abstract, which is unusually detailed for the era but contains no per-day means
  or SDs. If the pipeline can obtain the full text later, the per-day PVT means for the 5 h arm would be
  the single most valuable addition to this shard, because they would give an independent 5 h trajectory
  to set against Van Dongen's interpolated 4 h and 6 h arms.
shard: "s01_cognition_dose_response"
