rob:
  tool: AMSTAR-2
  judgement: high
  notes: "Narrative expert review, not a systematic review: no protocol, no stated search strategy, no
    inclusion criteria, no risk-of-bias appraisal of included studies, no quantitative synthesis. Both
    authors are also authors of one of the two primary experiments it synthesises (Van Dongen 2003),
    so the pooled statements are not independent of the primary evidence. Use it for the verbatim
    pooled threshold statement, for the absolute-scale lapse anchor, and for locating primaries -
    never as an independent effect estimate."
funding: "NIH grants NR004281, RR00040, HL070154 (as acknowledged in the paper)"
notes: |
  ROLE IN THIS SHARD: used exactly as instructed - for pooled statements and to locate primary
  sources. It contributed no independent data. Everything numeric in it traces back to Van Dongen
  2003 and Belenky 2003, both of which I retrieved and extracted directly.

  PRIMARIES THIS REVIEW POINTED ME TO (all subsequently retrieved and screened independently):
    Van Dongen et al. 2003 Sleep 26:117-126        -> vandongen2003.yaml
    Belenky et al. 2003 J Sleep Res 12:1-12        -> belenky2003.yaml
    Dinges et al. 1997 Sleep 20:267-277            -> dinges1997.yaml
    Carskadon & Dement 1981 Psychophysiology 18:107-113 -> screened, see screening_log.md
    Balkin et al. 2000 (DOT truck driver study, the source of Belenky's protocol)

  THE KEY POOLED THRESHOLD STATEMENT, verbatim: "The remarkable similarity and internal consistency of
  the dependence of severity of PVT lapsing on the chronic sleep dose suggests that when the nightly
  sleep period is restricted to <=7 h, healthy adults have increasing numbers of lapses of attention in
  proportion to the dose of sleep allowed (between subjects) and the number of days of sleep
  restriction (within subjects)."
  And: "Considering data in both Panels A and B, it is clear that restriction of nocturnal sleep time
  to <7 h per night in healthy adults results in systematic increases in lapses of waking attention
  that get progressively worse across days, in a dose-response manner."

  THE DISSOCIATION, verbatim: "Like NREM SWA, subjective sleepiness responses during chronic sleep
  restriction show a different dynamic profile than those found for total sleep deprivation. While the
  latter results in immediate increases in feelings of sleepiness, fatigue and cognitive confusion,
  with concomitant decreases in vigor and alertness, chronic sleep restriction yields much smaller
  changes in these psychometric ratings of internal state. Thus, in contrast to the continuing
  accumulation of cognitive performance deficits associated with nightly restriction of sleep <8 h,
  ratings of sleepiness repeatedly made by subjects on standardized sleepiness scales did not parallel
  performance deficits. As a consequence, after a week or two of sleep restriction, subjects were
  markedly impaired and less alert, but rated themselves subjectively as only moderately sleepy (see
  Figure 4). This suggests that people frequently underestimate the cognitive impact of sleep
  restriction and overestimate their performance readiness when sleep restricted."

  ON THE MECHANISM AND WHY SLEEP PHYSIOLOGY IS THE WRONG BIOMARKER, verbatim: "Collectively they
  suggest that there is a neurobiological integrator that either accumulates homeostatic sleep drive or
  the neurobiological consequences of excess wakefulness. There has as yet been no definitive evidence
  of what is accumulating and destabilizing cognitive functions over time when sleep is regularly
  restricted to less than 7 hours per night, but one intriguing line of evidence suggests that it may
  involve extracellular adenosine in the basal forebrain." And: "While the neurobehavioral effects of
  chronic sleep restriction appear similar to those of total sleep deprivation, the primary physiologic
  measure of homeostatic sleep - slow wave activity in the spectrally analyzed NREM EEG - shows a much
  more muted response to the former than to the latter, suggesting that there may be a different
  neurobiological mechanisms sub-serving the adverse effects of chronic sleep restriction."

  A SECOND, INDEPENDENT DOSE-RESPONSE STRAND (physiological sleep propensity, not cognition):
  "A significant increase in sleep propensity across 7 days of sleep restricted to either 3 or 5 h per
  night was observed, with no differences found when sleep was restricted to 7 or 9 h per night." And
  from an epidemiological study: "Persons reporting >7.5 hours of sleep had significantly less
  probability of falling asleep on the MSLT than those reporting to between 6.75 to 7.5 h per night
  (27% risk of falling asleep) and than those reporting sleep durations less than 6.75 h per night
  (73% risk of falling asleep)." These converge on the same ~7 h threshold from a different measurement
  modality, which raises confidence in the threshold's location.

  NOTE ON A DISCREPANCY WORTH RECORDING: this review's Figure 2 legend states Belenky's arms as
  n = 13/13/13/16, whereas Belenky's own Table 1 gives 3h n=13, 5h n=13, 7h n=14, 9h n=16. I used
  Belenky's own table. The review also describes Belenky's PVT as assessed 4 times daily from 09:00 to
  21:00, which the primary paper does not state explicitly in the text I retrieved.
