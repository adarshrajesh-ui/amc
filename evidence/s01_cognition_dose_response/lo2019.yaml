rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Properly randomised parallel-group allocation between the two restriction schedules
    (126 screened, 60 randomised, 58 analysed), dormitory residential control, PSG-verified dose,
    baseline covariate, arms matched on pre-study actigraphic TIB and TST. Concerns: the 9 h TIB
    reference arm is again a HISTORICAL control from NFS1, so the restriction-vs-adequate-sleep
    contrast is quasi-experimental; the randomised contrast is schedule shape rather than dose, so
    this study contributes little to the dose slope itself; per-arm lapse means and SDs are in figures
    and supplementary material only, and the supplementary figures were not retrievable, so no raw
    per-arm numbers could be extracted."
funding: "National Medical Research Council Singapore (STaR/0015/2013); National Research Foundation
