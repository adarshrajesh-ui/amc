notes: |
  NEED FOR SLEEP STUDY 4 (NFS4). Included in this shard for two reasons only, since its randomised
  contrast is schedule shape rather than sleep dose:

  1. It supplies the 6.5 h TIB dose level in adolescents with a clean within-week trajectory:
     6.5 h continuous nocturnal TIB - a dose the target subject probably exceeds only at weekends -
     produced a significant progressive increase in PVT lapses across five nights.
  2. It shows that 24-h total sleep time is not a sufficient exposure statistic. The split arm slept
     15-21 min LESS per 24 h yet performed BETTER on vigilance, working memory, processing speed,
     subjective sleepiness and mood. Any dose-response function keyed purely on average nightly TST
     will therefore mis-specify schedules containing daytime sleep.

  DESIGN: 15-day dormitory protocol, vacation period 2017. 2 baseline nights at 9 h TIB (23:00-08:00);
  cycle 1 = 5 restricted nights (SR11-SR15) + 2 recovery nights at 9 h TIB; cycle 2 = 3 restricted
  nights (SR21-SR23) + 2 recovery nights. Randomised arms: continuous 6.5 h nocturnal TIB
  (00:15-06:45, n=29) vs split 5 h nocturnal TIB (01:00-06:00) plus a 1.5 h nap at 14:00-15:30 (n=29).
  Nap TST 71-79 min. PSG on selected nights; battery 3x/day.

  A GLUCOSE COUNTERPOINT WORTH FLAGGING TO OTHER SHARDS: the schedule that was better for cognition
  was WORSE for glucose. "During sleep restriction, the split sleep group showed a greater increase in
  blood glucose (glucose excursion) during the OGTT than the continuous sleep group (Group x Day
  interaction: F = 3.14, p = 0.03)". Cognitive and metabolic outcomes therefore do not share a single
  dose-response surface - relevant to s07_metabolic.

  KEY VERBATIM QUOTES
  Main result: "The split sleep group had fewer vigilance lapses, better working memory and executive
  function, faster processing speed, lower level of subjective sleepiness, and more positive mood, even
  though PSG-verified total sleep time was less than the continuous sleep group. However, vigilance in
  both sleep-restricted groups was inferior to adolescents in a prior sample given 9-hour nocturnal
  TIB."
  6.5 h accumulates within one week: "Although vigilance performance as indicated by the number of PVT
  lapses was similar in the two groups at baseline, the split sleep group exhibited fewer lapses than
  the continuous sleep group during both cycles of sleep restriction and in the intervening recovery
  sleep (Group x Day interaction: F = 3.47, p < 0.001; Figure 4A). During the first sleep restriction
  period, the split sleep group maintained PVT performance (SR11 vs. SR15: p = 0.10), whereas the
  continuous sleep group showed an increase in lapses (p < 0.001). Both groups showed further
  deterioration in performance during the second sleep restriction period (e.g. SR13 vs. SR23: p = 0.02
  and 0.03)."
  Less sleep, better performance: "Overall, splitting sleep shortened total daily TST by 15-21 minutes
  compared with continuous sleep (SR11-SR15 and SR23: p < 0.007; Figure 2A)."
  Both restricted arms still below an adequately slept reference: "While exhibiting poorer morning
  vigilance relative to the control group that received 9 hours of TIB in our previous study
  (Figure 4B; SR13-SR15: p < 0.05; R12-SR23: p < 0.04), the split sleep group critically had fewer
  lapses than the continuous sleep group during the first period of sleep restriction
  (SR12-SR15: p < 0.02)."
  Authors' bottom line: "In adolescents, modest multinight sleep restriction had divergent negative
  effects on cognitive performance and glucose levels depending on how the restricted sleep was
  apportioned. They are best advised to obtain the recommended amount of nocturnal sleep."
shard: "s01_cognition_dose_response"
