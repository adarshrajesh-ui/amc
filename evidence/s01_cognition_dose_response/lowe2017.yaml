rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Cannot be graded properly from the abstract alone. Random-effects pooling of 61 experimental
    studies / 71 populations with a pre-specified moderator set is methodologically appropriate, and
    restricting inclusion to EXPERIMENTALLY manipulated restriction keeps the pooled estimate within
    Tier 1. Unassessable from the abstract: search strategy and databases, whether a protocol was
    registered, duplicate screening/extraction, risk-of-bias assessment of included studies, publication-
    bias testing, and the heterogeneity statistics. Substantive limitations that ARE visible: no dose
    axis is reported (no per-hour or per-arm breakdown), so the pooled g cannot be converted into a
    dose-response slope; and the pooled g collapses across doses from mild to severe and durations from
    one night to two weeks, so it is best read as an average over the literature's exposure mix rather
    than as an estimate for any particular dose. Because the full text is paywalled, five of the six
    SEs recorded here are upper bounds rather than reported values."
funding: "Not stated in the retrieved abstract"
notes: |
  WHY THIS IS THE MOST IMPORTANT POOLED ESTIMATE IN THE SHARD. It is, as far as I could establish, the
  only meta-analysis restricted to experimental sleep RESTRICTION rather than total deprivation. The two
  other meta-analyses screened here - Lim & Dinges 2010 (short-term total deprivation, <48 h) and
  Pilcher & Huffcutt 1996 (mostly total deprivation, pre-1996) - both answer a different exposure
  question. So Lowe 2017 is the correct pooled anchor for our subject's exposure type, and the three
  primary experiments in this shard (Van Dongen 2003, Belenky 2003, Lo 2016) are the correct sources for
  the dose SLOPE that Lowe does not provide.

  THE HEADLINE NUMBERS
    overall across domains     g = -0.383   (SE <= 0.116)
    sustained attention        g = -0.409   (SE <= 0.124)
    executive functioning      g = -0.324   (SE <= 0.099)
    long-term memory           g = -0.192   (SE  = 0.062, exact)
    attention / multitask / impulsive decision-making / intelligence: insufficient evidence

  A SANITY CHECK AGAINST THIS SHARD'S PRIMARIES, AND A WARNING. Lowe's pooled sustained-attention effect
  (|g| = 0.41) is far SMALLER than the per-arm effects computed in this shard from the primaries:
  Van Dongen 2003 4h vs 8h at day 14 gives |g| = 1.44, Belenky 2003 3h vs 9h at day 7 gives |g| = 2.00 for
  PVT speed, and Lo 2016 5h vs 9h in adolescents gives |g| = 1.79 at night 5 rising to 2.40 at night 7.
  Magnitudes only - the sign convention differs between records because the constructs differ. The gap is not
  a contradiction; it is a dose-and-duration artefact. Lowe pools across studies whose exposures include
  single mild restriction nights, whereas the primaries here are the severe, multi-week end of the
  distribution. Anyone who applies g = -0.383 to a three-year 5-6 h weekday schedule will understate the
  effect substantially, and anyone who applies g = -2.0 will overstate it. The dose-response function
  from the primaries - not either pooled number - is what should carry the inference; Lowe's value is
  useful mainly as a lower bound and as external evidence that the effect is real and that duration and
  age moderate it.
shard: "s01_cognition_dose_response"
