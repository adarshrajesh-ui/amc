      TWO CONSEQUENCES FOR THIS SHARD, both important:
      (1) 'cumulative days of restricted sleep' being a significant moderator is independent
          meta-analytic confirmation, across 61 studies, that the deficit ACCUMULATES with duration
          rather than saturating immediately - the same conclusion Van Dongen 2003, Dinges 1997 and
          Lo 2016 reach within single experiments.
      (2) 'age group' being a significant moderator means a single pooled g CANNOT be transported to a
          16-19 year old without adjustment. The abstract does not print the direction or magnitude of
          the age moderation and the full text is paywalled, so the adjustment cannot be quantified from
          this source. Lo 2016's direct adolescent-vs-adult comparison (18.3 lapses in teens at 5h TIB
          vs ~10 in adults at the harsher 4h TIB) is the only quantitative handle available."
