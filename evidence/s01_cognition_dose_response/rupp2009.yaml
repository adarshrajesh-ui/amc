    scale: hours
    unit: "hours of habitual time in bed, mean (SD 0.7)"
    value: 7.09
    se: 0.202
    ci: [6.694, 7.486]
    conversion_formula: "Mean and SD reported directly. SE = 0.7/sqrt(12) = 0.202 assuming the Habitual
      arm was half of the 24 randomised subjects; the per-arm n is not stated in the abstract, so this SE
      is APPROXIMATE and depends on that assumption. CI = value +/- 1.96*SE.
      WHY THIS NUMBER IS WORTH RECORDING: the 'normal' comparison condition in this literature is 7.1 h,
      not 8 h. Several dose-response contrasts elsewhere in this shard are stated 'versus 8 h', but the
      referent that free-living young adults actually achieve is closer to 7 h. Anchoring a spline at 8 h
      as the population norm slightly overstates how far below normal a 5-6 h schedule sits."
    from_figure: false
    inferred_from_ci: false
    direction_note: "descriptive exposure measurement, not an outcome"
    covariates: []
    followup_years: null
