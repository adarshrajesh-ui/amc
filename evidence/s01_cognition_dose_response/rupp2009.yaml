  - outcome_domain: cognition
    outcome_construct: subjective_sleepiness_shows_no_group_difference_while_pvt_does
    exposure: {type: chronic_restriction, dose_h: 3, referent_h: 3, duration_days: 7,
               contrast_label: "prior sleep extension (10h TIB x 1 week) vs prior habitual sleep (7.09h), both then restricted to 3h TIB x 7 nights"}
    scale: raw_units
    unit: "number of study phases (of 3: extension, restriction, recovery) in which subjective sleepiness differed between groups"
    value: 0.0
    se: null
    ci: null
    conversion_formula: "Counted from the authors' explicit statement. THE CONTRAST IS THE POINT: across
      the identical phases, PVT lapses and modified MWT sleep latency DID differ significantly between
      the groups, while subjective sleepiness differed in ZERO phases. Same subjects, same days, same
      manipulation. This is the cleanest available demonstration that subjective sleepiness is not merely
      a flatter version of objective impairment but can be entirely blind to a real, measurable,
      randomised difference in neurobehavioral capacity. No magnitudes are extractable because only the
      abstract was retrievable, so se is null."
    from_figure: false
    inferred_from_ci: false
    direction_note: "0 = subjective sleepiness detected nothing; the objective measures detected a
      significant group difference over the same period. Self-report therefore CANNOT be used to
      titrate or monitor a chronic restriction dose."
    covariates: ["randomised group allocation", "repeated hourly testing 08:00-18:00"]
    followup_years: null
    cohort_family: null
    quote: "Psychomotor vigilance task (PVT) lapses were more frequent and modified maintenance of
      wakefulness (MWT) sleep latency was shorter in the Habitual group than in the Extended group across
      the sleep restriction phase. During the Recovery phase, PVT speed rebounded faster (and PVT lapsing
      recovered significantly after the first night of recovery sleep) in the Extended group. No group
      differences in subjective sleepiness were evident during any phase of the study."
  - outcome_domain: recovery
    outcome_construct: prior_sleep_history_modifies_both_restriction_tolerance_and_recovery_rate
    exposure: {type: sleep_extension, dose_h: 10, referent_h: 7.09, duration_days: 7,
               contrast_label: "one week of 10h TIB before restriction vs one week of habitual 7.09h TIB"}
    scale: raw_units
    unit: "1 = pre-restriction sleep history significantly modified BOTH impairment during restriction and rate of recovery"
    value: 1.0
    se: null
    ci: null
    conversion_formula: "Binary encoding of the randomised primary result. No effect sizes are available
      from the abstract. WHAT IT IMPLIES STRUCTURALLY, and this is the reason the record is here: the
      neurobehavioral response to a given nightly dose is NOT a function of that dose alone. It depends
      on the accumulated sleep history of the preceding weeks, and the dependence is bidirectional -
      prior extension both blunts the impairment and speeds the recovery. A dose-response function of the
      form deficit = f(nightly hours, nights) is therefore mis-specified; it needs a state variable
      carrying sleep history. This is the empirical result that McCauley 2009 formalises as a moving
      asymptote and that Van Dongen 2004 shows is ALSO partly trait rather than state."
    from_figure: false
    inferred_from_ci: false
    direction_note: "1 = history matters; banking sleep in advance genuinely protects, and its absence
      genuinely aggravates, at a fixed restriction dose"
    covariates: ["randomised allocation to Extended vs Habitual", "hourly testing"]
    followup_years: null
    cohort_family: null
    quote: "The extent to which sleep restriction impairs objectively measured alertness and performance,
      and the rate at which these impairments are subsequently reversed by recovery sleep, varies as a
      function of the amount of nightly sleep obtained prior to the sleep restriction period. This
      suggests that the physiological mechanism(s) underlying chronic sleep debt undergo long-term
      (days/weeks) accommodative/adaptive changes."
