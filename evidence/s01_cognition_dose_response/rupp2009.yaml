    quote: "Participants were randomly assigned to an Extended (10 h time in bed [TIB]) or Habitual TIB
      [mean (SD) hours = 7.09 (0.7)] sleep group for one week, followed by 1 Baseline (10 hours or
      habitual TIB), 7 Sleep Restriction (3 h TIB), and 5 Recovery Sleep nights (8 h TIB)."
rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Genuinely randomised parallel-group allocation of the pre-restriction manipulation, residential
    laboratory setting, hourly objective testing 08:00-18:00 throughout, and a well-powered-for-purpose
    design in that both groups received the identical 3 h restriction dose so the restriction itself is
    not the randomised variable. Concerns: n = 24 total across two arms; no blinding is possible; the
    Baseline night differed BETWEEN arms by design (10 h for the Extended group versus habitual TIB for
    the Habitual group), so the two groups enter restriction from different immediate baselines as well as
    different histories, which partly conflates 'banked sleep over a week' with 'one better night just
    before'. Access is abstract-only: the PMC deposit contains the structured abstract but no body,
    tables or figures, and no repository PDF was located, so no per-day means, SDs or effect sizes could
    be extracted. Every effect in this record is therefore a direction or a design quantity, not a
    magnitude. The 3 h TIB dose is also far more severe than our subject's habitual exposure and sits at
    or below McCauley's 3.8 h bifurcation threshold, so the impairment trajectory here is the divergent
    regime rather than the convergent one."
funding: "Military Operational Medicine Research Program, US Army Medical Research and Materiel Command
  (per the parent programme); not restated in the retrieved abstract"
notes: |
  TWO REASONS THIS RECORD EARNS ITS PLACE, neither of which is a dose-response slope.

  1. THE HARDEST EVIDENCE IN THE SHARD FOR SUBJECTIVE/OBJECTIVE DISSOCIATION. Most of the dissociation
     evidence here is a difference in DEGREE - Van Dongen 2003's subjective accumulation exponent
     (theta = 0.24) being about a third of the PVT exponent (theta = 0.78), or Belenky 2003's 3 h arm
     gaining 15.5 lapses while gaining only 0.71 Stanford Sleepiness Scale points. Rupp 2009 is a
     difference in KIND: a randomised manipulation produced a significant objective difference in lapses
     and in physiological sleep propensity (MWT), and subjective sleepiness reported nothing at all, in
     any phase. If subjective report can be completely blind to a real difference in capacity, then a
     subject's own sense of having "adapted" to 5-6 h carries essentially no information about whether
     his performance has adapted. That is directly on point for a college student who believes he is fine.

  2. IT SHOWS THE DOSE-RESPONSE FUNCTION NEEDS A HISTORY TERM. One week of 10 h TIB beforehand
     measurably reduced impairment during seven subsequent nights at 3 h TIB and measurably accelerated
     recovery afterwards. So the mapping from nightly hours to deficit is state-dependent. For our
     subject the implication runs the unfavourable direction: three years of weekday restriction means he
     enters every new week with a depleted rather than a banked state, and Rupp's result predicts he will
     both impair faster and recover slower than a naive subject given the same week.

  DESIGN, for the record: 24 healthy adults aged 18-39, randomised to Extended (10 h TIB) or Habitual
  (7.09 h, SD 0.7) sleep for one week at home; then 1 baseline night, 7 nights at 3 h TIB, then 5
  recovery nights at 8 h TIB, all in a residential sleep/performance facility, with performance and
  alertness tests hourly between 08:00 and 18:00 during all in-laboratory phases. Outcomes: PVT lapses
  and speed, modified Maintenance of Wakefulness Test sleep latency, subjective sleepiness.

  A NOTE ON THE AUTHORS' MECHANISTIC CLAIM. They interpret their result as evidence that "the
  physiological mechanism(s) underlying chronic sleep debt undergo long-term (days/weeks)
  accommodative/adaptive changes." Read carefully, this is an argument for adaptation of the SUBSTRATE,
  not for adaptation of PERFORMANCE - performance still degraded in both arms. It should not be cited as
  evidence that people habituate to chronic restriction. Nothing in this shard supports that; the
  objective measures degrade in every study, at every dose tested, including in the arm with a week of
  banked sleep.
