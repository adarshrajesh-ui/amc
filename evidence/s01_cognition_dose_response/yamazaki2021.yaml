rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Good size for a laboratory protocol (N = 83), generous and well-specified baseline (two nights at
    10-12 h TIB), dense sampling (neurobehavioral tests every 2 h across wakefulness), an objective
    physiological sleepiness measure (modified Maintenance of Wakefulness Test) alongside the cognitive
    battery, and polysomnography on three nights. The restriction-versus-deprivation comparison is a
    strength because both arms received the identical 4-night recovery protocol, so the differential
    residual cannot be an artefact of unequal recovery. Concerns: allocation to the SR versus TSD arm is not
    described as randomised in the abstract, and the abstract gives no per-arm n, no ages and no sex
    distribution, so the population fields here are largely null and adolescent_match is set to fair_adult
    on the assumption of a typical healthy-adult laboratory sample rather than on stated data - that
    assumption should be checked if the full text becomes available. No blinding possible. Abstract-only:
    the PMC deposit (PMC8274462) has no body, and no OA copy was located, so no means, SDs or effect sizes
    could be extracted; all three effects here are directional encodings with se: null."
funding: "Not stated in the retrieved abstract"
notes: |
  THE UPPER BOUND ON RECOVERY. This study gave four consecutive nights at TWELVE hours time in bed after
  five nights at 4 h TIB - the most sleep opportunity of any recovery protocol in this shard - and PVT lapses
  and response speed still failed to fully reverse. Combined with Banks 2010 (one night up to 10 h TIB:
  incomplete), Belenky 2003 (three nights at 8 h: 93-112% of the mild/moderate deficit retained),
  Axelsson 2008 (seven nights at 8 h: lapses not recovered) and Smith 2021 (repeated weekly two-night weekend
  recovery over six weeks: not restored), the conclusion is now supported by five independent laboratories:
  MULTI-NIGHT RESTRICTION LEAVES A VIGILANCE DEFICIT THAT NO RECOVERY WINDOW SO FAR TESTED FULLY CLEARS.

  For our subject this is the mechanism by which a repeating weekly pattern can hold a standing deficit for
  three years without ever producing a dramatic single event: each week's shortfall is only partly repaid,
  and the unrepaid remainder is specifically in the vigilance domain.

  TWO REFINEMENTS THIS RECORD ADDS BEYOND "RECOVERY IS SLOW":

  1. WHAT LINGERS IS EXPOSURE-SPECIFIC. After chronic restriction, PVT lapses and speed linger. After acute
     total deprivation, PVT recovers and subjective vigor lingers instead. So restriction and deprivation
     are not one phenomenon at two magnitudes, at least not on the recovery axis. This is direct support for
     Belenky 2003's position ("chronic sleep restriction leads to long-time-constant changes ... brain
     operational capacity is capped in a manner that apparently precludes rapid recovery ... In contrast,
     rapid recovery to baseline is typical of performance following acute TSD") and a problem for the
     excess-wakefulness unification in Van Dongen 2003, which predicts one common currency. Carry both.

  2. PHYSIOLOGY RECOVERS BEFORE BEHAVIOUR. PSG showed R1 sleep longer, more efficient and higher quality
     than R4 at the same 12 h TIB - the homeostatic rebound had finished by night 4 - while PVT lapses had
     not normalised. Any inference from "his sleep architecture looks normal again" to "his performance is
     back" is therefore invalid, and would understate residual impairment.

  DESIGN, verbatim: "In total, 83 adults received two baseline nights (10-12-hour time in bed [TIB]) followed
  by five 4-hour TIB SR nights or 36-hour TSD and four recovery nights (R1-R4; 12-hour TIB). Neurobehavioral
  tests were completed every 2 hours during wakefulness and a Maintenance of Wakefulness Test measured
  physiological sleepiness. Polysomnography was collected on B2, R1, and R4 nights."
