rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "n=48 - severely underpowered for voxelwise imaging; 4 sleep metrics x 2 waves x whole-brain TBSS with no correction across metrics or waves; self-reported diaries (though time-stamped, with 96% compliance, which is better than single-item recall); 4 participants with >2 mm translational motion retained; single diffusion scan, so the 'brain development' framing is inferential - there is no measured change in the brain. Authors concede: 'Our study is correlational and does not provide evidence about the direction or causality of the effects.'"
funding: "NICHD; NIDA; US government non-PHS support"
notes: |
  IMPORTANT BECAUSE OF WHAT IT SEPARATES: this is a well-known 'adolescent sleep harms white
  matter' citation, but the harmful exposure was IRREGULARITY, not INSUFFICIENCY, and average
  duration was explicitly null even though the sample's lower tail reached 4.5 h.

  RELEVANCE TO THE SUBJECT'S PATTERN, STATED CAREFULLY. His pattern includes substantial
  day-to-day and weekday/weekend variability (5-6 h weekdays, 7-8 h weekends, occasional 3-4 h
  and occasional 10-11 h nights). Telzer's variability finding is the one result in the
  adolescent structural literature that maps onto that. But two things blunt it:
    (a) it did NOT survive as a weekday-to-weekend contrast - only day-to-day within-week SD;
        guldner2023 found the opposite pattern for weekend variability (protective), so the
        two age-appropriate longitudinal DTI studies disagree on which variability metric matters;
    (b) n=48 with uncorrected multi-metric voxelwise testing is exactly the design that produces
        non-replicable imaging findings.

  ONE HONEST POINT IN FAVOUR OF A LAGGED EFFECT: variability 1.5 years before the scan predicted
  FA, while variability a few months before did not. The authors read this as accumulation rather
  than acute state, which if true would argue AGAINST the pure state-artefact explanation for
  this particular finding. With n=48 and no replication, I weight this weakly.

  NOTE ALSO: no gray matter volume measure. This record contributes only to the white matter
  strand.
