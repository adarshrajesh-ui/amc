rob:
  tool: MR-STROBE
  judgement: moderate
  notes: "Mendelian randomization with sensitivity analyses for pleiotropy and heterogeneity, which is the right framework for a causal-direction question. Serious concerns: 206 connections tested with several 'findings' at p = 0.05, 0.03, 0.04 - i.e. barely nominal and clearly uncorrected for 206 tests, so most of these individual estimates are not credible; only the RH limbic (p = 3.8e-3) and RH somatomotor (p = 1.6e-3) thalamic connections would plausibly survive correction; sample sizes for the contributing GWAS not recoverable from the abstract; imaging-derived-phenotype GWAS instruments are weak."
funding: "Non-US government support (China)"
notes: |
  RECORDED FOR CAUSAL DIRECTION, NOT FOR ITS SPECIFIC COEFFICIENTS.

  This study asked the question in the direction almost nobody asks it: does brain structure cause
  sleep duration? Using genetic instruments, the answer was yes. The authors' conclusion: "Our
  findings demonstrate a causal relationship between specific brain areas and sleep duration."

  WHY THIS MATTERS SO MUCH FOR THIS SHARD. Every cross-sectional finding in this domain -
  'short sleepers have smaller frontal volumes', 'short sleepers have thinner cortex' - is
  compatible with two causal stories, and the entire popular narrative assumes one of them. This
  record supplies genetic evidence for the OTHER one.

  IT IS NOT AN ISOLATED RESULT. It converges with two independent lines already in this shard:
    - fjell2023: MR found no causal effect of sleep duration on any brain measure, but DID find a
      robust effect of intracranial volume ON sleep duration.
    - chen2026: the phenotypically normal 'natural short sleeper' subtype of adolescent
      insufficient sleep carried a POLYGENIC PREDISPOSITION TO SHORT SLEEP alongside its reduced
      cortical thickness.
    - cheng2021's own cross-lagged model: depressive problems predicted shorter sleep a year
      later, not the reverse; and the authors modelled brain structure as the PREDICTOR of sleep.

  Four independent designs, all pointing to the arrow running from brain and psychiatric traits
  toward sleep duration rather than the other way. That is the single most important structural
  fact about this literature and it is why cross-sectional volume differences cannot be read as
  damage.

  I DO NOT USE THE INDIVIDUAL COEFFICIENTS AS RELIABLE. With 206 connections tested and several
  p-values at exactly 0.05, this is an uncorrected screen. The directional conclusion is what
  survives; the specific betas should not be pooled.

  Population is children (the sleep-duration GWAS is paediatric), not 16-19 year olds.
