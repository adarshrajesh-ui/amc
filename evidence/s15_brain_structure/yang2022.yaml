rob:
  tool: ROBINS-I
  judgement: moderate
  notes: "Propensity matching on 11 covariates including SES and pubertal status is a genuine strength and is more than most studies here attempt. But: exposure is a dichotomised parent-report at a 9 h cut-off; matched pairs collapse from 3,021 at baseline to 749 at follow-up, which is heavy attrition/matching loss and risks selection; propensity matching only balances MEASURED confounders and cannot address unmeasured ones or reverse causation; the headline design does not test whether the group difference GREW, which is the test that would distinguish an ongoing effect from a stable trait."
funding: "US National Institutes of Health"
notes: |
  THIS PAPER IS ROUTINELY CITED AS THE EVIDENCE FOR 'LONG-LASTING' STRUCTURAL EFFECTS OF
  ADOLESCENT SHORT SLEEP. Read carefully, it does not establish that.

  WHAT IT ACTUALLY SHOWS: the grey matter volume difference between short and adequate sleepers
  looks much the same at age 10 and at age 12 (effect-size map correlation r = 0.61). That is a
  finding about STABILITY, not about progression.

  WHY STABILITY IS THE WRONG EVIDENCE FOR PERMANENT DAMAGE, AND ARGUABLY EVIDENCE AGAINST IT:
    - If chronic short sleep were progressively damaging structure, the difference should GROW
      over the two years. The paper does not report growth; it reports persistence.
    - A difference that is present at baseline and unchanged two years later is exactly the
      signature of a PRE-EXISTING trait difference - the reading fjell2023 argues for on much
      larger data ("Cross-sectional sleep-volume relationships therefore represent mostly stable
      factors, not brain changes").
    - The same paper's behavioural effect-size maps correlate at r = 0.85, again indicating
      stable group differences rather than divergence.

  This is the clearest example in the shard of a mismatch between a paper's causal language
  ("Effects of sleep duration on...", "long-lasting effect", "insufficient sleep induced")
  and what its statistics can license.

  EXPOSURE AND AGE MISMATCH: <9 h at ages 9-12, propensity matched. Not 5-6 h at 16-19.
  COHORT: ABCD - overlaps cheng2021, limasantos2025, chen2026. Do not treat as independent.
shard: "s15_brain_structure"
