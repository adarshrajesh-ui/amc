rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "Cross-sectional VBM; self-reported bed/wake times; six separate whole-brain analyses (bedtime, wake time, time in bed x weekday, weekend) with FWE correction WITHIN but not ACROSS the six analyses; conservative 1200-voxel extent threshold chosen post hoc enough to change the hippocampal conclusion; the previous night's sleep before scanning was not controlled; no SES or screen-time adjustment. Grey matter volume is reported in arbitrary units, so no interpretable magnitude exists."
funding: "European Union FP6 IMAGEN; Academy of Finland; Finnish foundations (non-US government support)"
notes: |
  THE SEED STUDY THE TASK NAMED. Reality check on what it can deliver:

  1. NO EXTRACTABLE VOLUME-PER-HOUR EFFECT EXISTS. The task asked for volume difference per hour
     of sleep in mm3 or SD units. This paper cannot supply it. Grey matter volume is reported in
     arbitrary modulated-VBM units - the figure legend states plainly: "GMV is expressed in
     arbitrary units." The only quantities published are peak-voxel t statistics, cluster
     extents and MNI coordinates. Anyone reporting an mm3-per-hour figure from this paper has
     fabricated it.

  2. AGE IS 14, NOT 16-19. Mean 14.4 y, range 13.4-15.5. This is the same IMAGEN cohort later
     rescanned at 16.8 y (see lapidaire2021), where the weekday/sleep-debt findings did not hold.

  3. THE WEEKDAY-DURATION RESULT IS THE WEAKEST IN THE PAPER. Exactly one cluster survived, at
     cluster-level p = 0.049. The robust findings were all weekend TIMING measures (bedtime,
     wake-up time), not duration. The authors themselves emphasise timing:
     "The most significant results were indeed related to timing of sleep during weekends."

  4. IT FAILS TO REPLICATE taki2012 ON THE HIPPOCAMPUS at a corrected threshold, and the authors
     offer a developmental explanation that argues against a single sensitive window:
     "The hippocampus region might therefore be more vulnerable to sleep habits at a different
     phase of development than the neocortex."

  5. EXPOSURE RANGE DOES NOT COVER THE SUBJECT. Cohort mean weekday time in bed was 8.8 h. These
     adolescents were, by any standard, well slept. The study contains essentially no
     observations at 5-6 h.
