  notes: "ANIMAL STUDY - human RoB tools inapplicable. Strengths: this is the only study located in the entire shard that combines (a) CHRONIC rather than acute sleep loss, (b) exposure timed to ADOLESCENCE, (c) a genuine RECOVERY interval, and (d) re-testing after recovery. That combination is exactly what the permanence question requires. Limitations: group sizes and effect magnitudes not recoverable from the abstract; 'gentle handling' restriction still entails handling stress and experimenter contact; a single behavioural task carries the entire finding; NO BRAIN MEASURE WAS TAKEN, so the structural mechanism is unobserved; single laboratory, no replication located."
funding: "Not stated in the retrievable record"
notes: |
  THE MOST IMPORTANT ANIMAL RECORD IN THE SHARD, BECAUSE IT IS THE ONLY ONE THAT TESTS
  PERSISTENCE AFTER RECOVERY - AND IT IS POSITIVE.

  Ten days of chronic sleep restriction during adolescence produced a hippocampal-dependent
  spatial memory deficit that was still measurable four weeks later, after the animals had slept
  freely and matured into adulthood. The authors describe it as "the first rodent model to use a
  longitudinal approach to investigate adolescent CSR."

  THIS IS THE STRONGEST EVIDENCE FOR THE 'PERMANENT MARK' HYPOTHESIS THAT I FOUND. Intellectual
  honesty requires stating it that plainly, because everything else in this shard points the other
  way. It must be weighted, not dismissed.

  BUT FOUR LIMITS BOUND HOW FAR IT CAN TRAVEL:

  1. NO BRAIN WAS MEASURED. This is a behavioural finding. It does not establish a STRUCTURAL
     mark, which is this shard's actual question. A persistent behavioural deficit could rest on
     synaptic, epigenetic or circuit-level changes invisible to volumetric MRI.

  2. RAT, AND THE EXPOSURE TRANSLATION IS UNRESOLVED (required statement). Rattus norvegicus,
     10 days of experimenter-imposed restriction by gentle handling during the adolescent window.
     There is no established conversion between 10 days of enforced partial sleep loss in a rat
     and 3 years of self-selected 5-6 h nights in a human, and 4 weeks of rat recovery is not
     equivalent to any specific human recovery period. Handling stress is an unresolved confound
     that maps onto nothing in the human scenario.

  3. SELECTIVITY CUTS BOTH WAYS. Only one of two tasks was affected. Good for internal validity;
     but it also means this is a narrow deficit, not evidence of broad durable impairment.

  4. SINGLE STUDY, SINGLE LAB, NO LOCATED REPLICATION, magnitudes unretrievable.

  HOW IT SHOULD MOVE THE POSTERIOR: it should raise the probability of SOME durable
  neurobiological consequence of adolescent chronic sleep restriction above what the human
  imaging data alone would support, while leaving the specific claim at issue - detectable,
  permanent, functionally meaningful STRUCTURAL damage in a particular human 19-year-old -
  essentially unsupported, because no structural measurement was made and the species/dose gap is
  unbridged.
