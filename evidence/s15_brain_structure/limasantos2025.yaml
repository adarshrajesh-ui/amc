rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Genuinely longitudinal diffusion imaging (two scans, ~2 y apart) with n=1,016 - among the strongest designs available. Weaknesses: exposure is a latent class derived from a parent-report Sleep Disturbance Scale item, dichotomised at 9 h, so no dose-response and substantial measurement error; the <9 h group is not remotely comparable to 5-6 h; no reported adjustment for SES, screen use, BMI or pubertal status in the abstract; ODI is the only affected metric out of several tested, which raises the question of why the more established FA and NDI metrics showed nothing."
funding: "Not stated in the retrievable record (no grant list in PubMed)"
notes: |
  THIS RECORD DOES DOUBLE DUTY.

  (1) IT IS THE BEST LONGITUDINAL WHITE MATTER TEST AVAILABLE, and its answer for the metric the
      task asked about - fractional anisotropy - is NULL. "No other metric was affected
      (p > .050)." Neither FA nor neurite density index changed differently in the
      insufficient-sleep group. Only orientation dispersion index moved.

  (2) IT ILLUSTRATES THE INTERPRETATION PROBLEM AT THE HEART OF THIS DOMAIN. One metric out of
      several moved, by under 1% of variance (partial eta-squared about 0.009), in a direction
      whose biological meaning is genuinely ambiguous, and it links to symptoms at beta = 0.10.
      The paper's title says 'Impact' and its discussion says 'insufficient sleep during this
      sensitive period affects white matter development'. The data support 'a small difference
      in one diffusion metric was observed'.

  EXPOSURE MISMATCH IS SEVERE FOR OUR PURPOSE. The 'insufficient' group is children sleeping
  under 9 h at ages 10-12, where 9-11 h is recommended. Most of that group is probably sleeping
  8-9 h. Nothing here characterises 5-6 h at 16-19.

  COHORT OVERLAP: ABCD. Shares participants with cheng2021, yang2022, chen2026 - must not be
  pooled as independent.
