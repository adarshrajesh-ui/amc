rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Prospective repeated exposure measurement (5 waves from 2 months to 6 years) is a real strength, but the brain outcome is measured ONCE at age 7, so this is exposure-prospective / outcome-cross-sectional and cannot identify structural CHANGE. Exposure is maternal-report sleep DISTURBANCE (symptom count), not sleep DURATION - a different construct that overlaps with child temperament and psychopathology. Covariate list not fully retrievable from the abstract. Reverse causation is plausible: a child whose brain development differs may sleep differently."
funding: "Erasmus MC, Netherlands Organization for Health Research and Development (ZonMw); Generation R core funding"
notes: |
  THE ONLY STUDY IN THIS SHARD THAT REPORTS AN INTERPRETABLE VOLUMETRIC MAGNITUDE IN cm3.
  Roughly -7 cm3 of total grey matter per SD of sleep disturbance, i.e. about 1% of total GM.

  FOUR REASONS IT TRANSPORTS POORLY TO A 19-YEAR-OLD, ALL OF WHICH MUST BE CARRIED DOWNSTREAM:

  1. WRONG EXPOSURE. The predictor is sleep DISTURBANCE (symptom counts: difficulty falling
     asleep, night waking), not chronic voluntary sleep RESTRICTION. A 17-year-old who stays up
     doing coursework and a 3-year-old with night wakings are not the same exposure.

  2. WRONG AGE. Exposure ages 2 months to 6 years; brain measured at 7 years. This is early
     childhood, an entirely different phase of cortical development. adolescent_match is set to
     poor_midlife only because the schema has no 'poor_early_childhood' category - the mismatch
     is if anything worse than that label implies.

  3. ONE SCAN. No structural change is measured, so 'affects brain maturation' is an inference,
     not a finding.

  4. THE CIs ARE WIDE AND NEARLY INCLUDE ZERO for the age-2 and age-3 exposures (-11.7 to -0.8
     and -11.7 to -1.7).

  WHAT IT DOES USEFULLY ESTABLISH: an upper bound on the plausible scale of a chronic-sleep-
  related grey matter difference in a well-powered developmental cohort - about 1% per SD of a
  fairly severe exposure. Even taken fully at face value and transported, effects of this size
  have no established mapping to any functional outcome in an individual.
