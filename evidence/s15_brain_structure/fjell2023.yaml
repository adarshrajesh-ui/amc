study_id: fjell2023
citation: "Fjell AM, Sorensen O, Wang Y, Amlien IK, Baare WFC, Bartres-Faz D, et al. No phenotypic or genotypic evidence for a link between sleep duration and brain atrophy. Nature Human Behaviour. 2023;7(11):2008-2022."
doi: "10.1038/s41562-023-01707-5"
pmid: "37798367"
url: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10663160/"
verification:
  crossref_ok: true
  pubmed_ok: true
  title_similarity: 1.0
  status: VERIFIED
  resolved_title: "No phenotypic or genotypic evidence for a link between sleep duration and brain atrophy"
