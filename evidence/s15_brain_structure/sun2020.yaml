rob:
  tool: RoB2
  judgement: high
  notes: "n=23, paired within-subject with no non-deprived control arm, so repeat-scan and time-of-day drift are uncontrolled (though both scans were at 08:00, which handles the diurnal confound better than most). Twenty-five comparisons with Bonferroni correction applied to the correlation but the primary VBM contrasts are whole-brain. Three different morphometric pipelines (FSL-VBM for density, FreeSurfer for volume and thickness) yielding partially discordant results across regions. No recovery scan, so reversibility untested here."
funding: "Not stated in the retrievable record"
notes: |
  RECORDED BECAUSE THE DIRECTION OF THE EFFECT IS THE POINT.

  Twenty-four hours of total sleep deprivation INCREASED gray matter density in three frontal
  regions. The frontal cortex is precisely where the adolescent cross-sectional literature reports
  SMALLER volumes in short sleepers (urrila2017: left superior/middle frontal gyrus; cheng2021:
  superior and middle frontal gyrus, orbitofrontal cortex; hansen2023: right superior frontal).

  So: acute sleep loss makes frontal gray matter measurements go UP, while habitual short sleep is
  cross-sectionally associated with frontal gray matter being DOWN. These cannot both be the same
  mechanism operating on different timescales without further argument, and nobody has supplied
  that argument. The most economical reading is that the acute effect is a physiological state
  change (fluid, perfusion, extracellular space) with no bearing on the cross-sectional gradient,
  and that the cross-sectional gradient is confounded or constitutional.

  THE SLEEPINESS CORRELATION SEALS THE STATE INTERPRETATION. The magnitude of the structural
  change tracked the magnitude of subjective sleepiness (r = 0.625). The imaging signal is
  behaving like a marker of current sleep pressure, which is by definition transient.

  SE CAVEAT, STATED PLAINLY: the correlation's standard error is my own approximation via the
  Fisher z transform for n=23, not a published quantity, and is flagged inferred_from_ci: true.
  The paper publishes no CI. Do not treat it as a reported precision.

  Note also the internally discordant result within this single paper: gray matter DENSITY rose in
  frontal regions while gray matter VOLUME and cortical THICKNESS fell in the temporal pole. Three
  morphometric measures of the same brains after the same intervention disagreed in sign by region.
  That is a useful calibration on how much interpretive weight any single morphometric finding in
  this field can bear.
