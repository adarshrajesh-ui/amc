rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Within-subject design across the physiological sleep/wake cycle, so each participant is their own control - strong for detecting acute state effects. Concerns: n=16; no blinding possible; sleep deprivation is confounded with 24 h of intense task practice by design, so the acute structural change cannot be attributed to sleep loss alone; multiple imaging modalities and timepoints raise multiplicity; no numeric effect sizes retrievable from the abstract."
funding: "NIH (NICHD, NIMH); non-US government support"
notes: |
  STATE-VERSUS-TRAIT KEYSTONE. This is the single most important methodological record in the
  shard, because it undermines the interpretation of every cross-sectional volume difference
  reported elsewhere.

  The chain of inference it supports:
  (a) MRI-derived gray matter volume, white matter volume, ventricular volume and cortical
      mean diffusivity change measurably within 12-24 h of extended wakefulness.
  (b) Those changes fully REVERT after one night of recovery sleep.
  (c) Therefore a cross-sectional scan of a habitually short sleeper cannot distinguish
      "durable structural damage" from "the transient state of being under-slept on the day
      of the scan." Almost no observational study in this literature controls the participant's
      sleep on the night before the scan.

  This also reframes the acute-deprivation VBM literature (liu2014, sun2020, elvsashagen2017):
  those studies are measuring a reversible physiological state, plausibly involving fluid
  shifts, extracellular space and CSF production, not neural loss. The authors say as much:
  "they may be linked to its role in promoting the production of cerebrospinal fluid and the
  decrease in synapse size and strength, as well as to its recently discovered ability to
  enhance the extracellular space and the clearance of brain metabolites."

  ACCESS LIMITATION, STATED PLAINLY: only the abstract was retrievable. Directions and
  significance are quoted verbatim; magnitudes are NOT extracted and must not be invented.
  The qualitative reversal claim is what this record contributes.
shard: "s15_brain_structure"
