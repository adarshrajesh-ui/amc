rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "The DESIGN is the best in the shard for the causal question - two structural scans plus ~130 nights of objective actigraphy in between, which is the only study here with objective exposure AND repeated structural imaging. But n=39 with 7 ROIs x 4 sleep metrics = 28 moderation models, delta-R2 values up to 0.50 in 39 people, and p-values as high as 0.043 reported as findings, is a textbook recipe for irreproducible effects. No correction for multiple comparisons is described in the abstract. A 6-month interval is short relative to measurement error in volumetric change."
funding: "Swiss National Science Foundation"
notes: |
  THE ONLY STUDY THAT ACTUALLY ASKS THE TASK'S QUESTION 2 WITH OBJECTIVE EXPOSURE: does sleep
  at time 1 predict CHANGE in brain structure by time 2 in adolescents? It answers yes, and it is
  the strongest design available - and it is also, unfortunately, 39 people.

  WHY I DO NOT WEIGHT THIS HEAVILY DESPITE THE DESIGN:
    - n=39 with about 28 moderation models and no described multiplicity correction.
    - delta-R2 of up to 0.50 for a sleep-by-time interaction on regional volume change in 39
      adolescents is not a credible population effect size; it is what selection on the maximum
      looks like. I deliberately record the LOWER bound of each reported range.
    - the interval is 6 months, so measured 'change' is a small signal against scanner and
      segmentation noise.
    - ages 10-14 (mean 12.7), i.e. early adolescence, not 16-19.

  THE DIRECTION IS GENUINELY AMBIGUOUS AND THIS MATTERS FOR THE PERMANENCE VERDICT. The finding
  is that short/disrupted sleep goes with ATTENUATED structural change. In several of these
  regions the normative adolescent trajectory is volume decrease (cortical thinning and
  pruning-related reduction). Attenuated change against a normatively decreasing trajectory
  means LESS reduction, which cannot be described as atrophy or damage without further
  argument. The abstract does not give per-region signs, so I cannot resolve it, and I flag that
  as an extraction limit rather than assuming harm.

  This is the record to revisit first if full text becomes available - the per-region signs and
  any multiplicity correction would materially change its weight.
shard: "s15_brain_structure"
