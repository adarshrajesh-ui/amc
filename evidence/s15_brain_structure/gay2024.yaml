notes: |
  THE BEST-DESIGNED TEST OF THE SENSITIVE-PERIOD QUESTION ANYWHERE IN THE SHARD, AND ITS ANSWER
  CUTS AGAINST THE 16-19 WINDOW RATHER THAN FOR IT.

  This study did the right experiment: it exposed three clearly separated developmental stages to
  the same sleep loss and compared them directly. The result was a genuine age gradient in synaptic
  vulnerability - and the vulnerable stage was the JUVENILE mouse (P21-P28), with ADOLESCENTS
  (P42-P49) grouped with adults as showing "comparative resilience."

  WHY THIS MATTERS FOR THE SUBJECT. The task asked whether ages 16-19 constitute a sensitive
  period. The strongest available experimental evidence on developmental staging says the window of
  maximal synaptic vulnerability closes BEFORE adolescence. Read together with tuan2019 - which
  found adolescent-specific pruning effects at P35, an age intermediate between Gay's juvenile and
  adolescent bins - the animal literature does not converge on late adolescence as the vulnerable
  window. If anything it points earlier, toward childhood.

  Note also the direction of the molecular findings: sleep deprivation in juveniles "aberrantly
  drives induction of synapse potentiation, synaptogenesis, and expression of perineuronal nets."
  These are additive/consolidating processes, not degenerative ones. As with tuan2019, the animal
  mechanism predicts more synaptic material, not less.

  EXPOSURE TRANSLATION PROBLEM (required statement): Mus musculus; acute experimental sleep
  deprivation, not habitual partial restriction; rodent-to-human developmental stage mapping is
  approximate and contested; and the readout is synaptic proteomics, which is several inferential
  steps removed from anything measurable in a living human by MRI. The synaptic compartment's
  total volume is small enough that even large proportional changes in it would be near-invisible
  volumetrically - a point fjell2023 makes directly: "such as synaptic density, will have minute
  effects on volumetric measures because their total volume is very small."
