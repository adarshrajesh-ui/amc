  notes: "Cross-sectional VBM in an age range of 5-18 y, which mixes pre-pubertal children with late adolescents while hippocampal and neocortical volume trajectories differ in direction across that span; region-of-interest approach; self/parent-reported sleep; no SES, screen-use or psychiatric adjustment reported in the abstract; no control of pre-scan sleep. The paper's own title asserts 'affects', which the design cannot support."
