notes: |
  THE MOST-CITED PAEDIATRIC HIPPOCAMPAL FINDING, AND IT HAS NOT HELD UP.

  WHAT I COULD NOT GET: no numeric effect size is available. The abstract gives direction and
  significance only, and the full text is not in PMC Open Access. Per the hard rules I record
  the direction with a verbatim quote and leave the magnitude null rather than guessing. The
  task asked for volume difference per hour in mm3 or SD - this paper does not supply it in any
  retrievable form.

  FAILED REPLICATION: urrila2017, in a larger and much more age-homogeneous adolescent sample
  (n=177, ages 13.4-15.5), explicitly failed to reproduce a hippocampus-sleep correlation at a
  corrected whole-brain threshold, and attributed the discrepancy partly to Taki's
  region-of-interest approach and partly to the 5-18 y age mixture.

  CONVERGENT EVIDENCE AGAINST A CAUSAL READING: in fjell2023, hippocampal volume peaked
  cross-sectionally at 6.3 h of sleep (95% CI 4.7-7.1) and hippocampal ATROPHY RATE was
  unrelated to sleep duration across 8,150 longitudinal observations (F=2, p=0.43). A
  cross-sectional positive hippocampus-sleep correlation in children is therefore not
  reproducible as a progressive structural process.

  AGE MISMATCH: 5-18 y pooled. Not informative specifically about 16-19.
