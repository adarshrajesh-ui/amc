rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Within-subject with three timepoints in a single day, and the authors specifically adjusted for hydration - which is the obvious artefactual explanation - and the effects survived. Limitations: n=21, males only, no non-deprived control arm for the third timepoint, whole-brain voxelwise testing, no numeric magnitudes in the retrievable abstract."
funding: "Non-US government support (Norway)"
notes: |
  THE WHITE MATTER COUNTERPART OF THE STATE-VERSUS-TRAIT PROBLEM, AND IT IS ARGUABLY MORE
  DAMAGING TO THE OBSERVATIONAL LITERATURE THAN THE GREY MATTER VERSION.

  Within ONE 23-hour period, whole-brain fractional anisotropy went UP over the first 14 h of
  waking and then DOWN over the next 9 h. Both changes were widespread and both survived
  adjustment for hydration.

  DIRECT CONSEQUENCE FOR THIS SHARD'S QUESTION 5. Every 'FA is lower in adolescents who sleep
  less' finding (mulder2019, telzer2015, and the ODI finding in limasantos2025) is a
  single-timepoint measurement of a quantity that demonstrably swings in both directions within
  a day depending on hours awake. Since short sleepers arrive at the scanner in a different
  homeostatic state than long sleepers, and since no study in this domain standardised the
  pre-scan night, the observational FA differences have an entirely mundane candidate explanation
  that has never been excluded.

  This is why I treat the whole white matter strand of the adolescent literature as
  hypothesis-generating only, and why the per-hour FA effect the task asked for should not be
  reported as a structural fact even where a number exists.

  Companion papers in the same programme: elvsashagen2017 (cortical thickness diurnal change),
  voldsbekk2022 (intracortical T1w/T2w ratio after 32 h). Same cohort_family - do not
  double-count.
shard: "s15_brain_structure"
