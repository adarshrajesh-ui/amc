notes: |
  THIS IS THE STRONGEST MECHANISTIC EVIDENCE IN THE SHARD FOR AN ADOLESCENT-SPECIFIC EFFECT ON
  PRUNING, AND IT IS ALSO WHERE THE TRANSLATION PROBLEM IS MOST ACUTE. Both must be stated.

  WHAT IT SHOWS. 72 h of REM sleep deprivation in 5-week-old (adolescent) mice reduced microglial
  engulfment of postsynaptic material and left an EXCESS of excitatory synapses in the dentate
  gyrus. Adult mice, given identical treatment, showed neither effect. There is therefore a real,
  age-gated biological mechanism by which sleep loss can interfere with synaptic pruning.

  THE EXPOSURE TRANSLATION PROBLEM, STATED EXPLICITLY AS THE TASK REQUIRES:

  1. SPECIES AND METHOD. Mus musculus, REM-deprived by the multiple-platform method - animals
     stand on small platforms over water and fall/wake whenever muscle atonia begins. This is
     total REM abolition plus chronic restraint stress plus thermal and hydric stress. It is not
     a model of a teenager going to bed at 1am and getting 5-6 h.

  2. DOSE. 72 h of continuous REM elimination. The subject's exposure is a partial reduction of
     total sleep - he still obtains 5-6 h nightly, which preserves a substantial and
     REM-enriched proportion of the night (REM is concentrated in the final third of sleep, so
     truncating sleep does reduce REM disproportionately - this is the one respect in which the
     model is not entirely inapposite - but reduction is not abolition).

  3. TIMESCALE MAPPING IS NOT ESTABLISHED. P35 mouse to human 16-19 y is an approximate
     correspondence at best, and 72 h in a mouse has no defensible conversion to 3 years in a human.

  4. THE DIRECTION IS THE OPPOSITE OF 'DAMAGE' AS USUALLY IMAGINED. Sleep loss produced MORE
     synapses, not fewer - a pruning delay, not a loss of tissue. Any translation to human MRI
     would predict LARGER, not smaller, regional volumes. This is worth noting because the human
     cross-sectional literature reports smaller volumes in short sleepers. The animal mechanism
     and the human correlation point in opposite directions.

  5. NO RECOVERY ARM. Whether the pruning deficit persists after normal sleep resumes was not
     tested here, and that is precisely the question the permanence verdict turns on. See
     howard2019 for the only adolescent-exposure study in this shard that includes a recovery
     interval - and note it measured behaviour, not synapses.
