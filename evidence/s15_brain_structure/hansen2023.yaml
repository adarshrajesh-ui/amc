rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "Cross-sectional, n=94, ages 5-9, parent-reported sleep, multiple cortical and subcortical regions tested. Grossly underpowered for the imaging claims taken on their own. Recorded in this shard for its CONFOUNDING STRUCTURE rather than for its effect estimates, which should not be pooled."
funding: "NIMH; NCATS; NCRR (NIH); non-US government support"
notes: |
  THE CONFOUNDING RECORD. Included specifically to make the socioeconomic pathway explicit and
  quantify why the whole cross-sectional literature is hard to interpret.

  THE CAUSAL DIAGRAM THIS PAPER DOCUMENTS:
      socioeconomic status -> family routines -> child sleep duration
      socioeconomic status -> cortical thickness (via nutrition, stress, environment,
                                                 cognitive stimulation, prenatal factors, ...)
  Any study that regresses cortical thickness on sleep duration WITHOUT full adjustment for SES
  is picking up the second arrow and labelling it the first. The authors frame their own finding
  in exactly these terms: sleep is a "potential factor underlying socioeconomic differences in
  brain morphometry."

  WHY THIS BITES ON THE OTHER RECORDS. cheng2021 (n=11,067) adjusts for parental income and
  education, which is better than most - but income and education are crude proxies that leave
  substantial residual confounding, and cheng2021 does NOT adjust for screen use even though the
  same paper shows screen time correlates with sleep duration. urrila2017, lapidaire2021 and
  taki2012 report no SES adjustment at all. To the extent that the pooled adolescent
  cross-sectional signal is real, SES remains a live alternative explanation for most of it.

  ONE IMPORTANT COUNTERPOINT THAT I WILL NOT SUPPRESS: fjell2023 explicitly tested SES as a
  covariate and an interaction term in the far larger cross-sectional sample and reported
  "Controlling for the effects of SES, BMI and depression symptoms as covariates had no notable
  effects on the results, and no significant interaction effects with these variables were found."
  So in adults, SES does not appear to generate the cross-sectional sleep-volume gradient. The
  confounding argument is strongest for the paediatric studies, where SES effects on brain
  development are largest and adjustment is weakest.

  RELEVANCE TO THE SUBJECT: he is a college student, which selects for higher SES and education.
  The direction of any residual SES confounding in these cohorts would, if anything, place him at
  the favourable end.
shard: "s15_brain_structure"
