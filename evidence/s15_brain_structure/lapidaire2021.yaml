rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "Cross-sectional; self-reported bed/wake times only (no actigraphy or PSG); n=101 with ROI-restricted VBM; psychological outcomes available in only 74-82 of 101 participants; no control for the previous night's sleep before scanning, so state effects (see bernardi2016) are uncontrolled; no control for SES or screen use. Cannot support any causal claim."
funding: "European Union FP6 IMAGEN; Medical Research Council; Medical Research Foundation"
notes: |
  This is the CLOSEST cross-sectional study to the subject's age (mean 16.83 y, exactly the
  16-19 window) and it is the follow-up of the seed study urrila2017 in the same IMAGEN cohort.

  WHAT IT FOUND: only sleep TIMING and IRREGULARITY measures (later weekend wake-up time;
  larger weekend delay in wake-up time) correlated with smaller GMV in amygdala, hippocampus
  and mPFC.

  WHAT IT DID NOT FIND: sleep debt (the weekday-to-weekend time-in-bed difference, which is
  the closest available analogue of the subject's pattern of weekday restriction plus weekend
  catch-up) showed NO association with regional GMV. The authors state this explicitly in the
  discussion: "The current results also do not provide evidence of negative effects of sleep
  debt, as measured by time in bed difference between WD and WE, on the adolescent brain."

  IMPORTANT HONESTY CONSTRAINT ON WHAT I CAN CLAIM: weekday time in bed was MEASURED
  (Table 1) but the paper does NOT report a weekday-time-in-bed-versus-GMV test. Table 2 lists
  only weekend wake-up time and weekend delay in wake-up time. I therefore record sleep debt
  as an explicit tested null and do NOT record weekday duration as a tested null, because I
  cannot verify that test was run. Absence of a reported test is not a reported null.

  ALSO NOTE THE AUTHORS' OWN AGE-DEPENDENCE ARGUMENT, which cuts against a 16-19 sensitive
  period for DURATION specifically: "time in bed during the week might be a more important
  factor in earlier brain developmental phases, while sleep timing and regularity in sleep
  timing might be more important later during adolescence."
shard: "s15_brain_structure"
