    se: null
    ci: null
    conversion_formula: "Peak-voxel t from Table 2, p<0.05 FWE. No regression slope in interpretable volumetric units is published; GMV is in arbitrary modulated-VBM units. Converting this selected peak t to r would be upward-biased by voxel selection, so no conversion is offered."
    from_figure: false
