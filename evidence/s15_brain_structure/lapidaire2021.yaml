    direction_note: "Descriptive, not an effect. Recorded because it quantifies the EXTRAPOLATION GAP: the subject's 5-6 h weekday sleep is (8.30-5.5)/0.983 = 2.8 SD below this age-matched cohort's mean. His exposure lies essentially outside the observed range of the best age-matched imaging cohort."
