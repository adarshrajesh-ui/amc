rob:
  tool: Newcastle-Ottawa
  judgement: low
  notes: "Excellent design for its purpose: longitudinal in-home polysomnographic EEG at 6-month intervals over 2 years in two age cohorts, with concurrent Tanner staging. Objective exposure and objective outcome. Limitations for THIS shard: n=69 across two cohorts; ages 9-14, so it stops just below the subject's window; it is a normative/descriptive study with NO sleep-restriction exposure, so it cannot speak to whether restriction perturbs the trajectory - it only characterises the trajectory."
funding: "NIMH (NIH)"
notes: |
  RECORDED AS THE NORMATIVE BASELINE FOR THE SYNAPTIC-PRUNING STRAND OF THE ARGUMENT, AND IT
  DELIVERS TWO USEFUL CONSTRAINTS PLUS ONE IMPORTANT LIMITATION.

  CONSTRAINT 1 - THE PRUNING TRAJECTORY IS STEEP AND AGE-PROGRAMMED. NREM delta power density
  falls 25% between ages 12 and 14. Feinberg's long-standing hypothesis, stated in this paper, is
  that this decline indexes synaptic pruning: "We hypothesize that the DPD decline is caused by
  age-programmed synaptic pruning that decreases waking brain metabolic rate."

  CONSTRAINT 2 - IT IS DRIVEN BY AGE, NOT PUBERTY. With Tanner stage, height, weight and BMI
  controlled, delta still tracked age; with age controlled, none of the pubertal or growth
  measures predicted delta. This is the direct answer to the task's question about pubertal-stage
  moderation of the sleep-brain relationship: the pruning clock is not a pubertal clock. A model
  in which sleep restriction is dangerous specifically because it coincides with pubertal
  maturation has no support from the best marker available.

  THE HONEST LIMITATION, WHICH IS ALSO THE BIGGEST GAP IN THIS SHARD. This study measures the
  normative trajectory in UNMANIPULATED adolescents. It does NOT test whether chronic sleep
  restriction alters that trajectory. I searched specifically for a study that measured the
  adolescent NREM delta / slow-wave-activity decline under chronic sleep restriction and found
  none. That experiment - chronically restrict adolescents for months and track the delta decline
  slope against a control group - is the study that would actually answer the pruning question in
  humans, and it does not exist. It is also, for obvious reasons, close to unethical to run.

  So the pruning mechanism remains: plausible in theory, demonstrated in mice (tuan2019),
  quantified normatively in humans (this record), and untested in humans under restriction.
  A 25% two-year normative swing also implies that detecting a modest exposure effect against
  that background would require a large, well-controlled longitudinal design.
