rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Large sample with prospectively repeated exposure measurement, but a SINGLE diffusion scan at age 10 - so again exposure-prospective, outcome-cross-sectional; cannot identify change. Exposure is maternal-reported sleep PROBLEMS (CBCL items), not duration. Authors explicitly disclaim causality. Effect estimates are homogeneous across tracts, which the authors note ('effect estimates across the tracts did not differ substantially') - a pattern more consistent with a global confounder than with tract-specific sleep effects."
funding: "Netherlands Organization for Health Research and Development (ZonMw); Erasmus MC; European Research Council"
notes: |
  THE BEST-QUANTIFIED WHITE MATTER EFFECT IN THE PAEDIATRIC LITERATURE: about -0.05 SD global FA
  and -0.11 to -0.12 SD in specific tracts, per SD of sleep problems.

  PUT THAT NUMBER IN CONTEXT. -0.12 SD is a small effect by any convention. The tracts implicated
  (corticospinal, uncinate, forceps major) are functionally unrelated to each other, and the
  authors observe that the estimates are essentially flat across tracts. A uniform small
  decrement across anatomically and functionally unrelated tracts is the signature you expect
  from a global nuisance variable (head motion, SES, general psychopathology, image quality)
  rather than from a targeted biological effect of sleep.

  WRONG EXPOSURE, WRONG AGE, ONE SCAN - the same three limits as kocevska2017 (same cohort,
  overlapping authorship; cohort_family Generation_R must be used to avoid double-counting
  these two records as independent).

  The authors' own bottom line is appropriately hedged: "This study cannot demonstrate causality
  but suggests that preventive interventions addressing sleep problems should be further
  explored".
