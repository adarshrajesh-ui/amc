rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "Cross-sectional; SuStaIn is a data-driven staging model borrowed from neurodegeneration research and its application to a non-degenerative behavioural exposure assumes a monotonic progression that is not established here; subtype solutions from unsupervised clustering require out-of-sample validation which is not described in the abstract; imaging sample size not recoverable; ABCD ages 9-14, not 16-19. Despite these limits the heterogeneity finding is conceptually important and is corroborated by independent genetic evidence (polygenic scores)."
funding: "Chinese Ministry of Science and Technology; National Natural Science Foundation of China; Shanghai Municipal Health Bureau"
notes: |
  THE CONFOUNDING-AND-REVERSE-CAUSATION RECORD, AND THE MOST DIRECT REFUTATION OF THE INFERENCE
  'THIS ADOLESCENT SLEEPS LITTLE AND HAS A THINNER CORTEX, THEREFORE THE SLEEP THINNED THE CORTEX'.

  Three structurally distinct subtypes sit underneath the single label 'insufficient sleep' in
  adolescents, and they have DIFFERENT CAUSES:
    - postcentral subtype: genetically predisposed NATURAL SHORT SLEEPERS. Reduced cortical
      thickness, but behaviourally and psychiatrically normal, with polygenic evidence for short
      sleep. The structure is constitutional. Advanced brain age.
    - entorhinal subtype: driven by PSYCHIATRIC RISK. Younger brain age - the opposite deviation.
    - pericalcarine subtype: driven by ENVIRONMENTAL exposure (light and noise pollution), with
      sleep merely mediating.

  WHAT THIS DOES TO THE OBSERVATIONAL LITERATURE. Every cross-sectional study in this shard
  (cheng2021, urrila2017, taki2012, lapidaire2021) pools these subtypes into one 'short sleeper'
  group and reports the average structural difference. That average is a mixture of a genetic
  trait, a psychiatric confound, and a neighbourhood environmental exposure. None of those three
  is 'chronic voluntary sleep restriction damaged this brain'. The tiny pooled effects reported
  elsewhere are therefore not merely small - they are of substantially unknown provenance.

  DIRECTLY RELEVANT TO THE SUBJECT'S SITUATION. He is a college student whose short sleep is
  behaviourally driven (coursework, exams, schedule), without stated psychiatric comorbidity. He
  does not obviously belong to any of the three subtypes as characterised, and in particular the
  subtype that most resembles 'short sleep with no other problems' - the postcentral, natural
  short sleeper group - is the one the authors describe as PHENOTYPICALLY NORMAL.

  ABCD cohort - overlaps cheng2021, yang2022, limasantos2025. Do not pool as independent.
