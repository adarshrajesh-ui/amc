rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Genuine multicentre randomised controlled trial (NCT02886156), 148 participants, 5 hospitals, pre-registered primary endpoint - by far the highest-quality design bearing on structural reversibility. Concerns: CPAP cannot be blinded to participants; adherence not recoverable from the abstract; the imaging endpoints are SECONDARY, so the significant thickness result is a secondary outcome in a trial that missed its primary endpoint, and no multiplicity correction across secondary neuroimaging endpoints is described; the referent direction of the thickness contrast is not stated in the abstract."
funding: "National Natural Science Foundation of China; STI2030 Major Projects, National Key R&D Program of China; Shanghai Municipal Commission of Science and Technology; Shanghai Jiao Tong University programmes"
notes: |
  THE HIGHEST-TIER EVIDENCE IN THIS SHARD ON REVERSIBILITY, AND IT DELIVERS TWO LESSONS, THE
  SECOND MORE IMPORTANT THAN THE FIRST.

  LESSON 1 (reversibility): randomising chronic sleep-disruption patients to treatment
  measurably changed cortical thickness and default-mode connectivity within 6 months. The
  authors' reading: "CPAP improved cortical thickness and FC of DMN, suggesting that patients
  with OSA may recover from brain atrophic processes after CPAP treatment." Structural MRI
  measures in sleep-disrupted brains are modifiable, on a timescale of months, by fixing the sleep.

  LESSON 2 (THE ONE THAT MATTERS MOST FOR THIS SHARD'S VERDICT): STRUCTURE MOVED AND COGNITION
  DID NOT. The pre-registered primary endpoint, MoCA, was flatly null: difference -0.04 points,
  95% CI -0.72 to 0.65, p=0.91. A trial that successfully shifted a structural imaging biomarker
  produced zero measurable cognitive benefit.

  This is the empirical demonstration of the point the task asked me to be precise about: a
  small structural MRI difference has NO established mapping to a functional consequence. Here we
  have the strongest possible version of that dissociation - randomised, prospective, with the
  structural change and the cognitive non-change measured in the same people at the same
  timepoints. If a 0.06 mm cortical thickness change buys nothing detectable on cognition, then a
  fraction-of-a-percent cross-sectional volume difference in an observational adolescent cohort
  certainly cannot be translated into a claim about how a particular 19-year-old's brain works.

  SIGN CAVEAT IS REAL AND I HAVE NOT PAPERED OVER IT. The published between-group difference is
  -0.06 mm while the conclusion says 'improved'. Without full text I cannot resolve the referent
  direction. The magnitude, CI and p-value are exact; the direction is flagged UNRESOLVED. This
  does not affect the Lesson 2 inference, which depends only on the null primary endpoint.
