rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Within-subject repeated scanning with a non-deprived comparison group (n=20) is a strong design for acute effects. Key limitation stated by the authors themselves: the group x time interaction was NOT significant, so the deprivation-specific thinning is not established - only the within-group pairwise contrast was significant, which is a weaker and multiplicity-prone test. Males only (n=61, all male), so no sex generalisation. No numeric magnitudes retrievable from the abstract."
funding: "Non-US government support (Norway); South-Eastern Norway Regional Health Authority / Research Council of Norway (per journal record)"
notes: |
  THIS IS THE STATE-VERSUS-TRAIT PROBLEM IN ITS PUREST FORM, AND THE NUMBER THAT MATTERS IS
  THE TIME CONSTANT, NOT THE EFFECT SIZE.

  Right prefrontal cortical thickness increased measurably between a morning scan and an evening
  scan ON THE SAME DAY, in the same people, with no sleep manipulation at all. Cortical thickness
  - the exact metric used to claim 'thinner cortex in short sleepers' in cross-sectional studies -
  has detectable diurnal variation.

  THE IMPLICATION FOR EVERY CROSS-SECTIONAL RECORD IN THIS SHARD: if thickness varies within a
  single day as a function of hours awake, then a cohort study that scans habitual short sleepers
  and habitual long sleepers - without standardising time of day or the prior night's sleep -
  is partly measuring how long each participant had been awake when they entered the scanner.
  Habitual short sleepers wake earlier relative to their scan slot or are more sleep-pressured;
  either produces a systematic state difference masquerading as a trait difference. I found no
  observational study in this domain that controlled the pre-scan night's sleep.

  IMPORTANT HONESTY POINT ABOUT THE DEPRIVATION RESULT ITSELF: the widely-cited 'sleep
  deprivation thins the cortex' claim from this paper is weaker than usually reported. The
  group-by-time interaction was null. The authors are explicit that they cannot rule out
  non-deprivation mechanisms. I record it with that caveat attached rather than as a clean
  deprivation effect.

  Combined with bernardi2016 (all such changes revert after recovery sleep) and elvsashagen2015
  (FA changes within hours of waking), the acute literature establishes that MRI structural
  metrics in this field are substantially state-dependent on a timescale of hours.
