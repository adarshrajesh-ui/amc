rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Has the parallel non-deprived control arm that elvsashagen2017 lacked, and the authors pre-emptively adjusted for the three obvious artefactual explanations - head motion, cortical thickness and hydration - with 95% of effects surviving. That is unusually careful. Concerns: n=41 split 18/23; allocation procedure not described in the abstract; four clusters from a whole-cortex search; the biological meaning of the T1w/T2w ratio is genuinely uncertain, as the authors concede."
