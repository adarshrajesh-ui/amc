notes: |
  THE STRONGEST ACUTE-STATE RECORD, BECAUSE IT HAS A CONTROL ARM AND IT SURVIVES THE OBVIOUS
  ARTEFACT CHECKS.

  Thirty-two hours of sleep deprivation shifted the intracortical T1w/T2w ratio - a putative
  index of MYELIN and dendritic density - in the opposite direction from a rested control group,
  and the effect was not attributable to head motion, cortical thickness or hydration.

  WHY THIS IS THE MOST IMPORTANT ACUTE RECORD FOR THE STATE-VERSUS-TRAIT ARGUMENT. Volume and
  thickness could be dismissed as fluid shifts. Myelin-sensitive contrast is supposed to be the
  slow, structural, hard-to-move quantity - the kind of measure people invoke when they say
  'myelination continues into the mid-20s and sleep restriction could disrupt it'. This study
  moved it in 32 hours.

  So when an adolescent cross-sectional or single-scan study reports a difference in a
  myelin-sensitive or diffusion-based measure between short and long sleepers, the timescale
  argument that would justify calling it developmental damage is not available. The measure is
  demonstrably state-sensitive on a scale of one day.

  IMPORTANT LIMIT ON WHAT I CLAIM: this study did NOT include a recovery scan, so it does not
  itself establish reversal. Reversal comes from bernardi2016. And the authors are appropriately
  cautious about biological interpretation: "While the intracortical changes detected by this
  study could reflect alterations in myelin or dendritic density, or both, histological analyses
  are needed to clarify the precise underlying cortical processes."

  POPULATION IS THE CLOSEST OF THE ACUTE STUDIES TO THE SUBJECT: 41 healthy young adults, 26
  women - hence adolescent_match good_young_adult rather than fair_adult.

  Same research programme as elvsashagen2015 and elvsashagen2017 - shared cohort_family
  Oslo_sleep_deprivation, do not treat the three as independent.
