rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Comprehensive search across 5 databases, 105 articles, and an inclusion requirement that studies adjust for age, sex and head size - a real quality filter. But the synthesis is largely a VOTE COUNT rather than a quantitative pooling of effect sizes, which is the weakest form of evidence synthesis and is dominated by publication bias; only ONE pooled VBM result survived and it concerns a neurodegenerative parasomnia; the review is framed around ageing and dementia risk in ADULTS and reports no adolescent stratum; heterogeneity of exposure definitions (duration, quality, disorders all combined) is extreme."
funding: "Non-US government support (Australia); Australian National University / NHMRC-type support per journal record"
notes: |
  THE TOP OF THE EVIDENCE HIERARCHY FOR THIS DOMAIN, AND WHAT IT REVEALS IS HOW THIN THE DOMAIN IS.

  With 106 studies and 108,364 participants, this systematic review with meta-analysis produced
  exactly ONE pooled voxel-based finding - and it was for REM sleep behaviour disorder, a
  prodromal neurodegenerative condition of older adults, in a 68-voxel cluster. There is no pooled
  per-hour volumetric estimate for sleep DURATION in this review. If a defensible
  cubic-millimetres-per-hour figure existed in this literature, this is the paper that would have
  produced it. It does not exist.

  THE VOTE COUNT IS THE HEADLINE AND IT IS ALSO THE TELL. '73.1% of studies found lower volumes'
  is a statement about the publication record, not about biology. The authors' own stratification
  is the more informative number: among LONGITUDINAL studies only 45.5% found any association -
  fewer than half. For a real and consistent biological effect you would expect longitudinal
  designs, which are better suited to detecting change, to have a HIGHER hit rate than
  cross-sectional ones. They have a lower one. That pattern is what you see when cross-sectional
  associations reflect stable confounded differences rather than progressive change, exactly as
  fjell2023 argues from primary data.

  TRANSPORTABILITY: this review is explicitly about ageing and neurodegeneration in healthy
  ADULTS. It contains no adolescent analysis and its framing ("As the global population ages...")
  is orthogonal to a 19-year-old's question. Its conclusion that inadequate sleep "might
  contribute to neurodegeneration" is a hypothesis stated in the discussion, not a result of the
  meta-analysis.
