notes: |
  RECORDED PRIMARILY FOR ITS NULLS, WHICH ARE MORE INFORMATIVE THAN ITS POSITIVE FINDING.

  Seventy-two hours of TOTAL sleep deprivation - an exposure vastly more severe than 5-6 h of
  weekday sleep, and one no adolescent in this scenario approached - produced:
    - NO change in whole-brain grey matter volume
    - NO change in hippocampal volume
    - a localised reduction in thalamic grey matter volume

  THE CEILING THIS PUTS ON THE ACUTE STORY. If three days of complete sleeplessness cannot move
  global grey matter or the hippocampus, then the claim that habitual 5-6 h sleep progressively
  erodes global brain volume has no experimental support at the top of the dose range.

  THE THALAMIC FINDING SHOULD NOT BE READ AS NEURAL LOSS. Thalamic volume is the single most
  state-labile subcortical measure in this literature: in fjell2023 the thalamus was one of only
  two structures with any longitudinal signal and its cross-sectional optimum collapsed to the
  4 h boundary once global sleep quality was controlled. Combined with bernardi2016 showing that
  acute deprivation-related volume changes fully revert after recovery sleep, the most
  parsimonious reading of a thalamic volume drop after 72 h awake is a reversible physiological
  state - fluid distribution, extracellular space, perfusion - not neuronal loss.

  n IS RECORDED AS null. I could not retrieve the sample size and will not invent it. This
  limits the record's poolable weight and that is the correct consequence.
