rob:
  tool: RoB2
  judgement: high
  notes: "Uncontrolled pre-post design for the treatment arm - there is no untreated OSA comparison group followed over the same 3 months, so regression to the mean, scanner drift, practice effects on the cognitive tests, and repeat-scan segmentation effects are all uncontrolled. n=17 treated. Tier is recorded as T1 because the exposure (treatment) was deliberately administered and each patient serves as their own control, but the absence of a parallel control arm means it functions closer to a quasi-experiment; ROBINS-I judgement would also be serious. No effect magnitudes retrievable."
funding: "Non-US government support (Italy)"
notes: |
  THE MOST-CITED EVIDENCE THAT SLEEP-DISORDER-RELATED STRUCTURAL DEFICITS ARE REVERSIBLE, AND
  THE BEST AVAILABLE HUMAN MODEL OF STRUCTURAL RECOVERY AFTER CHRONIC SLEEP DISRUPTION.

  WHAT IT SUPPORTS: grey matter volume reductions in hippocampal and frontal regions, present in
  untreated OSA, PARTIALLY OR FULLY REVERSED within 3 months of treatment, alongside cognitive
  improvement. Structural MRI differences of the kind reported in observational sleep studies are
  therefore not necessarily fixed.

  THREE REASONS THIS TRANSPORTS ONLY PARTIALLY TO THE SUBJECT, AND ALL THREE MATTER:

  1. OSA IS NOT SLEEP RESTRICTION. Its defining insult is repetitive nocturnal intermittent
     HYPOXAEMIA plus arousal-driven sleep fragmentation. The authors name both mechanisms:
     "may be secondary to sleep deprivation and repetitive nocturnal intermittent hypoxemia."
     Hypoxaemia is a plausible route to real tissue injury; voluntarily going to bed at 1am is not.
     If anything, OSA should OVERSTATE the structural harm attributable to short sleep - so the
     fact that even OSA's deficits reverse is the stronger form of the reversibility argument.

  2. ADULTS, NOT ADOLESCENTS. Nothing here addresses a maturational trajectory.

  3. UNCONTROLLED PRE-POST. With n=17 and no untreated comparison arm, part of the apparent
     recovery could be measurement artefact.

  HOW I USE IT IN THE VERDICT: as convergent support - alongside bernardi2016 (acute changes fully
  revert after one night) and xu2025 (randomised CPAP moves cortical thickness) - for the
  proposition that sleep-related structural MRI differences are DYNAMIC rather than fixed scars.
  That is the direct counter to a claim of permanence.
