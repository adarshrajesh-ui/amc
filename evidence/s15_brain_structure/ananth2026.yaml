rob:
  tool: AMSTAR-2
  judgement: critical
  notes: "NARRATIVE review, self-described. No pre-registered protocol, no reproducible search strategy reported, no formal risk-of-bias appraisal of included studies, no quantitative synthesis, no assessment of publication bias, and no separation of cross-sectional from longitudinal evidence in the abstract-level conclusions. AMSTAR-2 judgement is critical for these reasons. Included for orientation and base rates only; contributes NO effect estimate."
funding: "NIA (NIH); US Department of Veterans Affairs; Burroughs Wellcome Fund"
notes: |
  INCLUDED FOR TWO REASONS ONLY, NEITHER OF WHICH IS ITS EFFECT SYNTHESIS.

  1. IT CONFIRMS THAT NO POOLED PER-HOUR VOLUMETRIC ESTIMATE EXISTS. This is, as of my search, the
     most recent review devoted specifically to the question this shard was assigned - structural
     brain correlates of insufficient sleep in adolescents - and it is a NARRATIVE review that
     reports no pooled effect size of any kind. The authors state that "no review has
     systematically examined the effects of insufficient sleep on structural brain development."
     That is an admission, in 2026, that the quantitative synthesis this shard was asked to
     extract has never been performed. It is not that I failed to find the number; the number does
     not exist.

  2. THE BASE RATE REFRAMES THE QUESTION. Fewer than 30% of US high school students get the
     recommended 8-10 h. The subject is therefore inside the majority, not in a rare high-risk
     tail. Every imaging cohort in this shard drew its 'insufficient sleep' group from that same
     majority, which means the comparison groups in those studies are the unusual ones. This has a
     direct bearing on how alarming a 0.2%-of-variance cross-sectional difference should sound:
     if short sleep produced meaningful structural damage, the effect would be visible as a
     population-level phenomenon in the great majority of American adolescents, and it is not.

  I deliberately do NOT use this review as a source for any numeric effect, and I do not adopt its
  conclusion as evidence. Its own language is notably more restrained than its framing suggests:
  it claims "measurable alterations" and "detectable effects", which is compatible with everything
  in this shard, including the interpretation that those detectable differences are small,
  confounded, partly state-dependent and of unknown functional significance.
