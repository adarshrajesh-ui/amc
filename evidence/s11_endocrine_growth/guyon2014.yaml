rob:
  tool: RoB2
  judgement: low
  notes: randomised crossover, polysomnography-verified, 20-min sampling; but only 2 nights of restriction (acute, not chronic)
    and a 10 h TIB comparator. SEs are upper bounds derived from reported p-value inequalities.
funding: NIH / non-US government
notes: 'Important negative: ''Sleep restriction was not associated with higher perceived stress but resulted in an increase
  in appetite that was correlated with the increase in total cortisol.'' The HPA change is a circadian-amplitude change,
  not a stress response. Also note the exposure is ACUTE (2 nights); killick2015 shows no residual morning cortisol signal
  in men chronically restricted for years, implying adaptation.'
