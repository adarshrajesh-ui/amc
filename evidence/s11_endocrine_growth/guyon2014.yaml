- outcome_domain: endocrine
  outcome_construct: evening_total_cortisol
  exposure:
    type: chronic_restriction
    dose_h: 4
    referent_h: 10
    duration_days: 2
    contrast_label: 2 nights 4 h TIB vs 2 nights 10 h TIB, randomised crossover; evening window
  scale: pct_change
  unit: '% change in evening total cortisol'
  value: 30.0
  se: 12.19
  ci:
  - 3.4
  - 56.6
  conversion_formula: 'Reported as +30% with P<.03. Using the boundary p=.03 and df=12: t=2.4607, so SE <= 30/2.4607 = 12.19
    pp (a conservative upper bound on SE); ci = 30 +/- t(12,.05)=2.1788 * SE.'
  from_figure: false
  inferred_from_ci: true
  direction_note: Positive = higher evening cortisol under restriction (harm).
  covariates: []
  followup_years: null
  cohort_family: UChicago_VanCauter_sleepdebt
  quote: Sleep restriction was associated with a 19% increase in overall ACTH levels (P < .03) that was correlated with
    the individual amount of sleep loss (rSp = 0.63, P < .02). Overall total cortisol levels were also elevated (+21%; P
    = .10). Pulse frequency was unchanged for both ACTH and cortisol. Morning levels of ACTH were higher after sleep restriction
    (P < .04) without concomitant elevation of cortisol. In contrast, evening ACTH levels were unchanged while total and
    free cortisol increased by, respectively, 30% (P < .03) and 200% (P < .04). Thus, the amplitude of the circadian cortisol
    decline was dampened by sleep restriction (-21%; P < .05).
