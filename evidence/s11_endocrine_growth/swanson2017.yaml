study_id: swanson2017
citation: 'Swanson CM, Shea SA, Wolfe P, Cain SW, Munch M, Vujovic N, Czeisler CA, Buxton OM, Orwoll ES. Bone turnover markers
  after sleep restriction and circadian disruption: a mechanism for sleep-related bone loss in humans. J Clin Endocrinol
  Metab. 2017;102(10):3722-3730.'
doi: 10.1210/jc.2017-01147
pmid: '28973223'
verification:
  crossref_ok: true
  pubmed_ok: true
  resolved_title: 'Bone Turnover Markers After Sleep Restriction and Circadian Disruption: A Mechanism for Sleep-Related
    Bone Loss in Humans'
  status: VERIFIED
access_tier: abstract_only
secondhand_via: null
design: lab_restriction_within_subject
tier: T1
n: 10
n_studies_pooled: null
population:
  age_mean: null
  age_range:
  - 20
