funding: NIH / non-US government
notes: 'BEST EXPOSURE MATCH IN THE SHARD. Screening characteristics (Table 1): ''Age (years) 28.6 +/- 2.0 [range] 19-49;
  Midweek sleep 6 h 12 min +/- 7 min [range] 5 h 18 min-6 h 54 min; Weekend sleep 8 h 30 min +/- 9 min [range] 6 h 59 min-9
  h 39 min; ... Duration of catch-up sleep patterns (years) 5.1 +/- 0.9 [range] 0.5-15.'' That is the subject''s pattern
  almost exactly: weekday 5-6 h, weekend 7-8 h, sustained for years. In these men the testosterone deficit was still fully
  reversible within 3 nights, and cortisol was already normal.'
