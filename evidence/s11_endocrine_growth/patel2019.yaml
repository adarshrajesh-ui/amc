notes: 'Verbatim context: ''Median serum testosterone level was 377 ng/dL (IQR: 279-492 ng/dL). Median number of hours slept
  was 7 h (IQR: 6-8 h).'' ''On multivariate linear regression, we found serum testosterone decreased by 0.49 ng/dL per year
  of age (p = 0.04), 5.85 ng/dL per hour loss of sleep (p < 0.01) and 6.18 ng/dL per unit of body mass index (BMI) increase
  (p < 0.01).'' Note the BMI coefficient exceeds the sleep coefficient: one BMI unit outweighs one hour of sleep.'
