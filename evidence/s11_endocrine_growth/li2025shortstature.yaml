rob:
  tool: Newcastle-Ottawa
  judgement: critical
  notes: clinic-based case-control with parent-reported exposure collected AFTER the outcome was known (recall bias runs
    directly toward this finding); 33 variables screened with 100 cases; the outdoor-activity OR of 0.02 is not credible
    and signals severe model instability
funding: null
notes: Author list not recoverable from the PubMed record retrieved in this session, so the citation is title-first; DOI
  and PMID both verified. This is the only study found that links sleep DURATION specifically to a stature outcome, and
  its risk of bias is critical. It concerns children still growing, not 16-19 year olds.
