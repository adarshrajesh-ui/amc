  se: 0.49485
  ci:
  - 0.3148
  - 2.2546
  conversion_formula: log_or = ln(3.62) = 1.2865; se = (ln(9.53) - ln(1.37))/3.92 = (2.25464 - 0.31481)/3.92 = 0.49485;
    ci = ln of the reported bounds [1.37, 9.53].
  from_figure: false
  inferred_from_ci: true
  direction_note: 'POSITIVE = short sleepers had HIGHER odds of high testosterone. This is the OPPOSITE direction to the
    lab studies, in the age band closest to the subject. Cross-sectional and almost certainly confounded (reverse causation:
    high testosterone delays bedtime), but it means the observational literature provides no support for a clinically meaningful
    testosterone deficit in short-sleeping young men.'
