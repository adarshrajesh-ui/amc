  - BMI
  - other NHANES covariates per weighted multivariable model
  followup_years: null
  cohort_family: NHANES
  quote: 'Sleep deprivation (<=6 h) was associated with high testosterone (odds ratio = 3.62; 95% confidence interval: 1.37,
    9.53) among young men (20-40 years old); meanwhile, middle-aged men (41-64 years old) who reported more sleep duration
    had low testosterone (odds ratio = 2.03; 95% confidence interval: 1.10, 3.73).'
