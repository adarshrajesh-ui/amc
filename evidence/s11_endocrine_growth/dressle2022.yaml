  notes: case-control designs only, so direction of causation unresolved; heterogeneous cortisol matrices; authors note
    the association with objective sleep loss was itself non-significant
funding: null
notes: The only quantitative meta-analysis available for chronic HPA activity and disturbed sleep. Critically, the association
  between the EXTENT of objective sleep loss and the cortisol difference was NOT significant, which argues that the cortisol
  elevation in insomnia is driven by hyperarousal rather than by short sleep duration per se.
