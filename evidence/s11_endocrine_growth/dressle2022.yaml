  direction_note: 'Positive = higher cortisol in chronic poor sleepers (harm). CEILING ESTIMATE for a chronic HPA effect:
    even years of clinically diagnosed insomnia yields only SMD ~0.5. EXPOSURE MISMATCH: insomnia disorder involves hyperarousal
    and distress, which behaviourally-chosen short sleep in a healthy student does not; the association is also bidirectional.'
  covariates: []
  followup_years: null
  cohort_family: null
  quote: 'Twenty studies (449 patients with insomnia, limited to ages 18-70 not taking any medications; 357 GSC) met the
    inclusion criteria. ... Results suggest that patients with insomnia show moderately increased cortisol levels (SMD =
    0.50, 95% CI: [0.21-0.80]). Higher effect sizes were found by including only studies using blood samples in the analysis
    (SMD = 0.67, 95% CI: [0.15-1.18]). Furthermore, a positive, but insignificant association was found between the extent
    of objective sleep loss in insomnia patients and group differences in cortisol levels.'
rob:
