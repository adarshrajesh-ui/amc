  direction_note: 'value=0 encodes a NULL. HIGHEST-RELEVANCE exposure pattern for a college student: the sleep loss is taken
    off the FRONT of the night (late bedtime, fixed wake time). Under that pattern testosterone was unaffected. Comparator
    is a realistic 8 h, not 10-12 h.'
  covariates: []
  followup_years: null
  cohort_family: null
  quote: Serum LH, T and PRL concentrations showed characteristic diurnal variations across the 15-h period without any
    differences between the 4- and 8-h sleep conditions.
- outcome_domain: endocrine
  outcome_construct: morning_testosterone_early_night_only_sleep
  exposure:
    type: chronic_restriction
    dose_h: 4.5
    referent_h: 7
    duration_days: 1
    contrast_label: 1 night 4.5 h sleep confined to the FIRST half of the night (22:30-03:30) vs 7 h (22:30-06:00), separate
      experiment n=8
  scale: pct_change
  unit: '% change in morning testosterone (direction only)'
  value: -1.0
  se: null
  ci: null
  conversion_formula: No point estimate reported; only 'markedly decreased ... P <= 0.05'. value=-1 encodes a signed but
    unquantified decrease.
  from_figure: false
  inferred_from_ci: false
  direction_note: Negative = lower morning testosterone. The effect appears only when the subject is AWAKE during the second
    half of the night. This is the mechanistic explanation for the Leproult-vs-Reynolds/Schmid discrepancy and it depends
    on WHERE the sleep sits, not only on how much there is.
  covariates: []
  followup_years: null
  cohort_family: null
  quote: However, total sleep deprivation and 4.5 h of sleep restricted to the first night-half markedly decreased morning
    T and PRL concentrations (both P <= 0.05). ... While sleep loss in the early part of the night does not affect T and
    PRL, early awakening and wakefulness during the second part of the night reduces morning circulating T and PRL concentrations.
