  quote: After normal sleep, plasma cortisol levels over the 1800-2300-hour period were similar on days 1 and 2. After partial
    and total sleep deprivation, plasma cortisol levels over the 1800-2300-hour period were higher on day 2 than on day
    1 (37 and 45% increases, p = 0.03 and 0.003, respectively), and the onset of the quiescent period of cortisol secretion
    was delayed by at least 1 hour.
