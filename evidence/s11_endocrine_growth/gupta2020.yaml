- outcome_domain: anthropometric
  outcome_construct: median_residual_height_gain_beyond_age_17_males_chronic_disease
  exposure:
    type: descriptive
    dose_h: null
    referent_h: null
    duration_days: null
    contrast_label: males older than chronological age 17 y with Crohn's disease, height at >=3 visits >=6 months apart
  scale: raw_units
  unit: cm of median height gained after chronological age 17 y
  value: 1.6
  se: null
  ci: null
  conversion_formula: Median reported directly (1.6 cm in males with CD, 1.3 cm in males with UC, P=0.0004 between them).
    No dispersion reported; se=null.
  from_figure: false
  inferred_from_ci: false
  direction_note: 'Positive = height still gained after age 17. EMPIRICAL CEILING: even in a growth-impaired population
    (chronic inflammatory bowel disease, in which delayed bone age is common and 80% still grew), the median total residual
    height after age 17 was only 1.3-1.6 cm. A healthy 16-19 year old has no more than this to lose, and probably less.'
  covariates: []
  followup_years: null
  cohort_family: ImproveCareNow
  quote: Of these patients, 80% manifested continued growth, more commonly in CD (81%) than UC (75%; P = 0.0002) and in
    females with CD (83%) than males with CD (79%; P = 0.012). Median height gain was greater in males with CD (1.6 cm)
    than in males with UC (1.3 cm; P = 0.0004), and in females with CD (1.8 cm) than in females with UC (1.5 cm; P = 0.025).
