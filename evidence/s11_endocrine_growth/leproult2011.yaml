  direction_note: 'Positive = MORE slow-wave sleep under restriction. Decisive mechanism: cutting TIB from 10 h to 5 h cost
    165 min of stage 2 and 63 min of REM but GAINED 9 min of stage 3+4. The GH-permissive stage is protected, which is why
