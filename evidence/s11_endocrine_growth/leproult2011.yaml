rob:
  tool: RoB2
  judgement: some_concerns
  notes: n=10 self-described convenience sample recruited by campus flyers; no randomisation of condition order (rested
    always first, so an order/adaptation effect is not excluded); comparator is 10 h TIB, which is longer than any realistic
    habitual sleep, so the true 8 h-referenced effect is smaller than reported
funding: NHLBI 5R01HL72694-5; NIDDK P60DK-020595; NIH MO1-RR-00055
notes: 'Authors'' own conversion: divide nmol/L by 0.0347 for ng/dL. Rested mean 18.4 nmol/L = 530.3 ng/dL; restricted mean
  16.5 nmol/L = 475.5 ng/dL. Against the harmonized reference distribution for healthy nonobese men 19-39 y (travison2017:
  2.5th 264, 5th 303, 50th 531, 95th 852 ng/dL) the RESTED mean sits at the 50th percentile (531) and the RESTRICTED mean
  at roughly the 34th percentile (z = -0.40), still 1.80x the 2.5th-percentile hypogonadal threshold of 264 ng/dL. Authors''
  framing: ''Daytime testosterone levels were decreased by 10% to 15% in this small convenience sample ... By comparison,
  normal aging is associated with a decrease of testosterone levels by 1% to 2% per year.'' No participant was reported
  to have entered the hypogonadal range.'
