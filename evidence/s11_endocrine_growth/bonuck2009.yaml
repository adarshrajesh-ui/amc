effects:
- outcome_domain: anthropometric
  outcome_construct: standardised_height_change_after_adenotonsillectomy
  exposure:
    type: other
    dose_h: null
    referent_h: null
    duration_days: null
    contrast_label: pre- vs post-adenotonsillectomy standardised height (z score/centile) in children with sleep-disordered
      breathing
  scale: smd
  unit: null
  value: 0.34
  se: 0.0689
  ci:
  - 0.2
  - 0.47
  conversion_formula: se = (0.47 - 0.20)/3.92 = 0.0689, from the reported 95% CI. If mapped onto the SD of adult male stature
    (7.30 cm) this would be 2.48 cm (95% CI 1.46-3.43 cm) - see direction_note for why that mapping does not transport.
  from_figure: false
  inferred_from_ci: true
  direction_note: 'Positive = height z score IMPROVED after surgical relief of sleep-disordered breathing. This is the strongest
    existing evidence that disturbed sleep can restrict growth, and it is the natural upper-bound anchor. THREE reasons
    it does not transport to the subject: (1) exposure is obstructive SDB with intermittent hypoxaemia and increased work
    of breathing, not voluntary curtailment of time in bed; (2) the children were far younger and had most of their growth
    ahead of them, whereas the subject had ~2% of his stature left; (3) the pooled studies are uncontrolled pre/post observational
    designs, so regression to the mean and normal growth are not separated from treatment effect.'
  covariates: []
  followup_years: null
  cohort_family: null
  quote: 'Meta-analysis findings for pre/post-surgery changes were: standardised height: 10 studies, 363 total children,
    pooled standardised mean differences (SMD) = 0.34 (95% CI 0.20 to 0.47); standardised weight: 11 studies, 390 total
    children, pooled SMD = 0.57 (95% CI 0.44 to 0.70); IGF-1: 7 studies, 177 total children, pooled SMD = 0.53 (95% CI 0.33
    to 0.73); IGFBP-3: 7 studies, 177 total children, pooled SMD = 0.59 (95% CI 0.34 to 0.83).'
