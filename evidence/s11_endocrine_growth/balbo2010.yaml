  scale: hours
  unit: hours of delay in the onset of the evening cortisol quiescent period
  value: 1.5
  se: null
  ci: null
  conversion_formula: Reported as 'nearly 1.5 hour'. No dispersion; se=null.
  from_figure: false
  inferred_from_ci: false
  direction_note: 'Positive = later shutdown of cortisol secretion (harm: extended glucocorticoid exposure).'
  covariates: []
  followup_years: null
  cohort_family: UChicago_VanCauter_sleepdebt
  quote: The state of sleep debt, as compared to the fully rested state, was associated with elevated cortisol concentrations
    in the afternoon and in the early evening and with a shorter quiescent period, due to a delay in its onset by nearly
    1.5 hour. In addition, the rate of decrease of free cortisol concentrations in saliva between 16.00 hours and 21.00
    hours was about six times slower in the sleep-debt than in the fully rested condition.
