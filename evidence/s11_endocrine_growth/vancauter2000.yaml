    period, the lifetime maximum, and it falls to 3.4% by midlife.'
  covariates: []
  followup_years: null
  cohort_family: VanCauter_pooled_1985_1999
  quote: The mean (SEM) percentage of deep slow wave sleep decreased from 18.9% (1.3%) during early adulthood (age 16-25
    years) to 3.4% (1.0%) during midlife (age 36-50 years) and was replaced by lighter sleep (stages 1 and 2) without significant
    increases in sleep fragmentation or decreases in rapid eye movement (REM) sleep.
- outcome_domain: endocrine
  outcome_construct: gh_secretion_decline_per_decade_early_adulthood_to_midlife
  exposure:
    type: descriptive
    dose_h: null
    referent_h: null
    duration_days: null
    contrast_label: per decade of age, early adulthood (16-25 y) to midlife (36-50 y)
  scale: per_hour_beta
  unit: microgram of 24-h GH secretion lost per decade of age
  value: -372.0
  se: null
  ci: null
  conversion_formula: null
  from_figure: false
  inferred_from_ci: false
  direction_note: 'Negative = GH secretion falls with age. NOT a sleep-restriction effect. This is the COMPARATOR MAGNITUDE:
    normal ageing removes 372 microgram of 24-h GH per decade, which dwarfs anything an 8-night restriction protocol produces.
    P<.001; no SE reported.'
  covariates:
  - age
  followup_years: null
  cohort_family: VanCauter_pooled_1985_1999
  quote: The decline in slow wave sleep from early adulthood to midlife was paralleled by a major decline in GH secretion
    (-372 microg per decade; P<.001). From midlife to late life, GH secretion further declined at a slower rate (-43 microg
    per decade; P<.02). Independently of age, the amount of GH secretion was significantly associated with slow wave sleep
    (P<.001).
