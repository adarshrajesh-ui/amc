rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: cross-sectional pooling of studies run 1985-1999 across 4 laboratories; healthy volunteers only; age gradients
    are between-subject, not longitudinal
funding: Non-US government / US PHS
notes: Frequently miscited as evidence that sleep loss destroys GH. It is an AGE-gradient study, not a sleep-restriction
  study. Its real value here is (a) the 16-25 y SWS baseline of 18.9% and (b) the magnitude of the ageing comparator.
