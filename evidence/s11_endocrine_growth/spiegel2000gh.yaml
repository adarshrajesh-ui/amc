notes: 'Full text is paywalled (OpenAlex oa_status=closed; publisher blocks scraping), so only the abstract was read directly.
  A review by the same literature (Magee CA et al., J Obesity 2010) characterises the direction of the 24-h change: ''The
  elevation in GH levels observed by Spiegel et al. [41] was the result of an extended period of nocturnal GH secretion.''
  i.e. GH went UP, via a lengthened secretory window, not down. Authors'' own summary: ''neither the GH profile nor the
  distribution of SWA conformed with predictions from acute sleep deprivation studies, indicating that adaptation mechanisms
  are operative during chronic partial sleep loss.'''
