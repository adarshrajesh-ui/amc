funding: null
notes: 'THE decisive study for the redistribution-vs-loss question. Sleep displacement blunts the sleep-onset GH pulse but
  24-h total GH is preserved by compensatory waking pulses. Authors generalise this explicitly to sleep deprivation: ''the
  blunting of the sleep-related GH pulse is counteracted, as in sleep-deprived persons, by a compensatory mechanism promoting
  GH pulses during wakefulness.'''
