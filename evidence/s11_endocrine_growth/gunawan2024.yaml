  followup_years: null
  cohort_family: Taiwan_Pubertal_Longitudinal_Study
  quote: 'In the human cohort, insufficient sleep increased the risk of early sexual maturation, particularly in girls (OR,
    1.44; 95% CI: 1.09 to 1.89; p-value < 0.01). Insufficient sleep also indirectly affected early sexual maturation in
    girls, with obesity serving as the mediator. ... The sleep-deprived juvenile rats in the sleep-deprived-female (SDF)
    and sleep-deprived-male (SDM) groups experienced delayed VO (mean VO days: 33 days in control; 35 days in SDF; p-value
    < 0.05) and PS (mean PS days: 42 days in control; 45 days in SDM; p-value < 0.05), respectively.'
rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: self-reported sleep by PSQI; effect significant in girls only; human and animal arms give opposite directions;
    pubertal onset is not an outcome that can be affected by an exposure beginning at age 16
funding: null
notes: The best available human evidence on sleep and pubertal timing. It concerns pubertal ONSET in pre-pubertal children
  and is mediated by adiposity. For a 16-year-old male who has already passed peak height velocity by ~2.5 years, pubertal
  timing is not a live outcome.
