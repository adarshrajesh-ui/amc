  direction_note: 'Positive = EARLIER puberty with insufficient sleep, mediated by obesity, and significant in GIRLS ONLY
    (no significant boy estimate was reported despite 459 boys in the cohort). The paired rat experiment found the OPPOSITE
    direction - delayed vaginal opening and preputial separation - so the literature does not even agree on sign. Irrelevant
    to the subject in any case: he was 16 and post-pubertal at exposure onset.'
  covariates:
