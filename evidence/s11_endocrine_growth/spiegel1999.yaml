  from_figure: false
  inferred_from_ci: false
  direction_note: 'Positive = the evening shutdown of cortisol is ~6x slower under sleep debt, and its onset delayed by
    ~1.5 h (harm: flatter diurnal slope). Read via balbo2010 because the Lancet full text was not retrieved.'
  covariates: []
  followup_years: null
  cohort_family: UChicago_VanCauter_sleepdebt
  quote: '[SECONDHAND, Balbo/Leproult/Van Cauter 2010, Int J Endocrinol 2010;2010:759234] The state of sleep debt, as compared
    to the fully rested state, was associated with elevated cortisol concentrations in the afternoon and in the early evening
    and with a shorter quiescent period, due to a delay in its onset by nearly 1.5 hour. In addition, the rate of decrease
    of free cortisol concentrations in saliva between 16.00 hours and 21.00 hours was about six times slower in the sleep-debt
    than in the fully rested condition.'
rob:
  tool: RoB2
  judgement: some_concerns
  notes: n=11; the comparator is 12 h TIB, which is not a plausible habitual sleep duration - this inflates the contrast.
    Balbo 2010 reports that when 9 of these 11 men were later studied at 8 h TIB, 'cortisol evening levels observed under
    8-hour bedtime condition were intermediate between those measured under 4-hour and 12-hour bedtime conditions', i.e.
    roughly half the headline effect corresponds to the 12 h arm being supranormal.
funding: Non-US government / US government
notes: The single most-cited sleep-endocrine result. Its 4h-vs-12h design means the widely quoted magnitudes overstate the
  5.5h-vs-8h contrast that applies to the subject.
shard: s11_endocrine_growth
