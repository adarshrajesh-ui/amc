  from_figure: false
  inferred_from_ci: false
  direction_note: Positive = within-subject CV of total GH secreted (32%) vs across-subject CV (65%). Total GH output varies
    10-fold between men; this is the measurement-noise floor against which any sleep-restriction GH effect must be judged.
  covariates: []
  followup_years: null
