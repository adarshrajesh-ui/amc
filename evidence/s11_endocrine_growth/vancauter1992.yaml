  value: 3.0
  se: null
  ci: null
  conversion_formula: null
  from_figure: false
  inferred_from_ci: false
  direction_note: Positive = GH secretory rate is 3x higher during sleep than during normal waking hours; crucially this
    holds even when sleep is DELAYED to 04:00, so the driver is sleep itself, not clock time. No dispersion reported.
  covariates: []
  followup_years: null
  cohort_family: null
  quote: During normal waking hours, the GH secretory rate was similar in the evening and the morning. This secretory rate
    was doubled during wakefulness at times of habitual sleep and tripled during sleep, even when sleep was delayed until
    0400 h.
