  scale: raw_units
  unit: BMI z-score units
  value: 0.18
  se: 0.0463
  ci:
  - 0.089
  - 0.271
  conversion_formula: value = 0.31 (eAT) - 0.13 (WWSC) = 0.18 BMI z units. Only 'P < .0001' is reported; using the boundary
    p=.0001 with large df, z=3.891, giving SE <= 0.18/3.891 = 0.0463 (an upper bound); ci = 0.18 +/- 1.96*SE.
  from_figure: false
  inferred_from_ci: true
  direction_note: 'Positive = MORE weight gain in the treated arm. Note the direction: relieving the sleep disorder increased
    adiposity, and 52% vs 21% of overweight children became obese. The randomised evidence for ''fixing sleep improves growth''
    delivers fat mass, not stature.'
  covariates:
  - baseline weight
  - AHI
  - race
  - gender
  - follow-up AHI
  followup_years: 0.58
  cohort_family: CHAT
  quote: Interval increases in the BMI z score (0.13 vs. 0.31) was observed in both the WWSC and eAT intervention arms,
    respectively, but were greater with eAT (P < .0001). ... A greater proportion of overweight children randomized to eAT
    compared with WWSC developed obesity over the 7-month interval (52% vs. 21%; P < .05). ... eAT for OSAS in children
    results in clinically significant greater than expected weight gain, even in children overweight at baseline.
rob:
  tool: RoB2
  judgement: low
  notes: properly randomised multicentre trial with objective polysomnography; the abstract reports BMI z score and does
    not report a separate stature z-score contrast, so a height effect cannot be extracted
funding: NIH
notes: The only RCT of a sleep intervention with anthropometric outcomes. It reports BMI z score, not stature; a randomised
  estimate of a height effect is therefore unavailable even in the paediatric SDB literature where the observational signal
  is strongest.
