  outcome_construct: bmi_z_score_change_over_7_months_early_adenotonsillectomy_vs_watchful_waiting
  exposure:
    type: other
    dose_h: null
    referent_h: null
    duration_days: 210
    contrast_label: early adenotonsillectomy vs watchful waiting with supportive care, 7-month interval, children with OSAS
