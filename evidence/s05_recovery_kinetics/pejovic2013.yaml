    conversion_formula: "Table 3, n=30. Reported means +/- SE: baseline 2.9 +/- 0.4, restriction 3.96 +/- 0.6, recovery 4.3 +/- 0.6; p = 0.08 (B vs SR), 0.69 (SR vs R), 0.04 (B vs R). SD = SE*sqrt(30): SD_B = 2.191, SD_R = 3.286. sd_av = sqrt((2.191^2+3.286^2)/2) = 2.793. d_av = (4.3-2.9)/2.793 = 0.501. J = 1 - 3/(4*29-1) = 0.9739. g = 0.488. SE from inverting the two-sided paired t at df=29 for p=0.04 -> t=2.150; SE = |g|/t = 0.227."
