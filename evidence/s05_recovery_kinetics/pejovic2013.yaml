rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Within-subject laboratory design with PSG, 24-h serial hourly blood sampling, MSLT and PVT - excellent measurement. But there is no parallel control arm, so the day-4/day-10/day-13 comparisons cannot be separated from time-on-study effects; for PVT this cuts against the finding's direction (practice would produce apparent improvement, and none was seen, so the non-recovery result is conservative). Subjects were dismissed from the laboratory on non-sampling days with compliance assessed by questionnaire and actigraphy rather than continuous supervision. The restriction was mild (6 h TIB x 6 nights), so the absolute debt was small. n=30, ages ~21-32 (mean 24.7), age range inferred from mean +/- ~2 SD and approximate. Three of 14 women were in the luteal phase at the recovery sampling."
funding: "NIH (R01 HL64415, R01 HL51931, C06 RR016499)"
notes: |
  The best single-study dissociation of recovery timelines, because everything was measured in the same
  subjects at the same three sessions after a deliberately weekend-like recovery (10 h/night):
    RECOVERED by 2 nights at 10 h TIB : 24-h IL-6, MSLT sleep latency, Stanford Sleepiness Scale
    NOT RECOVERED                     : PVT lapses (g = 0.49 vs baseline, p = 0.04), median RT, fastest 10% RT
    OVERSHOT                          : 24-h cortisol, which was significantly LOWER after recovery than at
                                        baseline, suggesting the 8 h baseline itself carried some debt
  The authors designed this explicitly as a weekend-catch-up model: "We chose a 5-day restriction period and a
  2-night recovery period to mimic the weeklong work schedule and rest period of a typical worker." Their own
  conclusion is the report's headline: "Extended recovery sleep over the weekend reverses the impact of one
  work week of mild sleep restriction on daytime sleepiness, fatigue, and IL-6 levels, reduces cortisol
  levels, but does not correct performance deficits."
  They also flag exactly the gap this shard cares about: "The long-term effects of a repeated sleep
  restriction/sleep recovery weekly cycle in humans remain unknown." (Simpson 2016 and Lo 2022 partially fill
  this; see those records.)
  Repayment ledger derived from PSG sleep efficiency: 6 nights at 6 h TIB built a 10.4 h debt; 2 nights at
  10 h TIB repaid 3.6 h (34.7%). Note the contrast with Belenky (2.1% at 8 h TIB) - the difference is entirely
  driven by the recovery TIB cap. Going from 8 h to 10 h TIB recovery raises the repayment rate by ~17x.
shard: "s05_recovery_kinetics"
