    inferred_from_ci: true
    direction_note: "positive g = MORE lapses than baseline, i.e. vigilance was still WORSE than baseline after two 10 h TIB recovery nights, and no better than during restriction (SR vs R p = 0.69). Note the paradox: the baseline-vs-restriction contrast was only p=0.08 while baseline-vs-recovery reached p=0.04 - performance did not merely fail to recover, it continued to drift."
