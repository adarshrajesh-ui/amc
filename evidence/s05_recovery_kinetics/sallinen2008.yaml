    conversion_formula: "Direction indicator. The abstract states that post-recovery values differed significantly from control (p < .001-.05) but gives no means, SDs, or test statistics per measure, and Chronobiology International 2008 is paywalled with no free PMC deposit (the PMC elink returns only citing articles). No effect size or SE is derivable, so se is null rather than invented. NOTE: the abstract as indexed contains two evident typographical inversions of the inequality sign - 'impaired by the sleep debt ( p > .001)' and 'improved performance and subjective sleepiness ... ( p > .01-.05)' - which in context must read p < .001 and p < .01-.05. I have not relied on either of those two statements for this record; the statement I do rely on is printed with the correct direction ('p < .001-.05')."
