rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Within-subject crossover with a proper normal-sleep control condition, continuous EEG/EOG for objective sleepiness, and task difficulty individually calibrated to each participant's ability - all methodological strengths. Concerns: (a) n = 16 and all male, so no sex generalization; (b) the sleep-debt manipulation was a SINGLE 2 h night, i.e. acute partial deprivation, NOT chronic restriction - this is the main limitation for transporting the finding to a 3-year exposure, and it cuts in a conservative direction (see notes); (c) ACCESS IS ABSTRACT-ONLY, so both effects are direction/duration indicators with se: null and no magnitudes; (d) the indexed abstract contains two inverted inequality signs (documented in the conversion_formula), which lowers my confidence in the abstract's transcription generally even though the sentence I rely on is printed correctly."
funding: "Not stated in the abstract; not retrievable without full text. The senior authorship is at the Finnish Institute of Occupational Health."
notes: |
  WHY THIS SMALL STUDY IS WORTH A RECORD: the age range is 19-22 years and the target subject is an
  18-year-old male entering his second year of college. This is one of only three records in the shard
  with adolescent_match exact_16_19 (the others being short2018 in 15-17 year olds and lo2022 plus
  bei2014 in 15-19 year olds), and it is the only one of those that tests a FULL-LENGTH single recovery
  night against a proper normal-sleep control in that age band.

  THE ARGUMENT IT MAKES, AND WHY THE ACUTE DESIGN STRENGTHENS RATHER THAN WEAKENS IT: the sleep debt
  here was tiny - ONE 2 h night, roughly 6 h of acute deficit, against the target subject's cumulative
  exposure of ~3 years. The recovery opportunity was a full, normal 8 h night. Even so, performance and
  both subjective and EEG-derived physiological sleepiness remained significantly below the control
  condition. If a single 8 h night cannot repay a single short night in a 19-22 year old, then the
  common assumption that a weekend repays a week is quantitatively hopeless. The acute design makes
  this a LOWER BOUND on the recovery problem, not an overstatement of it.

  MECHANISM, consistent with the rest of the shard: an 8 h recovery opportunity in a young adult yields
  only ~7.4-7.7 h of actual sleep (Belenky/Balkin measured 6.19-6.58 h at 8 h TIB in CMV drivers;
  Rupp 2009 measured 7.75 h at 8 h TIB under maximal sleep pressure), against a young-adult sleep need
  of ~8.4-8.9 h (Kitamura 2016; Klerman 2008). An 8 h night is therefore AT OR BELOW need and generates
  little or no surplus - so it cannot repay debt, only stop it growing. This is the same structural
  point as smith2021.yaml (weekend TIB equal to need repays 0%) arrived at from a different direction.

  THE REST-PAUSE FINDING IS A USEFUL NEGATIVE for the prescription: 10 minutes of break with light
  exercise improved performance and sleepiness for only about 15 minutes, and identically whether or not
  the person was sleep-deprived. Breaks do not touch the debt.
