    direction_note: "1 = RECOVERY WAS INCOMPLETE. All outcome measures - multitask performance, physiological sleepiness from continuous EEG/EOG, and subjective sleepiness - improved markedly after a full 8 h recovery night (p < .001) but still 'failed to reach the levels observed in the control condition' (p < .001-.05). One full night of normal-length sleep did not restore function even after only ONE short night of sleep debt."
