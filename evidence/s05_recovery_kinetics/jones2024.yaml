rob:
  tool: RoB2
  judgement: low
  notes: "Large pooled laboratory sample (N = 221; 205 SR, 16 control) with randomized allocation to recovery dose - the strongest available design for isolating recovery dose-response. Main limitations for this shard: (a) the control arm is small (n = 16) relative to the SR arm; (b) only a SINGLE recovery night was given, so the abstract's claim that mood was 'restored' speaks to one night only and cannot address multi-night or multi-week recovery; (c) abstract_only access, so no numeric dose coefficients could be extracted."
funding: "NIH / NASA (per journal record; not verified from full text)"
notes: |
  DE-DUPLICATION WARNING FOR THE POOLER: this analysis pools two multi-day laboratory studies with
  identical 9-day SR protocols run by the same University of Pennsylvania group, and the design
  (5 nights of 4 h TIB followed by randomization to a single recovery night of 0-12 h TIB) is the
  same protocol family as Banks 2010 (banks2010.yaml), which used doses 0/2/4/6/8/10 h. Jones 2024
  extends the dose ladder to 12 h and adds a 7th dose arm. cohort_family is set to
  UPenn_Dinges_SR_dose_response on BOTH records. These are almost certainly overlapping or
  partially overlapping participant samples and MUST NOT be treated as independent evidence.
  Banks 2010 is the record to use for numeric recovery dose-response (it has per-dose means and
  SDs); this record contributes the mood domain and the existence of a 12 h dose arm.

  WHY IT MATTERS ANYWAY: this is the only record I found that pushes the single-night recovery dose
  ladder up to 12 h TIB, and it demonstrates that mood recovery is monotonic in dose. Combined with
  Banks 2010, it establishes an important DISSOCIATION: after a single recovery night, mood is
  described as restored in a dose-response fashion, whereas PVT lapses and KSS in the same protocol
  family remained significantly worse than baseline even at the largest dose (Banks 2010: 10 h TIB,
  g = +0.43, p = 0.008 for lapses). Subjective and affective measures therefore recover FASTER than
  objective vigilance. This is the same dissociation independently reported by Ochab 2021 (KSS
  recovered, ERPs and power spectra did not) and Pejovic 2013 (IL-6 and MSLT recovered, PVT did not).
  PRESCRIPTION IMPLICATION: feeling better is not evidence of having recovered, and self-report
  cannot be used to decide when recovery is complete.

  ACCESS: abstract_only. Two effects are encoded as direction indicators with se: null because the
  abstract contains no extractable numbers for these constructs. I did not fabricate coefficients.
