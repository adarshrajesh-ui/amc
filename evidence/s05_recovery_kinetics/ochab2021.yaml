    from_figure: false
    inferred_from_ci: false
    direction_note: "This is an intermediate state: after 7 days the locomotor-activity structure was no longer statistically different from baseline (p=0.16) but was still statistically different from the restricted state (p=0.019), i.e. partway back. Not a harm estimate; se is null because the paper reports only p-values."
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "The new result is long recovery time: even one week of regular sleep does not stabilize the distributions (the difference between SR/RCV is significant, p = 0.019, but smaller, while for BASE/RCV it is still visible but below confidence threshold, p = 0.16)."
