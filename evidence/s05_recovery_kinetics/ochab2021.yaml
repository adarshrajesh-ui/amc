    value: 7.60
    se: null
    ci: null
    conversion_formula: "Reported: baseline 7 h 37 min +/- 50 min = 7.617 h; restriction 5 h 18 min +/- 31 min = 5.300 h (69.6% of baseline); recovery 7 h 36 min +/- 26 min = 7.600 h. SDs are over individual means; SE not computed because the n differs between the actigraphy (19) and EEG (13) samples."
