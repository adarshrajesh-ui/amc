rob:
  tool: RoB2
  judgement: moderate
  notes: "Conducted in natural (at-home) conditions with no randomization and no control arm, so time-on-study, learning and seasonal effects are not controlled - a particular concern for the Stroop task, where practice effects would bias TOWARD apparent recovery. Very small and heavily female sample (13 for EEG/behaviour: 12 women, 1 man; 19 for actigraphy). Compliance-driven day-level exclusions (32/273 days for EEG, 54/399 for actigraphy) were applied post hoc. Most reported statistics are p-values without effect sizes or SEs, so quantitative pooling is limited. Recovery consisted of habitual, not extended, sleep."
funding: "Polish National Science Centre (Symfonia grant 2016/20/W/NZ4/00354)"
notes: |
  The single most valuable feature of this study is the 7-day recovery window in a young-adult sample under
  naturalistic conditions - most of the literature stops at 1-3 nights. Recovery ordering observed:
    fully recovered  : mean Stroop reaction time; subjective sleepiness (KSS 3.25 vs 3.4 baseline)
    partially        : Stroop accuracy; actigraphic rest/activity duration distributions
    not at all       : event-related potentials (P300 amplitude/latency); resting-state EEG power spectra
  The dissociation between fully-recovered subjective sleepiness and unrecovered EEG is the most decision-
  relevant result for the report: a person will feel recovered well before their brain measures normalise.
  The authors also note that alpha power in both restriction AND recovery exceeded baseline in the eyes-open
  condition, i.e. some measures overshoot rather than simply returning.
  This paper's discussion is also where I found the two longer-recovery studies used in this shard
  (Bougard et al. 2018, 13-day recovery; Rabat et al. 2016, R13 follow-up).
  Note n: I record n=19 (the actigraphy sample, the largest analysed group); the EEG/behavioural analyses
  used n=13 with mean age 21.5 +/- 1.3 y. Age range [20, 23] is inferred from mean +/- ~1 SD and is
  approximate; the paper gives only the mean and SD.
shard: "s05_recovery_kinetics"
