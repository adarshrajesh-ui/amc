    direction_note: "negative = slightly LESS sleepy than baseline, i.e. subjective sleepiness fully normalised (indeed slightly overshot) while ERPs and resting-state power spectra had not returned at all. Self-reported sleepiness is therefore an unreliable readout of recovery - it says 'recovered' while the brain measures say otherwise."
    covariates: []
    followup_years: null
