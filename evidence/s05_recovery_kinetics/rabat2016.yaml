    value: 13
    se: null
    ci: null
    conversion_formula: "Reported significance levels at each timepoint (Table 3, Wilcoxon): alpha-amylase p < 0.01 at SR7 and R2, p < 0.05 at R13, all vs baseline B2. Omnibus test chi-square(12,3) = 13.89, p < 0.01. No means/SDs are reported in the retrieved text for this marker, so no standardised effect size is derivable and se is null."
    from_figure: false
    inferred_from_ci: false
    direction_note: "13 = still significantly DEPRESSED below baseline 13 days after restriction ended. This is the longest documented non-recovery of a physiological measure in a controlled human sleep-restriction protocol other than the 5-week transcriptomic study (cheng2026). Direction is a reduction in a sympatho-adrenal-medullary marker, which the authors link to impaired cognitive performance."
    covariates: []
    followup_years: null
    cohort_family: "IRBA_CSR_NCT01989741"
    quote: "Compared to baseline values (B2), concentrations of cortisol and alpha-amylase in saliva were significantly lower after seven nights of sleep restriction and stayed lower until almost two nights of sleep recovery for cortisol (D: p < 0.05 SR7 and R2; Table 3) and stayed lower after 13 sleep recovery nights compared to baseline values for alpha-amylase concentrations (W: p < 0.01 for SR7 and R2 and p < 0.05 for R13; Table 3)."
  - outcome_domain: endocrine
    outcome_construct: cortisol_recovery_day_within_same_subjects
    exposure: {type: recovery_sleep, dose_h: 8, referent_h: 8, duration_days: 13, contrast_label: "morning salivary cortisol: significantly below baseline at SR7 and R2, back to baseline by R13"}
