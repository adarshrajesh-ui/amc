    unit: "days of 8 h TIB recovery needed for morning cortisol to return to baseline (bounded by the sampling schedule)"
    value: 13
    se: null
    ci: null
    conversion_formula: "Reported: cortisol significantly lower than baseline at SR7 and R2 (p < 0.05) but no longer different at R13; omnibus F(3,33) = 3.62, p < 0.05. Saliva was sampled only at B2, SR7, R2 and R13, so cortisol's true recovery day lies in the interval (2, 13]; 13 is recorded as the upper bound."
    from_figure: false
    inferred_from_ci: false
    direction_note: "Cortisol recovered somewhere between recovery day 2 and day 13 while alpha-amylase had NOT recovered by day 13, in the same men from the same exposure. The within-study spread in recovery time constants across two stress-axis markers is therefore at least several-fold. Sampling is too coarse to pin cortisol's exact recovery day."
