    from_figure: false
    inferred_from_ci: false
    direction_note: "1 = domains differ. Sustained attention had the FASTER kinetic in both directions and showed a morning-specific vulnerability; executive processes were impaired and recovered uniformly across the day. Practical implication: a single morning attention test will read 'recovered' before executive function has."
    covariates: ["baseline performance", "MWT capacity to stay awake", "age"]
    followup_years: null
    cohort_family: "IRBA_CSR_NCT01989741"
    quote: "Cognitive processes were differently impaired and recovered with a more rapid kinetic for sustained attention process. Besides, a significant time of day effect was only evidenced for sustained attention failures that seemed to be related to subject's age and their morning capacity to stay awake."
  - outcome_domain: cognition
    outcome_construct: younger_age_predicts_greater_vulnerability
    exposure: {type: chronic_restriction, dose_h: 4, referent_h: 8, duration_days: 7, contrast_label: "correlation between subject age and sustained-attention failures at restriction day 7, within a 20-37 y male sample"}
    scale: probability
    unit: "direction indicator: 1 = younger subjects were more impaired"
    value: 1.0
    se: null
    ci: null
    conversion_formula: "Encoded as a direction indicator. The authors report significant age correlations with morning speed and lapses at SR7 and, weakly, at B2; the specific r values appear in Figure 5 and its caption rather than in transcribable text, so no coefficient is claimed here."
    from_figure: true
    inferred_from_ci: false
    direction_note: "1 = younger = worse. Directly relevant to transporting adult findings onto an 18-year-old: within this 20-37 y sample the YOUNGER men were more impaired by the same restriction, so adult-derived deficit estimates probably understate the effect in an adolescent. Consistent with Zitting 2018 (young > older vulnerability) and with the age moderation in Rupp 2009."
    covariates: []
    followup_years: null
    cohort_family: "IRBA_CSR_NCT01989741"
    quote: "Indeed, significant correlations between age of subjects and their sustained attention failures at SR7 (both for morning speed and lapses) and to a lesser extent at baseline (B2) let us think that under such sleep-restricted situations, brain of healthy and young subjects will not be affected in the same manner with a greater deleterious effect for younger men compared to older ones."
rob:
  tool: RoB2
  judgement: moderate
  notes: "n=12, all male, single-group within-subject design with no control arm, so time-on-study and practice effects are uncontrolled (for the cognitive tasks this would bias toward apparent recovery). Saliva sampled at only 4 timepoints (B2, SR7, R2, R13) and blood at 4 (B1, SR6, R1, R12), so recovery days cannot be resolved finely. Critically, between recovery day 3 and day 12 subjects went HOME with only actigraphy and a sleep diary, so the 8-day gap before the R12/R13 sessions was not controlled - the alpha-amylase non-recovery could in principle reflect that uncontrolled period rather than residual restriction effects. Mean age 29.3 y (range 20-37), so only fair transportability. Same cohort as Bougard 2018 (NCT01989741); cohort_family recorded to prevent double counting."
funding: "French Direction Generale de l'Armement (DGA) / Institut de Recherche Biomedicale des Armees (IRBA). Registered as ClinicalTrials NCT01989741."
notes: |
  Protocol: 12 men, 14 days in-residence - 2 baseline days (B1, B2; 8 h TIB), 7 restriction days (SR1-SR7;
  4 h TIB, 02:00-06:00), 3 recovery days (R1-R3; 8 h TIB, 23:00-07:00), then 8 days at home with actigraphy,
  then a return for 2 more days (R12-R13; 8 h TIB).
  This is the study that supplies the shard's longest documented non-recovered physiological measure short of
  cheng2026: morning salivary alpha-amylase was still significantly below baseline at R13 (p < 0.05), i.e.
  ~13 days after restriction ended, while cortisol in the same samples had normalised and testosterone had
  normalised by R1. A >13-fold spread in recovery time constants across three markers from one exposure.
  The age finding is one of the few pieces of direct within-study evidence in this shard that YOUNGER people
  are hit harder by the same restriction, which matters for transporting these adult numbers onto an
  18-year-old. The authors attribute it to continuing frontal maturation until 25-30 years of age.
  Companion paper on the same cohort: Bougard et al. 2018 (DOI 10.1016/j.concog.2018.03.008, PMID 29631192),
  extracted separately as bougard2018 with cohort_family recorded.
shard: "s05_recovery_kinetics"
