    cohort_family: "IRBA_CSR_NCT01989741"
    quote: "Finally we showed: (i) a significant decrease of morning cortisol concentrations in saliva at SR7 and at R2 (after 2 sleep-recovery nights) with a return to baseline values at the end (R13); and (ii) a significant decrease of morning salivary alpha-amylase (sAA) concentrations at SR7, at R2 and also at R13."
