    direction_note: "7 = seven full recovery days at 8 h TIB, and lapses had still not returned to baseline while sleepiness and median reaction time HAD. Confirms the Yamazaki/Banks/Belenky pattern (vigilance lapses are the last thing to recover) with the longest recovery window of any 8 h TIB study."
