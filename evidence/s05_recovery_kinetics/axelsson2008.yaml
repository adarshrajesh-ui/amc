    followup_years: null
    cohort_family: null
    quote: "The individual differences were larger for performance measures than for sleepiness; the between-subject standard deviation for the random intercept was in the magnitude of the effects of 1.1 days of restricted sleep for sleepiness, 6.6 days of restricted sleep for median reaction time, and 3.2 days for lapses."
rob:
  tool: RoB2
  judgement: moderate
  notes: "Very small (n=9, all male), no control arm, semi-laboratory conditions with participants going outdoors twice daily so light and activity exposure were not controlled, and only three test sessions per day. Mixed-effect modelling is appropriate for the design. Downgraded further because I could only obtain the abstract (Chronobiology International, paywalled; no PMC deposit found), so all values are from the abstract and I cannot verify the recovery-day trajectories or check whether practice effects were modelled. The published abstract contains an apparent unit typo ('lapses/test of 0.69 +/- .16 ms')."
funding: "Not verifiable from the abstract."
notes: |
  Valuable specifically because the recovery window is 7 days at 8 h TIB - long enough to show the ordering:
    recovered by day 7 : subjective sleepiness (KSS), median reaction time
    NOT recovered      : PVT lapses
  Combined with Ochab 2021 (7 days, only mean RT recovered), Bougard 2018 (13 days), Rabat 2016 (13 days) and
  Yamazaki 2021 (4 x 12 h TIB), the consistent picture is that lapse-type vigilance failures are the slowest
  measure to recover and are still detectable at 7+ days.
  The individual-variability result is one of the most practically important numbers in this whole shard: one
  between-person SD in median RT equals 6.6 days of restriction. Population-mean recovery timelines will be
  badly wrong for any specific individual, which is an argument for the recovery prescription to include
  self-measurement rather than a fixed number of days.
  ACCESS LIMITATION LOGGED: abstract only.
