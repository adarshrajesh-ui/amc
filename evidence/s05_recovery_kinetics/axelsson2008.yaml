    unit: "days of restriction equivalent to 1 between-subject SD"
    value: 6.6
    se: null
    ci: null
    conversion_formula: "Reported directly: the between-subject SD of the random intercept was equivalent to 1.1 days of restriction for sleepiness, 6.6 days for median reaction time, and 3.2 days for lapses."
    from_figure: false
    inferred_from_ci: false
    direction_note: "Larger = individual differences dominate. For median RT, one between-person SD equals 6.6 days of sleep restriction - i.e. WHO you are matters more than how restricted you are. Any individual recovery prescription therefore needs individual measurement, not a population timeline."
