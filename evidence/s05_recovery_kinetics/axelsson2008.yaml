    direction_note: "positive = sleepier. 0.64 KSS points/day means 5 days of 4 h TIB moves a person ~3.2 points up a 9-point scale, e.g. from 'alert' to 'sleepy'. But this measure fully recovered within 7 days while lapses did not."
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "The mixed-effect regression models showed that each day of restricted sleep resulted in an increase of sleepiness by 0.64+/- .05 KSS units (a nine-step scale, p < .001)"
