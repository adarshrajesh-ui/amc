    ci: [0.376, 1.004]
    conversion_formula: "Reported mixed-effect regression slope +/- SE directly (p < .001). CI = 0.69 +/- 1.96*0.16. Note the abstract's units for this coefficient are printed as 'ms' in the published abstract, which is evidently a typographical error - the quantity is lapses/test/day."
    from_figure: false
    inferred_from_ci: false
    direction_note: "positive = more lapses accumulate with each additional restricted day. The DEBT ACCUMULATES LINEARLY at ~0.69 lapses/test/day; combined with the non-recovery of lapses after 7 days, restriction is fast to accumulate and slow to clear."
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "The mixed-effect regression models showed that each day of restricted sleep resulted in an increase of sleepiness by 0.64+/- .05 KSS units (a nine-step scale, p < .001), increase of median reaction times of 6.6+/- 1.6 ms ( p = .003), and increase of lapses/test of 0.69 +/- .16 ms ( p < .001)."
