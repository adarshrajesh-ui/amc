    from_figure: false
    inferred_from_ci: false
    direction_note: "1 = ad-lib recovery in adolescents is accompanied by a PROGRESSIVE CIRCADIAN DELAY, not merely by longer sleep. This is the practical failure mode of an unstructured 'just sleep as much as you want' prescription: time in bed did NOT increase significantly across the vacation ('changes in time-in-bed were non-significant'), sleep onset latency INCREASED linearly (peaking mid-week-2), sleep efficiency FELL, and wake after sleep onset ROSE - while bed and rise times slid ever later. The adolescent ends the recovery period phase-delayed and facing a worse re-entry to school, which is exactly the mechanism that regenerates the debt each term."
    covariates: ["chronotype", "age", "sex"]
