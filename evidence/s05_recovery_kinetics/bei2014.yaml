    quote: "Subsequently, bedtime and rise-time showed further linear delays throughout the vacation, while changes in time-in-bed were non-significant. Sleep onset latency increased linearly, peaking in the middle of the second vacation week. ... Older age and eveningness were associated with later bedtime and rise-time"
rob:
  tool: Newcastle-Ottawa
  judgement: some_concerns
  notes: "Strong naturalistic design for this shard's purposes: n = 146 community adolescents wearing actigraphs CONTINUOUSLY for 4 weeks spanning school term, a 2-week vacation and return to term, analysed with latent growth curve modelling, plus self-report and chronotype. It is observational (T4) rather than experimental, so the vacation 'extension' is not a controlled dose and is confounded with the removal of morning wake-time constraint, seasonal factors and altered daytime activity. Actigraphy over-estimates sleep relative to PSG. No performance or physiological outcomes were measured, so this record speaks only to the SLEEP trajectory, not to functional recovery. ACCESS IS ABSTRACT-ONLY: J Sleep Res 2014 is paywalled and has no free PMC deposit, so both effects are encoded from the abstract's qualitative trajectory description with se: null and no numeric TST values available."
funding: "Not stated in the abstract; not retrievable without full text."
notes: |
  WHY THIS RECORD EARNS ITS PLACE DESPITE ABSTRACT-ONLY ACCESS: it is the only study in the shard that
  observes ad-lib recovery sleep, objectively and for two full weeks, in EXACTLY the target
  demographic - 146 community adolescents aged 16.2 +/- 1.0 y, 47.3% male - under exactly the target
  subject's real-world pattern of school-term restriction relieved by an unstructured break. Every
  other multi-day recovery observation in this shard is either laboratory-based or in adults or both.
  adolescent_match is exact_16_19.

  THE TIME-CONSTANT CONTRIBUTION. Sleep duration rose abruptly when school restriction lifted, then
  decayed linearly across vacation week 1 and stabilized during week 2. That places free-living
  adolescent sleep stabilization at 7-14 days, slightly slower than the laboratory estimates it
  otherwise agrees with:
    Kitamura 2016  12 h TIB, lab, young men       ~4 days to asymptote
    Klerman 2008   16 h/24 h, lab, 18-32 y        ~5 days to asymptote
    Bei 2014       ad-lib, free-living, 16.2 y    7-14 days to stabilize   (this record)
  The convergence of three independent designs on "about one week, not one or two nights" is the most
  robust quantitative claim available for the recovery time constant of sleep duration itself.

  THE UNCOMFORTABLE FINDING, and the reason this record changes the prescription rather than merely
  supporting it: an unstructured break did NOT increase time in bed significantly. What changed was
  TIMING - bedtime and rise-time delayed progressively and linearly for the whole fortnight - together
  with DETERIORATING sleep quality: sleep onset latency rose linearly, sleep efficiency fell, and wake
  after sleep onset rose across week 1. So left to their own devices, adolescents given unlimited
  opportunity converted it into later sleep rather than more sleep, and finished the period
  phase-delayed with worse sleep continuity. A recovery prescription for a 19-year-old that says only
  "sleep more over the break" will predictably reproduce this pattern. Wake time, not bedtime, is the
  variable that has to be anchored.

  CAUTION ON THE DECLINING-TST INTERPRETATION: the linear fall in TST across vacation week 1 is
  consistent with debt discharge (as in Kitamura and Klerman), but in this uncontrolled setting it is
  equally consistent with the progressive circadian delay simply truncating sleep. The abstract does
  not let me separate these. Both mechanisms argue against unstructured catch-up, so the prescription
  implication is robust to the ambiguity even though the mechanism is not identified.
shard: "s05_recovery_kinetics"
