    quote: "The removal of school-related sleep restriction was associated with an abrupt delay in sleep timing and increase in sleep duration. Subsequently, bedtime and rise-time showed further linear delays throughout the vacation, while changes in time-in-bed were non-significant. Sleep onset latency increased linearly, peaking in the middle of the second vacation week. Across the first vacation week, total sleep time and sleep efficiency linearly decreased, while % wake after sleep onset increased. These changes stabilized during the second vacation week."
