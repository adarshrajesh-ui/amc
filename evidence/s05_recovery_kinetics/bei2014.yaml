    conversion_formula: "Read from the abstract's described trajectory, not from a fitted parameter: TST rose abruptly on removal of school restriction, then 'Across the first vacation week, total sleep time and sleep efficiency linearly decreased' and 'These changes stabilized during the second vacation week.' Stabilization is therefore located at the boundary of vacation weeks 1 and 2, i.e. between day 7 and day 14; I record the lower edge (7 days) as the point estimate and [7, 14] as the bracket. This interval is READ FROM THE DESCRIBED TRAJECTORY, not computed, hence inferred_from_ci: true. The abstract reports no numeric TST values, so no SE exists. NOTE the scale enum has no 'days' option; 'years' is the generic numeric-duration scale and the unit field states days."
    from_figure: false
    inferred_from_ci: true
    direction_note: "LARGER = slower stabilization of ad-lib sleep. In free-living 16-year-olds, sleep duration took 1-2 weeks of unrestricted opportunity to settle, versus ~4 days in the laboratory (Kitamura 2016, 12 h TIB) and ~5 days (Klerman 2008, 16 h/24 h). Real-world stabilization is SLOWER than laboratory stabilization, because the adolescent's circadian phase drifts later at the same time as the debt discharges - the two processes fight each other."
