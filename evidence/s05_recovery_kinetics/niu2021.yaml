rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Pre-registered meta-analysis and systematic review with a large screening yield (2254 records assessed, 17 included) and explicit inclusion criteria (>=5 consecutive days of at-home extension, pre/post sleep-duration measurement, ages 13-30). Downgraded because only the abstract was retrievable: I cannot see the pooled effect sizes, the heterogeneity statistics, the risk-of-bias assessment of included studies, or whether dissertations (explicitly included in screening) were weighted differently from peer-reviewed studies. Because no pooled magnitude is available, this record contributes direction and feasibility only, not a quantitative effect for pooling."
funding: "Not verifiable from the abstract."
notes: |
  This is the only meta-analysis in the shard and it is on the most decision-relevant population (13-30 y,
  overlapping the target subject's age exactly), which is why it is included despite yielding no extractable
  magnitude. Its contribution is a feasibility guarantee: at-home sleep extension in adolescents and young
  adults reliably increases sleep duration and sleep quality and reduces daytime sleepiness.
  Per the extraction instructions' preference ordering (dose-response meta-analyses > systematic reviews >
  primaries), this should sit above the individual extension trials - but because the abstract reports no
  pooled estimate, the quantitative work in this shard has to be done by the primaries
  (alkhatib2018, leproult2015, tasali2022 for achievable yield; kitamura2016, short2018 for the target).
  EVIDENCE GAP THIS EXPOSES: 17 studies of at-home sleep extension in 13-30 year olds exist, yet none of the
  studies I could identify tracked COGNITIVE recovery trajectories over weeks of at-home extension in
  chronically restricted adolescents. The extension literature measures feasibility, sleep quality, sleepiness
  and diet; the recovery-kinetics literature measures cognition but only in short laboratory protocols. Nobody
  has run the study that the recovery prescription actually needs.
  ACCESS LIMITATION LOGGED: abstract only (Sleep Medicine Reviews, paywalled).
shard: "s05_recovery_kinetics"
