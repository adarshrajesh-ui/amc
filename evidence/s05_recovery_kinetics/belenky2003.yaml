rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomized to TIB group but no blinding possible; commercial motor vehicle drivers aged 24-62, so poor age transportability to an 18-year-old; recovery phase capped at 8 h TIB by design, which structurally prevents rebound sleep and therefore cannot distinguish 'brain adaptation' from 'insufficient recovery dose'. Group ns are small (16-18). Recovery-phase PVT means are presented only in figures in both the JSR paper and the report, so only the direction (incomplete recovery) and not the exact PVT deltas could be quoted."
funding: "US Department of Transportation / Federal Motor Carrier Safety Administration; Walter Reed Army Institute of Research"
notes: |
  This is the anchor study for the report's incomplete-recovery claim, and its design is the reason the
  claim is so strong: recovery TIB was fixed at 8 h, which is at or below the sleep need of the sample.
  Full repayment ledger computed from Table 2-4 (recuperative sleep = stage 2 + SWS + REM, excludes stage 1),
  all values mean (SE) in minutes:
    group  baseline  exp-phase mean  debt(h)  R1     R2     R3     extra(h)  %repaid  peak(h)  peak/8h TIB
    3 h    372.00    161.38          24.57    394.92 380.83 371.15  +0.51     2.10     6.58     82.3%
    5 h    369.23    257.29          13.06    380.30 380.16 347.27  +0.00     0.01     6.34     79.2%
    7 h    375.17    340.97           3.99    375.73 373.72 354.03  -0.37    -9.20     6.26     78.3%
    9 h    385.24    400.28          -1.75    374.53 377.34 378.43  -0.42     n/a      6.31     78.8%
  Interpretation: the 9-h group, given 1 extra hour of TIB above their own 8-h baseline, gained only
  +0.25 h/night of recuperative sleep (400.28 vs 385.24 min) - a marginal yield of 0.25 h TST per h TIB
  once already near-satiated. The 7-h group actually slept LESS during recovery than at baseline.
  Van Dongen's re-analysis of this same dataset (quoted in Lo et al. 2022, PMID 35089345) confirms:
  "during the recovery sleep period, ToT effects diminished, but did not return to baseline levels after
  three nights of 9-h TIB, even for individuals with the mildest dose of sleep restriction to 7 h per night."
  Note that Lo et al. describe the recovery nights as 9-h TIB; the primary report and JSR paper both state
  8 h TIB, and I use 8 h.
  DISCREPANCY LOGGED: the DOT report narrative in places refers to a 4-day recovery period, but the data
  tables and the JSR 2003 paper both contain 3 recovery nights. I use 3.
