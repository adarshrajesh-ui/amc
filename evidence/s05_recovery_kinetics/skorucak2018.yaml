rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomized crossover with both a restriction (6 h TIB) and an extension (10 h TIB) arm in the same 35 participants plus a subsequent total-sleep-deprivation challenge - a strong design for the adaptation question specifically. Downgraded because I could obtain only the abstract, so I cannot check the model-fitting assumptions behind the 'no deviation from two-process predictions' conclusion, and cannot extract SEs. Critically, this is a NULL result being used as evidence for preserved homeostasis, and a null in n=35 does not exclude a modest degree of adaptation. Ages and sex distribution are not stated in the abstract, so those fields are null."
funding: "Not verifiable from the abstract. The Surrey chronic sleep restriction/extension protocol was BBSRC-funded in related publications, but I did not verify this."
notes: |
  Directly addresses shard requirement 7 ("evidence on whether sleep need itself changes after chronic
  restriction"). The answer, from the best available human design, is NO: over a week of 6 h TIB the
  homeostatic slow-wave response neither blunted nor deviated from the two-process model, and the response to a
  subsequent total-sleep-deprivation challenge did not differ between the previously-restricted and
  previously-extended conditions.
  Why this matters for the report: it rules out the most comforting possible interpretation of Belenky's
  "the brain adapts to chronic sleep restriction" language. Belenky's group inferred adaptation from stabilised
  (but reduced) performance. Skorucak et al. show the underlying sleep-regulatory process is NOT adapting - so
  the performance plateau is a degraded steady state being held at a reduced level, not a new equilibrium in
  which less sleep suffices. Kitamura's asymptote result points the same way: given unrestricted opportunity,
  habitual short sleepers revert to ~8.4 h, i.e. their need never fell to match their habit.
  Caveat to state plainly: this is a null finding on a 7-day exposure in adults. It does not exclude adaptation
  over 3 years of restriction beginning in adolescence, which no study has tested.
  ACCESS LIMITATION LOGGED: abstract only.
shard: "s05_recovery_kinetics"
