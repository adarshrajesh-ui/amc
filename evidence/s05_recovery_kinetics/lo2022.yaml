    direction_note: "p < 0.04 means the vigilance deficit was STILL statistically present after a simulated weekend of 2 x 9 h TIB. Two full weekend nights at 9 h TIB did not restore time-on-task vigilance in adolescents. Not a harm magnitude; se null."
