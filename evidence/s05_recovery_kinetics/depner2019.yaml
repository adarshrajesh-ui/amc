    outcome_construct: weekend_catchup_debt_repayment_fraction
    exposure: {type: weekend_catchup, dose_h: null, referent_h: 8.0, duration_days: 3, contrast_label: "3 nights (Fri-Sun) of ad libitum weekend recovery sleep (>=10 h TIB enforced, naps allowed) after a 5-night workweek of 5 h sleep opportunity"}
    scale: pct_change
    unit: "% of workweek sleep debt repaid by the weekend"
    value: 9.2
    se: null
    ci: null
    conversion_formula: "Reported: WR participants slept ~1.1 h more than their baseline-derived total sleep need cumulatively across nights 8-10, against '>12 h of sleep lost during the workweek'. 1.1/12 = 9.2%; because the denominator is a lower bound ('more than 12 h'), 9.2% is an UPPER bound on the fraction repaid."
    from_figure: false
    inferred_from_ci: false
    direction_note: "positive = debt repaid. <=9.2% of a single workweek's debt was repaid by a full ad-lib weekend. This is the direct quantitative answer to 'is weekend catch-up sufficient': no, by roughly an order of magnitude."
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "Thus, cumulatively across study nights 8-10 with ad libitum weekend recovery sleep, WR participants only slept a total of ~1.1h more than their estimated total sleep need as estimated from each participant's baseline sleep duration. Therefore, the weekend of ad libitum recovery sleep did not repay on an hour-by-hour basis the more than 12h of sleep lost during the workweek."
