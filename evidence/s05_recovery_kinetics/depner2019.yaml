    from_figure: false
    inferred_from_ci: false
    direction_note: "EMPIRICAL CEILING under true ad-lib conditions with naps permitted: ~10.2-10.3 h. Even with >12 h in bed and >12 h of debt, healthy young adults did not sleep 14-16 h. Converges with Kitamura (~10.4 h) and Banks (8.96 h at 10 h TIB)."
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "Moreover, in the WR group sleep duration for men was increased (all P < 0.01) on study days 8 (9.8 +/- 0.4h) and 9 (10.2 +/- 0.6h) versus baseline (8.1 +/- 0.1h) (Figure S6C), whereas sleep duration for women was increased (P <0.05) on study day 8 (10.3 +/- 0.6h) but not study day 9 (7.9 +/- 0.6h; P = 0.91), versus baseline (8.0 +/- 0.1h) (Figure S6D)."
