rob:
  tool: RoB2
  judgement: low
  notes: "Randomized three-group in-laboratory design (modified Latin square, sex-balanced), gold-standard outcomes (PSG, hyperinsulinemic-euglycemic clamp with isotope tracers, doubly-controlled diet at baseline). Main limitations: small groups (CON n=8, SR n=14, WR n=14), only ONE recovery weekend was studied so the design cannot test whether repeated weekends accumulate benefit or harm, insulin sensitivity was measured at a single post-intervention timepoint (day 12) rather than serially, the sex analyses are explicitly labelled exploratory and underpowered, and the study cannot separate the effect of recovery sleep per se from the circadian delay it induced. Ages 18-40 (mean 25.5), so reasonable but not exact transportability to an 18-year-old."
funding: "NIH (R01 HL109706, R21 DK092624, T32 HL149646 and related), Colorado CTSA UL1 TR001082"
notes: |
  The definitive quantitative answer on weekend catch-up, and the answer is unambiguous:
    - Nights 8-9 (Fri, Sat) alone: +3.0 h cumulative extra sleep vs baseline.
    - Add night 10 (Sun), when subjects self-selected bedtime knowing Monday waketime was 2 h early:
      TST fell BELOW baseline, so the net across the whole weekend was only +1.1 h.
    - Denominator: >12 h lost across the 5-night workweek. Net repayment <= ~9%.
  The Sunday-night collapse is the mechanism that makes weekend catch-up self-defeating: the anticipation of
  an early Monday truncates the last recovery night, and the two late weekend nights delay circadian phase
  (dim-light melatonin onset delayed ~1.2 h by day 5 and ~1.7 h by day 11) so that Monday sleep is worse too.
  Independent EEG confirmation that recovery was incomplete: "Higher cumulative SWA in the WR group on study
  day 9 indicates homeostatic sleep drive was still elevated and therefore WR participants were not fully
  recovered." So both the TST ledger and the homeostatic marker agree.
  Authors' own bottom line on how much a weekend can ever repay: "Given the limited amount of total sleep
  recovered during the ad libitum weekend recovery sleep opportunity provided, it is unclear how much
  insufficient sleep during the workweek can be recovered in a typical weekend."
  Highly relevant to the target subject, whose exposure pattern (weekday 5-6 h, weekend 7-8 h with occasional
  10-11 h nights) is a milder real-world version of exactly this protocol. Note the target subject's weekend
  catch-up is SMALLER than the one tested here (which had >=10 h TIB enforced and naps permitted) and still
  failed.
  Companion analysis of energy balance in the same cohort: Depner et al. Sleep 2021 (DOI
  10.1093/sleep/zsab136, PMID 34059916, verified). Not extracted separately - same cohort_family, would
  double-count.
