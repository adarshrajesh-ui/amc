rob:
  tool: RoB2
  judgement: some_concerns
  notes: "No randomization or control group - within-subject accumulation slope only, so drift/practice effects cannot be fully excluded (though practice would bias toward IMPROVEMENT, making the observed decline conservative). n = 15 high-performing, highly selected individuals (astronaut-analog) confined 4-to-a-habitat, which likely UNDERSTATES effects in an ordinary population. Protocol was breached: 'occasional daytime napping in breach of study protocol' and caffeine access before 14:00, both of which attenuate measured deficits. Testing occurred in the evening near the circadian alerting peak, again attenuating measured deficits. Midlife cohort (38.5 +/- 8.2 y) - poor transportability to an 18-year-old, and Zitting 2018 indicates young adults are MORE vulnerable, so the true adolescent effect is plausibly larger."
funding: "NASA / National Space Biomedical Research Institute (per journal record; not verified from full text)"
notes: |
  WHY THIS RECORD MATTERS: this is the longest laboratory-controlled chronic restriction protocol
  with a REPEATING weekend-recovery structure (6 weeks), and it is the closest available analogue to
  the target subject's actual 3-year exposure pattern (weekday short sleep, weekend catch-up). Most
  restriction studies run 5-14 days with a single recovery block; this one repeats the weekly cycle
  six times.

  HEADLINE: deficits in vigilant attention and spatial orientation grew monotonically with cumulative
  sleep debt across all six weeks and were explicitly "not restored by two nights of weekend recovery
  sleep." There is no evidence of adaptation or plateau.

  MECHANISTIC ARITHMETIC (my calculation, recorded for transparency): with 5 h weekday TIB and 8 h
  weekend TIB, the weekend cannot repay debt at all if nightly need is ~8 h, because the weekend
  opportunity merely EQUALS need. Weekday deficit 5 x 3 h = 15 h/week; weekend surplus 2 x 0 h = 0 h.
  Mean TIB across the week is 5.857 h/night. Cumulative shortfall over 6 weeks vs an 8 h need is
  90 h. This is a purely structural point and it generalizes: the target subject's reported pattern
  (weekday 5-6 h, weekend 7-8 h) has the same defect - the weekend opportunity is at or below need,
  so it cannot generate the surplus that debt repayment requires. Repayment requires TIB ABOVE need,
  not TIB AT need.

  DOMAIN SPECIFICITY: 8 of 10 cognitive domains were unaffected - "Sensorimotor speed, spatial
  learning and memory, working memory, abstraction and mental flexibility, emotion identification,
  abstract reasoning, cognitive throughput, and risk decision making were not significantly affected
  by sleep debt." Vigilant attention is by far the most sensitive (beta = -0.688, ~5.7x the pooled
  effect), consistent with the PVT-selectivity seen in Banks 2010, Belenky 2003, Ochab 2021 and
  Yamazaki 2021. So the recovery prescription should be monitored on vigilance, not on general
  cognition, which will look deceptively normal.

  ACCESS: abstract_only. All quoted numbers are verbatim from the PubMed abstract; I did not obtain
  the full text, so per-week trajectory values and actigraphic TST are not available and no
  repayment-fraction estimate from measured TST is possible (only the TIB-based structural ceiling
  above, which is flagged as arithmetic rather than measured).

  DEMOGRAPHICS: reported as "15 high-performing individuals (38.5 +/- 8.2 years, 6 women)". age_range
  is set to null because the abstract gives a mean +/- SD, not a range; 6/15 women = 40.0% female.
