rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Well-designed within-subject laboratory dose-response with three TIB doses and 10-h TIB baseline and recovery nights, in exactly the target age band. Downgraded because I could only obtain the abstract (paywalled, no PMC deposit, no open-access copy found via Europe PMC), so I cannot verify the modelling assumptions behind the 9.35 h figure, cannot extract SEs or CIs, and cannot check the recovery-night data. n=34 split across three dose groups means ~11 per group."
funding: "Not verifiable from the abstract."
notes: |
  Included because it is the ONLY exact-age-match (15-17 y) estimate of sleep need in this shard, and it
  reframes the entire recovery prescription. Two convergent estimates: ~9 h from ad-lib sleep at 10 h TIB, and
  9.35 h from inverting the PVT lapse dose-response.
  Consequence for the target subject (weekday 5-6 h from age 16 to 19): the per-night shortfall is
  9.35 - 5.5 = ~3.85 h/night, roughly 4x the ~1 h/night shortfall that took Kitamura's young adults 4 days of
  12 h TIB to clear. This is the single most important reason not to transport adult recovery timelines
  directly onto this subject.
  ACCESS LIMITATION LOGGED: paywalled. Both numbers quoted above are verbatim from the PubMed abstract, which
  I retrieved via efetch. No number in this record comes from anywhere else.
  I attempted PMC and Europe PMC retrieval; Europe PMC returns pmcid None and isOpenAccess N for
  DOI 10.1093/sleep/zsy011.
