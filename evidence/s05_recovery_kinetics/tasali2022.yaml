rob:
  tool: RoB2
  judgement: low
  notes: "Randomized clinical trial with intention-to-treat analysis, actigraphic sleep monitoring, and an objectively measured primary outcome (energy intake reconstructed from doubly labelled water total energy expenditure plus DXA/home-weight-derived change in body energy stores) - methodologically the strongest free-living sleep-extension trial available. Limitations: only 2 weeks of intervention, participants selected for overweight BMI 25.0-29.9 and habitual sleep <6.5 h so the population is specifically metabolically-at-risk short sleepers, ages 21-40 (mean 29.8) so not adolescents, and no cognitive outcomes at all. Abstract only, so I cannot check the ITT handling or per-protocol sensitivity analyses."
funding: "Not verifiable from the abstract. Registered at ClinicalTrials.gov as NCT02253368."
notes: |
  The best-quality free-living sleep-extension evidence in the shard, and the most useful single data point on
  what a real person can actually achieve: a single individualised counselling session, in adults habitually
  sleeping under 6.5 h, produced +1.2 h/night of actigraphic sleep sustained over 2 weeks.
  Placed alongside the other extension trials, the achievable-yield picture is:
    Al Khatib 2018 (4 wk, habitual 5 to <7 h, one counselling session)  : +0.35 h, yield 0.38 h/h TIB
    Leproult 2015  (6 wk, chronic restriction, +1 h TIB target)         : +0.73 h, yield ~0.73 h/h TIB
    Tasali 2022    (2 wk, habitual <6.5 h, 8.5 h bedtime target)       : +1.20 h, yield ~0.60 h/h TIB
  The pattern suggests yield rises with the depth of the starting deficit, which is favourable for the target
  subject (weekday 5-6 h, i.e. a deep deficit against an adolescent need of ~9.35 h).
  On the metabolic side this is the strongest evidence that the appetite consequence of restriction is
  reversible: -270 kcal/d with a clean within-trial dose-response (r = -0.41). It contrasts with the cognitive
  picture, where residual deficits persist for days to weeks. Different outcome domains recover on very
  different schedules, and energy intake appears to be among the more tractable.
  ACCESS LIMITATION LOGGED: abstract only. pct_female derived from the reported "41 men [51.3%]" of 80
  analysed participants.
shard: "s05_recovery_kinetics"
