rob:
  tool: RoB2
  judgement: low
  notes: "Large (n=83), randomized to SR vs TSD condition, PSG-verified sleep, standard neurobehavioral battery every 2 h, and by far the longest and largest recovery-sleep dose in the acute literature (4 x 12 h TIB). Limitations: no non-sleep-loss control arm, so practice/learning effects across the 4 recovery days are uncontrolled (this would bias toward apparent recovery, making the PVT non-recovery finding conservative); baseline was measured at 10-12 h TIB rather than at habitual sleep; mean age 34.7 (range 21-50) so only fair transportability to an 18-year-old; the sample is 72.3% African American, which is unusual and may limit comparability with other cohorts; exact per-timepoint means are in figures/supplementary tables I could not fully retrieve, so most extracted values here are structural (which measures recovered when) rather than continuous effect sizes."
funding: "NIH (R01DK117488, NASA NNX14AN49G, NIH R01NR004281)"
notes: |
  This is the definitive test of "can you just sleep it off": FOUR consecutive nights at 12 h TIB - more
  recovery opportunity than any other study in the literature - and PVT lapses and response speed still did
  not fully recover after five nights of 4 h TIB. It also cleanly separates recovery kinetics after chronic
  restriction from those after acute total deprivation:
    after chronic SR : everything recovers after 1 night EXCEPT behavioral attention (PVT)
    after acute TSD  : everything recovers after 1 night EXCEPT self-reported vigor
  So chronic restriction leaves a residue specifically in objective vigilance, while acute deprivation leaves
  a residue specifically in subjective energy. The two exposures are not interchangeable and neither is fully
  reversible on this timescale.
  The authors' own framing: "These results suggest that TSD and SR induce sustained, differential biological,
  physiological, and/or neural changes, which remarkably are not reversed with chronic, long-duration
  recovery sleep."
  Their literature review also independently establishes the pattern this whole shard converges on: "while
  self-reported and/or physiological sleepiness tests recovered after multiple recovery sleep nights (ranging
  from 2 to 7 nights of 8- to 10-hour TIB), behavioral or sustained attention measures (PVT or SRTT) failed
  to recover to baseline levels".
shard: "s05_recovery_kinetics"
