    from_figure: false
    inferred_from_ci: false
    direction_note: "positive = slower, but statistically indistinguishable from control. This is the FALSE-RECOVERY signal: after a 10 h sleep opportunity, morning performance looks essentially normal even in week 3 of severe chronic sleep loss. Any self-assessment or single morning test will therefore MISS the residual deficit."
