    unit: "ms of median PVT reaction time at 30 h awake, week 2 minus week 1"
    value: 1287.0
    se: null
    ci: null
    conversion_formula: "Reported medians at 30 h awake: week 1 = 667 ms, week 2 = 1954 ms, week 3 = 2013 ms. Week 2 minus week 1 = +1287 ms, a 2.93-fold increase. No SE reported."
    from_figure: false
    inferred_from_ci: false
    direction_note: "positive = dramatically slower. Same subjects, same sleep opportunity, same hours awake - only the accumulated chronic debt differs. A median RT of ~2 s on a simple reaction-time task is functionally equivalent to falling asleep at the task."
    covariates: ["circadian phase (forced desynchrony)"]
    followup_years: null
    cohort_family: null
    quote: "In contrast, when comparing the last performance test of each wake episode, which was administered at 30 consecutive hours awake, there was a dramatic increase in median RT between the first and second weeks on the chronic sleep loss protocol (1st week: median RT = 667ms; 2nd week: median RT = 1,954msec; 3rd week: median RT = 2,013msec)."
rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Exceptionally well-controlled forced-desynchrony design that separates chronic debt, hours awake and circadian phase - unique in the literature. But the control group is a HISTORICAL comparison from a separate protocol (n=8, 1:2 sleep:wake), not a concurrently randomized arm, and the sleep-loss group is only n=9. The exposure (32.85 h wake episodes, 42.85 h days) is far from any real-world schedule, so the absolute magnitudes do not transport; the mechanism (intercept preserved, slope amplified) is what transports. Ages 20-34, so fair but not exact age match. Median RT was chosen deliberately as a conservative measure."
funding: "NIH (R01 HL077453, R01 HL080978, P30 HL101299 and related), NSBRI/NASA, Harvard CTSC"
notes: |
  This is the mechanistic key to the whole shard. It explains WHY the other studies find incomplete recovery
  even when subjects report feeling fine and score normally in the morning:
    - The y-intercept of the performance-vs-hours-awake function (i.e. morning performance after a 10 h sleep
      opportunity) did NOT change across three weeks of chronic sleep loss.
    - The SLOPE nearly tripled: 24 -> 69 ms/h awake between weeks 1 and 2, sustained at 65 ms/h in week 3.
  So a chronically sleep-restricted person is not uniformly impaired; they are normal at wake-up and then
  degrade ~3x faster than they should. Recovery sleep restores the intercept quickly and the slope slowly.
  Practical consequence for the recovery prescription: do not judge recovery by how you feel or perform in the
  morning. The right test is late-day performance, or performance after a long continuous period of demand
  (an exam block, a long drive, an evening study session).
  Authors' framing of the two-process interpretation: "This analysis indicates that the 10-hour sleep
  opportunities in the chronic sleep loss protocol were sufficient to dissipate an acute homeostatic process
  to baseline levels in this task even during the 3rd week, but a separate chronic sleep homeostatic process
  accelerated the performance deterioration over consecutive hours awake."
  The protocol also included 10 recovery days at 10 h sleep opportunity after the FD segment, but the paper's
  reported analyses focus on the FD segment; I did not find quotable recovery-day performance numbers, so I
  extract no recovery-trajectory estimate from this study.
  n recorded as 17 (9 chronic sleep loss + 8 control); the chronic sleep loss group alone is n=9.
shard: "s05_recovery_kinetics"
