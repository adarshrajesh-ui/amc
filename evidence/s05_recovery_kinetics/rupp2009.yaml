rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomized parallel groups but very small (n=12/group), no blinding, and the Extended group's baseline was measured AFTER a week of 10 h TIB, so their 'baseline' is a sleep-satiated reference while the Habitual group's is a mildly debt-laden one. This asymmetry means 'failure to return to baseline' means different things in the two arms - the authors say so explicitly. Recovery TIB was capped at 8 h by design, which the authors flag as possibly critical. Restriction was severe (3 h TIB), more extreme than the target subject's exposure. Age range spans 18-39 with a mean of ~25, and age strongly moderated every slope."
funding: "US Army Medical Research and Materiel Command; Military Operational Medicine Research Program"
notes: |
  Answers the 'does banking help' question in the affirmative, and answers the 'does prior sleep history
  change recovery speed' question in a way that is directly bad news for a chronically restricted subject:
    - Extended (banked) group: PVT lapses recovered after ONE night of 8 h TIB, then plateaued.
    - Habitual group: still improving on recovery night 5, and never caught up to the Extended group.
  The recovery-slope-by-group interaction (-0.75 lapses/day, SE 0.39, P = 0.03) is the quantitative version
  of "a habitual short sleeper recovers more slowly". Our target subject has 3 years of habitual restriction,
  so he sits at the Habitual-group end of this contrast, or worse.
  Important interpretive caveat the authors raise themselves: the Extended group's response speed also
  "failed to recover to baseline level", but only because their baseline was set after a 10 h TIB week and
  recovery was 8 h TIB - "one night of recovery sleep in the Extended group restored mean response speed to
  a stable level that was comparable to that exhibited by the Habitual group at baseline." This is a clean
  demonstration that the measured "recovery deficit" depends entirely on which baseline you choose, and that
  8 h TIB produces 8 h-TIB-level performance, not 10 h-TIB-level performance.
  Author-stated limitation, quoted because it constrains every 8 h-TIB recovery study in this shard:
  "One important, and perhaps critical, aspect of the present study that should be taken into consideration
  is that 'recovery sleep' was restricted to 8 h TIB. It is likely that recovery would have been faster in
  both groups had they been afforded a longer nightly recovery sleep opportunity."
  Age moderation was strong and consistent: "For both PVT variables, younger individuals showed a steeper
  slope of performance deterioration during sleep restriction and steeper slopes of improvement during the
  transition from sleep restriction to recovery and during recovery compared to older individuals." For an
  18-year-old this cuts both ways - faster degradation but also faster recovery once sleep is restored.
  Companion paper: Rupp TL, Wesensten NJ, Balkin TJ. Sleep history affects task acquisition during subsequent
  sleep restriction and recovery. J Sleep Res. 2010 (DOI 10.1111/j.1365-2869.2009.00800.x, PMID 20050993,
  both verified) - same cohort, learning outcomes; not extracted separately to avoid double-counting.
shard: "s05_recovery_kinetics"
