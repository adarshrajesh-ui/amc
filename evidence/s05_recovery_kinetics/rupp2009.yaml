    unit: "additional PVT lapses per day of restriction, Habitual vs Extended"
    value: 0.40
    se: 0.17
    ci: [0.067, 0.733]
    conversion_formula: "RESTRICT x Group interaction from the discontinuous growth model (Table 5a): estimate 0.40, SE 0.17, t(273) = 2.35, P = 0.01 (one-tailed). Main restriction slope was 2.70 lapses/day (SE 0.40, t = 6.80). CI = 0.40 +/- 1.96*0.17."
    from_figure: false
    inferred_from_ci: false
    direction_note: "positive = the Habitual (non-banked) group deteriorated FASTER, accumulating 0.40 extra lapses per restricted day on top of the common 2.70/day slope - a ~15% steeper degradation. Sleep banking buffered restriction."
    covariates: ["age"]
    followup_years: null
    cohort_family: null
    quote: "Psychomotor vigilance task (PVT) lapses were more frequent and modified maintenance of wakefulness (MWT) sleep latency was shorter in the Habitual group than in the Extended group across the sleep restriction phase."
