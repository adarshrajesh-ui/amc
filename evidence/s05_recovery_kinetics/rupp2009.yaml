    outcome_construct: pvt_lapses_recovery_slope_group_difference
    exposure: {type: recovery_sleep, dose_h: 8, referent_h: 8, duration_days: 5, contrast_label: "5 recovery nights at 8 h TIB, Habitual vs Extended prior-sleep group"}
    scale: per_hour_beta
    unit: "PVT lapses per recovery day, Habitual vs Extended"
    value: -0.75
    se: 0.39
    ci: [-1.515, 0.015]
    conversion_formula: "RECOV x Group interaction (Table 5a): estimate -0.75, SE 0.39, t(273) = -1.94, P = 0.03 (one-tailed). Main recovery slope -3.14 lapses/day (SE 0.88); transition drop TRANS = -15.33 lapses (SE 2.70)."
    from_figure: false
    inferred_from_ci: false
    direction_note: "negative = the Habitual group was still on a downward (improving) trajectory across all 5 recovery days, i.e. had NOT plateaued, whereas the Extended group jumped to its plateau after night 1. A continuing slope at the end of the recovery window is direct evidence that recovery was not finished."
    covariates: ["age"]
    followup_years: null
    cohort_family: null
    quote: "Specifically, the Extended group recovered significantly after one night and maintained a stable level of improved performance, while the Habitual group gradually improved across the 5 Recovery days."
