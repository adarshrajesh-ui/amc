    direction_note: "5 = five consecutive 8 h TIB recovery nights were given and the habitual-sleep group still had not reached the banked group's performance. This is the longest recovery window in the classical banking literature and it was still not enough. Highest-relevance finding for a habitually short-sleeping subject."
