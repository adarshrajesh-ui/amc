    outcome_construct: tst_yield_per_hour_tib_recovery_night
    exposure: {type: recovery_sleep, dose_h: null, referent_h: null, duration_days: 1, contrast_label: "TST as a function of recovery TIB dose (2/4/6/8/10 h) after 5 nights of 4 h TIB"}
    scale: per_hour_beta
    unit: "h TST per h recovery TIB"
    value: 0.8915
    se: null
    ci: null
    conversion_formula: "OLS of reported adjusted-mean TST (1.88, 3.84, 5.74, 7.51, 8.96 h) on recovery TIB (2, 4, 6, 8, 10 h): TST = 0.237 + 0.8915*TIB, R^2 = 0.9968. Marginal yields by interval: 2->4 h 0.980; 4->6 h 0.950; 6->8 h 0.885; 8->10 h 0.725 h TST per h TIB - i.e. the repayment function is CONCAVE and saturating. se is null because this slope is fitted to five published ADJUSTED GROUP MEANS with no reported per-dose SDs for TST; the residual standard error of my own 5-point regression (0.098 h) describes only how well a straight line fits those five points and would badly understate sampling uncertainty in the underlying n = 159, so reporting it as the SE would be misleading. A linear fit is in any case the wrong model: the authors themselves report TST rising linearly but the neurobehavioral recovery functions as exponential, and the declining marginal yields above show the TST relation is mildly concave rather than straight."
    from_figure: false
    inferred_from_ci: false
    direction_note: "Extra sleep opportunity is not converted 1:1 into sleep, and the conversion gets WORSE as TIB lengthens (0.98 at the short end, 0.725 in the 8-10 h band). This is the physiological reason debt cannot be repaid hour-for-hour."
