rob:
  tool: RoB2
  judgement: low
  notes: "Randomized allocation to recovery dose, large n (159; 118 restricted + 17 control across dose subgroups of 13-29), objective PSG and PVT outcomes, ANCOVA controlling for baseline and cumulative deficit. Main limitations: only ONE recovery night was studied, so the study cannot speak to multi-night recovery kinetics; dose subgroups are small (n=13 for the 0 h dose); adults 22-45, not adolescents; the reported intersection extrapolations have wide CIs the authors flag themselves."
funding: "NIH (NR004281, RR00040); Air Force Office of Scientific Research"
notes: |
  This is the best available data on the SHAPE of the repayment function. Three separate findings matter:
  (1) TST yield per hour of recovery TIB is high but sub-unity and CONCAVE: 0.98 h/h at 2-4 h TIB
      falling to 0.725 h/h at 8-10 h TIB. The saturating shape is the mechanism behind the sleep ceiling.
  (2) Neurobehavioral recovery functions were EXPONENTIAL (saturating) for PVT and KSS, and LINEAR for MWT -
      i.e. different outcomes recover on different schedules, and the vigilance measures saturate short of
      baseline: "While TST, stage 2, REM sleep and NREM slow wave energy (SWE) increased linearly across
      recovery sleep doses, best-fitting neurobehavioral recovery functions were exponential across recovery
      sleep doses for PVT and KSS outcomes, and linear for the MWT."
  (3) MWT sleep latency and DSST DID recover by 8-10 h TIB (MWT p=0.072 at 8 h and p=0.558 at 10 h), while
      PVT lapses, KSS, PVT fastest RTs and POMS fatigue did NOT. Recovery is measure-specific, and the
      measures that recover fastest are the ones a person would use to self-assess readiness.
  Residual deficit dose-response, Hedges' g vs own baseline (from Table 2; positive = worse except MWT):
    dose  PVT lapses   KSS      MWT      PVTf10   POMS fatigue
    0 h   2.233        2.067   -2.437    2.161    1.155
    2 h   1.380        2.343   -1.922    1.226    1.805
    4 h   1.395        1.280   -1.061    0.761    1.112
    6 h   1.096        0.936   -0.699    0.880    1.006
    8 h   0.560        0.636   -0.402    0.902    0.742
    10 h  0.429        0.501   -0.140    0.394    0.569
  Sleep efficiency during recovery was 89.6% at 10 h TIB vs 84.6% at baseline and 77.2% in controls on the
  equivalent day - efficiency rises under debt, but not enough to overcome the TIB cap.
  SWE was elevated ABOVE baseline at 10 h TIB while PVT remained impaired, which shows that the classical
  homeostatic marker can overshoot while behaviour has not recovered. Do not use SWE as a recovery endpoint.
