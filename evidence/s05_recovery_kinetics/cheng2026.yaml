rob:
  tool: RoB2
  judgement: high
  notes: "I could obtain only the abstract, and the abstract does not report the sample size, participant ages, the sleep doses used for restriction or recovery, the country, or any statistical thresholds - so n, age and country are null in this record and the design details are unverifiable. Blood transcriptomics with no stated multiple-comparison strategy in the abstract; gene-count outcomes are highly sensitive to filtering choices. All male. Very recent (2026) so no independent replication or post-publication scrutiny yet. This record should be treated as directional evidence about the EXISTENCE of a >5-week molecular residue, not as a quantitative estimate."
funding: "Not verifiable from the abstract."
notes: |
  Included for one reason: it is the only study I found that follows recovery for longer than three weeks, and
  it reports that molecular normalisation was still incomplete at 5 weeks. That extends the shard's upper
  bound on recovery time from ~13 days (Rabat 2016, salivary alpha-amylase) to ~5 weeks.
  Two things to be careful about when the downstream model consumes this:
  1. "74 genes still dysregulated" is not a health outcome. Persistent differential expression of 74
     whole-blood transcripts is a plausible biomarker of incomplete recovery but has no established mapping to
     cognition, metabolism or risk. It should not be used to argue for a specific magnitude of residual harm.
  2. The authors' own hedged phrasing ("not fully recovered within the study timeframe") is more accurate than
     the word "persistent", and the abstract uses that hedge repeatedly.
  Author framing: "Our findings suggest that recovery sleep alone cannot fully reverse the molecular scars
  induced by prolonged sleep restriction."
  ACCESS LIMITATION LOGGED: abstract only; no PMC deposit at time of retrieval. Author list, journal, volume
  and issue were taken from the PubMed record retrieved via efetch. DOI and PMID both resolve and the title
  matches, so verification status is VERIFIED on identifiers.
