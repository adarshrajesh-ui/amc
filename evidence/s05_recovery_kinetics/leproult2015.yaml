rob:
  tool: RoB2
  judgement: moderate
  notes: "Single-arm intervention study with no randomized control group: every participant went from 2 weeks of habitual sleep to 6 weeks of extension, so secular trends, regression to the mean and expectancy effects are uncontrolled for the metabolic outcomes. Glucose and insulin were assayed from a SINGLE morning blood sample at each of two timepoints, which is a weak endpoint compared with the clamp used by Depner or the OGTT minimal model used by Killick. n=16 with only 3 men. Correlational metabolic findings in n=16 are fragile. Abstract only, so I cannot check the analysis or exclusions."
funding: "Not verifiable from the abstract."
notes: |
  Included because it is one of only two multi-week (6-week) sleep-extension studies in habitual short sleepers
  that I could verify, addressing shard requirement 7 directly.
  Two findings matter for the prescription:
  1. Achievable weekday gain over 6 weeks with monitoring: +44 min actigraphic (+49 min PSG) from a 1-h TIB
     target, i.e. a yield of ~0.73 h TST per h TIB. This sits between Al Khatib's free-living 0.38 and the
     laboratory 0.7-0.98, and suggests that sustained monitoring and a longer intervention improve conversion.
  2. Weekend sleep did NOT increase, because it was already extended. The available headroom in a habitual
     short sleeper is on weeknights, not weekends - which is exactly the opposite of the intuitive
     "catch up at the weekend" strategy.
  The insulin-sensitivity correlation (r = +0.76) is the study's headline but is the weakest part of the
  evidence: single fasting samples, n=16, no control arm. Use it as supportive of direction only. The stronger
  metabolic evidence in this shard is Killick 2015 (OGTT minimal model, benefit) and Depner 2019 (clamp,
  weekend catch-up insufficient).
  ACCESS LIMITATION LOGGED: abstract only. Age is reported in the abstract as a median with IQR
  (25 [23, 27.8] years); I record age_mean 25.0 and age_range [23, 27.8], which are strictly the median and
  IQR bounds, not a mean and full range.
shard: "s05_recovery_kinetics"
