    quote: "The sleep extension group significantly increased time in bed [0:55 hours:minutes (h:mm); 95% CI: 0:37, 1:12 h:mm], sleep period (0:47 h:mm; 95% CI: 0:29, 1:05 h:mm), and sleep duration (0:21 h:mm; 95% CI: 0:06, 0:36 h:mm) compared with the control group."
  - outcome_domain: recovery
    outcome_construct: free_living_tst_yield_per_hour_of_added_tib
    exposure: {type: sleep_extension, dose_h: null, referent_h: null, duration_days: 28, contrast_label: "ratio of achieved sleep-duration gain to achieved time-in-bed gain in a free-living 4-week extension trial"}
    scale: per_hour_beta
    unit: "h TST gained per h TIB added, free-living"
    value: 0.382
    se: null
    ci: null
    conversion_formula: "TIB gain +0:55 = 0.917 h; sleep-duration gain +0:21 = 0.350 h. Yield = 0.350/0.917 = 0.382 h TST per h TIB. Sleep PERIOD gain was +0:47 = 0.783 h, so the loss is split: ~0.13 h of the extra TIB went to sleep-onset latency and ~0.43 h to wake within the sleep period. se is null because this yield is a RATIO of two separately-reported estimates whose covariance the paper does not report; propagating error would require assuming independence, which is false here (both derive from the same actigraphy records). The SE of the numerator alone is derivable and is 0.128 h: (0.600 - 0.100)/3.92 from the reported 95% CI of the sleep-duration gain (+0:06 to +0:36)."
    from_figure: false
    inferred_from_ci: false
    direction_note: "0.382 h TST per h TIB is the CRITICAL real-world number, and it is dramatically worse than the laboratory figures (0.72-0.98 h/h in Banks, Belenky, Pejovic). In a supervised lab, extra time in bed becomes sleep; at home, roughly TWO THIRDS of it is lost to latency and fragmentation. Any recovery prescription must budget for this."
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "The sleep extension group significantly increased time in bed [0:55 hours:minutes (h:mm); 95% CI: 0:37, 1:12 h:mm], sleep period (0:47 h:mm; 95% CI: 0:29, 1:05 h:mm), and sleep duration (0:21 h:mm; 95% CI: 0:06, 0:36 h:mm) compared with the control group."
