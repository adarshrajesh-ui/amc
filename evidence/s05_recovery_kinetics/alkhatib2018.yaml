rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Registered (NCT02787577) parallel-group RCT with objective wrist actigraphy as the primary sleep measure and excellent retention - appropriate for the feasibility question it was designed to answer. But it is explicitly a PILOT: dietary outcomes rest on self-reported 7-day food diaries, the free-sugar finding required a sensitivity analysis restricted to plausible reporters to extend to other macronutrients, and there were no significant effects on energy balance or cardiometabolic markers. Only the abstract was retrievable, so age/sex distributions are null. Eligibility 18-64 y, so the sample is largely adult, not adolescent."
funding: "Not verifiable from the abstract. Registered at ClinicalTrials.gov as NCT02787577."
notes: |
  This record exists to supply the single most important reality check in the shard: the gap between the
  laboratory repayment function and the achievable one.
    laboratory yield (Banks, recovery night, supervised)     : 0.73-0.98 h TST per h TIB
    laboratory yield (Rupp, semi-supervised extension week)   : 0.67 h TST per h TIB
    free-living yield (this study, behavioural counselling)   : 0.38 h TST per h TIB
  So a person told to "spend an extra hour in bed" at home should expect roughly 20-25 minutes of extra sleep,
  not 60. To bank an extra hour of actual sleep at home requires budgeting roughly 2.5 hours of additional time
  in bed, or improving sleep efficiency alongside extending opportunity.
  Consistent with Leproult 2015 (+44 min actigraphic sleep from a target of +60 min TIB on weekdays, but zero
  change at weekends) and Tasali 2022 (+1.2 h from a target bedtime extension of ~2 h in a population starting
  below 6.5 h). Tasali's higher yield is probably because her participants started from a much larger deficit
  (<6.5 h habitual), which increases sleep pressure and therefore efficiency.
  ACCESS LIMITATION LOGGED: abstract only.
shard: "s05_recovery_kinetics"
