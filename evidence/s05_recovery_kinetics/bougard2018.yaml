rob:
  tool: RoB2
  judgement: moderate
  notes: "Very small (n=12, all male), no control arm, single-group before-after design with recovery assessed at only two timepoints (R3 and R13), so the recovery time course is coarsely sampled. I could obtain only the abstract, so I cannot verify whether MWT/KSS had already recovered by R3 or only by R13, which is the single number I most wanted from this paper. Same protocol/cohort as Rabat et al. 2016 (ClinicalTrials NCT01989741), so cohort_family is recorded to prevent double counting."
funding: "Not verifiable from the abstract. Registered as ClinicalTrials NCT01989741."
notes: |
  Included because it is one of only two studies I could find with a recovery window longer than 7 days
  (13 nights), which directly addresses the shard's requirement to find studies tracking recovery for more
  than a few days.
  IMPORTANT CORRECTION TO A CLAIM I ENCOUNTERED SECONDHAND: while searching, I saw this study cited as showing
  that microsleeps remained elevated until recovery day 12. The abstract I actually retrieved does NOT support
  that specific claim - it states that recovery nights allowed MWT latencies, KSS scores and all sleep values
  to return to baseline, with a rebound in N3 and REM. Because assessments occurred only at R3 and R13, the
  abstract cannot distinguish "recovered by R3" from "recovered only by R13". I therefore record 13 days as an
  UPPER bound and do not claim a day-12 non-recovery. Reporting reality per the extraction instructions.
  The companion paper on the same cohort (Rabat et al. 2016, DOI 10.3389/fnbeh.2016.00095, PMID 27242464,
  verified) DOES report a measure that had not recovered at R13 - salivary alpha-amylase - and is extracted
  separately as rabat2016.
  ACCESS LIMITATION LOGGED: abstract only (Consciousness and Cognition, paywalled).
shard: "s05_recovery_kinetics"
