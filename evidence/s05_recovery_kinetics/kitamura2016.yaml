    inferred_from_ci: false
    direction_note: "positive = nightly shortfall below individual need. Note this is debt in a group whose habitual sleep was 7.37 h; a 16-19 year old sleeping 5-6 h on weekdays against an adolescent need of ~9 h would have a much larger per-night shortfall."
