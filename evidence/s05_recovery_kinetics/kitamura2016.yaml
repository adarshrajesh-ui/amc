    cohort_family: null
    quote: "the result of the trial calculation of mean PSD (i.e., the difference between OSD and HSD) for the 15 participants was 1.04 +/- 0.24 h (range, -0.58 to 2.73 h; 95% confidence interval: 0.57-1.58 h; Fig. 2b)."
