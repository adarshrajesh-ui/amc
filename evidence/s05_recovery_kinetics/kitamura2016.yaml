    exposure: {type: sleep_extension, dose_h: 12, referent_h: 8, duration_days: 9, contrast_label: "tau of TST_d = TST_inf + (TST_0 - TST_inf)*exp(-d/tau) across 9 nights of 12 h TIB"}
    scale: raw_units
    unit: "days (exponential time constant)"
    value: 2.52
    se: null
    ci: null
    conversion_formula: "Group-level tau estimated by the authors from their own data as the number of days for the E1-E5 TST difference to decay by 37% (=1/e), pooled across all 15 participants; this value was then used to initialise the per-subject nonlinear fits. Per-subject fitted taus are reported only in Supplementary Fig. S3, which I could not retrieve, so this is the group estimate, not the mean of fitted values."
    from_figure: false
    inferred_from_ci: false
    direction_note: "tau ~2.5 days means ~63% of the sleep-duration rebound is discharged in 2.5 days, ~95% by 3*tau = 7.6 days. This is the cleanest single empirical time constant for RECOVERY SLEEP AMOUNT in the literature. It is NOT the time constant for performance or endocrine recovery, which are slower."
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "Here, TSTd denotes TST for each extended sleep session, TST0 is TST at the start of the extension (i.e., the intercept at the Y-axis), d is days, tau is the time constant of the decay curve, and TST-infinity is the lower bound of the estimated TST."
