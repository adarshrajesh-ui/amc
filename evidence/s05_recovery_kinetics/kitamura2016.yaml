    se: 0.250
    ci: [-1.264, -0.284]
    conversion_formula: "Reported paired t = 3.091, p = 0.008, n = 15 (df = 14). d = t/sqrt(n) = 3.091/3.873 = 0.798; J = 1 - 3/(4*14-1) = 0.9455; g = 0.755... using the same n=15 convention as elsewhere in this shard, g = 0.774 in magnitude; SE = |g|/t = 0.250. Sign set negative to denote reduction."
    from_figure: false
    inferred_from_ci: true
    direction_note: "negative = cortisol DECREASED with sleep extension, i.e. HPA-axis hyperactivity associated with ~1 h of chronic debt was reversible. ACTH also fell (t = 2.601, p = 0.021), plasma glucose fell (t = 2.153, p = 0.05), TSH rose (t = -6.102, p < 0.001) and T4 rose (t = -3.054, p = 0.009)."
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "In regard to hypothalamus-pituitary-adrenocortical (HPA) axis function, there was a significant decrease in plasma ACTH (t = 2.601, p = 0.021) and cortisol (t = 3.091, p = 0.008) concentration at E9 compared to BL."
rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Single-arm within-subject extension with no parallel control, so the day-9 neuroendocrine changes cannot be fully separated from repeated-measures/adaptation effects. Very small n (15), all male, all Japanese, so sex- and ancestry-generalisability is limited. Individual exponential fits were poor for some subjects (R^2 as low as 0.244) and failed entirely for 2/15. Endocrine outcomes were sampled only at BL and E9, so the normalisation time course is unresolved. No performance battery beyond MWT/VAS, so this study speaks to sleep-need and sleep-amount kinetics rather than to cognitive recovery."
funding: "Japanese Ministry of Health, Labour and Welfare; National Center of Neurology and Psychiatry (Japan); JSPS KAKENHI"
notes: |
  THE single most directly relevant study for the "how much and for how long" question. Answers requested:
    (a) habitual sleep duration          = 7.37 +/- 0.27 h/night (actigraphy, ~2 weeks at home)
    (b) asymptotic (optimal) duration    = 8.41 +/- 0.18 h/night (range 7.29-9.26 h)
    (c) days to reach the asymptote      = 4 days of 12 h TIB (tau ~2.52 d); authors also state
                                           "opportunities for sufficient sleep up to 9 days are needed to
                                           eliminate the sleep debt" once endocrine endpoints are included
    (d) estimated sleep debt             = 1.04 +/- 0.24 h/night (95% CI 0.57-1.58 h)
  Two crucial framings for the recovery prescription:
  1. Debt here is a PER-NIGHT RATE (~1 h/night), not a cumulative bank. 4 days of extension cleared the
     sleep-amount consequence of a chronic ~1 h/night shortfall, but the participants had been in that state
     for years. This is direct evidence that recovery time scales with the DEPTH of nightly debt, not with
     the total accumulated hours - you do not repay 1000 lost hours with 1000 recovered hours.
  2. The authors explicitly link weekend catch-up to this rebound: "TST rebound is analogous to catch-up
     sleep on the weekends from sleep debt that occurs as a result of social obligations such as going to
     work or school. ... Suppressing this increase as much as possible may be one approach to establishing
     sleep habits suited to each individual." A large weekend rebound is a DIAGNOSTIC of debt, not a cure.
  Corroborating asymptote from Klerman & Dijk 2008 (PMID 18656358, verified), quoted in this paper:
  "When Klerman and Dijk gave young and elderly subjects the opportunity to sleep 16 h/day, sleep time showed
  exponential decay in both groups and asymptotic values were obtained at 8.9 h and 7.4 h, respectively."
  Even at 16 h TIB, young adults asymptote at 8.9 h - a hard physiological ceiling on chronic nightly sleep.
shard: "s05_recovery_kinetics"
