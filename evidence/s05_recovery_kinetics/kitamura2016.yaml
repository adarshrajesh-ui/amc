    value: 3.0
    se: null
    ci: null
    conversion_formula: "Authors state 'a TST rebound of more than 3 h in average at E1'. With HSD 7.37 h this implies E1 TST >= ~10.4 h out of 12 h TIB (efficiency ~87%). Reported as >3 h, so 3.0 is a LOWER BOUND."
    from_figure: false
    inferred_from_ci: false
    direction_note: "Lower bound on the maximum single-night rebound. Even with 12 h in bed and a real debt, TST was ~10.4 h, not 14-16 h. This is the empirical ceiling on one night of ad-lib recovery sleep."
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "However, even in this group of healthy individuals who subjectively reported having enough sleep, we observed a TST rebound of more than 3 h in average at E1. Thus, they were experiencing possible sleep loss without being aware of it."
