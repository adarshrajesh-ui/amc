    from_figure: false
    inferred_from_ci: false
    direction_note: "This is the empirical answer to 'how much sleep do I actually need': ~8.4 h/night for young adult men, with true between-person spread of 7.3-9.3 h. It is also a CEILING - given 12 h in bed indefinitely, they took only 8.41 h (70% of TIB)."
    covariates: []
