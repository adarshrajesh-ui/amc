study_id: lucassen2014
citation: "Lucassen EA, Piaggi P, Dsurney J, de Jonge L, Zhao XC, Mattingly MS, Ramer A, Gershengorn J, Csako G, Cizza G; Sleep Extension Study Group. Sleep extension improves neurocognitive functions in chronically sleep-deprived obese individuals. PLoS One. 2014;9(1):e84832."
