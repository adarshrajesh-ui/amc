rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: NOT adjusted for competing mortality, by the authors' own statement. Index ages 55-65 are selected
    survivors who were still normotensive at that age, so the estimand is not 'lifetime risk for a 19-year-old'.
    Framingham is overwhelmingly white, New England, 1976-1998. JNC-VI threshold >=140/90, which is NOT
    the current 2017 ACC/AHA >=130/80.
funding: NIH/NHLBI (Framingham Heart Study contract)
notes: The seed paper named in the task; real, and the 90% figure is correct. But it is the WRONG estimand
  for this project on three counts (unadjusted, wrong index age, obsolete threshold) and it is nearly
  saturated. For a sleep model the informative hypertension outcome is blood pressure LEVEL or AGE AT
  ONSET, not lifetime incidence. Use fryar2024_hypertension_prevalence for the contemporary, age-matched,
  current-definition denominator.
