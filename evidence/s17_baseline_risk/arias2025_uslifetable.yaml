    table, so it assumes a 19-year-old will face 2023''s age-80 mortality in 2087; Medicare data used
    for ages 66-99; race/ethnicity misclassification adjustment applies to subgroup tables only.'
funding: US federal (CDC/NCHS)
notes: PRIMARY SOURCE for /workspace/data/lifetable_us_male.csv. Downloaded the official machine-readable
  Table02.xlsx from https://ftp.cdc.gov/pub/Health_Statistics/NCHS/Publications/NVSR/74-06/Table02.xlsx
  so no hand transcription was involved. Most recent United States Life Tables published as of retrieval
  (data year 2023, published 2025-07-15); the CDC life tables index lists no 2024 volume. NCHS closes
  the table at an open-ended '100 and older' interval, so single-year qx above 99 came from SSA (record
  ssa2023_periodlifetable). Recomputing ex from the published qx with a(x)=0.5 reproduces e0 to 0.0025
  y, e19 to 0.0003 y and e65 to 0.0004 y.
