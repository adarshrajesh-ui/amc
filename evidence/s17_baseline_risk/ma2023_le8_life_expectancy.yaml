rob:
  tool: ROBINS-I
  judgement: critical
  notes: 'The single-component estimates in Table S8, including the 5.0-year sleep figure, are marginal
    high-vs-low contrasts that are NOT adjusted for the other seven components. Because the components
    are strongly correlated in these data (the low-CVH stratum has a mean sleep health score of 68.2 versus
    93.2 in the high-CVH stratum), the sleep contrast absorbs smoking, diet, BMI, glucose and blood pressure.
    The internal arithmetic makes this unavoidable: the components sum to far more than the total contrast.
    Additionally, only 1359 deaths (328 CVD) over a median 7.8 years support an extrapolation of survival
    from age 50 to 100, and sleep duration is self-reported in a single NHANES interview. Confounding
    by socioeconomic position is not addressed in the component analysis at all.'
funding: NIH (per paper)
notes: 'THE LARGEST PUBLISHED SLEEP LIFE-EXPECTANCY NUMBER THIS SHARD FOUND, AND THE ONE MOST LIKELY TO
  BE MISUSED. If a downstream consumer wants a headline ''good sleep is worth 5 years'' claim, this is
  where it comes from, and it is not defensible as a causal sleep effect for the reasons in rob.notes.
  Its real value is as the upper end of a bracket: the four independent published anchors for the mortality
  channel are Chaput 2022 (+1.2 y from age 20, life table + meta-analytic RR), Huang 2023 (-2.31 CVD-free
  y in men, UK Biobank), Li 2024 (-4.7 y at age 30 in men, 5-factor composite) and Ma 2023 (5.0 y at age
  50, unadjusted single component). They span 1.2 to 5.0 years and the spread is explained almost entirely
  by how much non-sleep lifestyle each contrast absorbs, ordered exactly as one would predict. Index age
  50 versus the subject''s 19 is a second reason to discount it: it conditions on surviving to 50.'
