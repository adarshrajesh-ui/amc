  direction_note: 'positive = years GAINED by good sleep, i.e. 5.0 y notionally lost by the poor-sleep
    group. TREAT AS A HARD CEILING, NOT AN ESTIMATE. The paper''s own numbers prove the component contrasts
    are not independent: tobacco alone gives 7.4 y and sleep alone gives 5.0 y, summing to 12.4 y, which
