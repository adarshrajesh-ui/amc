  notes: 'Official actuarial table. Population is the ''Social Security area'' population, which includes
    Puerto Rico, other territories, federal employees abroad and insured non-citizens abroad, so it is
    NOT the US resident population NCHS uses. qx for young adults differs from NCHS by up to about 7%
    in relative terms (q19: SSA 0.001138 vs NCHS 0.001061), though the absolute difference is 7.7e-5.'
funding: US federal (SSA)
notes: 'VERIFICATION STATUS IS UNVERIFIED BY CONSTRUCTION, NOT BY FAILURE. SSA actuarial tables carry
  no DOI and are not indexed in PubMed, so neither Crossref nor PubMed can resolve them and both identifier
  fields are correctly null rather than guessed. Retrieval evidence: www.ssa.gov returns HTTP 403 to automated
  clients (Akamai), so the page was fetched through a text-extraction proxy (r.jina.ai) and parsed programmatically,
  with the parsed values cross-checked against a second independent fetch of the same URL. THIS IS NOT
  A PRIMARY-MODEL RECORD for gate G2 purposes: it supplies only qx above age 99, which contributes T(100)/l(0)
  = 0.0215 years (0.26 months) to e0 and 0.0218 years to e19. Setting the whole tail to qx=1 at age 100
  would change e19 by 0.02 y. The two values reported here that ARE model-relevant (e0, e19) are corroborated
  to within 0.04 y by the fully verified NCHS record.'
