rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: 73.9% female overall and mean age 46 for men, so this is a midlife estimate. These are COMPETING
    (cause-specific Cox) hazard ratios, not Fine-Gray subdistribution hazard ratios, so they cannot be
    read directly as multipliers on absolute risk. Cohort overlap with wilkins2012.
funding: NIH
notes: Included in a baseline-risk shard because it is the conversion coefficient between a BMI shift
  and a CVD hazard shift, which is what lets the model use the well-identified sleep->BMI literature instead
  of the poorly identified sleep->CVD literature.
