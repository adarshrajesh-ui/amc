rob:
  tool: ROBINS-I
  judgement: high
  notes: The life-table arithmetic is sound; the causal input is not. The all-cause mortality relative
    risks are imported from observational meta-analyses of self-reported habitual sleep duration, which
    carry reverse causation (illness shortens and lengthens sleep), residual confounding by shift work,
    depression, obesity and socioeconomic position, and measurement error. Canadian life tables and Canadian
    sleep prevalence, not US. No adolescents. Applies a single lifelong RR from age 20, which is the OPPOSITE
    of this project's 3-year adolescent exposure, so 1.2 years is an UPPER BOUND on the mortality-channel
    cost of 3 years of restriction unless the exposure permanently reprograms risk. Life-years only, no
    QALY weighting.
funding: null
notes: 'REPRODUCED BY THIS SHARD: feeding an all-cause mortality hazard ratio of 1.10-1.13 lifelong from
  age 20 through the NCHS 2023 US male life table gives -1.15 to -1.48 years at age 20 (hr_to_life_expectancy.py
  section G). The published 1.2-year figure sits inside that band. Two different life tables and two independent
  implementations agree, which validates the conversion machinery. This is the end-to-end calibration
  target in competing_risk_method.md section 4.'
