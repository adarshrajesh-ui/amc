  direction_note: 'positive = excess lifetime risk attributable to very obese BMI. CRITICAL CONTRAST WITH
    THE AGE-18 ROWS: the BMI spread is 62.7 points at age 18 but only 23.9 points at age 65, i.e. the
    same BMI shift buys about 2.6x less diabetes risk when it happens in later life. This is the quantitative
    argument that an exposure acting at ages 16-19 is worth more than the same exposure acting at 65,
    and it is why this shard''s risks are indexed by age of assessment at all.'
  covariates: []
