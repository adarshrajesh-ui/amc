rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: 'Nationally representative but the 2024 NSDUH had 47.9% adult non-response and used multimode
    (in-person plus web) collection; SAMHSA itself warns that ''comparison of estimates from the 2024
    NSDUH with those from prior years must be made with caution''. Measures MDE (an episode) not MDD (the
    disorder): MDE omits the bipolar exclusion. Self-report instrument, not a clinician interview.'
funding: US federal (SAMHSA)
notes: 'VERIFICATION UNVERIFIED BY CONSTRUCTION, NOT BY FAILURE: NSDUH detailed tables carry no DOI and
  are not indexed in PubMed, so both identifier fields are correctly null rather than guessed. Retrieval
  evidence: the official SAMHSA ZIP 2024-nsduh-detailed-tables-072325.zip was downloaded from samhsa.gov,
  extracted, and tables 6.39B and 6.39D parsed programmatically from the HTML rather than transcribed.
  CORROBORATION: NIMH''s Major Depression statistics page reports 18.6% past-year MDE for all adults aged
  18-25 in 2021 (both sexes) and 6.2% for adult males overall, consistent in level and in the male-female
  ratio.'
