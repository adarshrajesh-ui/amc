funding: NIMH, and others
notes: 'The NCS-R paper named in the shard task; real, and the headline numbers match. Kessler 2005 (Arch
  Gen Psychiatry 62:593, DOI 10.1001/archpsyc.62.6.593, PMID 15939837) is the companion age-of-onset paper:
  lifetime prevalence of any mood disorder 20.8%, median age of onset for mood disorders 30 years, projected
  lifetime risk of ANY disorder at age 75 of 50.8% versus observed lifetime prevalence 46.4%, and ''Half
  of all lifetime cases start by age 14 years and three fourths by age 24 years''. That last sentence
  matters here: the subject''s exposure window sits inside the peak-onset window, so a sleep effect on
  depression can plausibly act on incidence rather than only on recurrence.'
