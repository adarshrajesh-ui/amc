rob:
  tool: Newcastle-Ottawa
  judgement: low
  notes: 'Nationally representative, measured (not self-reported) fasting glucose and HbA1c. Cross-sectional,
    so it is not a cumulative incidence: it is subject to survivor bias (people who developed diabetes
    and died are absent) and to cohort effects. NHANES 2021-2023 had reduced response after the pandemic
    pause.'
