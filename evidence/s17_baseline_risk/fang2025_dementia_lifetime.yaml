rob:
  tool: Newcastle-Ottawa
  judgement: low
  notes: 'Best available US ascertainment: in-person cognitive assessment, informant interview, hospitalisation
    and death records, plus Medicare claims. Four US communities, so not nationally representative. Index
    age 55. COHORT-FAMILY OVERLAP with wilkins2012 (both include ARIC).'
funding: NIH (NHLBI, NIA, NINDS)
notes: 'THE LARGEST SINGLE DENOMINATOR UNCERTAINTY IN THIS SHARD. Fang et al. note the discrepancy themselves:
  ''Previous studies suggest that 11-14% of men and 19-23% of women in the United States will develop
  dementia during their lives'' and ''In the Framingham Heart Study, 14% of men and 23% of women developed
  dementia from age 45-105 years''. Male dementia lifetime risk is therefore 14%-35%. Carry both; do not
  collapse.'
