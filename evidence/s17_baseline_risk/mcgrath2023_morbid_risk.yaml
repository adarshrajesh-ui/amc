    (12-36) for female respondents.
rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: Cross-national, NOT US-specific; the US contributes one of 32 surveys, so transportability to
    a US male is only fair. Morbid risk is projected from retrospectively reported ages of onset, which
    are subject to recall telescoping, and it is NOT adjusted for competing mortality (the paper projects
    to age 75 in a survey population). Surveys span 2001-2022 with heterogeneous fielding.
