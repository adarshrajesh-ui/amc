  notes: Nationally representative with measured blood pressure. Definition is SBP >=130 or DBP >=80 or
    on antihypertensive medication (2017 ACC/AHA), which roughly doubles young-adult prevalence relative
    to the older >=140/90 threshold; do NOT compare with Vasan 2002. Cross-sectional.
