rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: 'Same self-report limitation as Gregg 2014. NOT SEX-SPECIFIC: reports LR for adults overall.
    Horizon truncated at age 84, which biases the lifetime risk slightly downward. An erratum exists (PLoS
    One 2025 Jun 23;20(6):e0326955); the erratum was not retrieved, so the possibility that it revises
    these figures is an open flag.'
funding: US federal (CDC)
notes: 'SUPERSEDES Gregg 2014 for currency but not for sex-specificity. Because Gregg found men 40.2%
  versus women 39.6%, the male-specific 2015-2018 figure is likely close to 32.8%. Recommended range for
  a 19-year-old US male: 33-40%. Figure 1 shows LR by BASELINE age 18-60, which is the complement of the
  requested cumulative incidence by attained age; the figure''s underlying values could not be extracted,
  which is why baseline_risks.yaml marks the 50/65/80 cutpoints DERIVED_BOUNDS.'
