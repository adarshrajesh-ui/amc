rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: Dementia status is imputed by a joint longitudinal latent-variable model of cognition, dementia
    and survival rather than clinically diagnosed, so the estimates inherit that model's assumptions.
    The authors validate it against ADAMS, the HRS clinical-assessment substudy, and match it closely
    at ages 85+ (0.359 vs ADAMS 0.358) where the widely used calibrated cutoff method underpredicts by
    4.8 points (0.310) - this is a genuine strength over the comparison methods. Sample is decedents aged
    70+ from HRS waves 2000-2016, so the estimand is inherently conditional on surviving to 70 and cannot
    be read as a lifetime risk from a young age. No adolescent content whatsoever.
funding: NIA / RAND (per paper)
notes: 'THIS RECORD IS THE ARBITRATOR FOR THIS SHARD''S LARGEST DISAGREEMENT. The paper''s discussion
  diagnoses, in the authors'' own words, why published US dementia lifetime risks range from 11% to 41%,
  and the mechanisms are all ascertainment rather than statistical method: (a) claims-based ascertainment
  misses undiagnosed dementia (Alzheimer''s Association 2014, about one-third); (b) the calibrated cutoff
  method underpredicts dementia prevalence at 85+ by 4.8 points, which they show explains Hale 2020 (24%
  men, 37% women) and Cha 2024; (c) estimates from measured status some months before death miss progression
  in the final months (Fishman 2017, 24% for 70-year-old men); and (d) older Framingham cohorts had LOWER
  life expectancy, so more members died young where dementia risk is low, which they name explicitly as
  a reason Seshadri 1997 and Seshadri & Wolf 2007 are low. Every one of those four mechanisms biases DOWNWARD,
  which means the 13.8% from Chene 2015 that this shard also carries is very likely a floor rather than
  a central estimate. See the dementia_denominator_reconciliation block in baseline_risks.yaml for all
  five estimates converted to a common index age of 19.'
