rob:
  tool: ROBINS-I
  judgement: high
  notes: UK Biobank is a healthy-volunteer cohort with about 5% response, middle-aged at baseline, so
    it is not representative and contains no adolescents. The composite sleep score conflates duration
    with insomnia, snoring and chronotype, so the exposure is not sleep restriction. Self-reported at
    a single time point. Conditions on survival at age 40, which is not the subject's index age.
funding: null
notes: Also reports, among men, 3.84 [0.61-8.59] CVD-free years lost with clinical insomnia and 6.73 [5.31-8.48]
  with sleep-related breathing disorders; those are diagnosed disorders, not restriction, and are not
  extracted.
