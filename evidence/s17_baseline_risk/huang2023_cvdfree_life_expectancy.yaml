  quote: We observed a gradual loss in CVD-free life expectancy toward poor sleep such as, compared with
    healthy sleepers, poor sleepers lost 1.80 [95% CI 0.96-2.75] and 2.31 [1.46-3.29] CVD-free years in
    females and males, respectively, while intermediate sleepers lost 0.48 [0.41-0.55] and 0.55 [0.49-0.61]
