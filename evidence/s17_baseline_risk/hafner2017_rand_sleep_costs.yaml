  quote: Insufficient Sleep Increases Mortality Risk by up to 13 Per Cent Investigating the link between
    sleep duration and mortality we find that at any given point in time, an individual that sleeps on
    average less than six hours per night has a 13 per cent higher mortality risk than an individual sleeping
    between seven and nine hours, which is considered as the healthy amount of sleep. Furthermore, an
    individual sleeping between six and seven hours per night has a 7 per cent higher mortality risk.
