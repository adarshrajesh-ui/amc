rob:
  tool: ROBINS-I
  judgement: critical
  notes: The 13% and 7% figures are ASSOCIATIONS imported from prior observational meta-analyses of self-reported
    sleep duration and then treated as causal inside a macroeconomic model, with no sensitivity analysis
    for reverse causation and no confidence intervals reported. No adolescent or young-adult stratum.
    The report's primary outputs are GDP, working days and employment, not health.
funding: RAND Corporation / Vitality Group (per report)
notes: 'THE MOST COMMONLY MISCITED SOURCE IN THIS DOMAIN. RAND DOES NOT PUBLISH A LIFE-EXPECTANCY OR QALY
  ESTIMATE for short sleep; anyone citing it for ''years of life lost to short sleep'' is misciting it.
  Its US findings are: economic cost $280-411 billion per year (1.56-2.28% of GDP, 2015 prices) and about
  1.23 million working days lost annually, quoted verbatim as ''sustains by far the highest annual economic
  loss (between $280 billion and $411 billion currently, depending on the scenario) due to the size of
  its economy, followed by Japan (between $88 billion and $138 billion)''. rand.org returns HTTP 403 to
  automated clients, so the text was retrieved from the PubMed Central copy of the Rand Health Quarterly
  reprint (PMC5627640); the report has no DOI, so that field is null rather than guessed, and verification
  is via PubMed.'
