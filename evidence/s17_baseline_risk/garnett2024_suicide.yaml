  notes: 'Complete national death registration; ICD-10 U03, X60-X84, Y87.0. Known limitations: suicide
    is undercounted because some deaths are certified as undetermined intent or unintentional poisoning;
    the 15-24 band is wider than the subject''s exposure window; rates are crude within the band and the
    20-24 rate is substantially higher than the 15-19 rate (27.9 vs 17.3 per 100,000 in 2018, the last
    year the Health United States series publishes the 5-year split).'
funding: US federal (CDC/NCHS)
notes: 'Time series for males 15-24, deaths per 100,000: 2018 22.7, 2019 22.0, 2020 22.4, 2021 23.8, 2022
  21.1 (Figure 3 data table, extracted programmatically from the PDF). CORROBORATION for 2023: NIMH''s
  suicide statistics page, Figure 2 (''crude rates of suicide within sex and age categories in 2023'',
  sourced to CDC WISQARS/NVSS), gives 21.2 per 100,000 for males aged 15-24 and 5.5 for females, i.e.
  essentially unchanged from 2022. That page is an aggregator, so the 2022 figure from this primary NCHS
  report is the one recorded above.'
