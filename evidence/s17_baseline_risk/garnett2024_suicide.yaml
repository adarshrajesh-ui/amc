  direction_note: higher = larger share. THE CAUSE FRACTION f(x) required by competing_risk_method.md
    section 1.4 for turning a suicide-specific hazard ratio into months of life expectancy. Suicide is
    roughly a fifth of all young-male mortality, so a psychiatric-channel hazard ratio is not a small
    perturbation at these ages, and because a death at 19 destroys the entire 57.66-year remaining life
    expectancy, this is the highest-leverage mortality pathway in the model.
