rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Within-subject baseline/restriction/recovery design with PSG and quantitative EEG - appropriate for the question and still the canonical reference. Concerns: sample size is not stated in the retrievable abstract ('young subjects'), so n is null and every effect is unweightable; only 2 restriction nights; 1990-era visual stage scoring; no memory or cognitive outcome at all; and no numeric magnitudes or test statistics recoverable without the full text, which is paywalled at Elsevier with no PMC deposit."
funding: "not stated in retrieved abstract"
notes: |
  ROLE: this is the ADULT, non-adolescent replication of the central architecture finding, and the oldest.
  Every other architecture record in this shard is in 9-19 year olds (campbell2021, ong2016, lo2016,
  kopasz2010, skorucak2021, reynolds2018, voderholzer2011). If SWS preservation under restriction were an
  adolescent peculiarity, the whole architecture argument would not transport to our 18-year-old as he
  ages. It is not: the same dissociation appears in young adults in Zurich in 1990.

  THE DESIGN DETAIL THAT MATTERS MOST, and the reason I promoted this from the exclusion list: sleep was
  "restricted ... to the first 4 h of the habitual bedtime period." That is restriction by cutting the
  END of the night, which is exactly how our subject's 5-6 h weeknights were produced (fixed school wake
  time, bedtime not correspondingly advanced). Most restriction protocols do the same, but few state it
  so explicitly. It matters because of the Stickgold late-REM argument in
  architecture_under_restriction.md section 4c: cutting the last hours removes late REM specifically. This
  study confirms that under exactly that manipulation REM falls while SWS minutes do not.

  THREE FINDINGS THAT PRE-DATE AND CORROBORATE THE MODERN RECORDS:
  (1) SWS minutes preserved, stages 1-2 and REM reduced - the same dissociation as every adolescent study
      in this shard, at the same 4 h dose as kopasz2010.
  (2) Slow wave ENERGY was nonetheless reduced while SWS minutes were not. This is campbell2021's
      sigma-energy lesson thirty years earlier and in a different frequency band: minutes and spectral
      energy dissociate, and the minutes ledger is the less sensitive one.
  (3) Sigma-band (13-16 Hz) power was REDUCED DURING THE RECOVERY NIGHTS. This is directly relevant to
      requirement 5. If the spindle band is still suppressed on recovery nights after total sleep time has
      been restored, then a weekend of catch-up sleep does not immediately restore spindle-mediated
      consolidation capacity - which is a mechanism by which our subject's 7-8 h weekends would fail to
      fully repair five preceding restricted nights. I flag this as suggestive only: it is one 1990 study,
      n unknown, no memory outcome, and the finding is scattered across different stages on different
      recovery nights rather than being a single clean effect.

  ALL FOUR EFFECT VALUES ARE PLACEHOLDERS ENCODING DIRECTION, NOT MEASURED QUANTITIES. The abstract
  reports every result qualitatively ("reduced", "not significantly affected", "showed a rebound") with no
  minutes, no test statistics and no dispersion. I have set se: null throughout and used 0.0/+1.0/-1.0
  purely to carry sign, because the schema requires a numeric value. The pooler MUST NOT treat these as
  effect sizes. This record's function is directional corroboration and design detail; every quantitative
  architecture number in this shard comes from campbell2021, ong2016, lo2016 or kopasz2010 instead.

  RELATED RECORD NOT EXTRACTED: Brunner DP, Dijk DJ, Borbely AA. "Repeated partial sleep deprivation
  progressively changes in EEG during sleep and wakefulness." Sleep 1993;16(2):100-113,
  DOI 10.1093/sleep/16.2.100, PMID 8446828 (identifier verified). It extends the same protocol to 4 nights
  of 4 h TIB. I screened it and did not extract it because it duplicates this record's architecture content
  without adding a memory outcome or recoverable magnitudes; see screening_log.md.
shard: "s03_memory_consolidation"
