rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Systematic review with prespecified inclusion criteria, 25 unique studies, 42 outcome measures synthesised into 29 between-group comparisons. Cannot assess further from the abstract alone: the retrievable abstract does not report confidence intervals, heterogeneity (I^2 or tau^2), or any publication-bias assessment for any of the four pooled estimates. Given that every other meta-analysis in this shard that DID test for publication bias found it (berres2021, kumral2023, panrickard2015, rickard2022), the absence of a reported bias assessment here should be treated as a material gap rather than as reassurance. The design is also sleep-vs-wake rather than dose-response."
funding: "not stated in retrieved abstract"
notes: |
  WHY IT IS HERE: vocabulary acquisition is the closest laboratory analogue to what a student actually
  does at school, and this is the only meta-analysis restricted to that domain. It corroborates
  berres2021's episodic-memory estimate (g = 0.44 uncorrected) with an independent literature and a
  similar magnitude (g = 0.50), which is useful convergent evidence on the size of the sleep benefit for
  verbal declarative material.

  WHY IT CANNOT BE USED DIRECTLY FOR OUR SUBJECT, and this applies to berres2021 too. The contrast is
  SLEEP VERSUS TOTAL WAKEFULNESS - typically a night of sleep against a matched day awake. Our subject
  slept 5-6 h every weeknight; he did not stay awake. A g of 0.50 for "some sleep vs no sleep" says
  almost nothing about the marginal value of the third-to-eighth hour, which is the quantity the model
  needs. Treat this as an upper bound on what ALL of a night's sleep contributes to verbal learning, and
  note that the architecture evidence (architecture_under_restriction.md) says a 5-6 h night retains the
  large majority of SWS and therefore most of whatever mechanism generates this benefit. Reading g = 0.50
  as the per-night learning loss from restriction would overstate the harm by a wide margin.

  THE INTERNAL GRADIENT IS THE INTERESTING PART: g = 0.57 for recall, 0.52 for recognition, 0.39 for
  lexical integration. The sleep benefit is largest for retrieving the item and smallest for having
  genuinely integrated it into the lexicon. Channel (c) is about knowledge that was never properly
  assimilated, so the 0.39 figure is the more appropriate anchor of the three, and it is the smallest.

  ACCESS: abstract only. Paywalled at Springer with no PMC deposit (checked Europe PMC: isOA = N,
  inEPMC = N, no PMCID). All four point estimates are quoted verbatim from the structured abstract, but
  no CIs, SEs or heterogeneity statistics are recoverable, so all three effects carry se: null. Retrieving
  the full text to recover CIs and any funnel-plot analysis is a worthwhile follow-up but lower priority
  than the cousins2018 full text.
