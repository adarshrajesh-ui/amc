rob:
  tool: AMSTAR-2
  judgement: low
  notes: "34 articles / 88 experimental groups / 1,296 subjects; random-effects meta-regression with pre-specified moderators. This is a critical/deflationary meta-analysis whose whole point is that the naive pooled effect is confounded; the authors' own preferred conclusion is the null."
funding: "not stated in retrieved text"
notes: |
  THIS RECORD EXISTS TO CONSTRAIN, NOT TO SUPPORT, THE PROCEDURAL-LEARNING-LOSS CHANNEL.
  Verbatim conclusion: "With those variables accounted for, there was no evidence that sleep enhances
  learning. Thus, the literature speaks against, rather than for, the enhancement hypothesis. Overall
  there was relatively better performance after sleep than after wakefulness, suggesting that sleep
  may stabilize memory. That effect, however, was not consistent across different experimental
  designs. We conclude that sleep does not enhance motor learning and that the role of sleep in the
  stabilization of memory cannot be conclusively determined based on the literature to date."

  Aggregated post-delay gain across wake and sleep groups combined was d = 0.83, p < .0001,
  95% CI [0.61, 1.05]; the wake-minus-sleep contrast on that measure was d = -0.64.

  The downstream model should NOT treat procedural/motor consolidation loss as an established channel
  of the same standing as declarative loss. Pair this record with rickard2022 (PET/PEESE reanalysis of
  these same 88 effect sizes, which drives the corrected post-sleep gain negative) and with schmid2020
  (an independent meta-analysis that reaches the opposite headline, g = 0.43 [0.31, 0.55]). Three
  meta-analyses of overlapping literatures disagree about sign and significance; that disagreement is
  itself the honest input.

  Full text of the accepted manuscript retrieved from psycnet.apa.org (2015-13570-001.pdf); all quoted
  statistics read from that document. Identifiers verified via Crossref and PubMed.
shard: "s03_memory_consolidation"
