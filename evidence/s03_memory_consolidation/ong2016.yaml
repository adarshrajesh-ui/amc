  notes: "Randomised parallel groups; PSG on 2 baseline, 3 manipulation and 2 recovery nights; groups equivalent at baseline on all sleep macro-structure measures except WASO (12 min longer in the SR arm, P = 0.005); AASM scoring by trained technicians; strict artefact criteria (35 of 336 records excluded). Objective outcomes. Single site."
