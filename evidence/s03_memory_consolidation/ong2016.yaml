notes: |
  BEST POPULATION MATCH IN THE ARCHITECTURE LITERATURE. n = 55 (SR n = 29, Control n = 26), 25 male,
  mean age 16.6 +/- 1.0 y. pct_female recorded as 54.5 = (55-25)/55.

  The sample's habitual sleep is the subject's own pattern. Verbatim: "even in our sample of adolescents
  who had a habitual TIB of approximately 6 h on school weekday nights (Table S1) SWS duration and SWA
  were robustly maintained." And from the abstract: "Fifty-five healthy adolescents (25 males, age = 15-19
  y) who reported habitual TIBs of approximately 6 h on week nights (group average) but extended their
  sleep on weekends". That is a near-exact description of the subject's weekday/weekend pattern.

  KEY QUALIFICATION THE AUTHORS THEMSELVES DRAW - do not read the SWS null as reassurance:
  "In spite of preservation of SWS duration over multiple nights of sleep restriction, adolescents
  accustomed to curtailing nocturnal sleep on school day nights evidence residual effects on sleep
  macro-structure, even after three nights of recovery sleep. Older teenagers may not be as resilient to
  successive nights of sleep restriction as is commonly believed."

  RELEVANCE TO WEEKEND CATCH-UP. The subject sleeps 7-8 h at weekends and occasionally 10-11 h. This study
  gave three consecutive 9 h recovery nights - more generous than a real weekend - and REM, N2 and TST were
  still above baseline at the end of it. A two-night weekend is therefore unlikely to fully clear a
  five-night weekday debt, which supports treating the subject's exposure as chronically unrepaid rather
  than weekly-reset.

  Also relevant to the encoding channel: within the first 5 h of sleep (a window common to both arms), the
  restricted group showed INCREASED SWS and REM relative to baseline - "Considering only the first 5 h of
  sleep opportunity, SR participants had reduced N1 duration and wake after sleep onset (WASO), and
  increased total sleep time (TST), rapid eye movement (REM) sleep, and slow wave sleep (SWS) relative to
  baseline." So sleep is compressed and intensified, not simply truncated.

  Companion papers on the same cohort: lo2016 (cognition), huang2016 (vocabulary learning). Same programme
  as cousins2018. cohort_family = NeedForSleep_Singapore on all; do NOT treat as independent replications.

  Full text via PMC4863211. Identifiers verified via Crossref and PubMed.
