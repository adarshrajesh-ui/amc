rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "48 studies, random-effects with Hartung-Knapp adjustment and inverse-variance weighting, Q and I2 reported, Egger test and funnel plots examined. Downgraded to moderate because the finger-tapping literature it pools is the same literature that Pan & Rickard (2015) and Rickard et al. (2022) show to be affected by gain-score averaging artefacts and severe publication bias; Schmid et al. do not apply those specific moderator corrections."
funding: "not stated in retrieved text"
notes: |
  n recorded as 1654 = 829 sleep-group participants + 825 wake-group participants (53 groups each).

  DIRECT CONFLICT WITH panrickard2015 AND rickard2022, on partly overlapping primary literature.
  Schmid et al. conclude "the meta-analysis substantiates that sleep generally benefits the
  consolidation of motor memories" (g = 0.43); Pan & Rickard conclude "sleep does not enhance motor
  learning"; Rickard et al. (2022) find the bias-corrected post-sleep gain is negative. The downstream
  model must not silently pick one. My recommendation: treat the procedural/motor consolidation channel
  as having a wide prior centred near g ~ 0.2 with substantial mass at zero, rather than at 0.43.

  Most decision-relevant single number in this record for our subject is NOT the headline: it is the
  deprivation-design subgroup, g = -0.11, 95% CI [-0.66, 0.43]. When sleep is experimentally taken away
  (rather than sleep-vs-wake timing being contrasted), the motor consolidation benefit vanishes in this
  same dataset.

  Statistics read from the publisher full text (ScienceDirect S0149763420304978). Identifiers verified
  via Crossref and PubMed.
