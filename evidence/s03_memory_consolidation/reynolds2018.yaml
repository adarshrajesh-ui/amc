notes: |
  INCLUDED AS THE SPINDLE-MECHANISM CORROBORATION AT THE SUBJECT'S DOSE. campbell2021 shows a large sigma
  loss at 7 h TIB in 10-16 year-olds; this record shows a fast-spindle amplitude reduction at 5 h TIB in
  15-17 year-olds. Together they support treating spindle activity, rather than SWS minutes, as the
  architecture variable that actually moves at 5-6 h.

  IMPORTANT DISAGREEMENT, reported rather than smoothed over. Campbell et al. explicitly flag that this
  study did NOT find a spindle effect at the milder dose: "Contrary to the large sigma activity reduction
  found with the 7 h TIB condition in our study, Reynolds et al. did not find a spindle difference between
  participants keeping 7.5 and 10 h TIB schedules. The contradiction may be related to the older age,
  15-17 years, of their participants." Two readings, and I cannot adjudicate between them:
    (a) the spindle effect requires a dose more severe than 7.5 h, appearing only at 5 h - in which case
        the subject's 5-6 h weekdays are inside the affected range but his 7-8 h weekends are not; or
    (b) older adolescents are less spindle-susceptible than 10-16 year-olds, in which case campbell2021's
        -40% sigma figure overstates what an 18-year-old would experience.
  Reading (b) would attenuate the whole spindle mechanism for this specific subject. This is a real
  unresolved threat to the mechanism I recommend in architecture_under_restriction.md, and the downstream
  model should widen uncertainty accordingly rather than adopt -40% as a point estimate.

  ALSO NOTE the direction is not uniformly bad: amplitude fell but duration ROSE. Whether the net effect on
  consolidation throughput is negative is not established by this study, which measured no memory outcome.

  ACCESS LIMITATION: abstract only (paywalled at Elsevier; no PMC record). This is why the single effect is
  recorded as a direction with se: null. Population fields are taken from the shared protocol reported in
  skorucak2021 (34 adolescents, 20 male, 15-17 y, mean 15.91 SD 0.86), since the two papers analyse the
  same participants; flagged here because strictly speaking the age/sex breakdown is imported from the
  companion paper rather than read from this abstract.

  cohort_family = Adelaide_adolescent_sleep_dose, shared with skorucak2021 and with Short et al. 2018
  (PMID 29325109). DO NOT treat as independent of skorucak2021 - it is the same 34 participants.
shard: "s03_memory_consolidation"
