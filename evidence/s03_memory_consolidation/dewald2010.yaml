rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Large pooled samples and pre-specified moderators, but the underlying studies are cross-sectional with self-reported exposure, so confounding by socioeconomic status, conscientiousness, mental health and workload is essentially uncontrolled. Tier set to T5 accordingly. The authors themselves call for longitudinal and experimental work. The abstract does not report I2, tau2 or CIs, so my CIs are large-N approximations only."
funding: "not stated in retrieved abstract"
notes: |
  THIS RECORD IS A DOWNWARD ANCHOR AND SHOULD BE USED TO DISCIPLINE THE OTHERS.
  The laboratory studies in this shard report standardised effects around g = 0.9 for 5 h TIB on memory
  outcomes (cousins2018, huang2016). This meta-analysis of 15,199 school-age children finds that habitual
  sleep duration correlates with actual school performance at r = 0.069 - roughly d = 0.14, i.e. about a
  sixth of the laboratory effect. Any estimate of channel (c) that implies a large real-world academic
  deficit has to explain why the population-level association is this weak.

  Candidate reconciliations the downstream model may want to consider, none of which I can adjudicate:
  (i) self-reported sleep duration is a noisy exposure measure and attenuates the true association -
      note that okano2019, using objective actigraphy, found r = 0.38 for the same construct, a five-fold
      larger correlation;
  (ii) school grades are a coarse, ceiling-prone outcome relative to laboratory recall tests;
  (iii) laboratory doses (5 h TIB imposed) are more extreme than typical population variation;
  (iv) compensatory behaviour (re-study, spacing) offsets the encoding deficit in real settings, which is
      exactly what huang2016 demonstrated experimentally.

  Reconciliation (i) is well supported by the direct contrast with okano2019 and is my preferred reading:
  the observational literature on self-reported sleep almost certainly understates the effect. But the gap
  between r = 0.069 and r = 0.38 is itself a measure of how uncertain this whole channel is.

  Moderator finding worth carrying: "Effect sizes were larger for studies including younger participants
  which can be explained by dramatic prefrontal cortex changes during (early) adolescence. Concerning the
  relationship between sleep duration and school performance age effects were even larger in studies that
  included more boys than in studies that included more girls, demonstrating the importance of differential
  pubertal development of boys and girls." The subject is male, which per this moderator is the
  higher-susceptibility group; but he is at the older end of adolescence, where effects were smaller.

  ACCESS LIMITATION: abstract only (paywalled at Elsevier, no PMC record). All three pooled r values are
  quoted verbatim from the abstract; the CIs are my own large-N approximations and are marked
  inferred_from_ci: true. The abstract reports no heterogeneity statistics.
shard: "s03_memory_consolidation"
