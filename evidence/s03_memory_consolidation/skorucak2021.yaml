rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Allocated in blocks of four to 5 / 7.5 / 10 h arms, so n ~ 11-12 per arm - small. Participants blinded to their nightly sleep opportunity until study end, which is a real strength. Nine consecutive nights of laboratory PSG in a sound-attenuated, time-free, light-controlled facility. Bayesian analysis with pre-specified ROPEs. Downgraded only for per-arm n; outcomes are objective."
funding: "not stated in retrieved text"
notes: |
  INDEPENDENT REPLICATION of the SWS-preserved / REM-cut pattern at the subject's 5 h dose, from a
  different continent and laboratory than ong2016 (Adelaide/Flinders + Brown vs Duke-NUS Singapore).
  This matters because the two Need for Sleep records and the two Freiburg records are each internally
  correlated; skorucak2021 and campbell2021 are the genuinely independent confirmations.

  pct_female recorded as 41.2 = (34-20 male)/34. Note: same 34-participant protocol as reynolds2018 (sleep
  spindles) and as Short et al. 2018 "Estimating adolescent sleep need using dose-response modeling"
  (PMID 29325109, DOI 10.1093/sleep/zsy011), which reports the cognitive/sleepiness outcomes and estimates
  adolescent sleep need at ~9 h (and 9.35 h to keep PVT lapses optimal). cohort_family set to
  Adelaide_adolescent_sleep_dose across these; do not double-count.

  Sample was healthy good sleepers with habitual sleep >= 8 h and weekday-weekend bedtime discrepancy
  < 2 h. This is a POORER match to the subject's habitual pattern than ong2016, whose participants
  habitually slept ~6 h on school nights. The subject resembles the Ong sample, not this one, so if
  chronic prior restriction alters the homeostatic response then this study would understate it.
  The authors address exactly that possibility and find no adaptation.

  Cross-study corroboration the authors provide, useful for the architecture file: "Our findings are in
  agreement with Ong et al., who investigated effects of chronic sleep restriction in adolescents ... in
  the 3 recorded nights there was a significant increase of mean SWA in the restriction group compared to
  both the 9-h control group, and to baseline (around 25 %). They also observed a decrease in SWE (termed
  total SWA) in the restriction group compared to the control group and compared to baseline (around
  15-20%), which is in accordance with our results." And: "Campbell et al. did not observe any differences
  in SWA and SWE between 7, 8.5 and 10 h of TIB on the final night of a 4-night protocol."

  IMPORTANT ASYMMETRY BETWEEN SWS MINUTES AND SLOW-WAVE ENERGY. SWS *duration* was preserved, but
  slow-wave *energy* (SWE, the integral of SWA across the night) fell below baseline at 5 h TIB:
  "SWE during experimental nights was below baseline, as expected, for the 5-h condition, indicating
  insufficient dissipation of sleep pressure during a shortened sleep opportunity". So even the
  slow-wave system is not fully compensated at 5 h - only its staged duration is. This is a second
  reason (alongside the spindle loss in campbell2021) not to read stage minutes as sufficient.

  Full text retrieved from the publisher; Table 1 and Supplementary Figure S2 did not render, so three of
  the four effects above are recorded as directions rather than magnitudes, with se: null. No dispersion
  was invented.
