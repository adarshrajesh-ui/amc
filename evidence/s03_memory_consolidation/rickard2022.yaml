    direction_note: >-
      READ THE NOTES BEFORE USING THIS NUMBER. 0.0 is NOT a point estimate reported by the paper. It
      encodes the paper's own stated inferential conclusion, namely that the bias-corrected post-sleep
      gain was negative and statistically indistinguishable from the post-wake gain. The authors give no
