    quote: "The estimated postsleep gain was negative, suggesting forgetting rather than facilitation, and it was statistically indistinguishable from the estimated postwake gain. ... We conclude that there is substantial publication bias, that there is no consolidation-based, absolute performance gain following sleep, and that strong conclusions regarding the hypothesis of less forgetting after sleep than after wakefulness should await further research."
rob:
  tool: AMSTAR-2
  judgement: low
  notes: "PET and PEESE weighted-regression reanalysis of the 88 effect sizes assembled by Pan & Rickard (2015), with and without established moderators. Methodologically appropriate for the question asked. Not an independent literature: it reanalyses the panrickard2015 dataset, so it must NOT be pooled alongside panrickard2015 as if independent."
funding: "not stated in retrieved text"
notes: |
  DO NOT DOUBLE-COUNT: this is a reanalysis of the same 88 effect sizes as panrickard2015. Use one or
  the other, or treat the pair as a single deflationary line of evidence. Both share cohort_family
  in the sense of sharing primary studies with schmid2020 as well.

  Included in this shard specifically so the downstream model does not over-credit the procedural/motor
  arm of the learning-loss channel. Verbatim: "Basic PET analysis indicated pronounced publication bias;
  that is, the effect sizes were strongly predicted by their standard error. When variables that have
  previously been shown to both moderate the sleep gain effect and substantially reduce unaccounted for
  effect size heterogeneity were included in that analysis, evidence for publication bias remained
  strong."

  ACCESS LIMITATION: abstract only (paywalled; no PMC record, not in Europe PMC full text). The numeric
  PET/PEESE intercepts are in the full text and I could not retrieve them. This is a real gap: it means
  the strongest deflationary estimate in my domain is the one I can quantify least well.
shard: "s03_memory_consolidation"
