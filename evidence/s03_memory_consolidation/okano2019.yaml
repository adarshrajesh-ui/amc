rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Strengths: objective wearable actigraphy for a full 14-week semester with 89.4% mean device usage; outcome is real graded coursework, not a laboratory proxy; no TA effect on grades (F(10,77) = 1.82, p = 0.07). Weaknesses that matter a great deal: purely observational and unadjusted - no control for conscientiousness, prior attainment, workload, mental health, or substance use, any of which could drive both short sleep and poor marks. Single course at a single highly selective institution. R2 = 0.24 must not be read causally."
funding: "not stated in retrieved text; MIT Integrated Learning Initiative"
notes: |
  THE BEST AVAILABLE EVIDENCE FOR REQUIREMENT 6, WITH ONE IMPORTANT SUBSTITUTION. The brief asked for
  longitudinal evidence linking ADOLESCENT sleep duration to knowledge accumulation over a SCHOOL YEAR.
  What exists at this quality is a COLLEGE cohort over a SEMESTER. I did not find an objective-exposure
  study of a full school year in secondary-school adolescents; see station_report.md. The substitution is
  arguably favourable for transportability, since the subject is an 18-year-old entering his second year
  of college - this cohort is his exact population - but it is a shorter accumulation window than asked for.

  WHY THIS RECORD IS STRUCTURALLY IMPORTANT, beyond its effect sizes. It contains a within-study
  dissociation that no laboratory study in this shard can provide: sleep on the night before an assessment
  was unrelated to the mark, while sleep over the preceding week and month was clearly related. That is
  precisely the (a) versus (c) separation the downstream model is being asked to make. It argues that in
  real academic settings the operative pathway is failure to acquire material during the learning period,
  not impaired performance on the day.

  Supporting timing/consistency results: mean bedtime 1:54 a.m., mean wake 9:17 a.m.; earlier bedtime
  correlated with higher score (r(86) = -0.45, p < 0.0001) and earlier wake time likewise
  (r(86) = -0.35, p < 0.001); mean semester sleep quality correlated r(86) = 0.44, p < 0.00005
  (95% CI [0.254, 0.595] by Fisher z, my computation).

  Sex differences reported: females had better sleep quality (t(88) = 2.63, p = 0.01) and less
  inconsistency (t(88) = 2.18, p = 0.03) but no difference in duration (t(88) = 1.03, p = 0.3). Relevant
  because the subject is male: sleep inconsistency predicted marks in males (r(41) = -0.44, p = 0.003)
  but not in females (r(43) = -0.13, p = 0.39), and the authors conclude "it is important for males to
  stick to a regular sleep schedule in order to perform well in academic performance but less so for
  females." If that sex moderation is real, the subject's irregular schedule is a worse exposure for him
  than the pooled estimate implies. Treat as exploratory subgroup evidence.

  followup_years recorded as 0.27 (14-week semester). dose_h recorded as 7.13 = the cohort mean of
  7 h 8 min, for reference only - this is a continuous-exposure cohort, not a contrast.

  Full text via PMC6773696. Identifiers verified via Crossref and PubMed.
shard: "s03_memory_consolidation"
