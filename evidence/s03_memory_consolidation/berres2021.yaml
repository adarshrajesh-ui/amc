rob:
  tool: AMSTAR-2
  judgement: low
  notes: "Pre-registered-quality methods: 823 effect sizes / 271 independent samples / 177 articles 1967-2019; three-level model with robust variance estimation; sensitivity analyses over rho .10-.90; two independent selective-reporting corrections (modified Egger, 3PSM). Main residual concerns: (a) heterogeneity is substantial, (b) the authors themselves warn RVE heterogeneity statistics are unreliable, (c) median n per condition is only ~16 in the primary literature."
funding: "not stated in retrieved text"
notes: |
  TASK-SEED CORRECTION: the shard brief asked for a 'Psychological Bulletin meta-analysis by Berres
  and Erdfelder (approx 2021) on the sleep benefit for DECLARATIVE memory'. The paper exists and the
  year is right, but its actual construct is EPISODIC memory, not declarative memory broadly. Recorded
  as published.

  Heterogeneity (verbatim from the Table 2 note): "Heterogeneity statistics of the intercept-only
  three-level model without RVE: Q(822) = 1878.56, p < .001; tau^2 = 0.15; sigma_b^2 = 0.12;
  sigma_w^2 = 0.02; It^2 = 60.00%; Ib^2 = 50.30%; Iw^2 = 9.70%; ICC = .84." Across the 20 independent
  subsets analysed with the three-parameter selection model the median tau^2 was 0.11 (range
  0.02-0.47) and the median corrected effect was beta = 0.41 (range 0.05-0.79).

  IMPORTANT SCOPE LIMIT for the downstream model: this meta-analysis quantifies the benefit of
  sleeping versus staying awake across a retention interval. It does NOT quantify the effect of
  sleeping 5-6 h instead of 8-9 h. Its three sleep-parameter moderator analyses (TST, SWS, REM,
  recorded above) are the closest available evidence on graded dose, and all three are null. Treat
  g = 0.44 as an upper anchor for the total size of the consolidation channel (full night vs no
  night), not as the effect of the subject's partial restriction.

  Full text obtained via the authors' accepted preprint of the same paper (Shakoor/Berres & Erdfelder,
  DOI 10.31234/osf.io/r2an6), which carries an identical abstract and identical reported statistics;
  all quoted statistics above were read from that document and the published record was verified via
  Crossref and PubMed.
shard: "s03_memory_consolidation"
