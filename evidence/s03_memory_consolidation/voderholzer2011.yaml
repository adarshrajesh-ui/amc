rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomised across five TIB arms with controlled conditions excluding daytime sleep, adherence verified by diary and actigraphy, PSG confirmation of the manipulation - a strong design. Downgraded to some_concerns for the purpose it is used here because with 88 participants across FIVE arms the per-arm n is ~17-18, so this is an underpowered null: it cannot exclude the g ~ 0.9 effect that cousins2018 reports. Absence of evidence, at limited precision."
funding: "not stated in retrieved abstract"
notes: |
  REPORTING REALITY, AS THE INSTRUCTIONS REQUIRE. The shard brief presumes consolidation was impaired
  during three years of schooling. This study is the best-designed direct test of that presumption at
  the subject's dose in the subject's age band, and it is NULL - including at a 4-week follow-up.
  It must not be suppressed.

  Verbatim summary of the authors' interpretation: "The results suggest that adolescents show a high
  resilience of memory consolidation to substantial sleep curtailment across four nights that might be
  promoted by increased sleep intensity under conditions of sleep restriction."

  This is the ONLY randomised study I located that covers the subject's exact 6 h weekday dose as a
  discrete arm (arms at 9, 8, 7, 6, 5 h).

  CRITICAL DESIGN DIFFERENCE FROM cousins2018 - this reconciles the apparent contradiction and the
  downstream model should encode it. Here, encoding happened BEFORE the restriction period ("Declarative
  (word-pair task) and procedural memory (mirror tracing task) encoding was assessed prior to the sleep
  restriction protocol"), so the study tests whether restricted sleep degrades CONSOLIDATION of
  already-encoded material. In cousins2018 the restriction came BEFORE encoding, testing whether
  restricted sleep degrades the CAPACITY TO ENCODE. The two studies are therefore not in direct conflict:
  read together they suggest the damage in partial restriction sits on the ENCODING side rather than the
  post-encoding consolidation side. That is a substantive, decision-relevant distinction for channel (c),
  and it is consistent with yoo2007 (deprivation before learning) and with the huang2016 finding that
  material re-encountered repeatedly (spaced) was spared.

  ACCESS LIMITATION: abstract plus the ScienceDirect landing page only; per-arm means, SDs and the PSG
  stage tables are paywalled. Three of the four effects above are therefore recorded as reported nulls
  with se: null. This shard did NOT invent dispersion for them.

  SECONDHAND FIGURE NOTED BUT NOT USED: a review page retrieved alongside the article characterises this
  trial as "27 adolescents (M age, 15 +/- 0.9 y) ... 5-h sleep restriction group (n = 15) than in the
  control group (8 h) (n = 12)". Those numbers conflict with the primary abstract's 88 participants across
  five arms and presumably refer to a PSG subsample or to a different report. I have recorded the primary
  abstract's figures only and flag the discrepancy rather than reconciling it without the full text.
shard: "s03_memory_consolidation"
