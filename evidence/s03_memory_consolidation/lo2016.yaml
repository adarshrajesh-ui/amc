rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomised parallel-group residential protocol with PSG verification of the dose - strong on exposure measurement. Concerns: (i) the headline claim rests on a difference in significance between two within-arm tests while the formal three-way interaction was null (F(2,42) = 0.90, P = 0.41), which is a recognised inferential error; (ii) the published Cohen's d values are internally inconsistent (see notes); (iii) 45 of 56 returned for the 6-week visit, so the ANOVA is on 45; (iv) single site, no blinding possible; (v) recall means are only in figures, not tabulated."
funding: "not stated in the retrieved full text"
notes: |
  WHY THIS RECORD MATTERS: it is one of only two studies in this shard that applies the subject's exact
  weekday dose (5 h TIB) for a full week, in the subject's exact age band, with PSG confirmation, and
  measures retention of prose - i.e. material of the kind actually studied at school - out to 6 weeks.
  Together with voderholzer2011 it is the strongest available evidence AGAINST the premise that 5-6 h
  nights straightforwardly destroy declarative consolidation.

  WHAT IT FOUND, PLAINLY: no detectable difference in total prose recall between 5 h and 9 h TIB at any
  time point. What the restricted arm lost was the *growth over the week* of the advantage for material
  that had been tagged as important at encoding. In the 9 h arm that advantage strengthened between
  10 minutes and 1 week after encoding; in the 5 h arm it did not. So the damage the authors detected is
  selective - it is to the preferential consolidation of prioritised material, not to gross retention.

  PUBLISHED-EFFECT-SIZE DEFECT, IMPORTANT: the paper's printed Cohen's d values are on two different
  scales within a single sentence. For every paired contrast in the paper except one, the printed d is
  almost exactly 2 x t/sqrt(n): initial 1.35 vs d_z 0.667 (ratio 2.02), 1 week 1.69 vs 0.839 (2.01),
  6 weeks 1.68 vs 0.829 (2.03), forgetting contrasts 2.15 vs 1.066 (2.02) and 2.57 vs 1.272 (2.02), and
  the control-arm strengthening 0.99 vs 0.484 (2.04). But the SR-arm strengthening is printed as d = 0.26,
  which equals t/sqrt(n) = 0.265 exactly (ratio 0.98). The headline comparison "control d = 0.99 versus
  SR d = 0.26" therefore compares a doubled effect size against an undoubled one and overstates the
  contrast by roughly a factor of two. On a consistent d_z scale it is 0.48 versus 0.26, a difference of
  0.22 (SE 0.28, 95% CI -0.33 to 0.77) - which is exactly what the null three-way interaction
  (F(2,42) = 0.90, P = 0.41, eta_p^2 = 0.041) already implied. I have recorded the consistent d_z values
  and the modeller should use those. This is the single most important caveat attached to this record.

  ARCHITECTURE CONTRIBUTION (requirement 4): this is the cleanest exact-age-match demonstration of
  selective N3 preservation at the subject's own dose. One week of 5 h TIB shortened TST, WASO, sleep
  latency, N1, N2 and REM all at P < 0.001, while N3 was statistically unchanged on all three PSG nights
  (P = 0.23, 0.36, 0.10). The authors' own interpretation is that this preservation is protective:
  "N3 may offset detrimental effects of sleep restriction on memory" and "speaks to the resilience of
  adolescents in the context of declarative memory consolidation."

  THE FINDING THAT CUTS AGAINST A SIMPLE REM STORY: within the restricted arm, MORE REM predicted WORSE
  6-week recall (r < -0.50, P < 0.013), while more N2 predicted BETTER recall (r = 0.45 at 1 week,
  r > 0.56 at 6 weeks). If REM loss were the mechanism of consolidation failure under restriction, the
  REM correlation should be positive. It is not. The authors call this "unexpected" and caution that
  findings obtained under restriction "should be interpreted cautiously". The modeller should therefore
  NOT assume that the disproportionate REM loss documented in campbell2021/kopasz2010/skorucak2021
  translates into declarative learning loss; the mechanistic link is unsupported and here mildly
  contradicted. Note also that only the N2 correlations differed significantly BETWEEN groups
  (Fisher's Z > 2.22, two-tailed P < 0.026), so even the REM correlation is a within-arm result.

  COHORT OVERLAP WARNING: part of the Need for Sleep Study programme at Duke-NUS, the same programme as
  cousins2018, huang2016 and ong2016. cohort_family = NeedForSleep_Singapore on all of them. These are
  separate cohorts under a common protocol at the same boarding school, run by an overlapping author
  group - not independent replications. Note that cousins2018 (impairment, g = -0.89) and this study
  (no gross impairment) come from the SAME programme at the SAME dose, which localises the discrepancy
  to the outcome measured rather than to the population: cousins2018 restricted sleep BEFORE encoding
  and measured encoding capacity, whereas this study encoded BEFORE restriction and measured
  consolidation. That contrast is the central reconciliation in this shard - see station_report.md.
shard: "s03_memory_consolidation"
