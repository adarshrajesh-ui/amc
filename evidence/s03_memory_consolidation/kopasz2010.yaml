rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomised cross-over with >=3 weeks washout, laboratory PSG, tiredness controls included - a good design for the architecture measurements, which are objective. Downgraded for the memory outcome: n = 22 with a single curtailed night is underpowered, and one night is far milder than the subject's three-year exposure."
funding: "not stated in retrieved abstract"
notes: |
  DUAL-PURPOSE RECORD. Its architecture numbers are the most quotable in the whole literature; its
  memory result is a null and is reported as such.

  ARCHITECTURE: the single sentence "a curtailment of 50% of non-REM, 5% of SWS and 70% of REM sleep"
  is, as far as I can find, the cleanest published stage-by-stage decomposition of a short night in
  adolescents. Arithmetic implication the modeller should note: because non-REM as a whole fell 50%
  while SWS within it fell only 5%, virtually the entire non-REM loss is stage N1/N2. Campbell 2021
  shows sleep-spindle (sigma) activity, which is concentrated in N2, falls ~28-40% at a much milder
  7 h dose. So the "SWS is preserved" headline conceals a large loss of spindle-bearing N2.

  RECOVERABILITY: this record is evidence on the OPTIMISTIC side. One curtailed night, followed by one
  9 h recovery night, left declarative recall intact. Note also the correlational hint that the recovery
  night did work: "Recall in the paired-associate word list task was correlated positively with
  percentage of non-REM sleep in the recovery night." Contrast with stickgold2000nn, where two full
  recovery nights did NOT restore a perceptual skill, and with cousins2018, where three recovery nights
  did NOT restore encoding capacity after five restricted nights. The reconciliation that fits all three
  is dose-dependent: one bad night appears recoverable; a week of restriction before encoding does not
  appear to be. The subject's exposure is ~3 years, i.e. far past the recoverable end of that range,
  but no study tests that duration.

  Authors' interpretation, verbatim: "Declarative memory consolidation does not appear to be influenced
  by short-term sleep curtailment in adolescents. This may be explained by the high ability of
  adolescents to compensate for acute sleep loss."

  ACCESS LIMITATION: abstract only; paywalled at Wiley, no PMC record. The percentages above are quoted
  verbatim from the abstract, which is why they are usable; the underlying stage minutes are not.

  Same research group and overlapping protocol lineage as voderholzer2011; cohort_family set to
  Freiburg_adolescent_restriction on both so the pooler does not treat them as independent.
shard: "s03_memory_consolidation"
