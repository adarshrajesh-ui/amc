rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomised parallel groups (n = 14 per arm) but no blinding is possible; very small n for an fMRI group contrast; imaging contrasts thresholded at P < 0.001 uncorrected with a 5-voxel extent, which is liberal by present-day standards; the internal inconsistency in Table 1's dispersion values (see notes) is a reporting defect."
funding: "not stated in retrieved text; conducted at Beth Israel Deaconess Medical Center / Brigham and Women's Hospital General Clinical Research Center"
notes: |
  DATA-QUALITY FLAG - Table 1's dispersion values cannot be reconciled with the reported P.
  Table 1 labels its dispersion row "s.d." and gives 0.197 (SC) and 0.174 (SD) for d-prime with n = 14
  per group. I checked three readings and none reproduces the stated "unpaired t-test P < 0.031":
    (a) taking the values literally as SDs -> pooled SD 0.186, d = -2.21, implied t = 5.84, P < 0.0001;
    (b) treating them as SEMs -> implied SDs 0.737 and 0.651, d = -0.59, implied t = 1.56, P ~ 0.13;
    (c) back-computing from the reported P = 0.031 at df = 26 -> t = 2.281, d = 0.862, g = 0.837.
  I have recorded (c) as the primary effect because the instructions direct that a p-value plus n be
  used to back out an approximate SE, and because the authors' significance claim is the one datum all
  readings must respect. The downstream model should inflate uncertainty on this estimate accordingly;
  the plausible range across readings spans g ~ 0.6 to g ~ 2.2 in magnitude.

  WHY THIS STUDY MATTERS FOR CHANNEL (c) AND WHAT IT CANNOT SHOW.
  It matters because the design isolates ENCODING CAPACITY rather than test-time state: the deprivation
  happened before learning, and testing happened two days later after two full recovery nights.
  Verbatim: "In the SD group, subjects were awake during day 1, night 1 and day 2, accumulating
  approximately 35 h of total sleep deprivation before the encoding session. In the SC group, subjects
  slept normally during night 1 before the encoding session on day 2. Both groups then performed a
  recognition test (without fMRI) on day 4, after two recovery nights of sleep". So a 19% recognition
  deficit survived two recovery nights - direct evidence that the encoding window does not reopen.
  The authors also rule out simple alertness mediation: there was no group effect on encoding-trial
  response times (F1,27 = 0.93, P = 0.343) and no correlation between encoding response times and
  subsequent memory in either group. And the hippocampal deficit persisted in performance-matched
  subgroups: "contrasting upper-level performers in the SD group with the lower-level performers in the
  SC group (n = 9 in each group; d': 2.46 versus 2.48 ...), we still observed a relative decreased
  right (para)hippocampal activation in the SD group".

  What it CANNOT show: this is TOTAL deprivation (~35 h), not the partial 5-6 h restriction our subject
  experienced. Per the shard brief, total-deprivation studies are mechanistic only. Use yoo2007 to
  justify the EXISTENCE and the encoding-side location of the mechanism; use cousins2018 and huang2016
  for the magnitude at a partial-restriction dose.

  Full text obtained from the Walker lab reprint (walkerlab.berkeley.edu/reprints/Walker_NatureNeurosci_2007.pdf);
  the OCR renders "d-prime" as "d¢" and "P <" as "P o", which I have normalised in the quotes above
  without altering any numeral. Identifiers verified via Crossref and PubMed.
shard: "s03_memory_consolidation"
