rob:
  tool: ROBINS-I
  judgement: moderate
  notes: "Objective wrist-actigraphy exposure measurement with a difference-in-differences design and three concurrent comparison schools is close to the ceiling of what is achievable for a population sleep-duration question. Concerns: schools were not randomised to the policy; 455 of the ~2500 START/LEARN cohort contributed actigraphy, so the sleep sub-sample may not represent the GPA sample in james2023; attrition across three annual waves is not recoverable from the abstract."
funding: "not stated in retrieved abstract"
notes: |
  ROLE OF THIS RECORD: it is not itself a memory or learning outcome. I extracted it because it is the
  first-stage exposure measurement for james2023 - the same cohort, the same policy change, the same
  follow-up timing - and without it the year-2 GPA difference-in-differences cannot be put on a per-hour
  scale. It also independently answers a question the modeller will ask about our subject: how much sleep
  does an adolescent actually gain when the schedule constraint is relaxed?

  THE ANSWER IS "LESS THAN THE CONSTRAINT RELAXED BY": a 50-65 min later start bought 41-43 min of extra
  sleep, and this held at both one and two years. Bedtimes did not drift later ("Delayed start times were
  not associated with falling asleep later on school nights at follow-ups"), which is why the gain
  persisted. Compare dunster2018, where a 55-min delay bought 34 min. Two independent cohorts therefore
  converge on roughly 0.6-0.8 h of recoverable sleep per hour of schedule relief in this age group.

  RELEVANT TO THE WEEKEND-CATCHUP QUESTION IN OUR SUBJECT'S HISTORY: weekend sleep FELL by 34 min once
  weekday sleep rose, and this is the cleanest natural-experiment evidence I encountered that weekend
  oversleep is a compensatory response to weekday debt rather than an independent behaviour. Our subject's
  7-8 h weekends and occasional 10-11 h nights should be read as partial compensation, and the modeller
  should not treat weekday and weekend sleep as independent exposures.

  ACCESS: abstract only (JAMA Pediatrics paywall; no PMC deposit found). All three effects above are
  quoted verbatim from the structured abstract, which reports the point estimates and 95% CIs in full, so
  no numbers were lost to the paywall for the effects I extracted. I could not retrieve the sleep-stage
  or sleep-architecture breakdown, and actigraphy would not provide it anyway.

  COHORT OVERLAP WARNING: cohort_family = START_LEARN_Minnesota, shared with james2023. These are the
  exposure and outcome halves of one natural experiment and must not be pooled as independent studies.
