rob:
  tool: RoB2
  judgement: low
  notes: "Within-subject design in which every participant kept all three TIB schedules, repeated annually over 3 years; PSG on the 4th night of each schedule; age carried as a covariate throughout. Sleep-stage and spectral outcomes are objective and scorer-blind to hypothesis. Main limitation for our purposes is the dose range (shortest = 7 h TIB) and the age range (younger than the subject), not internal validity."
funding: "National Heart Lung Blood Institute HL116490; National Institutes of Health"
notes: |
  PRIMARY ARCHITECTURE ANCHOR FOR THIS SHARD. See architecture_under_restriction.md for the full
  dose-response table and the arithmetic decomposition.

  pct_female recorded as 46.8 = (77 - 41 male)/77.

  MECHANISTIC EXPLANATION, quoted because it is why the SWS-preservation result generalises rather than
  being an artefact of this protocol: "Slow-wave EEG activity is normally concentrated in the first part
  of the night. The last 3 h in bed includes very little stage N3 sleep; therefore, eliminating these 3 h
  had little effect on the total delta activity of the night." Any restriction implemented by shortening
  the back end of the night will show the same pattern.

  THE CENTRAL INTERPRETIVE POINT FOR THE MODELLER. This paper simultaneously supplies the strongest
  evidence that SWS is preserved under restriction AND the strongest evidence that this preservation is
  misleading. The authors themselves draw the second conclusion: "The larger size of the effect and the
  altered pattern of sigma power across the night would argue that the TIB reduction of sigma power is
  likely to be of greater biological significance than the small delta increase." And: "The decrease in
  sigma activity presumably reflects depressed sleep spindle activity and suggests a manner by which
  sleep restriction reduces waking cognitive function in adolescents."

  The authors are explicit that the memory consequence is untested, and this honesty should propagate into
  the model's uncertainty: "Sleep spindles have been proposed as markers of sleep-dependent memory
  processes, and/or general mental ability. Does reducing spindle activity via sleep restriction impair
  putative memory processing during sleep? Does it impair cognitive function during waking? If the answers
  are 'yes,' the large reduction in sigma energy with 3 h of TIB reduction may explain how sleep loss
  impairs daytime performance." They also note "the evidence for a relation between spindles and memory is
  not strong in children."

  NO ACCUMULATION ACROSS NIGHTS DETECTED: "A post-hoc analysis of differences in night 2 and night 4 sigma
  activity was used to determine if the sigma effect increased across the period of TIB restriction.
  Neither all night energy (F1,76 = 0.02, p = 0.87) nor power (F1,76 = 0.00, p = 0.99) in the first 5 h or
  NREM differed between nights". So the spindle deficit appears to be a stable per-night tax rather than a
  cumulative debt - relevant to how the modeller aggregates over ~3 years of school nights, and it argues
  for a per-night multiplicative rather than cumulative treatment.

  TRANSPORTABILITY CAVEATS (adolescent_match = mixed, not exact_16_19): the cohort spans 9.9-16.2 y, i.e.
  mostly younger than the 18-year-old subject, and slow-wave activity declines steeply across exactly this
  age range. The shortest dose is 7 h TIB, milder than the subject's 5-6 h. Extrapolation to 5 h relies on
  ong2016, skorucak2021 and kopasz2010.

  Full text via PMC8343600 (Table 1 read directly). Identifiers verified via Crossref and PubMed.
shard: "s03_memory_consolidation"
