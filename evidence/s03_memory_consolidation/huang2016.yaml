rob:
  tool: RoB2
  judgement: low
  notes: "Randomised parallel-group allocation made before the protocol began and concealed from participants until day 1; residential boarding-school control of the sleep schedule with actigraphy verification; groups equivalent at screening on demographics, sleep behaviour, anxiety/depression and non-verbal IQ. No blinding possible. Effect sizes must be back-computed because the paper reports mixed-model chi-square and Tukey P values rather than group means with SDs."
funding: "not stated in retrieved text"
notes: |
  n = 55 analysed (9-h TIB group n = 26, 11 males, 16.8 +/- 1.2 y; 5-h TIB group n = 29). 56 randomised
  per the abstract; the discrepancy is accounted for in the paper: of 30 originally assigned to the 9 h
  arm, 2 withdrew before the study, 1 withdrew on baseline day 2, and 1 was excluded post hoc for
  non-compliance.

  WHY THIS RECORD IS UNUSUALLY WELL MATCHED TO THE SUBJECT. The protocol is almost a literal model of
  the subject's described behaviour: adolescents at a boarding school, 5 h TIB on school nights, studying
  GRE-type vocabulary either crammed into single sessions or spaced across days, tested at 24 h and 120 h.
  The subject is described as taking "occasional 3-4 h nights before exams" - i.e. cramming under sleep
  loss - which is exactly the massed condition. Verbatim from the paper's significance statement: "Many
  adolescents are exposed to sleep restriction during school days. This behavior could have negative
  consequences for learning of skills and facts, hence eroding the value of formal education."

  THE MOST IMPORTANT NUANCE, AND IT CUTS AGAINST A LARGE UNIFORM LEARNING LOSS.
  The harm was entirely confined to crammed material. Spaced material was unaffected despite a
  cumulative 28-h sleep deficit. Verbatim conclusion: "Spaced learning conferred strong protection
  against the effects of sleep restriction on recall performance, whereas students who had insufficient
  sleep were more likely to forget items studied over short time intervals." The downstream model should
  therefore NOT apply a flat learning-loss multiplier to three years of schooling. The defensible claim
  is a loss concentrated on material the subject crammed, with spaced/repeatedly-revisited material
  largely protected. Since ordinary schooling involves substantial spaced repetition of core content,
  this argues for a materially SMALLER channel-(c) estimate than a naive reading of Yoo 2007 implies.

  A further attenuating result: after a single review session, massed-item performance recovered to the
  level of spaced items ("recall performance on massed items improved after the review session, reaching
  a similar level as for spaced items (Tukey test, P = 0.51)"). So at least some of the deficit was
  repairable by re-study - relevant to the recoverability question, and distinct from the Yoo/Stickgold
  "closed window" picture.

  AUTHORS' OWN CAVEAT on mechanism, quoted because it bears on how the modeller should label this effect:
  "The present study was not designed to tease apart the differential effects of sleep restriction on
  encoding versus memory consolidation. ... our subjects were exposed to partial sleep deprivation both
  before and after encoding of vocabulary items. ... we cannot determine with certainty which specific
  memory processes were affected by exposure to sleep restriction."

  Other statistics available for cross-checks: the spacing x TIB interaction was LR chi2 = 8.40, P < 0.01
  during the retention phase; the Set x TIB interaction across massed sets was LR chi2 = 10.71, P = 0.013
  (and LR chi2 = 8.48, P = 0.037, eta2 = 0.017 in the overnight-forgetting analysis). Neither sleep group
  showed net forgetting across the 0-120 h retention intervals.

  Full text via PMC4989257. Identifiers verified via Crossref and PubMed.
  COHORT OVERLAP: Need for Sleep Study programme; see cousins2018 notes.
