rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Strengths: prespecified PRISMA search (421 titles screened, 140 full-text, 53 included), three-level random-effects model that correctly handles multiple effect sizes per sample, extensive moderator analyses, formal publication-bias testing, and an open dataset (https://osf.io/wu6d7). Serious weaknesses that limit the pooled estimate: (i) the modified Egger test detects significant publication bias (beta = 1.64, SE = 0.53, p = 0.0020); (ii) the constituent studies are tiny - mean N = 35.66 across 53 studies, falling to 18.59 and a range of 6-44 once the single large study (N = 929) is removed; (iii) the sample-size/effect-size correlation is r = -0.175, p < 0.001, the textbook small-study-effect signature; (iv) between-study heterogeneity is moderate-to-high (I^2 level 3 = 52.75%); (v) a leave-out sensitivity analysis removing one third of the estimates overturned two of the moderator conclusions; (vi) all correlational - no study manipulates spindles and observes memory, so causality is not established."
funding: "not stated in the retrieved preprint"
notes: |
  WHY I ADDED THIS RECORD LATE AND WHY IT MATTERS: my architecture_under_restriction.md concluded that
  spindle/sigma activity, not SWS minutes, is the right exposure variable for the learning-loss channel,
  because sigma energy falls 28-40% from 10 h to 7 h TIB (campbell2021) while N3 minutes do not move at
  all. That conclusion is only useful if the spindle-to-memory coefficient is large. This is the only
  meta-analysis of that coefficient, and it shows the coefficient is SMALL. I have revised the
  architecture file accordingly. Without this record the shard would have handed the modeller a
  mechanism with an unquantified and implicitly overstated slope.

  THE ARITHMETIC THE MODELLER SHOULD DO, done here explicitly. Take the strongest defensible declarative
  estimate, r = 0.21 (headline) or r = 0.13 (unreported subset, less selection-biased). A 28-40% loss of
  all-night sigma energy is, on campbell2021's numbers, roughly a 0.5-1.0 SD reduction in spindle
  activity depending on the between-subject SD assumed. Multiplying through: 0.21 x 1.0 SD = 0.21 SD of
  declarative memory at the extreme, and 0.13 x 0.5 SD = 0.065 SD at the conservative end. So the
  spindle pathway predicts a learning-loss effect somewhere between roughly 0.07 and 0.21 SD - small,
  and an order of magnitude below the g = -0.89 that cousins2018 measures behaviourally at the same dose.
  Either the spindle pathway is not the main mechanism, or cousins2018 is capturing something else
  (most plausibly an encoding-capacity deficit rather than a consolidation deficit).

  THE BIAS PROBLEM IS SEVERE AND THE AUTHORS SAY SO. Three independent signals point the same way: the
  Egger test is significant (p = 0.0020); the sample-size/effect-size correlation is -0.175 (p < 0.001);
  and for declarative memory specifically, effect sizes that the original authors chose to publish are
  nearly twice those that had to be requested (r = 0.254 vs r = 0.131, Qm p = 0.014). The authors also
  report, and I quote them because it is the single most important sentence in the paper for our
  purposes, that a PET-PEESE reanalysis of their own public dataset by another investigator
  "reduces the correlation between sleep spindles and memory function to insignificance":

    "Using our publicly available datasets in OSF (https://osf.io/wu6d7), Ujma (2022) have recently
    computed the association between sleep spindles and memory by adjusting publication bias using a
    non-standard multivariate implementation of the above-mentioned PET-PEESE methods. He observed that
    correcting for publication bias in this way reduces the correlation between sleep spindles and
    memory function to insignificance."

  I could NOT independently verify the Ujma (2022) reanalysis - it returned no PubMed hits under author
  and topic search, and I have not retrieved it. I therefore report it only as quoted by Kumral et al.,
  not as a verified effect estimate, and I have not created a record for it. The authors dispute the
  interpretation rather than the arithmetic.

  PATTERN ACROSS THIS SHARD, worth flagging to the orchestrator: this is now the FOURTH meta-analysis in
  my domain where formal bias correction substantially or entirely removes the sleep-memory effect -
  alongside berres2021 (episodic, g = 0.44 falling to 0.28 after Egger correction), panrickard2015 and
  rickard2022 (motor sequence learning, bias-corrected post-sleep gain negative). The sleep-and-memory
  literature has a systematic small-study/selective-reporting problem, and the downstream model should
  apply a substantial discount to any pooled sleep-memory effect that has not been bias-corrected.

  POPULATION CAVEAT: healthy adults, age not a significant moderator (Qm(1) = 0.235, p = 0.628) but no
  age distribution is given, so I set adolescent_match to fair_adult. Note that the studies feeding this
  meta-analysis measure natural between-subject variation in spindles during normal sleep; none of them
  restricts sleep. Applying this coefficient to a restriction-induced spindle loss is an extrapolation
  across designs.
shard: "s03_memory_consolidation"
