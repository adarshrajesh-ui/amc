notes: |
  THIS IS THE SINGLE MOST DECISION-RELEVANT RECORD IN THIS SHARD for channel (c).
  It is the only study I found that (i) uses partial restriction at the subject's own weekday dose,
  (ii) in the subject's own age band, (iii) over multiple consecutive nights, and (iv) deliberately
  separates encoding capacity from state-dependent performance by testing after full recovery sleep.

  Design logic worth restating for the modeller: both arms had identical 9 h TIB for the three nights
  before the recognition test. Any group difference at test therefore cannot be a reversible state
  deficit (channel a) - it is knowledge that was never properly encoded during the restricted week
  (channel c). The authors additionally report that "this impairment was not correlated with decline in
  vigilance", which further dissociates it from the sleepiness/attention channel.

  ACCESS LIMITATION: abstract only. No PMC or Europe PMC full text; paywalled at Wiley. I therefore have
  the P-value and the group ns but NOT the means, SDs, or the authors' own effect size. The g = -0.89
  above is back-computed from P = 0.001 and is approximate; because the abstract reports "P = 0.001"
  rather than "P < 0.001", the back-computation should be close to exact, but the modeller should treat
  the SE as approximate. Obtaining the full text to recover the means/SDs is the highest-value
  follow-up action for this shard.

  COHORT OVERLAP WARNING: this study is part of the Need for Sleep Study programme at Duke-NUS,
  the same programme as huang2016, lo2016, ong2016 and the 2022 dose-response work of Lo et al.
  cohort_family is set to NeedForSleep_Singapore on all of them. The samples are separate cohorts run
  under a common protocol at the same boarding school, but they are NOT independent laboratories and
  the pooler must not treat them as four independent replications.
