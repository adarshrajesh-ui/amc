rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Small parallel groups (n = 11 vs 10); the headline group contrast is reported with a ONE-TAILED test, which inflates apparent significance; single perceptual task. Strengths: baseline thresholds did not differ between groups (t19 = 1.12, p > 0.2) and residual sleepiness was explicitly excluded as an explanation."
funding: "not stated in retrieved text"
notes: |
  THE CLASSIC 'CLOSED WINDOW' RESULT AND THE STRONGEST SINGLE PIECE OF EVIDENCE FOR IRRECOVERABILITY.
  This is the study the shard brief's question 5 is really about: does sleeping well afterwards restore
  memory for material learned during the deficient period? For this task, no. The authors' own words:
  "A single night of sleep deprivation permanently aborted the normal consolidation of the learning
  process."

  ALTERNATIVE EXPLANATIONS THE AUTHORS RULE OUT, quoted because they matter for separating channel (a)
  from channel (c): "The failure of the sleep-deprived subjects to show improvement was not the result of
  residual sleepiness, because Stanford Sleepiness Scale scores showed no differences between control and
  sleep-deprived subjects (mean values of 2.46 and 2.50, respectively; full scale range, 1-7; unpaired
  t-test, t19 = 0.09, p > 0.9)." So the deficit at test was not a state deficit - it was absent learning.

  From the abstract: "Performance on a visual discrimination task showed maximal improvement 48-96 hours
  after initial training, even without intervening practice. When subjects were deprived of sleep for 30
  hours after training and then tested after two full nights of recovery sleep, they showed no significant
  improvement, despite normal levels of alertness. Together with previous findings that subjects show no
  improvement when retested the same day as training, this demonstrates that sleep within 30 hours of
  training is absolutely required for improved performance."

  IMPORTANT LIMITS ON HOW FAR THIS TRANSFERS TO THE SUBJECT.
  1. It is TOTAL deprivation (30 h), not the partial 5-6 h restriction the subject experienced. Per the
     shard brief, total-deprivation studies are mechanistic only.
  2. It is a visual/perceptual discrimination skill, not classroom declarative knowledge. Generalisation
     to school learning is an assumption, not a finding.
  3. n = 21 with a one-tailed primary test.
  4. It CONFLICTS with the meta-analytic aggregate: berres2021 finds that in total-deprivation designs
     with an intervening recovery night the sleep benefit shrinks to g = 0.14 (n.s.), i.e. across many
     studies recovery sleep DOES largely restore measured performance. It also conflicts with kopasz2010,
     where one 4 h night followed by one recovery night left declarative recall intact.
  The honest synthesis is that irrecoverability is established for this specific perceptual task and is
  NOT established as a general property of sleep-dependent consolidation. cousins2018 is the record that
  bridges the gap: partial restriction, adolescents, and a deficit that survived three recovery nights.

  Full text statistics retrieved from the article record; PubMed carries no abstract for this brief
  communication. Identifiers verified via Crossref and PubMed.
