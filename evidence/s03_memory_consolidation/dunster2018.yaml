rob:
  tool: ROBINS-I
  judgement: high
  notes: "Objective actigraphy for the exposure is a real strength and the classes, schools and instructors were held constant across years. But the design has no control group at all - the authors concede this: 'The nature of our pre-/post-study prevents us from having a control group.' The two cohorts are INDEPENDENT samples of different students in different years, so year effects (cohort ability, curriculum, grading drift) are fully confounded with the policy. Grades were 'absolute (not normalized)' and were supplied by the very teachers who partnered on the study, and the authors flag that these 'could carry an implicit bias from teachers who could have been for or against the school time change'. n for grades is small (~178 across both years) and drawn from a single science course. Attendance improved in only one of the two schools. No effect size or SE is reported for any outcome."
funding: "not stated in retrieved full text"
notes: |
  ROLE: independent-cohort corroboration of james2023 on a different city, different policy
  implementation and different outcome metric. Two independent natural experiments both find that giving
  adolescents ~35-43 min more sleep raises measured academic performance, which is the best causal
  support available for the learning-accumulation channel this shard supplies. That convergence is the
  value of this record; its own internal validity is weak.

  WHY I GRADED IT HIGH RISK OF BIAS DESPITE THE HEADLINE: this is the most-cited study of its kind and it
  is much weaker than its citation count suggests. There is no comparison group, the pre and post samples
  are different students, and the grades were assigned by teachers who knew about the intervention and
  had opinions about it. james2023 - which does have concurrent comparison schools, a real
  difference-in-differences estimator, administrative-record outcomes and 2153 students - should dominate
  this record in any weighting. Notably, james2023's own literature review classifies dunster2018 among
  the studies whose findings are inconsistent with the more rigorous designs, citing it on BOTH sides of
  the attendance question.

  NO SE IS AVAILABLE, AND I DID NOT INVENT ONE. The authors state: "There is no consensus on how to
  calculate the effect size for each variable that emerges as significant with generalized linear models;
  instead, we present the medians for each year, as the data were not normally distributed." A median
  difference with a P value from a multivariable GLM cannot be turned into a defensible SE without the
  underlying distribution, so se is null on all three effects per the instructions' rule against
  inventing SEs. If the pooler needs a weight, the honest options are to enter this record with a
  deliberately wide prior or to use it qualitatively only.

  UNIT WARNING FOR THE MODELLER: the "4.5%" in the abstract is 4.5 PERCENTAGE POINTS on a 0-100 course
  grade (77.5 -> 82), not a 4.5% relative increase; relative to baseline it is 5.8%. It is also a single
  science course grade, not a GPA, so it is not directly commensurable with the 0.07-0.17 GPA points in
  james2023. Rescaling by the 34 min sleep gain gives ~7.9 percentage points per hour, but that Wald
  estimate inherits every weakness above plus the exclusion restriction, and I would not carry it forward.

  COHORT OVERLAP: cohort_family = Seattle_SchoolStart_2016_2017, independent of START_LEARN_Minnesota
  (james2023, widome2020). These are genuinely separate cohorts and may be treated as two studies.
shard: "s03_memory_consolidation"
