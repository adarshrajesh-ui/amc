rob:
  tool: AMSTAR-2
  judgement: high
  notes: "The authors' OWN certainty assessment is the decisive limitation and I am recording it prominently: 'as the certainty of evidence was rated as very low, the results should be interpreted with caution' (GRADE). Every included study is observational and, as far as the abstract indicates, cross-sectional or near-cross-sectional, so temporality is unestablished and reverse causation is wide open -- depressed young people keep irregular schedules. The implausibly tight CI on the >2 h stratum (1.73-2.02 around a point estimate of 1.87, from 14 heterogeneous studies) suggests the pooling is dominated by one or two very large samples rather than reflecting genuine consistency. I assigned tier TX rather than T5 because I cannot confirm any prospective component."
funding: null
notes: |
  WHY I ADDED THIS RECORD, WHICH WAS NOT ON MY TASK LIST. Our subject's described pattern is weekday sleep
  of 5-6 h with weekend and holiday sleep of 7-8 h and occasional 10-11 h weekend nights. That is not
  simply "short sleep." It is a large, sustained WEEKDAY/WEEKEND DISCREPANCY -- the definition of social
  jetlag. A weekday midpoint around 03:00 shifting to a weekend midpoint around 05:00-06:00 implies social
  jetlag of roughly 2-3 h, placing him squarely in this meta-analysis's highest exposure stratum. No other
  record in my shard measures that construct, and it turns out to carry the largest association I found.

  THE NUMBERS, AND WHY THEY GIVE ME PAUSE.
    social jetlag 1-2 h -> depression:  OR 1.12 (1.05-1.20)   log-OR 0.113
    social jetlag >2 h  -> depression:  OR 1.87 (1.73-2.02)   log-OR 0.626
    continuous SJL vs depression:       Fisher's z 0.27 (0.16-0.38), r ~ 0.26
    continuous SJL vs anxiety:          Fisher's z 0.21 (0.12-0.29), r ~ 0.21
  Set the >2 h figure against everything else in my shard on the log-OR scale:
    social jetlag >2 h (this record)                        0.626
    insomnia -> depression, prospective (hertenstein2019)    1.040
    adolescent short sleep -> mood deficit (short2020)       0.438
    disturbed sleep -> depression, baseline-adj (marino2021) 0.405
    insomnia -> MDD, MR (sun2022_mr)                         0.270
    short sleep -> MDD, MR (zhang2024_mr)                    0.165
    late parental bedtime -> depression, quasi-exp (gangwisch2010) 0.215
  Social jetlag >2 h ranks second only to clinical insomnia, and is roughly 3.8x the genetically
  identified short-sleep effect. If taken at face value, this would mean the CIRCADIAN IRREGULARITY of
  our subject's schedule matters considerably more than its total hours.

  I DO NOT TAKE IT AT FACE VALUE, AND THE MODELLER SHOULD NOT EITHER. Three reasons:
    (1) The authors graded their own evidence VERY LOW certainty and said so in the conclusion. That is
        unusual candour and should be respected.
    (2) The exposure is almost certainly cross-sectional and reverse causation is entirely unaddressed. A
        depressed adolescent sleeps late at weekends, skips morning commitments, and has a chaotic
        schedule. Social jetlag is arguably an even better marker of behavioural disorganisation from
        depression than short duration is.
    (3) The dose-response is suspiciously steep (log-OR 0.113 -> 0.626 for a doubling of exposure). Real
        biological dose-responses rarely accelerate like that; category boundaries and confounding
        gradients often do.

  BUT IT CONVERGES WITH THE ONE HIGH-QUALITY CAUSAL ESTIMATE I HAVE ON THE TIMING AXIS, WHICH IS WHY I
  KEEP IT. daghlas2021_mr, methodologically the strongest MR study in my shard (up to 340 loci, instrument
  rescaled to accelerometer-measured sleep midpoint, Egger intercept null), found OR 0.77 (0.63-0.94) per
  1 h EARLIER sleep midpoint, i.e. OR ~1.30 per hour LATER. Two completely different designs -- genetic
  instrumentation of sleep timing in middle-aged adults, and observational social jetlag in adolescents --
  both indicate that WHEN sleep happens carries independent risk, and both give larger effects than the
  duration literature does. Applying daghlas2021's per-hour estimate to a 1.5-2 h midpoint displacement
  gives OR 1.48-1.69, which brackets this record's 1.87 rather well.

  ACTIONABLE IMPLICATION, WHICH IS THE MOST PRACTICALLY USEFUL THING IN MY SHARD. For a student whose total
  hours are genuinely constrained by workload, REGULARISING TIMING costs no study time, whereas EXTENDING
  DURATION costs an hour or two per night. If the timing/irregularity axis carries a meaningful share of
  the risk -- and two independent designs suggest it does -- then stabilising his sleep-wake schedule across
  weekdays and weekends is the intervention with the best ratio of benefit to opportunity cost, quite apart
  from any attempt to sleep longer.

  VERIFICATION NOTE. Both checks passed. Crossref resolves DOI 10.1155/da/5542425 to "Associations of Social
  Jetlag With Depression and Anxiety in Adolescents and Young People: A Systematic Review and Meta-Analysis",
  Depression and Anxiety, 2026, volume 2026, authors Lu Y and Tsai P -- matching PubMed exactly. Crossref
  returns no page number for this article (it is an article-number-only publication, 5542425).
