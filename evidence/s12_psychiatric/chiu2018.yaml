rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Very large pooled n (598,281) but predominantly cross-sectional school surveys with self-reported sleep and self-reported suicidality on the same questionnaire, so shared-method variance and same-day mood state inflate the association. The authors themselves close with 'Additional longitudinal studies are warranted to establish causality.' Two published Comments in Sleep Med Rev 2019;47:125-126 and 47:127 critique the paper; I could not retrieve them, which is a residual uncertainty on the dose-response modelling."
funding: null
notes: |
  WHY THIS IS THE BEST AVAILABLE DOSE-RESPONSE OBJECT FOR ADOLESCENT SUICIDALITY. It is the newest
  dose-response synthesis I found in this domain, it is adolescent-specific (unlike zhai2015), and
  it gives a per-hour linear slope for one outcome (suicide plans) plus the shape for the other two.
  That per-hour slope is directly usable: OR 0.89 per +1 h, i.e. OR ~1.124 per hour lost.

  APPLYING THE PER-HOUR SLOPE TO OUR SUBJECT, AND WHY IT SHOULD NOT BE DONE NAIVELY.
  The subject's weekday deficit versus the 8-h nadir is roughly 2.0-2.5 h (he sleeps 5-6 h on
  weeknights). Naive extrapolation of the linear slope gives OR = 1.124^2.25 = 1.30 for having made
  a suicide plan. But three things argue against taking that at face value:
    (1) the exposure is self-reported habitual duration in cross-sectional surveys, which correlates
        with insomnia, chaotic households, substance use, and current mood -- not with the subject's
        specific cause (workload);
    (2) the slope is estimated over a range dominated by adolescents whose short sleep is
        involuntary or distress-driven;
    (3) the curvilinearity itself is a warning. Risk rises again above 9 h. Long sleep does not
        cause suicide plans. Whatever produces the right-hand upturn (depression-driven hypersomnia,
        illness, disengagement) is also present on the left-hand limb, and is not sleep duration.

  THE MODERATION RESULT IS THE MOST INTERESTING AND MOST AMBIGUOUS NUMBER HERE.
  "Depression did not moderate the association between sleep duration and suicidality." Two readings:
    (a) OPTIMISTIC FOR CAUSALITY: the sleep-suicidality link is not merely a depression epiphenomenon;
        short sleep carries suicidality risk over and above depressive illness. This is the reading
        the authors favour and it would make the association more relevant to a non-depressed,
        workload-restricted 18-year-old like our subject.
    (b) SCEPTICAL: this is a meta-regression across studies (ecological, low power, coarse
        study-level depression coding), which is exactly the design least able to detect moderation.
        A null moderator in meta-regression is weak evidence.
  I flag (b) as more likely on methodological grounds but note that (a), if true, is the one finding
  in this shard that would RAISE rather than lower the estimate for our subject, because it implies
  the pathway does not require depression as an intermediary. The modeller should carry both.

  ARITHMETIC PERFORMED. log(0.89) = -0.11653; se = (log 0.90 - log 0.88)/3.92 = 0.00573. Note the
  implausibly tight CI (0.88-0.90) on a pooled dose-response slope across 12 heterogeneous reports;
  this is one reason I judge RoB moderate rather than low, and the modeller should probably inflate
  this SE substantially rather than treating the slope as known to +/-0.6%.

  ACCESS. Abstract only (Elsevier paywall). All quoted numbers are present verbatim in the abstract.
