rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Large, adolescent-specific, prespecified subgroups. But I2 = 97.9% (extreme heterogeneity); heterogeneous outcome scales all forced onto a common OR metric, which makes the pooled OR hard to interpret dimensionally; 41/73 studies cross-sectional; 45/73 adjusted for no covariates; funnel plot reported."
funding: null
notes: |
  This is the single most transportable observational estimate in my domain: adolescents only (10-19),
  sleep DURATION (not insomnia) as exposure, and it separates study design and covariate adjustment.
  Three numbers matter downstream:
  (1) the pooled OR 1.55 is the headline observational association;
  (2) the experimental subgroup OR (1.72) EXCEEDS the cross-sectional subgroup OR (1.42), which
      bounds reverse causation from above - reverse causation cannot inflate an experimental estimate;
  (3) adjustment for covariates beyond demographics roughly halves the log-OR (0.513 -> 0.247).
  Caution: the "experimental" subgroup ORs are conversions of standardized experimental contrasts
  into an OR metric, so they are not directly commensurable with the epidemiological ORs; treat the
  design comparison as ordinal evidence, not as a calibrated ratio.
  Also relevant to the subject's 9 h optimum: the discussion cites Fuligni's daily-diary estimate that
  "9-hours" is the sleep duration for lowest next-day depressed mood and anxiety.
  Full text retrieved as the accepted-manuscript green-OA PDF from the University of Birmingham
  repository (CC BY-NC-ND); table values above are from Table 2 of that PDF.
