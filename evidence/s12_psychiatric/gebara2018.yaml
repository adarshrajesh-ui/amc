rob:
  tool: AMSTAR-2
  judgement: high
  notes: "The authors' own key caveat is damning and must be carried forward: 'Although all of the studies suggested a positive clinical effect of insomnia treatment on depression outcomes, most of the results were not statistically significant.' A pooled ES of -1.29 arising from a set of individually non-significant trials, with a CI spanning -2.11 to -0.47, is a strong signature of small-study effects / publication bias. Authors also state 'the interventions and populations were highly variable.' Only 23 studies from 3815 screened. No bias-corrected estimate reported."
funding: null
notes: |
  I INCLUDE THIS RECORD BUT RECOMMEND THE MODELLER DOWNWEIGHT IT HEAVILY. It is the weakest of the
  three intervention meta-analyses and its point estimates are the largest, which is the classic
  inverse relationship between methodological quality and effect size.

  THE INTERNAL INCONSISTENCY IS THE MOST INFORMATIVE THING IN IT. HAM-D gives ES = -1.29 while BDI
  gives ES = -0.68 in substantially overlapping trials. These instruments measure the same construct.
  A 2-fold discrepancy on the standardized scale means at least one of the two is being driven by
  something other than depression severity -- most likely the HAM-D's heavy loading on somatic and
  SLEEP items. The HAM-D contains three insomnia items (initial, middle, late) out of 17. Treating
  insomnia mechanically reduces the HAM-D score without necessarily changing mood. This is criterion
  contamination, and it inflates every "treating insomnia improves depression" estimate measured with
  the HAM-D. The BDI value (-0.68), and better still gee2019's -0.45 and scott2021's outlier-removed
  -0.47, are the defensible figures.

  POPULATION IS THE MOST RESTRICTIVE OF ANY RECORD IN MY SHARD. Inclusion required patients with BOTH
  insomnia disorder AND depression. Our subject has neither. This record therefore describes the
  therapeutic ceiling in a doubly affected clinical population and says essentially nothing about the
  counterfactual risk faced by a healthy 18-year-old who is short of sleep opportunity. Population is
  adult (Pittsburgh geriatric-psychiatry and VA-heavy author group; Reynolds and Karp work primarily
  in late-life depression), so I have set adolescent_match: fair_adult; the abstract gives no age
  distribution so age fields are null rather than guessed.

  WHERE IT DOES CONTRIBUTE. It is a third independent replication of the SIGN and rough magnitude of
  the randomized sleep -> depression arrow, in the most severely affected population. Taken with
  gee2019 and scott2021 it establishes that the arrow exists across the full severity range. That is
  all I would use it for.

  ARITHMETIC. HAM-D: se = (2.11-0.47)/3.92 = 0.41837. BDI: se = (1.29-0.06)/3.92 = 0.31378.

  ACCESS. Abstract only (Wiley paywall). n total is not stated in the abstract (only "23 studies met
  inclusion criteria" out of "Three thousand eight hundred and fifteen studies were reviewed"), so I
  set n: null rather than invent a participant count.
shard: "s12_psychiatric"
