rob:
  tool: AMSTAR-2
  judgement: low
  notes: "Best-designed synthesis in my domain: only trials that actually moved sleep are included; mental health measured at a LATER time point than sleep; interventions with mental-health-specific components excluded; internal negative control; trim-and-fill for the significant funnel asymmetry. Weaknesses inherited from the primary literature: 29/65 studies judged high risk of bias, 26/65 unclear, only 10/65 low; I2 = 76-82% before outlier removal."
funding: null
notes: |
  THE central record for requirement 4. Effect of improving sleep on mood, from randomised trials:
    depression   g = -0.63 (-0.83, -0.43), k = 61; outlier-trimmed -0.47 (-0.57, -0.37)
    anxiety      g = -0.50 (-0.76, -0.24), k = 35
    composite    g = -0.53 (-0.68, -0.38); trim-and-fill adjusted -0.35 (-0.55, -0.16)
    suicidality  g = +0.10 (-3.74, 3.94), k = 2 -> NO randomised evidence either way
  TRANSPORTABILITY WARNING that matters enormously for this subject. Two features of this evidence
  base restrict its applicability to him:
   1. The review EXPLICITLY EXCLUDED under-18s: "studies were excluded if they ... recruited children
      and young people (i.e., <18 years of age)". So there is zero paediatric/adolescent content.
      Age was tested as a continuous moderator and was flat (B = 0.00, 95% CI -0.01 to 0.02), which is
      mild reassurance but is an extrapolation across a range that barely includes 18-19 year olds.
   2. The interventions are overwhelmingly INSOMNIA treatments - 53 of 72 comparisons (74%) were
      multi-component CBT-I - given to people with a sleep COMPLAINT, and 38/72 comparisons (53%)
      had a comorbid physical or mental health problem. CBT-I works by removing conditioned arousal,
      correcting dysfunctional sleep beliefs and consolidating sleep; it does not manufacture extra
      time in bed for someone whose sleep is short because of workload. The subject does not have
      insomnia, so this g of -0.47 to -0.63 is NOT the expected benefit of him sleeping more.
      See the discussion in psychiatric_summary.md; vandyk2017 is the closest available analogue for
      behaviourally-imposed short sleep, and its mood benefits are qualitative only.
  Follow-up timing: mean 20.5 weeks post-intervention (median 12), which I have encoded as
  followup_years = 0.39. The effect was larger at <6 months (g+ = -0.60) than at >=6 months
  (g+ = -0.18, Q = 10.75, p < 0.01), i.e. the benefit decays.
