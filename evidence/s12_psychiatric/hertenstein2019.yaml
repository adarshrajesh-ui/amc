notes: |
  I EXTRACTED THIS RECORD SPECIFICALLY AS THE CONTRAST CASE FOR OUR SUBJECT, NOT AS EVIDENCE ABOUT HIM.

  This is the single largest effect size in my whole shard for a prospective sleep -> depression
  association: OR 2.83 for depression onset, OR 3.23 for anxiety onset. It dwarfs everything in the
  sleep-DURATION literature (compare zhai2015 RR 1.31, short2020 OR 1.55 for adolescent mood,
  zhang2024_mr OR 1.179 for genetically proxied short sleep). And the exposure is INSOMNIA.

  That gap is the quantitative heart of this shard's central question. Set the two side by side:
    insomnia -> incident depression:            OR 2.83 (1.55-5.17)   [hertenstein2019, k=10, prospective]
    short sleep duration -> incident depression: RR 1.31 (1.04-1.64)  [zhai2015, k=7, prospective]
    genetically proxied short sleep -> MDD:      OR 1.179 (1.108-1.255) [zhang2024_mr]
    genetically proxied insomnia -> MDD:         OR 1.233 (1.214-1.253) [zhang2024_mr]
    insomnia -> MDD (MR):                        OR 1.31 (1.25-1.37)   [sun2022_mr]
  On the log scale the observational insomnia effect (log 2.83 = 1.04) is about 3.9x the observational
  short-duration effect (log 1.31 = 0.27), and about 6.3x the genetically proxied short-duration
  effect (log 1.179 = 0.165). Insomnia is where nearly all of the psychiatric signal lives.

  WHY THIS MATTERS FOR AN 18-YEAR-OLD WITH WORKLOAD-IMPOSED SHORT SLEEP.
  Insomnia is defined by an inability to sleep despite adequate opportunity, plus distress about it.
  Our subject has the inverse: preserved ability, curtailed opportunity, and (as far as the case
  describes) no distress about sleep onset. He would not meet insomnia criteria on any standard
  instrument. Therefore the OR 2.83 pathway is essentially closed to him, and the correct
  observational anchor for his exposure is the much weaker duration literature. Applying
  insomnia-derived risk to him would overestimate his depression risk by something in the region of
  a factor of 2-4 on the log-OR scale.

  RESIDUAL CAUTION IN THE OTHER DIRECTION. Chronic sleep restriction can eventually generate
  insomnia-like features (conditioned hyperarousal, dysregulated sleep timing, weekend rebound
  producing Sunday-night sleep-onset difficulty). If three years of 5-6 h weeknights plus 10-11 h
  weekend rebound has pushed the subject into a genuinely irregular, phase-delayed pattern, he could
  drift toward the insomnia phenotype and pick up part of this larger risk. That transition -- not
  short duration per se -- is the mechanism by which his risk would escalate materially, and it is
  the thing worth monitoring. See lu2026_sjl for the social-jetlag evidence bearing on exactly this
  weekday/weekend-discrepancy pattern.

  ARITHMETIC. depression: log(2.83) = +1.04028, se = (log 5.17 - log 1.55)/3.92 = 0.30730.
             anxiety:    log(3.23) = +1.17248, se = (log 6.85 - log 1.52)/3.92 = 0.38407.

  ACCESS. Abstract only (Elsevier paywall); pooled ORs, CIs and k are all stated verbatim in the
  abstract so nothing was inferred beyond the log transform. Age distribution is not given in the
  abstract, hence adolescent_match: mixed and age fields null rather than guessed.
