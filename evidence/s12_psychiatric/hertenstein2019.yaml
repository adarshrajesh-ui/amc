rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Authors' own verdict: 'The overall risk of bias in the primary studies was moderate.' Only 13 primary studies across all outcomes; k=10 for depression, k=6 for anxiety, k=1 for psychosis. Very wide CIs. Baseline insomnia assessment heterogeneous; residual confounding by subthreshold depression at baseline is the dominant threat, since insomnia is itself a prodromal symptom of depression and >=12 mo follow-up does not exclude a prodrome."
