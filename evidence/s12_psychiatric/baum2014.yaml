effects:
  - outcome_domain: psychiatric
    outcome_construct: poms_tension_anxiety
    exposure: {type: chronic_restriction, dose_h: 6.5, referent_h: 10, duration_days: 5,
               contrast_label: "6.5 h TIB vs 10 h TIB, 5 consecutive nights, at-home actigraphy-verified"}
    scale: cohens_d
    unit: "within-subject d_z"
    value: -0.4596
    se: 0.1487
    ci: [-0.7511, -0.1682]
    conversion_formula: "Paper reports Wilcoxon signed-rank Z = -3.25 with n = 50 pairs. d_z = |Z|/sqrt(n) = 3.25/7.0711 = 0.4596 (the paired-t identity t = d_z*sqrt(n), with Z used in place of t; Wilcoxon Z is slightly conservative relative to t, so this is a mild underestimate). se(d_z) = sqrt(1/n + d_z^2/(2n)) = sqrt(1/50 + 0.4596^2/100) = 0.1487."
    from_figure: false
    inferred_from_ci: false
    direction_note: "negative = worse (more tension/anxiety) under restriction"
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "Compared to HS, during SR adolescents rated themselves as having increased levels of Tension/Anxiety (Z = -3.25, p = .001), Anger/Hostility (Z = -3.10, p = .002), Fatigue/Inertia (Z = -4.78, p < .001), and Confusion/Bewilderment (Z = -3.37, p = .001), and significantly less vigor (Z = -3.02, p = .003)."
