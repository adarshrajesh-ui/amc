rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomized, counterbalanced crossover with actigraphy verification and a prespecified negative-control outcome - unusually strong for this literature. Concerns: no blinding is possible; outcomes are questionnaires; n = 50 with skewed distributions handled by nonparametric tests, so effect sizes had to be back-derived from Wilcoxon Z rather than read directly; conducted in summer, not on real school nights; the comparator is 10 h TIB, which is longer than any realistic counterfactual for the subject."
funding: null
notes: |
  The best T1 adolescent evidence for requirement 3. All effect sizes are my conversions from the
  reported Wilcoxon Z statistics (n = 50 pairs) using d_z = |Z|/sqrt(n); see conversion_formula on
  each effect and convert.py in this directory for the arithmetic.
  Effect-size ordering: Fatigue 0.68 > Confusion 0.48 > Tension/Anxiety 0.46 > Anger 0.44 >
  Vigor loss 0.43 > Emotion-regulation problems 0.38 > Oppositionality 0.35 >
  parent-rated emotion regulation 0.34 > Depression 0 (n.s.) = Hyperactivity 0 (n.s.).
  THE HEADLINE PATTERN: 5 nights at 6.5 h TIB reliably degrades irritability, anxiety, vigour and
  emotional regulation at d_z ~ 0.35-0.48, but does NOT produce depressed mood. This is directly
  informative for the subject, whose exposure is close to this dose. Note also the exposure contrast
  here is 6.5 h vs 10 h TIB - a larger contrast than the subject's weekday-vs-weekend swing.
  Caveat on the null: with n = 50 the study can only exclude |d_z| > ~0.28 for depression, so a small
  true effect on depressed mood is not ruled out.
