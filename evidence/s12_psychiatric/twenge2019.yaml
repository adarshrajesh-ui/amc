rob:
  tool: none
  judgement: na
  notes: "Very large nationally representative repeated cross-sectional survey (N = 611,880) with consistent DSM-based MDE assessment across waves; appropriate for describing secular trends. Not an effect estimate, so RoB tools do not apply. Two interpretive cautions: NSDUH changed some collection procedures over the period, and rising measured prevalence partly reflects changing willingness to report and changing help-seeking rather than purely changing incidence. The authors' proposed causes (digital media, declining sleep) are HYPOTHESES generated from ecological correlation, not tested effects."
funding: null
notes: |
  I INCLUDE THIS RECORD FOR CONTEXT AND FOR ONE SPECIFIC WARNING ABOUT DOUBLE-COUNTING.

  THE CONTEXT. Our subject's absolute risk is dominated by his birth cohort and age band, not by his sleep.
  Past-year MDE in 18-25 year olds went 8.1% (2009) -> 13.2% (2017) -> 17.2% (2020, from goodwin2022). The
  base rate for his demographic has roughly doubled in a decade. Against that, the plausible causal
  contribution of his sleep pattern (see psychiatric_summary.md: OR in the region of 1.0-1.25) is a modest
  perturbation of a rapidly moving baseline.

  THE WARNING, WHICH MATTERS FOR THIS FACTORY'S OUTPUT. The authors explicitly nominate declining sleep as
  one candidate cause of the cohort trend: "Cultural trends contributing to an increase in mood disorders
  and suicidal thoughts and behaviors since the mid-2000s, including the rise of electronic communication
  and digital media and declines in sleep duration, may have had a larger impact on younger people,
  creating a cohort effect."
  That is an ECOLOGICAL hypothesis about population-level co-trending, and it must NOT be used as
  individual-level evidence. Two reasons:
    (1) It is uncontrolled co-trending. Over the same window, adolescent smartphone use, social media use,
        academic pressure, and reporting of mental-health symptoms all rose together with short sleep. The
        ecological correlation cannot separate them, and the authors do not claim it can.
    (2) DOUBLE-COUNTING RISK. If the downstream model uses the 2020-era base rate for an 18-25 year old
        male (which already embeds whatever contribution declining population sleep has made) AND THEN
        multiplies by a relative risk for our subject's individual short sleep, part of the sleep effect is
        counted twice. The individual-level relative risk should be applied to the base rate for
        contemporaneous peers, which is what the 17.2% figure is. I flag this so the pooler applies the
        relative estimate to the current base rate rather than to a historical one.

  ONE GENUINELY RELEVANT DETAIL FOR OUR SUBJECT'S COHORT. The analysed cohorts run to those born in the late
  1990s. Our subject, at 18 in the mid-2020s, was born around 2007-2008 -- a full decade later than the
  latest cohort in this analysis, and the trend was still rising at the end of the observed window. So the
  base rate applicable to him is likely at or above the 17.2% that goodwin2022 measured for 2020, and the
  extrapolation is beyond the range of these data.

  SEX. Not reported in the abstract. As with goodwin2022, the male-specific figures are lower than these
  combined-sex ones, and I have not invented them.
