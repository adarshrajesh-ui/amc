rob:
  tool: MR-STROBE
  judgement: some_concerns
  notes: "Reports a bidirectional design with tight SEs and extremely small p-values, and identifies a candidate mediating gene (TCF4). But the abstract does not report MR-Egger intercept tests, weighted-median sensitivity analyses, instrument counts, F-statistics, or sample sizes, so I cannot assess pleiotropy or weak-instrument bias. Published in Gene, a molecular-genetics journal rather than a psychiatric-epidemiology or MR-methods venue, and the reporting is correspondingly thin on MR diagnostics. The bxy scale is not defined in the abstract, which limits interpretability."
funding: null
notes: |
  WHAT THIS RECORD CONTRIBUTES: THE BIDIRECTIONAL RATIO ON THE INSOMNIA AXIS, AND A DISAGREEMENT.

  Forward (insomnia -> MDD): bxy = 0.57 +/- 0.07
  Reverse (MDD -> insomnia): bxy = 0.16 +/- 0.02
  Reverse share of the total = 0.16/(0.16+0.57) = 0.219, i.e. on this study's numbers about 22% of the
  bidirectional insomnia/depression relationship runs backwards and 78% forwards.

  THIS DIRECTLY CONTRADICTS sun2022_mr, AND I AM NOT GOING TO AVERAGE OVER THE DISAGREEMENT.
    cai2021 (this):  forward 0.57, reverse 0.16  -> reverse share 22%, forward arrow dominant
    sun2022_mr:      forward log 1.31 = 0.270, reverse log 1.37 = 0.315 -> reverse share 54%, arrows symmetric
  Same axis, same trait pair, similar populations, opposite conclusions about which direction dominates.
  Possible explanations: different GWAS vintages and sample sizes for the MDD instrument (sun2022 used
  only 12 MDD SNPs); different insomnia phenotype definitions; different MR estimators (cai2021's bxy
  comes from a GSMR-style multi-SNP framework, sun2022's from IVW); and non-comparable scales, since
  bxy and log-OR are not the same quantity and I cannot verify cai2021's scaling from the abstract.
  The honest summary for the modeller is that the reverse-causation share on the INSOMNIA axis is
  poorly identified and plausibly anywhere between about 20% and 55%. I use that range, not a point
  estimate, in psychiatric_summary.md.

  NOTE CAREFULLY: THIS STUDY SAYS NOTHING ABOUT SLEEP DURATION. Both arrows here are insomnia arrows.
  For our subject, whose exposure is curtailed opportunity rather than insomnia, this record is
  background on the reverse-causation machinery, not an estimate of his risk. The relevant duration-axis
  MR estimates are in zhang2024_mr (short duration -> MDD OR 1.179) and sun2022_mr (continuous
  duration -> MDD null; MDD -> duration OR 0.92).

  THE GENETIC CORRELATION IS THE UNDERAPPRECIATED NUMBER. rg = 0.40 (+/- 0.03) between MDD and insomnia
  means these two traits share roughly 40% of their genetic correlation structure. That is a large
  shared architecture, and it is a CONFOUNDING mechanism distinct from either causal arrow: genes that
  predispose to both produce an observational association even in the complete absence of causation in
  either direction. Any decomposition of the observational association into "forward + reverse" is
  therefore incomplete; a third bucket, "shared liability," is doing real work. For our subject this is
  actually reassuring in a specific way: if his family history is unremarkable, his short sleep is
  externally imposed rather than a marker of shared depressive/insomnia liability, and the confounded
  portion of the population-level association does not transfer to him.

  ARITHMETIC. All three estimates were reported as "estimate ± SE", so I recorded value and se
  directly and computed CIs as value +/- 1.96*se:
    forward 0.57 +/- 1.96(0.07) = (0.4328, 0.7072)
    reverse 0.16 +/- 1.96(0.02) = (0.1208, 0.1992)
    rg      0.40 +/- 1.96(0.03) = (0.3412, 0.4588)
  I did NOT exponentiate bxy into odds ratios, because the abstract does not define the scale and
  doing so would risk a units error.

  ACCESS. Abstract only (Elsevier paywall). Sample sizes are not stated in the abstract; n: null.
