rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Two waves only, 1-year lag, self-reported sleep, 75% retention. Not an area-probability sample (post-stratified). Major-depression cell counts are small, so the wide CIs are real. Crucially, both arrows were modelled in the SAME sample with the same covariate set, which is exactly what is needed to bound reverse causation."
funding: null
notes: |
  THE key study for requirement 6. Both arrows, same sample, symmetric adjustment.
  Forward (short weeknight sleep -> major depression): OR 3.76, log 1.32442.
  Reverse (major depression -> short weeknight sleep): OR 4.28, log 1.45395.
  Reverse share of the summed log-OR = 1.45395/(1.32442+1.45395) = 52.3%.
  For the milder outcome (depressive symptoms) the reverse share is 40.0% and the reverse arrow is
  not significant.
  Interpretation for the modeller: in adolescents, the sleep<->depression relation for CLINICAL
  depression is roughly bidirectionally symmetric, so about half of a naive cross-sectional
  association should be discounted as reverse causation; for subclinical symptoms the forward arrow
  dominates and the discount is smaller (~40% or less).
  Also note the authors' own summary of the forward symptom effect: "we found a 25% to 38% increased
  risk", matching OR 1.25 (every night) to 1.38 (weeknights).
  Full text: PMC record body is access-restricted; Tables 2-4 were read from a third-party mirror of
  the publisher PDF, and the numbers I extracted are internally corroborated by the PMC-hosted
  Discussion text, which independently states the 1.95 (n.s.) and 4.28 (P < 0.05) reverse-arrow
  values and the "25% to 38%" forward-arrow range.
