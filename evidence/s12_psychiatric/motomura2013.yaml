rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomized crossover with 2-week washout, PSG and actigraphy verification, all-male sample of young adults - good transportability to an 18-19 year old male. But n = 14 is very small, so both the positive STAI finding and the POMS nulls are imprecise; first 3 of 5 nights were spent at home with email-alert adherence monitoring rather than in the laboratory; multiple comparisons across 6 POMS subscales without correction."
funding: "Japanese government (Health and Labour Sciences Research Grants / intramural at National Center of Neurology and Psychiatry, per the article)"
notes: |
  Serves requirement 7 (emotional-regulation / amygdala mechanism) and reinforces requirement 3.

  WHY THIS IS THE BEST MECHANISM STUDY FOR OUR SUBJECT, BETTER THAN YOO 2007. The named target for the
  mechanism requirement was Yoo/Walker, whose 2007 Current Biology study used ONE NIGHT OF TOTAL SLEEP
  DEPRIVATION. Motomura used FIVE CONSECUTIVE NIGHTS OF 4 h TIB in an all-male young-adult sample, with
  actigraphic verification of the achieved dose (4.60 +/- 0.54 h vs 8.09 +/- 0.35 h, a real deficit of
  3.48 h/night). Chronic partial restriction in young men is our subject's exposure; acute total
  deprivation is not. I could not retrieve Yoo 2007 (Cell Press blocked automated PDF access with HTTP
  403 from three routes and there is no PMC copy), so rather than record Yoo's numbers secondhand I use
  this better-matched study as the primary mechanism record. See yoo2007.yaml for the citation-only stub.

  THE EFFECT-SIZE ORDERING WITHIN THIS ONE STUDY IS THE FINDING THAT MATTERS. All from n=14 pairs:
    left amygdala reactivity to fear faces    d_z = 1.50  (t(13) = 5.60, FWE-corrected)
    right amygdala, same contrast             d_z = 0.91  (t(13) = 3.41, below FWE threshold)
    Stanford Sleepiness Scale                 d_z = 0.94  (t(13) = 3.51)
    STAI state anxiety                        d_z = 0.73  (t(13) = 2.74)
    POMS Fatigue                              d_z = 0.35  (ns)
    POMS Tension-Anxiety                      d_z = 0.12  (ns)
    POMS Depression                           d_z = 0.11  (ns)
  The NEURAL response to sleep restriction is the largest signal in the study, about twice the size of
  the strongest self-reported mood change and an order of magnitude larger than the depressed-mood
  change. Interpretation for the modeller: five nights of severe restriction demonstrably alters the
  emotional-reactivity circuitry (amygdala up, amygdala-vACC connectivity down) while producing only a
  modest conscious anxiety signal and NO depressed mood at all. The mechanism is loaded and primed
  before it is subjectively reportable as depression.

  CONVERGENCE ACROSS EXPERIMENTS -- THE CENTRAL EMPIRICAL CLAIM OF MY SHARD. Two independent
  experiments, two age bands, two doses, and a randomized active-controlled adolescent trial all agree:
    baum2014        adolescents, 6.5 h vs 10 h TIB x 5 nights: tension/anxiety d_z 0.46, anger 0.44,
                    emotion regulation 0.38 SIGNIFICANT; POMS Depression/Dejection NOT significant
    motomura2013    young men, 4 h vs 8 h TIB x 5 nights: STAI anxiety d_z 0.73 SIGNIFICANT;
                    POMS Depression d_z 0.11 NULL
    blake2016_sense randomized, active control, adolescents: anxiety improved; depression did not appear
    palmer2024      meta-analysis of 50+ years of experimental sleep loss: anxiety and positive affect
                    move reliably; depressive symptoms mixed
  Sleep restriction causally produces ANXIETY, IRRITABILITY, ANGER, BLUNTED POSITIVE AFFECT and
  DEGRADED EMOTIONAL REGULATION on a timescale of days. It does NOT produce depressed mood on that
  timescale. Whatever links habitual short sleep to clinical depression in the epidemiology is either
  slower than 5 nights, mediated by insomnia, or reverse causation.

  THE VALENCE-SPECIFICITY CLAIM IS WEAKER THAN THE PAPER IMPLIES, AND I FLAG IT RATHER THAN REPEAT IT.
  The authors state the amygdala "showed no session-related differences" for happy-vs-neutral faces,
  which is used to argue that sleep debt selectively amplifies NEGATIVE emotional processing. But the
  reported t(13) = 3.04 for the left amygdala on the happy contrast converts to d_z = 0.81 -- a large
  effect that merely failed a stringent corrected threshold in a 14-person study. The honest reading is
  that negative-valence reactivity increased MORE than positive-valence reactivity, not that positive
  valence was unaffected. This matters because a general amplification of amygdala reactivity implies
  emotional lability rather than a specifically depressogenic or anxiogenic shift.

  ARITHMETIC. All d_z values from within-subject t on 13 df: d_z = |t|/sqrt(14),
  se = sqrt(1/14 + d_z^2/28). Left amygdala 5.60 -> 1.4967 (se 0.3891); right amygdala 3.41 -> 0.9114
  (se 0.3179); happy-vs-neutral left 3.04 -> 0.8125 (se 0.3082).
