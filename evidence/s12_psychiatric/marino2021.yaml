rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Methodologically the best-designed observational synthesis in this domain: youth-specific, prospective-only, and every included estimate had to be ADJUSTED FOR BASELINE DEPRESSION, which is the single most important control for reverse causation in this literature. Two serious weaknesses stated by the authors: I2 = 87.7% for the OR pooling, and 'Substantial publication bias was found.' Exposure is disturbed sleep / insomnia, not sleep duration."
funding: "Cundill Centre for Child and Youth Depression (author support disclosed)"
notes: |
  THIS IS THE MOST DECISION-RELEVANT OBSERVATIONAL RECORD IN MY SHARD, FOR ONE DESIGN REASON.
  Inclusion required that each estimate be "adjusted for baseline depression." That is the design
  feature that partially closes the reverse-causation channel: an adolescent who is already depressed
  at baseline cannot generate the association, because his baseline depression is conditioned out.
  So this pooled OR is the closest thing the observational literature offers to a
  reverse-causation-purged estimate in young people.

  AND THE NUMBER COLLAPSES WHEN YOU DO THAT. Compare, on the log-OR scale:
    disturbed sleep -> depression, baseline-depression-adjusted, youth:  OR 1.50, log = 0.405  [this record]
    insomnia -> depression, prospective, mostly unadjusted for baseline: OR 2.83, log = 1.040  [hertenstein2019]
    short sleep -> adolescent mood deficit, unadjusted:                  OR 1.67, log = 0.513  [short2020]
    short sleep -> adolescent mood deficit, maximally adjusted:          OR 1.28, log = 0.247  [short2020]
  Adjusting for baseline depression takes the log-OR from ~1.04 down to ~0.41, i.e. it removes about
  61% of the log-scale association. That is a direct, empirical, literature-level estimate of the
  reverse-causation-plus-baseline-severity share, and it is one of the two independent numbers I use
  to bound the reverse-causation fraction in psychiatric_summary.md (the other being the symmetric
  bidirectional coefficients in roberts2014).

  BUT IT IS STILL THE WRONG EXPOSURE FOR OUR SUBJECT. "Disturbed sleep included sleep disturbances or
  insomnia." Not duration. As with hertenstein2019 and lovato2014, the measured construct is
  inability-to-sleep, and our subject's construct is opportunity-to-sleep. The continuous estimate
  is also genuinely small in absolute terms: beta = 0.11, about 1% of variance in depressive symptoms.

  ARITHMETIC. log(1.50) = +0.40547; se = (log 2.00 - log 1.13)/3.92 = 0.14565.
              beta se = (0.15 - 0.06)/3.92 = 0.02296.

  PUBLICATION BIAS WARNING. The authors report "Substantial publication bias was found" but the
  abstract does not give a trim-and-fill or Egger-adjusted point estimate, so I cannot record a
  bias-corrected value. Given the direction publication bias almost always takes, the true OR is
  likely below 1.50. The modeller should treat 1.50 as an upper bound on the baseline-adjusted
  youth association.

  ACCESS. Abstract only. PMC7985724 exists (JAMA Network Open is open access) but I extracted from
  the abstract, which states every number I use verbatim, including k, n per pooling, I2, and the
  publication-bias verdict. Age range 5-24 spans children through young adults with no reported
  stratification, hence adolescent_match: mixed; metaregression on "age at baseline" showed
  "no evidence that pooled estimates differed across any covariate," so age-stratum-specific
  inflation of the estimate is not supported.
