rob:
  tool: AMSTAR-2
  judgement: high
  notes: "The authors' own conclusion is the honest risk-of-bias statement: 'Definitive conclusions regarding bidirectionality cannot be made for most sleep disturbances due to the small number and heterogeneity of cohort samples used across studies.' Only 9 studies total across all sleep disturbances and both directions, one of them retrospective. No pooled effect estimates at all, so nothing here is quantitatively usable. Search ended December 2011, making it the oldest evidence in my shard. Treatment studies and clinical/high-risk samples were excluded, which improves generalisability but shrinks the evidence base further."
funding: null
notes: |
  THIS RECORD CONTRIBUTES NO NUMBERS, AND ITS VALUE IS ENTIRELY AS A DIRECTION-QUESTION COUNTERWEIGHT.

  My task requires me to separate the two causal directions. Two systematic reviews in my shard set out to
  do exactly that and reached OPPOSITE verdicts:
    lovato2014 (adolescents 12-20, k=23): "Overall effect sizes from longitudinal and treatment studies
      suggest sleep disturbance acts as a precursor to the development of depression... Little support was
      found for a predictive role of depressive symptoms in the development of sleep disturbance."
    alvaro2013 (this record, k=9): "best available evidence suggests insomnia is bidirectionally related to
      anxiety and depression."
  Same literature, same era, incompatible conclusions. I resolve this in favour of BIDIRECTIONALITY, for
  three reasons that do not depend on either review:
    (1) lovato2014's asymmetric verdict rests on 7 studies testing the forward arrow versus only 3 testing
        the reverse. Its "little support" for the reverse arrow is an artefact of asymmetric attention.
    (2) roberts2014 modelled BOTH arrows in the SAME adolescent sample, which eliminates literature-
        selection asymmetry entirely, and found the reverse arrow for major depression to be the LARGER of
        the two (reverse OR 4.28 vs forward OR 3.76, i.e. a reverse share of 52% of the total log-OR).
    (3) sun2022_mr, using genetic instruments in both directions, found insomnia -> MDD OR 1.31 and
        MDD -> insomnia OR 1.37 -- again essentially symmetric, with the reverse arrow marginally larger.
  Three independent lines, all indicating that the relationship is genuinely two-way on the insomnia axis,
  with something close to a 50/50 split. That is the basis for the reverse-causation fraction I report in
  psychiatric_summary.md.

  THE TWO ONE-WAY FINDINGS ARE MORE INTERESTING THAN THE HEADLINE, AND THEY POINT IN OPPOSITE DIRECTIONS.
    FORWARD-ONLY: "Childhood sleep problems significantly predicted higher levels of depression... but not
      vice-versa." In children, sleep appears to lead. If the causal arrow is genuinely stronger in the
      forward direction earlier in development, that is mildly unfavourable for our subject, whose exposure
      began at 16.
    REVERSE-ONLY: "anxiety predicted excessive daytime sleepiness, but excessive daytime sleepiness was not
      associated with depression." Here a psychiatric state generates a sleep symptom, with no return path.
      This is a clean, isolated demonstration of the reverse mechanism, and it involves DAYTIME SLEEPINESS
      -- which is precisely the symptom our subject would present with. Worth flagging: if he reports
      daytime sleepiness, that symptom is not diagnostic of the direction of causation, because anxiety
      produces it too.

  EXPOSURE MISMATCH, AS EVERYWHERE IN THIS LITERATURE. The constructs reviewed are insomnia, sleep quality,
  childhood sleep problems, and excessive daytime sleepiness. Not one of them is sleep DURATION or sleep
  OPPORTUNITY. This review therefore tells us about the direction of the insomnia/mood relationship, which
  is the relationship our subject does NOT have. Its relevance to him is indirect: it establishes that the
  observational literature he would otherwise be compared against is contaminated in both directions.
