rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Large, properly randomised, pre-registered, ITT with mixed models; but (a) usual-practice control means no attention/placebo control, so expectancy effects on self-reported mood are uncontrolled; (b) all outcomes self-reported by unblinded participants; (c) substantial differential attrition (week-10 outcome data on 1142/1864 control vs 733/1891 treatment) and missing-data analysis showed the missing groups had HIGHER PHQ-9, so the observed effect may be modestly inflated; (d) treatment programme supplied free by Sleepio/Big Health, with author financial interests declared."
funding: "Wellcome Trust (098461/Z/12/Z). Sleep treatment programme provided free by Sleepio/Big Health Ltd."
notes: |
  WHAT THIS IS. The largest randomized test of the sleep -> mental-health arrow ever run in a
  student/young-adult population (n=3755, mean age ~24.7, UK universities). Because sleep was
  randomized (via a treatment for it) and depression was measured downstream, reverse causation
  cannot generate these estimates. This is therefore the single best anchor for the direction of
  the arrow in the subject's age band.

  KEY NUMBERS (all verbatim from Table 4 / Table 5 of the paper):
    - Insomnia (ISI) week 10: adjusted difference -3.72 (-4.16 to -3.29), d = 0.94
    - Depression (PHQ-9) week 10: -2.83 (-3.30 to -2.35), d = 0.48
    - Depression (PHQ-9) week 22: -2.44 (-2.95 to -1.94), d = 0.42
    - Anxiety (GAD-7) week 10: -1.86 (-2.29 to -1.43), d = 0.33
    - Probable depressive disorder (PHQ-9 >= 10) week 10: OR 0.21 (0.14-0.32)
    - Probable anxiety disorder (GAD-7 >= 10) week 10: OR 0.32 (0.21-0.48)

  CRITICAL TRANSPORTABILITY CAVEAT FOR OUR SUBJECT. This trial did NOT extend sleep in people who
  were voluntarily curtailing it. Eligibility required insomnia: participants had baseline ISI
  ~12.9 and baseline PHQ-9 ~12.9 (already above the depression-caseness cut-off of 10). The
  intervention was CBT-I, whose active ingredients are sleep restriction therapy, stimulus
  control, and cognitive restructuring of sleep-related worry -- i.e. it treats the inability to
  sleep, not the decision not to. Our subject has the opposite problem: adequate sleep ability,
  insufficient opportunity. CBT-I in a person with no insomnia would have little room to improve
  the mediator, so the d=0.48 depression benefit is an upper bound on what "fixing his sleep"
  buys, and probably a substantial overestimate.

  A DEFENSIBLE RESCALING FOR THE MODELLER. The trial bought d=0.48 of depression improvement with
  d=0.94 of insomnia improvement, a transfer ratio of ~0.51 depression-SD per insomnia-SD. If one
  is willing to treat "sleep quality/insufficiency" as a single latent axis, then any intervention
  that moves the subject's sleep by delta SD would be expected to move his depression by ~0.5*delta
  SD. This is the arithmetic the downstream model should use rather than importing d=0.48 wholesale.

  MEDIATION EVIDENCE ON DIRECTION. The paper's formal mediation analysis was run for the primary
  psychotic-experience outcomes, not for depression, so I do NOT have a mediated fraction for
  depression from this trial. But the directional asymmetry the authors report is quotable and
  relevant: "Change in sleep over 3 weeks explained 21% of the intervention effect on
  hallucinations at 10 weeks, with change in sleep over 10 weeks accounting for 39% of the
  intervention effect on hallucinations." and "In comparison, parallel analyses in the opposite
  direction indicated that changes in psychotic experiences explained a much smaller percentage of
  variation in improvements in sleep." The authors also concede the limit: "the mediation analyses
  in this trial based on week 10 outcomes cannot fully capture the temporal order of changes or
  rule out reverse causation."

  ADVERSE/UNEXPECTED SIGNAL WORTH CARRYING FORWARD. Mania (Altman) got WORSE in the sleep-treated
  arm: adjusted difference +0.93 (0.67 to 1.19), d = -0.31, and dichotomous OR 2.01 (1.48-2.73).
  Almost certainly an artefact of CBT-I's sleep-restriction component acutely curtailing sleep, but
  it is a real randomized demonstration that acute sleep curtailment moves an activation/irritability
  dimension upward -- consistent with the experimental irritability findings in baum2014.

  NO EFFECT on service contact (OR 1.19, 0.70-2.04), diagnosis received (1.33, 0.75-2.37), or
  psychiatric medication (0.77, 0.47-1.26): the benefit is on symptom scales, not on hard
  health-service endpoints.
