notes: |
  Requirement 3 asked for the experimental MOOD effect size. The best available synthesis gives, for
  healthy participants:
    positive affect  SMD -0.27 to -1.14
    anxiety symptoms SMD  0.57 to 0.63
    emotional arousal blunting SMD -0.20 to -0.53
    negative affect and depressive symptoms: MIXED, no consistent pooled effect.
  MOOD VS COGNITION (requirement 3, second part). I could not obtain within-study mood-vs-performance
  contrasts from this paper, so the comparison is made across meta-analyses:
    mood/emotion (this record):        |SMD| ~ 0.57-0.63 (anxiety), 0.27-1.14 (positive affect)
    neurocognition (lowe2017, same exposure class): g = -0.383 overall, -0.409 sustained attention,
                                                   -0.324 executive function, -0.192 long-term memory
  So the affective effect of experimental sleep restriction is roughly 1.5-2x the neurocognitive
  effect, consistent with Pilcher & Huffcutt's 1996 conclusion (see pilcher1996.yaml) that
  "mood is more affected by sleep deprivation than either cognitive or motor performance".
  IMPORTANT LIMITATION I want the modeller to see: the ci fields on the first two effects hold
  RANGES OF SUBGROUP POINT ESTIMATES, not confidence intervals, and se is null. Do not feed these into
  an inverse-variance pooler as if they were precision-weighted estimates.
