rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Design is excellent for the question: randomized, counterbalanced within-subject crossover, 2 weeks per condition, objective actigraphy, conducted on SCHOOL NIGHTS rather than in summer, and a HAB control condition that prescribes baseline sleep so that both arms are equally 'managed'. Concerns: n=54 retained from 76 enrolled (29% attrition) with no reported attrition analysis; all sleep obtained at home so adherence is imperfect; mood outcomes are self- and parent-report in an unblinded design (participants necessarily know which condition they are in); primary aim was FEASIBILITY, so mood analyses are secondary and the abstract reports no effect sizes at all."
funding: null
notes: |
  THIS IS THE STUDY DESIGN THE ENTIRE LITERATURE IS MISSING, AND IT IS THE CLOSEST EXPERIMENTAL MATCH TO
  OUR SUBJECT THAT EXISTS.

  Every other intervention record in my shard treats people who CANNOT sleep (freeman2017, gee2019,
  gebara2018, scott2021, blake2017, blake2016_sense are all insomnia/sleep-problem populations). This
  study did the opposite and the correct thing: it took adolescents who "habitually slept 5-7 hours on
  school nights" -- our subject's exact exposure band -- and randomly gave them MORE SLEEP OPPORTUNITY
  during the school term, then measured mood. That is the counterfactual we actually need: what happens
  to a behaviourally short-sleeping teenager when the constraint is lifted.

  THE DOSE-CONVERSION NUMBER IS PRACTICALLY IMPORTANT AND I HAVE NOT SEEN IT ELSEWHERE. A prescribed
  1.5 h increase in time in bed produced 72.6 extra minutes of actigraphic sleep per night, an 81%
  conversion of opportunity into sleep. So in habitually short-sleeping adolescents, extra time in bed
  is converted into real sleep efficiently -- they are sleep-deprived, not sleep-unable. Two consequences:
    (1) It confirms the exposure construct. Our subject's short sleep is an OPPORTUNITY deficit. Given
        opportunity, such adolescents sleep. This is the empirical basis for saying he does not have
        insomnia and for discounting the insomnia-derived risk estimates (hertenstein2019 OR 2.83,
        marino2021 OR 1.50, and the CBT-I trial literature).
    (2) It sets the realistic dose of any intervention for him: roughly 1.2 h of recovered sleep per
        1.5 h of reclaimed time. Compare blake2017, where adolescent CBT-based sleep interventions bought
        only ~29 min/night. Giving a short sleeper time is about 2.5x more effective than teaching a short
        sleeper sleep skills.

  WHAT IMPROVED, AND WHAT DID NOT -- THE SAME DISSOCIATION YET AGAIN. Improved: sleepiness, ANGER,
  vigor, fatigue, confusion. Not listed: depression, anxiety. This is the fourth independent design in
  my shard showing the identical pattern:
    baum2014 (restriction, adolescents):        tension/anxiety, anger, emotion regulation move;
                                                POMS Depression/Dejection does NOT
    motomura2013 (restriction, young men):      STAI anxiety and amygdala reactivity move;
                                                POMS Depression does NOT (d_z 0.11)
    blake2016_sense (RCT, active control):      anxiety improves; depression not reported
    vandyk2017 (EXTENSION, short sleepers):     anger, vigor, fatigue, confusion, sleepiness improve;
                                                depression and anxiety not reported
  Manipulating sleep in either direction, in the right population, moves IRRITABILITY, ENERGY and
  SLEEPINESS. Depressed mood is the construct that consistently fails to move. Note that vandyk2017
  differs from baum2014 in also failing to show an anxiety effect -- but baum2014's anxiety effect was
  from RESTRICTION below habitual levels, whereas this study EXTENDED from an already-restricted
  baseline, and the constructs that respond may not be symmetric across those directions.

  A NECESSARY CAUTION ABOUT READING THE ABSENCE. I inferred the depression/anxiety null from what is NOT
  in the abstract's list of significant findings. I could not retrieve the article text, so I cannot rule
  out that these outcomes were measured, non-significant, and simply not itemised, or that they were not
  measured at all. That is weaker than a reported null and I have coded it as such (se: null,
  conversion_formula states the inference explicitly). Obtaining the full results table from this paper
  is one of the highest-value remaining actions for this shard, because it is the single best-matched
  experiment available.

  ALSO WORTH NOTING FOR FEASIBILITY. 98% of parents and 100% of adolescents would recommend the protocol.
  Extending a short-sleeping teenager's sleep during term time is acceptable and achievable -- which
  matters if the downstream use of this analysis includes recommending anything.
