rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Strengths: 8 waves from age 5 to 17 in a population-based birth cohort; cross-lagged panel models that adjust each arrow for within-construct stability and within-time covariation, which is the correct way to estimate the two directions simultaneously; adjustment for SES and maternal depression; sensitivity analysis showing 'Cross-lagged paths were identical when listwise deletion was used as an alternative missing data strategy'; formal multigroup tests of sex and puberty moderation. Weaknesses that matter here: (1) EXPOSURE IS NOT SLEEP DURATION. 'Disturbed sleep was parent-reported and included sleep duration, time awake in bed, daytime sleepiness, sleep talking, sleepwalking, night terrors, and nightmares' - a composite dominated by parasomnias and insomnia-like features, which is a poor proxy for volitional sleep curtailment. (2) Sleep was MOTHER-reported throughout adolescence while depression was SELF-reported, so the two constructs have different reporters; this reduces shared-method inflation but a mother's report of a 15-17 year old's sleep is of doubtful validity. (3) Selective participation: 'Participants were from a higher SES and were more often girls compared with the nonparticipants'. (4) Traditional cross-lagged panel models do not separate within-person change from stable between-person differences, so residual confounding by stable traits remains; a RI-CLPM was not fitted. (5) 1,113 adolescents gives limited power for the later waves, so the post-13 nulls could be power rather than true absence of effect."
funding: "not extracted; QLSCD is funded by the Québec government and Canadian agencies"
notes: |
  THIS RECORD DISCHARGES REQUIREMENT 6 (both arrows in the same sample) BETTER THAN ANY OTHER I FOUND, and
  it delivers two findings that pull in opposite directions for the subject.

  FINDING 1: WHERE THE COUPLING EXISTS, IT IS ALMOST PERFECTLY SYMMETRIC.
      forward, sleep -> depression, age 10-12:  beta = 0.10 (0.04, 0.16)
      reverse, depression -> sleep, age 10-12:  beta = 0.09 (0.04, 0.14)
      reverse share = 0.09 / (0.10 + 0.09) = 0.474
  A 47% reverse share, computed inside one model on one sample, with no cross-study comparison needed. This
  independently corroborates my roberts2014 estimate (40% on depressive symptoms, 52% on major depression) and
  sits inside the MR range (22-54%). Three different designs now agree that ROUGHLY HALF of the observed
  longitudinal association between poor sleep and depression in young people is depression causing the sleep
  problem, not the reverse.

  FINDING 2, AND THIS ONE IS SPECIFIC TO THE SUBJECT'S AGE: THE COUPLING DISAPPEARS AFTER 13.
      age 10 -> 12:  both arrows significant
      age 12 -> 13:  ONLY the reverse arrow significant (beta 0.05); forward arrow null
      age 13 -> 15 and 15 -> 17:  NOTHING in either direction
  The subject is 18. In the one cohort that models both arrows across five adolescent waves, the sleep-
  depression cross-lagged coupling is a phenomenon of EARLY adolescence and is undetectable in the second half
  of adolescence. I hold this loosely - n = 1,113 with attrition, so power at the later waves is weaker, and
  a null is not evidence of absence - but it points the same way as everything else in my shard: the effects
  that look large in this literature are largest in populations that are not the subject, and the closer a
  study gets to a late-adolescent male with an externally imposed sleep deficit, the smaller the depression
  signal becomes.

  NO SEX MODERATION HERE, WHICH CONTRADICTS MY OTHER RECORDS. 'The associations between depressive symptoms
  and disturbed sleep did not vary as a function of either sex or puberty-by-sex' (chi-square_33 = 29.468,
  P = .64). That is at odds with conklin2018_basus (effect in young women, null in young men), short2015
  (depressed mood and anxiety worsened in females only), zink2024_abcd (associations 'among females only') and
  wang2024_yrbs (stronger in girls). Marino's test is a global invariance test across the whole model, which
  is far less sensitive than a stratified estimate, so I read this as 'no evidence of moderation in a
  low-powered test' rather than as a genuine contradiction. But it is a real discordance and I am not
  smoothing it over.

  DO NOT CONFUSE THIS RECORD WITH marino2021. Same first author, same journal, adjacent years, different
  papers: marino2021 (PMID 33749768) is the SYSTEMATIC REVIEW AND META-ANALYSIS of cohort studies; this one
  (PMID 35994289) is the PRIMARY cross-lagged analysis of the QLSCD cohort. marino2022_qlscd is cited inside
  marino2021's evidence base only indirectly - in fact the reverse: this paper cites that meta-analysis as
  'A recent meta-analysis'. They are not independent in authorship but they are different data objects.
shard: "s12_psychiatric"
