rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Strengths: very large (n=10,828), nationally distributed US cohort, prospective with a genuine one-year lag, both directions tested in the same sample, gender-stratified a priori, validated CBCL outcome. Weaknesses: (1) AGE IS WRONG FOR US - baseline mean 9.9 years, follow-up 10.9 years. These are children, not late adolescents, and the sleep-depression relationship is developmentally non-stationary (marino2022_qlscd finds the coupling present at 10-12 and absent after 13), so extrapolating this to an 18-year-old is unsafe. (2) Both exposure and outcome are CAREGIVER-reported (sleep duration and CBCL), inflating shared-reporter correlation, while screen time was youth-reported. (3) Exposure dichotomised at the guideline threshold (<9 vs 9-11 h), discarding dose information and precluding any dose-response statement. (4) Outcome dichotomised at t>=65, again discarding information. (5) Only a single one-year lag, so 'bidirectional' is tested across one interval only. (6) Covariate adjustment is not described in the abstract and I could not retrieve the full text, so I cannot judge confounding control. (7) The somatic-complaints estimate barely excludes the null (upper CI 0.97)."
funding: "authors are NIH/NCI staff; ABCD is NIH-funded"
notes: |
  I INCLUDED THIS DESPITE THE AGE MISMATCH FOR TWO REASONS, both about direction rather than magnitude.

  REASON 1: IT IS A THIRD INDEPENDENT MALE-SPECIFIC NULL. The pattern in my shard is now hard to dismiss:
      conklin2018_basus  chronic short sleep predicted depression in young WOMEN (adj Cohen's D 0.13),
                         NOT in young men
      short2015          after total sleep deprivation, depressed mood and anxiety worsened in FEMALE
                         participants only
      wang2024_yrbs      insufficient-sleep/suicidality associations stronger in girls; male trends
                         non-significant
      zink2024_abcd      'among females only'; nothing in males, n=10,828
  Four studies, four designs (prospective cohort, lab experiment, national cross-sectional survey, large
  prospective cohort), same direction of moderation. Our subject is male. This is one of the few places where
  the literature offers a systematic reason to revise his risk DOWNWARD relative to the headline numbers, and
  it is not a subgroup I went looking for - it kept appearing. The dissent is marino2022_qlscd, whose global
  invariance test found no sex moderation.

  REASON 2: THE REVERSE ARROW WAS NULL HERE, WHICH CUTS AGAINST MY OTHER REVERSE-CAUSATION ESTIMATES. In this
  sample the authors explicitly describe the relationship as 'unidirectional (behavior preceding internalizing
  symptoms)'. So this is a data point AGAINST a large reverse-causation share, and I am recording it as such
  rather than only banking the studies that support the ~50% figure. It is a weak data point - one 1-year lag
  at age 10, caregiver-reported outcomes, and nulls in both sexes for the reverse arrow could be power - but a
  shard that only reports the estimates supporting its own synthesis is a broken shard.

  ALSO NOTE which outcomes moved: WITHDRAWN/DEPRESSED and SOMATIC. Not anxious/depressed. The somatic subscale
  is tiredness and physical complaints. That is the same fatigue-shaped signal that carries the causal effect
  in sadikova2024 and berger2026_start, and the same low-positive-affect/withdrawal shape that talbot2010
  found experimentally. The convergence across four unrelated designs on 'sleep loss produces withdrawal,
  low energy and somatic complaints rather than dysphoria' is, to me, the most robust qualitative finding in
  this whole shard.
shard: "s12_psychiatric"
