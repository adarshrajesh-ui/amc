rob:
  tool: AMSTAR-2
  judgement: high
  notes: "I rate the risk of bias HIGH and I want to be explicit about why, because this record's headline number is attractive and should not be over-trusted. (1) The search covered 'Medline, Google Scholar, and Science Direct' only - no Embase, no PsycINFO, no CENTRAL, no trial registries, no grey literature, and Google Scholar is not a reproducible search interface. (2) Only six studies were found for sleep and five for depression, which is a smaller yield than the school-start-time literature actually contains, suggesting incomplete retrieval. (3) 'Both analyses demonstrated high inter-study heterogeneity' but no I^2 or tau^2 is reported in the abstract, and no CI is given for either pooled estimate, so the precision is unknown and a pooled point estimate under high heterogeneity is of limited interpretive value. (4) The constituent studies are uncontrolled or quasi-experimental pre-post policy comparisons, not RCTs, so the pooled SMD inherits their confounding; I have coded the design as quasi_experiment and tier T2 accordingly rather than meta_analysis_of_trials. (5) Author affiliations are entirely a single secondary school (St. Mark's School of Texas: four authors from the school, one from its library, one from its science department), with no epidemiology or biostatistics affiliation listed. That is not disqualifying, and the journal is the peer-reviewed AASM organ, but combined with the search-strategy and reporting gaps it lowers my confidence in the execution. (6) Substantial overlap with sadikova2024/berger2026_start is likely, since the START study is the largest DSST cohort with depression outcomes, so this record is NOT independent of them."
funding: "not stated in the abstract"
notes: |
  WHAT THIS ADDS DESPITE ITS WEAKNESSES: it is the only POOLED quasi-experimental estimate I could find for
  the exposure that actually matches the subject - externally imposed sleep opportunity, not insomnia, not
  self-selected short sleep. Its two numbers line up into a usable dose statement:

      +69 min/night of externally imposed extra sleep  ->  depressive symptoms Hedges' g = -0.20

  Read as a per-hour figure that is g ~ -0.17 per hour, which sits between the two best individual
  quasi-experimental anchors and is reassuringly close to both:
      sadikova2024 (IV, START):        d = -0.156 for +30 min sustained 2 y
      gangwisch2010 (parental bedtime): OR 1.24 for a 2 h difference in imposed bedtime, ~= d 0.12
  Three different quasi-experimental designs converge on a SMALL effect, d roughly 0.1 to 0.3, for imposed
  short sleep on depression scores in adolescents. That is much smaller than the observational literature
  implies and it is the number I would carry forward for the subject.

  THE CAVEAT THAT MUST TRAVEL WITH IT. This meta-analysis pools TOTAL depression scale scores. sadikova2024
  showed, in what is probably the largest single contributor to this very pool, that the total-score effect
  is carried entirely by fatigue and sleep items while the mood items do not move. A pooled total-score SMD
  of -0.20 therefore cannot be interpreted as a -0.20 effect on depressed mood. It is an effect on a
  composite that contains the exposure.

  ACCESS. Abstract only. The PMC record exists (PMC13369063) but is embargoed: 'pmc-exception-type EMBARGO,
  pmc-status-live no, pmc-prop-open-access no'. I therefore have no forest plot, no per-study estimates, no
  CIs and no heterogeneity statistics, and I did not fabricate any. Every number in this record is verbatim
  from the abstract.
