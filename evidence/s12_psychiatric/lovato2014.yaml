rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Narrative-plus-quantitative hybrid; only 7 studies addressed the forward prospective arrow and only 3 the reverse arrow, so the asymmetric conclusion ('little support' for the reverse arrow) rests on very few studies and is likely underpowered rather than genuinely null. Vote-counting logic. Exposure is sleep DISTURBANCE/architecture, largely not sleep DURATION."
funding: null
notes: |
  THIS RECORD CONTRIBUTES NO POOLABLE EFFECT SIZE. I could not retrieve the article text (Elsevier
  paywall; Unpaywall found no OA location), and the abstract reports significance and direction
  without weighted mean differences or CIs. Per the extraction rules I have therefore set se: null
  and used placeholder values that are explicitly flagged as non-poolable in conversion_formula. I am
  including the record anyway because it is a named target and because its two qualitative findings
  bear directly on the reverse-causation question, which is this shard's central task.

  WHY THIS PAPER IS THE WRONG EXPOSURE FOR OUR SUBJECT -- THE CENTRAL DISTINCTION.
  Every sleep variable that distinguishes depressed from non-depressed adolescents in this
  meta-analysis is a measure of sleep CONTINUITY or DEPTH, not sleep OPPORTUNITY: sleep onset
  latency, wake after sleep onset, number of awakenings, sleep efficiency, and percentage stage 1.
  These are the signature of insomnia. Our subject's exposure is the opposite construct: he has a
  short time IN BED because of workload, with (as far as we know) normal sleep efficiency and short
  latency -- in fact chronically sleep-restricted adolescents typically show SHORTER latency and
  HIGHER efficiency than normal, because they are homeostatically loaded. So the adolescent whose
  profile this meta-analysis describes is, on the sleep-architecture axis, close to our subject's
  mirror image. Importing this literature's association wholesale into a risk estimate for him would
  be an exposure-misclassification error, and it would push the estimate upward.

  THE 23-STUDY SPLIT, WHICH IS ITSELF THE EVIDENCE OF ASYMMETRIC ATTENTION:
    - 13 studies: cross-sectional association between depression and sleep disturbance
    -  7 studies: prospective sleep disturbance -> depression
    -  3 studies: prospective depression -> sleep disturbance
  The reverse arrow was tested in 3 studies. The review's conclusion that there is "little support"
  for it should therefore be read as "little evidence was gathered about it," not as evidence of
  absence. Contrast with alvaro2013 (a systematic review specifically designed to test
  bidirectionality) and roberts2014 (both arrows in the SAME adolescent sample, where the reverse
  arrow for major depression was actually the LARGER of the two: OR 4.28 reverse vs OR 3.76 forward).
  I weight roberts2014 far above lovato2014 on the direction question because it avoids the
  literature-selection asymmetry entirely.
