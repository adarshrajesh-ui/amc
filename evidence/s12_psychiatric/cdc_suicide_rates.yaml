rob:
  tool: none
  judgement: na
  notes: "National vital-statistics death certificate data; essentially complete ascertainment of deaths, though suicide is known to be undercounted relative to undetermined-intent and some overdose deaths. This is a descriptive denominator, not an effect estimate, so risk-of-bias tools do not apply. LIMITATION: this particular CDC table ends at data year 2018. US youth suicide rates changed after 2018 and through the pandemic period, so the 2018 figures may understate current rates. I did not retrieve a more recent year and have not extrapolated."
funding: "US federal (NCHS)"
notes: |
  PURPOSE OF THIS RECORD. My task requires absolute risk numbers for an 18-19 year old male. The
  suicidality literature in my shard reports odds ratios and self-reported prevalences, which cannot be
  converted into absolute mortality risk without a population denominator. This record supplies it, from
  vital statistics rather than from self-report.

  THE NUMBERS (2018, deaths per 100,000 per year):
    Male 15-19    17.3        Female 15-19    5.2       male:female ratio 3.33
    Male 20-24    27.9
    Male 15-24    22.7
  For an 18-year-old male the applicable annual baseline is on the order of 17-28 per 100,000, i.e.
  roughly 0.02% per year, or about 1 in 4,300 to 1 in 5,800 per year. Straddling the 15-19/20-24 boundary
  as our subject does, ~20 per 100,000/year is a reasonable working figure.

  HOW TO COMBINE THIS WITH THE RELATIVE RISKS IN MY SHARD, AND THE ARITHMETIC THAT RESULTS.
  Take the most defensible relative estimate for behaviourally imposed short sleep. gangwisch2010, the
  only quasi-experiment, gives OR 1.20 (1.01-1.41) for suicidal IDEATION from a 2+ hour reduction in
  permitted sleep opportunity. Applying a relative increase of that order to a baseline of 20 per 100,000
  gives roughly 24 per 100,000, an absolute increase of about 4 per 100,000 per year, i.e. 0.004
  percentage points, or about 1 additional death per 25,000 exposed young men per year. Over the three
  years of exposure the cumulative absolute excess is on the order of 1 in 8,000.
  I want to be explicit that this arithmetic imports an ideation OR onto a mortality baseline, which is
  not strictly valid -- the OR for completed suicide is not measured anywhere in my shard, and the
  severity gradient in wang2024_yrbs (RR 2.01 ideation, 1.52 medically treated attempt) suggests the
  relative effect SHRINKS as the endpoint becomes more severe, so 1.20 is probably an overestimate for
  death. The purpose of the calculation is to establish the order of magnitude: the absolute suicide-
  mortality consequence for this individual is small in absolute terms even though the relative
  associations in the literature look alarming.

  THE SEX INVERSION IS THE MOST IMPORTANT INTERPRETIVE POINT AND IT CUTS AGAINST MY OWN OTHER FINDINGS.
  Three studies in my shard (short2015, conklin2018_basus, wang2024_yrbs) find the sleep-depression and
  sleep-suicidality associations to be concentrated in FEMALES, which I have treated as a favourable
  qualifier for our male subject. But this record shows that males die by suicide at 3.3 times the female
  rate at 15-19 while reporting fewer ideation and attempt symptoms. So the outcomes on which females
  show greater sleep sensitivity (self-reported ideation, attempts, CESD scores) are precisely the
  outcomes on which females have higher rates but lower lethality. Male suicidality is characterised by
  lower reported symptom burden and much higher case fatality.
  Two consequences the modeller must hold together:
    (1) The female-concentrated sleep effect may be an artefact of measuring the female-typical
        presentation. Instruments that capture sadness, crying and reported ideation will find female
        effects; the male-typical pathway (irritability, impulsivity, substance use, then a highly lethal
        act) is barely measured in this literature. Notably, IRRITABILITY and ANGER are exactly what the
        experimental sleep-restriction studies DO reliably move (baum2014 anger d_z 0.44, vandyk2017 anger
        improves with extension).
    (2) Therefore a small relative effect on impulsivity/irritability in a male carries more absolute
        mortality consequence than a larger relative effect on reported sadness in a female. The
        reassurance offered by the female-specificity findings should be discounted accordingly, and I do
        not treat it as a clean risk reduction.

  DATA VINTAGE CAVEAT. This table's most recent year is 2018. I checked and 2016-2018 male 15-19 rates
  were 14.8, 17.9 and 17.3, so the series was rising then roughly flat at the end of the available window.
  I have not extrapolated beyond 2018 and the modeller should treat 17.3 as a floor rather than a current
  estimate.
