  judgement: high
  notes: "1996 meta-analysis, only 19 studies, pre-PRISMA methods, no risk-of-bias assessment, and I could retrieve the abstract only. Its value is as independent qualitative corroboration of the mood>cognition ordering that palmer2024 and lowe2017 support quantitatively; it should carry no weight of its own in the pooled model."
funding: null
notes: |
  Retained deliberately as the ORIGINAL source of the mood>cognition claim in requirement 3, but with
  no numeric payload. I attempted the publisher's bronze-OA PDF
  (academic.oup.com/sleep/article-pdf/19/4/318/13660411/sleep-19-4-318.pdf) with both plain and
  browser user-agents; both returned HTTP 403. Unpaywall lists the publisher link as the only OA
  location, Semantic Scholar reports the same single BRONZE location, and no green-OA copy exists.
  So the per-domain effect sizes (which I know exist in the paper's tables) are not recoverable to me,
  and I have not guessed them.
  The two claims I can quote verbatim are both directly load-bearing for this shard:
   1. mood > cognitive and motor performance under sleep loss - corroborated quantitatively by
      palmer2024 (mood SMD ~0.6) vs lowe2017 (cognition g ~0.38);
   2. PARTIAL sleep deprivation hits functioning harder than total deprivation - which matters because
      the subject's exposure is chronic partial restriction, and much of the classic literature that
      gets cited at him is acute total deprivation.
shard: "s12_psychiatric"
