    se: 0.14937
    ci: [0.4741, 1.0596]
    conversion_formula: "F(1,55)=34.11 for the Sleep Condition main effect, eta_p^2 printed as 0.38. I verified the df by recomputing eta_p^2 = F/(F+df_err) = 34.11/(34.11+55) = 0.3828, which matches the printed 0.38. t=sqrt(F)=5.8404; N=df_err+3 groups=58; d_z=t/sqrt(N)=5.8404/7.6158=0.7669; se=sqrt(1/N + d_z^2/(2N))=sqrt(1/58 + 0.5881/116)=0.14937."
    from_figure: false
    inferred_from_ci: false
    direction_note: "POSITIVE value = WORSE, i.e. sleep deprivation REDUCED positive affect. Large effect. Held for 9 of 12 individual positive-affect items, and there was no Sleep Condition x Age Group interaction, so it applied equally to adolescents and adults."
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "There was a main effect of Sleep Condition, F (1, 55) = 34.11, eta p 2 = 0.38, p < .001, such that participants reported less positive affect when sleep deprived, compared to rested. There was no main effect of Age Group, F (2, 55) < 1, ns, and there was no Sleep Condition x Age Group interaction, F (2, 55) < 1, ns."
