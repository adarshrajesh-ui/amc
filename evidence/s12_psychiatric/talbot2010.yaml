rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Genuine strengths: within-subject crossover with counterbalanced order, so each participant is their own control; rigorous screening (no past or current Axis I disorder, no sleep disorder, no medical conditions, no head trauma) so the sample is clean of the insomnia and depression confounding that wrecks the observational literature; manipulation verified by actigraphy in 66% of participants plus diaries, and confirmed by a large sleepiness effect, F(1,51)=95.70, p<.001. Weaknesses: (1) n=64 total split across three age bands, so the per-group n is ~20 and the age-interaction tests are badly underpowered - the absence of Sleep x Age interactions should not be read as established equivalence across development; (2) no blinding is possible; (3) the CONTROL condition failed its own manipulation - participants were asked to extend to 8.5 h and did not comply, so the contrast is deprivation versus habitual sleep rather than deprivation versus extended sleep, which the authors concede: 'we shifted our original c[onceptualisation]'; (4) the paper contains at least one df typo, F(1,67) where eta_p^2 implies df_err~55, which lowers my confidence in its statistical reporting generally; (5) multiple outcomes tested with no correction, and three of the five effects I extracted are in the p .01-.05 band."
funding: "NIH (NIHMS318624 indicates NIH-funded author manuscript deposit); exact grant not in the retrieved text"
notes: |
  WHY THIS STUDY WAS REQUESTED AND WHAT IT ACTUALLY SHOWS. This is the Talbot study named in my task, and
  Dahl is a co-author, so it discharges two of the seed names at once. Its exposure is severe acute
  deprivation, not chronic restriction: night 1 max 6.5 h then night 2 max 2 h. That is not the subject's
  exposure and I weight it accordingly.

  ITS VALUE IS THE DISSOCIATION, WHICH IS STARK AND WHICH REPLICATES THE PATTERN I FOUND EVERYWHERE ELSE:
    POSITIVE affect  d_z = 0.767 (0.474, 1.060)   LARGE, p<.001, held on 9 of 12 items
    NEGATIVE affect  |d_z| < 0.131                NULL, F<1
    anxiety during catastrophising  d_z = 0.326   small-moderate
    catastrophe likelihood          d_z = 0.270   small
    threat appraisal of worst worry d_z = 0.284   small
  Sleep loss flattened positive affect substantially and did not touch sadness at all. Depression requires
  either depressed mood or anhedonia; this experiment moved the anhedonia/low-energy axis hard and left the
  dysphoria axis untouched. Everything that did move on the negative side was ANXIETY and THREAT
  APPRAISAL - arousal phenomena, consistent with motomura2013's amygdala hyper-reactivity and with
  blake2016_sense, where an adolescent sleep intervention improved anxiety but not depression.

  THE AUTHORS INDEPENDENTLY IDENTIFY THE CRITERION-CONTAMINATION PROBLEM, and this is why I flag this record
  for the modeller alongside sadikova2024. Explaining why their PANAS null conflicts with older POMS-based
  studies, they write: "The POMS may indicate greater mood disturbance in part because some of its scales
  overlap with sleepiness, such as fatigue and vigor." That is exactly what sadikova2024's item-level
  decomposition of a real policy experiment demonstrated quantitatively fourteen years later: the depression
  scale moves because its fatigue and sleep items move. An experimental affect study and an instrumental
  variable policy study, with nothing in common methodologically, arrive at the same warning: MUCH OF THE
  MEASURED "DEPRESSION" EFFECT OF SLEEP LOSS IS THE SLEEP LOSS BEING RE-MEASURED BY THE DEPRESSION
  INSTRUMENT.

  A COMPETING EXPLANATION I SHOULD NOT SUPPRESS. The authors also offer a floor effect: "the apparent floor
  effect of responses to the PANAS-C negative affect items across conditions (see Table 3) may suggest that
  the PANAS does not assess the type of negative affect experienced when sleep deprived", and they note
  Franzen et al. found increased negative affect on a visual analogue scale but not on the PANAS. So the
  negative-affect null may be partly instrument insensitivity in healthy screened volunteers rather than a
  true absence of effect. I record the null as a bound, not as proof of no effect.

  TRANSPORTABILITY IS THE WEAKEST POINT. The age bands are 10-13, 13-16 and 30-60. NOBODY IN THIS STUDY IS
  THE SUBJECT'S AGE. The 18-19 year old window falls in the gap between the midadolescent and adult bands.
  I set adolescent_match: mixed rather than good, and for the subject's age the better-matched experimental
  records are baum2014 (14-17, chronic restriction), short2015 and vandyk2017.
