rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Strong measurement design for the day-level question: 2 weeks of actigraphy in 104 students, daily diaries, mixed-effects models adjusting for demographics, chronotype and school start time, and -- most importantly -- WITHIN-PERSON night-level contrasts, so stable confounders (personality, baseline depression, SES, chronotype) are differenced out. Limitations: mood and bedtime intention are both self-reported in the same daily diary, so same-day shared-method variance persists; no effect sizes are reported in the abstract and I could not retrieve the text; the between-person depression association is cross-sectional and non-causal; single institution in Singapore; 2-week window says nothing about cumulative effects over years."
funding: null
notes: |
  WHY I SOUGHT THIS RECORD OUT. My task's central instruction is that our subject's sleep restriction was
  "behaviourally imposed by workload, not by insomnia," and that most of the epidemiological association
  runs through insomnia or reverse causation. That means I needed evidence on the specific exposure of
  VOLUNTARY OR CIRCUMSTANTIAL BEDTIME DELAY in exactly his population: residential college students. This
  is the most recent and most directly on-point study I found, and it is a 2026 publication.

  WHAT IT ESTABLISHES THAT MATTERS FOR HIM.
    (1) THE BEHAVIOUR IS THE NORM. 54% of all nights. Our subject is not an outlier among college students.
    (2) THE DOSE PER DELAYED NIGHT IS ABOUT AN HOUR. 0.91 h lost on school nights.
    (3) THE LOSS IS NOT RECOVERED. The mechanism is explicit and important: "because there was no
        compensatory delay in wake-up time." Wake time is anchored by obligations; bedtime is the only
        flexible boundary, so every hour of delay is an hour of sleep permanently forgone that night.
    (4) THERE IS A NEXT-DAY MOOD COST, MEASURED WITHIN-PERSON. This is the causally cleanest part of the
        study. Comparing a student to himself on delayed versus non-delayed nights removes all stable
        confounding, so the worse next-morning mood cannot be attributed to depressed students being
        different people from non-depressed students. It is the closest thing to a natural experiment on
        our subject's exact behaviour.

  THE FINDING THAT CONTRADICTED THE AUTHORS' HYPOTHESIS IS THE MOST USEFUL ONE. They predicted the harm
  would appear on school nights but not on nonschool nights, when students can sleep in. It appeared on
  both, almost equally (0.91 h vs 0.86 h), because students did not actually compensate by waking later
  even when free to. Applied to our subject: his weekend/holiday sleep of 7-8 h with occasional 10-11 h
  nights may be doing less restorative work than the raw hours suggest, if his weekend pattern is itself
  delayed rather than genuinely extended. It also means the "weekend catch-up" assumption embedded in his
  exposure description deserves scrutiny -- see lu2026_sjl for the social-jetlag consequences of exactly
  that weekday/weekend discrepancy.

  THE LIMITS, STATED PLAINLY. This study measures NEXT-MORNING mood after ONE delayed night, over a
  two-week window. Our subject has three years of accumulated restriction. There is no evidence here about
  cumulative or clinical outcomes, and the between-person depression association (frequent delayers have
  higher depression scores) is cross-sectional and fully reversible in direction. No effect size is
  quotable for any mood outcome, so every psychiatric effect in this record has se: null and must not be
  pooled numerically. Its contribution is qualitative but on-target: behaviourally imposed bedtime delay
  in college students does causally degrade next-day mood, within person, at a dose of roughly one hour
  per night.
