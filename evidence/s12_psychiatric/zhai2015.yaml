notes: |
  RELEVANCE AND LIMITS. This is the meta-analysis named in my task, and it is real, but it is an
  ADULT meta-analysis (the title literally says "AMONG ADULTS"), not adolescent, so its
  transportability to an 18-year-old is poor. I have marked adolescent_match: poor_midlife rather
  than mixed because no adolescent stratum is reported. Downstream, short2020 (adolescents) and
  marino2021 (children/youth) should carry the observational weight for this shard, with zhai2015
  used only as an adult sanity check.

  THE MOST INFORMATIVE FEATURE OF THIS RECORD IS ITS SYMMETRY, NOT ITS POINT ESTIMATE.
  Short sleep RR = 1.31 (1.04-1.64). Long sleep RR = 1.42 (1.04-1.92). Long sleep has the LARGER
  point estimate. There is no mechanism by which sleeping 9-10 h causes depression at a higher rate
  than sleeping 5 h; hypersomnia is a diagnostic symptom of depression, and long sleep also tracks
  ill health, unemployment, and low socioeconomic position. The near-identical U-shaped elevation on
  both arms is therefore prima facie evidence that a large share of the total observational
  short-sleep/depression association is confounding-plus-reverse-causation rather than a causal
  sleep-duration effect. A crude but defensible reading: if the long-sleep arm (RR 1.42) is entirely
  non-causal, and if the same non-causal machinery inflates the short-sleep arm, then very little of
  the RR 1.31 remains for causation. I do NOT claim that arithmetic is valid -- the two arms have
  different confounding structures -- but the modeller should not treat RR 1.31 as a causal estimate.
  Compare the MR estimates (zhang2024_mr: short sleep OR 1.179; continuous sleep duration OR 0.998
  per unit, i.e. essentially null), which are far smaller than the observational figure.

  ARITHMETIC PERFORMED. log-RR and SE via se = (log(upper) - log(lower))/3.92 as instructed:
    short: log(1.31) = +0.27003; se = (log 1.64 - log 1.04)/3.92 = 0.11619
    long:  log(1.42) = +0.35066; se = (log 1.92 - log 1.04)/3.92 = 0.15640

  ACCESS. Abstract only (Wiley paywall; no OA copy found via Unpaywall). All numbers above are
  quoted verbatim from the PubMed abstract, which reports the pooled RRs, CIs, I2, k, and n
  explicitly, so no figure-reading or inference beyond the log transform was needed.
