rob:
  tool: MR-STROBE
  judgement: some_concerns
  notes: "Applies nine MR methods with IVW primary, which is good practice, and reports the negative controls (snoring OR 1.000; OSA OR 1.021 ns). But three concerns: (1) the abstract is visibly sloppy -- it lists 'short sleep duration, short sleep duration' twice and 'simple mode, simple mode' twice, and it reports IDENTICAL OR and CI (1.021, 0.972-1.072) for two different exposures (obstructive sleep apnoea and morning person), which is either a transcription error or a copy-paste error, and it undermines confidence in the reported figures; (2) no reverse-direction (MDD -> sleep) analysis is reported, so this study cannot speak to reverse causation at all; (3) the internally contradictory duration results (dichotomous short sleep OR 1.179 vs continuous duration OR 0.998) are not reconciled by the authors."
funding: null
notes: |
  WHY THIS RECORD MATTERS DESPITE ITS FLAWS. It is the ONLY MR study I found that gives a
  clearly positive, quantified causal estimate for the exposure that actually matches our subject:
  SHORT SLEEP DURATION, not insomnia. OR 1.179 (1.108-1.255). If the downstream model needs a
  genetically identified causal effect of short sleep on depression, this is the number, and it should
  be used in preference to any observational figure.

  THE INTERNAL CONTRADICTION IS THE MOST IMPORTANT THING TO UNDERSTAND HERE, AND IT IS NOT A TYPO.
  Two estimates of the same axis in the same paper:
    dichotomous "short sleep duration" -> MDD:  OR 1.179 (1.108-1.255), P < 0.001
    continuous  "sleep duration"       -> MDD:  OR 0.998 (0.996-0.999), P < 0.001
  The continuous estimate is essentially zero. The dichotomous estimate is a 17.9% risk increase.
  These cannot both be describing a smooth linear duration effect. There are two readings:
    (a) THRESHOLD EFFECT (favourable to a causal story): harm is concentrated at the short extreme, so
        a dichotomous "short sleeper" instrument picks up a real threshold effect that a linear
        instrument across the whole range dilutes to nothing. If true, this is GOOD news for the
        validity of applying it to our subject, whose exposure is exactly at the short extreme.
    (b) INSTRUMENT CONTAMINATION (unfavourable): the "short sleep duration" GWAS phenotype is
        substantially contaminated by insomnia. In UK Biobank, self-reported habitual short sleep and
        insomnia symptoms are strongly correlated and share genetic architecture. A "short sleep"
        instrument may therefore be, in part, an insomnia instrument in disguise -- which would
        explain why the dichotomous estimate (1.179) sits close to this paper's own insomnia estimate
        (1.233) while the clean continuous duration measure gives nothing.
  I cannot adjudicate between (a) and (b) from the abstract, and no multivariable MR conditioning
  short sleep on insomnia is reported. This is the single biggest unresolved question for our
  subject's risk estimate, and I name it as such in station_report.md.

  THE LONG-SLEEP NULL IS A CLEAN AND VALUABLE NEGATIVE CONTROL. Observationally, zhai2015 found LONG
  sleep -> depression RR 1.42 (1.04-1.92), numerically LARGER than its short-sleep RR of 1.31. Here,
  genetically proxied long sleep gives OR 0.991 (0.924-1.062), a flat null. So the entire right-hand
  limb of the observational U-curve is non-causal. Since the same confounding and reverse-causation
  machinery (depression causing altered sleep, illness, unemployment, low SES) operates on both limbs,
  this is strong evidence that a large fraction of the observational LEFT limb is also non-causal.
  Quantitatively: the observational short-sleep log-RR is 0.270 (zhai2015); the genetically identified
  short-sleep log-OR is 0.165 (this record); the ratio 0.165/0.270 = 0.61 implies roughly 39% of the
  observational adult association is not causal duration effect. Using the more precisely estimated
  continuous instrument instead, the non-causal share approaches 100%. I report the range rather than
  a point estimate in psychiatric_summary.md.

  NO REVERSE-DIRECTION ANALYSIS. Unlike sun2022_mr and cai2021_mr, this study is unidirectional, so it
  contributes nothing to the reverse-causation fraction directly. Use sun2022_mr and cai2021_mr for that.

  ARITHMETIC. short duration:      log(1.179) = +0.16467, se = (log1.255 - log1.108)/3.92 = 0.03178
              insomnia:            log(1.233) = +0.20945, se = (log1.253 - log1.214)/3.92 = 0.00807
              continuous duration: log(0.998) = -0.00200, se = (log0.999 - log0.996)/3.92 = 0.00077
              long duration:       log(0.991) = -0.00904, se = (log1.062 - log0.924)/3.92 = 0.01772

  AUTHOR-NAME CAVEAT. Both PubMed and Crossref index the authors as "Qiu-Qiang Z, Wei-Wei Y, Shan-Shu H,
  Yi-Ran L", i.e. with the Chinese GIVEN names placed in the surname field by the journal. The true
  family names are almost certainly Zhang, Yang, He and Li, but since I cannot verify that from either
  database I have recorded the citation exactly as the databases return it rather than silently
  reordering the names.

  ACCESS. Abstract only (Elsevier paywall). Sample size is not stated in the abstract, so n: null
  rather than a guess. Note also this paper's incidental finding that daytime napping raises MDD risk
  (OR 1.519, 1.376-1.678) -- I have not extracted it as it is off-domain for this shard, but it is
  another sign that self-reported sleep-behaviour instruments in GWAS carry a lot of
  health-and-mood-related confounding.
