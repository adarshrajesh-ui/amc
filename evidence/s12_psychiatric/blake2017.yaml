rob:
  tool: AMSTAR-2
  judgement: high
  notes: "Authors' own statement: 'There were a small number of randomized controlled trials (RCTs; n = 4) and a high risk of bias across the RCTs; therefore, within sleep condition meta-analyses were examined (n = 221).' The headline numbers are therefore UNCONTROLLED pre-post changes within the treated arm, not randomized between-group contrasts. Pre-post change in an unblinded adolescent sample conflates intervention effect with regression to the mean, seasonal/term effects, and expectancy. Total n = 357 across 9 trials is very small. Authors conclude 'further high-quality RCTs are needed.'"
funding: null
notes: |
  WHY I KEPT THIS RECORD DESPITE NOT BEING ABLE TO QUOTE A MOOD EFFECT SIZE. It is the only
  ADOLESCENT-SPECIFIC intervention meta-analysis in this domain (mean age 14.97), and the two things
  it does quantify are directly load-bearing for our subject's case, even though they are not mood
  outcomes.

  THE 30-MINUTE CEILING IS THE MOST DECISION-RELEVANT NUMBER I EXTRACTED FROM ANY INTERVENTION STUDY.
  Nine trials of the best available adolescent cognitive-behavioral sleep interventions produced a
  subjective total-sleep-time gain of 29.47 min/night (95% CI 17.18-41.75). Our subject's weeknight
  deficit against an 8-9 h adolescent target is on the order of 2.0-3.0 h. So even a fully successful
  course of the best-evidenced adolescent sleep intervention would close roughly 17-25% of his gap.
  This matters in two directions:
    (1) It caps the achievable benefit of any behavioural sleep treatment offered to him. Whatever
        mood benefit the intervention meta-analyses report (gee2019 SMD -0.45, scott2021 -0.47) was
        bought partly by symptom-focused insomnia therapy, not by adding 2 h of sleep, and there is
        no evidence base at all for adding 2 h.
    (2) It reframes the intervention target. His problem is scheduling and workload, not sleep skills.
        The relevant lever is opportunity (hours available), which no trial in this meta-analysis
        manipulated.

  WHAT THE INTERVENTIONS ACTUALLY FIX, AND WHY IT IS AGAIN THE WRONG TARGET. Look at which parameters
  moved: SOL -21.44 min subjective and -16.15 min objective, sleep efficiency +5.34% subjective and
  +2.82% objective, WASO d = 0.59. Every one of those is a sleep-CONTINUITY parameter, i.e. an
  insomnia parameter. This is the same exposure mismatch that runs through lovato2014,
  hertenstein2019, marino2021, gee2019, gebara2018, scott2021, and freeman2017: the entire
  adolescent and adult intervention literature treats people who cannot sleep, and our subject is a
  person who does not have time to sleep. A subject with normal latency and high efficiency has
  almost no headroom on the parameters these interventions move.

  ARITHMETIC TRAIL.
    subjective TST:  29.47 (17.18, 41.75)  -> width 24.57 -> se = 24.57/3.92 = 6.26786
    objective SOL:  -16.15 (-26.13, -6.17) -> width 19.96 -> se = 19.96/3.92 = 5.09184

  AGE RANGE. The abstract gives mean age 14.97 and no range; I recorded [10, 19] as the outer bound
  implied by "adolescent" trials in this literature rather than leaving it null, and flag that the
  mean (14.97) is 3-4 years below our subject's age, which is a real limitation given how much sleep
  regulation and circadian phase change between 15 and 18. adolescent_match is set to exact_16_19 on
  the basis of developmental stage rather than mean age; a downstream modeller preferring strict
  age-overlap should treat it as mixed.
