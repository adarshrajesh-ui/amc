rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "Enormous, nationally representative, properly survey-weighted (n=73,356 across 7 YRBS waves, school response 75-81%, student response 80-88%). But the design is CROSS-SECTIONAL, which is why I assigned tier TX and not T5: exposure and outcome are self-reported on the same questionnaire at the same moment, so (a) temporal order is unknown, (b) a currently suicidal adolescent's sleep report and suicidality report share mood-state and shared-method variance, and (c) depression -- the obvious common cause -- is NOT among the covariates. The exposure is a single item about school-night sleep. This record's value is in its ABSOLUTE numbers, not in its causal content."
funding: null
notes: |
  THIS IS MY SOURCE FOR THE MANDATORY ABSOLUTE PREVALENCES. Exposure definition, verbatim:
  "(<8h) and sufficient sleep (≥8h) based on recommendations of optimal sleep hours for adolescents".
  All prevalences below are survey-weighted percentages from Table 1, 2019 wave (the most recent, and
  the most relevant to a subject who was 16 in roughly 2023-2024):

    OUTCOME                        SUFFICIENT (>=8h)   INSUFFICIENT (<8h)   RD (pp)   RR
    serious suicidal ideation           10.89%              21.88%          +10.99   2.01
    suicide plan                         8.77%              18.26%           +9.49   2.08
    suicide attempt                      4.97%               9.51%           +4.54   1.91
    attempt requiring medical care       1.74%               2.65%           +0.91   1.52

  Note that these crude RRs (about 2.0) are much larger than the ADJUSTED ORs from the same paper
  (1.38, 1.34, 1.24). Adjustment for year, sex, age and race alone roughly halves the association on
  the log scale, and depression was never adjusted for at all. That is a strong hint about how much
  further it would fall under proper confounding control.

  THE SEVERITY GRADIENT IS THE MOST DIAGNOSTIC PATTERN IN THIS TABLE. As the endpoint becomes harder
  and less purely self-reported, the association shrinks monotonically: RR 2.01 (ideation) -> 2.08
  (plan) -> 1.91 (attempt) -> 1.52 (medically treated attempt). If short sleep were causing suicidality
  through a biological pathway, there is no reason for the association to be weakest at the most severe,
  most objectively verifiable endpoint. This pattern is what shared-method variance and mood-congruent
  reporting look like.

  CRITICAL SEX QUALIFIER FOR OUR SUBJECT, WHO IS MALE. Two findings, both quoted above:
    (1) In the sleep x sex interaction, FEMALES with insufficient sleep carried the highest risk
        (ideation OR 1.46, plan OR 1.44) -- above the all-sex estimates of 1.38 and 1.34.
    (2) The rising temporal trend in ideation and plans among insufficient sleepers was significant in
        females (ideation ABPC 3.03%, plan ABPC 4.03%) but "non-significantly increasing among male
        adolescents with insufficient sleep."
  So the male-specific association is weaker than the headline figures, and the secular worsening is a
  female phenomenon in these data. This converges with conklin2018_basus, which found chronic sleep
  deprivation predicted depression in adolescent GIRLS but not BOYS. Two independent datasets, same
  direction of sex moderation. For our subject this is a genuine downward adjustment on the risk
  estimate, and it is one of the few sex-specific findings available in this literature.

  ALSO NOTE THE ABSOLUTE LEVELS ARE COMBINED-SEX. In YRBS, female adolescents report roughly twice the
  ideation and attempt prevalence of males. The male-specific absolute risks are therefore materially
  lower than the table above -- I did not have male-stratified prevalence cells in Table 1 and will not
  invent them, so in psychiatric_summary.md I derive male-specific absolute figures from a separate
  source rather than by halving these.

  DATA-QUALITY FLAG on the suicide-attempt aOR. The printed CI, 1.17-1.38 around a point estimate of
  1.24, is asymmetric on the log scale in a way a logistic-regression OR cannot be (log-distance to the
  lower bound is 0.058 versus 0.107 to the upper). Something is misprinted. I recorded it as published
  and flagged it rather than silently correcting it.

  CONTEXT NUMBER WORTH CARRYING. Insufficient sleep in US adolescents rose from 69.24% (95% CI 67.14-71.27)
  in 2007 to 78.69% (76.96-80.32) in 2019. Nearly four in five US high-school students now sleep under
  8 h on school nights. Our subject's 5-6 h weeknights place him well inside the majority category, but
  toward its short tail; "insufficient sleep" as defined here (<8 h) is a far milder exposure than his.
  This cuts both ways: it means the reference group in these ORs is not a well-rested population, so the
  ORs likely UNDERSTATE the contrast between 8.5 h and 5.5 h, while the confounding critique above still
  stands.
