rob:
  tool: none
  judgement: na
  notes: "Large nationally representative survey (NSDUH) with standardised DSM-based MDE assessment; appropriate for a descriptive denominator. Two caveats stated by the authors: the 2020 point estimates were 'calculated for 2020 and not included in statistical trend analyses because of differences in data collection procedures' (COVID-era changes to NSDUH collection moved it partly online, which affects comparability); and this is a household survey, so institutionalised and homeless populations are excluded. Self/proxy-report diagnosis, not clinician interview."
funding: null
notes: |
  PURPOSE. Supplies the absolute depression denominator that my task requires for an 18-19 year old.

  THE KEY FIGURES (NSDUH 2020, past-year major depressive episode):
    all Americans 12+       9.2%  (SE 0.31)
    adolescents 12-17      16.9%  (SE 0.84)
    young adults 18-25     17.2%  (SE 0.78)

  THE CRITICAL LIMITATION FOR MY USE: THESE ARE COMBINED-SEX AND OUR SUBJECT IS MALE. NSDUH consistently
  shows past-year MDE in the 18-25 band running roughly twice as high in women as in men. The abstract
  states only that depression "increased among nearly all sex, racial/ethnic, income, and education
  groups" and does NOT give sex-stratified prevalences, and I could not retrieve the article text or a
  sex-stratified NSDUH table that I could quote. I therefore will NOT state a male-specific figure as
  though I had measured it. What I can say defensibly:
    - the combined-sex 18-25 figure is 17.2%
    - the male-specific figure is lower than this, and lower than the female-specific figure
    - I could not verify the male value and have not invented one
  In psychiatric_summary.md I present the male baseline as a RANGE anchored on the combined-sex figure and
  the known direction of the sex difference, and I flag it as the weakest number in my absolute-risk
  arithmetic. Retrieving a quotable, sex-stratified past-year MDE prevalence for males aged 18-25 is a
  named gap in station_report.md.

  WHY THE BASE RATE MATTERS MORE THAN THE RELATIVE RISK, WHICH IS THE POINT OF THIS RECORD.
  Roughly one in six young adults has a past-year major depressive episode. Against a base rate that high,
  the relative effects available in my shard translate into modest absolute increments. Using the
  quasi-experimental anchor for behaviourally imposed short sleep (gangwisch2010, OR 1.24 for depression
  from a 2+ hour reduction in permitted sleep) and a male base rate somewhere in the region of 9-12% for
  this age band, the implied absolute increase is roughly 2-3 percentage points. Using the genetically
  identified short-sleep estimate instead (zhang2024_mr, OR 1.179) gives roughly 1.5-2 percentage points.
  Using the null continuous-duration MR estimate (sun2022_mr) gives approximately zero.
  So the honest range for the absolute excess risk of a past-year depressive episode attributable to this
  subject's sleep pattern is roughly 0 to 3 percentage points, on a base of about 1 in 10.

  AND THE COHORT CONTEXT MATTERS TOO. twenge2019 documents that MDE in 18-25 year olds rose from 8.1% in
  2009 to 13.2% in 2017, and this record shows 17.2% by 2020. Our subject's risk is dominated by being an
  18-25 year old in the 2020s -- a secular trend that has roughly doubled the base rate in a decade -- far
  more than by his individual sleep schedule. Declining sleep duration is one of several candidate
  contributors to that secular trend (twenge2019 names it explicitly as a hypothesis), which is a
  population-level argument, not an individual-level one, and should not be double-counted as additional
  personal risk on top of the base rate.
