  notes: "Large, domain-resolved, examines age as a moderator (age group was a significant moderator of the overall effect). Extracted from the abstract only because the article is closed access and no OA copy is retrievable, so no CIs, no risk-of-bias detail, and no per-domain k values are available to me."
funding: null
notes: |
  Included ONLY as the cognition-side yardstick for the mood-vs-performance comparison demanded by
  requirement 3. The pipeline's cognition estimates belong to shards s01/s02; this record should not
  be pooled into a cognition outcome to avoid double counting.
  The comparison it enables:
    cognition under experimental restriction   g = -0.383 (overall), -0.409 (sustained attention)
    mood/emotion under experimental sleep loss SMD = 0.57-0.63 (anxiety), -0.27 to -1.14 (positive affect)
  i.e. affective outcomes move roughly 1.5-2x as much as cognitive outcomes for the same exposure class.
  The abstract also notes that "Age group, time of day, cumulative days of restricted sleep, sleep
  latency, subjective sleepiness, and biological sex were all significant moderators of the overall
  effect", which supports treating age and cumulative dose as real moderators rather than nuisance.
shard: "s12_psychiatric"
