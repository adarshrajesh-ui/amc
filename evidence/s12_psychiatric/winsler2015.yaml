rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "CROSS-SECTIONAL. Self-report sleep and self-report outcomes in the same anonymous survey (shared-method variance). No adjustment for prior mental health, so reverse causation and confounding by depression are entirely unaddressed. No confidence intervals reported anywhere in the paper. Very large N, population-level coverage, and a genuinely continuous sleep measure are the strengths."
funding: null
notes: |
  Requirement 2 asked for ORs AND absolute prevalences; both are here.
  Per-hour-less-sleep ORs: hopelessness 1.38, suicidal ideation 1.42, suicide attempt 1.58.
  Absolute prevalences (unadjusted, by exact reported sleep hour):
    9 h: 19.2% hopeless / 8.1% ideation / 1.8% attempt
    4 h: 51.6% hopeless / 31.5% ideation / 13.3% attempt
  Whole-sample prevalences: hopelessness 28.3%, considered suicide 14.2%, attempted 3.5%.
  Sleep distribution (overall): <=4 h 5.8%, 5 h 10%, 6 h 20.7%, 7 h 28.9%, 8 h 25.1%, 9 h 7.2%, >=10 h 2.3%.
  High-school-only distribution: <=4 h 7.4%, 5 h 13.3%, 6 h 26%, 7 h 30.6%, 8 h 18%, 9 h 3.4%, >=10 h 1.2%.
  IMPORTANT CAVEAT for the pipeline: because this is cross-sectional with no adjustment for prior
  depression, the per-hour ORs here are an UPPER bound on any causal per-hour effect. Compare with
  Roberts 2014, where the equivalent forward arrow is adjusted for baseline depression, and with
  Short 2020, where maximal covariate adjustment halves the log-OR.
  Also note the paper reports increased risk at >=10 h as well, i.e. the relationship is U-shaped at
  the long end: "The relatively small group of students who reported sleeping 10 or more hours of
  sleep a night on the weekdays noted an increased risk for all three of these negative outcomes
  compared to those who receive the recommended 9 h."
  Access route: publisher full text is paywalled and not in PMC or any OA repository (Unpaywall:
  is_oa false, no locations). Numbers above were read from a third-party mirror of the publisher PDF.
  Cross-check: the mirrored text's descriptive statistics (6.5 h high-school mean, 20% <=5 h, 3% at
  9 h, N = 27,939, 51.2% female) match the PubMed abstract exactly, which is independent corroboration
  that the mirror is the genuine article.
