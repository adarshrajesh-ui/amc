rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Genuine strengths: randomized, ACTIVE control (study skills, matched for 7 x 90-min group contact), objective actigraphy alongside self-report, and prospective registration in a school setting. Weaknesses: small (123 of 144 randomized began the intervention, so ~15% did not start); self-reported mood in unblinded adolescents; post-intervention timepoint only in this report; and effect sizes are reported only as verbal descriptors in the abstract, which is why every value in this record has se: null."
funding: null
notes: |
  THIS IS THE CLEANEST RANDOMIZED ADOLESCENT DESIGN I FOUND, AND ITS PATTERN OF RESULTS IS EXACTLY
  WHAT THE REST OF MY SHARD PREDICTS.

  The design controls the two things that inflate most of this literature. It uses an ACTIVE control
  (a study-skills group matched on 7 x 90 minutes of group contact), so non-specific attention and
  expectancy are subtracted out -- unlike freeman2017, whose control was usual practice. And it
  measures sleep objectively by actigraphy alongside self-report.

  WHAT MOVED: anxiety (small effect), global sleep quality (medium), subjective and objective sleep
  onset latency (small/medium), daytime sleepiness (small).
  WHAT DID NOT APPEAR IN THE LIST: depression.

  That dissociation is the single most consistent finding across my entire shard, and it now appears
  in a randomized adolescent trial with an active control:
    - baum2014 (experimental restriction, adolescents): tension/anxiety d_z 0.46, anger/hostility 0.44,
      emotion regulation 0.38 all significant, but POMS Depression/Dejection NOT significant
    - motomura2013 (experimental restriction, young men): STAI state anxiety d_z 0.73 significant,
      POMS Depression d_z 0.11 null
    - palmer2024 (meta-analysis of 50+ years of experimental sleep loss): anxiety and positive affect
      move reliably, depressive symptoms mixed
    - blake2016_sense (randomized, active control, adolescents): anxiety improves, depression does not
  Short-term manipulation of sleep in either direction moves ANXIETY, IRRITABILITY, ANGER, and
  POSITIVE AFFECT. It does not reliably move DEPRESSED MOOD. Depressed mood in the observational
  literature is where the reverse-causation contamination is heaviest, and it is precisely the outcome
  that experimental and active-controlled randomized designs fail to reproduce.

  IMPLICATION FOR OUR SUBJECT. The best-supported prediction for an 18-year-old carrying a chronic
  ~2 h weeknight deficit is elevated anxiety, irritability, low positive affect, and blunted emotional
  regulation -- not major depressive disorder. That is a materially different and less severe
  prognosis than the observational depression literature implies, and it is also a more treatable and
  more reversible one.

  WHY THE MISSING DEPRESSION EFFECT HERE IS WEAK EVIDENCE, STATED HONESTLY. The trial excluded
  adolescents with past or current depressive disorder by design. With no depressive illness in the
  sample there was minimal room for a depression benefit, so its absence is close to uninformative
  about whether sleep affects depression in general. I have coded this as an inference from silence and
  set se: null. It is the internal consistency across four differently designed studies, not this
  trial alone, that carries the argument.

  ALL EFFECT SIZES IN THIS RECORD ARE UNQUANTIFIED IN THE SOURCE I could retrieve. The abstract gives
  verbal descriptors ("medium effect size", "small effect sizes") and no numbers, CIs, or p-values.
  The -0.2 for anxiety is my conventional rendering of "small" and is labelled as such; it must not be
  treated as an extracted value. Obtaining the numeric table from the article text is the top-priority
  gap for this record.
