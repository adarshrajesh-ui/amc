    value: 0.356675
    se: 0.065963
    ci: [0.235722, 0.494296]
    conversion_formula: "Published as HR 0.70 (0.61-0.79) for 7 h vs a 5 h reference. Inverted to the conventional short-vs-normal direction: HR = 1/0.70 = 1.4286, log_hr = -ln(0.70) = +0.356675; CI = [1/0.79, 1/0.61] = [1.266, 1.639]; se = (ln(0.79) - ln(0.61))/3.92 = 0.065963 (unchanged by inversion)."
