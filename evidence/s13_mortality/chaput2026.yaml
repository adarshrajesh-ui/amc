rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: >
    The best available design for the objective-vs-self-report question: the same participants, the
    same deaths, three exposure measurements, one model family. Weaknesses: (1) the UK Biobank
    accelerometer subsample is a healthy-volunteer subset of an already-selected cohort, so absolute
    rates are not generalisable; (2) 7 days of accelerometry is treated as a stable trait exposure and
    is itself subject to short-term variation; (3) only 8.0 years of follow-up, so deaths are
    concentrated in people who were already ill - reverse causation is if anything MORE of a problem
    with a short follow-up in 40-69 year olds, and the paper reports no early-death exclusion in the
    abstract; (4) the 5 h reference category is unusual and means the reported HRs are protective
    effects of normal sleep rather than harmful effects of short sleep, requiring inversion;
    (5) abstract-only access, so I could not check the covariate list or whether sensitivity analyses
    excluding prevalent disease attenuate the device-based estimates. Given (3), the fact that the
    device estimate is LARGER than the self-report estimate may itself be a reverse-causation signature
    rather than evidence of a stronger causal effect.
funding: null
notes: >
  TARGET EXTRACTION #3, first component (objective vs self-report). THE TASK'S PRIOR IS NOT SUPPORTED.
  The task stated "Objective measurement usually WEAKENS the short-sleep association, which is a
  crucial finding". In the largest and most recent head-to-head test available, objective measurement
  STRENGTHENS it:
    device sleep period time  5 h vs 7 h  HR 1.43 (1.27-1.64)   log 0.3567
    device total sleep time   5 h vs 7 h  HR 1.20 (1.12-1.28)   log 0.1863
    self-report               5 h vs 7 h  HR 1.16 (1.00-1.35)   log 0.1508
  Ratio device-SPT : self-report = 2.37. Ratio device-TST : self-report = 1.24.
  .
  HOW TO INTERPRET THIS HONESTLY. Two readings compete and I cannot adjudicate between them from the
  abstract alone:
  (a) Measurement-error reading: UK Biobank self-report is a single coarse integer question, so it is
      heavily diluted by measurement error; the device measure is less diluted, so the larger device
      estimate is the truer estimate of the association. Under this reading the self-report
      meta-analytic RRs (1.04-1.06 at 5 h) are attenuated and the real association is bigger.
  (b) Pathology reading: objectively short sleep in a 40-69 year old is a symptom, not a behaviour.
      It is produced by sleep apnoea, insomnia, pain, nocturia, cardiac and pulmonary disease and
      polypharmacy. An accelerometer measures those conditions more faithfully than a questionnaire
      does, so a larger device-based HR is a larger CONFOUNDING signal, not a larger causal effect.
      The fact that sleep period time (which includes wake after sleep onset, i.e. fragmentation)
      out-predicts total sleep time supports this reading: the strongest predictor is the measure most
      contaminated by disturbed sleep.
  For a healthy 19-year-old whose short sleep is behaviourally and socially imposed rather than
  pathological, reading (b) implies that NONE of the device-based excess transports to him. I regard
  (b) as more likely than (a) but flag this as the largest unresolved interpretive question in the
  shard.
  .
  COHORT OVERLAP WARNING: UK_Biobank, and overlaps saintmaurice2024, liang2023, windred2024, li2026,
  zhang2025. Six of this shard's records draw on UK Biobank. At most one may enter the pooler per
  outcome without robust variance estimation.
