rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: >
    Strong design for the question: objective 7-day wrist accelerometry, 73 513 people, prespecified
    dose-response in four catch-up bands, and a prespecified subgroup restricted to adults sleeping
    <6 h on weekdays at baseline - which is the subgroup that matters for our subject and which the
    authors state agreed with the null main finding. Weaknesses: (1) abstract-only access, so I have the
    >=2 h cell and the two intermediate bands' existence but not their point estimates; (2) 7 days of
    wear generates ~2 weekend nights, a thin basis for classifying a habitual pattern; (3) UK Biobank
    accelerometer subsample is a healthy-volunteer subset of an already healthy-volunteer cohort;
    (4) age 40-79, i.e. an age band in which "catch-up sleep" has a different behavioural meaning than
    in a student with a fixed 8am class; (5) a published commentary exists (Sleep 2024;47(11):zsae159)
    which I did not retrieve; (6) 8-year follow-up limits deaths.
funding: null
notes: >
  I INCLUDED THIS SPECIFICALLY BECAUSE IT CONTRADICTS THE RECORD I WAS MOST EXCITED ABOUT, AND THE
  CONTRADICTION IS NOT RESOLVABLE FROM THE PUBLISHED EVIDENCE.
  .
  THE PROBLEM IN ONE PARAGRAPH. li2026 (Nat Commun 2026) reports, in UK Biobank accelerometer data,
  that severe sleep restriction WITHOUT rebound carries HR 1.42 (1.24-1.63) while the same restriction
  WITH rebound carries HR 1.13 (0.95-1.36) - i.e. rebound sleep removes roughly two thirds of the
  excess log hazard. chaput2024 uses the SAME COHORT, THE SAME DEVICE, essentially the SAME OUTCOME and
  an overlapping period, defines catch-up sleep as longer average weekend than weekday sleep, and finds
  HR 1.17 (0.97-1.41) - nominally harmful - with the null holding in dose-response analyses and in
  adults sleeping <6 h on weekdays. Two analyses of one dataset, opposite conclusions about the
  intervention our subject is actually doing.
  .
  WHY THEY DIFFER (my reading, not the papers'): the two papers do not define the same exposure.
  chaput2024 contrasts people WHO CATCH UP against people WHO DO NOT, across the whole sleep-duration
  distribution, so the comparison is partly "irregular sleepers vs regular sleepers" - and
  windred2024, again in the same cohort, shows irregularity itself predicts mortality better than
  duration does. li2026 conditions on being sleep-restricted and then asks whether rebound follows, so
  its comparison is "restricted-and-recovers vs restricted-and-does-not". Those are different
  contrasts, and only the second one is the subject's counterfactual. That is the most favourable
  reading available to the subject, and I want to be explicit that it is a reading, not a result.
  .
  WHAT THE DOWNSTREAM MODEL SHOULD DO WITH THIS: do NOT pool this with li2026 - they are the same
  cohort_family (UK_Biobank) and would be double-counted, and they point in opposite directions, so
  averaging them manufactures a fake precise null. Treat the weekend-catch-up protective effect as
  SIGN-UNSTABLE ACROSS DEFENSIBLE SPECIFICATIONS, which is a grade D on model dependence in the
  gates.md confidence ledger, i.e. a GUESS. The honest summary is: weekend catch-up sleep has NOT been
  shown to remove the mortality risk of weekday short sleep, and has not been shown not to.
  .
  COHORT OVERLAP WARNING: UK_Biobank accelerometer subsample. Overlaps li2026, chaput2026,
  saintmaurice2024, liang2023, windred2024. Note that chaput2024 and chaput2026 share a first author
  and the same cohort and are NOT independent.
