  # ===== PRIMARY CUTOFF (n=3128), Model 2 fully adjusted, referent = No CUS + normal PSG TST (>=360 min) =====
  - outcome_domain: mortality
    outcome_construct: all_cause_mortality_catchup_x_objective_sleep
    exposure: {type: weekend_catchup, dose_h: null, referent_h: null, duration_days: 7,
               contrast_label: "1 h weekend catch-up sleep AND normal PSG total sleep time (>=360 min) vs NO catch-up AND normal PSG TST (referent), Model 2"}
    scale: log_hr
    unit: null
    value: -0.733969
    se: 0.286481
    ci: [-1.309333, -0.186330]
    conversion_formula: "HR 0.48 (0.27-0.83); value=ln(0.48)=-0.73397; se=(ln0.83-ln0.27)/3.92=0.28648"
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      NEGATIVE = LOWER all-cause mortality. This is the most favourable weekend-catch-up estimate in the
      entire literature (52% lower mortality) and I do not believe it at face value: one hour of weekend
      lie-in cannot halve mortality. Read it as a marker of a healthy, unstressed, non-ill phenotype -
      people who sleep adequately AND can extend a little at weekends. It is recorded because it is the
      cell most similar in structure to our subject's pattern, and because its implausibility is itself
      informative about how much healthy-participant selection contaminates this literature.
    covariates: ["age", "sex", "race", "BMI", "smoking", "hypertension", "diabetes", "AHI with 4% desaturation",
