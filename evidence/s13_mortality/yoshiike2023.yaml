rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: >
    Best-designed weekend-catch-up mortality analysis I found: it cross-classifies self-reported catch-up
    against OBJECTIVE (PSG) sleep ability, adjusts Model 2 for weekday sleep duration, social jetlag,
    napping, sleepiness, hypnotics, insomnia and REM percentage, restricts to middle-aged adults (40-64,
    the youngest of any catch-up study), and runs an early-death sensitivity analysis. BUT THE DECISIVE
    WEAKNESS IS SAMPLE SIZE: 232 deaths spread over six cells, so several cells rest on 9-21 deaths
    (the celebrated 0.36 cell has NINE deaths). AND, critically, THE INTERACTION TESTS ARE NULL:
    P = 0.67 and P = 0.63 for the interaction between continuous TST and CUS. The authors' headline
    story - that the effect of catch-up depends on sleep ability - is NOT supported by a formal
    interaction test in their own data. Additional issues: single-night PSG as a measure of habitual
    sleep ability; catch-up derived from two self-reported numbers; SHHS is enriched for sleep-disordered
    breathing; multiple comparisons across 12 reported cells with no correction.
funding: "Ministry of Health, Labour and Welfare (Japan), grants 21FA1002, 22FA2001"
notes: >
  THIS IS THE CLOSEST ANY PUBLISHED STUDY COMES TO THE SUBJECT'S EXACT PATTERN, AND ITS ANSWER IS
  CONDITIONAL, UNDERPOWERED, AND NOT SUPPORTED BY ITS OWN INTERACTION TEST.
  .
  FULL TABLE 2, ALL-CAUSE MORTALITY, MODEL 2 (fully adjusted), referent = no catch-up + normal PSG TST:
    PRIMARY CUTOFFS (n=3128, 232 deaths, median 12.3 y)
      short PSG TST (<360 min), no catch-up        1.17 (0.82-1.66)   71/688 deaths
      short PSG TST, 1 h catch-up                  1.44 (0.94-2.20)   36/363
      short PSG TST, >=2 h catch-up                1.29 (0.73-2.27)   21/196
      normal PSG TST (>=360 min), no catch-up      1.00 (referent)    68/1022
      normal PSG TST, 1 h catch-up                 0.48 (0.27-0.83)   17/583
      normal PSG TST, >=2 h catch-up               1.15 (0.65-2.05)   19/276
    SECONDARY (STRICTER) CUTOFFS (n=2028)
      short PSG TST (<330 min), no catch-up        1.51 (0.96-2.37)   51/425
      short PSG TST, 1 h catch-up                  1.84 (1.08-3.14)   25/211
      short PSG TST, >=2 h catch-up                1.47 (0.73-2.98)   15/126
      normal PSG TST (>=390 min), no catch-up      1.00 (referent)    40/683
      normal PSG TST, 1 h catch-up                 0.36 (0.17-0.78)    9/390
      normal PSG TST, >=2 h catch-up               0.87 (0.39-1.96)   10/193
    Interaction between continuous TST and CUS: P = 0.67 (primary), P = 0.63 (secondary). NOT SIGNIFICANT.
  .
  THE THREE THINGS THAT MATTER FOR OUR SUBJECT:
  1. THE BENEFIT IS NOT MONOTONE IN CATCH-UP, AND HIS SWING IS THE WRONG SIZE. 1 h of catch-up with
     adequate underlying sleep gave 0.48; >=2 h of catch-up with adequate underlying sleep gave 1.15,
     i.e. nothing. The subject goes from 5-6 h to 7-8 h, a ~2 h swing. On this table that is the null
     cell. Any argument that his weekend recovery is protective cannot be sourced from here.
  2. CATCH-UP DID NOT RESCUE OBJECTIVELY SHORT SLEEPERS. In both cutoff schemes, catch-up in the short-TST
     stratum was associated with HIGHER mortality than no catch-up in the same stratum (1.44 vs 1.17;
     1.84 vs 1.51). If the sleep debt is real, a weekend lie-in did not pay it off in this dataset.
  3. THE PROTECTIVE CELLS ARE NOT CREDIBLE AS CAUSAL EFFECTS. 0.48 and 0.36 mean 52% and 64% mortality
     reductions from one hour of weekend sleep, off 17 and 9 deaths. Nothing in sleep physiology delivers
     that. What delivers that is selection: being able to sleep well and extend slightly at weekends is
     a proxy for not being sick, not being a shift worker, not being poor and not being depressed.
  .
  WHERE THIS LEAVES THE WEEKEND-CATCH-UP QUESTION, WITH FOUR STUDIES NOW EXTRACTED:
    akerstedt2019 (self-report, Swedish March Cohort, <65 y): short weekday + long weekend HR 1.09
                  (0.77-1.54) vs 1.65 (1.22-2.23) for consistent short sleep -> catch-up looks protective
    li2026        (objective, UK Biobank): restriction WITHOUT rebound 1.42 (1.24-1.63) vs WITH rebound
                  1.13 (0.95-1.36) -> catch-up looks protective
    chaput2024    (objective, UK Biobank, same cohort as li2026): >=2 h catch-up 1.17 (0.97-1.41),
                  dose-response null, null in the <6 h weekday subgroup -> catch-up NOT protective
    yoshiike2023  (this record, PSG + self-report, SHHS): protective ONLY at 1 h of catch-up AND ONLY with
                  adequate objective sleep, null at >=2 h, harmful in short objective sleepers, and the
                  interaction test is null -> catch-up NOT reliably protective at the subject's dose
  Two say yes, two say no, and the two that say no include the two that are objectively measured and the
  one that formally tested the interaction. I therefore grade the weekend-catch-up protective effect as
  SIGN-UNSTABLE (grade D on model dependence per gates.md) and instruct the downstream model NOT to apply
  a protective multiplier for weekend recovery as if it were established.
  .
  COHORT OVERLAP WARNING: cohort_family SHHS - OVERLAPS zhao2023 DIRECTLY (both are SHHS; zhao2023 uses
  5027 participants aged 63.9 mean, yoshiike2023 uses the 3128 aged 40-64, so the samples intersect
  substantially). Do not pool them. Also note SHHS constituent cohorts feed several of the meta-analyses.
