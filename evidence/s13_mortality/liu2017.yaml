rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: >
    Strong methods (restricted cubic spline meta-regression, separate 24-h and night-only analyses,
    non-linearity tests, sex subgroups). Weaknesses: (1) self-reported exposure throughout;
    (2) narrow spline CIs for the same reason as yin2017; (3) the 4 h estimate being lower than the
    5 h estimate reveals spline instability at the extremes; (4) the sex subgroup finding is a
    subgroup analysis on aggregated data and could reflect differential confounding or differential
    reporting accuracy between sexes rather than a true biological sex difference - it received two
    published commentaries (Sleep Med Rev 2017;32:132-133 and 32:134). Treat the male null as
    important but not established.
funding: null
notes: >
  TARGET EXTRACTION #2 (dose-response), second synthesis. Answers requested:
    SHAPE: J-shaped (long arm much steeper), P < 0.01 for non-linearity.
    NADIR: 7 h (used as reference).
    RR AT 5 h: 1.06 (1.03-1.09). RR AT 6 h: 1.04 (1.03-1.06). RR at 4 h: 1.05 (1.02-1.07).
    NO SINGLE PER-HOUR SLOPE is reported; the model is a spline, so the implied slope from 7 to 6 h
    is ln(1.04) = 0.039 per hour and from 6 to 5 h only ln(1.06/1.04) = 0.019 per hour, i.e. the
    curve is essentially flat across 5-6 h.
    EVIDENCE BASE: 40 cohorts, 2,200,425 participants, 271,507 deaths (29 cohorts in the 24-h spline,
    13 in the night-sleep spline).
  .
  THE MALE NULL. This is the finding the downstream model most needs to see. Males: 4 h RR 1.01
  (0.96-1.06), 5 h 1.02 (0.97-1.08), 6 h 1.02 (0.98-1.06) - all null. Females: 4 h 1.07 (1.02-1.13),
  5 h 1.08 (1.03-1.14), 6 h 1.05 (1.02-1.09) - all significant. Our subject is male. Taken at face
  value, the sex-specific dose-response evidence puts his habitual-short-sleep mortality RR at
  1.02 (0.98-1.06), which converts to a life-expectancy effect indistinguishable from zero.
  I did not find an independent replication of this sex interaction, so it should widen uncertainty
  rather than be adopted as a point estimate. ungvari2025 reports both sexes significant, which
  contradicts it.
  .
  Access is abstract_only: this journal is not open access and the full text was not retrievable, but
  the abstract reports the complete numeric spline table verbatim, including all sex-stratified
  values, so no number here is second-hand or reconstructed.
  .
  COHORT OVERLAP WARNING: substantially the same primary literature as cappuccio2010, yin2017,
  itani2017, jike2018, ungvari2025. Do not pool these as independent.
