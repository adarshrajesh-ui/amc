rob:
  tool: MR-STROBE
  judgement: moderate
  notes: >
    Strengths: very large single-cohort observational arm with a long 12.68 y median follow-up, an MR
    arm on the same population, and directional replication in an independent biobank (FinnGen), which
    is more than most sleep-MR papers do. Weaknesses: (1) one-sample MR in UK Biobank suffers from
    winner's-curse and weak-instrument bias towards the observational estimate, so a null here is
    conservative but the design is not clean; (2) the abstract reports no instrument counts, F
    statistics, pleiotropy tests or effect sizes for the null estimates, so I cannot assess whether the
    null reflects genuine absence of effect or simple lack of power - this is the central unresolved
    problem with this record; (3) abstract-only access (paywalled, no PMC deposit), so the covariate
    list, the MR sensitivity analyses and the numeric nulls are all unavailable; (4) short and long
    sleep are binary self-reported categories.
funding: null
notes: >
  TARGET EXTRACTION #3, Mendelian randomization component - the NULL MR result, and the most
  informative single comparison in the shard for the causality question because BOTH analyses were run
  in the SAME 451,420 people:
  .
    OBSERVATIONAL short sleep   HR 1.246 (1.195-1.298)    log 0.2199    p < 0.0001
    MR             short sleep   no causal association     (no numbers reported)
    OBSERVATIONAL long sleep    HR 1.735 (1.643-1.831)    log 0.5510    p < 0.0001
    MR             long sleep    no causal association
    MR             napping       OR 1.219 (1.071-1.387)   log 0.1980    p = 0.003
  .
  READ THIS CAREFULLY. A strong, highly significant observational association that vanishes under MR in
  the same sample is the classic signature of confounding or reverse causation. It is NOT proof of
  absence - one-sample MR in UK Biobank is underpowered for modest effects and the paper does not report
  the confidence intervals that would let us bound how large a true effect it could have missed. But
  combined with wu2024's own internal inconsistency (binary short-sleep instrument significant,
  continuous sleep-duration instrument null), the fair summary is that GENETIC EVIDENCE DOES NOT
  CONFIRM A CAUSAL SHORT-SLEEP MORTALITY EFFECT OF THE SIZE SEEN IN OBSERVATIONAL STUDIES.
  .
  I could not obtain numeric nulls because the article is paywalled and absent from PMC and Europe PMC
  (checked both: pmcid None, isOpenAccess N, inEPMC N). I have therefore set se to null rather than
  invent a confidence interval.
  .
  COHORT OVERLAP WARNING: UK_Biobank. Overlaps chaput2026, saintmaurice2024, liang2023, windred2024,
  li2026 and (through the lifespan GWAS) wu2024.
shard: "s13_mortality"
