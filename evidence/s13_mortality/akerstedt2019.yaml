    scale: log_hr
    unit: null
    value: 0.086178
    se: 0.176823
    ci: [-0.261365, 0.431782]
    conversion_formula: "log_hr = ln(1.09) = 0.086178; se = (ln(1.54) - ln(0.77))/3.92 = 0.176823"
    from_figure: true
    inferred_from_ci: true
    direction_note: "positive = higher all-cause mortality. THIS IS THE SUBJECT'S EXPOSURE PATTERN (short weekdays, longer weekends). NULL: CI spans 1.0. Only 37 deaths -> wide CI; 'no association' here is imprecision as much as absence of effect. Excess log-HR is 0.086 vs 0.501 for the consistently-short (SS) cell, i.e. 17.2% of the SS excess survives."
    covariates: ["sex", "BMI", "smoking status", "alcohol consumption", "educational level", "physical activity", "shift work", "Charlson comorbidity index"]
    followup_years: 13.0
    cohort_family: "Swedish_National_March_Cohort"
    quote: "The mortality rate of individuals with short sleep during weekdays, but medium or long sleep over weekends (SML), did not differ from the reference group rate. [Figure 4, Age <65: Short-Medium/Long 37 cases HR 1.09 95% CI 0.77-1.54]"
