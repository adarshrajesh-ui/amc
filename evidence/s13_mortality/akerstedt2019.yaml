rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: >
    Strengths: national register linkage for mortality (essentially no outcome misclassification),
    13 y follow-up, attained-age time scale, explicit adjustment for Charlson comorbidity, sensitivity
    analysis excluding the first 2 years of follow-up, multiple imputation, and further adjustment for
    sleep quality/snoring/hypnotics/subjective health that "did not change results appreciably".
    Weaknesses: (1) exposure is a single baseline self-report on a 6-level ordinal scale (<5,5,6,7,8,>=9 h),
    so misclassification and regression dilution are guaranteed; (2) the critical SML cell has only
    37 deaths (<65 y) / 56 deaths (whole cohort), so the key "catch-up rescues you" finding rests on a
    very small cell and its CI is compatible with HRs from 0.77 to 1.54; (3) the proportional-hazards
    assumption was violated for the sleep exposures in the pooled-age analysis, which is itself the
    age-modification finding but complicates the pooled estimates; (4) volunteer cohort recruited at a
    charity fundraising march, so healthy-volunteer selection; (5) the six weekday/weekend groups were
    formed post hoc by collapsing small cells, giving the exposure definition a data-dependent element.
funding: "AFA Insurance; Italian Institute (Stockholm); Stockholm Stress Center"
notes: >
  HIGH-PRIORITY TARGET #4 for this shard, and the single closest analogue in the entire literature to
  the subject's exposure pattern (short weekday sleep with longer weekend sleep). All cell values were
  read from the printed HR/CI columns of the published forest plots (Figures 2 and 4 of the PMC version,
  PMC7003477), which display the numeric HR and 95% CI as text next to each row - so these are
  transcribed numbers, not measurements off an axis. from_figure is nevertheless set true for those
  effects for full transparency.
  .
  DECISION-RELEVANT ARITHMETIC (age <65, reference = 6-7 h both weekday and weekend):
    consistently short (SS)              HR 1.65  ln = 0.5008
    short weekday + long weekend (SML)   HR 1.09  ln = 0.0862
    fraction of SS excess log-hazard remaining in SML = 0.0862 / 0.5008 = 0.172, i.e. weekend
    catch-up is associated with removal of ~83% of the excess mortality hazard of chronic short sleep.
    Caveat: this is a between-person comparison of two small cells (52 vs 37 deaths), not a
    within-person recovery experiment, and the difference between HR 1.65 and HR 1.09 is not itself
    formally tested. The survival-time (Laplace/quantile) analysis does NOT reproduce the rescue:
    SML loses 8.4 months at the 25th percentile (age-adjusted) versus 7.8 months for SS. The two
    analyses disagree, and this disagreement should widen the downstream uncertainty.
  .
  IMPORTANT MISMATCH WITH THE TASK PROMPT: the prompt asks for "consistently 7 h sleepers" as the
  referent. The paper's referent is NOT 7 h; it is "medium-medium" = 6 OR 7 h on both weekday and
  weekend. The paper's companion (akerstedt2017, same cohort) further concludes that 6 h, not 7 h,
  is the mortality nadir in this cohort. So the referent here is a 6-7 h band and the subject's
  weekday 5-6 h sits partly inside the referent category.
  .
  Exposure categories for the weekday/weekend analysis: short <=5 h, medium 6-7 h, long >=8 h.
  Groups: SS, MM (ref), LL, SML (short weekday + medium or long weekend), ML (medium weekday +
  long weekend), LS (long weekday + short/medium weekend, or medium weekday + short weekend).
  .
  COHORT OVERLAP WARNING: same Swedish National March Cohort as akerstedt2017. The pooler must not
  treat akerstedt2017 and akerstedt2019 as independent evidence.
  .
  TRANSPORTABILITY: poor_midlife. Mean age of the SS cell was 61.2 y and of the SML cell 46.1 y;
  the cohort spans 18-100 y with 64% women. Exposure measured ONCE in adulthood and assumed constant
  for 13 years. Nothing here speaks to a time-limited adolescent exposure that subsequently ends.
shard: "s13_mortality"
