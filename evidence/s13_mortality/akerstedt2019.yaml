effects:
  # ---- PRIMARY TARGET: weekday/weekend combination cells, age <65 (Figure 4, middle panel) ----
  - outcome_domain: mortality
    outcome_construct: all_cause_mortality
    exposure: {type: habitual_short_sleep, dose_h: 5, referent_h: 6.5, duration_days: null,
               contrast_label: "SS: <=5 h weekdays AND <=5 h weekend vs MM: 6-7 h both (reference), age <65 at baseline"}
    scale: log_hr
    unit: null
    value: 0.500775
    se: 0.153865
    ci: [0.198851, 0.802002]
    conversion_formula: "log_hr = ln(1.65) = 0.500775; se = (ln(2.23) - ln(1.22))/3.92 = 0.153865"
    from_figure: true
    inferred_from_ci: true
    direction_note: "positive = higher all-cause mortality. CONSISTENTLY short sleeper (short on weekdays AND weekends). 52 deaths in this cell."
    covariates: ["sex", "BMI", "smoking status", "alcohol consumption", "educational level", "physical activity", "shift work", "Charlson comorbidity index"]
    followup_years: 13.0
    cohort_family: "Swedish_National_March_Cohort"
    quote: "The weekday and weekend sleep duration analysis shows that for age <65 years group sleeping 5 hr or less, both during weekdays and weekend (SS), was associated with a 65% higher mortality rate (HR 1.65; 95% CI 1.22-2.23) compared with those consistently sleeping 6 or 7 hr per night (Figure 4). [Figure 4, Age <65 panel: Medium-Medium 258 cases HR 1.00 Ref; Short-Short 52 cases HR 1.65 1.22-2.23; Short-Medium/Long 37 cases HR 1.09 0.77-1.54; Medium-Long 305 cases HR 1.02 0.86-1.21; Long-Long 239 cases HR 1.25 1.05-1.50; Long-Short 20 cases HR 1.26 0.80-1.98]"
  - outcome_domain: mortality
    outcome_construct: all_cause_mortality
    exposure: {type: weekend_catchup, dose_h: 5, referent_h: 6.5, duration_days: null,
