    direction_note: >
      positive = higher all-cause mortality with LONG sleep. RR 1.39 versus the same group's short-sleep
      RR of 1.12 (itani2017) in an almost identical evidence base (137 vs 153 studies, 5.13 vs 5.17
      million participants). The excess log-risk of long sleep is 2.9x that of short sleep
      (0.3293 vs 0.1133). This is the cleanest like-for-like demonstration of the asymmetry, because the
      two papers share methods, team and source literature.
    covariates: ["varies by constituent study; adjusted data extracted"]
    followup_years: null
    cohort_family: "pooled_multi_cohort_137_studies"
    quote: "We collected data from 5,134,036 participants from 137 prospective cohort studies. ... Long sleep was significantly associated with mortality (RR, 1.39; 95% CI, 1.31-1.47), incident diabetes mellitus (1.26, 1.11-1.43), cardiovascular disease (1.25, 1.14-1.37), stroke 1.02-1.15). Long sleep was not significantly related to incident hypertension dyslipidemia."
