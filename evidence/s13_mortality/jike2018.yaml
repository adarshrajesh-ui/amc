    value: 8.0
    se: null
    ci: null
    conversion_formula: "No numeric threshold is reported in the abstract; the value 8.0 is the conventional long-sleep cutpoint and is a PLACEHOLDER, not an extracted number. se null."
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      The finding is qualitative: "statistically significant linear associations between longer sleep
      duration and increased mortality and incident cardiovascular disease". Contrast with itani2017,
      where a dose-response existed for mortality only below 6 h and for no other outcome. So the long
      arm of the curve behaves more dose-dependently than the short arm - which, since nobody proposes
      that extra sleep is toxic in a graded way, is more naturally read as illness severity grading
      sleep duration than as sleep grading mortality.
    covariates: []
    followup_years: null
    cohort_family: "pooled_multi_cohort_137_studies"
    quote: "Meta-regression analyses found statistically significant linear associations between longer sleep duration and increased mortality and incident cardiovascular disease. Future studies should address whether the relationship between long sleep and health outcomes is causal and modifiable."
rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: >
    Same design and same limitations as itani2017: binary exposure with study-specific cutpoints,
    self-report throughout, heavy cohort re-use across 137 studies, no death counts reported, and
    abstract-only access. The authors themselves close by asking "whether the relationship between long
    sleep and health outcomes is causal and modifiable", i.e. they do not claim causality.
funding: null
notes: >
  This is the paper the task prompt named ("Jike et al., Sleep Medicine Reviews, approx 2018") - correct
  authors, journal and year, but note it is the LONG-sleep paper, not a short-sleep dose-response. The
  companion short-sleep paper by the same group is itani2017 (Sleep Med 2017;32:246-256), which is where
  the short-sleep mortality RR of 1.12 and the six-hour threshold come from. Both are recorded.
  .
  RELEVANCE TO THE SUBJECT. Two connections, both indirect:
  (1) The long/short asymmetry (1.39 vs 1.12 within one research programme) is the strongest single
      quantitative argument that a large share of the sleep-mortality association is not caused by sleep.
  (2) The subject reports "occasional 10-11 h weekend nights". That is NOT the exposure measured here.
      "Long sleep" in every constituent study means HABITUAL long sleep reported as one's usual duration.
      Occasional long recovery nights in a sleep-restricted 19-year-old are homeostatic rebound, and
      li2026 finds that rebound nights are associated with LOWER, not higher, mortality risk. Nothing in
      jike2018 should be applied to the subject's weekend oversleeping.
  .
  COHORT OVERLAP WARNING: same primary literature as itani2017, cappuccio2010, liu2017, yin2017,
  ungvari2025.
