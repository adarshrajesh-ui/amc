rob:
  tool: MR-STROBE
  judgement: moderate
  notes: >
    Reasonable MR practice: IVW plus MR-Egger, leave-one-out, MiXeR polygenic-overlap and conjFDR
    analyses, multivariable MR conditioning on chronotype and insomnia, and two-step mediation.
    Serious limitations: (1) the outcome is PARENTAL survival (Timmers et al., 1,012,240 parents, 60%
    deceased), so the exposure is measured in offspring and the outcome in their parents - the
    instrument acts on the parents' genotype only through transmission, which halves the effective
    exposure and makes the units doubly opaque; (2) the exposure is a BINARY self-reported short-sleep
    case definition, and binary-exposure MR with 22 instruments is prone to weak-instrument bias, which
    inflates magnitudes (the CAD OR of 2.35 is the tell); (3) the continuous sleep-duration instrument
    gives a null, contradicting the binary result; (4) heterogeneity across instruments was significant
    in MVMR (Q = 212.18, df = 137, P < 1e-4); (5) sample overlap between the sleep GWAS (UK Biobank) and
    the lifespan GWAS (which includes UK Biobank) violates the two-sample assumption and biases towards
    the observational estimate; (6) no units are stated for the outcome, so the estimate cannot be
    placed on a life-expectancy scale.
funding: "National Natural Science Foundation of China; Yunnan Fundamental Research Projects; Health Commission of Hubei Province; Wuhan Municipal Health Commission; Spring City Plan (Kunming)"
notes: >
  TARGET EXTRACTION #3, Mendelian randomization component - the POSITIVE MR result. Directionally
  supports a causal effect of short sleep on lifespan, with mediation through CAD, T2D and depression.
  .
  BUT THIS RECORD CANNOT CONTRIBUTE A MAGNITUDE. The beta of -0.60 is expressed in units of the
  Timmers parental-survival Cox residual per unit log-odds of genetically predicted short-sleep case
  status. The paper never states what one unit means. There is no defensible arithmetic that turns
  -0.60 into months of life for a 19-year-old, and any attempt to do so would be fabrication.
  Downstream, this record should be used ONLY as (a) evidence that the sign is plausibly causal and
  (b) a prior on the existence of a mechanism, not as an effect size.
  .
  THE MR EVIDENCE IS ALSO INTERNALLY AND EXTERNALLY CONTRADICTED:
    - internally, the continuous sleep-duration instrument is null (beta 0.24, -0.52 to 1.00, P = 0.54)
      while the binary short-sleep instrument is strongly negative;
    - externally, zhang2025 (PMID 39883542) ran MR on UK Biobank plus FinnGen and found NO causal
      association of sleep duration, short sleep or long sleep with mortality, while the same paper's
      observational analysis found HR 1.246 for short sleep. Two MR studies of the same question
      disagree.
  Net assessment: MR provides weak, contested support for a causal effect of the short-sleep
  PHENOTYPE, and no usable estimate of its size. Genetic liability to being a short sleeper is also not
  the same exposure as three years of externally imposed adolescent sleep restriction - a lifelong
  genetic propensity is exactly the "trait" exposure, whereas our subject has a "state" exposure that
  ends.
