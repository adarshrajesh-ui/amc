    covariates: []
    followup_years: 85.0
    cohort_family: "Terman_Life_Cycle_Study"
    quote: "Data from childhood were refined and mortality data collected for 1,145 participants from the Terman Life Cycle Study. Participants were born between 1904 and 1915, lived to at least 1940, and had complete age, bedtime, and waketime data at initial data collection (1917-1926). Homogeneity of the cohort sample (intelligent, mostly White) limits generality but provides natural control of common confounds. Through 2009, 1,039 participants had confirmed deaths. Sleep duration was calculated as the difference between each child's bed and wake times."
rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: >
    This is the only age-appropriate exposure in the shard, and it is methodologically weak. (1) Exposure
    is bedtime-minus-waketime reported by adults about children in 1917-1926 - time in bed, not sleep,
    with no validation. (2) The mortality effect is modelled as a QUADRATIC deviation term, so the
    reported HR of 1.15 conflates short and long sleep and cannot be decomposed into a short-sleep
    effect; the task's question "what is the risk of adolescent short sleep" is therefore not answered
    even by this study. (3) Left truncation: participants had to survive to 1940 to enter, removing
    early deaths and any effect expressed in youth. (4) Highly selected sample (Terman recruited
    high-IQ, mostly White Californian children); the authors concede "Homogeneity of the cohort sample
    (intelligent, mostly White) limits generality". (5) n = 1145 with a sex-stratified analysis, so the
    sex difference is underpowered. (6) Sleep was measured ONCE in childhood but almost certainly
    correlated with lifelong sleep habits, so the design cannot separate "having been a short sleeper as
    a child" from "having been a short sleeper for eighty years" - which is precisely the distinction our
    subject's question turns on. (7) Birth cohort 1904-1915: mortality causes, medicine and sleep
    ecology bear little resemblance to a 2020s college student's.
funding: null
notes: >
  TARGET EXTRACTION #5 (sleep duration and mortality with exposure measured in adolescence or young
  adulthood). VERDICT: **INSUFFICIENT EVIDENCE**.
  .
  I searched systematically for cohorts with adolescent or young-adult sleep exposure and mortality
  follow-up: PubMed queries combining sleep duration with mortality and adolescents/young adulthood/
  baseline age 18-30/conscripts/students, plus a Europe PMC title-and-abstract query
  (TITLE:"sleep" AND TITLE:"mortality") AND (ABSTRACT:"adolescen*" OR ABSTRACT:"young adult*") which
  returned exactly ONE hit, an unrelated paper on obstructive sleep apnoea in congenital heart disease.
  This study - a 1917-1926 measurement of children's bedtimes in the Terman cohort - is the ONLY study
  I found in which sleep was measured before adulthood and participants were followed to death.
  .
  AND IT DOES NOT ANSWER THE QUESTION. Three reasons, each independently disqualifying:
    1. The effect is a QUADRATIC deviation term (HR 1.15 for sleeping either less OR more than
       age-predicted). There is no short-sleep-specific estimate to extract.
    2. Participants had to survive to 1940 to be included, so the design is left-truncated and blind to
       any risk expressed in adolescence or early adulthood.
    3. Sleep was measured once in childhood and never again. The paper's own interpretation is that
       "sleep may be a core biobehavioral trait" - i.e. the authors read their finding as evidence that
       childhood sleep INDEXES a lifelong trait, not that a bounded childhood exposure causes later
       death. That reading is the opposite of what our subject needs: he had a bounded, externally
       imposed episode which he can end.
  .
  So: for the specific question "what is the mortality cost of three years of sleep restriction at ages
  16-19 followed by normalisation", the literature contains NO direct evidence. Not weak evidence -
  none. Any number the downstream model produces for this quantity is an extrapolation from midlife and
  elderly trait-exposure cohorts, and should be labelled as such.
  .
  Access is abstract_only: PMC4468018 is an author manuscript not released to the Europe PMC full-text
  API (fullTextXML returned HTTP 404). The abstract contains both HRs verbatim.
  .
  adolescent_match is set to exact_16_19 on the EXPOSURE AGE only (childhood/adolescence, 1917-1926).
  Everything else about this study - birth cohort, selection, measurement - is a poor match, and the
  rob judgement of "high" risk of bias should dominate any use of it.
shard: "s13_mortality"
