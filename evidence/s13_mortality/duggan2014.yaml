    scale: probability
    unit: "proportion of the analysed sample with confirmed deaths by 2009"
    value: 0.90742
    se: null
    ci: null
    conversion_formula: "1039 confirmed deaths / 1145 participants = 0.90742"
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      Descriptive. Sleep duration was NOT reported by the children: it was DERIVED as the arithmetic
      difference between parent- or teacher-reported bedtime and waketime, collected once in 1917-1926.
      That is time in bed, not total sleep time, and it carries no information about sleep quality,
      latency or awakenings. Nearly the whole cohort (90.7%) is now dead, so this is a near-complete
