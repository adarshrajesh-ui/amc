effects:
  # ---- THE CATCH-UP / REBOUND CONTRAST, measured objectively ----
  - outcome_domain: mortality
    outcome_construct: all_cause_mortality
    exposure: {type: chronic_restriction, dose_h: null, referent_h: null, duration_days: 7,
               contrast_label: "severe sleep restriction (>3.5 h cumulative loss vs own sleep need) WITHOUT rebound vs regular sleep"}
    scale: log_hr
    unit: null
    value: 0.350657
    se: 0.069762
    ci: [0.215111, 0.488580]
    conversion_formula: "log_hr = ln(1.42) = 0.350657; se = (ln(1.63) - ln(1.24))/3.92 = 0.069762"
    from_figure: false
    inferred_from_ci: true
    direction_note: "positive = higher all-cause mortality. Severe restriction with NO recovery sleep. p = 6.98e-7. Model 3, fully adjusted including baseline sleep duration."
    covariates: ["age", "sex", "ethnicity", "employment status", "education", "BMI", "smoking status", "alcohol frequency", "physical activity", "night shift work", "early chronotype", "baseline sleep duration"]
    followup_years: 8.0
    cohort_family: "UK_Biobank"
    quote: "In the fully adjusted Model 3, both SR without rebound and severe SR without rebound were significantly associated with higher mortality compared to regular sleep in the overall sample (hazard ratio [HR] = 1.15, 95% confidence interval [CI] = 1.01-1.31; HR = 1.42, 95% CI = 1.24-1.63, respectively)."
  - outcome_domain: mortality
    outcome_construct: all_cause_mortality
    exposure: {type: recovery_sleep, dose_h: null, referent_h: null, duration_days: 7,
               contrast_label: "severe sleep restriction WITH rebound (extra sleep on the night after restriction) vs regular sleep"}
    scale: log_hr
    unit: null
    value: 0.122218
    se: 0.091525
    ci: [-0.051293, 0.307485]
    conversion_formula: "log_hr = ln(1.13) = 0.122218; se = (ln(1.36) - ln(0.95))/3.92 = 0.091525"
    from_figure: false
    inferred_from_ci: true
    direction_note: >
      positive = higher mortality but NULL (p = 0.169). THE KEY OBJECTIVE-MEASUREMENT REPLICATION OF
      THE WEEKEND-CATCH-UP FINDING. Compared with the no-rebound counterpart (log 0.3507), rebound
      leaves only 0.1222/0.3507 = 34.8% of the excess log-hazard, i.e. recovery sleep is associated
      with removal of ~65% of the excess mortality hazard of severe sleep restriction.
      The authors are careful that the point estimate remains above 1.0.
    covariates: ["age", "sex", "ethnicity", "employment status", "education", "BMI", "smoking status", "alcohol frequency", "physical activity", "night shift work", "early chronotype", "baseline sleep duration"]
    followup_years: 8.0
    cohort_family: "UK_Biobank"
    quote: "When sleep rebound occurred, neither SR nor severe SR showed significant associations with mortality, although the point estimates were above 1.0. The multivariable adjusted HRs for all-cause mortality were 1.12 (95% CI = 0.98-1.28) for participants experiencing SR with rebound and 1.13 (95% CI = 0.95-1.36) for those experiencing severe SR with rebound."
  - outcome_domain: mortality
    outcome_construct: all_cause_mortality
    exposure: {type: chronic_restriction, dose_h: null, referent_h: null, duration_days: 7,
               contrast_label: "moderate sleep restriction (2.5-3.5 h cumulative loss) WITHOUT rebound vs regular sleep"}
    scale: log_hr
    unit: null
    value: 0.139762
    se: 0.066346
    ci: [0.009950, 0.270027]
    conversion_formula: "log_hr = ln(1.15) = 0.139762; se = (ln(1.31) - ln(1.01))/3.92 = 0.066346"
    from_figure: false
    inferred_from_ci: true
    direction_note: "positive = higher mortality, just significant (p = 0.030). Moderate restriction without recovery."
    covariates: ["age", "sex", "ethnicity", "employment status", "education", "BMI", "smoking status", "alcohol frequency", "physical activity", "night shift work", "early chronotype", "baseline sleep duration"]
    followup_years: 8.0
    cohort_family: "UK_Biobank"
    quote: "both SR without rebound and severe SR without rebound were significantly associated with higher mortality compared to regular sleep in the overall sample (hazard ratio [HR] = 1.15, 95% confidence interval [CI] = 1.01-1.31; HR = 1.42, 95% CI = 1.24-1.63, respectively)."
  - outcome_domain: mortality
    outcome_construct: all_cause_mortality
    exposure: {type: recovery_sleep, dose_h: null, referent_h: null, duration_days: 7,
               contrast_label: "moderate sleep restriction (2.5-3.5 h loss) WITH rebound vs regular sleep"}
    scale: log_hr
    unit: null
    value: 0.113329
    se: 0.068128
    ci: [-0.020203, 0.246860]
    conversion_formula: "log_hr = ln(1.12) = 0.113329; se = (ln(1.28) - ln(0.98))/3.92 = 0.068128"
    from_figure: false
    inferred_from_ci: true
    direction_note: >
      positive = higher mortality but null (p = 0.090). At MODERATE restriction, rebound buys much
      less: 0.1133/0.1398 = 81% of the excess log-hazard remains, versus 35% at severe restriction.
      So the "catch-up rescues you" effect is concentrated in the severe-restriction stratum, and is
      weak where the restriction is mild. This is an honesty-critical nuance: the subject's weekday
      pattern (5-6 h vs a ~9 h adolescent need) is closer to severe than moderate by this paper's
      definitions, but he is also 40 years younger than anyone in the cohort.
    covariates: ["age", "sex", "ethnicity", "employment status", "education", "BMI", "smoking status", "alcohol frequency", "physical activity", "night shift work", "early chronotype", "baseline sleep duration"]
    followup_years: 8.0
    cohort_family: "UK_Biobank"
    quote: "The multivariable adjusted HRs for all-cause mortality were 1.12 (95% CI = 0.98-1.28) for participants experiencing SR with rebound and 1.13 (95% CI = 0.95-1.36) for those experiencing severe SR with rebound."
  # ---- short-sleeper stratum: closest to the subject's baseline ----
  - outcome_domain: mortality
    outcome_construct: all_cause_mortality
