    from_figure: false
    inferred_from_ci: true
    direction_note: >
      positive = higher mortality. Short habitual sleepers who further restrict and do NOT recover.
      In this same short-sleeper stratum, both rebound patterns were null (p = 0.628 for SR with
      rebound and p = 0.639 for severe SR with rebound), i.e. the protective association of rebound
      holds specifically in the group most like the subject in exposure structure.
    covariates: ["age", "sex", "ethnicity", "employment status", "education", "BMI", "smoking status", "alcohol frequency", "physical activity", "night shift work", "early chronotype"]
    followup_years: 8.0
    cohort_family: "UK_Biobank"
    quote: "Among participants with short baseline sleep duration, both SR and severe SR without rebound were significantly associated with higher mortality risk compared to regular sleep (HR = 1.19, 95% CI = 1.01-1.40; HR = 1.38, 95% CI = 1.17-1.63, respectively). ... P values (vs. regular sleep) for SR without rebound, SR with rebound, severe SR without rebound, and severe SR with rebound, respectively: short (0.034, 0.628, 1.36x10-4, 0.639)"
  - outcome_domain: mortality
    outcome_construct: all_cause_mortality
    exposure: {type: chronic_restriction, dose_h: null, referent_h: null, duration_days: 7,
