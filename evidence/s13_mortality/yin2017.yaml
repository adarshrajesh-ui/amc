               contrast_label: "5 h/day vs 7 h/day referent, restricted cubic spline dose-response"}
    scale: log_rr
    unit: null
    value: 0.039221
    se: 0.004906
    ci: [0.029559, 0.048790]
    conversion_formula: "log_rr = ln(1.04) = 0.039221; se = (ln(1.05) - ln(1.03))/3.92 = 0.004906"
    from_figure: false
    inferred_from_ci: true
    direction_note: >
      positive = higher all-cause mortality. THE HEADLINE DOSE-SPECIFIC NUMBER: sleeping 5 h carries
      a 4% relative excess versus 7 h, not the 12-13% suggested by categorical "short sleep"
      contrasts. Note the CI is implausibly tight (1.03-1.05) because spline CIs from aggregated
      dose-response data ignore between-study heterogeneity in the curve shape; treat this SE as an
      underestimate of real uncertainty.
