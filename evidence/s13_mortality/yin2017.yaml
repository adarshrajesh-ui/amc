rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: >
    The best-executed dose-response synthesis for this question: restricted cubic splines, explicit
    non-linearity test, Hamling conversion for studies with non-standard referents, publication-bias
    testing with trim-and-fill. Weaknesses: (1) all constituent exposures are self-reported;
    (2) spline CIs are far too narrow because they propagate within-study precision but not
    heterogeneity in curve shape - the CI of 1.03-1.05 at 5 h should not be believed as stated;
    (3) 40 aggregated cohort estimates, no individual-participant data, so no ability to adjust
    uniformly for prevalent disease or exclude early deaths; (4) no age-stratified dose-response,
    which is exactly what a 19-year-old subject requires; (5) the marked short/long asymmetry is
    reported but not interrogated for reverse causation.
funding: null
notes: >
  TARGET EXTRACTION #2 (dose-response). Everything the task asked for:
    SHAPE: U-shaped, P < 0.01 for non-linearity.
    NADIR: approximately 7 h/day; "varied little by sex".
    PER-HOUR BELOW NADIR: RR 1.06 (1.04-1.07) per 1 h reduction.
    PER-HOUR ABOVE NADIR: RR 1.13 (1.11-1.15) per 1 h increment.
    RR AT 5 h: 1.04 (1.03-1.05).
    RR AT 6 h: 1.01 (1.00-1.01).
    EVIDENCE BASE: 40 cohort estimates in the dose-response analysis (57 for the categorical
    contrast), 3,582,016 participants, 241,107 all-cause deaths.
  .
  The single most important quantitative fact this shard produces: the dose-specific mortality
  excess at the subject's weekday sleep duration is 1-4%, not 12-13%. And the long-sleep arm is
  much steeper than the short-sleep arm, which is a strong internal signal of reverse causation
  contaminating both.
  .
  COHORT OVERLAP WARNING: heavily overlapping constituent cohorts with cappuccio2010, liu2017,
  itani2017, jike2018 and ungvari2025 - these six records are five re-analyses of substantially the
  same underlying primary literature. The pooler must select ONE dose-response synthesis as the
  primary mortality input (recommend this one or liu2017) rather than averaging them.
shard: "s13_mortality"
