rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: >
    Very large individual-participant pooling (9 cohorts, 322 721 people, 33 187 deaths, ~14 y
    follow-up), sex-specific by design, with formal tests for effect modification by age and BMI.
    Weaknesses: (1) exposure measured 1984-2002 by single self-report items that differed across the 9
    contributing cohorts; (2) mean age 54.5 y; (3) abstract-only access - I retrieved the PMC record but
    it contains no results tables, so I could NOT extract the short-sleep cells (<=5 h, 6 h) and have
    deliberately not guessed them; (4) no adjustment for depression, socioeconomic position, or
    prevalent cancer/CVD beyond diabetes and hypertension; (5) J-shaped, so the reported "greatest
    association" is at the long end and the short end is comparatively weak but unquantified here.
funding: null
notes: >
  WHAT THIS RECORD CONTRIBUTES, given that I could not get its short-sleep cells:
  .
  1. THE NADIR IS 7 H, CONFIRMED OUTSIDE WESTERN POPULATIONS, in 322 721 people. This is the single most
     robust fact in my whole domain: yin2017 (nadir 7 h), liu2017 (nadir ~7 h), kripke2002 (best
     survival at 7 h), svensson2021 (nadir 7 h in both sexes, East Asia). The referent for any
     life-expectancy conversion should therefore be 7 h, NOT 8 h. This matters arithmetically: using an
     8 h referent inflates every short-sleep effect, and several primary studies (xiao2019) do use 8 h.
  2. THE SHAPE IS J, NOT U - the long arm is steeper. In this cohort the largest association anywhere in
     the distribution is >=10 h (men 1.34, women 1.48), which is larger than any short-sleep estimate in
     any of the meta-analyses I extracted. A biological account of sleep loss cannot explain that. Illness
     causing long sleep can. This is the reverse-causation signature, and it appears in every large
     dataset (jike2018 RR 1.39 long vs itani2017 RR 1.12 short; ungvari2025 1.34 vs 1.14;
     yin2017 1.35 vs 1.13; cappuccio2010 1.30 vs 1.12).
  3. AGE MODIFIES THE ASSOCIATION IN MEN (P < .001) AND NOT IN WOMEN. Required extraction 6 asked whether
     the association differs by age at exposure. In the largest test of that question available, it does,
     in males specifically. Direction not reported in the abstract; akerstedt2017 supplies the direction
     in a different cohort and it is the OPPOSITE of reassuring (short-sleep HR 2.45 in those under 45 vs
     1.05 in the over-65s).
  .
  TRANSPORTABILITY: poor_midlife. Mean age 54.5 y, exposure measured once, 1984-2002, East Asian
  populations whose sleep-duration distribution and mortality causes differ from a UK/US student's.
  .
  COHORT OVERLAP WARNING: cohort_family Asia_Cohort_Consortium - includes JPHC, JACC, Miyagi, Ohsaki,
  Singapore Chinese Health Study, Shanghai Women's/Men's Health Studies, Korean cohorts. Several of
  these individual cohorts are also pooled inside cappuccio2010, liu2017, yin2017 and ungvari2025. Do
  NOT add this to those meta-analyses; it is largely the same data re-analysed at individual level.
