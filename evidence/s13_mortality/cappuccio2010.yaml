rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: >
    Landmark but now-superseded meta-analysis. Critical weaknesses for our purpose: (1) every
    constituent study measured sleep by questionnaire once at baseline; (2) study-specific and
    mutually incompatible cutpoints for "short" (<5 h in some, <7 h in others) are pooled as if they
    denoted the same exposure, so the pooled RR of 1.12 has no dose interpretation whatsoever and
    cannot be attached to any particular number of hours; (3) no dose-response modelling; (4) adjustment
    sets differ across studies and residual confounding by prevalent and subclinical disease is not
    addressed; (5) significant heterogeneity for both contrasts. Kurina et al. (2013, PMID 23622956)
    reviewed the same literature and reached the opposite conclusion, that a consistent association
    is not established.
funding: null
notes: >
  TARGET EXTRACTION #1. The task prompt's description is accurate: authors, journal and year all match
  (Cappuccio FP, D'Elia L, Strazzullo P, Miller MA; Sleep 2010;33(5):585-92). Numbers as requested:
    SHORT sleep: RR 1.12 (95% CI 1.06-1.18), P < 0.01
    LONG  sleep: RR 1.30 (95% CI 1.22-1.38), P < 0.0001
    16 studies / 27 independent cohort samples
    1,382,999 participants
    112,566 deaths
    follow-up range 4-25 years
  .
  WHY THIS NUMBER SHOULD NOT DRIVE THE FINAL ESTIMATE. The 1.12 is a categorical "short vs referent"
  contrast with heterogeneous cutpoints. The later dose-response meta-analyses that model sleep
  duration continuously (liu2017, yin2017) decompose this same literature and find that the excess
  risk at 5-6 h is far smaller than 12%: Yin reports RR 1.04 at 5 h and 1.01 at 6 h versus a 7 h
  referent; Liu reports 1.06 at 5 h and 1.04 at 6 h. The categorical 1.12 is inflated relative to the
  dose-specific values because the "short" category in many constituent studies is anchored on
  extreme sleepers (<=4-5 h) and because the pooled contrast mixes referent definitions. For a
  subject sleeping 5-6 h the dose-response estimates are the right ones to use.
  .
  Population age not reported in the abstract; the constituent cohorts are predominantly midlife and
  older adults, hence adolescent_match poor_midlife. Abstract-only access: the abstract contains every
  number requested by the task, so full text was not required for this extraction.
