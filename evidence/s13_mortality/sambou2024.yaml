rob:
  tool: MR-STROBE
  judgement: high
  notes: >
    Serious limitations for our purpose. (1) ONE-SAMPLE MR in UK Biobank, so instrument and outcome come
    from the same participants, which inflates weak-instrument bias towards the observational estimate -
    that biases this result in the ANTI-conservative direction and the true causal effect is plausibly
    smaller than 0.98. (2) The exposure is a BINARY "healthy sleep duration 7-8 h", not hours of sleep,
    so no per-hour effect and no dose-response; it cannot tell us about 5-6 h specifically. (3) The
    outcome is TERMINATED HEALTHSPAN - a composite in which death is one of eight events and the other
    seven are common chronic diseases - so this is not an all-cause-mortality estimate and must not be
    entered into a mortality pool as if it were. (4) Sleep-duration genetic instruments have small
    effects (roughly minutes per allele) and the linear extrapolation from allele-level effects to a
    multi-hour behavioural contrast is exactly the extrapolation MR is worst at. (5) 590 instruments
    across six sleep traits raises pleiotropy concerns despite the null MR-Egger intercept.
    (6) Abstract-only access. (7) UK Biobank healthy-volunteer selection.
funding: null
notes: >
  THIRD INDEPENDENT MR DATA POINT, and it is the one that best characterises the state of MR evidence:
  directionally consistent with a causal effect, magnitude trivial.
  .
  THE THREE MR RESULTS I FOUND, SIDE BY SIDE:
    wu2024   (Transl Psychiatry) - genetically predicted SHORT sleep reduces lifespan, beta -0.60, but
             the continuous sleep-duration instrument was NULL in the same paper, and the lifespan unit
             is a parental-survival Cox residual that cannot be converted to months.
    zhang2025 (Rejuvenation Res) - MR for short and long sleep duration on all-cause mortality: NULL,
             while the observational HRs in the same paper were 1.25 and 1.74. Only napping survived.
    sambou2024 (this record) - MR OR 0.98 (0.97-1.00) for healthy sleep duration on terminated
             healthspan; significant at P=0.036, i.e. a 2% effect on a composite that is mostly not death.
  .
  MY READ ON THE MR EVIDENCE AS A WHOLE: it does not support a large causal mortality effect of
  habitual sleep duration, and two of the three analyses are consistent with no effect on death at all.
  It is important to state why this is weaker evidence than it looks in either direction. Sleep-duration
  MR instruments explain a tiny fraction of variance in sleep duration; the resulting estimates have
  wide true uncertainty even when the reported CIs are narrow; and crucially THE MR ESTIMAND IS WRONG
  FOR OUR QUESTION - it is the effect of lifelong genetic liability to sleep slightly less, not the
  effect of behaviourally sleeping 5-6 h for three years in adolescence and then stopping. MR cannot
  rule out a real short-term effect of behavioural restriction, and equally cannot be used to license one.
  .
  COHORT OVERLAP WARNING: UK_Biobank. Overlaps wu2024 partially (wu2024 uses UK Biobank sleep GWAS
  instruments and a parental-lifespan GWAS), and overlaps the entire UK Biobank accelerometer cluster.
  Do not treat as independent of those.
