rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: >
    PRISMA-based, Newcastle-Ottawa quality assessment, random-effects pooling, heterogeneity and
    sensitivity analyses, and - most valuable - an inclusion criterion of DISEASE-FREE employed persons
    aged 18-64, which is the only pre-specified attempt in this literature to remove the sick and the
    elderly from the pooled estimate. Weaknesses: (1) self-reported baseline exposure throughout;
    (2) the abstract does not report the number of studies, participants or deaths, so n and
    n_studies_pooled are set to null rather than guessed; (3) "employed" and "disease-free at baseline"
    are study-reported and inconsistently defined; (4) the 18-64 range is dominated by midlife, not by
    18-25 year olds - a working-age cohort's mean age is typically 40-50, so this is fair_adult and not
    good_young_adult; (5) high heterogeneity for the long-sleep contrast; (6) abstract-only access.
funding: null
notes: >
  TARGET EXTRACTION #6 (does the association attenuate in healthier/younger cohorts?). ANSWER: NO, at
  least not for short sleep.
  .
    General population (cappuccio2010):        short RR 1.12   long RR 1.30    ratio long/short = 2.31 on log scale
    Disease-free employed 18-64 (this study):  short RR 1.16   long RR 1.18    ratio = 1.12 on log scale
  .
  Two conclusions follow, and they point in opposite directions for our purposes:
  (a) BAD FOR THE SUBJECT: restricting to healthy working-age adults does not shrink the short-sleep
      association. If anything it is marginally larger (log 0.1484 vs 0.1133). So the short-sleep signal
      is not simply an artefact of pooling sick and elderly people.
  (b) GOOD FOR THE SUBJECT'S INTERPRETATION: the LONG-sleep excess collapses from 1.30 to 1.18 and the
      short/long asymmetry nearly vanishes. Since the asymmetry is the main quantitative fingerprint of
      illness-driven sleep change, this is direct evidence that a large part of the long-sleep signal in
      general populations IS reverse causation - and therefore that the same mechanism is at work in
      those cohorts more broadly.
  .
  I flag one caveat strongly: <=6 h is the exposure here, which INCLUDES 6 h. The two cohort-level
  analyses in this shard that resolve 6 h separately (akerstedt2017: HR 0.92 at 6 h vs 7 h and 0.84 vs
  7-8 h; yin2017 spline: RR 1.01 at 6 h) both find no harm at 6 h. A "<=6 h" category therefore averages
  a null 6 h stratum with a harmful <=5 h stratum, and the pooled 1.16 overstates the risk at exactly
  the dose our subject sits at on his better weekday nights.
shard: "s13_mortality"
