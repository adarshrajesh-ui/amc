rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: >
    This is the best available design for the question I was asked (objective vs self-report in the SAME
    people, same model, same outcome), and I upgraded my confidence in the objective-vs-subjective
    contrast substantially because of it. Weaknesses: (1) objective exposure is ONE night of in-home
    PSG, which measures that night's sleep, not habitual sleep, and a single night in a lab-instrumented
    bed underestimates habitual TST - this is why PSG 6-7 h can look "short"; (2) mean age 63.9 y with
    23.3% dying, so prevalent and incipient disease is everywhere; (3) SHHS was assembled for sleep
    apnoea research and is enriched for sleep-disordered breathing, though AHI and T90 are adjusted for;
    (4) the >8 h objective cell has only 54 people and 8 deaths, so nothing can be learned from it;
    (5) self-report and PSG were only weakly correlated, which the authors state but do not quantify in
    the abstract; (6) no adjustment for depression or socioeconomic position.
funding: null
notes: >
  THIS IS THE PIVOTAL RECORD FOR REQUIRED EXTRACTION 3 AND I WOULD PUT MORE WEIGHT ON IT THAN ON ANY
  SINGLE UK BIOBANK ANALYSIS, because it holds the population, the model, the follow-up and the outcome
  fixed and varies ONLY the measurement instrument.
  .
  ALL-CAUSE MORTALITY, fully adjusted, referent 7-8 h, n=5027, 1172 deaths, mean 11 y follow-up:
    measured by PSG            <=4 h 2.43 | 4-5 h 1.66 | 5-6 h 1.37 | 6-7 h 1.42 | >8 h 1.63 (n=54)
    self-report, WEEKDAY       <=4 h 1.63 | 4-5 h 0.68 | 5-6 h 1.02 | 6-7 h 0.93 | >8 h 1.26
    self-report, WEEKEND       <=4 h 1.89 | 4-5 h 0.96 | 5-6 h 1.10 | 6-7 h 0.94 | >8 h 1.16
  .
  WHAT THIS DOES TO THE TASK'S PRIOR. My instructions said "objective measurement usually WEAKENS the
  short-sleep association, which is a crucial finding." In this head-to-head the opposite happened, and
  the same thing happened in chaput2026, saintmaurice2024 and liang2023. I am reporting reality: for
  moderate short sleep, OBJECTIVE MEASUREMENT STRENGTHENS THE ASSOCIATION. The task's premise is wrong
  as stated. But the premise's CONCLUSION - that the mortality signal is not a clean read-out of
  behavioural sleep restriction - survives, and this table shows why, more sharply than any attenuation
  analysis:
    (a) The objective curve is not graded. 6-7 h (1.42) is not better than 5-6 h (1.37). If lost sleep
        were doing graded damage, that could not happen.
    (b) The self-report curve at the subject's dose is dead flat: 5-6 h -> 1.02, 6-7 h -> 0.93, and
        4-5 h -> 0.68, i.e. numerically protective. A monotone dose-response cannot produce 0.68 at
        4-5 h and 1.02 at 5-6 h; measurement error and selection can.
    (c) The two instruments were only WEAKLY CORRELATED with each other, so they are not two noisy
        readings of one exposure. They are two different exposures wearing the same label. PSG-derived
        short sleep in a 64-year-old is substantially "fragmented, pathological, medicated, apnoeic
        sleep"; self-reported weekday short sleep in that same person is closer to "chose to be in bed
        fewer hours". THE SUBJECT'S EXPOSURE IS THE SECOND ONE, AND THE SECOND ONE IS NULL AT 5-6 H.
  .
  ATTENUATION, PSG 5-6 h vs 7-8 h: crude 1.92 -> age+sex 1.48 -> fully adjusted 1.37. Surviving
  fraction of the crude log hazard 0.31481/0.65233 = 48%. For PSG <=4 h: crude 4.29 -> 2.82 -> 2.43,
  surviving fraction ln(2.43)/ln(4.29) = 0.8879/1.4563 = 61%. Note the direction of that difference:
  the SMALLER the sleep deficit, the LARGER the share of the crude association that measured
  confounders explain away, which is exactly what you expect if the moderate categories are mostly
  confounding and only the extreme categories carry anything real.
  .
  TRANSPORTABILITY TO A 19-YEAR-OLD MALE: poor_elderly, and this record is the reason to say so
  forcefully. The people generating the objective signal here are 64 on average, one in four of them
  died within 11 years, and their short PSG sleep is a symptom. A 19-year-old with 5-6 h weekday sleep
  is not a short PSG sleeper with fragmented, apnoeic, medicated sleep; he is a person who goes to bed
  late. The cell of this table that corresponds to his exposure - self-reported 5-6 h - is HR 1.02.
  .
  COHORT OVERLAP WARNING: cohort_family SHHS. fernandezmendoza2019 uses Penn State Adult Cohort, not
  SHHS, so the two PSG records are independent. No overlap with the UK Biobank accelerometer cluster
  (chaput2026, chaput2024, saintmaurice2024, liang2023, li2026, windred2024).
