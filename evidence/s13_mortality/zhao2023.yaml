    ci: [0.470004, 0.896088]
    conversion_formula: "Crude HR 1.92 (1.60-2.45); value=ln(1.92)=0.65233. ATTENUATION ARITHMETIC: crude log HR 0.65233 -> age+sex-adjusted ln(1.48)=0.39204 -> fully adjusted ln(1.37)=0.31481. Surviving fraction of the crude log hazard = 0.31481/0.65233 = 0.483, i.e. 48% survives, 52% of the crude association is explained by measured confounders, and over half of THAT is age and sex alone."
    from_figure: false
    inferred_from_ci: false
