    conversion_formula: "No effect estimate is produced by this review; it is a methodological critique. Value 0 and se null are placeholders required by the schema and must NOT be read as a measured null effect."
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      The verdict, not a number: having re-reviewed the identical literature that Cappuccio et al.
      pooled, this group concluded that it "does not support a consistent finding of an association
      between self-reported sleep duration and mortality" and that it is "premature to conclude ... that
      a robust, U-shaped association between sleep duration and mortality risk exists across
      populations". Two competent teams read the same 42 studies and reached opposite conclusions. That
      fact should itself widen the downstream uncertainty on the entire mortality pathway.
    covariates: []
    followup_years: null
    cohort_family: "review_of_35_distinct_populations"
    quote: "We identified 42 prospective studies of sleep duration and mortality drawing on 35 distinct study populations worldwide. Unlike previous reviews, we find that the published literature does not support a consistent finding of an association between self-reported sleep duration and mortality. Most studies have employed survey measures of sleep duration, which are not highly correlated with estimates based on physiologic measures."
