study_id: akerstedt2017
citation: "Åkerstedt T, Ghilotti F, Grotta A, Bellavia A, Lagerros YT, Bellocco R. Sleep duration, mortality and the influence of age. Eur J Epidemiol. 2017 Oct;32(10):881-891."
doi: "10.1007/s10654-017-0297-0"
pmid: "28856478"
url: "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5680380/"
verification:
  crossref_ok: true
  pubmed_ok: true
  resolved_title: "Sleep duration, mortality and the influence of age."
  status: VERIFIED
