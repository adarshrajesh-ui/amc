rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: >
    Most recent evidence base (to October 2024), 79 cohorts, random-effects pooling, pre-planned sex
    subgroups, and - unusually - a clean <7 h vs 7-8 h vs >=9 h categorisation rather than study-specific
    cutpoints. Weaknesses: (1) explicitly includes RETROSPECTIVE as well as prospective cohorts
    ("Retrospective and prospective cohort studies ... were included"), which is a real quality concession
    for a mortality outcome; (2) follow-up as short as 1 year is permitted, which maximises reverse
    causation; (3) self-reported exposure throughout; (4) no dose-response modelling, so it cannot
    resolve 5 h from 6 h; (5) the abstract reports neither participant numbers nor death counts, so n is
    null; (6) heavy overlap with the primary literature already pooled by the five earlier syntheses in
    this shard; (7) abstract-only access.
funding: null
notes: >
  TARGET EXTRACTION #2, "any newer synthesis" as requested. This IS the newest one I could find
  (published June 2025, searches to October 2024). Its headline numbers:
    SHORT (<7 h)  HR 1.14 (1.10-1.18)
    LONG (>=9 h)  HR 1.34 (1.26-1.42)
    79 cohorts, sex-stratified.
  .
  THE IMPORTANT NEGATIVE RESULT: fifteen years and roughly a fivefold increase in the evidence base have
  moved the short-sleep estimate from 1.12 (Cappuccio 2010, 27 cohort samples) to 1.14 (79 cohorts). The
  estimate is stable, but stability of a confounded estimate is not evidence of causality - it means the
  same design flaw has been replicated 79 times. Every one of these cohorts measures self-reported sleep
  once in adults and follows them for death; none randomises, none instruments, none measures adolescent
  exposure. More of the same evidence cannot resolve the causal question, which is why the objective-
  measurement, Mendelian-randomization and recovery-sleep records in this shard carry more weight per
  study than this one does.
  .
  I also screened but excluded a 2022 umbrella review (Sleep Breath, PMID 34435311) and a 2020
  older-people dose-response meta-analysis (BMC Public Health, PMID 32723316) as adding nothing beyond
  these syntheses; see screening_log.md.
  .
  COHORT OVERLAP WARNING: same primary literature as cappuccio2010, liu2017, yin2017, itani2017,
  jike2018.
