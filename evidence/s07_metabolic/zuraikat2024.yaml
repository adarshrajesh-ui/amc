  resolved_title: "Chronic Insufficient Sleep in Women Impairs Insulin Sensitivity Independent of Adiposity Changes: Results of a Randomized Trial."
access_tier: abstract_only
secondhand_via: "Full text XML is publisher-blocked at both Europe PMC (0 bytes returned) and NCBI PMC; only front matter plus the structured abstract are retrievable. All numbers below are first-hand from that abstract, which fortunately publishes betas WITH their standard errors, so no SE had to be derived. The OGTT-derived outcomes (total AUC for glucose and insulin, Matsuda index, disposition index) are listed as measured outcomes but their results are NOT reported in the abstract, so they are not extracted - see notes."
