study_id: zuraikat2024
citation: "Zuraikat FM, Laferrere B, Cheng B, Scaccia SE, Cui Z, Aggarwal B, Jelic S, St-Onge MP. Chronic insufficient sleep in women impairs insulin sensitivity independent of adiposity changes: results of a randomized trial. Diabetes Care. 2024;47(1):117-125."
