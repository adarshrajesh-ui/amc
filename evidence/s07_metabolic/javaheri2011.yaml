rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "CROSS-SECTIONAL (the authors describe it as a cross-sectional analysis of two examinations within a cohort), so tier TX. Reverse causation unaddressed. The quadratic-model predictions at the extremes (5.0 h, 10.5 h) sit in the sparse tails of the sleep distribution, so those CIs are wide and the point estimates are model-dependent rather than empirical cell means. Strengths: objective actigraphy exposure, good size for this age band (n=387), 43% minorities, and a genuinely age-appropriate optimum estimated from the data rather than imposed."
funding: "Not retrievable from the abstract (Cleveland Children's Sleep and Health Cohort; funder left unstated rather than guessed)."
notes: |
  *** THE MOST DIRECTLY TRANSPORTABLE OBSERVATIONAL RECORD IN THE SHARD - AND IT SUPPLIES THE
  AGE-APPROPRIATE OPTIMUM. *** This is the "Cleveland cohort" named in the task brief. Its key
  contribution is not the effect size but the SHAPE and the LOCATION OF THE NADIR in adolescents:
  7.75 h of actigraphy-measured sleep, estimated directly in this age group rather than borrowed
  from adults. Note that this is close to but slightly above the 7-8 h adult nadir from shan2015.

  QUANTITATIVE ANCHOR FOR THE SUBJECT: at 5.0 h/night - his weekday exposure, and measured by
  actigraphy rather than self-report - predicted HOMA was about 20% higher than at the 7.75 h
  optimum (2.36 vs 1.96). That is the single most age-and-dose-matched observational effect estimate
  available. Compare it with the age-matched EXPERIMENTAL estimate from klingenberg2013, where 3
  nights of 4 h raised HOMA-IR by 65%. The observational cross-sectional figure (+20% at habitual
  5 h) is roughly a third of the acute experimental figure (+65% at 4 h for 3 nights), which is the
  expected ordering if habitual short sleepers partially adapt, if self-selection is limited, and if
  the acute protocol dose is more extreme.

  *** THE ADIPOSITY FINDING IS THE MOST IMPORTANT CAVEAT. *** After adjusting for adiposity the
  short-sleep/HOMA association was "appreciably attenuated", and the authors' own conclusion is that
  it "likely is explained by the association between short sleep duration and obesity." This is the
  same pattern as bos2019 in midlife, now replicated in the target age band. The identical mediator-
  versus-confounder ambiguity applies: if short sleep causes adiposity in adolescents, then adjusting
  for adiposity removes a real causal pathway rather than a confounder. COORDINATE WITH THE OBESITY
  SHARD (s09_obesity_bmi) - whether adiposity is a mediator or a confounder is the single question
  that most changes this shard's bottom line, and it cannot be settled inside this shard.

  U-SHAPE IN ADOLESCENTS - UNRESOLVED. This study found a quadratic "u-shape" with the long limb
  (10.5 h, +23%) at least as large as the short limb and, unlike the short limb, INDEPENDENT of
  obesity. matthews2012, the other age-matched actigraphy study, found NO long-sleep association at
  all. The subject has occasional 10-11 h weekend nights, so this disagreement is directly relevant
  and should be carried as genuine uncertainty rather than resolved in either direction.

  POPULATION: n=387, 43% minorities, Cleveland Children's Sleep and Health Cohort. Numeric ages are
  not given in the abstract so age_mean/age_range are null; the cohort is adolescent, hence
  exact_16_19. pct_female not reported in the abstract -> null.
shard: "s07_metabolic"
