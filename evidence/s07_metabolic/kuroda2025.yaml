rob:
  tool: MR-STROBE
  judgement: low
  notes: "Strong MR execution. Uses the doubly-ranked stratification method of Tian et al., which is specifically designed to avoid the collider bias that afflicts residual-based non-linear MR when the exposure is coarse (integer-hour self-report) - the authors explicitly criticise earlier UK Biobank non-linear MR papers on this point. Instrument strength is good (F=2589 for the 85-SNP questionnaire GRS; F=427 for the 20-SNP accelerometer GRS), GR statistic confirms the 10-strata choice, MR-Egger intercepts are null for both directions, outcome data come from two independent consortia with UK Biobank excluded to limit sample-overlap bias, and reverse causation is probed by excluding cases within 2 years of baseline. Author-stated limitations, all of which I accept: (1) outcomes ascertained from HOSPITAL INPATIENT data only, so incident T2D is under-ascertained (4.3% overall) and the case definition is skewed toward more severe disease; (2) exposure measured at a single time point, so time-varying sleep cannot be modelled; (3) White British only, limiting generalisability; (4) residual bias from assumption violations in non-linear MR cannot be excluded. Additional concern of mine: the accelerometry subgroup is a healthier subset (lower BMI, less hypertension, less smoking, 3.0% vs 4.3% T2D incidence), so the accelerometer HR of 1.52 comes from a selected sample."
funding: "Japan Society for the Promotion of Science (JSPS) KAKENHI Grant Numbers 24K23752 and 24K02708, and the National Cancer Center Research and Development Fund. Authors declare no conflict of interest."
notes: |
  *** THIS RECORD MATERIALLY REVISES TASK ITEM 6. It is the newest and best-powered MR in the shard
  and it is the ONLY one in which SHORT sleep duration reaches significance for T2D. Any summary
  claiming "MR is uniformly null for sleep duration" is now wrong. ***

  WHY THIS PAPER IS UNUSUALLY VALUABLE: it runs the observational analysis and the MR analysis in the
  SAME cohort, with BOTH self-reported and accelerometer-derived exposure. That makes the
  observational-vs-causal gap internally comparable rather than a cross-study comparison. All four
  cells of the 2x2 (self-report/accelerometer x conventional/MR) are reported.

  THE FOUR-WAY COMPARISON WITHIN ONE COHORT:
    Conventional Cox, questionnaire  <=5 h vs 7 h    HR 1.30 (1.23-1.39)   SIGNIFICANT
    Conventional Cox, accelerometer  <6 h  vs 7-8 h  HR 1.52 (1.09-2.13)   SIGNIFICANT
    Two-sample MR,    short-sleep SNPs                OR 1.12 (1.02-1.23)   SIGNIFICANT
    Non-linear MR,    9 h vs 7 h                      HR 0.77 (0.52-1.15)   null (long arm)

  HOW MUCH OF THE OBSERVATIONAL SHORT-SLEEP RISK SURVIVES? Taking the questionnaire Cox estimate
  (log 0.2624) as the observational anchor and the MR estimate (log 0.1133) as the causal anchor,
  the surviving fraction on the log scale is 0.1133/0.2624 = 0.43. So roughly 40-45% of the
  observationally estimated short-sleep excess risk survives genetic-instrument scrutiny in this
  cohort; the rest is attributable to confounding and reverse causation. This is the single most
  defensible quantitative answer the shard can give to summary section (c). Treat it as one
  estimate, not a constant: the ratio depends on which observational anchor is used (against the
  accelerometer HR of 1.52 the surviving fraction falls to 0.1133/0.4187 = 0.27), and the MR and
  Cox contrasts are not on identical exposure scales.

  RECONCILING WITH THE OTHER MR RECORDS - the disagreement is about POWER, not direction:
    gao2020    short sleep OR 1.15 (0.96-1.38)  null   17 SNPs, DIAGRAM only
    wang2019   per h less   OR 1.18 (inverted)  null   fewer SNPs, DIAGRAM/MAGIC
    dashti2019 sleep duration -> T2D            null   genetic correlation with LONG sleep only
    bos2019    glycaemic traits                 null   small (Netherlands Epidemiology of Obesity)
    kuroda2025 short sleep OR 1.12 (1.02-1.23)  SIG    23 SNPs, DIAGRAM + FinnGen meta-analysed
  Every point estimate in this list is positive and in the range 1.12-1.18. The earlier studies were
  underpowered; kuroda2025 gains precision by meta-analysing two outcome consortia. The correct
  reading is that the MR literature CONVERGES on a modest causal effect of short sleep of about
  OR 1.12-1.15, which only becomes statistically detectable in the best-powered analysis. The
  modeller should NOT treat MR as refuting the short-sleep association; it supports a real but
  smaller-than-observational effect.

  THE LONG-SLEEP LIMB COLLAPSES, AND THAT IS A CLEAN RESULT:
  * Questionnaire Cox: >=10 h HR 1.46 (1.33-1.59), strongly positive, U-shaped, P non-linearity <0.001.
  * Accelerometer Cox: >=10 h HR 1.08 (0.92-1.27), null; shape becomes J-shaped, P non-linearity 0.024.
  * MR: OR 0.80 (0.60-1.07) and non-linear MR 9 h vs 7 h HR 0.77 (0.52-1.15) - point estimates go the
    PROTECTIVE way, and P for non-linearity is 0.94, i.e. no U-shape at all once genetics instrument
    the exposure.
  DIRECTLY DECISION-RELEVANT FOR OUR SUBJECT, who has occasional 10-11 h weekend nights: the apparent
  hazard of long sleep in the observational literature (shan2015 RR 1.14 per h above 8 h;
  cappuccio2010 RR 1.48; javaheri2011 +23% HOMA at 10.5 h) does not survive either objective exposure
  measurement or genetic instrumentation. His long nights should be modelled as recovery behaviour,
  not as an independent metabolic risk exposure. This is the strongest evidence in the shard on that
  question and it should downweight the long-sleep arm substantially.

  TIER ASSIGNMENT WARNING FOR THE POOLER: the record is tiered T3 because MR is the paper's primary
  design, but effects 4 and 5 are conventional prospective-cohort estimates, NOT MR outputs.
  Effect 4 (accelerometer <6 h, HR 1.52) is properly a T4 estimate - prospective cohort with
  objective exposure - and is one of the very few T4 short-sleep/T2D estimates in existence. Effect 5
  (questionnaire <=5 h, HR 1.30) is properly T5. Do not pool effects 1-3 with effects 4-5 as if they
  were independent, and do not pool effects 4-5 with shan2015, cappuccio2010, or liu2025 without
  de-duplication: UK Biobank contributes to several of those syntheses. cohort_family is set to
  UK_Biobank / UK_Biobank_DIAGRAM_FinnGen on every effect for exactly this reason.

  TRANSPORTABILITY TO OUR SUBJECT - the central weakness, as everywhere in this shard's
  epidemiological set. Median baseline age 58 (IQR 50-63), 55% female, White British, median
  self-reported sleep 7 h. There are NO adolescents and NO young adults. Follow-up is 13.6 years in
  midlife, so the estimate answers "what happens to a 58-year-old who habitually sleeps <6 h over
  13 years", not "what happens to an 18-year-old after 3 years of weekday restriction". Two further
  mismatches: (1) MR estimates the effect of LIFELONG genetic liability to short sleep, a
  time-integrated exposure quite unlike a 3-year adolescent episode, and (2) the exposure is habitual
  average duration with no representation of the subject's weekday/weekend alternation - the
  circadian-misalignment component that leproult2014, cheung2026, chen2021, and yuan2021 identify as
  the more damaging insult is entirely absent from this design. Scored poor_midlife.

  n recorded as 385,135 (the analysed cohort after excluding 117,231 of 502,366 for prevalent
  diabetes, extreme/missing sleep report, and ancestry); 75,094 of these had accelerometry;
  16,699 incident T2D cases (4.3%) over median 13.6 years; 2,258 cases (3.0%) in the accelerometry
  subgroup.
