rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomised only for modafinil vs placebo, not for the sleep manipulation: the sleep contrast is a fixed-order within-subject comparison (baseline 10 h then restriction 5 h) with NO parallel control group held at 10 h. The authors state this limitation explicitly. Small n, healthy non-obese men only. Two concordant measurement methods (clamp + IVGTT, r=0.53, P=0.02) is a strength. Circadian phase not measured directly (modelled at <9 min drift)."
funding: "NIH; Brigham and Women's Hospital General Clinical Research Center (per PMC record)"
notes: |
  This is the strongest single-study estimate of the ACUTE, MECHANISTIC insulin-sensitivity effect
  because it is the only one using the gold-standard euglycaemic-hyperinsulinaemic clamp AND an
  IVGTT in the same subjects.

  DISTANCE FROM OUR SUBJECT'S EXPOSURE:
  * Dose: 5 h TIB. This is the CLOSEST dose match of any classic lab protocol to the subject's
    weekday 5-6 h. Good transportability on dose.
  * Referent: 10 h TIB baseline, i.e. deliberate sleep repletion, not habitual sleep. The published
    contrast is 5 vs 10 h (a 5 h/night gap); the subject's weekday deficit against an adolescent
    requirement of ~8-9 h is ~2-3.5 h/night. So the contrast is still roughly 1.5-2x the subject's.
    A crude linear-in-dose rescaling of the clamp effect to a 2.5 h/night deficit gives
    -11% x (2.5/5) = about -5.5%; to a 3 h/night deficit about -6.6%. Flagging this as a
    rescaling the modeller may use, NOT as a published number.
  * Duration: 7 consecutive nights with no recovery night interposed. The subject never went more
    than 5 weekday nights before a recovery opportunity, so this over-states the consecutive-night
    accumulation the subject experienced.
  * Diet/activity: controlled and isocaloric, and the authors note that "the control of food intake
    may have dampened the full effects" - so this figure may if anything UNDER-state a free-living
    effect via the appetite pathway.
  * Sex: all male, matching the subject. Age 20-35 is close to but above 18; adolescents may have
    different insulin sensitivity trajectories (puberty transiently lowers insulin sensitivity),
    so treat as good_young_adult, not exact.
  * NOT a reversibility study: only a single 10 h recovery night before discharge, with no post-
    recovery metabolic testing. Use ness2019 / depner2019 / killick2015 for reversibility.

  Also note: Buxton 2010 found NO compensatory rise in insulin secretion (acute insulin response
  unaffected), which differs from spiegel1999 where insulin secretion FELL. The two classic studies
  disagree on mechanism while agreeing on the direction of net glucose-metabolic harm.
