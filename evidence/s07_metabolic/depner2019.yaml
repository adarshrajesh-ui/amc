rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomised 3-arm parallel design with a genuine time-matched control arm (CON, 9 h, n=8) - much stronger than the fixed-order within-subject designs of spiegel1999/buxton2010. Weaknesses: small and unequal arms (8/14/14), and the WR-vs-SR comparison of interest is between-arm with n=14 per arm, so it is underpowered to prove that WR is WORSE than SR rather than merely not better. Effect magnitudes are reported only as approximate ranges in the abstract and the full text was not retrievable."
funding: "Not retrievable from the abstract (US NIH-funded University of Colorado Boulder / Anschutz laboratory; funder left unstated rather than guessed)."
notes: |
  *** THE SINGLE MOST STRUCTURALLY RELEVANT EXPERIMENTAL STUDY IN THIS SHARD FOR OUR SUBJECT. ***
  This is the only lab protocol that reproduces the subject's actual PATTERN rather than just a
  short-sleep dose: 5 weekday nights of insufficient sleep, then a weekend recovery opportunity,
  then back to insufficient sleep. The subject lived that cycle roughly 150 times over 3 years.

  DISTANCE FROM OUR SUBJECT'S EXPOSURE:
  * Pattern: EXCELLENT match - weekday restriction plus ad libitum weekend recovery is exactly the
    subject's regimen. No other study in this shard has this structure except cheung2026.
  * Dose: 5 h sleep opportunity vs the subject's 5-6 h. Close, slightly more severe.
  * Weekend recovery: ad libitum, and participants actually recouped only ~1.1 h cumulatively. Our
    subject reportedly reached 7-8 h at weekends and occasionally 10-11 h, i.e. a LARGER weekend
    rebound than these participants achieved. So this study may over-state the residual damage for
    our subject, because his weekend recovery dose was bigger.
  * Duration: ONE cycle (plus 2 post-weekend nights). The subject completed ~150 cycles. This study
    therefore cannot tell us whether the deficit plateaus, accumulates, or adapts across years -
    that extrapolation is entirely unsupported and is the central uncertainty for this shard.
  * Age: "healthy, young adults" - no mean age in the abstract, so age_mean/age_range left null.
    Recorded as good_young_adult on the strength of the word "young", not on a number.
  * n recorded as 36 = 8 CON + 14 SR + 14 WR (sums the three randomised arms).

  REVERSIBILITY VERDICT THIS RECORD SUPPORTS: a single weekend recovery opportunity does NOT restore
  insulin sensitivity when insufficient sleep resumes. The insulin-sensitivity deficit after the
  weekend (9-27%) bracketed and did not undercut the sustained-restriction deficit (13%). The
  authors' own conclusion is that "weekend recovery sleep is not an effective strategy to prevent
  metabolic dysregulation associated with recurrent insufficient sleep."
  IMPORTANT CAVEAT AGAINST OVER-READING THIS: the measurement in the WR arm was taken after 2
  further nights of insufficient sleep, NOT at the end of the weekend. So this study does not show
  that recovery sleep fails to repair; it shows that the repair does not survive resumption of
  restriction. Those are different claims and the distinction matters for the subject, who is about
  to either continue or stop the exposure.
shard: "s07_metabolic"
