rob:
  tool: MR-STROBE
  judgement: some_concerns
  notes: "Useful because it runs the cross-sectional and MR analyses in the same paper on the same constructs, which makes the confounding attenuation directly interpretable. Concerns: the MR is null but the abstract publishes no point estimates or CIs, so its POWER cannot be assessed from the retrieved text - an uninformative null cannot be distinguished from an informative one. Cross-sectional design for the observational arm means reverse causation is unaddressed. Adjusting for BMI is itself contestable: if short sleep causes weight gain (which is this shard's sibling literature), BMI is a MEDIATOR and adjusting for it will attenuate a real causal effect, not just remove confounding. The 'disappeared after BMI adjustment' result must therefore not be read automatically as proof of confounding."
funding: "Not retrievable from the abstract (Leiden University Medical Center authorship; funder left unstated rather than guessed)."
notes: |
  *** THIS RECORD ANSWERS PART (c) OF THE SUMMARY BRIEF: HOW MUCH OF THE LONG-RUN RISK SURVIVES
  CONFOUNDING ADJUSTMENT AND MR? *** Its answer, on continuous glycaemic traits in midlife, is:
  essentially none of it.

  Two findings, and both cut against a simple causal reading of the epidemiology:
  1. CONFOUNDING: shortest sleepers (median 5.0 h/night - almost exactly our subject's weekday dose)
     had 14.5% higher fasting insulin and 16.3% higher HOMA-beta, and bad sleep quality carried 14.3%
     higher HOMA-IR. Every one of these associations DISAPPEARED after adjusting for BMI and
     sleep-apnoea risk.
  2. MR: genetic instruments for total, short and long sleep duration showed no causal association
     with any glycaemic trait in 58,074 non-diabetic individuals from MAGIC.

  THE CRITICAL INTERPRETIVE CAVEAT, which the modeller must not skip: adjusting for BMI is NOT a
  clean confounder adjustment in this causal structure. Short sleep is itself a well-documented
  cause of weight gain, so BMI plausibly sits on the causal PATH from short sleep to insulin
  resistance. Conditioning on a mediator removes real causal effect. So "the association disappeared
  after BMI adjustment" is consistent with BOTH of these stories:
    (a) the association was confounded by adiposity and is not causal; and
    (b) the association is causal and operates THROUGH adiposity.
  Nothing in this paper distinguishes them. The MR null is the stronger evidence of the two, because
  it does not condition on a mediator - but it is a null whose precision I could not verify from the
  abstract. Coordinate with the obesity/BMI shard (s09_obesity_bmi) before assigning weight here.

  RELEVANCE TO OUR SUBJECT:
  * The exposure contrast (median 5.0 h/night) is an excellent dose match to his weekday sleep - the
    closest of any observational record in this shard.
  * The outcome is CONTINUOUS glycaemic traits (fasting insulin, HOMA-IR, HOMA-beta, HbA1c) rather
    than diagnosed diabetes, which is much closer to the "is my insulin sensitivity measurably worse
    this week" question than the incident-T2D meta-analyses are.
  * AGE IS BADLY MISMATCHED: NEO participants are 45-65 y and the MAGIC glycaemic GWAS is adult. An
    18-year-old is 27+ years younger than the youngest participant. Scored poor_midlife.
  * Sleep-apnoea risk is a much larger confounder at 45-65 y and BMI 26+ than in a lean 18-year-old.
    So the specific attenuation demonstrated here may not transport: in a young lean male there is
    less apnoea and less adiposity available to explain the association away. This is an argument for
    NOT applying the full attenuation to our subject.
  n recorded as 58,074 (the MAGIC glycaemic-traits sample used for MR); the cross-sectional arm is
  n=4,672 from NEO.
shard: "s07_metabolic"
