rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Well-conducted dose-response meta-analysis using both semiparametric and parametric methods, published in a top diabetes journal, restricted to PROSPECTIVE studies (so reverse causation from prevalent diabetes is limited). Fundamental limitations that cap its causal weight: (1) exposure is SELF-REPORTED sleep duration in essentially all contributing cohorts, which biases toward the null and misclassifies heavily; (2) it pools adjusted estimates with heterogeneous and incomplete covariate sets, so residual confounding by BMI, physical activity, depression, socioeconomic position and undiagnosed sleep apnoea is unaddressed; (3) no individual-participant data, so no ability to check the shape at the extremes or to stratify by age. Only 10 articles / 11 reports."
funding: "Not retrievable from the abstract (Huazhong University of Science and Technology / Harvard School of Public Health authorship; funder left unstated rather than guessed)."
notes: |
  *** THIS IS THE PRIMARY LONG-RUN RISK ANCHOR FOR THE SHARD. *** It is the dose-response
  meta-analysis the task asked for, and the seed author list was essentially correct (Shan, Ma, Xie,
  ... Hu, Liu - note the third-position author is Xie and the fourth is Yan, not Kong; "Kong" does
  not appear in the author list).

  SCALE OF THE EVIDENCE: 10 articles / 11 reports; 18,443 incident T2D cases among 482,502
  participants; follow-up 2.5-16 years.

  SHAPE: U-shaped, nadir at 7-8 h/day. Both limbs are significant. The short limb is 1.09 per hour
  and the long limb is 1.14 per hour, so on a per-hour basis LONG sleep carries the slightly steeper
  slope - a point that is usually lost in popular summaries.

  *** THE 5 h AND 6 h POINT ESTIMATES ARE MY DERIVATIONS, NOT PUBLISHED NUMBERS. *** The abstract
  reports only the per-hour slope; the category-specific RRs live in the paper's figures/tables and
  the full text is paywalled (unpaywall is_oa=false, no PMC deposit, Diabetes Care 2015). I therefore
  extrapolated log-linearly from the published per-hour RR and labelled both derived records
  explicitly. The 6 h value is a 1-hour step and is safe. The 5 h value assumes log-linearity two
  hours below the referent, which the paper's own semiparametric (U-shaped) modelling suggests may
  UNDERSTATE risk if the curve steepens at the extreme. Treat RR(5h) = 1.19 (1.07-1.31) as an
  approximation with an unknown, probably downward, bias.

  *** AGE TRANSPORTABILITY IS THE CENTRAL WEAKNESS FOR OUR SUBJECT. *** These are adult cohorts
  followed for incident T2D over 2.5-16 years, with typical baseline ages in midlife; the abstract
  reports no age distribution and none of the contributing cohorts enrolled adolescents. Population
  is therefore scored poor_midlife. Applying an RR estimated in 40-60 year olds to an 18-year-old
  requires assuming the hazard ratio is age-invariant, which is NOT established and which liu2025
  actively contradicts (it found the association STRONGEST at ages 30-39 and attenuating thereafter,
  with no data below 30). The direction of that age gradient suggests the RR could be as large or
  larger in youth, but nobody has measured it.

  *** WHAT THIS RR DOES AND DOES NOT MEAN FOR THE SUBJECT. *** A relative risk is not a risk. An
  18-year-old male's absolute short-horizon T2D risk is very low, so multiplying it by ~1.19 moves
  the absolute probability very little over the next decade. The exposure also does not persist by
  assumption: these cohorts measured habitual sleep ONCE at baseline and treated it as permanent
  (see cappuccio2010's own critique: "A single measure of exposure may not fully capture the
  sustained effects"). The subject's 3 years of exposure is a transient episode, not a lifetime
  phenotype, so applying the full cohort RR to him assumes he will keep sleeping 5-6 h for decades.
  That assumption, not the RR itself, dominates any lifetime-risk calculation.

  *** ALSO NOTE: his weekend sleep of 7-8 h sits exactly at the observed nadir. *** Averaged over a
  week, 5 x 5.5 h + 2 x 7.5 h = 6.07 h/day, which is only about 1 h below the referent, implying an
  averaged RR near 1.09 rather than 1.19. Whether the correct exposure metric is the weekly average
  or the weekday value is unresolved and materially changes the answer; cheung2026 suggests
  variability itself is harmful, which argues against simple averaging.
