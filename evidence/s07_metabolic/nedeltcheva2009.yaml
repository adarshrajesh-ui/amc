    direction_note: "POSITIVE HERE MEANS glucose effectiveness INCREASED, i.e. non-insulin-dependent glucose disposal went UP under restriction. This is the OPPOSITE SIGN to spiegel1999, where glucose effectiveness reportedly fell by 30%. Flagged deliberately - see notes. Whether 'up' is good or bad is ambiguous: it is most plausibly a compensatory response to the fall in insulin-dependent disposal."
