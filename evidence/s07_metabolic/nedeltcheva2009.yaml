  - outcome_domain: metabolic
    outcome_construct: insulin_sensitivity_si_minimal_model
    exposure: {type: chronic_restriction, dose_h: 5.5, referent_h: 8.5, duration_days: 14, contrast_label: "14 days at 5.5 h vs 8.5 h bedtime, sedentary living with AD LIBITUM food intake; randomised crossover; achieved sleep reduction 122 +/- 25 min/day"}
    scale: pct_change
    unit: "% change in Minimal-model insulin sensitivity index S_I"
    value: -17.5
    se: 6.92388
    ci: [-31.07, -3.93]
    conversion_formula: "Published as S_I 3.3 +/- 1.1 vs 4.0 +/- 1.6 (mU/liter)^-1 x min^-1, P < 0.03. Percent change = (3.3-4.0)/4.0 = -17.50%. The per-condition SDs cannot give SE_diff without the within-subject correlation, so SE was backed out from the p-value: with n=11 paired, df=10, t = t_isf(0.03/2, 10) = 2.5275, se = 17.50/2.5275 = 6.92388 percentage points. Because P<0.03 is a BOUND rather than an exact p, the true t is at least 2.5275 and the true SE is at most 6.92, so this SE is CONSERVATIVE (an upper bound). ci = -17.50 +/- 1.96*6.92388. Absolute-scale equivalent: diff -0.7 (mU/L)^-1.min^-1, se 0.27696."
    from_figure: false
    inferred_from_ci: true
    direction_note: "negative = HARM (lower insulin sensitivity). Magnitude is close to buxton2010's -20% by the same IVGTT method, despite a milder dose (5.5 h vs 5 h) and a longer exposure (14 vs 7 days)."
    covariates: ["randomised crossover order", "comparable weight gain in both conditions (so the effect is not explained by differential weight change)"]
    followup_years: null
    cohort_family: "Chicago_Penev_5.5h_protocol"
    quote: "Bedtime restriction reduced daily sleep by 122 +/- 25 min. Both study periods were associated with comparable weight gain; however, recurrent sleep restriction resulted in reduced oral glucose tolerance (2-h glucose value, 144 +/- 25 vs. 132 +/- 36 mg/dl; P < 0.01) and insulin sensitivity [3.3 +/- 1.1 vs. 4.0 +/- 1.6 (mU/liter)(-1) x min(-1); P < 0.03], and increased glucose effectiveness (0.023 +/- 0.005 vs. 0.020 +/- 0.005 min(-1); P < 0.04)."
