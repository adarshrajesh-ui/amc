rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomised crossover with controlled inpatient-style exposure, 14-day conditions (long for this literature), comparable weight gain across conditions, and both oral and intravenous glucose challenges. Concerns: (1) n=11, so all estimates are imprecise and the p-value-derived SEs rest on a small df; (2) open-label, unavoidable; (3) mixed-sex sample of 5 women and 6 men with no sex-stratified results, in a literature where sex differences are reported; (4) the exposure is deliberately bundled with 'a Western-like lifestyle' - sedentary living AND ad libitum food intake - so this trial estimates the effect of short sleep IN THAT CONTEXT rather than the effect of short sleep alone. That is a design choice, not a flaw, but it must not be read as an isolated sleep effect; the companion trial nedeltcheva2012 changes the energy-balance context and gets a different answer; (5) p-values are reported only as bounds (P<0.01, P<0.03, P<0.04), which forces conservative SE derivation; (6) participants were overweight (BMI 26.5 +/- 1.5) and middle-aged, not healthy young adults."
funding: "Not stated in the retrievable abstract or front matter (University of Chicago; the group's work in this period was NIH-supported, but I did not retrieve the funding statement for THIS paper, so it is left unstated rather than guessed)."
notes: |
  READ THIS RECORD AS ONE HALF OF A MATCHED PAIR. The same laboratory ran the same 14-day 5.5 h
  versus 8.5 h bedtime protocol twice, changing only the energy-balance context, and got opposite
  glycaemic answers:
    nedeltcheva2009 (this record) - ad libitum food, sedentary, weight GAIN
        -> S_I -17.5% (P<0.03), 2-h OGTT glucose +9.1% (P<0.01). CLEAR HARM.
    nedeltcheva2012              - hypocaloric diet, weight LOSS of 1.0 BMI unit
        -> oral glucose tolerance NOT impaired, 24-h glucose maintained on LESS insulin, fasting
           glucose slightly DOWN. IVGTT suggested S_I -26%, but the authors distrust that estimate.
  The pair is the shard's only experimental evidence on how ENERGY BALANCE modifies the glycaemic
  cost of short sleep, and the modifier is large enough to flip the sign of the primary oral-glucose
  outcome. That is a first-order effect-modification finding, not a footnote.

  WHY THIS MATTERS A GREAT DEAL FOR OUR SUBJECT: he is an 18-year-old entering his second year of
  college. The relevant context is emphatically the 2009 one - not dieting, plausibly sedentary,
  eating ad libitum, in an environment where short sleep reliably increases caloric intake. So the
  2009 arm is the more applicable of the pair, and it is the arm that shows harm. The corollary is
  that the subject's glycaemic risk from short sleep is likely to be partly mediated by, and
  certainly amplified by, the intake and activity pathways rather than being a pure sleep effect.
  That is a mechanistic claim the modeller can use, and it also means an intervention on diet and
  activity could blunt the glycaemic consequence without changing sleep at all.

  DISTANCE FROM OUR SUBJECT'S EXPOSURE:
  * Dose: 5.5 h TIB, achieving a 122 min/day sleep reduction. This is close to the subject's weekday
    5-6 h and far milder than the 4 h protocols. Good dose match.
  * Duration: 14 consecutive days - among the longest in the shard, exceeded only by zuraikat2024
    (6 weeks) and the 3-week protocols buxton2012_fd and yuan2021. Still tiny against 3 years.
  * Pattern: continuous, no weekend recovery. Cannot speak to weekday/weekend cycling.
  * AGE IS THE MAIN MISMATCH: mean age 39 +/- 5 y, BMI 26.5 +/- 1.5, overweight. Two decades older
    than the subject and already carrying excess adiposity, which plausibly raises susceptibility.
    Scored poor_midlife. The 2-h glucose finding is especially age-sensitive: moving from 132 to
    144 mg/dL matters much more in someone already near the impaired-glucose-tolerance threshold
    than in a healthy 18-year-old, whose 2-h glucose would typically start well below that.

  THE GLUCOSE-EFFECTIVENESS CONTRADICTION - flagging it explicitly so a later station does not
  quietly average the two: spiegel1999 is reported (secondhand) as showing glucose effectiveness
  DOWN 30% after 6 nights at 4 h TIB, whereas this study found it UP 15% after 14 days at 5.5 h TIB.
  Both used Minimal-model analysis of an IVGTT. Possible reconciliations: different dose (4 h vs
  5.5 h), different duration (6 vs 14 days), different referent (12 h TIB extension vs 8.5 h), a
  genuine compensatory adaptation emerging over two weeks, or imprecision in two samples of 11.
  I cannot resolve it from the retrievable text. Glucose effectiveness should therefore be treated as
  a LOW-CONFIDENCE, SIGN-UNSTABLE outcome in this shard and should not carry weight in the headline
  numbers. The insulin-sensitivity and glucose-tolerance outcomes, by contrast, agree in direction
  across every restriction study except dutil2024 and nedeltcheva2012.

  n = 11 (5 female, 6 male), so pct_female = 5/11 = 45.5%. Mean age 39 +/- 5 y (SD given but no
  range published, so age_range is null rather than guessed).
shard: "s07_metabolic"
