    from_figure: false
    inferred_from_ci: true
    direction_note: "positive = HARM (higher 2-h glucose = worse oral glucose tolerance). Clinically framed: mean 2-h glucose moved from 132 to 144 mg/dL, i.e. from clearly normal toward the impaired-glucose-tolerance threshold of 140 mg/dL, in 14 days, in middle-aged adults who were already overweight."
    covariates: ["randomised crossover order", "comparable weight gain in both conditions"]
