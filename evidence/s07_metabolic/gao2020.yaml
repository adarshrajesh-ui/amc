rob:
  tool: MR-STROBE
  judgement: low
  notes: "Methodologically thorough two-sample MR: two independent outcome cohorts (DIAGRAM and FinnGen) for replication, instrument pruning for LD and for SNPs associated with measured confounders, Cochran's Q outlier removal, MR-Egger for directional pleiotropy (all intercepts null), and multiple pleiotropy-robust estimators as sensitivity analyses with a Bonferroni-corrected threshold. Judged low risk of bias for an MR design. The residual concerns are inherent to the method rather than to execution: the short-sleep instrument retains only 17 SNPs after QC (limited power, which is why the CI is wide), the exposure GWAS is based on SELF-REPORTED integer-hour sleep duration (the authors note people overestimate sleep by up to 1 h, biasing toward null), and summary-level data preclude any non-linear or U-shaped modelling - the authors state this limitation explicitly."
funding: "Not stated in the retrieved text (Shanxi Medical University authorship; funder left unstated rather than guessed)."
notes: |
  *** THIS RECORD IS THE ANSWER TO TASK ITEM 6: DOES MR SUPPORT THE OBSERVATIONAL ASSOCIATION? ***
  Answer: only partly, and NOT for sleep duration.

  THE OBSERVATIONAL-VS-MR COMPARISON, SIDE BY SIDE:
    Observational (liu2025, 1.48 M):  short sleep <7 h    OR 1.18 (1.13-1.23)  SIGNIFICANT
    Observational (shan2015, 482 k):  per 1 h below 7 h   RR 1.09 (1.04-1.15)  SIGNIFICANT
    MR (this study):                  short sleep (binary) OR 1.15 (0.96-1.38)  NULL, P=0.09
    MR (this study):                  continuous duration  OR 1.00 (1.00-1.00)  NULL, P=0.43
    MR (this study):                  INSOMNIA             OR 1.14 (1.09-1.19)  SIGNIFICANT, P=1.3e-8

  HOW TO READ THE GAP HONESTLY - this is the crux, and it is easy to get wrong in both directions:
  * The binary short-sleep MR point estimate (1.15) is almost identical to the observational estimate
    (1.18). So MR does NOT contradict the observational magnitude; it simply cannot resolve it. The
    17-SNP instrument is underpowered and the CI (0.96-1.38) comfortably contains the observational
    value. It is WRONG to report this as "MR refutes the association."
  * But the continuous-duration instrument, which is far better powered (56 SNPs), is flatly null at
    OR 1.00. That is harder to dismiss and does argue against a substantial linear per-hour causal
    effect of sleep duration on T2D.
  * Meanwhile insomnia DOES survive, with a tight CI and p ~ 1e-8. So the causal signal in this
    literature localises to sleep CONTINUITY/QUALITY rather than sleep DURATION.
  * Convergent with bos2019, which found the cross-sectional insulin-resistance association vanished
    after adjusting for BMI and sleep-apnoea risk and whose MR on glycaemic traits was also null.

  NET: of the observational RR of roughly 1.09-1.18, the fraction that survives genetic-instrument
  scrutiny for DURATION specifically is best described as "not demonstrated, point estimate
  preserved, upper bound not excluded." A defensible modelling choice is to keep the observational
  point estimate but inflate its variance substantially, and to add a non-trivial prior mass on the
  true duration effect being near zero with the observed association arising from confounding
  (BMI, physical activity, socioeconomic position, depression, undiagnosed apnoea) and from
  correlated sleep traits (insomnia, chronotype) that ARE causal.

  RELEVANCE TO OUR SUBJECT - three important caveats about applying MR here at all:
  1. MR estimates the effect of LIFELONG genetic liability to short sleep, not of a 3-year
     behaviourally imposed episode in adolescence. These are different exposures with different
     time-courses, so a null MR does not license the conclusion that the subject's 3 years were
     harmless, and a positive MR would not license the converse either.
  2. The exposure GWAS population is UK Biobank (mean sleep 7.2 h, SD 1.1; 25.8% short sleepers),
     recruited at ages roughly 40-70. Nothing here is measured in adolescents. Scored poor_midlife.
  3. MR cannot model the U-shape (the authors state this), so it cannot speak to the subject's
     occasional 10-11 h nights at all.

  n recorded as 446,118 = the UK Biobank exposure GWAS sample. Outcome samples: DIAGRAM and FinnGen.
