rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Genuinely randomised 2-period 2-condition crossover with controlled caloric intake and physical activity - the strongest design in this domain. But n=7 is very small (the authors list small sample size and single centre as the limitation), so the effect estimate is highly imprecise even though the p-values are small. Only 1 of 7 participants was female. Wash-out length between periods not retrievable from the abstract."
funding: "National Institutes of Health"
notes: |
  UNIQUE VALUE: this is the only record in this shard that shows sleep restriction changes a
  MOLECULAR insulin-signalling step (Akt phosphorylation) in a peripheral human tissue, i.e. it
  supplies mechanism rather than just a whole-body index. That makes it useful for arguing the
  acute effect is real and biological, but its n=7 means it should carry almost no weight in
  quantifying magnitude.

  DISTANCE FROM OUR SUBJECT'S EXPOSURE:
  * Dose: 4.5 h TIB, about 1-1.5 h/night more severe than the subject's weekday 5-6 h.
  * Referent: 8.5 h TIB. This is the BEST referent of any experimental study here - it is a normal,
    physiologically appropriate sleep opportunity rather than a 10-12 h extension. The 4.5-vs-8.5 h
    contrast (4 h/night) is therefore an honest short-vs-normal comparison, unlike spiegel1999.
  * Duration: only 4 nights - SHORTER than the subject's 5-night weekday block, so on duration this
    is if anything a conservative analogue of one of the subject's weeks. But it says nothing about
    3 years of repetition.
  * Setting: inpatient, controlled intake. No weekend recovery.
  * AGE: mean 23.7 y (SD 3.8), so the sample plausibly reaches down toward 20 but the mean is ~6 y
    above our 18-year-old. Adipose insulin signalling in late adolescence is not characterised, so
    transportability of the molecular finding to age 18 is assumed, not shown.
  * Sex: 6 of 7 male, matching the subject.
  * NO recovery arm - contributes nothing to the reversibility question.

  ARITHMETIC NOTE: the "nearly 3-fold" framing sounds far more dramatic than the whole-body clamp
  effects in buxton2010 (-11%). These are not comparable quantities: a 3-fold shift in an EC50 of a
  signalling assay is not a 3-fold shift in whole-body glucose disposal. The modeller must not
  read "3-fold" as a whole-body metabolic effect size.
shard: "s07_metabolic"
