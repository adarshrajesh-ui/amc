rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Extremely well-controlled >5-week inpatient forced-desynchrony protocol with circadian phase held constant across measurements - the best circadian control of any study in this shard. But it is a fixed-order within-subject design with no parallel control arm, and the exposure DELIBERATELY CONFOUNDS sleep restriction with circadian disruption by design, so it cannot attribute the metabolic effect to short sleep alone. yuan2021 is the companion study that performs that separation and finds the sleep-restriction-only effect is null."
funding: "Not retrievable from the abstract (Brigham and Women's Hospital Division of Sleep Medicine; funder left unstated rather than guessed)."
notes: |
  READ THIS RECORD TOGETHER WITH yuan2021. On its own it is easy to misread as 'chronic short sleep
  wrecks glucose metabolism'. What it actually shows is that short sleep COMBINED WITH circadian
  disruption does so. The n=9 companion protocol (yuan2021) that removed the circadian disruption
  while keeping 3 weeks of chronic sleep restriction found NO adverse glycaemic effect. So the
  causal weight in this pair of studies sits substantially on the circadian component.

  DISTANCE FROM OUR SUBJECT'S EXPOSURE:
  * Dose: 5.6 h per 24 h - very close to the subject's weekday 5-6 h. Good dose match.
  * Duration: 3 weeks CONTINUOUS. Longer than any single stretch the subject experienced (max 5
    weekday nights before a recovery opportunity), so this over-states consecutive accumulation.
  * CIRCADIAN COMPONENT - the crucial mismatch, and it cuts BOTH ways:
      - The protocol used recurring 28-h days, a far more violent circadian challenge than anything
        the subject experienced. On that reading it badly over-states his exposure.
      - BUT the subject's weekday/weekend pattern (late weekday bedtimes, 2-3 h later weekend sleep
        midpoint, i.e. social jetlag) IS a recurring circadian misalignment, just a much milder one.
        Given yuan2021, the circadian channel may be the one that actually matters for him. This
        study is therefore best used as evidence that the SLEEP-PLUS-CIRCADIAN combination is the
        harmful exposure, which is the combination the subject actually had - at perhaps a tenth of
        the intensity.
  * Age: "healthy adults", no age reported in the abstract -> nulls. Forced-desynchrony protocols in
    this laboratory typically recruit across a wide adult range, so adolescent_match is set to
    fair_adult rather than good_young_adult; treat the age match as UNVERIFIED.
  * Mechanism: the deficit was in INSULIN SECRETION, not insulin sensitivity - the opposite of
    buxton2010 from the same first author. The mechanistic picture across this literature is
    genuinely inconsistent, and the downstream model should not commit to a single pathway.

  REVERSIBILITY CONTRIBUTION: this is the best available UPPER BOUND. After a 3-week insult that was
  more severe than anything the subject sustained, 9 days of adequate sleep plus circadian
  re-entrainment produced full normalisation. Note the recovery required BOTH more sleep AND stable
  circadian re-entrainment; the study cannot say which was necessary.
