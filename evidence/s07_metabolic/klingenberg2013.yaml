rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomised crossover, which is the best available design, and the only one performed in the exact target age band. Limitations: n=21, HOMA-IR and Matsuda are surrogate indices (no clamp), no blinding possible, single country/ethnicity, all normal-weight so no generalisation to overweight adolescents. SEs here are derived from p-values rather than published, so precision is approximate."
funding: "Not retrievable from the abstract; the study is from the University of Copenhagen Department of Nutrition, Exercise and Sports (funder left unstated rather than guessed)."
notes: |
  *** HIGHEST-PRIORITY AGE MATCH IN THIS SHARD. *** Mean age 16.8 +/- 1.3 y, all male, healthy,
  normal weight. This is the only experimental sleep-restriction/insulin study that sits inside the
  subject's own age band, and the subject's sex. Every adult lab study in this shard should be
  down-weighted relative to this one on transportability grounds, and up-weighted on precision.

  DISTANCE FROM OUR SUBJECT'S EXPOSURE:
  * Dose: 4 h/night, i.e. 1-2 h/night MORE severe than the subject's habitual weekday 5-6 h. It does
    however closely match the subject's OCCASIONAL 3-4 h pre-exam nights, which makes this the best
    available evidence for what those specific nights did.
  * Referent: 9 h/night - a genuinely age-appropriate adolescent sleep opportunity, not an extension
    artefact. The 4-vs-9 h contrast (5 h/night) is about 1.7-2.5x the subject's habitual weekday
    deficit against a 8-9 h requirement.
  * Duration: only 3 consecutive nights, SHORTER than the subject's 5-night school week. So this is
    a partial analogue of a single week, and cannot address 3 years of repetition.
  * Setting: laboratory, so the free-living appetite/activity pathways are suppressed.
  * NO recovery arm and no follow-up, so it contributes nothing directly on reversibility. It does
    show the effect is present after only 3 nights, i.e. it develops fast.

  TWO FINDINGS THE MODELLER SHOULD NOT MISS:
  1. In adolescents the insult appeared as COMPENSATED insulin resistance: fasting insulin +59% and
     HOMA-IR +65% with glucose completely unchanged. So for an 18-year-old the plausible short-run
     phenotype is raised insulin demand with normal glucose, not dysglycaemia. Any model that
     converts these percentages into near-term diabetes probability is mis-specified.
  2. The HOMA-IR (+65%) and Matsuda (-28%) effects are LARGER in relative terms than the adult clamp
     effect in buxton2010 (-11%), despite a shorter exposure. This is consistent with adolescents
     being MORE metabolically sensitive to sleep loss, but the measures are different (surrogate
     indices vs clamp) so the comparison is suggestive, not quantitative. Adolescence is already a
     period of physiological insulin resistance, which could plausibly amplify or mask the effect;
     nobody has run a clamp protocol in this age group, so this is a genuine gap.
shard: "s07_metabolic"
