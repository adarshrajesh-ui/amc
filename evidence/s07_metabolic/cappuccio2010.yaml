rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Careful, transparent meta-analysis: random-effects pooling, Downs and Black quality scoring (all but one study scored 15-18 of 19), Egger tests, trim-and-fill, leave-one-out sensitivity analyses, and no detected publication bias. But it is categorical rather than dose-response, exposure is self-reported in EVERY contributing study, statistical heterogeneity for short sleep was significant (P=0.015), and the authors themselves state a meta-analysis of observational data cannot control confounding. Superseded on precision by shan2015 (dose-response) and liu2025 (53 studies), so it should be used for the sex-specific and <=5 h subgroup estimates rather than as the primary anchor."
funding: "Not stated in the retrieved full text (University of Warwick / Federico II University of Naples authorship; funder left unstated rather than guessed)."
notes: |
  ROLE IN THIS SHARD: the comparator meta-analysis requested by the task, and the source of two
  numbers that shan2015 does not provide - a directly published <=5 h estimate and a sex-specific
  estimate.

  SCALE: 10 studies, 13 independent cohort samples, 107,756 participants, 3,586 incident T2D cases,
  follow-up 4.2-32 years. Short-sleep analysis drew on 9 cohorts from 7 published studies.

  *** DE-DUPLICATION WARNING FOR THE POOLER. *** cappuccio2010 (search to April 2009), shan2015
  (search to March 2014) and liu2025 (search to October 2024) are NESTED literatures with heavily
  overlapping primary studies. They are three views of largely the same cohorts, NOT three
  independent bodies of evidence. Pooling all three as independent would badly overstate precision.
  Recommended treatment: take shan2015 as the primary dose-response anchor, liu2025 as the
  precision/recency update, and use cappuccio2010 only for the male-specific and <=5 h subgroup
  estimates. cohort_family is set to pooled_multiple on every effect to flag this.

  *** THE MALE-SPECIFIC ESTIMATE - IMPORTANT BUT FRAGILE. *** RR 2.07 (1.16-3.72) in men versus 1.07
  (0.90-1.28) in women, heterogeneity P = 0.04. Our subject is male, so this is directly on point and
  it is roughly twice the pooled estimate. Three cautions before the model leans on it: the CI spans
  a 3-fold range; a subgroup difference at P = 0.04 in a 10-study meta-analysis is weak evidence; and
  the much larger liu2025 did NOT reproduce this sex split (men OR 1.13 [1.04-1.24] vs women 1.10
  [1.06-1.14], i.e. essentially no difference). The honest reading is that a male excess is possible
  but is not supported by the larger and more recent synthesis, so cappuccio2010's 2.07 should be
  treated as an outlier rather than as the best male estimate.

  AGE: adult cohorts with follow-up of 4.2-32 years; no adolescent data, no age distribution in the
  paper. Scored poor_midlife. Same transportability caveat as shan2015.

  TWO OF THE AUTHORS' OWN CAVEATS ARE WORTH CARRYING FORWARD VERBATIM:
  * On confounding: "residual confounding and bias remain a possibility. For instance, low levels of
    physical activity or poor diet that are causally related to type 2 diabetes may have also
    influenced sleep patterns."
  * On single-timepoint exposure: "Quantity and quality of sleep were assessed at one point in all
    studies. A single measure of exposure may not fully capture the sustained effects of sleep
    disruption over time on long-term morbidity." This cuts BOTH ways for our subject - it means the
    cohorts may understate the effect of truly sustained short sleep, but it also means they cannot
    speak to a 3-year episode that then ends.
  * Undiagnosed obstructive sleep apnoea was not excluded in all studies, which matters because bos2019
    found that adjusting for sleep-apnoea risk abolished the cross-sectional insulin-resistance
    association entirely.

  ALSO: risk rose with length of follow-up (RR increment per year of follow-up estimated at 2% for
  short sleep, 1.02 [0.93-1.12], not significant), which is weak evidence of cumulative rather than
  transient harm.
