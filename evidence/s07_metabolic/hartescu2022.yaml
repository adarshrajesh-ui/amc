rob:
  tool: RoB2
  judgement: high
  notes: "Genuinely randomised and, uniquely in this shard, conducted in FREE-LIVING conditions over 6 weeks with actigraphic verification - so it tests a real-world intervention rather than a laboratory manipulation. But n=18 total (10 vs 8) is very small for a parallel-group design, the control arm received no intervention so there is no attention/placebo control, blinding is impossible, and the several within-group CIs that only just exclude zero in a trial this size are fragile. The between-group HOMA-IR contrast is my derivation and assumes independence of the two arms' change estimates. Judged high risk of bias."
funding: "Not retrievable from the abstract (Loughborough University / University of Leicester authorship; funder left unstated rather than guessed)."
notes: |
  ROLE IN THIS SHARD: the only RANDOMISED, FREE-LIVING, MULTI-WEEK test of whether ADDING sleep
  improves insulin resistance. Every other reversibility record here (killick2015, ness2019,
  buxton2012_fd) is an inpatient laboratory protocol lasting days. This one runs 6 weeks in
  participants' own homes, which is the setting in which our subject would actually attempt a fix.

  WHAT IT ADDS TO THE REVERSIBILITY PICTURE: a behavioural sleep-extension programme added 79 min of
  actigraphic sleep per night and improved HOMA-IR by -0.51 units against a control drift of +0.28
  (derived between-group difference -0.79, 95% CI -1.465 to -0.115). Direction and rough magnitude
  agree with killick2015's 45% inpatient improvement. So the reversibility signal survives the move
  from laboratory to real life, at least in this small trial.

  DISTANCE FROM OUR SUBJECT'S EXPOSURE - THIS IS THE WORST POPULATION MATCH IN THE SHARD:
  * The participants were OVERWEIGHT/OBESE males already flagged as at increased risk of type 2
    diabetes (BMI around 30 kg/m2 per the abstract fragment). Our subject is an 18-year-old whose BMI
    is not known to this shard but who is not described as obese or at elevated diabetes risk.
  * Baseline HOMA-IR in an overweight, insulin-resistant middle-aged group is far higher than in a
    lean 18-year-old, so there is much more room for improvement. An absolute change of -0.51 HOMA-IR
    units will NOT transport to our subject in absolute terms, and probably not proportionally either.
    Use this record for DIRECTION and FEASIBILITY, not for magnitude.
  * Age is not reported in the abstract, so age_mean/age_range are null; the population is described
    as overweight/obese adult men at increased T2D risk, hence poor_midlife.
  * Sex: all male, matching the subject - the one clean match.
  * The intervention is sleep EXTENSION from habitual short sleep, which is precisely the
    counterfactual the subject faces on entering his second year of college. So its practical
    relevance is high even though its population is wrong.

  FEASIBILITY POINT WORTH CARRYING TO THE REPORT: the achievable free-living gain was 79 min/night
  (95% CI 69-88), i.e. about 1.3 h. That is roughly the size of the subject's weekday deficit against
  a 7-8 h target, so a comparable intervention would plausibly close most of his gap - but note it
  took a structured 6-week cognitive-behavioural programme to achieve it, not merely an intention.
shard: "s07_metabolic"
