rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "This is the highest-tier synthesis available for the acute/mechanistic side: a systematic review and meta-analysis restricted to RANDOMISED CONTROLLED TRIALS, 35 eligible articles with 21 pooled for sleep restriction, published in the leading sleep review journal, with the manipulations sensibly categorised. Downgraded to moderate for OUR purposes purely because no pooled effect size, CI or heterogeneity statistic is retrievable from the abstract and the full text is paywalled, so I cannot verify the pooling method, assess heterogeneity, or check for small-study bias. The underlying trials are also almost all short (days to ~2 weeks), small, and in adults."
funding: "Not retrievable from the abstract (University of Copenhagen / Steno Diabetes Center Copenhagen authorship; funder left unstated rather than guessed)."
notes: |
  ROLE IN THIS SHARD: the TIER-1 UMBRELLA CHECK. It confirms that the individual lab studies I
  extracted (spiegel1999, buxton2010, broussard2012, klingenberg2013, ness2019, depner2019,
  cheung2026) are representative of a coherent randomised-trial literature of 21 pooled studies, and
  not cherry-picked positives. That is its main value, since I could not retrieve its numbers.

  *** NOTE THE AUTHORSHIP OVERLAP: L. Klingenberg is an author of BOTH this meta-analysis and
  klingenberg2013, the adolescent trial. *** So sondrup2022 almost certainly INCLUDES klingenberg2013
  among its 21 pooled restriction studies, and probably includes buxton2010, broussard2012 and
  spiegel1999 as well. DO NOT POOL sondrup2022 WITH THE INDIVIDUAL T1 RECORDS IN THIS SHARD - they
  are the same underlying data. Use it as a consistency check and as a source of qualitative
  structure, then pool the primaries.

  TWO QUALITATIVE FINDINGS THAT GENUINELY CHANGE THE MECHANISTIC PICTURE:
  1. WHOLE-BODY insulin sensitivity fell on the clamp but PERIPHERAL insulin sensitivity did not.
     Peripheral insulin sensitivity is dominated by skeletal-muscle glucose uptake, so the deficit is
     being driven by hepatic and/or adipose tissue instead. This is consistent with broussard2012
     (adipose insulin signalling impaired) and with depner2019 (which reported hepatic and muscle
     components separately). Practically, it means the model should NOT assume the sleep-loss
     metabolic phenotype is the same as the obesity/inactivity insulin-resistance phenotype, which is
     muscle-dominant.
  2. Sleep FRAGMENTATION and REM disturbance had NO effect, while DURATION, SLOW-WAVE-SLEEP
     SUPPRESSION and CIRCADIAN MISALIGNMENT did. This is a specificity finding and it strengthens
     causal inference: an artefactual or purely stress-mediated pathway would be expected to respond
     to fragmentation too.

  AGE: the pooled trials are predominantly in adults, with klingenberg2013 the notable adolescent
  exception; no age breakdown is retrievable, so adolescent_match is scored 'mixed'. n is left null
  because the total pooled participant count is not in the abstract; n_studies_pooled=21 refers to the
  sleep-restriction meta-analysis (35 articles were eligible overall).
shard: "s07_metabolic"
