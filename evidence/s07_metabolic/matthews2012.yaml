rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "CROSS-SECTIONAL, so tier TX (context only, not primary) despite the excellent age match and the objective actigraphy exposure. Reverse causation is entirely unaddressed: insulin resistance and adiposity plausibly shorten and fragment sleep. Adjustment for BMI AND waist circumference is aggressive and, if short sleep causes adiposity, over-adjusts away part of a real effect. Single high school, low-to-middle socioeconomic range, so limited external validity. No effect magnitude published in the retrievable text, which is the binding limitation on its usefulness here."
funding: "Not retrievable from the abstract (University of Pittsburgh authorship; funder left unstated rather than guessed)."
notes: |
  WHY THIS RECORD IS HERE DESPITE BEING CROSS-SECTIONAL: it is one of only two actigraphy-based
  adolescent insulin-resistance studies in the target age band, and it is the study named in the task
  brief (Matthews). It supplies age-matched DIRECTION plus a measurement calibration that materially
  affects how the subject's self-reported exposure should be interpreted.

  *** THE MOST USEFUL NUMBER IN THIS RECORD IS THE MEASUREMENT DISCREPANCY, NOT THE EFFECT. ***
  These adolescents reported 7.4 h by diary but actually slept 6.4 h by actigraphy - a 1.0 h
  over-report. Our subject's exposure is characterised by SELF-REPORT ("~5-6 h on weekdays"). If the
  same 1 h optimism applies, his true weekday sleep may be closer to 4-5 h, which would move him
  substantially further down the dose-response curve and closer to the doses used in the extreme lab
  protocols (klingenberg2013's 4 h, broussard2012's 4.5 h). The downstream model should either apply
  a self-report correction of this order or explicitly widen the exposure uncertainty. This single
  fact may matter more for the final estimate than any of the effect sizes in this shard.

  SECOND USEFUL FACT: the association was driven specifically by WEEKDAY sleep duration ("primarily
  due to sleep duration during the week"). Our subject's deficit is exactly a weekday deficit. That
  is a direct, if cross-sectional, age-matched argument for using his WEEKDAY value rather than his
  weekly average as the operative exposure - and it cuts against the naive averaging calculation
  noted in the shan2015 record.

  THIRD: no long-sleep association was found in adolescents, unlike javaheri2011 (same age band,
  also actigraphy) which DID find a U-shape with elevated HOMA at 10.5 h. The two age-matched
  actigraphy studies disagree on the long limb, so the subject's occasional 10-11 h weekend nights
  should be treated as of genuinely uncertain significance.

  POPULATION: 245 high school students (137 African American, 116 male), so 52.7% female by
  subtraction (245-116=129 female). Ages not given numerically in the abstract but the sample is
  high-school students, so exact_16_19 is appropriate; age_mean and age_range left null rather than
  guessed. Unadjusted HOMA-IR averaged 4.13, which is notably high for healthy adolescents and is
  worth noting as a possible assay/population calibration issue when comparing to other cohorts.
shard: "s07_metabolic"
