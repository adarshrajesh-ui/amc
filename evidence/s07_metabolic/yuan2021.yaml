rob:
  tool: RoB2
  judgement: moderate
  notes: "The key comparison is BETWEEN TWO SEPARATE STUDIES run years apart (a new n=9 37-day inpatient protocol vs a previously published n=21 forced-desynchrony protocol), not a randomised within-study contrast. Different cohorts, different protocols, different eras of laboratory practice, and the null arm has only n=9. So the sleep-vs-circadian attribution is suggestive, not established. Judged moderate rather than some_concerns for this reason."
funding: "Not retrievable from the abstract (Brigham and Women's Hospital; funder left unstated rather than guessed)."
notes: |
  *** THE MOST IMPORTANT COUNTERWEIGHT IN THIS SHARD. *** Every other experimental record here says
  short sleep harms glucose metabolism. This one says that when you hold circadian disruption
  constant, 3 weeks of chronic sleep restriction produced NO adverse glycaemic effect. If that is
  right, a large share of the experimental literature's apparent 'short sleep' effect is actually a
  circadian-disruption effect that rides along with short sleep in the lab (and in life, via late
  bedtimes and artificial light).

  WHY THIS MATTERS SPECIFICALLY FOR OUR SUBJECT: he did not merely sleep less; he slept less on
  weekdays and shifted his sleep 2-3 h later at weekends. That is social jetlag - a recurring, if
  mild, circadian misalignment. So the mechanism this paper implicates is one the subject DOES have.
  The practical implication is that the downstream model should treat the subject's circadian
  irregularity as at least as important as his sleep-duration deficit, and should not assume that
  simply adding sleep hours while keeping an irregular schedule would neutralise the metabolic risk.

  DISTANCE FROM OUR SUBJECT'S EXPOSURE:
  * The null arm is the informative one, and it is a 3-week continuous restriction - LONGER than any
    continuous stretch the subject sustained.
  * Age: "healthy adults", no age given -> nulls; fair_adult, treat age match as UNVERIFIED.
  * n recorded as 30 = 9 (CSR with minimised circadian disruption) + 21 (CSR + recurrent circadian
    disruption). NOTE the 21 overlaps with buxton2012_fd - de-duplicate before pooling.

  HOW TO USE IT: as a variance-inflating record. It should widen the posterior on the acute
  metabolic effect substantially and should block any confident claim that sleep duration alone,
  independent of timing, is the operative exposure. It should NOT be read as proof of no effect:
  n=9, a single site, and an across-study comparison cannot support that.
