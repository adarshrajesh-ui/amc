rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomised 3-arm parallel design with PSG every night, strictly controlled isocaloric diet, and verified equal total sleep between the two short-sleep arms - an unusually strong protocol. Weaknesses: the primary group x day interaction was NOT significant (p > .15), so the between-group claims rest on within-group change scores, which is a weaker inferential basis than the abstract's emphasis suggests. The control group itself drifted toward insulin resistance from laboratory sedentariness, which contaminates the baseline comparison for all arms. Per-group n not stated in the retrieved text. Habitual short sleepers were EXCLUDED by design."
funding: "Not stated in the retrieved text (National University of Singapore Centre for Sleep and Cognition; funder left unstated rather than guessed)."
notes: |
  *** THE CLOSEST PROTOCOL MATCH TO OUR SUBJECT'S WEEKLY CYCLE, AND THE NEWEST EVIDENCE. ***
  Design: 8 h baseline, then TWO cycles of 5 restricted "weekday" nights followed by 8 h "weekend"
  recovery. That is the subject's schedule, repeated twice, in young adults, with PSG verification.

  DISTANCE FROM OUR SUBJECT'S EXPOSURE:
  * Dose: the stable arm's 6 h TIB produced 5.75-5.86 h of ACTUAL sleep - an almost exact match to
    the subject's reported weekday 5-6 h. Best dose match in the shard, and it is PSG-verified
    rather than self-reported.
  * Pattern: 5 weekday nights + weekend recovery, matching the subject exactly. Recovery dose 8 h,
    matching the subject's reported weekend 7-8 h almost exactly. This is a closer recovery-dose
    match than ness2019 (10 h) or killick2015 (10 h).
  * The VARIABLE arm (8, 4, 8, 4, 6 h) is a good analogue of the subject's ragged real schedule with
    occasional 3-4 h pre-exam nights, since it holds total sleep constant while varying night to
    night.
  * Duration: 2 cycles (16 days). The subject completed roughly 150 cycles over 3 years. Still the
    longest multi-cycle experimental exposure available, but three orders of magnitude short of the
    subject's, so the long-run extrapolation remains unsupported.
  * Age: 21-35 y, so the youngest participants are 3 y above the subject and none are adolescents.
    good_young_adult. Note the study EXCLUDED habitual short sleepers (self-reported TIB < 6 h),
    which is precisely the group the subject belongs to - so any adaptation that habitual short
    sleepers may have developed is by construction absent from this estimate.

  TWO FINDINGS THAT MATTER MOST FOR THE MODEL:
  1. VARIABILITY MATTERS MORE THAN MEAN DOSE. Both short-sleep arms slept the SAME total amount
     (30 h per 5 nights, verified p = .23 / .71), yet the variable arm's glucose deterioration was
     about 2.5x larger (dz >= 0.99 vs 0.39). Mechanistically the authors attribute this to failure of
     compensatory insulin hypersecretion, i.e. possible beta-cell functional impairment, in the
     variable arm. For our subject this means his IRREGULARITY - occasional 3-4 h nights and 10-11 h
     weekend nights - may be a bigger metabolic exposure than his average sleep duration. Any model
     that summarises his exposure as a single mean hours-per-night will understate the risk.
  2. An 8 h weekend recovery did NOT prevent the deterioration across two cycles, converging with
     depner2019. The authors' conclusion is that only sleeping within the age-appropriate range
     EVERY night optimised glucose tolerance.

  Effect sizes here are standardised within-subject changes in 2-h glucose, which are NOT comparable
  units to the insulin-sensitivity percentages in buxton2010/klingenberg2013. Do not pool across
  those scales without conversion.
