    conversion_formula: "Authors report 'dz >= 0.99' with p < .01, so 0.99 is a LOWER BOUND on the true dz, not a point estimate. SE(dz) = sqrt(1/16 + 0.99^2/32) = 0.3052, same equal-split n=16 assumption as above."
    from_figure: false
    inferred_from_ci: true
    direction_note: "positive = HARM, and roughly 2.5x the stable-schedule effect at IDENTICAL total sleep. Lower bound only."
