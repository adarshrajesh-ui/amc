    unit: "dz (within-subject standardised change from baseline in 2-h post-load glucose)"
    value: 0.39
    se: 0.2593
    ci: [-0.118, 0.898]
    conversion_formula: "dz = 0.39 reported directly by the authors (Cohen's dz) with p = 0.02. SE(dz) = sqrt(1/n + dz^2/(2n)) with n=16 (48 analysed participants split across 3 randomised groups; the paper does not state per-group n in the retrieved text, so n=16 is an EQUAL-SPLIT ASSUMPTION - if groups were unbalanced this SE is approximate). CI = dz +/- 1.96*SE."
    from_figure: false
    inferred_from_ci: true
    direction_note: "positive = HARM (higher 2-h glucose after recurrent 6 h weekday sleep, despite intervening 8 h weekend recovery)"
    covariates: ["diet strictly controlled to zero net weight change; strenuous activity prohibited"]
    followup_years: null
    cohort_family: null
    quote: "The stable short sleep group also showed increased insulin levels in the first week (p = .02), but their glucose levels still increased from baseline (p = .02; Cohen's dz = 0.39)."
