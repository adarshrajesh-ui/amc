    exposure: {type: chronic_restriction, dose_h: 6, referent_h: 8, duration_days: 5, contrast_label: "variable short sleep group: 8, 4, 8, 4, 6 h TIB across 5 'weekday' nights (same 30 h total as the stable group) x 2 cycles, each followed by 8 h recovery, vs own 8 h baseline"}
