    followup_years: null
    cohort_family: null
    quote: "Importantly, in both weeks of sleep restriction, the variable short sleep group failed to significantly elevate their insulin levels (p > .30); hence, their glucose levels increased from baseline (p < .01, dz >= 0.99) more prominently than the stable short sleep group."
