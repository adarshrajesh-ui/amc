    quote: "Opposite to predictions, oral glucose tolerance at the end of the short-sleep condition was not compromised and 24-hour glucose homeostasis was maintained with less insulin in the systemic circulation. This enhanced 24-hour insulin economy during the short-sleep condition was accompanied by a modest decline in fasting blood glucose, increased fasting FFA concentrations which suppressed normally after glucose ingestion, and lower total and LDL cholesterol."
rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomised crossover, tightly controlled diet, comparable weight loss across conditions (1.0 BMI unit each), 14-day conditions, dense 24-h sampling every 30 min, and both oral and intravenous glucose challenges - methodologically careful. Concerns: (1) n=10, very small; (2) the two conditions were separated by 7 +/- 3 MONTHS, an unusually long washout that admits secular drift in fitness, season, and body composition; (3) open-label; (4) MEASUREMENT VALIDITY IS THE DOMINANT ISSUE - the authors state explicitly that sleep-loss-related changes in counter-regulatory hormone secretion during the IVGTT 'limited the utility of the test in this study', so the headline S_I and DI estimates are suspect BY THE AUTHORS' OWN ASSESSMENT; (5) the exposure is bundled with an active hypocaloric diet, so this estimates the effect of short sleep DURING WEIGHT LOSS and cannot be generalised to weight-stable or weight-gaining conditions; (6) overweight middle-aged participants, 7 men and 3 women, no sex-stratified results; (7) p-values reported only as bounds."
funding: "Not stated in the retrieved full text body (University of Chicago; NIH-supported NIHPA author manuscript, but no explicit grant statement was captured, so left unstated rather than guessed). Authors declared no conflict of interest."
notes: |
  READ THIS RECORD AS THE OTHER HALF OF THE PAIR WITH nedeltcheva2009. Same laboratory, same 14-day
  5.5 h versus 8.5 h protocol, same Minimal-model methodology - the ONLY substantive difference is
  energy balance, and the primary oral-glucose result flips:
    nedeltcheva2009 - ad libitum food, sedentary, weight GAIN  -> 2-h OGTT glucose +9.1% (HARM)
    nedeltcheva2012 - hypocaloric diet, weight LOSS            -> oral glucose tolerance NOT impaired
  This is a genuine, informative effect modification and it should be reported as such rather than
  averaged away.

  THE INTERNAL CONTRADICTION IS THE POINT, AND IT IS A METHODOLOGICAL WARNING FOR THE WHOLE SHARD:
  In the SAME 10 people, in the SAME conditions:
    * IVGTT / Minimal model  -> S_I down 26%, disposition index down 23%. Looks like clear harm.
    * OGTT + 24-h profiles   -> no deterioration in glucose tolerance; 24-h glucose held with LESS
                                circulating insulin; fasting glucose modestly LOWER.
  The authors come down on the side of the oral and 24-h data and explain the IVGTT discrepancy
  mechanistically: sleep restriction altered cortisol, GH, and acylated-ghrelin secretion DURING the
  test, and those hormonal excursions bias Minimal-model estimates toward apparent insulin
  resistance. They even note that circulating insulin TENDED TO BE LOWER 60-180 min after meals under
  restriction (P<0.06), and speculate that systemic insulin sensitivity may actually have been
  somewhat HIGHER.
  IMPLICATION THE MODELLER MUST CARRY: several headline "insulin sensitivity fell by X%" numbers in
  this literature - including buxton2010's IVGTT-based -20% and nedeltcheva2009's -17.5% - rest on
  IVGTT Minimal-model estimates obtained under exactly the hormonal conditions this paper identifies
  as problematic. buxton2010 is partially protected because it ALSO ran a euglycemic clamp and found
  -11% (a smaller effect than its own IVGTT figure of -20%, which is precisely the direction of bias
  this paper predicts). sondrup2022's meta-analysis likewise found the clamp-measured whole-body
  effect real but the PERIPHERAL component unaffected. The convergent conclusion across all of these:
  IVGTT-derived reductions in insulin sensitivity after sleep restriction are probably OVERSTATED,
  and clamp-based estimates around 10-11% are the more trustworthy magnitude.

  DISTANCE FROM OUR SUBJECT'S EXPOSURE:
  * Dose: 5.5 h TIB, 131 +/- 30 min/day of achieved sleep loss, moving participants from >7 h/day to
    <6 h/day - the authors explicitly designed it "to approximate the short sleep times of many
    adults". Close to the subject's weekday dose; far milder than the 4 h protocols.
  * Duration: 14 days, continuous, no weekend recovery. Cannot address 3 years or weekday cycling.
  * CONTEXT IS THE DISQUALIFYING MISMATCH: participants were on a hypocaloric diet and actively losing
    weight. An 18-year-old college student is not in negative energy balance as a rule. So for our
    subject the 2009 companion (ad libitum, weight gain) is the applicable arm, and THIS record's
    reassuring null should be read as a boundary condition - "short sleep does not impair oral
    glucose tolerance WHEN energy intake is restricted" - not as evidence that short sleep is
    glycaemically harmless in general.
  * Age: mean 41 +/- 5 y, BMI 27.4 +/- 2.0, overweight. Two decades older than the subject and
    already overweight. Scored poor_midlife.

  NET CONTRIBUTION TO THE SHARD: (1) it is one of only two experimental records (with dutil2024) in
  which a realistic-dose restriction protocol failed to produce glycaemic harm, so it is essential
  ballast against over-reading the 4 h studies; (2) it supplies the energy-balance effect modifier;
  (3) it supplies the strongest internal evidence that IVGTT-based insulin-sensitivity estimates in
  sleep-restriction studies are biased toward exaggerating harm.

  n = 10 (3 female, 7 male) so pct_female = 30.0%. Mean age 41 [SD 5] y; no range published, so
  age_range null rather than guessed. Weight loss 1.0 [0.3] BMI units in each condition.
shard: "s07_metabolic"
