    conversion_formula: "Published beta = -0.68, 95% CI -1.21 to -0.08, P = 0.0132. se from CI width = (-0.08 - (-1.21))/3.92 = 1.13/3.92 = 0.28827; ci recomputed as -0.68 +/- 1.96*0.28827 = -1.245 to -0.115. NOTE A MINOR INTERNAL INCONSISTENCY IN THE SOURCE: -0.68 is not centred in (-1.21, -0.08) - the midpoint is -0.645 - and the SE implied by P=0.0132 (z=2.4783, se=0.27438) differs slightly from the CI-implied SE (0.28827). I used the CI-based SE as the more conservative of the two. CRITICAL UNIT WARNING: the methods state the outcome is 'the continuous HOMA-IR index (scaled to 0-100)', so these betas are in rescaled index points, NOT raw HOMA-IR units. They therefore CANNOT be compared directly with zuraikat2024's raw HOMA-IR beta of +0.30 or hartescu2022's -0.51."
