rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: "Cross-sectional NHANES analysis; tiered TX and rated high risk of bias. The design cannot establish direction of causation, and for this exposure reverse causation is a live and specific worry: people who are metabolically healthier may simply sleep differently at weekends. Author-stated limitations, which I accept: cross-sectional design precludes causal inference; ALL sleep data are SELF-REPORTED questionnaire items subject to recall bias and misreporting (the authors call for actigraphy/PSG validation); US-specific lifestyle limits generalisability; residual confounding from undiagnosed sleep disorders, obesity, and family history of diabetes cannot be ruled out. Additional concerns of my own, which matter for how the numbers may be used: (1) THE OUTCOME IS RESCALED - HOMA-IR was transformed to a 0-100 index, so the betas are not interpretable in clinical HOMA-IR units and cannot be compared with the trial literature; (2) the abstract's headline 'plateau beyond 2 h' claim is NOT clearly supported by the reported point estimates, since the >2 h stratum beta (-1.27) is numerically LARGER than the 0-2 h stratum beta (-1.14) - the authors appear to be describing a change in statistical strength and in the spline shape rather than in magnitude, and the discussion concedes the second spline segment shows a 'non-significant positive trend'. Do not repeat the plateau claim as if it were a quantitative finding; (3) many subgroup and threshold analyses without evident multiplicity control; (4) the male-stratum CI is internally inconsistent with its own point estimate and p-value (see conversion_formula)."
funding: "Not identified in the retrieved text. The authors declare no commercial or financial conflicts of interest."
notes: |
  *** THIS IS THE BEST EXPOSURE-PATTERN MATCH IN THE ENTIRE SHARD, AND SIMULTANEOUSLY ONE OF THE
  WEAKEST DESIGNS. Both facts must travel together. ***

  WHY THE EXPOSURE MATCH IS SO CLOSE: the study's positive strata are (a) MALES and (b) people whose
  WEEKDAY sleep is <=7 h, and its focal exposure is weekend recovery of 0-2 h. Our subject is male,
  slept 5-6 h on weekdays, and slept 7-8 h at weekends - a recovery of roughly 2 h. He sits in every
  favourable stratum this paper identifies, in the band where the estimated benefit is largest, and
  right at the 2 h inflection point the authors locate. No other record in the shard aligns this
  precisely with his actual weekly pattern.

  WHAT IT ADDS THAT THE EXPERIMENTS DO NOT: the experimental weekend-recovery records are pessimistic.
  depner2019 found weekend recovery did NOT prevent metabolic dysregulation (and cumulatively added
  only ~1.1 h of sleep while delaying circadian phase); cheung2026 found 8 h weekend recovery
  insufficient, with schedule VARIABILITY causing about 2.5x worse glucose deterioration than stable
  short sleep. Those are 1-3 week lab protocols. This record, at population scale and over habitual
  real-world exposure, points the other way: weekend recovery is associated with LOWER insulin
  resistance, specifically in short-sleeping men. The honest synthesis is that weekend catch-up is
  probably PARTIALLY protective relative to no catch-up, while still being clearly inferior to
  simply sleeping enough on weekdays - and that lab protocols compressing the pattern into 1-3 weeks
  may not capture whatever benefit accrues over years. The cross-sectional design means this cannot
  overturn the experiments; it can only widen the posterior.
  See also liu2025_wcs-adjacent NHANES work (PMID 40437485, BMC Med 2025) on the same question, which
  I screened but did not extract - noted in screening_log.md as a de-duplication issue since it draws
  on the same NHANES resource and would double-count.

  THE SOCIAL-JETLAG ADJUSTMENT IS WHAT MAKES THIS INTERPRETABLE, AND IT CUTS BOTH WAYS: model II
  adjusts for social jetlag AND for weekday sleep hours. So the estimate is the association of
  weekend recovery with insulin resistance holding constant both the weekday deficit and the
  circadian misalignment that weekend recovery normally creates. That is the right conditioning if one
  wants the "sleep quantity recovered" pathway isolated. But it also means the estimate DOES NOT
  include the circadian cost of shifting one's schedule at weekends - and that cost is precisely what
  leproult2014, cheung2026, chen2021, and depner2019 identify as the more damaging insult. So this
  record should NOT be read as saying "weekend catch-up is net beneficial for the subject". It says
  "the extra sleep obtained at weekends is associated with benefit, once the circadian penalty is
  statistically removed". The net effect for a real person doing both at once is not estimated here.
  The authors themselves make this point in discussing why benefits do not extend beyond 2 h.

  AGE IS THE DISQUALIFYING MISMATCH: mean age 49.62 years, NHANES adults. Two and a half decades older
  than the subject, and adolescents are absent entirely. Scored poor_midlife. The authors also note the
  breakpoint corresponded to a predicted HOMA-IR of 3.78, above the clinical insulin-resistance cutoff
  of 2.5-2.8, and infer that "WSR may play a stronger role in people with preexisting metabolic
  dysfunction". A healthy 18-year-old is on the other side of that line, which argues for attenuating
  this estimate substantially before applying it to him.

  UNIT HAZARD - FLAGGING FOR THE POOLER IN THE STRONGEST TERMS: the outcome is a HOMA-IR index
  RESCALED TO 0-100, not raw HOMA-IR. A beta of -1.16 here is roughly 1.2% of the index range, NOT a
  1.16-unit fall in clinical HOMA-IR (which would be enormous). Any pooling that mixes these betas
  with zuraikat2024 (+0.30 raw HOMA-IR units) or hartescu2022 (-0.51 raw HOMA-IR units) without
  rescaling would be a serious error. I could not recover the min and max used for the rescaling, so
  I cannot supply a conversion factor; these three effects are recorded as raw_units with explicit
  unit strings and MUST NOT be pooled on a common scale without one.

  Cohort family NHANES - de-duplicate against any other NHANES-derived effect in the factory,
  including PMID 40437485 if another shard extracted it.
