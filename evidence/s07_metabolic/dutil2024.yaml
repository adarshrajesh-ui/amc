secondhand_via: "Full text XML/PDF is blocked by the publisher (Oxford University Press) at both Europe PMC and NCBI PMC; the NCBI record carries the note 'The publisher of this article does not allow downloading of the full text in XML form.' All numbers below are first-hand from the publisher abstract retrieved via PubMed efetch and from the structured abstract in the NCBI front-matter XML. The identification of the insulin-sensitivity index as the Matsuda index, and the cohort descriptors, are corroborated by the invited commentary in the same issue (Taheri S, 'Waking up to sleep extension for cardiometabolic health', Sleep 2024;47(5):zsae016, PMID 38243378, PMC11082457), which I retrieved in full."
