rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Fixed-order within-subject design (baseline -> restriction -> recovery) with NO time-matched control arm, so drift, repeated-IVGTT effects and sustained laboratory sedentariness are not separable from the sleep manipulation - this matters especially for the 'failure to recover' conclusion, since a control arm is exactly what would rule out drift. n=15, men only. Effect sizes are derived from p-values, not published, so precision is approximate."
funding: "Not retrievable from the abstract (Pennsylvania State University / Buxton laboratory; funder left unstated rather than guessed)."
notes: |
  *** THE PRIMARY RECOVERY TIME-CONSTANT RECORD. *** Design: 3 baseline nights at 10 h TIB, 5 nights
  at 5 h TIB, then 2 recovery nights at 10 h TIB, with an IVGTT on the final day of EACH condition.
  That third measurement is what makes this study uniquely informative: almost no other protocol
  re-tests glucose metabolism after a defined recovery dose.

  DISTANCE FROM OUR SUBJECT'S EXPOSURE:
  * Dose: 5 h TIB vs the subject's weekday 5-6 h. Close.
  * Duration: 5 consecutive restricted nights - an EXACT match to the subject's 5-night school week.
    This is the best duration match in the shard.
  * Recovery dose: 2 nights at 10 h TIB. The subject's weekend was 2 nights at 7-8 h, occasionally
    10-11 h. So this study's recovery dose is at or ABOVE what the subject typically got: 10 h x 2
    nights is more generous than 7-8 h x 2 nights. That makes the failure-to-recover finding MORE
    concerning for the subject, not less - he was getting a weaker recovery dose than the one that
    already proved insufficient here.
  * Referent: 10 h TIB baseline, a sleep-repletion referent rather than a normal 8 h, so the
    restriction contrast (5 h/night) is ~1.5-2x the subject's true weekday deficit.
  * Age: "fifteen healthy men", no age given in the abstract -> age_mean/age_range null. Recorded as
    good_young_adult provisionally; the modeller should treat the age match as UNVERIFIED for this
    record specifically.
  * Setting: inpatient, so free-living appetite and activity pathways are absent.

  REVERSIBILITY VERDICT: partial and outcome-specific, on a 2-night recovery dose.
    - RECOVERED within 2 nights: the dynamic lipaemic response (NEFA rebound) returned to baseline.
    - DID NOT RECOVER within 2 nights: the disposition index (the product of insulin sensitivity and
      insulin secretion, i.e. the best single predictor of future diabetes risk) remained
      significantly suppressed, P=0.01 vs baseline.
  This is the direct experimental basis for classifying the metabolic effect as REVERSIBLE BUT WITH
  A TIME CONSTANT LONGER THAN ONE WEEKEND. Combined with buxton2012_fd (full normalisation after 9
  days of recovery) the bracket for full glucose-metabolic recovery is: longer than 2 nights,
  and no longer than about 9 days. Killick2015 shows 3 nights of extension already moves insulin
  sensitivity in the right direction, so the recovery is likely gradual rather than all-or-none.
