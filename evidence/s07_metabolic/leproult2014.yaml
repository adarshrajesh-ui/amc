rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Parallel-group randomised design with the crucial control that TOTAL SLEEP TIME was matched between arms (4 h 48 min vs 4 h 45 min; men-only P=0.30) and caloric intake was equivalent (P>0.115), which is exactly what is needed to isolate circadian misalignment from sleep loss. Concerns: n=26 total (13 per arm) and the headline result is a MEN-ONLY subgroup of that, whose size is not reported in the paper; the SI comparison is significant (P=0.011) but the disposition-index comparison is not (P=0.124), so the 'doubling' does not carry through to the composite diabetes-risk index; and participants OVERATE substantially in both arms (~4,060 kcal/24 h) with significant weight gain, so this is not an isocaloric protocol."
funding: "Not extracted from the retrieved text (University of Chicago Sleep Metabolism and Health Center; funder left unstated rather than guessed)."
notes: |
  *** THE DECISIVE EXPERIMENTAL EVIDENCE THAT TIMING MATTERS INDEPENDENTLY OF DURATION, AND IT IS
  MALE-SPECIFIC. *** Both arms slept the same amount (about 4 h 45-48 min actual sleep on a 5 h TIB
  schedule for 8 days). The only difference was that one arm's bedtimes were delayed by 8.5 h on 4 of
  the 8 days. In men, that timing manipulation alone nearly DOUBLED the fall in insulin sensitivity,
  from -32% to -58% (P=0.011), and more than doubled the rise in hsCRP, from +64% to +146% (P=0.049).

  WHY THIS IS THE MOST IMPORTANT MECHANISTIC RECORD FOR OUR SUBJECT:
  * He is MALE, and the effect was demonstrated in men (the authors restricted the main analysis to
    men because of too few women).
  * His exposure is not merely short sleep - it is short weekday sleep plus a shifted weekend sleep
    schedule, i.e. exactly the "irregular bedtimes at constant sleep debt" structure this study
    manipulated. The misaligned arm delayed bedtimes on 4 of 8 days; the subject delays his sleep
    timing on 2 of every 7 days.
  * It converges with FOUR other records in this shard: yuan2021 (restriction without circadian
    disruption was glycaemically null), depner2019 (weekend catch-up itself delayed circadian phase),
    chen2021 (later weekend sleep midpoint associated with higher HOMA-IR at the same duration), and
    liu2025 (evening chronotype OR 1.59 > short-sleep OR 1.18). Five designs - two randomised, one
    within-lab comparison, two observational - all point the same way.

  DISTANCE FROM OUR SUBJECT'S EXPOSURE:
  * Dose: 5 h TIB for 8 CONSECUTIVE days, more severe and more sustained than the subject's 5-night
    weekday blocks.
  * Misalignment intensity: 8.5 h bedtime delays are FAR larger than a typical weekend lie-in of 2-3 h.
    So this study over-states his circadian exposure substantially - probably by a factor of 3 or more.
    Do NOT transport the -58% figure; transport the RATIO (misalignment roughly doubles the harm at
    equal sleep) as a qualitative amplification factor and apply heavy shrinkage.
  * Overeating: both arms consumed ~4,060 kcal/24 h and gained weight significantly, so part of the
    metabolic deterioration in BOTH arms reflects acute positive energy balance rather than sleep or
    circadian effects alone. This inflates both point estimates.
  * Age: "26 healthy adults", no age reported in the retrieved abstract or the extracted text, so
    age_mean/age_range are null and adolescent_match is fair_adult. Treat the age match as UNVERIFIED.

  ALSO NOTE THE ALIGNED ARM'S OWN NUMBER: -32% SI after 8 days of 5 h with FIXED nocturnal bedtimes.
  That is substantially larger than buxton2010's -20% (IVGTT) / -11% (clamp) after 7 nights of 5 h.
  The likely explanations are the extra day of exposure and the large caloric excess here. The spread
  between -11% and -58% across T1 studies at nominally similar doses is the single clearest signal
  that this literature's effect magnitudes are not tightly determined, and the downstream posterior
  should be wide accordingly.
