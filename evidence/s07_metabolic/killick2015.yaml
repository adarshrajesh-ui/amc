rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomised in-laboratory crossover with period/carryover effects explicitly excluded using Friday baseline values - methodologically careful. Main weaknesses: an incomplete-block design in which each man did only 2 of 3 conditions, so the key 10h-vs-6h contrast rests on n=8; men only; the OGTT-minimal-model insulin sensitivity is less definitive than a clamp; and the 45% figure is a ratio on a small-n estimate so it is fragile even though the CI excludes null."
funding: "Not stated in the retrieved text (Woolcock Institute of Medical Research / University of Sydney; funder left unstated rather than guessed)."
notes: |
  *** BEST EXPOSURE-HISTORY MATCH IN THE ENTIRE SHARD, AND THE KEY REVERSIBILITY ESTIMATE. ***
  Unlike every other experimental record here, the participants were NOT normal sleepers put under
  acute restriction. They were men who had ALREADY been living the subject's exact pattern -
  lifestyle-driven weekday restriction with regular weekend catch-up - for a mean of 5.1 years. The
  subject has been doing it for 3 years. This is as close to a matched population as this literature
  offers, and it is the only study that asks the subject's actual question: given that I have already
  been doing this for years, does catching up help?

  ANSWER IT GIVES: yes, and quickly. Three nights of 10 h TIB improved insulin sensitivity by 45%
  (absolute 8.57 x 10^-4 /min/(uU/ml), 95% CI 1.1-16.1, P=0.03) relative to continuing at 6 h, with
  concordant improvements in HOMA-IR, QUICKI, fasting insulin and C-peptide across three separate
  measures. So the insulin-resistance component of the subject's exposure is substantially and
  rapidly reversible.

  DISTANCE FROM OUR SUBJECT'S EXPOSURE:
  * Habitual exposure: weekday 6.22 h/night for 5.1 years with weekend extension of 37.4%. The
    subject: weekday 5-6 h for 3 years with weekend 7-8 h (an extension of roughly 20-45%). Very
    close on both dose and pattern; the subject's weekday dose is slightly MORE severe and his
    history slightly shorter.
  * Recovery dose: 10 h TIB x 3 nights. The subject typically got 7-8 h x 2 nights, occasionally
    10-11 h. So the subject's usual weekend is a WEAKER recovery dose than the one that produced the
    45% improvement here. Do not assume he realised the full 45%.
  * The comparator arm (continued 6 h) is the right comparator - continuing the habit - rather than
    an artificial sleep-extension referent. This is a major advantage over spiegel1999/buxton2010.
  * AGE: mean 28.6 y, about 10 y older than the subject, and the cohort deliberately included an
    older subgroup. Hence fair_adult. BUT the glucose-AUC benefit was significant only in the
    YOUNGER men, which if anything suggests the benefit transports to, or is larger in, an
    18-year-old. Treat that as encouraging but underpowered (subgroup analysis, small n).
  * BMI 26.0 kg/m2 on average, i.e. mildly overweight, whereas the subject's BMI is unknown to this
    shard. If the subject is lean, insulin sensitivity is likely higher at baseline and the
    absolute-units effect may not transport directly.

  RECONCILIATION WITH ness2019 AND depner2019 - these are NOT contradictory:
    - killick2015: 3 nights of 10 h in chronically restricted men -> insulin sensitivity improves 45%.
    - ness2019: 2 nights of 10 h after acute 5-night restriction -> disposition index still suppressed.
    - depner2019: 1 weekend of ad libitum recovery, then restriction RESUMES -> deficit persists.
  Read together, they imply the recovery time constant is on the order of DAYS, that 2 nights is not
  enough and 3 nights of a saturating dose achieves most of the benefit, and that the benefit is
  erased if the restriction simply resumes. The determinant of the subject's forward risk is
  therefore whether the exposure CONTINUES, not the accumulated 3 years.
