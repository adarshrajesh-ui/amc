rob:
  tool: MR-STROBE
  judgement: low
  notes: "Very large, well-powered GWAS (n=446,118) with independent CHARGE replication (n=47,180) and, unusually, validation of the self-reported exposure against ACCELEROMETER-derived sleep measures in n=85,499 - which materially strengthens the instrument's construct validity relative to purely self-report-based MR. MR sensitivity analyses included leave-one-out and instruments restricted to BMI-, insomnia- and lifestyle-adjusted GWAS signals. Principal limitation for our purposes: the T2D MR is a secondary analysis reported in one sentence with estimates confined to unretrieved supplementary files, so its power cannot be assessed, and the paper is not designed as a T2D MR."
funding: "Not extracted from the retrieved full text (large multi-centre consortium paper; funder left unstated rather than guessed)."
notes: |
  ROLE IN THIS SHARD: this is the GWAS that SUPPLIES the instruments used by gao2020 and much of the
  downstream sleep-MR literature, and it independently reports a null MR for sleep duration -> T2D.
  It is the source of the genetic instrument, so its own null carries weight.

  *** IMPORTANT NON-INDEPENDENCE WARNING. *** dashti2019 and gao2020 share the UK Biobank exposure
  GWAS (this very paper) and the DIAGRAM outcome GWAS. bos2019 uses MAGIC glycaemic traits, so it is
  partially independent on the outcome side but overlaps on the exposure side. The three MR nulls are
  therefore roughly ONE-AND-A-HALF independent pieces of evidence, not three. Do not treat the
  triple-null as three-fold confirmation.

  THE MOST INTERESTING FINDING HERE IS THE ASYMMETRY IN GENETIC CORRELATION. LD-score regression
  found T2D genetically correlated with LONG sleep but NOT with SHORT sleep. Short sleep's genetic
  correlates were insomnia, neuroticism, smoking, depressive symptoms, waist circumference and
  waist-to-hip ratio, plus a negative correlation with years of schooling. Two readings, both
  relevant:
  1. It converges with gao2020 (insomnia causal, duration not) in locating the diabetes-relevant
     causal signal away from short sleep duration per se.
  2. It also shows precisely WHICH confounders would generate a spurious observational short-sleep/
     T2D association: smoking, neuroticism/depression, adiposity distribution and education/
     socioeconomic position are all genetically entangled with short sleep and all independently
     predict T2D. That is a concrete, evidence-based mechanism for the confounding that cappuccio2010
     flagged qualitatively, and it strengthens the case for discounting the observational RR.
  Note the long-sleep/T2D genetic correlation is also consistent with reverse causation on that limb -
  incipient metabolic disease causing longer sleep.

  RELEVANCE TO OUR SUBJECT: indirect. UK Biobank participants were recruited at roughly 40-70 y, so
  scored poor_midlife, and MR estimates lifelong genetic liability rather than a 3-year adolescent
  behavioural episode. This record should be used to widen uncertainty on the long-run risk estimate
  and to identify the confounding structure, NOT to produce a point estimate for the subject.
