rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "By far the largest synthesis available (53 studies, 1.48 M participants), PROSPERO-registered (CRD42023457631), PRISMA-followed, with funnel plots, Egger tests, trim-and-fill and extensive subgroup analyses. Weaknesses: it pools ORs/RRs/HRs from studies of MIXED design - the inclusion criterion is 'observational studies', so cross-sectional studies contribute alongside prospective cohorts, which permits reverse causation and makes this LESS causally clean than shan2015 despite being far larger. Exposure remains self-reported. The reported short-sleep category boundary is stated inconsistently in the paper ('less than 7 h' in the results text vs 'short sleep (<=7 h)' in the methods), a real ambiguity in the source. Heavy overlap with shan2015 and cappuccio2010."
funding: "Not stated in the retrieved text (Ningbo University authorship; funder left unstated rather than guessed)."
notes: |
  ROLE IN THIS SHARD: the recency-and-precision update on the long-run risk estimate, and the source
  of the two most decision-relevant subgroup facts (male-specific OR, and the age gradient).

  ITS SHORT-SLEEP ESTIMATE OF 1.18 (1.13-1.23) SITS BETWEEN the derived shan2015 values for 6 h
  (1.09) and 5 h (1.19) - which is exactly where a '<7 h' category average should fall. The three
  meta-analyses are therefore quantitatively coherent:
    cappuccio2010  <=5-6 h : RR 1.28 (1.03-1.60)   [107,756 participants]
    shan2015       per 1 h : RR 1.09 (1.04-1.15)   [482,502 participants]
    liu2025        <7 h    : OR 1.18 (1.13-1.23)   [1,478,297 participants]
  The consistent reading is that habitual short sleep carries a roughly 10-20% relative excess of
  incident T2D per hour-ish of deficit, with the precision improving and the point estimate drifting
  DOWN as the evidence base grows - the classic signature of early-literature inflation.

  *** DE-DUPLICATION: DO NOT POOL WITH shan2015 OR cappuccio2010 AS INDEPENDENT. *** Search window
  runs to October 2024 and therefore SUBSUMES both earlier reviews' primary studies.

  *** THE AGE GRADIENT IS THE MOST IMPORTANT THING IN THIS RECORD FOR OUR SUBJECT. *** The
  association was strongest at ages 30-39 and attenuated monotonically with age thereafter, becoming
  minimal in men over 60. Two implications:
  1. It undercuts any assumption that the RR should be shrunk toward null for a young person. If
     anything the age trend points the other way.
  2. But there is NO stratum below 30, and none of the 53 studies followed adolescents to incident
     T2D. So the youngest measured point is still 12 years older than our subject. The extrapolation
     to 18 is an assumption, and it is THE single largest transportability gap in this shard.
  It also gives a directional hint that the men-aged-40-49 estimate (OR 1.31 [1.17-1.48] for
  extremely short sleep) may be nearer the relevant magnitude for a young man than the pooled 1.13.

  CHRONOTYPE SIGNAL: evening chronotype carried OR 1.59 (1.18-2.13), LARGER than short sleep itself,
  and morning chronotype was protective (OR 0.82 [0.80-0.85]). Combined with yuan2021's experimental
  finding that circadian disruption rather than sleep loss drove the glycaemic effect, this is
  convergent observational and experimental evidence that TIMING is at least as important as
  DURATION. The subject's exposure includes both.

  INTERACTION SIGNAL: poor sleep quality plus short duration gave OR 1.69 (1.11-2.58), and poor
  quality alone OR 1.50 (1.30, 1.72) - larger than duration effects. This shard has no information on
  the subject's sleep QUALITY, only duration; if his sleep was fragmented as well as short the
  relevant estimate would be higher.
