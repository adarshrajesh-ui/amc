rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Within-subject, no blinding possible, n=11, single site, men only. CRITICAL DESIGN ISSUE: the comparator is the END of a 6-night 12 h-TIB sleep-EXTENSION period, not habitual or 8 h sleep. The contrast is therefore 4 h vs 12 h (an 8 h/night gap), which inflates the apparent effect of 'short sleep' relative to any 8 h referent. Order was fixed (debt then recovery), not randomised, so period/order effects are not controlled."
funding: "NIH (National Institutes of Health); University of Chicago"
notes: |
  DISTANCE FROM OUR SUBJECT'S EXPOSURE - do not over-extrapolate:
  * Dose: study 4 h TIB. Subject ~5-6 h on weekdays. Study dose is 1-2 h/night MORE severe.
  * Referent: study referent is 12 h TIB (deliberate sleep extension / "fully rested"). Subject's
    own comparator is a normal 7-9 h adolescent requirement. The published 4-vs-12 h contrast spans
    ~8 h/night; the subject's weekday-vs-requirement gap is ~2-3 h/night. On a linear-in-dose
    reading this study's contrast is roughly 3-4x the subject's, so the 40% figure must NOT be
    transported directly.
  * Duration: 6 consecutive nights, no weekend recovery. Subject had 2 recovery nights every 7 for
    3 years. This study cannot speak to the weekday/weekend cycling pattern at all.
  * Setting: inpatient, constant recumbency, controlled diet (a fixed carbohydrate diet was used),
    which removes the appetite/intake pathway that operates in the subject's real life.
  * AGE: the retrievable text says only "11 young men" - no mean age and no age range are given in
    the abstract, and the full text is paywalled, so age_mean and age_range are left null rather
    than guessed. "Young men" is why adolescent_match is good_young_adult rather than fair_adult,
    but the downstream model should NOT age-weight this record on a numeric age.
  * DIRECTION OF THE INSULIN-SENSITIVITY EFFECT: this study did NOT show a significant fall in
    insulin sensitivity (SI). Buxton 2010 states the SI reduction was "nonsignificant". The 1999
    result is primarily a glucose-tolerance / glucose-effectiveness / insulin-secretion finding.
    Downstream models must not label Spiegel 1999 as evidence of reduced insulin sensitivity.
  * RECOVERY PHASE (task item 1 asks for the 12 h values explicitly): the design is 4 h TIB x 6
    nights, then 12 h TIB x 6 nights, and the paper's published comparison IS debt-versus-recovery.
    Verbatim from the abstract: "We compared the sleep-debt condition with measurements taken at the
    end of a sleep-recovery period when participants were allowed 12 h in bed per night for 6
    nights." So there are no separately reported "recovery values" to extract - the recovery
    condition is the REFERENT against which every effect in this record is measured, and the
    fully-rested state is by construction the zero point. What the study therefore establishes is
    that the carbohydrate-metabolism abnormalities are ABSENT after 6 nights of 12 h TIB, i.e. they
    are reversible on a roughly one-week timescale given a very large recovery dose. Two limits on
    that inference: (a) the recovery dose (12 h/night for 6 nights) is far larger than anything the
    subject ever obtained, and (b) because recovery was measured only at the END of the 6 nights,
    the study gives NO information about how quickly within that week the reversal occurred. For
    resolved recovery time-courses use ness2019 (2 nights of 10 h: lipids recover, disposition index
    does NOT), depner2019 (weekend recovery insufficient), and buxton2012_fd (9 days: full
    normalisation).
