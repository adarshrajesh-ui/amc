rob:
  tool: MR-STROBE
  judgement: some_concerns
  notes: "Well-specified two-sample MR on three outcomes (diabetes, fasting glucose, HbA1c) using large consortium data, with the useful addition of a genuinely adolescent observational arm. Principal concern is POWER on the diabetes outcome: the CI for the per-hour OR runs from 0.64 to 1.13, which is wide enough to contain the entire observational effect, so the null is uninformative for adjudicating the observational estimate. The continuous glycaemic-trait nulls (FG, HbA1c) are much tighter and therefore more informative. The observational arm reports no point estimates in the abstract, and the sex-interaction p of 0.05 is borderline and would not survive multiplicity correction across three outcomes."
funding: "Not retrievable from the abstract (University of Hong Kong / CUNY authorship; funder left unstated rather than guessed)."
notes: |
  *** THIS IS THE MR STUDY GAO 2020 CITES AS 'Wang et al. (2019) ... found that they were not causally
  related', and it is the third independent MR null on sleep duration and diabetes. *** It also
  contains the ONLY glycaemic measurement at our subject's exact age anywhere in this shard.

  THE MOST IMPORTANT ARITHMETIC IN THIS RECORD - IT REFRAMES THE WHOLE MR 'GAP':
  Published as OR 0.85 (0.64-1.13) per hour MORE sleep. Inverted to the observational convention of
  per hour LESS sleep, that is OR 1.18 (0.89-1.56). Now compare:
      liu2025   observational, <7 h vs 7-8 h      OR 1.18 (1.13-1.23)
      shan2015  observational, per 1 h below 7 h  RR 1.09 (1.04-1.15)
      wang2019  MR, per 1 h less sleep            OR 1.18 (0.89-1.56)   <- SAME POINT ESTIMATE
      gao2020   MR, short sleep binary            OR 1.15 (0.96-1.38)   <- NEARLY THE SAME
  The two MR point estimates for short sleep are 1.18 and 1.15; the two observational estimates are
  1.18 and 1.09. THE MR AND OBSERVATIONAL POINT ESTIMATES AGREE ALMOST EXACTLY. The MR studies are
  reported as "null" purely because their confidence intervals are 3-5 times wider. This is the single
  most important nuance in this shard's causal section, and it is routinely misreported: the correct
  statement is NOT "MR refutes the observational association" but "MR neither confirms nor excludes it,
  while reproducing its magnitude."

  THE COUNTERVAILING EVIDENCE, WHICH MUST BE STATED ALONGSIDE: the continuous glycaemic-trait MR
  estimates here ARE reasonably precise and they ARE null and biologically trivial (fasting glucose
  -0.032 mmol/L per hour, CI -0.126 to 0.063; HbA1c -0.022 percentage points per hour, CI -0.069 to
  0.024). Combined with bos2019's null MR on glycaemic traits and gao2020's precise continuous-duration
  null (OR 1.00), the fair summary is:
    - MR CANNOT exclude a ~1.1-1.2 per-hour effect on DIAGNOSED diabetes;
    - MR DOES largely exclude a material lifelong causal effect of sleep duration on CONTINUOUS
      glycaemia in the general population;
    - and MR DOES support a causal effect of INSOMNIA (gao2020, OR 1.14, p~1e-8).

  THE AGE-17.5 OBSERVATIONAL ARM: the 'Children of 1997' birth cohort measured sleep duration and
  glycaemia at approximately 17.5 years - the only measurement at our subject's exact age in this
  shard. Unfortunately the abstract publishes no point estimates, only that the FG association
  differed by sex (p interaction 0.05) and the HbA1c association did not. So it establishes that
  age-17-18 data EXIST but contributes no usable magnitude. Retrieving that cohort's sex-stratified
  betas is the highest-value follow-up for closing this shard's age gap. adolescent_match is scored
  'mixed' because the record combines adult GWAS consortia with an age-17.5 cohort.

  NON-INDEPENDENCE: uses DIAGRAM (shared with gao2020 and dashti2019) and MAGIC (shared with bos2019).
  The four MR records in this shard rest on substantially overlapping consortium data and must not be
  pooled as four independent nulls. n recorded as 159,208 = DIAGRAM 26,676 cases + 132,532 controls.
