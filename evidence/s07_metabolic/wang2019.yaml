    value: -0.162519
    se: 0.145027
    ci: [-0.446771, 0.121733]
    conversion_formula: "Published OR 0.85 per hour of sleep (95% CI 0.64 to 1.13). log_or = ln(0.85) = -0.162519; se = (ln(1.13)-ln(0.64))/3.92 = (0.122218-(-0.446287))/3.92 = 0.145027. Back-check: exp(-0.162519 +/- 1.96*0.145027) = 0.640-1.129, reproducing the published CI. SIGN: negative = more sleep, lower diabetes odds. INVERTED to a per-hour-LESS-sleep scale for comparability with shan2015: OR = 1/0.85 = 1.18, 95% CI 1/1.13 to 1/0.64 = 0.885 to 1.563. ci field is on the LOG scale as published (per hour MORE sleep)."
    from_figure: false
    inferred_from_ci: false
    direction_note: "negative = protective effect of MORE sleep, i.e. HARM from less sleep. NULL (CI crosses zero). But note the INVERTED point estimate, OR 1.18 per hour LESS sleep, is almost exactly the observational estimate from liu2025 (1.18) - so this null is a POWER failure, not a contradiction."
