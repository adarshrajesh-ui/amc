rob:
  tool: Newcastle-Ottawa
  judgement: low
  notes: 'Best-in-class design for this question: LONGITUDINAL (2.5 years, assessments every ~6 months),
    OBJECTIVE exposure (actigraphy plus laboratory salivary DLMO), spanning ages 9-19 in two cohorts.
    Limitations: n=94 total, US single-site, descriptive analysis with no formal effect sizes, and the
    authors emphasise large individual variability in trajectories.'
funding: NIH (see PLOS competing-interests statement)
notes: 'THE AUTHORITATIVE SOURCE FOR ADOLESCENT PHASE DELAY, with melatonin-based rather than questionnaire-based
  phase, and it lands squarely on our subject''s age band: the LARGEST circadian delay in the older cohort
  occurred between ages 17 and 19. REPORTING REALITY AGAINST THE TASK BRIEF: I was asked for ''quantitative
  phase-delay estimates BY PUBERTAL STAGE''. In the best available longitudinal data, pubertal stage adds
  essentially NOTHING beyond chronological age (only a ~12 min effect, in the younger cohort only). The
  pubertal-staging framing derives from carskadon1993, which used a morningness-eveningness questionnaire
  rather than measured phase and found the association in GIRLS only. So a Tanner-stage-indexed phase-delay
  estimate for an 18-year-old male is not supported; age-indexed estimates are. All effects have se=null
  because the paper reports trends and approximations rather than coefficients with dispersion.'
