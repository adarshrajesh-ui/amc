rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: Population-representative birth cohort with clinically ASSESSED outcomes (not self-report) and
    shift workers excluded; but the SJL-outcome analysis is cross-sectional at age 38, and associations
    are sensitive to smoking/SES adjustment.
funding: US NIA/NICHD and UK MRC (NIHPA author manuscript)
notes: STRONGEST 'ADJUSTED FOR DURATION' EVIDENCE ALONGSIDE wong2015, and with the added value that SJL
  and sleep duration were UNCORRELATED in this cohort (r=-0.04), so the adjustment is not fighting collinearity.
  All effects reported here are from the primary model 'Controlling for sex, chronotype and sleep duration'.
  Age 38 assessment, so adolescent_match is poor_midlife. Mean SJL 0.88 h is roughly half of our subject's
  estimated ~1.75 h, so applying these coefficients requires linear extrapolation to about twice the cohort
  mean.
