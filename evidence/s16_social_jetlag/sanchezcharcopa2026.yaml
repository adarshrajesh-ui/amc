rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: 'Strengths: OFFICIAL SCHOOL RECORDS for the outcome (not self-reported grades), age-matched,
    and adjusted for overall sleep duration. Weaknesses: cross-sectional; single Spanish region; SJL proxied
    by bedtime difference only, not full midsleep.'
funding: null
notes: 'BEST AVAILABLE PER-HOUR, DURATION-ADJUSTED ACADEMIC EFFECT for an adolescent population, and it
  independently reproduces the ~2 h threshold seen for depression in sun2025. Exposure caveat: SJL here
  is the absolute weekend-weekday BEDTIME difference, which is closer to Jankowski''s sleep-debt-corrected
  SJLsc than to the standard midsleep SJL (roenneberg2019 notes SJLsc reduces to the sleep-onset difference).
  It therefore isolates TIMING more cleanly than duration-contaminated midsleep SJL, which strengthens
  its use as misalignment-specific evidence.'
