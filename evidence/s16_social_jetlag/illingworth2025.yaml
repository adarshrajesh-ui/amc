notes: SECOND NORMATIVE ANCHOR, and the one with a usable SD (1.117 h), which lets the modeller place
  an individual as a z-score. Reports the SJL peak ~2.1 h at age 15, i.e. ~1.2 h LOWER than randler2019's
  3.30 h peak at age 16. The two studies used different populations and self-report instruments; I report
  both rather than choosing.
