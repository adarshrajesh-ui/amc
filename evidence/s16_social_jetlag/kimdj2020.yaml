notes: 'THE MOST DIRECT OBSERVATIONAL COUNTERWEIGHT TO depner2019, because it addresses the SAME OUTCOME
  DOMAIN (metabolic) in the SAME EXPOSURE GROUP (chronic short sleepers) and reaches the OPPOSITE conclusion.
  Reconciliation: depner2019 measures acute insulin sensitivity after a single simulated weekend under
  laboratory misalignment, whereas this measures prevalent metabolic syndrome in people habituated to
  the pattern over years. Acute glycaemic disruption and long-run metabolic-syndrome prevalence need not
  agree. se=null throughout because no ORs appear in the abstract; population is midlife, so transportability
  to our subject is poor.'
