rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: Nationally representative and EXACTLY age-matched (16-24), with inverse-probability-weighted
    causal-inference estimation and adjustment for weekday sleep duration AND midpoint. But cross-sectional,
    so reverse causation is fully open; the depression outcome is a SINGLE self-report item ('sad or depressed'
    daily), which is a crude measure; and no CI is given in the abstract.
funding: null
notes: 'THE BEST AGE-MATCHED EVIDENCE THAT CATCH-UP IS PROTECTIVE FOR MOOD, and the most transportable
  single record in the protective column: the sample IS late adolescents and young adults, and the analysis
  adjusts for exactly the confounders that would otherwise explain the effect (weekday duration and weekday
  midpoint). se=null because the abstract reports only ''41 % lower odds'' with no interval. The single-item
  depression outcome and cross-sectional design mean this should not outweigh the experimental metabolic
  evidence; it applies to a DIFFERENT outcome domain, which is precisely how I resolve the tension.'
