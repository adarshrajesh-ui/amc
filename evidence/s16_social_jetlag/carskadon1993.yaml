  notes: 'Historically important but methodologically limited for the present purpose: cross-sectional,
    questionnaire-based phase PREFERENCE rather than measured circadian phase, self-reported pubertal
    status, and sixth graders only (ages ~11-13), far younger than our subject.'
funding: null
notes: 'THE ORIGIN OF THE ''PUBERTY DELAYS THE ADOLESCENT CLOCK'' CLAIM, included for provenance. n=458
  is the sum of the 183 boys and 275 girls stated in the abstract. IT DOES NOT SUPPORT A QUANTITATIVE
  PHASE-DELAY ESTIMATE BY PUBERTAL STAGE, and certainly not for an 18-year-old male: the outcome is a
  preference questionnaire, not phase; the effect reached significance only in girls; and the sample is
  11-13 year olds. Its real contribution is the negative control it reports: ''No relationship between
  M/E and psychosocial factors was found'', which is what originally licensed a biological rather than
  purely social explanation of adolescent lateness. Use crowley2014 for magnitudes.'
