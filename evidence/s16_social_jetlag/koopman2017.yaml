rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: Cross-sectional (despite being drawn from a cohort), so no temporality. Self-reported sleep timing.
    Age-stratified analysis was pre-specified as an effect-modification test. Adjusted for sleep duration
    AND BMI, which is what makes it useful here.
funding: null
notes: 'SATISFIES THE SHARD''S KEY REQUIREMENT: effects adjusted for SLEEP DURATION (and BMI), so the
  misalignment signal is separated from the duration signal. TASK-DESCRIPTION CORRECTION: the task expected
  this in JCEM or Diabetes Care; it is actually in Journal of Biological Rhythms 2017;32(4):359-368. TRANSPORTABILITY
  IS THE MAIN WEAKNESS: mean age 60.8 y (SD 6). Even the ''younger'' stratum is <61 y, i.e. middle-aged,
  not adolescent. The younger-vs-older contrast at least shows the effect is LARGER in the younger stratum,
  which argues against attenuating it for an 18-year-old, but this is an extrapolation across four decades
  of age.'
shard: s16_social_jetlag
