notes: 'LARGEST AVAILABLE SYNTHESIS FOR SJL-ADIPOSITY (43 studies, n=231,648) and the preferred anchor
  over roenneberg2012 per the shard''s evidence hierarchy. PUBLISHED-DATA DEFECT I am flagging rather
  than silently repairing: the abstract prints ''odds ratio: 1.20; 95%CI, 1.02, 1.140'', in which the
  point estimate (1.20) lies ABOVE its own upper confidence bound (1.140). This is arithmetically impossible.
  The upper bound is most plausibly a typo for 1.40, but I will not assume that, so I set se=null for
  that effect and leave the correlation-scale effects (which are internally consistent) as the usable
  ones. Also note these are unadjusted-to-partially-adjusted correlations, NOT sleep-duration-adjusted;
  use parsons2015 / wong2015 / sanchezcharcopa2026 for that.'
shard: s16_social_jetlag
