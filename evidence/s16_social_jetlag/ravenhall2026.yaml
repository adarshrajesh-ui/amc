notes: PREFERRED ANXIETY ANCHOR over lu2026. Same population, larger n (235,526 vs 164,529), continuous
  rather than dichotomised exposure, and an effect size (r=0.06) that is an order of magnitude more modest
  than lu2026's OR of 1.87. Where the two conflict, the correlation-scale estimate from the larger review
  is the more defensible.
