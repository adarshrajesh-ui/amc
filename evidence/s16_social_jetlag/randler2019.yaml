rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: Very large (n=18,323) but cross-sectional and self-report; single region of Germany (SW Germany),
    so absolute values may not transport. Age-resolution and sample size make it the best available age-specific
    SJL norm.
funding: null
notes: PRIMARY AGE-SPECIFIC NORMATIVE ANCHOR for this shard. No SD or CI for the age-16 peak is given
  in the abstract and full text is paywalled (Unpaywall is_oa=False), so se=null for all three effects.
  Gender differences in SJL were non-significant, so the value can be applied to a male subject. Note
  this anchor (3.30 h) is substantially HIGHER than illingworth2025 (2.12 h peak); see jetlag_summary.md
  for how I reconcile them.
shard: s16_social_jetlag
