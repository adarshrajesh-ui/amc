rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: Objective computerized attention outcomes rather than self-report, decent size, and adjusted
    for weekday sleep duration and depressed mood. Cross-sectional; catch-up sleep is explicitly interpreted
    by the authors as a MARKER of weekday insufficiency rather than as a causal exposure, so the harm
    may be residual confounding by sleep debt.
funding: null
notes: 'DOUBLY VALUABLE. First, it supplies the normative anchor that matches our subject almost exactly
  (weekday 5.70 h, weekend 8.40 h, catch-up 2.70 h, age 17.3), letting me say his pattern is TYPICAL of
  a Korean high-school student rather than extreme. Second, it is harmful-column evidence for COGNITION
  specifically, and it survives adjustment for weekday sleep duration. INTERPRETIVE CAUTION the authors
  themselves raise: ''Increased weekend catch-up sleep as an indicator of insufficient weekday sleep is
  associated with poor performance''. They read catch-up as a PROXY for sleep debt, not as a cause of
  the deficit. The modeller should not double-count this against a separate weekday-restriction cognitive
  effect.'
shard: s16_social_jetlag
