notes: 'INCLUDED FOR DESIGN VALUE, NOT MAGNITUDE. Every effect here is a placeholder with se=null because
  the paper is paywalled and the PubMed abstract text is truncated mid-sentence exactly where the coefficient
  would be. What it contributes is the dissociation the modeller needs: SJL predicted grades but sleep
  DURATION and sleep DEBT did not, the association vanished when the imposed schedule was removed, and
  the penalty was specific to morning testing. Use sanchezcharcopa2026 for the actual per-hour magnitude.'
