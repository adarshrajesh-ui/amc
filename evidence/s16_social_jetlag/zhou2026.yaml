notes: 'THE MOST AGE-APPROPRIATE ADIPOSITY SYNTHESIS FOR THIS SUBJECT (children and adolescents only).
  Its central message is deflationary: the SJL-adiposity associations in young people are small and do
  not survive adjustment for study quality. This should pull the modeller''s SJL-specific adiposity increment
  toward zero for a 16-19 year old, in tension with the adult-dominated arab2024/bouman2023 estimates.'
