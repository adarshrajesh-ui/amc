notes: 'KEY FOR THE TENSION IN THIS SHARD. The originators state that free-day recovery sleep is not itself
  the cause: ''it is pivotal to emphasize that SJL and its related outcomes are rather a consequence of
  constraints imposed by social clocks on workdays than caused by free-day recovery sleep.'' They also
  note Jankowski''s sleep-debt-corrected SJLsc, which after simplification equals the absolute difference
  in SLEEP ONSET between free and work days. Also: ''most studies investigating the associations between
  SJL and health are cross-sectional.'''
