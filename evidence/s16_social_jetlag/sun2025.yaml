notes: 'PROVIDES THE DOSE THRESHOLD THAT MATTERS MOST HERE: depression risk is elevated only above ~2
  h of SJL (OR 1.44), and is essentially null at 1-2 h (OR 1.05, CI touching 1.00). Our subject''s central
  SJL estimate (~1.75 h) sits in the null band, with his occasional long-weekend excursions (~3.25-3.5
  h) crossing into the elevated band. The authors report the >2 h finding as robust to sensitivity analysis.'
