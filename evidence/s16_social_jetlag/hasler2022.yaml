rob:
  tool: RoB2
  judgement: some_concerns
  notes: Counterbalanced within-subject experimental manipulation in ADOLESCENTS with melatonin-verified
    phase and actigraphy, adjusted for total sleep time. Small (n=25); the reward-anticipation finding
    did not survive multiple-comparison correction; neural outcomes are surrogates, not clinical endpoints.
funding: null
notes: 'THE ONLY EXPERIMENTAL CIRCADIAN-MISALIGNMENT STUDY I FOUND IN ADOLESCENTS, and it directly simulates
  our subject''s exposure: the ''misaligned'' arm mimics school-year sleep times and the ''aligned'' arm
  mimics summer sleep times, which is precisely the weekday-versus-weekend contrast that defines social
  jetlag. It therefore supplies the age-appropriate causal link that the metabolic experiments (all in
  adults, all at 8.5-12 h misalignment) cannot. Its value is QUALITATIVE ONLY: no effect sizes are extractable
  from the abstract, so both effects are direction-only placeholders. The authors'' own framing: ''circadian
  misalignment analogous to that resulting from school schedules may have measurable impacts on healthy
  adolescents'' reward processing and inhibition of prepotent responses.'''
shard: s16_social_jetlag
