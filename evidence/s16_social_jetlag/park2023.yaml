rob:
  tool: ROBINS-I
  judgement: moderate
  notes: 'The strongest observational design in this shard for the catch-up question: 6 waves of panel
    data with INDIVIDUAL FIXED EFFECTS, which removes all stable confounding. Remaining concerns: self-reported
    sleep and BMI, time-varying confounding not addressed, and no CIs reported in the abstract.'
funding: null
notes: 'THE MOST IMPORTANT RECORD FOR ADJUDICATING THE CATCH-UP TENSION, because it applies within-person
  identification to the exact question. Its result is that the protective cross-sectional association
  for catch-up REVERSES SIGN when stable individual differences are removed, and it quantifies the confounding
  in the wider literature at 62% for BMI. That is strong evidence that the many Korean cross-sectional
  ''catch-up protects against obesity'' findings (lee2025, choi2023) are substantially confounded. The
  authors'' own nuanced conclusion, which is the position I adopt: ''WCS duration is protective only for
  those who are most sleep deprived.'' Note also the magnitudes: weekday short sleep moves BMI by 0.203,
  catch-up by 0.021, so the duration effect is about an order of magnitude larger than the catch-up effect
  in either direction.'
shard: s16_social_jetlag
