funding: null
notes: 'PROVIDES THE U-SHAPE INDEPENDENTLY OF kimcasement2026, in an adolescent sample 145x larger and
  in a different country, and it is the best available match for our subject''s operationalised exposure
  because a RATIO is exactly what his pattern specifies. OUR SUBJECT''S RATIO: typical 7.5/5.5 = 1.36
  (below the harmful >=1.50 threshold); on 10-11 h weekend nights 10.5/5.5 = 1.91 (well above it). So
  the same subject moves between the safe and harmful bands week to week. The authors'' conclusion is
  the balanced one: ''Appropriate weekend CUS may benefit adolescents'' mental health.'' All effects are
  direction-only (se=null): the abstract reports significance without ORs for these specific strata.'
