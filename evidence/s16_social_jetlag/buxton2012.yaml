rob:
  tool: RoB2
  judgement: some_concerns
  notes: Over 5 weeks of continuous inpatient control, the longest such protocol available, with measurement
    at matched circadian phase. But small; and by design it CONFOUNDS restriction with disruption, so
    unlike leproult2014 it cannot separate the two.
funding: null
notes: 'IMPORTANT LIMITATION TO STATE PLAINLY: despite being the study most often cited for ''misalignment
  harms metabolism'', this protocol applied restriction AND disruption TOGETHER with no restriction-only
  arm, so it CANNOT isolate the independent effect of misalignment. For that, leproult2014 is the correct
  citation. Its distinctive contribution is the RECOVERY result: 9 days of adequate sleep with stable
  re-entrainment normalised the metabolic measures. n=21 is taken from ''Healthy adults'' reported in
  the abstract; the abstract text is partly truncated in the PubMed record and I did not retrieve the
  full text, hence no magnitudes.'
