notes: 'THE RECORD THAT DISSOLVES MOST OF THE APPARENT CONTRADICTION IN THIS SHARD. Catch-up sleep is
  not monotonically good or bad: the association is U-SHAPED with an optimum at MODERATE catch-up (<=2
  h), and harm at BOTH extremes. The protective and harmful literatures are therefore largely sampling
  opposite ends of the same curve. APPLIED TO OUR SUBJECT: his typical weekend catch-up is 1-3 h of DURATION,
  straddling the top of the beneficial band, while his occasional 10-11 h weekend nights (4.5-5.5 h of
  catch-up) fall clearly into the ''excessive'' arm. Authors'' framing: a ''sweet spot ... and underscore
  risk of large sleep variability.'''
