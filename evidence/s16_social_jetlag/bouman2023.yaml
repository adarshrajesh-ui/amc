rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: 68 studies, quality-stratified, prospectively registered search. But I2 reaches 100% for BMI
    and HbA1c and sensitivity analyses did not reduce it; authors rate the level of evidence as low and
    mostly cross-sectional.
funding: null
notes: 'The most complete synthesis of SJL against metabolic-syndrome components. Its dissociation matters
  for the model: SJL tracks CONTINUOUS intermediate markers (BMI, waist, HbA1c, SBP) but NOT the clinical
  endpoints (metabolic syndrome, T2D, obesity as a category). Authors'' own summary: ''These findings
  should be interpreted with caution as the level of evidence is low and mostly based on cross-sectional
  data.'' n not extractable from the abstract.'
