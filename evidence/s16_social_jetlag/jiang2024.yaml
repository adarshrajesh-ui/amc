funding: null
notes: 'THE ONLY PROSPECTIVE ADOLESCENT SJL-ADIPOSITY EVIDENCE I FOUND, and it is DIRECTLY RELEVANT AND
  DEFLATIONARY FOR OUR SUBJECT: our subject is MALE, and the abstract states ''no significant associations
  among boys were observed''. Combined with zhou2026 (paediatric associations vanish after quality adjustment),
  the adolescent-specific, sex-specific evidence for an SJL-adiposity effect in a teenage BOY is weak.
  No numeric betas or CIs are given in the abstract and the full text is paywalled, so I recorded the
  adiposity effect as a direction-only placeholder with se=null rather than invent an estimate.'
