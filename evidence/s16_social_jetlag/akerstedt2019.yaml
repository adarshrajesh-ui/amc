rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: 'Large (43,880), 13-year record-linked follow-up, extensive confounder adjustment, and robust
    to further adjustment for sleep quality, snoring, medication, napping, feeling rested, coffee, subjective
    health and work demand. Key weaknesses: sleep measured ONCE at baseline by self-report, so no information
    on whether the pattern persisted; and reverse causation from undiagnosed illness cannot be excluded.'
funding: Stockholm Stress Center; AFA Insurance
notes: 'THE ANCHOR OF THE ''CATCH-UP IS PROTECTIVE'' POSITION, and the only mortality evidence available
  on this exposure pattern. The authors'' own reading: ''the results imply that short (weekday) sleep
  is not a risk factor for mortality if it is combined with a medium or long weekend sleep.'' WHY I REFUSED
  TO EMIT A NUMBER FOR THE KEY CELL: the SML point estimate and CI are presented only in Figure 4 (a forest
  plot). I attempted the Wiley PDF, the PMC PDF, the Europe PMC PDF endpoint and the Europe PMC supplementary-files
  archive (returned empty); all failed. Rather than digitise a figure or invent an SE I set value=0.0
  with se=null to encode the stated null, and the modeller should treat this as ''no detectable excess,
  precision unknown''. THREE CAVEATS THE MODELLER MUST CARRY. (1) Population is adults, largely midlife,
  and results were NULL in those aged >=65, so age modifies this. Extrapolating to an 18-year-old is a
  large leap and mortality over 13 years is nearly unmeasurable at that age. (2) The authors offer a deflationary
  alternative explanation: ''we cannot be sure that longer weekend sleep is a true compensation, rather
  than appetitive behaviour when the sleep opportunity is increased during the weekend.'' (3) In those
  aged >=65 the SML pattern was actually associated with HIGHER mortality (HR 1.38, 95% CI 1.00-1.89),
  so the protective reading is age-specific, not general.'
