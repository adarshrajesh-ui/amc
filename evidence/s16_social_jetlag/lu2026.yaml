notes: 'AGE-MATCHED SYNTHESIS (adolescents and young people, 14 studies, n=164,529). TWO CAUTIONS. (1)
  The published abstract sentence is garbled (''SJL was significantly and positively associated with depression
  significantly associated with increased odds of depression, with odds ratios of 1.12 ... and 1.87 ...,
  respectively''); the attribution of 1.12 to depression and 1.87 to anxiety follows the title and the
  stated order, but I could not confirm it against the full text, so treat the anxiety assignment as probable
  rather than certain. (2) The anxiety OR of 1.87 is far larger than ravenhall2026''s pooled SJL-anxiety
  correlation (r=0.06) in the same population, which is hard to reconcile; prefer ravenhall2026 for anxiety
  effect magnitude. Authors'' own GRADE: very low.'
