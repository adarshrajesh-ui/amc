funding: null
notes: 'SECOND INDEPENDENT DEMONSTRATION that in adolescents the cognitive/academic signal attaches to
  sleep TIMING rather than sleep DURATION. Sex-specific caveat that matters for our MALE subject: ''Results
  separated by sex/gender indicated that SJL may be more detrimental to girls'' performance, as it was
  negatively related to a greater number of cognitive abilities and GPA.'' Together with jiang2024 (adiposity
  effects in girls only, null in boys), there is a recurring pattern of SJL effects being weaker in males.'
