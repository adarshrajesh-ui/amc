notes: 'THE PAPER THE TASK ASKED FOR, BUT ITS REAL CONTENT DIFFERS FROM THE TASK''S FRAMING. The task
  asked for ''the BMI effect per hour of social jetlag with CI and sample size''. That per-hour coefficient
  is NOT in the main text: the per-unit BMI regression lives in Supplementary Table S1B, which I could
  not retrieve. What the main text does give is the logistic OR above with undocumented predictor scaling.
  SECOND AND MORE IMPORTANT DEVIATION: the SJL-BMI association is confined to participants who are ALREADY
  overweight (BMI>=25); it is null in the normal-BMI majority (n=43,308). The famous ''social jetlag causes
  obesity'' headline therefore does not straightforwardly apply to a lean or normal-weight 18-year-old.
  A formal ERRATUM exists (DOI 10.1016/j.cub.2013.04.011, Curr Biol 2013;23(8):737, Crossref-verified
  as update-to 10.1016/j.cub.2012.03.038). I could NOT retrieve the erratum''s content (Cell Press blocked
  the PDF), so I cannot confirm whether it touches Table 1. Treat these numbers as provisional. Arithmetic
  note on text extraction: the PDF renders the Unicode minus sign as ''2'', verified by ''r = 20.082''
  for a partial correlation that must be negative; I reconstructed signs accordingly and cross-checked
  every B against its printed OR via exp(B).'
