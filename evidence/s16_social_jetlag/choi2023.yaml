    without confidence intervals.
funding: null
notes: 'THIRD INDEPENDENT KOREAN ADOLESCENT DATASET (after lee2025 and choi/park) finding weekend catch-up
  PROTECTIVE against adiposity, here with measured rather than self-reported anthropometry. PUBLISHED-NUMBER
  CONCERN I am flagging rather than using: the abstract attributes a factor of 0.39 per 30-min increment
  to weekend sleep duration, which would imply a 61% risk reduction for half an hour of sleep. That is
  not credible as a per-increment relative risk and probably reflects a different scaling or a reporting
  error, so I recorded only the 0.93 sleep-extension figure and left se=null on both effects.'
