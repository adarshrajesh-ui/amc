rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: Cross-sectional with a severe outcome that is highly susceptible to reverse causation and to
    residual confounding by depression, and the abstract text in PubMed is truncated so covariates cannot
    be fully verified. Authors themselves interpret catch-up as a marker of weekday insufficiency.
funding: null
notes: 'HARMFUL-COLUMN PSYCHIATRIC EVIDENCE, and it CONFLICTS with carbone2026 (catch-up PROTECTIVE for
  depression in 16-24 y/o) and kimcasement2026 (catch-up PROTECTIVE for anxiety at <=2 h). The reconciliation
  I adopt: this study treats catch-up as continuous and unbounded, so its signal is dominated by the high-catch-up
  tail, which is exactly the harmful arm of kimcasement2026''s U. The authors say so: ''weekend catch-up
  sleep duration--which is an indicator of insufficient weekday sleep--might be associated with suicide
  attempts and self-injury''.'
shard: s16_social_jetlag
