rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: Large (12,434) and precisely age-matched to our subject, with the effect-modification analysis
    the shard asked for (restricted to those with insufficient weekday sleep). Cross-sectional; self-reported
    sleep; reverse causation plausible since adiposity affects sleep.
funding: null
notes: DIRECTLY CONTRADICTS THE SJL-ADIPOSITY LITERATURE IN THE SAME POPULATION, and that contradiction
  is the crux of this shard. Measured as weekend catch-up DURATION, more catch-up predicts LESS obesity
  in adolescents (OR 0.67), dose-dependently. Measured as social jetlag TIMING, more weekend-weekday discrepancy
  predicts MORE adiposity (zhou2026, arab2024). The same weekend lie-in generates both exposures, so the
  sign of the estimate depends on which one you code. See jetlag_summary.md.
shard: s16_social_jetlag
