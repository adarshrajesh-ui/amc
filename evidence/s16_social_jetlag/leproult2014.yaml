rob:
  tool: RoB2
  judgement: some_concerns
  notes: 'Randomised parallel-group inpatient protocol with sleep duration successfully equated; strong
    internal validity for the timing contrast. Concerns: very small (26 enrolled, 25 analysed, 19 men);
    the headline doubling is a MALE-ONLY subgroup after the authors restricted analysis due to few women;
    misaligned participants also ate 21% vs 7% of calories after 19:00, so meal timing is a co-exposure
    the design does not isolate; no blinding possible.'
funding: null
notes: 'THE STRONGEST CAUSAL EVIDENCE IN THIS SHARD, and directly on the question I was asked: misalignment
  versus restriction alone, with duration held constant. HEADLINE COMPARISON: restriction alone cost -32%
  insulin sensitivity in men; restriction PLUS misalignment cost -58%, i.e. 1.81x as much, for the same
  4 h 45 min of sleep. In the whole sample, -34% vs -47% (1.38x). Inflammation: +64% vs +146% hsCRP (2.28x).
  APPLICABILITY TO OUR SUBJECT IS UNUSUALLY GOOD ON SEX AND DOSE: the male subgroup is the larger and
  significant one, and the restricted dose (~4 h 45 min) is close to our subject''s worst weekday nights.
  APPLICABILITY IS POOR ON MAGNITUDE OF MISALIGNMENT: an 8.5 h bedtime delay on 4 of 8 days is roughly
  4-5x our subject''s estimated ~1.75 h of weekly phase shift. This effect must be scaled DOWN substantially,
  and the dose-response between 1.75 h and 8.5 h of misalignment is unmeasured. Two further supports the
  authors report: the hsCRP rise CORRELATED with the actual measured phase shift (r = 0.487, P = 0.040),
  and they argue their SI contrast is if anything UNDERstated (''the difference in the decrease of SI
  between the two conditions is underestimated, not overestimated'').'
shard: s16_social_jetlag
