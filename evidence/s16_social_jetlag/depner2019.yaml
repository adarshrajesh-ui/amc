rob:
  tool: RoB2
  judgement: some_concerns
  notes: 'CRITICAL DESIGN LIMITATION for the way this study is usually cited: the analysis is WITHIN-GROUP
    ONLY. The stated method is ''Mixed-Effects ANOVAs with either study day ... as fixed factors, and
    participant as a random factor were used to test for within group differences''. The 13%-vs-27% comparison
    is therefore a comparison of two separately-estimated within-group changes across arms of n=14 each,
    NOT a tested between-group contrast, and no CI or p-value for the WR-minus-SR difference exists. Also:
    groups were small and unequal (8/14/14), diet was ad libitum so energy intake is a mediator not a
    control, and the WR arm''s insulin-sensitivity loss lost significance when body weight was controlled
    (P=0.054).'
funding: NIH (K.P.W. reports multiple industry relationships; see COI statement)
notes: 'THE ENTIRE ''WEEKEND CATCH-UP IS HARMFUL'' POSITION RESTS LARGELY ON THIS ONE STUDY, so its limits
  decide how much weight the tension deserves. WHAT IT ESTABLISHES SOLIDLY: (a) 1.1 h is all the sleep
  a real ad libitum weekend actually recovers; (b) weekend recovery DELAYED circadian phase by ~1.7 h
  versus ~25 min without it, so catch-up sleep demonstrably manufactures misalignment; (c) hepatic insulin
  sensitivity fell ONLY in the weekend-recovery arm; (d) benefits seen during the weekend itself did not
  survive the return to short sleep. WHAT IT DOES NOT ESTABLISH: that weekend recovery is worse than no
  recovery. The 27% vs 13% gap was never tested statistically, the arms are n=14, and with SDs unavailable
  I cannot compute that contrast. I therefore record both within-arm changes separately with se=null and
  explicitly refuse to emit a WR-vs-SR effect size. Population is healthy young adults, the closest lab
  match to our subject in this shard.'
