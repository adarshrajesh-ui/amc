rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: 'Strengths: ACTIGRAPHIC (not self-reported) SJL; clinically measured outcomes; adjustment for
    sleep duration, sleep debt, sleep efficiency, depression and health behaviours. Weaknesses: cross-sectional;
    midlife day-shift workers only; SJL range very narrow.'
funding: null
notes: 'BEST-ADJUSTED OBSERVATIONAL EVIDENCE THAT MISALIGNMENT ACTS INDEPENDENTLY OF DURATION: sleep duration
  AND sleep debt are covariates in every model, and the SJL coefficients survive. CRITICAL SCALING CAVEAT
  FOR THE MODELLER: these are betas PER SD OF SJL, and 1 SD is only 32 min. Naively rescaling to per-hour
  (0.17/0.533 = 0.32 SD of BMI per hour) extrapolates ~2 SD beyond the observed exposure range and is
  not supported. The authors agree the effect is likely understated for high-SJL people: ''It is therefore
  possible that the associations of SJL with metabolic risk factors seen here may underestimate those
  in the general population, warranting replication across a wider range of SJL.'' INTERNAL INCONSISTENCY
  IN THE PUBLISHED PAPER, flagged not resolved: the Discussion says ''only 6% (n = 28) of the current
  sample experienced SJL of 1 hour or more'', but Table 4 splits the sample at 60 min into n=326 (<=60
  min) and n=111 (>60 min), i.e. ~25%. Given mean 44 min and SD 32 min, ~25% above 60 min is the distributionally
  coherent figure, so the ''6%'' sentence appears to be the error. I did not use either number as an effect.'
