notes: 'INCLUDED BECAUSE IT UNDERCUTS THE EXPOSURE MEASUREMENT ON WHICH THIS SHARD DEPENDS. If self-reported
  timing proxies poorly approximate measured phase in exactly our subject''s population, then self-report-based
  social jetlag is a noisy proxy for the misalignment we actually care about, which biases individual
  effect estimates toward zero and widens the uncertainty the modeller should carry on any SJL exposure
  assigned to our subject. The quote is a verbatim but TRUNCATED fragment: PubMed''s abstract for this
  record is cut off and I could not retrieve the full sentence, so I report only what I actually saw.
