  quote: Circadian misalignment, when subjects ate and slept approximately 12 h out of phase from their
    habitual times, systematically decreased leptin (-17%, P < 0.001), increased glucose (+6%, P < 0.001)
    despite increased insulin (+22%, P = 0.006), completely reversed the daily cortisol rhythm (P < 0.001),
    increased mean arterial pressure (+3%, P = 0.001), and reduced sleep efficiency (-20%, P < 0.002).
