rob:
  tool: RoB2
  judgement: some_concerns
  notes: Within-subject forced-desynchrony design with excellent control of light, meals (isocaloric)
    and circadian phase; the cleanest possible isolation of misalignment. But n=10, 10 days only, and
    the 12 h misalignment is far more extreme than anything social jetlag produces.
funding: null
notes: 'MECHANISTIC PROOF OF PRINCIPLE that misalignment alone damages metabolism and blood pressure,
  independent of sleep amount and of diet. All effects are within-subject percentage changes with P-values
  but NO dispersion measures in the abstract, so every se=null; full text not retrieved. DOSE CAVEAT IS
  SEVERE: 12 h of misalignment is ~7x our subject''s estimated ~1.75 h. Use this record to justify a NON-ZERO
  independent misalignment pathway, not to size it.'
