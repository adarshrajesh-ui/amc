funding: null
notes: CONTEXT RECORD. Important for the modeller's interpretation because it makes clear that our subject's
  late timing is a NORMAL DEVELOPMENTAL PHENOMENON at the mild end of a continuum whose extreme is a diagnosable
  disorder ('Delayed sleep phase syndrome (DSPS), which has a typical onset during the second decade of
  life, may be an extreme manifestation of homeostatic and circadian changes in adolescence'). It also
  warns against attributing the whole delay to the circadian clock, since sleep homeostasis contributes.
