  quote: Sleep/wake timing shifts later in young humans during the second decade of life. In this review
    we describe sleep/wake patterns, changes in these patterns across adolescence, and evidence for the
    role of environmental, psychosocial, and biological factors underlying these changes. A two-process
    model incorporating circadian (Process C) and sleep/wake homeostatic (Process S) components is outlined.
