notes: 'ORIGINATING PAPER for the social jetlag construct. Formal formula SJL = |MSF - MSW| (midsleep
  on free days minus midsleep on workdays); see roenneberg2019.yaml for the explicit equation and the
  authors'' own later critique. FULL TEXT IS PAYWALLED (Unpaywall is_oa=False, no OA location); the age-stratified
  normative SJL distribution that this shard was asked to extract is presented in this paper''s figures,
  which I could not retrieve. I therefore did NOT extract numeric age-specific norms from this paper.
  Age-specific normative values are instead taken from randler2019 (n=18,323, peak SJL 3:18 h at age 16)
  and illingworth2025 (n=19,760, mean 1:53 h, peak 2:07 h at age 15). This is a deviation from the task''s
  expectation and is deliberate: quoting numbers I could not retrieve would be fabrication.'
