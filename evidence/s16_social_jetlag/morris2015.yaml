rob:
  tool: RoB2
  judgement: some_concerns
  notes: Two rigorously controlled 8-day inpatient protocols that successfully dissociate circadian phase
    from behavioural cycle from misalignment. Small (n=14 across protocols) and again a 12 h inversion,
    far larger than social jetlag.
funding: null
notes: 'THE MOST USEFUL CALIBRATION RECORD IN THIS SHARD. It puts the misalignment effect in proportion:
  a full 12 h behavioural inversion raised postprandial glucose by only 6%, while simply eating in the
  biological evening raised it 17%. So even MAXIMAL misalignment produces a smaller glycaemic effect than
  ordinary circadian phase variation, which argues strongly against attributing a large independent metabolic
  burden to our subject''s ~1.75 h of social jetlag. TASK-DESCRIPTION CORRECTION: the task placed this
  paper at ''approx 2016''; it is PNAS 2015, 112(17):E2225-E2234. No dispersion measures in the abstract,
  so all se=null.'
shard: s16_social_jetlag
