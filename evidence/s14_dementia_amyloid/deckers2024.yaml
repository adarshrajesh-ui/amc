effects:
  - outcome_domain: neurodegeneration
    outcome_construct: replication_consistency_of_short_sleep_duration_across_systematic_reviews
    exposure: {type: habitual_short_sleep, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "proportion of systematic reviews / meta-analyses on SHORT sleep duration that reported higher dementia risk or faster cognitive decline: 5 of 16"}
    scale: probability
    unit: "fraction of reviews reporting a positive association"
    value: 0.31
    se: null
    ci: null
    conversion_formula: >
      Table row "Short sleep duration | 16 | 5 | 11 | 0 | 31%": of 16 reviews, 5 reported higher
      risk/decline, 11 reported no association, 0 reported lower risk. The paper prints the consistency as
      31%; 5/16 = 0.3125, consistent with the printed figure. value carries the paper's printed 31% as 0.31.
      se is null - a vote-count proportion across overlapping reviews has no meaningful standard error and
      inventing one would misrepresent it.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      NOT A HARM MAGNITUDE - a REPLICATION RATE. 0.31 means MOST syntheses of short sleep and dementia find
      NOTHING: 11 of 16 reported no association. For calibration, in the same table the same method gives
      olfactory impairment 100% (9/9), atrial fibrillation 79%, hearing impairment 78%, anxiety 71%. Short
      sleep at 31% is near the bottom of a 30-factor list. This is the correct prior for how much of the
      short-sleep dementia literature actually replicates, and it is low.
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "Long sleep duration | 16 | 7 | 9 | 0 | 44% | Short sleep duration | 16 | 5 | 11 | 0 | 31%"
