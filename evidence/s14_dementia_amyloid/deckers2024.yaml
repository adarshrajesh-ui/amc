    exposure: {type: descriptive, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "final rank of 'Sleep' among emerging modifiable dementia risk factors in a two-round Delphi of 18 experts: rank 5 of 11"}
    scale: raw_units
    unit: "Delphi rank (1 = highest priority)"
    value: 5.0
    se: null
    ci: null
    conversion_formula: >
      Table row "Sleep | 8 | 1,1,1,2,2,4,5,6 | 572 | 5": nominated by 8 of 18 experts, rank score 572,
      final rank 5. value = the printed final rank. Not an effect size; se null.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      LOWER = higher expert priority. Sleep ranks 5th, behind hearing impairment, social isolation/loneliness,
      traumatic brain injury and education. This is the counterweight to the two consistency numbers above:
      despite replicating in only 31% of reviews, sleep was still voted one of the three factors most suitable
      for addition to the LIBRA risk score. So the expert judgement is "promising and worth adding to a risk
      score", NOT "quantified". Note also that when asked which sleep construct to target, the experts chose
      SLEEP-DISORDERED BREATHING, not short duration.
    covariates: []
