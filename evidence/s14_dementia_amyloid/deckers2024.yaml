    quote: "Sleep | 8 | 1,1,1,2,2,4,5,6 | 572 | 5"
rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: >
    An umbrella review of 148 systematic reviews and meta-analyses covering 608 unique primary studies,
    combined with a preregistered two-round Delphi of 18 dementia experts - the right design for asking "how
    consistent is this literature". Concerns: (1) the consistency metric is a VOTE COUNT across reviews that
    overlap heavily in their primary studies, so the 16 short-sleep reviews are not 16 independent tests and
    the 31% figure should be read as descriptive, not inferential; (2) vote counting ignores effect magnitude
    and precision entirely; (3) the Delphi is expert opinion with a small panel (18, then 17); (4) the
    "no association" bin conflates true nulls with underpowered studies. Direction of bias for this shard's
    purposes is if anything conservative: vote counting tends to over-credit weak literatures because any
    nominally significant review counts as a hit, and short sleep still only reached 31%.
funding: "see paper (Alzheimer Nederland; INVITE group support)"
notes: >
  THIS IS THE RECORD THAT CALIBRATES HOW MUCH OF THE SHORT-SLEEP DEMENTIA LITERATURE REPLICATES, expressed in
  the one currency a downstream Bayesian model can use directly as a prior: 5 of 16 reviews positive, 11 null.
  WHAT THE STUDY SET OUT TO DO, VERBATIM: "To identify modifiable risk and protective factors suitable for
  dementia risk reduction, we combined an umbrella review of systematic reviews and meta-analyses with a
  two-round Delphi consensus study. The review of 608 unique primary studies and opinions of 18 experts
  prioritized six modifiable factors: hearing impairment, social contact, sleep, life course inequalities,
  atrial fibrillation, and psychological stress. Based on expert ranking, hearing impairment, social contact,
  and sleep were considered the most suitable candidates for inclusion in updated dementia risk scores."
  HOW TO HOLD THE TWO HALVES TOGETHER. This paper is simultaneously the strongest expert endorsement of sleep
  as a target (top-3 for inclusion in LIBRA) and the source of the weakest replication statistic for short
  sleep specifically (31%). Those are not in conflict once you notice the granularity: "sleep" as a domain is
  promising, driven by sleep-disordered breathing, insomnia and daytime sleepiness; "short sleep duration" as
  a specific exposure is the weakest-replicating member of that family. Related rows from the same table for
  context: Poor sleep quality 10 reviews / 50%, Insomnia 9 / 44%, Daytime sleepiness 5 / 100%,
  Sleep-disordered breathing 5 / 40%. DAYTIME SLEEPINESS IS THE ONLY SLEEP CONSTRUCT AT 100% CONSISTENCY,
  which lines up with spira2018.yaml, and daytime sleepiness is also the sleep construct most obviously
  produced by incipient neurodegeneration.
  ON THE OPERATIONALISATION CHOICE, VERBATIM: "For the factors social contact and sleep, the experts were
  additionally asked to indicate which operationalization encountered in the literature would be the most
  suitable for modification. Social engagement ... and sleep-disordered breathing were indicated as the most
  suitable operationalizations. However, the difference among the most suitable operationalizations for sleep
  were minimal."
  NOTHING IN THIS UMBRELLA REVIEW CONCERNS ADOLESCENT SLEEP. "Life course inequalities" is the only
  early-life factor prioritised, and it is socioeconomic, not sleep.
