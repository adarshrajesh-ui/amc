    exposure: {type: other, dose_h: null, referent_h: null, duration_days: 6,
               contrast_label: "NREM slow-wave activity vs AV-45 florbetapir AMYLOID PET, regional analysis after correction for multiple comparisons; n = 38"}
    scale: raw_units
    unit: "number of brain regions where amyloid PET was associated with NREM SWA after multiple-comparison correction"
    value: 0.0
    se: null
    ci: null
    conversion_formula: >
      A DELIBERATE NULL, quoted verbatim: "After correcting for multiple comparisons, there were no regions
      on AV-45 amyloid PET associated with NREM SWA ( Table S4 )." Whole-composite association was p = 0.043
      for 1-2 Hz only, i.e. barely significant and not surviving regional correction. se null.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      ZERO = NO amyloid regions survived correction. This is a KEY DISSOCIATION. In this study the sleep-EEG
      signal tracks TAU, not amyloid. The broadband measure showed no amyloid association at all
      ("All night 1-4.5 Hz SWA was not associated with AV-45 amyloid PET"). That matters because the entire
      popular mechanism is an AMYLOID CLEARANCE story, and the largest and best-covariate-adjusted
      sleep-EEG-pathology study finds the amyloid link is the weaker one.
    covariates: ["age", "sex", "race", "CDR", "ApoE4 status", "AHI", "PLMI", "sleep medications", "time"]
    followup_years: null
    cohort_family: "Knight_ADRC"
    quote: "Using the same model as for AV-1451 tau PET, we assessed the relationship between NREM SWA and AV-45 amyloid PET. The mean cortical AV-45 amyloid composite was calculated as the average SUVR for the frontal, temporal, and parietal lobes. All night 1–4.5 Hz SWA was not associated with AV-45 amyloid PET ( Table 3 ). Then, we tested NREM SWA in frequency ranges of 1–2 Hz, 2–3 Hz, and 3–4 Hz. There was an inverse relationship between 1–2 Hz NREM SWA and the mean cortical AV-45 amyloid composite (p=0.043, Table 3 ). ... After correcting for multiple comparisons, there were no regions on AV-45 amyloid PET associated with NREM SWA ( Table S4 )."
