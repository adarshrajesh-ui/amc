    outcome_construct: nrem_slow_wave_activity_1_to_2Hz_vs_av1451_tau_pet_burden
    exposure: {type: other, dose_h: null, referent_h: null, duration_days: 6,
               contrast_label: "all-night NREM slow-wave activity in the 1-2 Hz band, measured by single-channel forehead EEG over up to 6 nights, vs AV-1451 flortaucipir tau PET composite; n = 38 with PET"}
    scale: raw_units
    unit: "direction of association between NREM 1-2 Hz SWA and tau PET burden"
    value: -1.0
    se: null
    ci: null
    conversion_formula: >
      Coded as a sign indicator. The paper reports the direction and that the relationship was "maximal in
      the 1-2 Hz range", with the model coefficients, standard errors and p-values presented in Table 2,
      which renders as unlabelled numeric cells in the retrieved PMC HTML and could not be attributed to
      rows with confidence. Rather than risk misassigning a coefficient, no magnitude is claimed and se is
      null. Do not pool.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      NEGATIVE = LESS 1-2 Hz NREM slow-wave activity associated with MORE tau pathology. Cross-sectional, so
      direction of causality is undetermined, and in this literature the more likely reading is the reverse
      of the popular one: tau pathology in the medial temporal lobe degrades the neural machinery that
      generates slow waves. The regional map supports that reading - the strongest associations were in
      entorhinal and parahippocampal cortex, i.e. exactly where tau starts.
    covariates: ["age", "sex", "race", "CDR", "ApoE4 status", "apnea-hypopnea index", "periodic limb movement index", "sleep medications", "time (night)"]
    followup_years: null
    cohort_family: "Knight_ADRC"
    quote: "As AV-1451 tau SUVR increased, all-night 1–4.5 Hz SWA was decreased ( Table 2 ). Since previous work found an inverse relationship between the slowest frequencies and amyloid deposition in the mPFC ( 38 ), we tested different frequency ranges (1–2 Hz, 2–3 Hz, and 3–4 Hz) in this model and found that this inverse relationship between NREM SWA and tau was maximal in the 1–2 Hz range ( Table 2 ). ... CDR showed negative association with 1–2 Hz NREM SWA, indicating that 1–2 Hz NREM SWA decreased with worsening tau pathology and cognitive impairment."
