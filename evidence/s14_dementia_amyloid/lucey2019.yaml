      se null.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      ZERO = gross sleep measures, including duration, did NOT differ by amyloid or tau status. Only fine
      EEG microarchitecture did. And where self-reported total sleep time did differ by cognitive status, it
      went in the counterintuitive direction: "CDR 0.5 individuals were found to have ... longer
      self-reported total sleep time (TST) (t(104)=−2.27, p=0.025)" - i.e. the cognitively worse group
      reported sleeping MORE, not less.
    covariates: []
    followup_years: null
    cohort_family: "Knight_ADRC"
    quote: "Average sleep parameters for participants with PET imaging and CSF biomarkers were not substantially different between amyloid-negative vs. amyloid-positive, tau-negative vs. tau-positive, and CDR 0 vs. CDR 0.5 groups regardless of modality used to measure sleep-wake activity ( Tables S1 and S2 ). ... For participants with CSF, CDR 0.5 individuals were found to have longer REM latency measured by EEG (t(104)=−2.91, p=0.0044) and longer self-reported total sleep time (TST) (t(104)=−2.27, p=0.025)."
rob:
  tool: Newcastle-Ottawa
  judgement: high
  notes: >
    CROSS-SECTIONAL, hence tier TX. Well covariate-adjusted (age, sex, race, CDR, ApoE4, apnoea-hypopnoea
    index, periodic limb movement index, sleep medications) and uses multi-night home EEG rather than a single
    laboratory night, which is a real strength. Concerns: the tau PET sub-sample is only 38, and only 8 of
    those were positive for both amyloid and tau; participants are all >60 y and drawn from Alzheimer's
    research cohorts; many frequency bands and many regions tested with corrections applied inconsistently
    across analyses (some results explicitly reported uncorrected); and the analysis direction treats sleep
    EEG as the DEPENDENT variable with pathology as predictor, which is the reverse of the causal framing
    usually applied to this paper.
funding: "NIH and others; see paper"
notes: >
  THE LUCEY BIOMARKER RECORD THE TASK ASKED FOR, and it answers the question in the opposite direction from
  what the framing implies. The authors themselves state the argument as a discriminative-biomarker claim,
  not a causal one, verbatim: "this suggested that changes in NREM SWA, especially at 1–2 Hz, might be able
  to discriminate tau pathology and cognitive impairment either before or at the earliest stages of
  symptomatic AD."
  THREE POINTS FOR THE REPORT.
  (1) The signal is in TAU, not amyloid; no amyloid region survived multiple-comparison correction.
  (2) The signal is in fine EEG microarchitecture, NOT in sleep duration; gross sleep parameters did not
      differ by biomarker status at all.
  (3) The regional distribution of the tau association (entorhinal, parahippocampal, orbitofrontal,
      precuneus, inferior parietal, inferior temporal) matches the canonical spread of tau pathology, which
      is at least as consistent with pathology degrading slow-wave generation as with poor sleep causing
      pathology. The authors note this pattern resembles other AD-related changes such as cortical
      thickness.
  Note also that the same group's SILK work (lucey2018.yaml) found the human amyloid response to sleep loss
  is production-driven, not clearance-driven. Taken together, the Lucey programme is substantially LESS
  supportive of the glymphatic-clearance narrative than secondary sources imply.
