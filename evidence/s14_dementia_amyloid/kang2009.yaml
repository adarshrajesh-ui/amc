    quote: "Mice were forced into wakefulness for 6 hours at the beginning of the second 12 hour light period when they would naturally be asleep. During sleep deprivation (SD), ISF Aβ levels were significantly higher compared to ISF Aβ levels during the normal light period 24 hours previously ( Fig. 2, A–C ). Following SD, mice spent more time sleeping and had an immediate reduction in ISF Aβ levels. Thus, the state of wakefulness, and not time of day, is associated with increased ISF Aβ levels."
