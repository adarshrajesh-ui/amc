    exposure: {type: chronic_restriction, dose_h: 4, referent_h: null, duration_days: 21,
               contrast_label: "chronic sleep restriction 20 h per day for 21 days vs age-matched littermate controls, APPswe/PS1dE9 transgenic mice"}
    scale: raw_units
    unit: "direction of difference in Ab plaque deposition (positive = more plaque under restriction)"
    value: 1.0
    se: null
    ci: null
    conversion_formula: >
      The result is reported qualitatively ("markedly greater Aβ plaque deposition") with quantification in
      Fig 4A-G; no numeric group means, fold-changes, SEs or p-values for the plaque comparison appear in the
      retrievable text. Coded as a sign indicator; se null. Do not pool.
    from_figure: true
    inferred_from_ci: false
    direction_note: >
      POSITIVE = MORE plaque under chronic restriction. THIS IS THE ONLY EVIDENCE IN THE WHOLE LITERATURE
      THAT CHRONIC SLEEP RESTRICTION INCREASES ACTUAL AMYLOID PLAQUE, and it is in AMYLOID-OVEREXPRESSING
      TRANSGENIC MICE restricted to 4 h of sleep per 24 h for 21 days. Scope limits that must be stated
      whenever this is cited: (1) the animals carry human APP and PS1 mutations and would develop plaques
      anyway, so the model measures acceleration of a genetically programmed process, not initiation;
      (2) 20 h of enforced wakefulness daily is not comparable to a human sleeping 5-6 h; (3) 21 days in a
      mouse is a substantial fraction of the plaque-formation window, not a life-course exposure;
      (4) no cognitive outcome; (5) no human replication exists.
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "Because sleep-wake behavior modulates ISF Aβ levels, we asked whether chronic sleep deprivation could ultimately affect Aβ plaque deposition in the brain. APP transgenic mice of the APPswe/PS1dE9 genotype were subjected to chronic sleep restriction for 20 hours daily for 21 days. Sleep-restricted animals showed markedly greater Aβ plaque deposition compared to their age-matched littermate controls ( Fig. 4A–G )."
rob:
  tool: none
  judgement: na
  notes: >
    Not a clinical study; tier TX. Elegant mechanistic work but every limitation of a transgenic mouse model
    applies: amyloid overexpression, small n (5-8 per experiment), severe non-physiological exposures
    (20 h/day enforced wakefulness), and outcomes measured in interstitial fluid or histology rather than in
    cognition. The 16.8% acute figure sits at P = 0.05 with n = 8.
funding: "NIH and others; see paper"
notes: >
  MECHANISM LINK 0 - the paper that started the field, four years before Xie 2013. It matters for this shard
  for three reasons.
  (1) It contains the ONLY direct experimental evidence on REVERSAL: the acute Ab rise fell immediately once
  the animals slept.
  (2) It supplies the ONLY plaque-level chronic-restriction finding, in transgenic mice.
  (3) Its proposed mechanism is neuronal-activity-dependent Ab RELEASE modulated by orexin, not glymphatic
  clearance - and that production-side mechanism is the one later confirmed in humans by Lucey 2018. The
  orexin arm is striking: a dual orexin receptor antagonist abolished the diurnal Ab rhythm and reduced
  plaque formation. Verbatim: "Icv administration of almorexant for 24 hours suppressed ISF Aβ levels and
  abolished the natural diurnal variation of Aβ ( Fig. 3, D–E )." Note that orexin is also the one biomarker
  that DID change in the human partial-restriction experiment (olsson2018.yaml, +27 % CSF orexin with no
  amyloid change), so the human data engage the orexin arm of this mechanism without engaging the amyloid
  consequence.
shard: "s14_dementia_amyloid"
