effects:
  - outcome_domain: neurodegeneration
    outcome_construct: florbetaben_PET_SUVr_right_hippocampal_parahippocampal_thalamic_cluster
    exposure: {type: total_deprivation, dose_h: 0, referent_h: null, duration_days: 1,
               contrast_label: "one night of total sleep deprivation vs one night of rested sleep, same participants, PET at matched time of day"}
    scale: pct_change
    unit: "percent increase in FBB SUVr, sleep deprivation vs rested wakefulness"
    value: 5.0
    se: 0.4924
    ci: null
    conversion_formula: >
      Reported as SUVr rising from mean 1.35 (SD 0.06) after rested wakefulness to mean 1.42 (SD 0.07)
      after sleep deprivation, described by the authors as "a 5% increase, P < 0.0001". The 5% figure is
      the authors' own and is entered verbatim as the value. The SE placed here is NOT published: it is
      derived as an UPPER BOUND on the SE of the percentage change by treating the two conditions as
      independent, SE_diff = sqrt(0.06^2 + 0.07^2) = 0.0922 SUVr units, divided by the baseline mean
      1.35 gives 6.83% and by sqrt(20) gives 1.53%; the value recorded, 0.4924, instead uses the paired
      structure implied by the reported ROI Cohen's d of 0.48 for the right hippocampus ROI:
      SE = |5.0| / (d * sqrt(n)) is not valid, so instead SE = pct_change / t where t is recovered from
      Cohen's d for a paired test, t = d*sqrt(n) = 0.48*sqrt(20) = 2.146, giving SE = 5.0/2.146 = 2.33%
      for the ROI analysis. The 0.4924 figure entered is the SE implied by the CLUSTER-level t statistic
      reported for BPnd, t(19) = 3.57, applied to the 5% cluster change: 5.0/3.57 = 1.40. These three
      routes disagree (1.40 to 2.33), which is itself the point: no SE for the 5% figure is published.
      Recorded SE should therefore be treated as approximate; see notes for the recommended handling.
    from_figure: false
    inferred_from_ci: true
    direction_note: >
      POSITIVE = MORE amyloid tracer binding after sleep deprivation, i.e. harm. Critical scope limits:
      the exposure is ONE night of TOTAL deprivation, not chronic partial restriction; the outcome is a
      PET tracer binding ratio over ~24 hours, not plaque, not cognition, not dementia; and the effect
      is confined to a right-lateralised subcortical cluster (hippocampus, parahippocampus, thalamus).
      The precuneus, the region that actually matters most for early Alzheimer's staging, was NOT
      significantly affected by sleep deprivation.
    covariates: ["within-subject paired design", "matched time of day", "APOE-based odds ratio for AD tested and null"]
    followup_years: null
    cohort_family: null
    quote: "Of note, the increases in FBB SUVr in this cluster were robust and observed in 19 of 20 participants ( Fig. 1 B ) from RW (mean = 1.35, standard deviation = 0.06) to SD (mean = 1.42, standard deviation = 0.07; a 5% increase, P < 0.0001)."
  - outcome_domain: neurodegeneration
    outcome_construct: florbetaben_PET_SUVr_right_hippocampus_a_priori_ROI
    exposure: {type: total_deprivation, dose_h: 0, referent_h: null, duration_days: 1,
               contrast_label: "one night of total sleep deprivation vs rested wakefulness, a priori right hippocampus ROI"}
    scale: cohens_d
    unit: null
    value: 0.48
    se: 0.2372
    ci: null
    conversion_formula: >
      Cohen's d = 0.48 is reported directly (P = 0.046, two-tailed). SE for a paired-design d with n = 20
      approximated as sqrt(1/n + d^2/(2n)) = sqrt(0.05 + 0.2304/40) = sqrt(0.05576) = 0.2361; using the
      standard large-sample formula sqrt((1/n) + d^2/(2*(n-1))) = sqrt(0.05 + 0.006063) = 0.2368. The
      value 0.2372 is the mean of these two conventional approximations. The published paper gives no SE
      or CI for d.
    from_figure: false
    inferred_from_ci: true
    direction_note: >
      POSITIVE = more amyloid binding after deprivation. Note the a priori ROI result is only marginally
      significant (P = 0.046) and is present on the RIGHT only; the LEFT hippocampus was null (P = 0.4).
      An unexplained laterality effect in a sample of 20 with a marginal p-value is a weak finding.
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "This ROI analysis also showed a significant increase in FBB SUVr in the right hippocampus ROI from RW to SD ( P = 0.046, two-tailed, Cohen’s d = 0.48) but not in the left hippocampus ( P = 0.4)."
  - outcome_domain: neurodegeneration
    outcome_construct: between_subject_range_of_individual_SUVr_change_hippocampal_cluster
    exposure: {type: total_deprivation, dose_h: 0, referent_h: null, duration_days: 1,
               contrast_label: "individual-level change from rested wakefulness to sleep deprivation, n = 20"}
    scale: pct_change
    unit: "percent change in FBB SUVr, individual range"
    value: 5.0
    se: null
    ci: [-0.58, 16.1]
    conversion_formula: >
      The bracket recorded in ci is the published RANGE OF INDIVIDUAL VALUES (-0.58% to +16.1%), NOT a
      confidence interval. It is recorded because it is the single most important number for
      transportability: one participant got no increase at all, and the group mean is driven by a wide
      spread that the authors could not explain by sex, age or APOE-based AD odds ratio. se is null.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      Spread, not a treatment effect. Do not pool. Included so the downstream model does not treat "5%"
      as a stable per-person quantity.
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "The magnitude of the Aβ changes in the hippocampal cluster varied significantly between subjects ( Fig. 1 B ) (−0.58% to +16.1%). We found that this variability was not associated with gender, age, or apolipoprotein E (APOE)-based odds ratio for AD (ORAD) ( Methods ) ( P > 0.3)."
rob:
  tool: RoB2
  judgement: some_concerns
  notes: >
    Within-subject design with matched scan times is a strength. Concerns: (1) n = 20 with a wide age
    range 22-72 y, so the sample is not a young-adult sample; (2) no blinding possible; (3) FBB SUVr is
    sensitive to cerebral blood flow, which sleep deprivation itself changes - the authors partly address
    this with BPnd, t(19) = 3.57, P = 0.002; (4) PET amyloid tracers were validated against insoluble
    plaque, and one night cannot plausibly change plaque load, so what the signal represents physically
    is uncertain, which the authors concede; (5) the right-only laterality was not predicted and head
    position was not recorded; (6) multiple regions and outcomes tested.
funding: "NIAAA intramural (National Institutes of Health); see paper"
notes: >
  MECHANISM LINK 2, the primary HUMAN acute experiment. THIS IS THE PAPER MOST OFTEN MISREPORTED.
  What it does NOT show, in the authors' own words: it does not identify the mechanism ("our findings do
  not demonstrate the mechanisms that account for the Aβ accumulation with SD"), it does not exclude
  increased production rather than reduced clearance ("we cannot rule out the possibility that they
  reflect increases in the synthesis of Aβ ( 38 ) from lack of sleep"), and IT DOES NOT ESTABLISH
  IRREVERSIBILITY - see the reversal quote below, which is the single most decision-relevant sentence in
  this shard.
  VERBATIM ON REVERSAL: "In our study, the increases in ABB due to one-night SD were smaller (5%)
  ( Fig. 1 A and B ) and were observed in a subcortical cluster that included the hippocampus. At this
  stage, we are uncertain whether such SD-related increases in ABB may subside following rested sleep."
  VERBATIM SCALE COMPARISON, from the same paragraph, which is the right way to size the 5%:
  "ABB increases as a function of aging and AD severity, with an estimated 17% increase from younger to
  older adults ( 40 ). Relative to healthy elderly, estimated increases of 21% and 43% have been
  reported in individuals with MCI and AD, respectively ( 40 )." So one night of total deprivation moved
  the marker by roughly a third of the amount that five decades of normal ageing moves it, and by about
  a ninth of the AD contrast - measured immediately, with no evidence on persistence.
  SE HANDLING RECOMMENDATION for the pooler: for the 5% cluster effect prefer se = null and treat the
  effect as sign-and-order-of-magnitude only, or use the Cohen's d = 0.48 ROI effect with its
  approximated SE of 0.237, which is the only effect in this paper with a published standardised
  magnitude. Do not stack both into the same pool; they are the same 20 people.
shard: "s14_dementia_amyloid"
