    covariates: ["as above"]
    followup_years: null
    cohort_family: "UK_Biobank_exposure"
    quote: "Genetically higher risks of AD were associated with being a morning person, a lower risk of insomnia, a shorter self-reported and accelerometer-based sleep duration, being less likely to report long sleep, an earlier L5 timing, and a smaller number of sleep episodes after adjustment for multiple comparisons ( table 1 and figure 1 and supplementary figures e-21–e-29 ...). MR findings using IVW, weighted median, and MR-Egger were consistent. ... None of the MR analyses supported a causal effect of sleep-related phenotypes on AD risk (supplementary figures e-30–e-38, available from Dryad)."
rob:
  tool: MR-STROBE
  judgement: some_concerns
  notes: >
    Bidirectional design with three estimators (IVW, weighted median, MR-Egger) that agreed, F > 10 for all
    instruments, and an explicit APOE-exclusion sensitivity analysis - which is exactly the right check,
    because APOE is pleiotropic and violates the exclusion-restriction assumption when used to instrument
    AD. Concerns: (1) the reverse-direction sleep-duration findings did NOT survive APOE exclusion, so the
    specific claim "AD genetic risk shortens sleep" rests substantially on APOE and the authors say so;
    (2) the authors note that "P -values were small, likely due to the strength of APOE as an instrument"
    (a point Anderson 2021 makes about its own analysis too), so statistical significance here overstates
    the evidential weight; (3) effect magnitudes on the GWAS scale are tiny and hard to interpret
    clinically; (4) genetic liability is not equivalent to prodromal disease, so this does not measure the
    size of the reverse-causation bias operating in cohort studies.
funding: "See paper"
notes: >
  THE REVERSE-DIRECTION MR THE TASK ASKED FOR, and its notable finding is exactly the counterintuitive one:
  genetic liability to Alzheimer's is associated with being a MORNING person, LOWER insomnia risk, and
  SHORTER sleep - not with the insomnia-and-fragmentation picture seen in clinically manifest AD. The
  authors flag this discordance themselves and hypothesise a stage-dependent effect: "These results from
  the study of people at high genetic risk of AD are not consistent with the observational findings of
  sleep disturbances in people who express AD clinically ... While the evidence is not strong, on the basis
  of these data and our observations, we hypothesize that preclinical stages of AD and more severe,
  clinically expressed AD may have different effects on sleep phenotypes."
  Verbatim overall conclusion: "In this study, we found evidence supporting a potential causal influence of
  AD on sleep disturbances. However, we did not find evidence supporting a causal role of disturbed sleep
  patterns on AD, suggesting that observed associations between sleep disorders and AD may be due to
  reverse causation."
  Note on verification: the Crossref record for this DOI stores the title without its subtitle, so raw
  title similarity to PubMed was 0.768. The Crossref title is an exact prefix of the PubMed title and the
  DOI registered in PubMed matches, so the record is treated as VERIFIED (see verify.py prefix rule).
