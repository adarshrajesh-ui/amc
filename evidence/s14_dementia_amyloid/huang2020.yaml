    covariates: ["as above; APOE-excluded sensitivity analysis reported separately"]
    followup_years: null
    cohort_family: "UK_Biobank_exposure"
    quote: "Because of the larger independent contribution of APOE ε4, a gene with pleiotropic effects influencing multiple disease processes that might contribute to AD risk, 26 we performed a sensitivity analysis excluding APOE SNPs (rs7412 and rs429358). Without APOE ε4, the causal associations of AD with self-reported and accelerometer-based sleep duration were not significant (supplementary figures e-21–e-29, available from Dryad, doi.org/10.5061/dryad.ffbg79cqt ). However, all other causal associations of AD on sleep phenotypes explored here were supported."
