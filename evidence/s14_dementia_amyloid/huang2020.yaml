    scale: per_hour_beta
    unit: "beta on the GWAS scale of self-reported sleep duration, per unit of genetically predicted log-odds of AD"
    value: -0.006
    se: null
    ci: null
    conversion_formula: >
      Reported as "shorter sleep duration (self-reported: β = −0.006, p = 1.9 × 10 −4 ...)". No SE or CI is
      printed in the running text (they are in Table 1, not machine-readable from the retrieved PMC HTML),
      so se is null. An SE could in principle be back-derived from the p-value as
      se = |beta| / z with z = 3.73 for p = 1.9e-4, giving se ~ 0.0016, but the exact two-sided z depends on
      the reported precision of the p-value and the paper does not state the test, so this is left
      unrecorded rather than guessed.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      NEGATIVE = genetic liability to Alzheimer disease CAUSES SHORTER SLEEP. This is the reverse-direction
      finding the task asked for and it is the strongest genetic evidence that the sleep-dementia
      association runs at least partly backwards. Magnitude is very small on the GWAS scale.
    covariates: ["IVW, weighted median and MR-Egger all concordant; sensitivity analysis excluding APOE SNPs rs7412 and rs429358"]
    followup_years: null
    cohort_family: "UK_Biobank_exposure"
    quote: "We found that higher risk of AD was significantly associated with being a “morning person” (odds ratio [OR] 1.01, p = 0.001), shorter sleep duration (self-reported: β = −0.006, p = 1.9 × 10 −4 ; accelerometer based: β = −0.015, p = 6.9 × 10 −5 ), less likely to report long sleep (β = −0.003, p = 7.3 × 10 −7 ), earlier timing of the least active 5 hours (β = −0.024, p = 1.7 × 10 −13 ), and a smaller number of sleep episodes (β = −0.025, p = 5.7 × 10 −14 ) after adjustment for multiple comparisons."
