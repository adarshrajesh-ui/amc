    scale: hours
    unit: "hours of nocturnal sleep at the risk minimum"
    value: 5.8
    se: null
    ci: [5.6, 6.0]
    conversion_formula: >
      The paper prints the nadir as a RANGE, "roughly 5.6-6 hours". value = 5.8 is the midpoint of that
      printed range and is the shard's arithmetic, not the paper's; ci carries the printed range itself
      (5.6, 6.0), which is a REPORTED RANGE AND NOT A CONFIDENCE INTERVAL. se is null because a spline nadir
      has no standard error in this paper.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      NOT A HARM ESTIMATE. This is the location of the risk minimum. It is the most surprising number in this
      shard and it points AGAINST the channel: in the largest dose-response synthesis of nocturnal sleep and
      cognitive disorders, risk is LOWEST at roughly 5.6-6 h of self-reported nocturnal sleep, and rises
      significantly only BELOW 4 h or ABOVE 10 h. The subject's weekday sleep of 5-6 h sits AT OR ADJACENT TO
      THE NADIR of this curve, not on its ascending limb. Treat this cautiously - it is self-reported sleep in
      cohorts aged 51-83, and a nadir below population mean sleep is itself a signature of confounding or of
      over-reporting by the unwell - but it must not be omitted, because it is the direct dose-response
      answer to the question the factory is asking and it does not support the alarming reading.
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "Specifically, as for the sleep duration at night, the optimal duration was found to be roughly 5.6-6 hours for lower risk of cognitive disorder ( figure 5A ) and 5.6-7 hours for lower risk of AD ( figure 5B ). The risk of cognitive disorder ( figure 5A ) or AD ( figure 5B ) will be significantly elevated when the nocturnal sleep duration is over 10 hours or less than 4 hours."
rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: >
    Large, well-conducted update (11,155 records screened, 51 cohorts, prespecified evidence-credibility
    grading, restricted-cubic-spline dose-response via robust-error meta-regression). Concerns that matter
    here: (1) the primary outcome for the largest strata is the COMPOSITE "dementia or cognitive decline",
    which mixes a hard endpoint with continuous test-score change; (2) heterogeneity for the short-sleep
    stratum is substantial (I-squared = 57%) and for long sleep higher still (69%); (3) all sleep exposures
    are self-reported; (4) the authors themselves rate follow-up inadequacy and poor generalisability as major
    bias sources - verbatim: "Poor generalisability, follow-up inadequacy and attrition are major sources of
    bias"; (5) no lag analysis excluding early cases is reported for sleep duration, so reverse causation is
    unaddressed for these specific pooled estimates. The authors also state the causal caveat explicitly:
    "the associations identified by the analyses based on observational cohort studies were not equal to
    causal relationships."
funding: "see paper (National Natural Science Foundation of China and related grants)"
notes: >
  THE MOST INFORMATIVE DOSE-RESPONSE META-ANALYSIS FOR THIS SHARD, and the one that most directly undercuts
  the alarming reading of the channel.
  POPULATION AND FOLLOW-UP, VERBATIM: "All studies are prospective cohort studies with populations from North
  America (two in Canada and seven in America), Europe (one in Finland, one in Spain and two in Sweden) and
  East Asia (one in China, one in South Korea and two in Japan). The mean age varied from 51 to 83 years old
  and the mean follow-up varied from 1 to 22.6 years." The n and n_studies_pooled fields carry the
  13-cohort/53,014-participant short-sleep stratum; 17 cohorts contributed to the dose-response splines and
  21 reported sleep duration in total.
  NONLINEARITY, VERBATIM: "The dose-response analyses revealed significant nonlinear associations between
  sleep duration and risks of cognitive disorders (p=0.0003 for nocturnal and p=0.017 for total daily
  duration) or AD (p=0.018 for nocturnal)."
  WHAT THE PATTERN ACROSS THIS PAPER'S OWN TABLE 2 MEANS. For nocturnal sleep the long-sleep estimate exceeds
  the short-sleep estimate for every outcome, and for AD specifically the short-sleep estimate is exactly
  null while the long-sleep estimate is the strongest and most homogeneous result in the paper. For the
  glymphatic hypothesis to explain this table, the mechanism would have to act through long sleep, which it
  cannot. The parsimonious reading is that the dominant signal in this literature is prodromal disease
  lengthening sleep, plus a weak and unstable short-sleep signal attached to a soft composite outcome.
  ALSO NOTE what this paper found for CHANGE in sleep duration, verbatim: "Meta-analyses of change in sleep
  duration found that increased duration rather than reduced duration could significantly elevate the risk of
  cognitive disorders in non-demented elderly." Again: lengthening, not shortening.
  EXPOSURE AGES 51-83. Nothing here bears on adolescence.
shard: "s14_dementia_amyloid"
