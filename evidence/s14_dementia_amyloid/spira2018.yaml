effects:
  - outcome_domain: neurodegeneration
    outcome_construct: amyloid_positive_pib_pet_status_15_years_after_baseline_excessive_daytime_sleepiness
    exposure: {type: other, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "self-reported excessive daytime sleepiness at baseline (mean age 60.1 y) vs none, predicting Ab-positive PiB PET status a mean of 15.7 years later; fully adjusted"}
    scale: log_or
    unit: null
    value: 1.01160
    se: 0.47259
    ci: [0.08618, 1.93874]
    conversion_formula: >
      OR = 2.75, 95% CI 1.09-6.95 (adjusted for age, age^2, sex, education and BMI).
      log_or = ln(2.75) = 1.01160; se = (ln(6.95) - ln(1.09))/3.92 = (1.93874 - 0.08618)/3.92 = 0.47259.
      The unadjusted estimate was OR = 3.37 (1.44-7.90), log_or = 1.21491, se = 0.43424.
    from_figure: false
    inferred_from_ci: true
    direction_note: >
      POSITIVE = excessive daytime sleepiness at baseline predicts amyloid positivity ~16 years later, i.e.
      harm. EXPOSURE IS NOT SLEEP DURATION - it is excessive daytime sleepiness, a SYMPTOM whose commonest
      causes are sleep-disordered breathing and insufficient sleep. The authors are explicit that the
      interpretation depends on that: they write "If common EDS causes (e.g., sleep-disordered breathing,
      insufficient sleep) are associated with temporally distal AD biomarkers, this could have important
      implications for AD prevention" - a conditional, not a finding. The confidence interval is very wide
      (1.09-6.95) and the lower bound is only just above 1.
    covariates: ["age", "age squared", "sex", "education", "body mass index"]
    followup_years: 15.7
    cohort_family: "BLSA"
    quote: "In unadjusted analyses, compared with participants without EDS, those with EDS had more than 3 times the odds of being Aβ+ at follow-up (odds ratio [OR] = 3.37, 95% confidence interval [CI]: 1.44, 7.90, p = 0.005), and 2.75 times the odds after adjustment for age, age2, sex, education, and body mass index (OR = 2.75, 95% CI: 1.09, 6.95, p = 0.033)."
