    se: 0.47777
    ci: [-0.31471, 1.55814]
    conversion_formula: >
      OR = 1.86, 95% CI 0.73-4.75 (adjusted). log_or = ln(1.86) = 0.62058;
      se = (ln(4.75) - ln(0.73))/3.92 = (1.55814 - (-0.31471))/3.92 = 0.47777.
      Unadjusted was OR = 2.01 (0.90-4.50), p = 0.091, also non-significant.
    from_figure: false
    inferred_from_ci: true
    direction_note: >
      POSITIVE point estimate, CI CROSSES THE NULL both before and after adjustment (p = 0.091 unadjusted,
      p = 0.194 adjusted). NULL. Recorded because it shows the EDS finding is not a generic
      "any-sleep-complaint" effect and because it is the reciprocal of Anderson 2021's MR finding that
      napping looks PROTECTIVE.
    covariates: ["age", "age squared", "sex", "education", "body mass index"]
    followup_years: 15.7
    cohort_family: "BLSA"
    quote: "There was a trend-level unadjusted association between napping and Aβ status (OR = 2.01, 95% CI: 0.90, 4.50, p = 0.091) that became nonsignificant after adjustment (OR = 1.86, 95% CI: 0.73, 4.75, p = 0.194)."
rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: >
    Uniquely long exposure-to-outcome interval for a sleep-amyloid study (mean 15.7 +/- 3.4 years, range 6.9
    to 24.6), which is its distinctive strength and the reason it is included despite the exposure mismatch.
    Concerns: (1) exposure is two single self-report items, not measured sleep; (2) n = 124 with a binary
    amyloid-positive outcome, giving very wide intervals; (3) baseline age 60.1 +/- 9.8 y with range to 82.7,
    so many participants were already in the preclinical Alzheimer's window even at baseline despite the long
    lag; (4) survivor bias is severe by construction - participants had to live and remain in the study long
    enough to be scanned 16 years later; (5) an erratum was published (Sleep 2018;41(12), doi
    10.1093/sleep/zsy184) whose content this shard did not retrieve; (6) same BLSA cohort as spira2013.yaml,
    so the two records are correlated and must not be double-counted.
funding: "NIH / National Institute on Aging Intramural Research Program; see paper"
notes: >
  THE LONGEST-LAG SLEEP-TO-AMYLOID STUDY IN THE LITERATURE, and therefore the single best available answer to
  the task's question "does sleep in midlife predict later amyloid burden?". The honest answer it gives:
  EXCESSIVE DAYTIME SLEEPINESS at around age 60 predicts amyloid positivity around age 76, with an adjusted
  odds ratio of 2.75 and a confidence interval from 1.09 to 6.95. SLEEP DURATION WAS NOT THE EXPOSURE and
  napping was null.
  Even taken at maximum face value this does not reach the subject. The youngest baseline participant was
  36.2 years old; the mean was 60.1. There is NO cohort anywhere in this literature with sleep measured in the
  teens or twenties and amyloid or dementia measured decades later.
  Note the direction of the confound: excessive daytime sleepiness in a 60-year-old is a marker of
  sleep-disordered breathing and of poor health generally. Reading this study as evidence that voluntarily
  short sleep in a healthy 19-year-old causes amyloid deposition requires two substitutions the data do not
  support - swapping a symptom for a behaviour, and swapping age 60 for age 19.
shard: "s14_dementia_amyloid"
