    ci: null
    conversion_formula: >
      A DELIBERATE NULL. The paper states the FTRs and delay times "were not significantly different
      between groups", so the point estimate of the between-arm difference in clearance is coded as 0.
      No numeric FTR values or SEs are printed in the retrievable text, so se is null. The paper does
      quantify the study's sensitivity to detect a clearance change: "changes in FTR as small as 5%
      resulted in a noticeable change in peak shape", i.e. the null is not merely underpowered noise.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      ZERO = NO detectable change in Ab clearance rate. This is the most important mechanistic result in
      the shard: in humans, one night of sleep deprivation raised Ab by raising PRODUCTION, not by
      impairing clearance. That directly undercuts the glymphatic-clearance story as the operative human
      mechanism, independently of whether Xie 2013 or Miao 2024 is right about mice.
    covariates: []
