    quote: "Formal modeling analysis revealed that the FTRs and delay times were not significantly different between groups ( Figure 1I ; Table 2 ), which strongly suggests a lack of sleep pattern on the overall clearance processes of brain peptides. Since production rate is directly proportional to concentration in the model ( 14 ), overnight Aβ production rate in the sleep-deprived group was increased 30%."
rob:
  tool: RoB2
  judgement: high
  notes: >
    The authors call it a "pilot study". n = 8 total, with participants contributing to multiple arms
    (4 completed all three, 4 completed two), so the effective independent sample is very small.
    Randomized with an active comparator (sodium oxybate) and serial CSF sampling every 2 h for 36 h,
    which is a strong protocol, but the sample size means every estimate is fragile and no SE is
    published for the headline 30%. The sodium oxybate arm failed as a manipulation - time in slow wave
    sleep was not significantly increased - so the sleep-ENHANCEMENT half of the design is uninformative.
funding: "NIH; see paper acknowledgements"
notes: >
  MECHANISM LINK 2/3, and the key mechanistic REFRAME. The chain that popular writing asserts is
  "sleep loss -> impaired glymphatic clearance -> amyloid accumulates -> Alzheimer's". This study tested
  the second arrow directly in humans and found it absent. Verbatim on the implication:
  "The SILK kinetics results unequivocally show that glymphatic clearance alone, without compensation
  from other clearance mechanisms, would be ineffective in protecting the brain from AD because overall
  clearance rates are not changing. Glymphatic clearance may potentially contribute to the protective
  effects of sleep against AD, but changes in production rate seem to be the necessary and critical
  factor."
  WHY THIS MATTERS FOR REVERSIBILITY: a production-driven mechanism is intrinsically reversible on the
  timescale of the production change - if Ab rises because a waking brain makes more of it, then
  concentrations fall again when normal sleep resumes, which is exactly the overnight oscillation Ooms
  2014 documented in the control arm. A clearance-failure mechanism would be the one that implies a
  ratchet. The human data support the reversible mechanism, not the ratchet. This does not prove full
  reversal - nobody has measured it (see dementia_summary.md) - but it shifts the prior substantially.
shard: "s14_dementia_amyloid"
