    unit: "direction of difference in percentage clearance at peak (sleep minus wake)"
    value: -1.0
    se: null
    ci: null
    conversion_formula: >
      The paper reports the direction and significance but the percentage-clearance values themselves are
      shown only as bar/violin plots (Fig 2h-k) with 95% CIs drawn graphically; no numeric group means or
      SEs are printed in text or in Extended Data Table 1 for the sleep-vs-wake contrast. The only printed
      numeric anchor is that peak clearance was "70-80% with saline-injected controls" (i.e. awake), and
      that clearance was significantly REDUCED during sleep (two-tailed paired t-test, P = 0.016). Because
      no numeric effect magnitude is published, value is coded as a sign indicator (-1 = clearance lower
      during sleep) and se is null. This record must NOT enter an inverse-variance pool; it exists to
      register a direct contradiction of xie2013.
    from_figure: true
    inferred_from_ci: false
    direction_note: >
      NEGATIVE = clearance was LOWER during sleep than during wakefulness, i.e. the OPPOSITE sign to
      Xie 2013. Same species (mouse), a within-animal design, and a tracer that moves freely in
      extracellular space rather than one delivered into CSF. The authors also report that deeper sleep
      was associated with LESS clearance ("a weak negative correlation between peak clearance and delta
      (0.5-4 Hz) power ... implying that the deeper the sleep, the lower the clearance"), which inverts
      the slow-wave-activity-drives-clearance premise of the popular account.
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "It has been suggested that the function of sleep is to actively clear metabolites and toxins from the brain. Enhanced clearance is also said to occur during anesthesia. Here, we measure clearance and movement of fluorescent molecules in the brains of male mice and show that movement is, in fact, independent of sleep and wake or anesthesia. Moreover, we show that brain clearance is markedly reduced, not increased, during sleep and anesthesia."
