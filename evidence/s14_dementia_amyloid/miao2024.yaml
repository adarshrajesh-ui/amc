rob:
  tool: none
  judgement: na
  notes: >
    Not a clinical study; tier TX. This record is included specifically because it falsifies the
    directional claim that the entire popular "sleep clears amyloid, so sleep loss causes Alzheimer's"
    chain rests on. The authors identify the methodological reason for the disagreement with Xie 2013:
    Xie and most successors infused tracer into CSF and measured how far it penetrated into parenchyma,
    which confounds entry, exit and redistribution, whereas Miao injected tracer directly into
    parenchyma. Limitations of Miao: male mice only; a single small (~570 Da) freely diffusing dye, so
    larger molecules including Ab may behave differently (the authors say so explicitly); anaesthesia
    contrasts dominate the dataset; no amyloid, plaque or cognitive outcome. Neither Xie nor Miao
    measures anything in a human.
funding: "Wellcome Trust and UK Dementia Research Institute (see paper acknowledgements)"
notes: >
  MECHANISM LINK 1, DISCONFIRMING. Sample size: n = 13 mice in the sleep condition (11 for the WAKE
  vigilance-state percentages). Verbatim on the vigilance-state verification: "During the sleep
  experiments, mice were first sleep deprived by placing novel objects in their cage and after 5 hours
  were then allowed to sleep. ... During the first five hours the vigilance state percentages were:
  WAKE 9.3% ( n = 11 mice), NREM 80.8% ( n = 13 mice), REM 9.9% ( n = 13 mice), TOTAL SLEEP 90.7%
  ( n = 13 mice)." The authors' own summary of the implication: "Whatever the mechanism, however, our
  results challenge the idea that the core function of sleep is to clear toxins from the brain."
  Downstream consumers MUST treat glymphatic clearance in mice as a CONTESTED mechanism with two
  primary studies of opposite sign, not as established fact.
