effects:
  - outcome_domain: neurodegeneration
    outcome_construct: alzheimers_disease_risk_per_additional_hour_of_genetically_instrumented_sleep
    exposure: {type: per_hour_less_sleep, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "per additional hour/day of genetically instrumented sleep duration -> Alzheimer's disease (IGAP: 17,008 cases / 37,154 controls), IVW MR"}
    scale: log_or
    unit: null
    value: -0.11653
    se: 0.14439
    ci: [-0.40048, 0.16551]
    conversion_formula: >
      OR = 0.89 per additional hour/day, 95% CI 0.67-1.18. log_or = ln(0.89) = -0.11653;
      se = (ln(1.18) - ln(0.67))/3.92 = (0.16551 - (-0.40048))/3.92 = 0.14439.
      SIGN CONVENTION: the exposure is per hour MORE sleep. To express per hour LESS sleep, negate:
      log_or = +0.11653 with the same SE, i.e. an OR of 1.12 per hour less, CI 0.85-1.49.
    from_figure: false
    inferred_from_ci: true
    direction_note: >
      NEGATIVE point estimate per hour MORE sleep would mean more sleep is protective, but THE CI CROSSES
      THE NULL (P = 0.41) and the point estimate is essentially null. Expressed the other way round: each
      hour LESS of genetically predicted sleep gives an Alzheimer's OR of 1.12 (0.85-1.49). NULL RESULT.
    covariates: ["IVW primary; MR-Egger and weighted median as sensitivity analyses; non-linear piecewise MR also fitted"]
    followup_years: null
    cohort_family: "UK_Biobank_exposure_IGAP_outcome"
    quote: "There was little evidence to support associations of increased sleep duration with decline in visual memory [odds ratio (OR) per additional hour/day of sleep = 1.10 (95% CI = 0.76–1.57); P = 0.62], decline in reaction time [OR = 1.28 (95% CI = 0.49–3.35); P = 0.61], all-cause dementia [OR = 1.19 (95% CI = 0.65–2.19); P = 0.57] or Alzheimer’s disease risk [OR = 0.89 (95% CI = 0.67–1.18); P = 0.41]."
  - outcome_domain: neurodegeneration
    outcome_construct: all_cause_dementia_risk_per_additional_hour_of_genetically_instrumented_sleep
    exposure: {type: per_hour_less_sleep, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "per additional hour/day of genetically instrumented sleep duration -> hospital-diagnosed all-cause dementia in UK Biobank"}
    scale: log_or
    unit: null
    value: 0.17395
    se: 0.30987
    ci: [-0.43078, 0.78390]
    conversion_formula: >
      OR = 1.19 per additional hour/day, 95% CI 0.65-2.19. log_or = ln(1.19) = 0.17395;
      se = (ln(2.19) - ln(0.65))/3.92 = (0.78390 - (-0.43078))/3.92 = 0.30987. Negate for per-hour-less.
    from_figure: false
    inferred_from_ci: true
    direction_note: >
      POSITIVE point estimate per hour MORE sleep, i.e. if anything MORE sleep looks harmful here - the
      opposite direction to Alzheimer's in the same study. CI is very wide (0.65-2.19, P = 0.57). NULL and
      DIRECTIONALLY INCONSISTENT with the Alzheimer's estimate from the same instruments, which is itself
      informative: with this much imprecision the sign is not identified.
    covariates: ["as above"]
    followup_years: null
    cohort_family: "UK_Biobank"
    quote: "There was little evidence to support associations of increased sleep duration with decline in visual memory [odds ratio (OR) per additional hour/day of sleep = 1.10 (95% CI = 0.76–1.57); P = 0.62], decline in reaction time [OR = 1.28 (95% CI = 0.49–3.35); P = 0.61], all-cause dementia [OR = 1.19 (95% CI = 0.65–2.19); P = 0.57] or Alzheimer’s disease risk [OR = 0.89 (95% CI = 0.67–1.18); P = 0.41]."
  - outcome_domain: cognition
    outcome_construct: reaction_time_and_visual_memory_per_additional_hour_of_genetically_instrumented_sleep
    exposure: {type: per_hour_less_sleep, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "per additional hour/day of genetically instrumented sleep duration -> baseline reaction time and visual memory errors, linear MR"}
    scale: pct_change
    unit: "percent slower reaction time per additional hour/day of sleep"
    value: 1.0
    se: null
    ci: [0.0, 2.0]
    conversion_formula: >
      Reported as "each additional hour/day of sleep was associated with 1% [95% confidence interval
      (CI) = 0–2%; P = 0.008] slower reaction time and 3% more errors in visual-memory test (95%
      CI = 0–6%; P = 0.05)". The bracket in ci is the PUBLISHED 95% CI on the percentage scale
      (0% to 2%). se is left null because the interval is reported to only one significant figure
      (a 0-2% interval implies se ~ 0.51 percentage points, but the rounding makes that unreliable).
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      POSITIVE = MORE genetically predicted sleep is associated with SLOWER reaction time and MORE memory
      errors, i.e. the significant cognitive findings in this MR point AGAINST more sleep, not in favour of
      it. Both CIs have a lower bound of exactly 0. Included because it is the only nominally significant
      result in the paper and because it cuts against the simple "more sleep is better for the brain"
      reading. The authors' non-linear analysis found both short AND long sleep worse, which is the more
      defensible summary.
    covariates: ["as above; non-linear piecewise MR with 3 and 10 strata"]
    followup_years: null
    cohort_family: "UK_Biobank"
    quote: "Linear MR suggested that each additional hour/day of sleep was associated with 1% [95% confidence interval (CI) = 0–2%; P = 0.008] slower reaction time and 3% more errors in visual-memory test (95% CI = 0–6%; P = 0.05). ... Non-linear MR suggested that both short and long sleep duration were associated with poorer visual memory ( P for non-linearity = 3.44e –9 ) and reaction time ( P for non-linearity = 6.66e –16 )."
rob:
  tool: MR-STROBE
  judgement: some_concerns
  notes: >
    Large (395,803 UK Biobank participants) with both linear and non-linear (piecewise / LACE) MR, plus
    MR-Egger and weighted median sensitivity analyses. Concerns: (1) the dementia outcome is
    hospital-diagnosed dementia in UK Biobank, which is substantially incomplete ascertainment in a cohort
    aged 40-69 at baseline, so the dementia case count is small and the CI enormous; (2) the AD outcome
    comes from IGAP, so the same modest 17,008-case GWAS limits power as in Anderson 2021; (3) non-linear
    MR by residual stratification is sensitive to the constant-genetic-effect assumption; (4) exposure is
    lifetime genetic sleep propensity in middle-aged adults, not adolescent restriction.
funding: "See paper"
notes: >
  SECOND INDEPENDENT TIER-3 NULL for sleep duration on dementia and Alzheimer's, from a different group and
  a partly different design (individual-level UK Biobank, linear and non-linear) than Anderson 2021.
  Convergence of two independent MR studies on a null - plus Huang 2020, Guo 2024, Yuan 2022 and the ELSA
  MR in Psychiatry Research 2024, all null for duration - is the strongest single fact in this shard.
  The authors' own conclusion is nonetheless framed positively on the COGNITION (not dementia) side:
  "Linear increase in sleep duration has a small negative effect on reaction time and visual memory, but
  the true association might be non-linear, with evidence of associations for both short and long sleep
  duration. These findings suggest that sleep duration may represent a potential causal pathway for
  cognition." Note carefully: that conclusion is about COGNITIVE TEST PERFORMANCE, not about dementia, and
  the reported dementia and AD estimates in the same paper are null. Popular summaries routinely
  transplant the cognition conclusion onto the dementia outcome. They are different results in the same
  paper and must not be merged.
shard: "s14_dementia_amyloid"
