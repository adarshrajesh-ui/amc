    quote: "At the molecular level, CSS disrupted hippocampal proteostasis-particularly protein folding processes-and triggered ER stress and activation of the unfolded protein response (UPR). Importantly, disrupted proteostasis preceded the behavioral decline, with diminution of the key chaperone and UPR regulator BiP occurring at 20-22 weeks of age."
rob:
  tool: none
  judgement: high
  notes: >
    UNPEER-REVIEWED PREPRINT, mouse model, abstract-only access, no group sizes, no effect magnitudes, no
    variance estimates, no blinding information, no randomisation information. There is no basis for a
    quantitative risk-of-bias judgement, and "high" here means "cannot be assessed and must not be relied
    upon quantitatively" rather than a specific identified flaw. Additional design limitation relevant to the
    shard's question: the exposure is continuous for the whole observation period, so the study cannot address
    whether a TIME-LIMITED early exposure followed by normal sleep leaves a durable trace - which is precisely
    the subject's situation.
funding: "not stated in the retrieved abstract"
notes: >
  THIS IS THE ONLY RECORD IN THE SHARD WHOSE STATED FRAMING IS EARLY-LIFE CHRONIC SHORT SLEEP AND LONG-RUN
  NEURODEGENERATIVE OUTCOME, AND IT IS A MOUSE PREPRINT WITH NO EXTRACTABLE NUMBERS. That sentence is the
  honest summary of the state of evidence on the shard's critical age question.
  THE AUTHORS' OWN MOTIVATION EXPLICITLY INVOKES ADOLESCENCE, verbatim: "Chronic short sleep (CSS) is an
  emerging public health issue that frequently begins in adolescence and is common among healthcare
  professionals and others engaged in shift work. Epidemiological studies associate CSS and sleep disruption
  with metabolic disorders, cardiovascular disease, cognitive decline, and heightened Alzheimer's disease
  risk." Note carefully that the adolescent framing is in the MOTIVATION, and the experiment is in YOUNG ADULT
  MICE. The paper does not claim to have modelled adolescent exposure, and the shard must not upgrade its
  motivation into its design.
  CONCLUSION AS STATED, verbatim: "Together, these results indicate that both chronic short sleep and age
  compromise proteostasis and promote neuroinflammation, contributing to progressive cognitive dysfunction."
  ONE FINDING WORTH FLAGGING FOR OTHER SHARDS: the authors report that ageing alone produced the same
  molecular signature as chronic short sleep - verbatim: "Age also seemed to be a cellular stressor, causing a
  longitudinal increase in UPR, ISR, and neuroinflammation markers." When an exposure and normal ageing
  produce the same markers, marker changes cannot by themselves establish that the exposure accelerates
  ageing; that requires showing the marker trajectory is shifted or steepened, which cannot be assessed from
  this abstract.
  HOW THIS RECORD SHOULD BE USED. As the citation demonstrating that the adolescent-exposure question is being
  asked and is currently answered only in rodents, with a non-amyloid mechanism, in a preprint. NOT as evidence
  of a human risk magnitude. Any numeric dementia-risk delta for a 19-year-old that leans on this record is
  extrapolating from mouse hippocampal chaperone expression to human dementia incidence sixty years later.
shard: "s14_dementia_amyloid"
