    direction_note: >
      1 = disruption reported. CRITICAL FOR THE SHARD'S MECHANISTIC CHAIN: THE PATHWAY HERE IS NOT THE
      GLYMPHATIC / AMYLOID-CLEARANCE PATHWAY. The reported mechanism is proteostasis failure, endoplasmic
      reticulum stress, the unfolded protein response, loss of the chaperone BiP, and neuroinflammation.
      AMYLOID IS NOT MENTIONED ANYWHERE IN THIS ABSTRACT, and neither is tau or glymphatic clearance. So the
      single most age-relevant experimental study the shard could find, in the direction of harm, does NOT
      support the amyloid-clearance mechanism this shard was asked to evaluate - it proposes a different one.
      That matters: it means the mechanistic literature is not converging on one causal story that adolescent
      restriction would feed into, it is offering several unlinked candidate stories in rodents.
