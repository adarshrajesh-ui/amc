    conversion_formula: >
      Reported as beta = 0.04, CI = [-0.04, 0.11], p = 0.352 for the PSQI-global-by-time interaction in
      Model 1. se = (0.11 - (-0.04))/3.92 = 0.15/3.92 = 0.038265.
      SCALE FIELD CAVEAT: `per_hour_beta` is used because the schema's enum has no generic
      "per-unit-of-exposure beta" option; the unit here is PER PSQI POINT, NOT PER HOUR OF SLEEP, and the
      `unit` field states this. The pooler MUST NOT treat this as an hours-of-sleep coefficient.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
