    scale: per_hour_beta
    unit: "Centiloid per year per 1-point increase in PSQI global score"
    value: 0.03
    se: 0.033163
    ci: [-0.04, 0.09]
    conversion_formula: >
      Table 3, "Amyloid negative (N = 309), PSQI x visit years, 0.03, [-0.04, 0.09], p = 0.395".
      se = (0.09 - (-0.04))/3.92 = 0.13/3.92 = 0.033163. Same per-PSQI-point unit caveat as above.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      NULL (p = 0.395), AND THIS IS THE MOST TRANSPORTABLE STRATUM IN THE STUDY. Among the 309 participants
      who had not yet begun accumulating amyloid, subjective sleep quality predicted nothing about their
      subsequent amyloid trajectory. The positive finding in this paper is confined to the 85 "grey-zone"
      participants who had ALREADY started accumulating amyloid at baseline. A 19-year-old is, with
      overwhelming probability, in the amyloid-negative state. The stratum that matches him is the null one.
    covariates: ["age", "sex", "APOE status", "cohort", "presence of anxiety or depression"]
    followup_years: 2.8
    cohort_family: "AMYPAD_PNHS"
    quote: "Table 3.  Stratified results  Amyloid burden   Predictors  Estimates  CI   p value   Amyloid negative ( N = 309)    PSQI x visit years  0.03  [-0.04, 0.09]  0.395   Grey-zone ( N = 85)    PSQI x visit years  0.28  [0.06, 0.50]  0.013 *   Amyloid positive ( N = 23)    PSQI x visit years  -0.29  [-0.77, 0.19]  0.232"
  - outcome_domain: neurodegeneration
