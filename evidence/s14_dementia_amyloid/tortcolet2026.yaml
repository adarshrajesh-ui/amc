    exposure: {type: other, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "PSQI global x visit years in the GREY-ZONE stratum (baseline Centiloid 12-50), n = 85 - participants already accumulating amyloid"}
    scale: per_hour_beta
    unit: "Centiloid per year per 1-point increase in PSQI global score"
    value: 0.28
    se: 0.112245
    ci: [0.06, 0.50]
    conversion_formula: >
      Table 3, "Grey-zone (N = 85), PSQI x visit years, 0.28, [0.06, 0.50], p = 0.013".
      se = (0.50 - 0.06)/3.92 = 0.44/3.92 = 0.112245. Same per-PSQI-point unit caveat.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      POSITIVE = worse subjective sleep quality predicts faster amyloid accumulation, in the 85 people who
      were ALREADY in the amyloid grey zone. This is the paper's headline, and it is a subgroup finding in
      20% of the sample, uncorrected for multiple comparisons by the authors' own admission, in people whose
      pathology had already started. It is the single best piece of prospective human evidence that sleep and
      amyloid accumulation are linked, and its scope conditions are severe: sleep QUALITY not duration,
      already-accumulating adults at mean age 63, over 2.8 years.
    covariates: ["age", "sex", "APOE status", "cohort", "presence of anxiety or depression"]
    followup_years: 2.8
    cohort_family: "AMYPAD_PNHS"
    quote: "Worse sleep quality predicted faster Ab accumulation in individuals with intermediate baseline amyloid burden categorized in the GZ group (b = 0.28, CI = [0.06, 0.50], p = 0.013)."
  - outcome_domain: neurodegeneration
    outcome_construct: rate_of_amyloid_accumulation_per_psqi_point_amyloid_positive_stratum_SIGN_REVERSAL
    exposure: {type: other, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "PSQI global x time in AMYLOID-POSITIVE participants relative to amyloid-negative (interaction contrast), n = 23 A+ participants"}
    scale: per_hour_beta
    unit: "Centiloid per year per 1-point increase in PSQI global score, A+ relative to A-"
    value: -0.41
    se: 0.160714
    ci: [-0.73, -0.10]
    conversion_formula: >
      Reported as beta = -0.41 CL/year per PSQI point, CI = [-0.73, -0.10], p = 0.010, for A+ relative to A-.
      se = (-0.10 - (-0.73))/3.92 = 0.63/3.92 = 0.160714. Same per-PSQI-point unit caveat.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      NEGATIVE AND STATISTICALLY SIGNIFICANT IN THE WRONG DIRECTION: among amyloid-positive participants,
      WORSE sleep quality predicted SLOWER amyloid accumulation (p = 0.010). The authors label this
      "Paradoxically". Recorded because a literature in which the same exposure significantly accelerates the
      outcome in one stratum and significantly decelerates it in another, in the same model, is not a
      literature from which a stable causal coefficient can be extracted. Note n = 23 in this stratum.
    covariates: ["age", "sex", "APOE status", "cohort", "presence of anxiety or depression"]
    followup_years: 2.8
    cohort_family: "AMYPAD_PNHS"
    quote: "In contrast, for A+ participants, worse sleep quality was associated with slower Ab accumulation relative to the A- group (b = -0.41 CL/year per PSQI point, CI = [-0.73, -0.10], p = 0.010) (Fig. 1 )."
rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: >
    Genuinely strong design for the biomarker question: 417 clinically unimpaired adults, serial quantitative
    amyloid PET harmonised to the Centiloid scale, linear mixed-effects models adjusted for age, sex, APOE,
    cohort and mood, plus sensitivity analyses excluding A+ participants and excluding people with anxiety or
    depression. Concerns: (1) exposure is a single baseline PSQI, i.e. subjective sleep QUALITY, and the
    authors note the global score "may not capture specific sleep features that are more closely linked to Ab
    burden"; (2) follow-up is short - 81% had one repeat scan at mean 2.8 y and only 19% had two spanning
    5.3 y; (3) the positive result is a 20%-of-sample subgroup and the authors state they did not correct for
    multiple comparisons in these analyses; (4) n = 23 in the A+ stratum that produced the significant reversed
    effect; (5) participants are enriched for APOE e4 (43% carriers), so this is not a general population;
    (6) mean age 63, three decades older than the subject.
funding: "AMYPAD (Innovative Medicines Initiative / EU-EFPIA); see paper"
notes: >
  THE NEWEST AND LARGEST PROSPECTIVE SLEEP-TO-AMYLOID-ACCUMULATION STUDY, AND ITS MAIN EFFECT IS NULL. This
  matters because winer2020.yaml (n = 32) is the only other prospective sleep-forecasts-amyloid study in the
  shard, and it also found that sleep DURATION did not forecast accumulation - only specific NREM slow-wave
  frequencies and sleep efficiency did. Two prospective studies, neither of which supports sleep duration as a
  predictor of amyloid accumulation.
  THE AUTHORS' OWN SUMMARY OF SCOPE, VERBATIM: "Our main conclusion is that worse self-reported sleep quality
  at baseline is associated with an increased rate of Ab accumulation over time only in individuals with
  intermediate baseline Ab levels (i.e., those who have begun accumulating amyloid but are still in the grey
  zone). Paradoxically, we observed an unexpected association whereby poorer self-reported sleep quality at
  baseline was linked to a lower Ab accumulation over time, only in individuals who were amyloid-positive at
  baseline." And: "Cross-sectionally, we did not observe an association between self-reported sleep quality and
  Ab burden."
  THE AUTHORS' OWN EPISTEMIC STATUS FOR THEIR FINDING, VERBATIM: "Given the limited sample size in the A+
  group, these findings should be interpreted with caution. Replication in independent cohorts is necessary,
  and the results should be considered hypothesis-generating rather than confirmatory."
  WHY THE STRATIFICATION IS THE MOST IMPORTANT THING IN THIS RECORD. The effect exists only in people who had
  ALREADY begun accumulating amyloid. In the 309 amyloid-negative participants - the group whose biology most
  resembles a healthy 19-year-old - the coefficient is 0.03 with a CI spanning zero. If the sleep-amyloid link
  requires pre-existing pathology to manifest, then it is a modifier of an ongoing disease process in older
  adults rather than an initiator of pathology in the young, and the entire premise of extrapolating it back to
  adolescence is misconceived. The paper's own framing supports the older-adult reading: it describes the
  finding as "identifying an optimal intervention window", i.e. a window in mid-to-late life, not in youth.
  SAMPLE CHARACTERISTICS, VERBATIM: "The sample included 417 CU adults (mean age 63 years; 60% females; 43%
  APOE -e4 carriers). Among them, 24.5% reported symptoms of anxiety (23.5%) and/or depression (7.0%). The
  average PSQI global score was 5.78 +/- 0.17."
