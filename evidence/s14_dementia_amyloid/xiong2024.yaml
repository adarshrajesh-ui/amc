effects:
  - outcome_domain: neurodegeneration
    outcome_construct: incident_dementia_long_sleep_over_8h_vs_7_to_8h
    exposure: {type: other, dose_h: null, referent_h: 7.5, duration_days: null,
               contrast_label: "self-reported long sleep >8 h/night vs ideal 7-8 h/night, adults aged 65+, mean 8 (SD 2.9) y follow-up"}
    scale: log_hr
    unit: null
    value: 0.494696
    se: null
    ci: null
    conversion_formula: >
      The abstract states long sleep was "associated with 64 % increased risk of incident dementia".
      Read as HR = 1.64, log_hr = ln(1.64) = 0.494696. NO CONFIDENCE INTERVAL IS GIVEN ANYWHERE IN THE
      RETRIEVED ABSTRACT and the shard could not obtain the full text, therefore se is NULL and no interval is
      recorded. Do not impute one.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      POSITIVE = higher dementia hazard with LONG sleep. Point estimate only; the pooler must either exclude
      this effect for lack of variance or handle it with an explicitly assumed SE, flagged as such.
    covariates: ["Cox regression, covariate set not recoverable from the abstract"]
    followup_years: 8.0
    cohort_family: "ELSA"
    quote: "Long sleep duration (>8 h) was associated with 64 % increased risk of incident dementia and 2-fold high risk of AD compared to ideal sleep duration (7-8 h)."
  - outcome_domain: neurodegeneration
    outcome_construct: incident_dementia_short_sleep_under_7h_direction_reverses_by_age_stratum
    exposure: {type: habitual_short_sleep, dose_h: null, referent_h: 7.5, duration_days: null,
               contrast_label: "self-reported short sleep <7 h/night vs 7-8 h, stratified by age: LOWER risk in older-older (>=70 y), HIGHER risk in younger-older adults"}
    scale: log_hr
    unit: null
    value: 0.0
    se: null
    ci: null
    conversion_formula: >
      NO NUMBER IS EXTRACTABLE. The abstract reports only the DIRECTION of the short-sleep association within
      each age stratum and prints no hazard ratio, no interval and no p-value for either stratum. value is set
      to 0.0 as a required-field placeholder meaning "sign-discordant across strata, magnitude unreported",
      and se is null. THIS EFFECT MUST NOT BE POOLED AS A ZERO. It is recorded because the sign reversal is
      itself the finding.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      SIGN REVERSES WITH AGE, WHICH IS WHY THIS RECORD EXISTS. In the same cohort, with the same exposure
      instrument and the same outcome, short sleep was associated with LOWER dementia risk among adults aged
      70+ and HIGHER risk among younger-older adults. A genuine cumulative neurotoxic mechanism cannot flip
      sign across a five-year age band. A survival-bias / prodromal / confounding account explains it easily.
      Treat the value 0.0 as a placeholder, not an estimate.
    covariates: ["Cox regression, covariate set not recoverable from the abstract"]
    followup_years: 8.0
    cohort_family: "ELSA"
    quote: "Short sleep duration (<7 h) was associated with lower risk of incident dementia among older-older but higher risk among younger-older adults."
  - outcome_domain: neurodegeneration
    outcome_construct: mr_sleep_duration_on_dementia_null_within_same_paper
    exposure: {type: per_hour_less_sleep, dose_h: null, referent_h: null, duration_days: null,
