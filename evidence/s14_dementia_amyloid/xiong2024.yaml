    scale: log_or
    unit: null
    value: 0.0
    se: null
    ci: null
    conversion_formula: >
      The authors report only that the MR "did not reveal causal associations between sleep duration and
      dementia" and print no estimate in the abstract. value = 0.0 encodes a REPORTED NULL with unreported
      magnitude; se is null. Not poolable as a precise zero.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      NULL. Recorded because it is a within-paper contrast: the same authors found observational associations
      and then failed to find any genetic support for them. That internal discordance is the pattern seen
      across guo2024.yaml, yuan2022.yaml and tao2026.yaml as well.
    covariates: []
    followup_years: null
    cohort_family: null
    quote: "The MR study did not reveal causal associations between sleep duration and dementia."
rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: >
    Nationally representative English cohort (ELSA) with register/consensus dementia ascertainment and a
    within-paper MR triangulation, which is good practice. Concerns: (1) ABSTRACT ONLY - no covariate list,
    no intervals for the headline estimates, no case counts by stratum; (2) only 5.7% developed dementia
    (about 412 cases) and 1.7% AD (about 123 cases), so age-stratified short-sleep subgroups are small and the
    sign reversal could be noise - but a noisy sign reversal is still not evidence of harm; (3) baseline age
    65+ with mean 8-year follow-up puts almost the entire exposure window inside the plausible dementia
    prodrome; (4) self-reported single-item sleep duration.
funding: "not stated in the retrieved abstract"
notes: >
  INCLUDED FOR THREE REASONS, none of which is its effect size.
  FIRST, THE AGE-STRATUM SIGN REVERSAL. Short sleep predicted LOWER dementia risk in those aged 70+ and higher
  risk in the younger-old, within one cohort. Alongside xu2020.yaml's dose-response nadir at 5.6-6 h and
  sabia2021.yaml's non-significant age-70 estimate, this is the third independent indication that the
  short-sleep signal is unstable in exactly the way confounded and prodromally contaminated associations are
  unstable, rather than the way dose-dependent toxicities behave.
  SECOND, THE LONG-SLEEP ASYMMETRY AGAIN: +64% for dementia and roughly 2-fold for AD with long sleep, versus
  a direction-flipping short-sleep signal. Same asymmetry as xu2020.yaml, deckers2024.yaml, fan2019.yaml and
  livingston2024.yaml. The exposure with no glymphatic rationale keeps producing the larger, more consistent
  association.
  THIRD, THE WITHIN-PAPER MR NULL, verbatim: "The MR study did not reveal causal associations between sleep
  duration and dementia."
  THE AUTHORS' OWN FRAMING IS BIOMARKER, NOT CAUSE, verbatim: "These findings suggest that self-reported short
  sleep in younger-older and long sleep in older-older adults and those with frequent alcohol consumption are
  associated with dementia. Early detection of these sleep patterns may help identify individuals at higher
  dementia risk." "Early detection" and "identify individuals at higher risk" are screening language. The
  authors are not claiming a modifiable causal pathway.
  COHORT AGE 65+. This is the OLDEST exposure window of any record in the shard and therefore the least
  transportable to a 19-year-old. adolescent_match is poor_elderly.
  AGE FIELDS: age_range is null because eligibility was open-ended above 65 and the schema requires
  numeric bounds - verbatim: "older adults (>= 65)".
shard: "s14_dementia_amyloid"
