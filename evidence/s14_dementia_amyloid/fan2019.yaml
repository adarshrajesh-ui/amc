rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: >
    Restricted to PROSPECTIVE cohorts and to sleep DURATION specifically, which makes it more relevant to
    this shard's question than Bubu 2017 despite pooling far fewer studies. Concerns: only 7 studies for
    all-cause dementia and 6 for AD; heterogeneity statistics are not given in the abstract and the full
    text is paywalled with no PMC deposit, so I2 is UNKNOWN to this shard; "short" and "long" are defined
    by each contributing cohort rather than harmonised; follow-up durations are not stated in the abstract;
    and the contributing cohorts are predominantly elderly at baseline, so reverse causation is unaddressed.
funding: "See paper"
notes: >
  DISCONFIRMING EVIDENCE, and the cleanest single refutation of the claim that the epidemiology
  establishes short-sleep harm. Retrieved as ABSTRACT ONLY (paywalled, no PMC deposit).
  Authors' own conclusion, verbatim: "CONCLUSIONS AND IMPLICATIONS: Only long sleep duration is
  significantly associated with an increased risk of all-dementia and AD. Future studies are needed to
  better understand the mechanisms underlying this association."
  READ ALONGSIDE wu2018.yaml, which pooled a partly overlapping but broader literature (9 cohorts, 22,187
  participants, outcome = any "cognitive disorder") and DID find short sleep significant at RR 1.34
  (1.15-1.56). The two disagree because they define the outcome differently: Fan restricted to dementia
  and AD diagnoses in prospective cohorts, Wu included cognitive decline and cognitive impairment. The
  narrower and harder the outcome, the weaker the short-sleep signal. That gradient is diagnostic and
  should be reported.
shard: "s14_dementia_amyloid"
