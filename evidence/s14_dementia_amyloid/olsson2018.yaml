    conversion_formula: >
      A DELIBERATE NULL. The abstract states "No PSD-related changes in CSF biomarkers for amyloid
      build-up in the brain, Alzheimer's disease (AD)-type neurodegeneration, or astroglial activation
      were observed", so the point estimate is coded as 0. No effect sizes, SEs or CIs for the null
      biomarkers are given in the abstract and the full text is paywalled with no PMC deposit (checked),
      so se is null and the precision of this null is UNKNOWN. This is a real limitation: with n = 13 the
      confidence interval around "no change" is certainly wide, and absence of evidence here is weak
      evidence of absence. It is nonetheless the only published experiment whose exposure matches the
      subject's exposure type.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      ZERO = NO detectable change in amyloid or neurodegeneration biomarkers after 5-8 nights of severe
      partial sleep restriction. Direction of harm would be positive. The authors attribute the null to
      preservation of slow wave sleep under partial restriction.
    covariates: ["randomized crossover", "polysomnography, actigraphy and observation verified sleep"]
    followup_years: null
    cohort_family: "Gothenburg_PSD"
    quote: "RESULTS: PSD was associated with a 27 per cent increase in CSF orexin concentrations (p = 0.001). No PSD-related changes in CSF biomarkers for amyloid build-up in the brain, Alzheimer's disease (AD)-type neurodegeneration, or astroglial activation were observed. PSD led to a shortening of time spent in all sleep stages except slow-wave sleep (SWS)."
