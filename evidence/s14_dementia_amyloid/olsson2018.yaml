rob:
  tool: RoB2
  judgement: some_concerns
  notes: >
    Randomized crossover in exactly the right age band (20-40 y), with sleep verified by observation,
    actigraphy and continuous polysomnography - methodologically the best-matched experiment in this
    shard. Principal concern is power: n = 13, with only 4 extended to eight nights, and no published
    precision for the null. Also single-centre, and CSF was sampled by routine lumbar puncture after each
    period rather than serially, so a transient within-night excursion could have been missed.
funding: "See paper (Swedish Research Council / Sahlgrenska; full statement not in abstract)"
notes: >
  DISCONFIRMING EVIDENCE, AND THE CLOSEST EXPOSURE MATCH IN THE ENTIRE SHARD. Every other mechanistic
  study uses ONE NIGHT OF TOTAL DEPRIVATION. The subject's exposure is repeated PARTIAL restriction to
  5-6 h. This study restricted 13 healthy 20-40 year olds to a maximum of 4 h for five consecutive
  nights - more severe than the subject's weekday sleep - and found NO change in CSF amyloid or
  neurodegeneration biomarkers. Retrieved as ABSTRACT ONLY (paywalled; no PMC deposit).
  The proposed explanation is mechanistically important and is corroborated by the same group's later
  crossover study (forsberg2025.yaml), which describes this result as follows: "In a previous study, we
  reported that restricting sleep to less than four hours per night for five consecutive nights did not
  significantly affect CSF biomarkers for amyloid accumulation or AD-type neurodegeneration, even though
  the time spent in all sleep stages except slow-wave sleep (SWS) was reduced [ 20 ]. These findings
  suggest that the preservation of SWS may be sufficient to maintain short-term proteostatic balance
  despite overall sleep loss."
  IMPLICATION FOR THE SUBJECT: under partial restriction, slow wave sleep is defended first and is the
  last thing lost. Since slow wave activity is the specific sleep feature that every version of the
  amyloid-clearance hypothesis depends on, partial restriction of the kind the subject experiences is
  the condition LEAST likely to engage the proposed mechanism. Total deprivation, which abolishes SWS,
  is the condition most likely to - and that is the only condition in which the positive human findings
  were obtained. The dose-response literature therefore does not extrapolate downward from total
  deprivation to 5-6 h nights; if anything the one direct test points the other way.
