rob:
  tool: AMSTAR-2
  judgement: high
  notes: >
    Four of the nine included studies are CROSS-SECTIONAL, which for a dose-response analysis of an
    incident outcome is a serious design flaw and makes the pooled estimates partly uninterpretable as
    risk. Heterogeneity is substantial for the cognitive decline outcome (I2 = 62.40 %). Only 4 estimates
    contribute to the MCI/dementia linear term. Full text is paywalled with no PMC deposit, so contributing
    study characteristics and follow-up durations are UNKNOWN to this shard. The authors themselves call
    for randomized trials.
funding: "See paper"
notes: >
  Retrieved as ABSTRACT ONLY (paywalled, no PMC deposit). Included primarily for the PER-HOUR estimates,
  which are the most directly usable form of this literature for a dose-based model and which are both
  NULL and TINY: roughly 1-2 percent relative risk change per hour of sleep, with confidence intervals
  including no effect. This is a useful sanity check on the categorical estimates. A subject sleeping
  about 1.5 h less than optimal on weekdays would, on the linear term alone, sit at roughly RR 1.03 -
  a magnitude that is not distinguishable from zero and is dwarfed by the confounding structure of the
  underlying cohorts. The categorical short-vs-normal estimates in the same literature (HR 1.2-1.5) are
  much larger than the per-hour linear term implies, which is itself evidence that the categorical
  contrasts are capturing something other than a smooth duration dose-response - most plausibly a
  distinct subgroup with disordered rather than merely curtailed sleep.
