    scale: log_rr
    unit: null
    value: -0.02020
    se: 0.00777
    ci: [-0.03046, 0.0]
    conversion_formula: >
      RR = 0.98 per 1 h increase, 95% CI 0.97-1.00. log_rr = ln(0.98) = -0.02020;
      se = (ln(1.00) - ln(0.97))/3.92 = (0 - (-0.03046))/3.92 = 0.00777. Heterogeneity I2 = 0%, P = 0.42,
      n = 4 estimates. SIGN CONVENTION WARNING: this is per hour MORE sleep, so it is the reciprocal of a
      per-hour-less exposure; to express per hour LESS sleep, negate: log_rr = +0.02020.
    from_figure: false
    inferred_from_ci: true
    direction_note: >
      NEGATIVE = each additional hour of sleep is associated with slightly LOWER MCI/dementia risk, i.e.
      each hour LESS is associated with about 2 percent higher risk. The upper CI bound is exactly 1.00
      and P = 0.42, so THE LINEAR TERM IS NULL. Magnitude matters enormously here: even taken at face
      value, a 2 percent relative change per hour is a tiny effect, and the authors report I2 = 0%, so
      this null is precise rather than merely underpowered.
