    scale: probability
    unit: "binary inclusion decision: 0 = NOT included among the Commission's modifiable risk factors"
    value: 0.0
    se: null
    ci: null
    conversion_formula: >
      Not an effect size. Coded as 0 to carry a single machine-readable fact: after formal review, the most
      authoritative dementia-prevention body in the field placed short sleep in the "insufficient evidence"
      bin and issued NO population attributable fraction for it. There is no SE because there is no estimate
      to have an SE - that absence is the datum.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      0 = EXCLUDED. The Commission enumerates 14 modifiable risk factors with population attributable
      fractions; sleep is NOT one of them, and is named explicitly in the rejected set. Any downstream model
      that assigns a nonzero dementia PAF to short sleep is going beyond the 2024 Lancet Commission.
