    quote: "In the million-woman study of 830,716 women (mean age 60 years at baseline) with a 17-year follow-up, there was a slightly higher risk of dementia (RR 1.08, 1.04-1.12) among those who reported shorter but not very short sleep duration (<7 hours)."
rob:
  tool: AMSTAR-2
  judgement: low
  notes: >
    A standing Commission of 27 authors with an explicit, pre-stated inclusion bar ("our high bar"), which
    is precisely why its exclusion of sleep is informative rather than merely absent. The relevant risk of
    bias is not methodological but interpretive: the Commission is a narrative synthesis, not a pooled
    quantitative analysis, so its verdict is expert adjudication of a literature rather than an independent
    estimate. Retrieved as the author-accepted manuscript deposited in UCL Discovery (open access via
    Unpaywall); the publisher's typeset version is paywalled and page numbers of quotes therefore refer to
    the accepted version.
funding: "Alzheimer's Society, Alzheimer's Society UK, UK Research and Innovation (per declaration of interests)"
notes: >
  THE MOST DECISION-RELEVANT CONTEXT RECORD IN THIS SHARD. The 2024 Lancet standing Commission is the
  reference synthesis for dementia prevention, and it reviewed exactly the question this shard was asked and
  declined to answer it in the affirmative.
  ITS FULL DECISION PARAGRAPH, VERBATIM: "Decision Since the last commission, further evidence indicates
  that prolonged sleep is not a risk factor for dementia, although dementia and its prodrome may cause
  prolonged sleep. People should not curtail their sleep to reduce dementia risk. Benzodiazepines do not
  appear to cause dementia. Overall, current evidence appears to indicate that short sleep duration may be
  associated with a small, increased risk of dementia but there is a lack of evidence about the
  characterisation of short sleep, and no information on sleep quality or circadian rhythm disturbance which
  may be the factors associated with increased risk of developing dementia rather than length of sleep.
  Therefore, the evidence about short sleep has not yet been clarified enough to be sure of causation. We are
  unable to make recommendations on sleep as a risk factor."
  Three separate things in that paragraph matter for the pooler. (1) "may be associated with a small,
  increased risk" is the Commission's ceiling on the short-sleep effect - small, not large. (2) "not yet been
  clarified enough to be sure of causation" is an explicit refusal to treat the association as causal.
  (3) "People should not curtail their sleep to reduce dementia risk" is the Commission pre-empting the
  inverse error, and is the closest thing in the literature to an authoritative statement that the direction
  of the advice is right even though the magnitude is unquantified.
  ON REVERSE CAUSATION the Commission cites two lag-analysis results that both go the same way, both for
  LONG sleep: "In a Swedish cohort of 28,775 individuals aged 65 years and older, the association between
  long sleep duration and dementia over a 13-year follow-up was completely attenuated after cases occurring
  in the first 5 years of follow-up were excluded from the analysis, highlighting the role of reverse
  causation bias.(300) Similarly, in the US million woman study there was no association between long sleep
  duration (>8 hours) or daytime napping and dementia on longer term follow-up after the first five years."
  It also flags the key structural gap in the whole literature: "Some studies are noteworthy because of
  longer follow-up but no studies reported those who developed dementia soon after sleep duration
  ascertainment separately from those who developed it after longer periods."
  ON THE GLYMPHATIC MECHANISM the Commission raises the same objection this shard reached independently -
  that the slow-wave window is short and defended: "Biological mechanisms include neuroinflammation,(312)
  atherosclerosis,(313) alpha-synucleinopathies (dementia with Lewy bodies and Parkinson disease
  dementia),(314) and impaired amyloid-beta clearance.(315) However, this usually occurs during deep sleep at
  the beginning of the night, which lasts one to two hours so is unlikely to be affected in those reporting
  sleep disturbances." That is a direct authoritative endorsement of the argument that partial restriction
  spares the mechanistically relevant sleep stage - see skorucak2021.yaml, ju2017.yaml and olsson2018.yaml.
  It also states the reverse-direction mechanism as the better-supported one: "Amyloid plaque build-up
  contributes to poor sleep in older adults through its direct impact on sleep-wake regulator brain regions."
  NOTHING IN THIS REPORT ADDRESSES ADOLESCENT SLEEP. The Commission's life-course framing has early-life
  education as the childhood-window risk factor; sleep appears only in the midlife/late-life sections.
