    conversion_formula: >
      RR = 1.08, 95% CI 1.04-1.12 as reported by the Commission. log_rr = ln(1.08) = 0.076961;
      se = (ln(1.12) - ln(1.04))/3.92 = (0.113329 - 0.039221)/3.92 = 0.018905.
      dose_h/referent_h are the extraction shard's midpoint reading of "<7 hours"; the Commission does not
      print category midpoints.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      POSITIVE = higher dementia risk with short sleep. THIS IS THE LARGEST SHORT-SLEEP DEMENTIA STUDY IN
      EXISTENCE (830,716 women, 17-y follow-up) AND IT IS ALSO THE SMALLEST EFFECT: RR 1.08. Note the
      Commission's own qualifier - the excess was seen in those reporting "shorter but not very short" sleep,
      i.e. the dose-response is NOT monotonic even here. Secondhand via the Commission text; the shard did
      not retrieve the primary Million Women Study paper, so access_tier for this specific effect is
      secondhand and the identifier belongs to the Commission, not the primary study.
    covariates: []
