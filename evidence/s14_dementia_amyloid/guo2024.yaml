  - outcome_domain: cardiovascular
    outcome_construct: stroke_risk_from_genetically_instrumented_insomnia_POSITIVE_CONTROL
    exposure: {type: other, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "genetically instrumented insomnia -> any stroke, two-sample MR"}
    scale: log_or
    unit: null
    value: 0.27003
    se: 0.07395
    ci: [0.12222, 0.41211]
    conversion_formula: >
      OR = 1.31, 95% CI 1.13-1.51. log_or = ln(1.31) = 0.27003;
      se = (ln(1.51) - ln(1.13))/3.92 = (0.41211 - 0.12222)/3.92 = 0.07395.
    from_figure: false
    inferred_from_ci: true
    direction_note: >
      POSITIVE = harm. Recorded as a POSITIVE CONTROL, not as a dementia effect. It demonstrates that these
      MR instruments and this dataset CAN detect a causal sleep effect when one is present - insomnia
      really does appear to cause stroke. The dementia null in the same analysis is therefore not simply a
      power failure. (Stroke is s08's domain, not this shard's; recorded here only for that inferential
      purpose.)
    covariates: ["MR instruments"]
    followup_years: null
    cohort_family: "UK_Biobank"
    quote: "MR analyses supported a causal link between genetically predicted insomnia and increased stroke risk (OR 1.31, 95% CI 1.13–1.51, p = 0.00072), but not with dementia or SVD markers."
  - outcome_domain: neurodegeneration
    outcome_construct: observational_association_of_sleep_measures_with_incident_dementia_before_and_after_vascular_adjustment
    exposure: {type: habitual_short_sleep, dose_h: null, referent_h: null, duration_days: null,
               contrast_label: "self-reported sleep measures -> incident all-cause dementia, 502,383 participants, 7,668 dementia cases; effect of adjusting for cardiovascular risk factors"}
    scale: log_hr
    unit: null
    value: 0.0
    se: null
    ci: null
    conversion_formula: >
      A QUALITATIVE ATTENUATION FINDING, coded as 0 because the paper reports that the observational
      associations "were attenuated after controlling for cardiovascular risk factors" without printing
      the specific dementia HRs for sleep duration in the abstract or retrievable text. The abstract does
      state "Almost all sleep measures were associated with dementia risk (all p < 0.001, except insomnia)"
      BEFORE full adjustment. se null. Do not pool.
    from_figure: false
    inferred_from_ci: false
    direction_note: >
      ZERO here encodes "attenuated toward null on vascular adjustment", not a measured effect of zero. The
      pattern is the important part: nearly every sleep measure predicted dementia in crude models, the
      associations shrank when cardiovascular risk factors were controlled, and they vanished entirely under
      MR. That is the classic signature of confounding plus reverse causation rather than causation.
    covariates: ["age", "sex", "ethnicity", "plus additional vascular risk factors in the fully adjusted models"]
    followup_years: null
    cohort_family: "UK_Biobank"
    quote: "We found that multiple sleep measures predicted future risk of stroke and dementia, but these associations were attenuated after controlling for cardiovascular risk factors and were absent in MR analyses for Alzheimer disease. This suggests possible confounding or reverse causation, implying caution before proposing sleep disorder modifications for dementia treatment."
rob:
  tool: MR-STROBE
  judgement: some_concerns
  notes: >
    Unusually informative because it runs the observational and MR analyses on the same population with the
    same exposure definitions, so the attenuation across designs is interpretable rather than confounded by
    differing samples. Very large (502,383 participants, 7,668 dementia cases, 10,334 strokes). Concerns:
    (1) UK Biobank is a healthy-volunteer cohort with <5 % response, so selection bias affects both arms;
    (2) self-reported single-item sleep measures; (3) dementia ascertainment by record linkage in a cohort
    with mean baseline age 56.5 y means many cases are yet to occur, limiting power; (4) many sleep traits
    and many outcomes tested; (5) the MR null for dementia does not exclude small effects.
funding: "See paper"
notes: >
