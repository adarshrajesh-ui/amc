rob:
  tool: RoB2
  judgement: low
  notes: "Well-powered field RCT with actigraphy-verified exposure, pre-specified index outcomes with multiple-testing correction (Anderson sharpened q-values), a real measured first stage, and a within-study active comparator (naps). Main limitations for our purposes: the population is low-income middle-aged Indian adults with pathologically fragmented sleep, and the extension achieved is small (27 min)."
funding: "Not extracted from retrieved text"
notes: |
  WHY A STUDY OF CHENNAI ADULTS IS DECISION-RELEVANT FOR A US 18-YEAR-OLD: it is the strongest existing
  counter-evidence to the assumption that extending habitual sleep mechanically improves cognitive and
  economic outcomes. Any model that converts our subject's sleep deficit into an academic loss is implicitly
  assuming the reverse experiment would work. Here it did not: a randomized +27 min of nighttime sleep for
  three weeks moved the overall outcome index by -0.01 SD (SE 0.04), against a pre-registered expert
  prediction of a 7% productivity gain which the authors formally reject.
  HOW TO RECONCILE IT WITH THE POSITIVE EVIDENCE - three reasons not to over-update:
  (1) DOSE. +27 min is far smaller than our subject's 2-3 h deficit, and smaller than the 4 h contrast in
      Lo et al.'s adolescent RCT. A null at 27 min is compatible with large effects at 2-3 h.
  (2) SLEEP QUALITY, NOT QUANTITY, WAS THE BINDING CONSTRAINT. These participants slept 5.5 h despite 8 h in
      bed, with "sleep efficiency - sleep per time in bed - comparable to those with disorders such as sleep
      apnea or insomnia." The extension came entirely from more time in bed, not better sleep. Our subject's
      problem is the opposite: too little time in bed with presumably normal efficiency.
  (3) THE NAP RESULT SHOWS THE OUTCOMES WERE NOT INSENSITIVE. In the same sample, over the same weeks, with
      the same instruments, a 30-minute nap improved the overall index by 0.12 SD and cognition by 0.10 SD.
      So the null on night sleep is a real finding about night sleep in this population, not a failure of
      measurement. The authors can "reject equal per minute effects of naps and nighttime sleep on the
      summary index (p < .01)".
  POPULATION MISMATCH IS SEVERE: low-income adults in Chennai, not adolescents or students, and the outcome
  is data-entry productivity plus cognitive/preference batteries, not academic achievement.
  DIRECTIONAL LESSON FOR THE MODELLER: this study argues that the mapping from sleep hours to cognitive
  output is NOT a simple linear function of duration - fragmentation, timing and nap availability matter -
  and it justifies substantial downweighting of any purely duration-based dose-response curve. It should
  widen the lower tail of the posterior on our subject's academic damage.
