rob:
  tool: ROBINS-I
  judgement: moderate
  notes: "Difference-in-differences around a real policy change (Minneapolis moved bell times later, Twin City St. Paul did not), plus a second analysis in Kansas. Weakness: ACT is taken by a self-selected subset of students and is not administered on a fixed school-day schedule, so it may be an insensitive outcome for a test-day fatigue channel; sleep is not measured."
funding: "Not stated in retrieved text"
notes: |
  IDENTIFYING ASSUMPTION: Minneapolis and surrounding districts that delayed bell times would have
  followed the same ACT trajectory as St. Paul and surrounding districts absent the change
  (parallel trends). This is a standard and reasonably PLAUSIBLE DiD assumption for two adjacent
  metro areas, though only one treated cluster means inference rests on few effective clusters.
  WHY THIS RECORD MATTERS: this is the main negative result in the school-start-time literature and
  it is PRECISE, not merely underpowered. Any pooled T2 estimate that ignores it will be biased
  upward. Herber, Quis & Heineck (2017) summarise it as: "Hinrichs (2011) uses longitudinal individual
  data on the U.S. high school achievement test ACT and exploits, in his main analysis, exogenous
  variation from a policy change in the U.S.: While Minneapolis and some of its surrounding districts
  shifted school starting hours backwards, its Twin City St. Paul and surroundings retained the old
  starting times. The author does not find evidence for the hypothesis that ringing the school bell
  later increased students' performance."
  RECONCILIATION WITH THE POSITIVE STUDIES: the ACT is a high-stakes, self-selected, Saturday-morning
  or specially scheduled college-entrance test, whereas Carrell/Edwards/Heissel-Norris/Dunster measure
  routine coursework grades or in-school standardized tests taken during the normal school day. If a
  large share of the start-time effect is a same-day alertness/test-performance effect rather than a
  cumulative learning effect (which Heissel & Norris explicitly cannot rule out), a null on ACT and
  positive effects on in-school tests are consistent. That distinction matters a lot for our subject:
  a same-day alertness effect is recoverable with one good night's sleep, a cumulative learning deficit
  is not. Hinrichs is therefore evidence AGAINST large cumulative learning losses per hour of bell time.
  n not extracted: the paper uses Minnesota ACT administrative records over multiple cohorts; I did not
  locate a single unambiguous analysis-sample count in the retrieved text and refuse to guess.
