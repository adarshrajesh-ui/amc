rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Randomized parallel-group design with a controlled boarding-school environment (excellent adherence and exposure control), baseline-adjusted analysis, and a battery administered three times daily. Concerns: no blinding is possible; n = 56 split across two arms; participants were students at top high schools who were NOT habitual short sleepers, so they are the opposite of our subject in baseline adaptation; and effect sizes are reported as f2 of an interaction, which is not directly convertible to a per-hour SMD."
funding: "Not extracted from retrieved text"
notes: |
  THIS IS THE T1 ANCHOR AT EXACTLY OUR SUBJECT'S AGE, and it is the single most important study I found for
  calibrating how much cognitive damage 5 h nights do to a 16-19 year old. It is a genuine RCT: "Fifty-six
  healthy adolescents (25 males, age = 15-19 y) who studied in top high schools and were not habitual short
  sleepers were randomly assigned to Sleep Restriction (SR) or Control groups. Participants underwent a 2-w
  protocol consisting of 3 baseline nights (TIB = 9 h), 7 nights of sleep opportunity manipulation (TIB = 5 h
  for the SR and 9 h for the control groups), and 3 nights of recovery sleep (TIB = 9 h) at a boarding school."
  EXPOSURE MATCH IS NEARLY EXACT: 5 h TIB for 7 consecutive nights is essentially our subject's weekday
  pattern (5-6 h). The contrast (9 h) is the age-appropriate reference. The only mismatch is duration:
  7 nights here versus ~3 years for our subject, and these adolescents were not previously sleep-adapted.
  EFFECT SIZES, all Cohen f2 of the group x day interaction (author cutoffs: 0.02 small, 0.15 medium, 0.35
  large): PVT lapses 1.48; MAT (mental arithmetic) 1.14; SDMT 0.72; verbal 3-back 0.70; verbal 1-back 0.63;
  KSS subjective sleepiness 0.50; SART A' 0.20. Every cognitive domain except SART is in the "large" range,
  and several are 3-4x the "large" threshold.
  DOMAIN PATTERN WORTH TRANSMITTING: sustained attention (PVT) degrades MONOTONICALLY across the 7 nights -
  i.e. it accumulates and does not plateau - whereas working memory dropped after ~4 nights and then
  stabilized. Speed of processing degraded by BLOCKING NORMAL PRACTICE GAINS rather than by absolute
  decline, which is the mechanism most directly analogous to failing to learn course material over a term.
  This paper also contradicts the prior literature claim that executive function is the most affected domain
  in adolescents; here attention is: "The SART was less sensitive (f2 = 0.20) than the PVT (f2 = 1.48)".
  RECOVERY IS THE KEY FINDING FOR OUR SUBJECT'S WEEKEND-CATCHUP PATTERN: two nights of 9 h recovery sleep
  did not restore PVT lapses to baseline, and MAT/SDMT remained significantly worse than controls. Since our
  subject's weekend sleep is only 7-8 h, the implication is that his weekday deficits are only partially
  repaid and will accumulate across a 3-year exposure.
  DOI 10.5665/sleep.5552 was obtained from PubMed's own record for PMID 26612392 and then independently
  confirmed against Crossref, which returns the matching title and Sleep 39:687-698.
