rob:
  tool: ROBINS-I
  judgement: moderate
  notes: "Careful IV design with a real measured first stage, district-by-season and child fixed effects, weather controls, and time-of-day activity data to probe alternative mechanisms. But the magnitudes are so large that either the test-score SD is small relative to measurement error, or the sunset instrument moves something other than sleep (e.g. same-day heat, light exposure, evening study conditions, kerosene/electric lighting availability), or both."
funding: "Not extracted from retrieved text"
notes: |
  IDENTIFYING ASSUMPTION: within a district and season, variation in sunset time (across dates for the
  short-run analysis, and east-to-west within district for the long-run analysis) affects children's
  human capital only through sleep. The author defends this with district-by-season fixed effects,
  week-of-year fixed effects, child fixed effects, weather controls, and time-use evidence that the
  displaced time goes to naps and indoor leisure rather than to work. This is a SERIOUS design and the
  exclusion restriction is the same one used by Giuntella & Mazzonna and Gibson & Shrader, so it inherits
  their standing in the literature. Two specific worries remain: (a) sunset time is mechanically
  correlated with day length, evening temperature and evening light, all of which independently affect
  evening study conditions and same-day cognitive performance in a hot, partially electrified rural
  setting; and (b) the short-run test is administered on the same day, so a large part of the estimate
  is plausibly transient alertness rather than learning.
  MAGNITUDE WARNING - THE MOST IMPORTANT THING IN THIS RECORD: the implied per-hour-of-sleep effect is
  about -1.15 SD. That is roughly 4-5x the Groen & Pabilonia implied IV (-0.26 SD/h), ~14x the
  Heissel & Norris reduced form per hour of bell time, and about the same order as a full night of total
  sleep deprivation in a lab. It cannot be transported to a US college student. Most likely explanations:
  a low-reliability survey-administered math test (small true-score SD inflates standardized effects),
  a very short-run alertness channel, and an exceptionally sleep-deprived and resource-poor population
  ("Almost 40% of school-age children in the ITUS sample get less than 9 hours of daily sleep").
  I include it because the task asked for sunset-time IV evidence and because it is the only such study
  with an ACADEMIC outcome, but the modeller should down-weight it heavily on transportability and treat
  it as establishing SIGN and PERSISTENCE (the long-run education result), not magnitude.
  POPULATION MISMATCH: Indian children aged 6-16, mostly rural, majority younger than our subject. Given
  Heissel & Norris's finding that the effect is puberty-specific and rises with age, the age mismatch
  does not obviously bias the estimate downward - but every other feature of the setting is different.
  n = 7,511 child-date observations in the math score regressions (4,589 in the lagged-score column,
  7,415 in the child-fixed-effects column).
