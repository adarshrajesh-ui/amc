rob:
  tool: ROBINS-I
  judgement: moderate
  notes: "Very large administrative panel with within-student identification and a strong instrument (Cragg-Donald F-stats 404-1230). Weaknesses: sleep never measured; the instrument (crossing a time-zone boundary when moving house) may bundle other consequences of the move; the authors themselves flag that part of the effect may be a test-day performance effect rather than a learning effect."
funding: "Not stated in retrieved working paper"
notes: |
  IDENTIFYING ASSUMPTION: sunrise time relative to school start time affects achievement only through
  the circadian/sleep channel. Operationally the authors track the SAME student before and after a
  residential move that crosses the Florida time-zone boundary, instrumenting hours of sunlight
  before school with the boundary crossing. The assumption is that moving across the boundary changes
  the sunrise-to-bell gap but nothing else relevant. This is PARTLY PLAUSIBLE. Strengths: within-student,
  so time-invariant family confounders are absorbed; the effect appears immediately after the move and
  persists; and the killer internal test is that the effect on math "spikes precisely at the
  gender-specific age of median entrance into an important pubertal stage" - a confounder would have to
  mimic a puberty timing discontinuity that differs by two years between girls and boys.
  Weaknesses: a household move is a bundled treatment; cross-boundary movers differ from non-movers at
  baseline ("0.09 and 0.08 SDs lower in math and reading, respectively"), so the within-student design is
  doing real work; and the authors concede they cannot separate learning effects from test-day effects.
  NO SLEEP FIRST STAGE. Heissel & Norris do not measure sleep minutes. The effect is per hour of
  start-time-relative-to-sunrise, not per hour of sleep.
  KEY VALUE TO THIS SHARD: this is the best available evidence that the start-time/sleep effect is
  concentrated in POST-PUBERTAL adolescents (0.081 SD) and is essentially zero in pre-pubertal children
  (0.020 SD, not significant). That directly supports transporting these estimates to a 16-19 year old
  and argues against transporting the (younger-sample) Edwards and Jagnani estimates unadjusted.
  Sample: FCAT records, 15 school years (1999-2013); the tables report 24,768-25,191 students and
  ~99,835-104,791 student-year observations depending on panel. I record n = 24,768 students.
