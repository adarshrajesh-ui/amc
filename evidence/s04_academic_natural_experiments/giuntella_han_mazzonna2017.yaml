rob:
  tool: ROBINS-I
  judgement: moderate
  notes: "Sunset-time IV with a plausible exclusion restriction, strengthened by the Hukou residence-registration system which largely rules out residential sorting (authors report <1% live in a city different from their Hukou). Weaknesses: no time-zone borders in China (single national time zone) so the instrument is longitude-driven and colinear with development gradients; the estimated per-hour effects are very large; and the population is 45+, far from our subject."
funding: "Not stated in retrieved working paper"
notes: |
  IDENTIFYING ASSUMPTION: China uses a single time zone across ~60 degrees of longitude, so sunset
  clock-time varies enormously while school and work schedules are nationally synchronized. Conditional
  on controls, this variation in sunset time affects cognition only through sleep. Two features make the
  assumption relatively PLAUSIBLE for a longitude-based instrument: the Hukou system means almost nobody
  has sorted across cities ("in our data less than 1% of the respondents live in a city that is
  different from that of their Hukou"), and the authors show the effects are concentrated exactly where
  the mechanism predicts - urban EMPLOYED workers with rigid schedules - and are ABSENT for the
  self-employed and farmers, who can adjust their schedules to the sun. That heterogeneity test is the
  strongest evidence for the exclusion restriction, because a generic east-west development confounder
  would not switch off for farmers.
  Residual worry: longitude in China correlates with almost everything (coastal development, income,
  education, ethnicity, altitude). The paper relies on within-region comparisons and controls to handle
  this, but a single-time-zone design has no sharp discontinuity to lean on, unlike the US border studies.
  MAGNITUDE: 0.4-0.6 SD of cognitive test score per hour of sleep. This is in the same implausibly-large
  region as Jagnani (-1.15 SD/h) and above Groen & Pabilonia's implied academic IV (-0.26 SD/h). A common
  explanation for all three: IV estimates that divide a modest reduced form by a small first stage are
  badly amplified by any violation of the exclusion restriction, and are LATEs for the most
  schedule-constrained compliers.
  TRANSPORTABILITY: POOR. Population is Chinese workers aged 45+ (mean well above 50); cognitive tests are
  word recall and serial-7 subtraction type measures where age-related decline may make performance more
  sleep-sensitive than in an 18-year-old. Also, the outcome is cognition, not academic achievement.
  n: not extracted. CHARLS wave 1 (2011) covers about 10,000 households / ~17,000 individuals, but the
  analysis sample after restricting to employed urban workers aged 45+ is smaller and I did not locate the
  exact count in the retrieved text, so n is null rather than guessed.
