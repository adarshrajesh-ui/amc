rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Objective actigraphy over a full semester and objectively scored assessments in a single class with a verified absence of TA effects - strong measurement. But it is OBSERVATIONAL and CROSS-SECTIONAL in the exposure: no randomization, no instrument, and NO adjustment for prior academic ability, conscientiousness, course load or mental health. Reverse causation (struggling students sleep less because they study more, or study at night) is not addressed."
funding: "Not extracted from retrieved text"
notes: |
  THIS IS NOT A T2 STUDY AND MUST NOT BE TREATED AS ONE. The task listed it alongside the natural
  experiments, but there is no exogenous variation here at all. It is a prospective cohort with an
  objective (actigraphy) exposure measure, which is tier T4 by the spec's own definitions. I have tiered it
  T4 accordingly. The 0.38 correlation between semester sleep and grades has no identification strategy;
  Edwards (2012) shows that in this literature naive estimates are roughly 4x quasi-experimental ones once
  demographics enter, and Okano et al. adjust for nothing.
  ANSWERS TO THE TASK'S SPECIFIC QUESTIONS:
  (1) Coefficients from the multiple regression on a 0-100 course score: +0.21 points per unit of sleep
      duration (units are minutes, so ~+12.6 points per additional hour, which is transparently
      confounded and far too large), +19.59 per unit of sleep quality, -0.45 per unit of sleep
      inconsistency. Only INCONSISTENCY was individually significant (p = 0.03).
  (2) Variance explained: R2 = 0.244, i.e. ~24.4% of overall grade variance, split 7.16% duration /
      9.68% quality / 7.6% inconsistency.
  (3) NIGHT BEFORE vs WHOLE SEMESTER - the headline finding: sleep on the night before a test did NOT
      predict performance on that test (all rs < 0.20, ps > 0.05 for midterms; rs 0.01-0.26, ps > 0.05 for
      quizzes). Sleep averaged over the WEEK and MONTH before a test DID predict performance (quality rs
      0.21-0.38, all ps < 0.05 across all three midterms). All signs are in the direction "more/better
      sleep -> better grades"; there is no sign reversal anywhere in the paper.
  (4) The authors' interpretation, which is the decision-relevant one for our subject: "Rather than the
      night before a quiz or exam, it may be more important to sleep well for the duration of the time
      when the topics tested were taught... the role of sleep is crucial during the time the content
      itself is learned, and simply getting good sleep the night before may not be as helpful."
      This directly implies our subject's occasional 3-4 h pre-exam nights are LESS damaging than his
      habitual 5-6 h weeknights, and that cramming cannot recover the learning lost during the term.
  POPULATION MATCH IS THE BEST IN THE ENTIRE SHARD: 88 MIT freshmen, mean age 18.19, i.e. essentially our
  subject's exact demographic (an 18-year-old entering his second year at a demanding college). Mean
  semester sleep was 7 h 8 min - about 1.5 h MORE than our subject's weekday sleep - so our subject sits
  below the bottom of this sample's central range.
  MALE-SPECIFIC FINDING: sleep inconsistency correlated with worse performance in males (r(41) = -0.44,
  p = 0.003) but not females (r(43) = -0.13, p = 0.39). Our subject is male and has a highly inconsistent
  schedule, so this subgroup result is directly on point - but it is a single small subgroup analysis and
  should be treated as hypothesis-generating.
shard: "s04_academic_natural_experiments"
