rob:
  tool: ROBINS-I
  judgement: moderate
  notes: "Large administrative panel (all Wake County NC middle schoolers 1999-2006); identification uses within-school and within-student variation in bell times driven by bus scheduling. Sleep is not directly measured. Residual concern that bus-schedule-driven start-time changes correlate with commute length and other school-level shocks."
funding: "Not stated in retrieved text"
notes: |
  IDENTIFYING ASSUMPTION: changes in a school's start time are driven by the district's bus-routing
  problem as enrollment grows, and are therefore uncorrelated with unobserved school or student
  quality shocks. Edwards defends this with (a) school fixed effects, (b) student-school fixed
  effects that use only students who stay put while their bell time moves, and (c) placebo tests
  showing no relationship between start-time changes and per-grade enrollment or the share of
  returning students. This is a CREDIBLE quasi-experiment, though weaker than Carrell's randomization.
  Note the naive cross-sectional coefficient is 9.5 percentile points/hour and collapses to ~2-3 once
  demographics are controlled - direct evidence that the observational literature on sleep and grades
  is heavily confounded by socioeconomic sorting. This is a useful confounding-magnitude calibration
  for the downstream model: the naive estimate is roughly 4x the quasi-experimental one.
  SLEEP FIRST STAGE: Edwards presents supporting (not primary) evidence that sleep is the mechanism -
  he finds the effect is concentrated in older/post-pubertal students and reports time-use evidence -
  but he does NOT estimate minutes of extra sleep in this sample. Do not treat these coefficients as
  per-hour-of-sleep effects without importing an external first stage (see morgenthaler2016 and
  groen_pabilonia2019 records: ~19-36 min extra sleep per hour later start).
  PERCENTILE->SD CONVERSION: I used the derivative of the inverse normal CDF at the median
  (1 SD = 39.9 percentile points at the median, i.e. 2.5066 SD per unit proportion). This is
  conservative relative to the commonly used "1 SD = 34 percentile points" rule of thumb
  (which would give 0.066 rather than 0.056 SD for the math effect).
  POPULATION MISMATCH: grades 6-8 (roughly ages 11-14), not 16-19. The grade-10 persistence result
  is the closest to our subject's age. Edwards himself finds a slightly LARGER effect at grade 10
  (3.3 percentile points math), consistent with the effect growing through puberty (see
  heissel_norris2018), so extrapolating up to age 16-19 is defensible but uncertain.
