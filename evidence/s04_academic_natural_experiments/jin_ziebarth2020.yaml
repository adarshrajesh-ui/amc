rob:
  tool: ROBINS-I
  judgement: low
  notes: "Very large administrative and survey samples, daily event-study design around a sharp and universally imposed time change, placebo outcomes with weak or no sleep link tested, and asymmetric spring/fall analysis that helps distinguish sleep from other DST effects. The limitation for this shard is that the outcomes are health, not academic, and the exposure is one night."
funding: "Not stated in retrieved working papers"
notes: |
  IDENTIFYING ASSUMPTION: the exact date of the DST transition is set by statute and is exogenous to
  individual health, so comparing days just before and just after the transition (with day-of-week,
  day-of-year and year controls) isolates the effect of a one-hour change in sleep opportunity. This is
  HIGHLY PLAUSIBLE. The authors strengthen it by (a) running an event study that shows the effect appears
  and disappears with a characteristic four-day window rather than drifting, (b) testing placebo outcomes
  that should not respond to sleep, and (c) contrasting the spring and fall transitions, finding the
  asymmetry (fall benefits large, spring harms small) that behavioural adjustment predicts.
  WHY IT IS IN THIS SHARD DESPITE HAVING NO ACADEMIC OUTCOME: the task asked for it, and it is the best
  available quasi-experimental demonstration that a ONE-HOUR change in sleep opportunity for the ALREADY
  SLEEP-DEPRIVED produces measurable real-world harm within days. Our subject is chronically at 5-6 h on
  weekdays, i.e. squarely in the population for whom Jin & Ziebarth find effects. It therefore supports the
  premise that the marginal hour matters at the short end of the distribution, which is a load-bearing
  assumption for the whole exercise.
  CRITICAL LIMITATION - THE EXPOSURE IS ONE NIGHT AND THE EFFECT DECAYS IN FOUR DAYS. The finding is
  explicitly transient: "we find that the effect persists for four days after the time shift". This is
  evidence about acute sleep, not about three years of accumulated debt. Do not extrapolate the health
  magnitudes to a chronic exposure.
  ASYMMETRY FINDING WORTH RECORDING: the companion analysis finds little evidence of harm from the SPRING
  transition ("we do not find much evidence that population health significantly decreases when clocks are
  set forth by one hour in spring... The most likely explanation for the asymmetric effects are behavioral
  adjustments by marginal people in spring"). So the paper is really about the benefit of sleep EXTENSION
  for the deprived, not the harm of sleep loss.
  POPULATION: general adult populations (up to 3.4 million BRFSS respondents; 160 million German hospital
  admissions over a decade). Not adolescents. I record n = 3,400,000 for the BRFSS side.
shard: "s04_academic_natural_experiments"
