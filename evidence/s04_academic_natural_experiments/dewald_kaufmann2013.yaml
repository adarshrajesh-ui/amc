rob:
  tool: RoB2
  judgement: high
  notes: "Randomized, actigraphy-verified, and uniquely tests EXTENSION in adolescents who are already chronically sleep-reduced (the correct direction of the counterfactual for our subject). But: n = 55, 85.5% female, no-instruction control so no blinding or attention control, outcome reported as 'some aspects... especially visuospatial processing' which is a strong signal of selective reporting across a multi-test battery without evident multiplicity control."
funding: "Not known - abstract only"
notes: |
  THIS IS THE CLOSEST THING TO THE STUDY THE TASK ASKED FOR IN ITEM 5 - a randomized sleep-EXTENSION trial
  in adolescents with a cognitive outcome - and its weakness is itself the finding worth transmitting: the
  literature has essentially no well-powered randomized sleep-extension trial in adolescents or college
  students with an ACADEMIC (grade or test-score) outcome. This trial has cognitive tests but no academic
  outcome, n = 55, and a heavily female sample.
  WHY THE DESIGN DIRECTION MATTERS: almost all T1 evidence at this age is RESTRICTION (Lo et al. 2016
  randomized well-rested adolescents down to 5 h). Our subject's relevant counterfactual is the reverse -
  taking a chronically restricted adolescent and giving him more sleep. This trial does exactly that, in
  adolescents selected for "symptoms of chronic sleep reduction (loss of energy, shortness of sleep,
  sleepiness, and irritation)", which describes our subject's likely state. The result was a PARTIAL,
  SELECTIVE cognitive benefit, not a broad restoration.
  Combined with Bessone et al. 2021 (a much larger randomized extension in adults that found nothing on
  cognition), the extension evidence is materially weaker than the restriction evidence. The asymmetry
  should make the downstream model less confident that our subject's deficit is fully reversible, and less
  confident that the large restriction effect sizes (Lo et al.'s f2 of 0.6-1.5) translate into equally
  large recoverable academic gains.
  ACCESS LIMITATION: abstract_only. Both effect entries are placeholder sign indicators explicitly flagged
  as non-poolable. DOI 10.1016/j.sleep.2013.01.012 taken from PubMed's own record for PMID 23523432 and
  independently confirmed against Crossref as Sleep Medicine 14:510-517 with the matching title.
  A companion trial by the same group (Dewald-Kaufmann JF, Oort FJ, Meijer AM, J Child Psychol Psychiatry
  2014;55(3):273-283, PMID 24252173) applied sleep extension plus sleep hygiene advice and measured
  DEPRESSIVE SYMPTOMS rather than cognition or grades; it is logged as screened-and-excluded from this
  shard because the outcome is out of domain.
shard: "s04_academic_natural_experiments"
