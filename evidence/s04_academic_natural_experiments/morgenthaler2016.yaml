rob:
  tool: AMSTAR-2
  judgement: moderate
  notes: "Systematic critical review with a small number of poolable studies (6 of 38 reviewed supplied poolable data). The constituent studies are mostly uncontrolled pre/post or cross-sectional comparisons, so the pooled first stage inherits their bias. The authors explicitly grade the academic-performance evidence as weak."
funding: "American Academy of Sleep Medicine"
notes: |
  IDENTIFYING ASSUMPTION: none of its own - this is a review that pools the first stages of the
  underlying start-time studies, most of which are pre/post or cross-school comparisons rather than
  designs with credible exogeneity. So the pooled sleep gains should be read as descriptive of what
  bell-time delays actually deliver, not as a clean causal parameter.
  WHY IT IS IN THIS SHARD ANYWAY: it supplies the single most important number for interpreting every
  school-start-time reduced form, namely the FIRST STAGE. A delay of <= 60 min buys only ~19 min of
  extra sleep; a delay of > 60 min buys ~53 min. Both imply a first-stage slope well below 1: roughly
  0.3-0.9 minutes of sleep per minute of bell delay, consistent with Dunster's actigraphy (0.62) and
  Groen & Pabilonia's diaries (0.60).
  IMPLICATION THE MODELLER MUST NOT MISS: because the first stage is only ~0.3-0.6, dividing the
  typical reduced-form estimate (~0.06-0.10 SD per hour of bell delay) by the first stage produces
  per-hour-of-sleep effects of roughly 0.10-0.30 SD. That is the key T2 arithmetic of this shard, and it
  means the school-start-time literature implies a MUCH larger per-hour-of-sleep effect than its own
  headline reduced forms suggest.
  IMPORTANT NEGATIVE FINDING FROM THE SAME REVIEW: the authors judged the academic-performance evidence
  much weaker than the sleep evidence, and one long-run prospective evaluation found the sleep gain
  fully decayed: "in one prospective long-term evaluation the TST initially increased with a move toward
  later start times, but TSTs had returned to baseline at subsequent evaluation 9 mo after the change."
  That is direct evidence for adaptation/decay of a bell-time-induced sleep gain, and should widen the
  downstream uncertainty on any long-run sleep-extension effect.
  Also reported: "Two of these studies demonstrated a 22% improvement (95% CI: 11% to 33%) in measures
  of sleepiness during school day."
shard: "s04_academic_natural_experiments"
