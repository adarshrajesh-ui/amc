notes: |
  TIER TX - CONTEXT ONLY, NOT A PRIMARY MODEL INPUT. This is a narrative policy summary, not a
  meta-analysis. It has no identification strategy of its own and it double-counts the primary studies
  already recorded in this shard (Carrell 2011, Edwards 2012).
  WHY I KEPT IT: two reasons. First, it supplies the field's consensus central value for the school-start-
  time reduced form - about 0.10 SD of achievement per hour of bell-time delay - which is a useful sanity
  check on my own extractions (Edwards 0.04-0.06 SD, Heissel & Norris 0.06-0.08 SD, Carrell ~0.17 SD scaled,
  Groen & Pabilonia 0.16 SD for female reading, Hinrichs ~0.00 SD). The consensus 0.10 sits mid-range and is
  slightly above the median of the individual estimates, which is what one would expect from a synthesis
  that does not weight the precise null.
  Second, it supplies the policy benchmark that makes the magnitude interpretable: a 1-hour delay is
  equivalent to a one-third class-size reduction or to swapping an average teacher for an 84th-percentile
  teacher. That equivalence is worth carrying into the final report because it converts an abstract 0.10 SD
  into something a reader can size.
  CONFLICT OF INTEREST NOTE: the author, Teny Maghakian Shapiro, is a co-author of Carrell, Maghakian & West
  (2011), the largest positive estimate in the literature. The review is appropriately cited as the field's
  advocacy position rather than as an independent synthesis. It does not engage with Hinrichs (2011)'s
  precise null on ACT scores.
  IMPORTANT: this review contains NO first stage. It never states how much extra sleep a 1-hour delay
  produces, so it cannot be used to derive a per-hour-of-sleep effect.
shard: "s04_academic_natural_experiments"
