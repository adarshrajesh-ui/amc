rob:
  tool: ROBINS-I
  judgement: low
  notes: "Clean regression discontinuity: TIMSS/PIRLS test dates are assigned by testing agencies for logistical reasons and cannot plausibly be chosen with respect to the DST transition, which the authors verify with covariate balance and normalized-difference checks. Large sample. The main limitation for our purposes is the TINY and TRANSIENT exposure (one hour of sleep lost on a single night) and the young population."
funding: "Not stated in retrieved working paper"
notes: |
  IDENTIFYING ASSUMPTION: whether a school's TIMSS/PIRLS testing date falls just before or just after the
  spring DST transition is effectively random with respect to student ability. The authors defend this
  carefully: test dates are set by international testing agencies well in advance, assessments cluster at
  the end of term when scheduling is driven by school logistics, and individual schools cannot be
  identified in the data so there is no incentive to game the date. They also verify covariate balance
  using Imbens-Wooldridge normalized differences. This assumption is HIGHLY PLAUSIBLE - this is the most
  internally valid design in this shard after Carrell.
  WHAT IT ACTUALLY TESTS, AND WHY THE NULL IS ONLY WEAK EVIDENCE AGAINST OUR HYPOTHESIS: the spring DST
  transition removes roughly one hour of sleep on ONE night, and the test occurs some days later. This is
  an acute, single-night, small-dose exposure. Our subject's exposure is 2-3 hours of nightly deficit
  sustained for three years. A null here is therefore fully consistent with large chronic effects; it
  bounds the ACUTE single-night effect at roughly |0.06| SD or less in 9-11 year olds. The authors'
  own framing is appropriately narrow: they conclude only that the evidence does not support abandoning
  DST on school-performance grounds.
  This record is included because the task asked for DST/test-score regression discontinuities and
  because it is the correct answer to that question: the best-identified DST/test-score RD finds NOTHING.
  It also usefully constrains the interpretation of the school-start-time literature: if a one-hour
  single-night sleep loss does not move test scores, then the ~0.06-0.10 SD per hour of bell time found by
  Edwards and Heissel & Norris is unlikely to be a pure same-day alertness effect and more likely reflects
  chronic/cumulative exposure - which is the channel that matters for our subject.
  The paper also contains the only description I could retrieve of Gaski & Sagarin (2011): "16% of a
  standard deviation lower SAT scores in DST-adopting counties. Yet, we doubt..." - see gaski2011 record.
  POPULATION: elementary students (TIMSS grade 4 / PIRLS grade 4), so roughly age 9-11. Poor age match.
  n: "more than 22,000 students from six European countries"; I record 22,000 as a conservative integer.
shard: "s04_academic_natural_experiments"
