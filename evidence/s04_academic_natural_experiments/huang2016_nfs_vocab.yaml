rob:
  tool: RoB2
  judgement: some_concerns
  notes: "Same randomized parallel-group protocol and sample as lo2016_nfs, so the design strengths and weaknesses are identical. Additional concern here: I retrieved only the abstract, so I could not check the magnitude, the standard errors, or whether the massed/spaced interaction survives multiple-comparison adjustment."
funding: "Not known - abstract only"
notes: |
  SAME SAMPLE AS lo2016_nfs - COHORT_FAMILY NFS_Singapore. These two records are the same 56 randomized
  adolescents analysed for different outcomes. The downstream pooler MUST NOT count them as two independent
  studies. If only one is used, prefer lo2016_nfs, which has extractable effect sizes.
  WHY THIS RECORD IS STILL WORTH HAVING: it is the only randomized experiment I found that measures an
  ACADEMIC learning outcome (GRE-type vocabulary retention, tested at 0 h, 24 h and 120 h) rather than a
  laboratory cognitive task, in adolescents, at exactly our subject's age and at almost exactly his weekday
  sleep dose (5 h TIB for 7 nights).
  THE FINDING THAT MATTERS MOST FOR OUR SUBJECT, who "crams" with occasional 3-4 h nights before exams:
  sleep restriction selectively destroyed recall of MASSED (crammed) material while leaving SPACED material
  intact. The interaction runs exactly against the strategy our subject uses. This is a mechanistic
  explanation for why Okano et al. (2019) found that semester-long sleep predicted grades but the night
  before an exam did not: sleep matters during encoding and consolidation of material as it is taught, and
  cramming under sleep restriction is the worst combination.
  It also implies a partially protective behavioural margin - a sleep-restricted student who spaces study can
  recover much of the loss - which the downstream model may want to represent as a moderator rather than
  assuming the full deficit applies.
  ACCESS LIMITATION: abstract_only. I verified the identifiers (PMID 27253768, PMCID PMC4989257, and DOI
  10.5665/sleep.6092 confirmed against Crossref as Sleep 39:1681-1690 with the matching title) and extracted
  the verbatim results and conclusions from the PubMed abstract, but I did not obtain the full text, so no
  numeric effect sizes or SEs are recorded. Both effect entries carry placeholder values that are explicitly
  flagged as non-poolable.
