rob:
  tool: ROBINS-I
  judgement: high
  notes: "Objective actigraphy is a major strength for the first stage. The grade outcome is weak: pre/post comparison of two DIFFERENT cohorts of 10th-grade biology students, small n, absolute (non-normalized) teacher-assigned grades, and the authors themselves warn the grades 'could carry an implicit bias from teachers who could have been for or against the school time change.'"
funding: "Not extracted from retrieved text"
notes: |
  IDENTIFYING ASSUMPTION: the 2016 (pre-change) and 2017 (post-change) cohorts of 10th-grade biology
  students at the same two Seattle high schools, in the same classes with the same instructors, are
  exchangeable apart from the bell-time change. This is a SINGLE-GROUP PRE/POST DESIGN with no control
  school, so it is the WEAKEST identification in this shard. Any secular trend, cohort composition
  change, or teacher grading drift is fully confounded with treatment. The authors are candid about
  the grading-bias risk.
  USE THIS RECORD FOR THE FIRST STAGE, NOT THE OUTCOME. Its unique contribution is a high-quality
  objectively measured first stage: a 55-minute bell delay bought 34 minutes of extra actigraphy-measured
  sleep (0.62 min of sleep per min of delay), achieved entirely by later wake time ("a 44 min later median
  sleep offset (P < 0.0001, effect size = 0.194), and a trend toward a later sleep onset that was not
  statistically significant"), with NO compensating change on non-school nights and no change in napping.
  It also documents a reduction in social jetlag (median 1.60 -> 1.25 h, P = 0.0118).
  Baseline sleep in this sample - median 6 h 50 min on school nights - is very close to our subject's
  reported weekday 5-6 h, so the first stage is measured on the relevant part of the sleep distribution.
  n: 84 students (2017) and 94 students (2016) contributed school-day actigraphy; I record n = 178 total.
  Each student contributed at least five school nights.
shard: "s04_academic_natural_experiments"
