rob:
  tool: Newcastle-Ottawa
  judgement: moderate
  notes: "Strong for an observational design: objective actigraphy, prospective, five independent samples at three universities, an explicit discovery/confirmation split (Study 1 discovery N=77, Studies 2-5 confirmation), and crucially it controls for PREVIOUS-TERM GPA, which absorbs a large amount of ability and conscientiousness confounding. Still observational: no exogenous variation, so residual confounding by concurrent workload, mental health and substance use remains, as does reverse causation from academic difficulty to sleep."
funding: "Not extracted from retrieved text"
notes: |
  TIER: T4, not T2. There is no natural experiment here. But this is the best answer to the task's
  question 6 ("any credible estimate of GPA change per hour of habitual sleep in college students, with the
  identification strategy stated"), and the identification strategy needs to be stated plainly:
  IDENTIFICATION STRATEGY = LAGGED-OUTCOME (VALUE-ADDED) REGRESSION ON OBSERVATIONAL DATA. The causal claim
  rests on conditioning on previous-term GPA, so that the estimate uses only the CHANGE in GPA. That
  removes time-invariant ability and study-habit confounders but not time-varying ones. It is materially
  more credible than a raw cross-sectional correlation (compare Okano et al., who adjust for nothing and
  whose implied per-hour effect is roughly 12 grade points per hour, i.e. absurd) and materially less
  credible than the school-start-time or sunset-time designs. The authors are careful to write
  "predicts"/"associated with", not "causes".
  ROBUSTNESS THAT MATTERS: the +0.07 GPA per hour survives adding daytime sleep, race, gender,
  first-generation status (N = 557) and, in a subset, total academic term load (N = 405). It replicated in
  3 of 4 confirmatory samples (Study 2 N=140 p=.01, Study 3 N=139 p<.01, Study 4 N=147 p=.01) and failed to
  reach significance but was correctly signed in Study 5 (N=131, p=.34). So the effect is real in this
  population but not enormous, and one in four samples missed it.
  HOW TO USE IT FOR OUR SUBJECT: he sleeps ~5-6 h on weekdays against a healthy young-adult reference of
  ~8-9 h, i.e. a deficit of roughly 2-3 h on weeknights, partially offset at weekends. Applying the linear
  0.07/h to a 2-hour average nightly deficit gives roughly 0.14 GPA points; to a 3-hour deficit, ~0.21
  points. But the paper's own threshold result warns the relationship is NOT linear below 6 h, where
  additional loss becomes disproportionately harmful, so 0.14-0.21 should be treated as a LOWER BOUND for a
  subject whose weekday sleep is at or under the 6 h threshold.
  IMPORTANT CROSS-CHECK AGAINST T2: the implied SD-scale effect is small. With a typical first-year college
  GPA SD of roughly 0.5-0.7 points, 0.07 GPA per hour is about 0.10-0.14 SD per hour of sleep - remarkably
  close to the Groen & Pabilonia implied academic IV of ~0.26 SD/h (same order) and vastly below
  Jagnani's ~1.15 SD/h or Giuntella-Han-Mazzonna's 0.4-0.6 SD/h. The convergence of the two best
  age-matched estimates (0.10-0.14 and 0.26 SD per hour) is the most useful quantitative anchor this shard
  produces.
  n: 557 in the pooled confirmatory analysis (Studies 2-5); 634 across all five studies including the
  N = 77 discovery sample. Descriptives: students averaged 41 min (SD 27.4) of daytime sleep per day.
shard: "s04_academic_natural_experiments"
