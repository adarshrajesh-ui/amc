rob:
  tool: ROBINS-I
  judgement: low
  notes: "Random assignment of freshmen to course sections and instructors at USAFA; two exogenous administrative changes to the daily schedule (7:30 -> 7:00 -> 7:50). Grades are objectively scored common exams. Main threats are (a) no measurement of sleep at all, so the sleep channel is assumed not demonstrated, and (b) generalizability from a highly selected military academy with a mandatory regimented schedule."
funding: "Not stated in article text retrieved"
notes: |
  IDENTIFYING ASSUMPTION: conditional on random assignment to course sections/instructors and on
  professor-by-year-by-day fixed effects, whether a student's course falls in first period is
  unrelated to unobserved determinants of that student's performance. This is close to
  experimental: USAFA randomly places freshmen into sections, and the institution shifted the
  first-period bell twice for administrative reasons. Assumption is PLAUSIBLE and this is the
  cleanest internal validity in the school-start-time literature.
  CRITICAL CAVEAT FOR THE MODELLER: Carrell et al. NEVER MEASURE SLEEP. There is no first stage.
  The 0.14 SD is the effect of a 7:00am class, not the effect of an hour of sleep. Herber, Quis &
  Heineck (2017) point out a specific alternative mechanism: "Note however that students allocated
  to later courses could not use the additional time in the mornings to sleep longer but were
  required to attend the early breakfast with their fellow students... Given that the military
  institution prohibited napping (p. 78), it is contradictory that additional sleep should be the
  main driver of higher performance. To us, it seems equally likely that students in late courses
  achieved higher grades because the empty time-slot allowed them to repeat and thereby better
  remember the course content." So this record should be treated as an UPPER BOUND on the
  time-of-day + sleep bundle, not as a per-hour-of-sleep estimate.
  A second reported result: the 7:00am effect spills over to that student's NON-first-period
  classes that same day (-0.131 SD, SE 0.049), which is more consistent with a fatigue/sleep
  channel than with a pure "empty timeslot to revise" channel.
  Sample: 6,165 first-year students, entering classes 2004-2008, 20,680 student-class observations.
  Population match to a US 18-year-old male entering his second year of college is excellent on age
  and sex but the USAFA environment (mandatory lights-out, prohibited napping, mandatory breakfast)
  is far more regimented than a normal college.
