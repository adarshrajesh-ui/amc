  judgement: critical
  notes: "County-level cross-sectional comparison of DST-observing vs non-observing Indiana counties. Not a discontinuity, not a panel, no within-county variation exploited in what the secondhand source describes. DST adoption in Indiana was correlated with proximity to Chicago/Louisville metro areas and hence with income, urbanicity and school quality. Very high risk of confounding."
funding: "Not known"
notes: |
  IDENTIFYING ASSUMPTION: that Indiana counties which historically observed DST are comparable to those
  which did not, apart from the clock regime. This is NOT PLAUSIBLE. Indiana's pre-2006 patchwork of DST
  observance tracked commuting ties to the Chicago and Louisville metropolitan areas, so DST-observing
  counties differ systematically in income, urbanization, industry mix and school resources - all strong
  predictors of SAT scores. This is EXACTLY the kind of study the task warned about: an observational
  cross-sectional comparison presented as a natural experiment.
  I include it only because the task explicitly asked for DST/test-score work, and because the contrast
  with Herber et al. is instructive: the well-identified DST regression discontinuity finds ~0.01-0.06 SD
  and no significance, while the poorly-identified DST cross-section finds 0.16 SD. The gap between those
  two numbers is a direct, within-topic measurement of confounding bias in this literature.
  RECOMMENDATION TO THE MODELLER: EXCLUDE from any pooled estimate, or include only with a very large
  downweight. The authors of the best DST paper in the field say of it, verbatim, "Yet, we doubt" - Herber
  et al. proceed to explain that they do not consider the Gaski & Sagarin identification credible.
  ACCESS: secondhand. I verified the identifier resolves to the correct paper (Journal of Neuroscience,
  Psychology, and Economics 2011;4(1):44-53) but did not obtain the full text, so n, covariates and SEs are
  unknown and recorded as null rather than guessed.
