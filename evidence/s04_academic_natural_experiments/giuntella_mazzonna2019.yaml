rob:
  tool: ROBINS-I
  judgement: moderate
  notes: "Spatial regression discontinuity at US time zone borders with a genuine, if small, measured first stage from ATUS time diaries. Weaknesses: self-reported cognitive impairment is a crude binary outcome; the first stage of ~19 min is small so the implied IV scaling is very sensitive; residential sorting across a time zone border and cross-border commuting are plausible violations, although the authors argue counties adjacent to a border are otherwise similar."
funding: "Not stated in retrieved working paper"
notes: |
  IDENTIFYING ASSUMPTION: counties immediately either side of a US time zone border are comparable on
  everything except the timing of natural light relative to clock time and hence relative to socially
  fixed school/work schedules. Sunset time therefore affects health and cognition only through the
  resulting circadian misalignment and sleep loss. This is a STANDARD AND WIDELY ACCEPTED design in
  economics (the same border-discontinuity logic that Gibson & Shrader use), and the assumption is
  reasonably PLAUSIBLE at short distances from the border. Residual concerns are cross-border commuting,
  economic discontinuities at borders (borders often follow rivers/state lines), and selective residence.
  WHAT IT CONTRIBUTES AND WHAT IT DOES NOT: this is the canonical sunset-time IV paper the task asked
  for, and its value here is the FIRST STAGE - about 19 minutes less sleep per hour of later sunset for
  employed adults, with the authors emphasising the effect is "considerably larger among individuals
  with early working schedules" (exactly the mechanism that makes early school start times bind on
  adolescents). It does NOT provide an academic outcome, and its cognitive outcome is a self-reported
  impairment dummy, not a test score. So it should inform the exposure model and the direction of the
  cognitive effect, not the magnitude of an academic effect.
  POPULATION MISMATCH: employed US adults aged 18-55 (sample restricted to this range to avoid
  age confounds), so `fair_adult`. Not adolescents.
  Sample: ATUS 2003-2013 with CPS county matching; after restrictions 18,639 individuals of whom 16,557
  were employed. The health/cognition outcomes come from BRFSS, a different (larger) dataset.
  Authors' own summary of the mechanism, verbatim: "individuals living on the late sunset side of a time
  zone boundary tend to go to bed later than do individuals living in the neighboring counties on the
  opposite side of the time zone border. Because working schedules and school start times are less
  flexible than bedtimes, individuals on the late sunset side of the border do not fully compensate by
  waking up later in the morning."
