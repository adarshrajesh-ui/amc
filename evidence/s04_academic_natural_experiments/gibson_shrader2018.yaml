rob:
  tool: ROBINS-I
  judgement: moderate
  notes: "Two complementary instruments (within-location seasonal sunset variation for short run; cross-location average sunset for long run), strong first stages, and extensive checks on alternative channels (work time, leisure substitution, naps). Weaknesses: the long-run specification collapses to 529 locations so identification is cross-sectional across places with all the confounding that implies; the outcome is earnings, not cognition or achievement."
funding: "Not stated in retrieved working paper"
notes: |
  IDENTIFYING ASSUMPTION: sunset time (which pins down when it gets dark relative to a socially fixed
  clock) affects wages only through sleep. The authors explicitly enumerate the exclusion restrictions and
  test the main threats: they show sunset time does not move work hours in the way a labor-supply
  confounder would ("when faced with an earlier sunset, workers allocate about a tenth of an hour per week
  less time to work in the short run and 0.7 hours more in the long run", with the long-run coefficients on
  work time and waking non-work time statistically indistinguishable from zero: 0.71 (0.62) and 0.27
  (0.57)), and they rule out compensating naps. This is a CREDIBLE design and the short-run version, which
  uses only within-location seasonal variation with location fixed effects, is the more convincing half.
  The long-run version is essentially a cross-location comparison and should be read with more caution.
  WHY IT IS IN THIS SHARD: the task asked for sunset-time IV evidence on wages and education, and this is
  the canonical paper. Two things make it decision-relevant even though the outcome is earnings:
  (1) The first stages are the largest and best-estimated in the sunset literature: -0.38 h per hour of
  sunset delay short run, -0.93 h long run. The long-run first stage is nearly one-for-one, which means
  chronic light-timing exposure produces a chronic sleep deficit rather than being fully compensated.
  (2) The long-run per-hour effect (5%) is ~4.5x the short-run per-hour effect (1.1%). If that ratio also
  holds for academic outcomes, it implies chronic sleep restriction over years does substantially more
  damage than the same nightly deficit measured acutely - directly relevant to our subject's 3-year
  exposure. The authors' own interpretation is more cautious, attributing part of it to wage rigidity and
  labor-capital complementarity, so this ratio should be used as a hypothesis, not a parameter.
  OUTCOME-DOMAIN NOTE: I filed the earnings effects under outcome_domain `academic` because the schema has
  no economic/productivity domain and earnings here is a human-capital productivity proxy. These are NOT
  test scores or GPA and must not be pooled with SD-of-test-score effects.
  POPULATION MISMATCH: US working adults (ATUS respondents in employment), so `poor_midlife`. Not students.
  n = 61,368 individual-day observations for the short-run analysis; 529 locations for the long-run analysis.
shard: "s04_academic_natural_experiments"
