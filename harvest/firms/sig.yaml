# ---------------------------------------------------------------------------
conflicts:
  - id: C1
    claim_a: "The quant OA is ~16 questions in 20 minutes (the 'SIG Quantitative Evaluation')."
    claim_b: "The quant OA is 17 questions in 60 minutes (the 'SIG Problem Solving Assessment')."
    assessment: >-
      BOTH ARE TRUE, AT DIFFERENT TIMES. This is the single most important resolution in this map.
      Claim A has genuine candidate support but only up to Feb 2024: a Sydney QT candidate
      (interviewed Feb 2024) wrote "Quantitative Evaluation which requires you to finish 16
      problems in 20 minutes", and a Philadelphia QT intern (Feb 2024, accepted offer) wrote
      "One online test, consisting of 16 questions in 25 minutes." Claim B has candidate support
      from Aug 2024 onward and nothing before: WSO Aug 2024, Glassdoor Oct 2024, the Saykin PDF
      Nov 2024, Glassdoor Jun 2025, 1p3a Feb 2026. There is no overlap. Anyone presenting the
      16-in-20 format as CURRENT is working from stale information; anyone presenting it as
      FABRICATED is also wrong.
    resolution: temporal_not_track

  - id: C2
    claim_a: "SIG's quant OA is a math test."
    claim_b: "SIG's OA is 4 CodeSignal algorithm questions in 70 minutes."
    assessment: >-
      BOTH TRUE, DIFFERENT TRACKS. This is the track hypothesis and it HOLDS for
      quant-vs-developer. Math OA: quant trader / quant research. Coding OA: SWE / SDE /
      Trading Systems Engineer, candidate-attested on CodeSignal with 2 questions in 60 min
      (2023) and 4 questions (2025). A "SIG OA question" is therefore only checkable against the
      right track — a coding question attributed to a quant trader OA, or a probability question
      attributed to the SWE OA, is a red flag.
    resolution: track_split_confirmed

  - id: C3
    claim_a: "jobtestprep: 'The Problem-Solving Assessment is made up of nine challenging numerical reasoning questions. You are given 60 minutes to solve all nine.'"
    claim_b: "Candidates: 17 questions in 60 minutes."
    assessment: >-
      Claim B wins decisively. jobtestprep gets the test NAME and the 60-minute duration right
      (both independently confirmed by the Saykin PDF, which is titled with SIG's own wording
      from a recruiter email), but the count is wrong by a factor of nearly two. Five independent
      candidate sources across three platforms and two languages say 17; the 1p3a 2026 writeup
      even numbers its questions up to "Question 17". Nine is vendor error, possibly a
      description of a shortened practice product.
    resolution: candidate_accounts_win

  - id: C4
    claim_a: "quantblueprint: '60-90 minutes, ~50-80 questions across the four sections', 'Negative marking: YES', 'Adaptive', platform 'HackerEarth'."
    claim_b: "Candidates: one undivided 17-question, 60-minute free-response paper."
    assessment: >-
      Claim A is unsupported on every dimension and contradicted on most. No candidate reports
      50-80 questions, four sections, negative marking, adaptivity, or HackerEarth. The
      free-response format visible in the reproduced test ("Compute the probability…") is
      structurally incompatible with the negative-marking-and-guessing advice quantblueprint
      gives. Reject.
    resolution: vendor_invention

  - id: C5
    claim_a: "quantt.co.uk: 'runs 60 to 75 minutes and contains roughly 30 to 50 questions'."
    claim_b: "Candidates: 17 questions in 60 minutes."
    assessment: >-
      Duration roughly right, count wrong. 30-50 is not supported by any candidate. Note this
      page also asserts the OA is done 'without a calculator' while other vendors insist a
      calculator is allowed — the vendors do not even agree with each other. Reject the count.
    resolution: vendor_invention

  - id: C6
    claim_a: "programhelp: '每道题都有严格时间限制，做完就进入下一题，不能回看' (each question is individually timed; you cannot go back)."
    claim_b: "Candidates describe budgeting time across the whole paper and re-checking earlier questions."
    assessment: >-
      Claim A is contradicted. The Feb-2026 candidate explicitly frames the risk as spending too
      long re-verifying the EARLY easy questions ("如果前面的简单题反复验算会…"), and several
      candidates report simply running out of time and not finishing — both of which presuppose a
      single 60-minute budget over 17 questions, not per-question timers. Reject the per-question
      timer claim. (Note programhelp's own separate page contradicts this one, describing a
      Mercer Mettl test where you may use a calculator.)
    resolution: candidate_accounts_win

  - id: C7
    claim_a: "A Dublin trading candidate (Sept 2025): 'There were 27 questions to complete.'"
    claim_b: "Everyone else in the same period: 17 questions."
    assessment: >-
      UNRESOLVED — recorded as a genuine outlier, not dismissed. This is a specific, dated,
      first-person WSO account from Dublin. Possibilities I cannot distinguish: a Dublin/EMEA
      variant; a different SIG test (aptitude-test-prep names a third assessment, the 'SIG
      Capital Markets Assessment', which I could not tie to any candidate); the role being
      generic 'Trading' rather than Quant Trader; or simple miscounting. A related Glassdoor
      account (NY, Sep 2024) says '20ish probability and statistics questions', which could be a
      loose recollection of 17 or could be a third value. Do NOT treat 17 as a hard falsifier of
      Dublin-sourced claims.
    resolution: unresolved

  - id: C8
    claim_a: "everythingquant: 'SIG's quantitative evaluation consists of 16 technical questions, with a time limit of 20 minutes.'"
    claim_b: "The current test is 17 in 60."
    assessment: >-
      NOT vendor invention, contrary to what the framing of this task assumed. This exact shape is
      corroborated by two independent candidates who interviewed in Feb 2024 (Sydney: '16 problems
      in 20 minutes'; Philadelphia: '16 questions in 25 minutes'). everythingquant is describing a
      real assessment — it is just describing the PREVIOUS one and presenting it as current.
      Stale, not fabricated.
    resolution: stale_but_real

  - id: C9
    claim_a: "tradermath: internships get the 20-min Quantitative Evaluation, full-time gets the 60-min Problem Solving Assessment."
    claim_b: "The split is by date, not by level."
    assessment: >-
      Claim A fails on my data and tradermath itself hedges it into meaninglessness ("we have
      heard of cases where those applying full-time actually receive the Quantitative Evaluation
      and those applying for the internship receive the 60-minute Problem Solving Assessment").
      Counter-evidence: a Feb-2024 INTERN got the short test; an Aug-2024 GRADUATE got the long
      one; a Nov-2024 FULL-TIME candidate got the long one; a 2024 INTERN-track QR candidate got
      the long one. Level does not predict format; date does.
    resolution: candidate_accounts_win

