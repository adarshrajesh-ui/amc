# ---------------------------------------------------------------------------
# SIG'S OWN STATED PROCESS (primary source, applies to trading tracks)
# ---------------------------------------------------------------------------
official_process_per_sig:
  confidence: high
  steps: ["Application", "Online Assessment", "Phone Interviews", "Office Interview", "Job Offer"]
  note: >-
    SIG's own wording is "Office Interview", not "Superday". Candidates and prep vendors say
    "superday"; SIG does not. Note also that SIG's own gloss on the OA is "Quantitative and
    problem-solving skills" — which happens to contain both of the two test names candidates
    report ("Quantitative Evaluation" and "Problem Solving Assessment").
  evidence:
    - url: https://au.gradconnection.com/employers/susquehanna-international-group/jobs/susquehanna-international-group-quantitative-trader-internship-november-2026-3/
      quote: "Our Interview Process: 1. Application 2. Online Assessment (Quantitative and problem-solving skills) 3. Phone Interviews (Behavioural and technical) 4. Office Interview (Trader interview, trade floor visit, and office tour) 5. Job Offer"
      date: 2026-07
      source_type: sig_own_job_posting
      role: Quantitative Trader Internship November 2026 (Sydney)
    - url: https://simplify.jobs/p/d11d99ce-06a3-4c8c-b15f-e6d562a1190a/Graduate-Quantitative-Trader
      quote: "Our Interview Process: 1. Application2. Online Assessment (Quantitative and problem-solving skills) 3. Phone Interviews (Behavioural and technical)4. Office Interview (Trader interview, trade floor visit, and office tour)5. Job Offer"
      date: 2026-07
      source_type: sig_own_job_posting_mirror
      role: Graduate Quantitative Trader (Sydney)
    - url: https://www.quantblueprint.com/jobs/sig-quantitative-trading-internship-november-2026-expression-of-interest
      quote: "- Application\n- Online Assessment (Quantitative and problem-solving skills) - Phone Interviews (Behavioural and technical)\n- Office Interview (Trader interview, desk rotation, office tour)\n- Job Offer"
      date: 2026
      source_type: sig_own_job_posting_mirror
      note: "Same SIG boilerplate, but 'desk rotation' instead of 'trade floor visit'."

# ---------------------------------------------------------------------------
# THE CENTRAL FINDING
# ---------------------------------------------------------------------------
headline_finding:
  summary: >-
    SIG runs (at least) THREE distinct first-round assessments, and the apparent contradiction in
    the prep-vendor literature dissolves once you separate them by TRACK and by DATE.
  assessments:
    - id: A
      name: "SIG Quantitative Evaluation"
      shape: "~16 questions in 20-25 minutes"
      who: "Quant Trader / trading tracks"
      when: "observed 2020 through Feb 2024; not observed in any account after Feb 2024"
    - id: B
      name: "The Susquehanna Problem Solving Assessment"
      shape: "17 free-response questions in 60 minutes"
      who: "Quant Trader AND Quant Research AND Quant Systematic Trading — one shared question bank"
      when: "observed Aug 2024 through Feb 2026, continuous"
    - id: C
      name: "coding OA (CodeSignal / C++)"
      shape: "2 questions in 60 min (2023) -> 3-4 questions (2025 onward)"
      who: "Software Engineer / SDE / Trading Systems Engineer"
      when: "2023 through Dec 2025"
  track_hypothesis_verdict: >-
    PARTIALLY CONFIRMED, but not in the way the brief proposed. The quant-vs-developer split is
    real and strongly evidenced: quant tracks get a math OA, software tracks get a coding OA
    (candidate-attested on both sides). The QT-vs-QR split is FALSE: quant traders and quant
    researchers demonstrably sit the SAME 17-question test from the SAME question bank. The
    16-in-20 vs 17-in-60 discrepancy is NOT a track difference — it is a FORMAT CHANGE over time.

# ---------------------------------------------------------------------------
