        source_type: teamblind

  - date_range: "2024 -> 2026"
    track: "quant"
    change: >-
      NO format change within the long-form era, but the question bank is refreshed by mutating
      numbers while keeping the problem skeletons. The frog problem's destination moved
      B(5,4) -> B(5,6) (and a third-party homework site shows a B(7,4) variant); the token-betting
      problem's win probability moved 3/4 -> 2/3.
    confidence: high
    evidence:
      - url: https://www.1point3acres.com/bbs/thread-1166650-1-1.html
        quote: "题型是地里一样的，但是很多数字有改动，有的表述细节稍有变动"
        quote_en: "The question types are the same as on the forum, but many numbers have been changed and some wording details slightly altered."
        date: 2026-02-27
