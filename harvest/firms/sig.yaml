format_drift:
  - date_range: "before 2024-03 -> after 2024-08"
    track: "quant trader / quant research"
    change: >-
      The quant first-round assessment changed from a short, fast ~16-question / 20-25-minute
      test (the "SIG Quantitative Evaluation") to a long-form 17-question / 60-minute
      free-response test (the "Susquehanna Problem Solving Assessment"). No candidate account
      reports the short format after Feb 2024 and none reports the long format before Aug 2024.
      The changeover window is therefore Mar-Jul 2024, i.e. immediately before the autumn 2024
      campus cycle.
    confidence: high
    evidence_before:
      - url: https://www.glassdoor.com/Interview/Susquehanna-International-Group-Quantitative-Trader-Interview-Questions-EI_IE24446.0,31_KO32,51.htm
