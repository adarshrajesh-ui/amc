  - "Whether navigation between questions is free (inferred yes, never stated by a candidate)"
  - "Proctoring / webcam / ID verification for the quant OA"
  - "Existence of a separate sequences test, mental-math test, or personality questionnaire as distinct stages"
  - "Superday internals for quant tracks: number of rounds, presence of trading games, poker, group exercises"
