consistency_prior_summary:
  use: "Quick reference for scoring a claimed SIG question's stated format."
  rules:
    - "Quant trader / quant researcher, 2024-08 onward: 17 free-response questions, 60 minutes, one undivided paper, no reported sections. A claim of multiple-choice, per-question timers, or a section structure is off-pattern."
    - "Quant trader, 2024-02 and earlier: ~16 questions in 20-25 minutes. A short-format claim dated 2025+ is off-pattern; a short-format claim dated 2023-24 is fine."
    - "A coding/algorithm question attributed to the QUANT TRADER or QUANT RESEARCH OA is off-pattern. Coding OAs belong to SWE/SDE/Trading Systems Engineer."
    - "A probability/EV question attributed to the SWE CodeSignal OA is off-pattern."
    - "Question phrasing on the quant OA is imperative and free-response: 'Compute the probability...', 'Compute the expected...'. Multiple-choice phrasing is off-pattern."
    - "Numbers within a known SIG problem skeleton drift year to year. Skeleton match = authentic; exact-number match = weak evidence either way."
    - "Any provenance citing a SIG superday poker round or group trading game is unverified in this corpus."
    - "Dublin accounts are the one place a non-17 count (27) is attested. Do not hard-reject Dublin-sourced counts."

could_not_establish_global:
  - "OA vendor platform for the quant tracks (Mercer Mettl vs HackerEarth vs SIG's own portal) — vendor-only, no candidate attestation"
  - "Calculator permitted"
  - "Scratch paper permitted"
