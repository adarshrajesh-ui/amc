      quote: "The suicide rate for people aged 15-19 did not change significantly from 2001
        through 2009, then increased 57% from 2009 through 2017 (from 7.5 deaths per 100,000
        to 11.8). From 2017 through 2021, the trend did not change significantly. ... The
        suicide rate for people aged 20-24 increased 63% from 2001 through 2021 (from 11.9
        deaths per 100,000 to 19.4)."
