    sex: male
    competing_risk_adjusted: false
    definition: "Total diabetes = self-reported diagnosed diabetes OR fasting plasma
      glucose >=126 mg/dL OR HbA1c >=6.5% with no prior diagnosis."
    source: "Gwira JA, Fryar CD, Gu Q. Prevalence of Total, Diagnosed, and Undiagnosed
      Diabetes in Adults: United States, August 2021-August 2023. NCHS Data Brief No.
      516. Hyattsville, MD: National Center for Health Statistics; 2024."
    doi_or_url: "10.15620/cdc/165794"
    year: 2024
    data_years: "August 2021-August 2023"
    population: "NHANES, n = 2,938 fasting subsample (men n = 1,306)"
    quote: "Men . . . 18.0 (15.7-20.4)"
    verification: {status: VERIFIED, doi_resolves: true, pmid: "40085919"}
    notes: "Diagnosed only, men: 12.9% (11.0-15.0). Undiagnosed, men: 5.1% (3.6-6.9).
      The 5.1 pp undiagnosed fraction means the Gregg/Koyama lifetime risks, which are
      built on DIAGNOSED diabetes, UNDERSTATE the lifetime risk of the biological
      disease by roughly the diagnosed:total ratio 12.9/18.0 = 0.717. A defensible
      lifetime risk of TOTAL diabetes for a US male is therefore ~33-40% / 0.717 =
      46-56%, but no publication states this directly, so treat it as a sensitivity
      scenario, not a point estimate."

