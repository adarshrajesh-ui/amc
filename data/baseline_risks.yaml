        1.64x the 15-19 band, so suicide hazard is rising steeply across precisely the ages
        18-22 that this project models. A model that applies the flat 15-24 male rate will
        understate risk at 20-22 and overstate it at 16-18. Use the 1.64 ratio to shape the
        male-specific rate across the window; do NOT use 11.8 or 19.4 as male rates, since
        they pool both sexes and male rates run roughly 4x female in this age range."
    notes: "SCALE CHECK the model should use: at 21.1 per 100,000 per year, suicide is
      about 19.9% of ALL-CAUSE male mortality at age 19 (all-cause q19 = 0.001061 in the
      life table this shard built). Because a suicide death at 19 destroys the entire
      57.66-year remaining life expectancy, suicide is the single highest-leverage
      mortality pathway in the whole model for this subject: a 10% relative increase in
      suicide hazard confined to ages 19-22 costs about 0.006 years, but a 10% increase
      in suicide hazard sustained to age 35 costs roughly 10x that. Compute it with
      hr_to_life_expectancy.delta_ex(hr, age_from, age_to, cause_fraction=0.199)."

# -------------------------------------------------------------------------------------
# 8. PUBLISHED LIFE-EXPECTANCY / QALY ESTIMATES FOR SHORT SLEEP (external cross-checks)
#    These are NOT baseline risks. They are independent published answers to
#    approximately the question this project is asking, retained so the model's own
#    calculation can be sanity-checked against them.
# -------------------------------------------------------------------------------------
sleep_life_expectancy_cross_checks:

  - id: chaput2022_years_of_life_gained_canada
    claim: "Life expectancy at age 20 is 1.2 years longer for adults meeting sleep
      duration recommendations than for SHORT sleepers (and 2.6 years longer than for long
      sleepers). Differences between men and women were minimal."
    value_years: 1.2
    sign_convention: "positive = years LOST by short sleepers relative to recommended sleep"
    ci: null
    age_at_assessment: 20
    sex: both
    source: "Chaput JP, Carrier J, Bastien C, Gariepy G, Janssen I. Years of life gained
      when meeting sleep duration recommendations in Canada. Sleep Med. 2022;100:85-88."
    doi_or_url: "10.1016/j.sleep.2022.08.006"
    year: 2022
    quote: "Adults who meet the sleep duration recommendations have an estimated life
      expectancy at age 20 years that is 1.2 years longer than short sleepers and 2.6 years
      longer than long sleepers. Differences between men and women were minimal."
    verification: {status: VERIFIED, doi_resolves: true, pmid: "36029755"}
    methodology: "Exactly the machinery this shard documents: (i) prevalence of short,
      recommended and long sleep from national survey data; (ii) all-cause mortality
      relative risks for sleep duration taken from published meta-analyses;
      (iii) age-specific probabilities of death from national life tables; then a
      hazard-modified life table. Index age 20 is nearly the subject's age."
    weaknesses:
      - "Canadian life tables and Canadian sleep prevalence, not US."
      - "Inherits ALL the confounding in the observational sleep-mortality meta-analyses:
        reverse causation (illness shortens sleep), residual confounding by shift work,
        depression, obesity and socioeconomic status. The RR is not causal."
      - "Self-reported habitual sleep duration in adults; no actigraphy, no adolescents."
      - "Applies a single lifelong RR from age 20 to death. This is the OPPOSITE of our
        exposure structure, which is 3 years of restriction at ages 16-19 followed by
        unknown persistence. Their 1.2 years is therefore an UPPER BOUND on what 3 years
        of adolescent restriction could cost via the mortality channel unless the
        exposure permanently reprograms risk."
      - "No QALY weighting; life-years only."
    reproduction_by_this_shard: "Applying an all-cause mortality hazard ratio of 1.10-1.13
      lifelong from age 20 to the NCHS 2023 US male life table gives -1.15 to -1.48 years
      at age 20 (hr_to_life_expectancy.py section G). The published 1.2-year figure sits
      inside that band, so the two methods agree. This is a genuine external validation of
      the conversion machinery, not a coincidence."

  - id: li2024_life_expectancy_at_30_by_sleep_pattern
    claim: "US men with all 5 low-risk sleep factors had life expectancy at age 30 that
      was 4.7 years greater than men with 0-1 low-risk sleep factors."
    value_years: 4.7
    sign_convention: "positive = years GAINED by the healthy-sleep group"
    ci: [2.7, 6.7]
    age_at_assessment: 30
    sex: male
    source: "Li H, Qian F, Han L, Feng W, Zheng D, Guo X, Zhang H. Association of healthy
      sleep patterns with risk of mortality and life expectancy at age of 30 years: a
      population-based cohort study. QJM. 2024;117(3):177-186."
    doi_or_url: "10.1093/qjmed/hcad237"
    year: 2024
    quote: "When compared to those with 0-1 low-risk sleep factors, life expectancy at the
      age of 30 years for individuals with all five low-risk sleep factors was 4.7 (95% CI:
      2.7-6.7) years greater for men and 2.4 (95% CI: 0.4-4.4) years greater for women.
      . . . The adjusted hazard ratios (95% confidence intervals [CI]) of participants with
      five vs. 0-1 low-risk sleep factors for all-cause, cardiovascular, and cancer
      mortality were 0.70 (0.63-0.77), 0.79 (0.67-0.93) and 0.81 (0.66-0.98),
      respectively. Nearly 8% (population attributable fraction 7.9%, 95% CI: 5.5-10.4) of
      mortality in this cohort could be attributed to suboptimal sleep patterns."
    verification: {status: VERIFIED, doi_resolves: true, pmid: "37831896"}
    methodology: "US National Health Interview Survey 2013-18, n = 172,321, linked to
      National Death Index through 2019. Flexible parametric survival model, life
      expectancy at 30 by count of low-risk sleep factors (7-8 h duration, no difficulty
      falling asleep, no difficulty staying asleep, no sleep medication, feeling rested)."
    weaknesses:
      - "MUCH LARGER than Chaput's 1.2 years because the contrast is a 5-factor composite
        (duration + insomnia + medication + restedness), not sleep duration alone.
        Attributing all 4.7 years to short sleep duration would be a category error."
      - "Median follow-up only 4.3 years with 8,681 deaths, so life expectancy at 30 is
        extrapolated far beyond the observed data by the parametric model. The CI (2.7-6.7)
        understates that extrapolation uncertainty."
      - "Self-reported sleep; mean age 47, so almost no adolescent or young-adult exposure."
      - "Reverse causation is severe for the insomnia/restedness components: people dying
        within 4.3 years were often already ill."
      - "HR 0.70 for all-cause mortality implies HR 1.43 for the poor-sleep group, which
        by the machinery in this shard would cost about 4.5 years at age 30 -- internally
        consistent with their 4.7, but the causal interpretation is the weak link."

  - id: huang2023_cvd_free_life_expectancy
    claim: "Male poor sleepers lost 2.31 CVD-free years relative to healthy sleepers;
      intermediate sleepers lost 0.55 years."
    value_years: 2.31
    sign_convention: "positive = CVD-free years LOST by poor sleepers"
    ci: [1.46, 3.29]
    age_at_assessment: 40
    sex: male
    source: "Huang BH, Del Pozo Cruz B, Teixeira-Pinto A, Cistulli PA, Stamatakis E.
      Influence of poor sleep on cardiovascular disease-free life expectancy: a
      multi-resource-based population cohort study. BMC Med. 2023;21(1):75."
    doi_or_url: "10.1186/s12916-023-02732-x"
    year: 2023
    quote: "We observed a gradual loss in CVD-free life expectancy toward poor sleep such
      as, compared with healthy sleepers, poor sleepers lost 1.80 [95% CI 0.96-2.75] and
      2.31 [1.46-3.29] CVD-free years in females and males, respectively, while
      intermediate sleepers lost 0.48 [0.41-0.55] and 0.55 [0.49-0.61] years. Among men,
      those with clinical insomnia or sleep-related breathing disorders lost CVD-free life
      by 3.84 [0.61-8.59] or 6.73 [5.31-8.48] years, respectively."
    verification: {status: VERIFIED, doi_resolves: true, pmid: "36859313"}
    methodology: "UK Biobank, 308,683 middle-aged adults, three-state Markov model
      (healthy -> CVD -> death) conditioning on survival at age 40. Composite sleep score
      from chronotype, duration, insomnia complaints, snoring and daytime sleepiness."
    weaknesses:
      - "CVD-FREE life expectancy, not total life expectancy; not directly comparable to
        the two records above."
      - "UK Biobank is a healthy-volunteer cohort with ~5% response, middle-aged at
        baseline; no adolescents."
      - "The composite sleep score conflates duration with insomnia, snoring and
        chronotype. The INTERMEDIATE-sleeper estimate (0.55 y for men, CI 0.49-0.61) is
        the more relevant contrast for mild-to-moderate restriction and is 4x smaller."
      - "Self-reported exposure at a single time point."

  - id: ma2023_le8_sleep_life_expectancy
    claim: "A high LE8 sleep health score was associated with 5.0 more years of life
      expectancy at age 50 than a low one. This is the LARGEST published sleep
      life-expectancy figure found, and it is NOT mutually adjusted for the other seven
      cardiovascular-health components, so it is a ceiling, not an estimate."
    value_years: 5.0
    sign_convention: "positive = years LOST by the low-sleep-health group"
    ci: [3.2, 6.7]
    se: 0.893
    age_at_assessment: 50
    sex: both
    source: "Ma H, Wang X, Xue Q, Li X, Liang Z, Heianza Y, Franco OH, Qi L. Cardiovascular
      Health and Life Expectancy Among Adults in the United States. Circulation.
      2023;147(15):1137-1146."
    doi_or_url: "10.1161/CIRCULATIONAHA.122.062457"
    year: 2023
    data_years: "NHANES 2005-2018, mortality through 2019-12-31"
    population: "23,003 non-pregnant, non-institutionalised US adults aged 20-79, free of
      self-reported CVD at baseline; 1,359 deaths (328 CVD) over median 7.8 y"
    quote: "The new component for CVH--high sleep health score was significantly associated
      with a longer life expectancy at age 50 by 5.0 (95% CI, 3.2-6.7) years for all
      participants."
    supporting_values:
      total_le8_high_vs_low_all: {value: 8.9, ci: [6.2, 11.5]}
      total_le8_high_vs_low_male: {value: 8.1, ci: [4.2, 12.0]}
      tobacco_component_high_vs_low: {value: 7.4, ci: [5.7, 9.1]}
      per_10_point_le8: {value: 2.2, ci: [1.0, 3.2]}
      life_expectancy_at_50_by_cvh:
        low_le8_under_50: {value: 27.3, ci: [26.1, 28.4]}
        moderate_le8_50_to_79: {value: 32.9, ci: [32.3, 33.4]}
        high_le8_80_plus: {value: 36.2, ci: [34.2, 38.2]}
      pct_of_gain_attributable_to_reduced_cvd_death: 42.6
    verification: {status: VERIFIED, doi_resolves: true, pmid: "37036905"}
    methodology: "NHANES 2005-2018 linked to the National Death Index. Life-table method
      applied to mortality rates by CVH stratum, extrapolating survival from age 50 to 100.
      LE8 sleep health scores 7 to <9 h as 100 and penalises shorter durations, so the
      'low sleep health' group is dominated by short sleepers."
    weaknesses:
      - "DECISIVE: the single-component estimates are marginal high-vs-low contrasts, NOT
        adjusted for the other seven components. The paper's own arithmetic proves they
        overlap: tobacco alone (7.4 y) plus sleep alone (5.0 y) = 12.4 y, which already
        EXCEEDS the entire high-vs-low total LE8 contrast of 8.9 y before the remaining six
        components are counted. The 5.0 years therefore contains most of the smoking, diet,
        BMI, glucose and blood-pressure effect and cannot be attributed to sleep."
      - "Confirming the correlation: mean sleep health score is 68.2 in the low-CVH stratum
        versus 93.2 in the high-CVH stratum, so sleep score is a proxy for overall CVH."
      - "The component analysis adjusts only for age, sex and race/ethnicity -- not for
        socioeconomic position, the dominant confounder of both sleep and mortality."
      - "Indexed at age 50, so it conditions on surviving to 50 and says nothing about
        exposure at ages 16-19."
      - "1,359 deaths over a median 7.8 years support extrapolation of survival to age 100."
      - "Sleep duration self-reported at a single NHANES interview."
    reconciliation: "The four published anchors span 1.2 to 5.0 years and order themselves
      exactly by how much non-sleep lifestyle each contrast absorbs: Chaput 2022 (1.2 y,
      sleep duration alone via meta-analytic RR) < Huang 2023 (2.31 CVD-free y, 5-item
      sleep composite) < Li 2024 (4.7 y, 5-factor sleep composite) < Ma 2023 (5.0 y,
      unadjusted single component of an 8-part lifestyle score). Allocating Ma's male total
      of 8.1 y equally across the 8 components gives about 1.0 y for sleep, which agrees
      with Chaput's 1.2 y and with this shard's life table under a lifelong all-cause
      HR of 1.10-1.13. THE 1.0-YEAR EQUAL-SHARE FIGURE IS THIS SHARD'S ARITHMETIC, NOT
      PUBLISHED. Recommended prior for the pure mortality channel: 1.0-1.5 years of e19
      lost for a LIFELONG short-sleep habit, and far less for a 3-year window (see
      competing_risk_method.md section 3)."

