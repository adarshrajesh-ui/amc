# =====================================================================================
# baseline_risks.yaml -- ABSOLUTE baseline risks for a US MALE, the denominators that
# every hazard ratio and risk ratio in this project must be multiplied against.
#
# Produced by shard s17_baseline_risk. Companion files:
#   /workspace/data/lifetable_us_male.csv        ages 19-110, qx/lx/ex
#   /workspace/data/lifetable_us_male_full.csv   ages 0-120, all life table columns
#   /workspace/evidence/s17_baseline_risk/competing_risk_method.md
#   /workspace/evidence/s17_baseline_risk/hr_to_life_expectancy.py
#
# HARD RULES FOR CONSUMERS OF THIS FILE
#   1. Do NOT multiply a hazard ratio by a lifetime risk. See competing_risk_method.md
#      section 3. Use  CI_exposed = 1 - (1 - CI_baseline)^HR  at minimum, and prefer
#      re-running the incidence schedule through the competing-risk recursion.
#   2. Every `verification.status` field must be read. Records marked
#      DERIVED_BOUNDS or UNVERIFIED are not published point estimates; they carry the
#      widest defensible range and must be given wide priors.
#   3. `definition` is load-bearing. "Diabetes" in Gregg 2014 is self-reported
#      diagnosed diabetes of any type; "hypertension" in Vasan 2002 is >=140/90
#      (JNC-VI) while the 2024 NHANES figure uses >=130/80 (2017 ACC/AHA). These are
#      NOT interchangeable.
#   4. `competing_risk_adjusted` tells you whether the number already accounts for
#      death from other causes. Mixing adjusted and unadjusted estimates is the single
#      most common way to inflate an absolute risk by 3-5x.
#
# Field schema for every entry under `risks`:
#   id                        unique snake_case key
#   outcome                   disease/condition
#   metric                    what kind of quantity this is (see `metric_vocabulary`)
#   value                     point estimate
#   unit                      percent | per_100k_per_year | years | probability | ratio
#   ci                        [lower, upper] 95% interval, or null
#   se                        standard error if the source reports one, else null
#   age_at_assessment         exact age (or [lo, hi] band) at which risk is assessed
#   age_horizon               age to which the risk accumulates, or null
#   sex                       male | female | both
#   competing_risk_adjusted   true | false | null (unknown/not applicable)
#   definition                verbatim-grounded case definition
#   source                    short citation
#   doi_or_url
#   year                      publication year
#   data_years                years of the underlying data
#   population                cohort / survey
#   quote                     verbatim supporting sentence from the retrieved source
#   verification              {status, doi_resolves, pmid}
#   notes                     caveats, transportability to a 19-year-old US male
# =====================================================================================

meta:
  shard: s17_baseline_risk
  subject: "US male, exact age 19"
  generated_for: "sleep-restriction damage model; supplies absolute-risk denominators"
  metric_vocabulary:
    lifetime_risk: "cumulative probability of first event from index age to end of life,
      death from other causes treated as a competing event (Aalen-Johansen / CIF)"
    residual_lifetime_risk_unadjusted: "cumulative incidence from index age, NOT adjusted
      for competing mortality (1 - Kaplan-Meier). Systematically LARGER than lifetime_risk."
    morbid_risk: "projected cumulative lifetime risk to a stated age (usually 75) in
      survey data, estimated from age-of-onset curves; larger than observed
      lifetime prevalence because young respondents are still at risk"
    lifetime_prevalence: "proportion of a cross-section who have EVER met criteria; a
      downward-biased estimate of lifetime risk for young people"
    period_prevalence: "proportion currently affected in a stated window (e.g. past 12 months)"
    cross_sectional_prevalence: "proportion affected at survey time in an age band;
      NOT a cumulative incidence (survivor bias, cohort effects)"
    incidence_rate: "events per person-time"
    survival_probability: "life-table probability of surviving between two exact ages"

# -------------------------------------------------------------------------------------
# 0. THE MORTALITY DENOMINATOR (from the life table this shard built)
# -------------------------------------------------------------------------------------
mortality_baseline:
  source: "Arias E, Xu JQ, Kochanek K. United States life tables, 2023. Natl Vital Stat
    Rep. 2025 Jul 15;74(6):1-63."
  doi_or_url: "https://doi.org/10.15620/cdc/174591"
  year: 2025
  data_years: "2023"
  sex: male
  table: "Table 2. Life table for males: United States, 2023"
  published_life_expectancy:
    e0_years: 75.8
    e0_years_full_precision: 75.8178
    e19_years: 57.7
    e19_years_full_precision: 57.6565
    e19_months: 691.88
    e65_years_full_precision: 18.1943
    quote: "Between 2022 and 2023, life expectancy at birth increased by 1.0 year for
      males (from 74.8 to 75.8) and by 0.9 year for females (80.2 to 81.1)."
  independent_cross_check_ssa:
    source: "U.S. Social Security Administration, Office of the Chief Actuary. Period
      Life Table, 2023, as used in the 2026 Trustees Report."
    doi_or_url: "https://www.ssa.gov/oact/STATS/table4c6.html"
    e0_years: 75.79
    e19_years: 57.62
    note: "Differs from NCHS by 0.03-0.04 y because the Social Security area population
      is not the US resident population. Agreement well inside the 0.3 y gate G10."
  # recomputed from the CSV this shard wrote; reproducible via hr_to_life_expectancy.py
  survival_probabilities_from_age_19:
    to_25: 0.9920
    to_30: 0.9831
    to_40: 0.9583
    to_50: 0.9216
    to_55: 0.8943
    to_65: 0.7996
    to_70: 0.7274
    to_75: 0.6362
    to_80: 0.5168
    to_85: 0.3628
    to_90: 0.1948
  qx_at_19: 0.001061
  note: "A 19-year-old US male has only a 51.7% chance of reaching 80 and a 79.96%
    chance of reaching 65 under 2023 mortality. Any lifetime risk quoted WITHOUT
    competing mortality is therefore inflated by roughly this much."

risks:

  # -----------------------------------------------------------------------------------
  # 1. TYPE 2 DIABETES
  # -----------------------------------------------------------------------------------
  - id: diabetes_lifetime_risk_from_age20_male_2000_2011
    outcome: diabetes_any_diagnosed
    metric: lifetime_risk
    value: 40.2
    unit: percent
    ci: [39.2, 41.3]
    se: null
    age_at_assessment: 20
    age_horizon: null
    sex: male
    competing_risk_adjusted: true
    definition: "Self-reported diagnosed diabetes, any type, excluding gestational
      diabetes. Markov chain model with mortality as a competing state."
    source: "Gregg EW, Zhuo X, Cheng YJ, Albright AL, Narayan KMV, Thompson TJ. Trends in
      lifetime risk and years of life lost due to diabetes in the USA, 1985-2011: a
      modelling study. Lancet Diabetes Endocrinol. 2014;2(11):867-874."
    doi_or_url: "10.1016/S2213-8587(14)70161-5"
    year: 2014
    data_years: "2000-2011"
    population: "National Health Interview Survey linked mortality, 598,216 adults"
    quote: "On the basis of 2000-11 data, lifetime risk of diagnosed diabetes from age 20
      years was 40.2% (95% CI 39.2-41.3) for men and 39.6% (38.6-40.5) for women,
      representing increases of 20 percentage points and 13 percentage points,
      respectively, since 1985-89."
    verification: {status: VERIFIED, doi_resolves: true, pmid: "25128274"}
    notes: "This is the seed figure the task named and it is real. BUT it is superseded
      for currency by Koyama 2022 below, which uses the same NHIS data source through
      2018 and finds a LOWER lifetime risk (32.8%) because diagnosed-diabetes incidence
      fell after 2009. Use 40.2% as the upper end of the plausible range for a male, not
      as the central estimate. `diabetes_any_diagnosed` is not the same construct as
      incident type 2 diabetes; type 1 is a small but nonzero share."

  - id: diabetes_lifetime_risk_from_age20_both_2015_2018
    outcome: diabetes_any_diagnosed
    metric: lifetime_risk
    value: 32.8
    unit: percent
    ci: [32.4, 33.2]
    se: null
    age_at_assessment: 20
    age_horizon: 84
    sex: both
    competing_risk_adjusted: true
    definition: "Self-reported diagnosed diabetes; multistate difference equation
      accounting for competing risks; lifetime risk accumulated to age 84."
    source: "Koyama AK, Cheng YJ, Brinks R, Xie H, Gregg EW, Hoyer A, Pavkov ME,
      Imperatore G. Trends in lifetime risk and years of potential life lost from
      diabetes in the United States, 1997-2018. PLoS One. 2022;17(5):e0268805."
    doi_or_url: "10.1371/journal.pone.0268805"
    year: 2022
    data_years: "2015-2018"
    population: "National Health Interview Survey, 653,811 adults aged >=18"
    quote: "LR for adults at age 20 increased from 31.7% (95% CI: 31.2-32.1%) in 1997-1999
      to 40.7% (40.2-41.1%) in 2005-2009, then decreased to 32.8% (32.4-33.2%) in
      2015-2018."
    verification: {status: VERIFIED, doi_resolves: true, pmid: "35609056"}
    notes: "MOST CURRENT lifetime-risk estimate. Not sex-specific: the paper reports LR
      for adults overall, not for men separately. Male-specific LR is likely close to the
      overall figure (Gregg 2014 found men 40.2% vs women 39.6%, i.e. near-identical).
      RECOMMENDED CENTRAL ESTIMATE for a 19-year-old US male: 33-40%, with 32.8% as the
      contemporary anchor and 40.2% as the male 2000-2011 anchor.
      Horizon is 84, not end of life, so this slightly understates true lifetime risk."

