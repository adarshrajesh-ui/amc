    doi_or_url: "10.1001/jama.290.14.1884"
    year: 2003
    data_years: "1984-2000"
    population: "National Health Interview Survey; cohort born in 2000"
    quote: "The estimated lifetime risk of developing diabetes for individuals born in
      2000 is 32.8% for males and 38.5% for females."
    verification: {status: VERIFIED, doi_resolves: true, pmid: "14532317"}
    notes: "Historical anchor. Coincidentally the same number as Koyama 2022 for a
      different index age; do not conflate."

  - id: diabetes_lifetime_risk_at_age18_male_by_bmi
    outcome: diabetes_any_diagnosed
    metric: lifetime_risk
    value: null
    unit: percent
    ci: null
    se: null
    age_at_assessment: 18
    age_horizon: null
    sex: male
    competing_risk_adjusted: true
    definition: "Lifetime risk of diagnosed diabetes at age 18 by BMI category (Markov
      model). Only the extremes of the range are in the retrievable abstract."
    value_by_bmi:
      underweight: 7.6
      very_obese: 70.3
      normal_weight: null
      overweight: null
      obese: null
    # Published as DIFFERENCES vs normal weight, not levels, so they are kept separate
    # from value_by_bmi to prevent a consumer reading them as absolute risks.
    risk_difference_pct_points_vs_normal_weight_at_age_65_male:
      overweight: 3.7
      very_obese: 23.9
      note: "The abstract reports only the two ends of this range; obese_30_39_9 is
        bracketed between them but not published, so it is omitted rather than guessed."
    source: "Narayan KMV, Boyle JP, Thompson TJ, Gregg EW, Williamson DF. Effect of BMI
      on lifetime risk for diabetes in the U.S. Diabetes Care. 2007;30(6):1562-1566."
    doi_or_url: "10.2337/dc06-2544"
    year: 2007
    data_years: "1997-2004"
    population: "National Health Interview Survey, n = 780,694"
    quote: "Lifetime diabetes risk at 18 years of age increased from 7.6 to 70.3% between
      underweight and very obese men and from 12.2 to 74.4% for women. ... At 65 years of
      age, compared with normal-weight male subjects, lifetime risk differences (percent)
      increased from 3.7 to 23.9 percentage points between overweight and very obese men."
    verification: {status: VERIFIED, doi_resolves: true, pmid: "17372155"}
    notes: "THE MOST DECISION-RELEVANT DIABETES RECORD IN THIS FILE for a sleep model,
      because it is indexed at exactly age 18 and it is stratified by the mediator that
      short sleep actually moves (BMI). A 9.2-fold spread in lifetime diabetes risk
      across BMI at age 18 means the sleep -> BMI -> diabetes path can be modelled by
      shifting the subject along this gradient rather than by applying a diabetes HR.
      Only the extreme categories are quotable; full text is paywalled (diabetesjournals.org
      returns HTTP 403 to automated clients and a Cloudflare challenge through a text proxy),
      so the intermediate categories are marked null rather than guessed.
      The age-65 block also shows the effect SHRINKING with age (a 23.9-point spread at 65
      versus a 62.7-point spread at 18), which is the quantitative case for why an exposure
      acting at ages 16-19 matters more than the same exposure acting in later life.
      access_tier: abstract_only."

  - id: diabetes_total_prevalence_us_male_age20plus
    outcome: diabetes_total_including_undiagnosed
