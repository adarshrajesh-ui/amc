  - id: dementia_denominator_reconciliation
    outcome: dementia_all_cause
    metric: reconciliation_not_an_estimate
    value: null
    sex: male
    verification: {status: DERIVED_BY_THIS_SHARD, doi_resolves: null, pmid: null}
    problem: "Published US male dementia lifetime risk spans a factor of 3.6 across the five
      estimates in this file. Part of the spread is an artefact of DIFFERENT INDEX AGES,
      which this shard can remove, and the rest is ascertainment, which it cannot."
    method: "Each published estimate is conditional on being alive at its own index age.
      Multiplying by S(19 -> index), taken from lifetable_us_male_full.csv, puts them all on
      one unconditional-from-age-19 scale. This is the section 2 competing-mortality
      correction in competing_risk_method.md, applied to the literature instead of to a
      single incidence schedule. It IGNORES dementia arising before the index age, which is
      negligible for index ages 45+."
    survival_from_19_used:
      to_45: 0.9418
      to_55: 0.8943
      to_65: 0.7996
      to_70: 0.7274
    estimates_on_common_scale:
      - {study: "Chene 2015 (Framingham, men, clinical diagnosis)", index_age: 45,
         as_published_pct: 13.8, survival_factor: 0.9418, unconditional_from_19_pct: 13.0,
         pmid: "24418058"}
      - {study: "Seshadri 1997 (Framingham, men, remaining lifetime risk)", index_age: 65,
         as_published_pct: 10.9, survival_factor: 0.7996, unconditional_from_19_pct: 8.7,
         pmid: "9409336"}
      - {study: "Fishman 2017 (men, as cited by Hudomiet 2025, not retrieved first-hand)",
         index_age: 70, as_published_pct: 24.0, survival_factor: 0.7274,
         unconditional_from_19_pct: 17.5, pmid: null}
      - {study: "Hudomiet 2025 (HRS, men, derived from published female excess)",
         index_age: 70, as_published_pct: 37.8, survival_factor: 0.7274,
         unconditional_from_19_pct: 27.5, pmid: "40739976"}
      - {study: "Fang 2025 (ARIC, OVERALL not male-specific, active surveillance)",
         index_age: 55, as_published_pct: 35.0, survival_factor: 0.8943,
         unconditional_from_19_pct: 31.3, pmid: "39806070"}
    finding: "Putting them on a common index age narrows the range only from 3.6x to 3.6x
      (8.7% to 31.3%) - it does NOT resolve the disagreement. Index age is therefore NOT the
      main driver; ascertainment is."
    why_ascertainment_dominates: "Hudomiet et al. 2025 diagnose the mechanisms explicitly in
      their discussion, and every one of them biases DOWNWARD: (1) claims-based
      ascertainment misses undiagnosed dementia; (2) the widely used calibrated cutoff method
      underpredicts dementia prevalence at ages 85+ by 4.8 percentage points, validated
      against the ADAMS clinical substudy where their own model matched almost exactly
      (0.359 vs 0.358 observed, versus 0.310 for the cutoff method); (3) estimates based on
      status measured some months before death miss progression in the final months; and
      (4) older cohorts such as Framingham had LOWER life expectancy, so relatively more
      members died young at ages where dementia risk is low."
    recommendation: "Because all four identified biases point the same way, the low end of
      this range is more likely to be wrong than the high end. Use 20-30% as the central
      band for unconditional male dementia risk from age 19, and carry the full 9-31% as
      the uncertainty range rather than treating Chene's 13.8% as the point estimate. A
      neurodegeneration conclusion that flips sign or materially changes across that band
      is not a conclusion. NOTE: the survival multiplications and the male-level derivation
      in this block are THIS SHARD'S ARITHMETIC on published inputs, not published values."

