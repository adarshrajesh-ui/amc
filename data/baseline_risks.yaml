    bounds_by_horizon:
      by_age_50: {lower: 8, upper: 16, basis: "lower = NHANES diagnosed prevalence in
        ages 40-59 (12.1%) discounted toward the younger half of that band;
        upper = same prevalence plus the undiagnosed-then-diagnosed flow"}
      by_age_65: {lower: 18, upper: 28, basis: "lower = NHANES diagnosed prevalence at
        60+ (20.5%) minus post-65 accrual; upper = published lifetime risk minus the
        post-65 share of incidence"}
      by_age_80: {lower: 28, upper: 40, basis: "approaches the published lifetime risk
        from age 20 (32.8-40.2%), since diagnosed-diabetes incidence above 80 is small
        relative to the accumulated risk"}
    source: "NOT DIRECTLY PUBLISHED. Bounds constructed from Gwira 2024 (NCHS DB516)
      age-specific prevalence and Gregg 2014 / Koyama 2022 lifetime risk from age 20."
    doi_or_url: null
    year: null
    data_years: "2000-2023"
    population: "NHIS + NHANES, US adults"
    quote: null
    verification:
      status: DERIVED_BOUNDS
      doi_resolves: null
      pmid: null
    notes: "FLAGGED. No retrieved publication reports cumulative incidence of diabetes
      from age 20 at exactly ages 50, 65 and 80 for US males. Koyama 2022 Figure 1 shows
      lifetime risk by BASELINE age (18-60), which is the complement of what was asked
      (risk remaining, not risk accrued), and I could not extract the figure's underlying
      values. The bounds above are WIDE ON PURPOSE. The model must not treat them as
      published point estimates. RECOMMENDED HANDLING: do not use these bounds directly.
      Instead take the published lifetime risk from age 20 (32.8-40.2%) and distribute it
      over age using the NHANES age-specific prevalence shape, propagating the full width
      of the bounds as uncertainty."

  # -----------------------------------------------------------------------------------
  # 2. HYPERTENSION
  # -----------------------------------------------------------------------------------
  - id: hypertension_residual_lifetime_risk_age55_65
    outcome: hypertension
    metric: residual_lifetime_risk_unadjusted
    value: 90
    unit: percent
    ci: null
    se: null
    age_at_assessment: [55, 65]
    age_horizon: null
    sex: both
    competing_risk_adjusted: false
    definition: "Blood pressure >=140/90 mm Hg or use of antihypertensive medication
      (JNC-VI era definition). Residual lifetime risk explicitly NOT adjusted for
      competing causes of mortality."
    source: "Vasan RS, Beiser A, Seshadri S, Larson MG, Kannel WB, D'Agostino RB, Levy D.
      Residual lifetime risk for developing hypertension in middle-aged women and men:
      The Framingham Heart Study. JAMA. 2002;287(8):1003-1010."
    doi_or_url: "10.1001/jama.287.8.1003"
    year: 2002
    data_years: "1976-1998"
    population: "Framingham Heart Study, 1,298 participants aged 55-65 free of
      hypertension at baseline"
    quote: "The residual lifetime risks for developing hypertension and stage 1 high blood
      pressure or higher (greater-than-or-equal to 140/90 mm Hg regardless of treatment)
      were 90% in both 55- and 65-year-old participants."
    verification: {status: VERIFIED, doi_resolves: true, pmid: "11866648"}
    notes: "CRITICAL CAVEAT. The paper states in MAIN OUTCOME MEASURES: 'Residual lifetime
      risk (lifetime cumulative incidence not adjusted for competing causes of mortality)
      for hypertension'. This 90% is therefore a 1-Kaplan-Meier quantity and is NOT
      comparable to the competing-risk-adjusted lifetime risks elsewhere in this file.
      It is also not indexed at 19: it is the risk remaining for someone who reached 55
      still normotensive, i.e. a selected survivor. A 90% baseline also means hypertension
      is nearly SATURATED: applying any HR > 1 to a 90% risk is arithmetically almost
      inert (see hr_to_life_expectancy.py section E: HR 1.20 on a 0.90 baseline moves the
      risk only to 0.937, while naive multiplication gives an impossible 1.08). For a
      sleep model the informative hypertension outcome is AGE AT ONSET or blood pressure
      level, not lifetime incidence.
      The paper's other reported figure: lifetime probability of receiving
      antihypertensive medication = 60%."

