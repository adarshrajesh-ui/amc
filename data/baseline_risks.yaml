      40-59 . . . 752 55.9 (50.6-61.1) 2.4 / 60 and older . . . 1,237 72.7 (68.8-76.4) 1.7"
    verification: {status: VERIFIED, doi_resolves: null, pmid: "40085792"}
    notes: "CONTEMPORARY, US-representative, and the 18-39 band overlaps the subject's own
