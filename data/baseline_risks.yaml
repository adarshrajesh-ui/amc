    source: "Hafner M, Stepanek M, Taylor J, Troxel WM, van Stolk C. Why Sleep Matters -
      The Economic Costs of Insufficient Sleep: A Cross-Country Comparative Analysis. Rand
      Health Q. 2017;6(4):11. (RAND research report RR-1791.)"
    doi_or_url: "https://www.rand.org/pubs/research_reports/RR1791.html"
    year: 2017
    quote: "Insufficient Sleep Increases Mortality Risk by up to 13 Per Cent Investigating
      the link between sleep duration and mortality we find that at any given point in
      time, an individual that sleeps on average less than six hours per night has a 13 per
      cent higher mortality risk than an individual sleeping between seven and nine hours,
      which is considered as the healthy amount of sleep. Furthermore, an individual
      sleeping between six and seven hours per night has a 7 per cent higher mortality
      risk. . . . [The U.S.] sustains by far the highest annual economic loss (between $280
      billion and $411 billion currently, depending on the scenario) due to the size of its
      economy, followed by Japan (between $88 billion and $138 billion)."
    verification:
      status: VERIFIED
      doi_resolves: null
      pmid: "28983434"
      note: "rand.org blocks automated retrieval (HTTP 403); text retrieved from the
        PubMed Central copy of the Rand Health Q reprint, PMC5627640."
    methodology: "Macroeconomic (OECD-style, five countries) model. Mortality channel uses
      hazard ratios for short sleep taken from the published observational
      meta-analysis literature; productivity channel uses absenteeism and presenteeism
      from an employer survey. Output is GDP, not life expectancy."
    weaknesses:
      - "RAND DOES NOT PUBLISH A LIFE-EXPECTANCY OR QALY ESTIMATE. Its outputs are GDP,
        working days and employment. Anyone citing RAND for 'years of life lost to short
        sleep' is misciting it. Its only usable quantity for this project is the 13%
        (<6 h) and 7% (6-7 h) mortality risk elevation, which it imports from prior
        observational meta-analyses rather than estimating."
      - "The 13% figure is an association from adult cohorts, treated as causal in the
        macro model with no sensitivity analysis for reverse causation."
      - "Costs are for the whole adult working population, so they cannot be attributed to
        an individual, and productivity loss is not a health outcome."
      - "No adolescent or young-adult stratum at all."
    usefulness_here: "Use ONLY as an independent anchor on the size of the all-cause
      mortality hazard ratio for habitual short sleep: HR ~1.13 for <6 h, ~1.07 for 6-7 h.
      Fed through this shard's life table those imply -1.49 y and -0.82 y of e19
      respectively IF sustained for life from age 19 (hr_to_life_expectancy.py section A),
      and only -0.026 y and -0.014 y if confined to a 3-year window at ages 19-21
      (section B). The 57-fold gap between those two readings is the single most important
      modelling decision in the mortality channel."

